<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dicero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#05061a;font-family:'Nunito',sans-serif;color:#eef1ff;}
.layer{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:transparent;}
#f-round{z-index:1;}   /* the whole game: play area + map/shop boards in ONE 3D scene */
#trayhover{position:fixed;top:0;left:0;right:0;height:172px;z-index:15;pointer-events:none;}
#fsbtn{position:fixed;right:12px;bottom:12px;z-index:40;width:34px;height:34px;border:none;border-radius:9px;
  background:linear-gradient(180deg,#3a2a18ee,#241608ee);color:#ffd97a;font-size:17px;line-height:1;cursor:pointer;
  box-shadow:0 3px 8px #0007,inset 0 1px 0 #ffffff1c;display:flex;align-items:center;justify-content:center;
  transition:color .12s,transform .05s;}
#fsbtn:hover{color:#fff;}
#fsbtn:active{transform:translateY(1px);}
.ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;
  background:radial-gradient(150% 100% at 50% -10%,#24306a88,transparent 62%),linear-gradient(180deg,#1a2247,#0c1030 72%,#05061a);}
.ov.on{display:flex;}
.ov h1{font-family:'Fredoka';font-weight:700;font-size:52px;color:#ffd97a;text-shadow:0 3px 18px #000,0 0 34px #ffd97a44;}
.ov h1 small{display:block;font-size:14px;letter-spacing:.32em;color:#e9cfa0aa;margin-top:6px;}
.ov h1.bad{color:#ff8f8f;}
.ov p{max-width:440px;font-size:15px;line-height:1.55;color:#cdd8ff;}
.ov b{color:#ffd97a;}
.bigbtn{font-family:'Fredoka';font-weight:700;font-size:20px;cursor:pointer;border:none;border-radius:18px;padding:14px 34px;
  background:linear-gradient(180deg,#ffe08a,#e0a52a);color:#3a2600;box-shadow:0 6px 0 #8a6210,0 10px 20px #0008;}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6210,0 4px 8px #0008;}
.bigbtn.ghost{background:linear-gradient(180deg,#7a5330,#5a3c20 58%,#452c16);color:#ffe6c4;box-shadow:0 6px 0 #2a1a0e,0 10px 20px #0008;}
.bigbtn.ghost:active{box-shadow:0 2px 0 #2a1a0e,0 4px 8px #0008;}
/* compact confirmation popup — a small card over a light dim, not a full-screen takeover */
.popup{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:#04050f80;padding:20px;}
.popup.on{display:flex;}
.popup .card{background:linear-gradient(180deg,#2a1a0e,#1c1108);border:2px solid #c99a3f;border-radius:18px;
  width:min(330px,calc(100vw - 40px));max-width:330px;padding:22px 24px;text-align:center;box-shadow:0 18px 44px #000b,inset 0 1px 0 #ffffff14;}
.popup .card h2{font-family:'Fredoka';font-weight:700;font-size:21px;color:#ffd97a;margin:0 0 8px;}
.popup .card p{font-size:13px;line-height:1.5;color:#cdd8ff;margin:0 0 16px;}
.popup .card b{color:#ffd97a;}
.popup .pbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.popup .pbtns .bigbtn{font-size:14px;padding:10px 18px;border-radius:14px;}
/* ---- wooden card tray ---- */
#cardtray{position:fixed;top:0;left:0;right:0;height:176px;z-index:16;
  background:linear-gradient(180deg,#7a5330,#5a3c20 58%,#452c16);
  box-shadow:0 12px 28px #000a,inset 0 -5px 12px #0007,inset 0 2px 0 #ffffff16;
  border-bottom:7px solid #c99a3f;transform:translateY(0);
  transition:transform .42s cubic-bezier(.2,1,.3,1);display:flex;align-items:center;}
#cardtray.hidden{display:none;}
#cardtray::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.15;
  background:repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 54px);}
#cardtray.retract{transform:translateY(-148px);}
#traycards{position:relative;z-index:2;flex:1;display:flex;gap:12px;align-items:center;justify-content:center;padding:12px 22px;flex-wrap:wrap;}
#traycards .empty{font-family:'Fredoka';font-weight:600;color:#e9cfa0;opacity:.7;font-size:14px;}
.tcard{width:96px;aspect-ratio:5/7;border-radius:12px;background:#12142c;overflow:hidden;position:relative;cursor:pointer;
  box-shadow:0 4px 0 var(--fr,#2a3a7a),0 8px 16px #0008;transition:transform .12s;display:flex;flex-direction:column;}
.tcard:hover{transform:translateY(-9px) scale(1.05);}
.tcard.common{--fr:#2a5a3a;} .tcard.rare{--fr:#2a3a7a;} .tcard.fabled{--fr:#8a5a1e;}
.tcard .te{height:44%;display:flex;align-items:center;justify-content:center;font-size:34px;filter:drop-shadow(0 2px 3px #000a);}
.tcard .tn{font-family:'Fredoka';font-weight:700;font-size:11px;color:#fff;text-align:center;padding:0 4px;line-height:1.03;}
.tcard .td{font-size:8.5px;font-weight:700;color:#dfe4f4;text-align:center;padding:3px 5px;line-height:1.2;flex:1;}
.tcard .eb{position:absolute;top:3px;left:3px;font-size:9px;font-weight:800;font-family:'Fredoka';color:#1a1020;padding:1px 5px;border-radius:7px;}
/* ---- persistent joker rail (left, above every scene) ---- */
#jokerRail{display:none !important;position:fixed;left:10px;top:56px;z-index:22;flex-direction:column;gap:8px;
  align-items:flex-start;pointer-events:none;perspective:1100px;}
.jk{position:relative;height:calc((100vh - 100px)/5);aspect-ratio:5/7;width:auto;border-radius:14px;overflow:hidden;
  flex:0 0 auto;pointer-events:auto;cursor:grab;transform-style:preserve-3d;background:var(--ld,#12142c);
  transform:rotateX(30deg);transform-origin:center 82%;
  box-shadow:0 4px 0 var(--fr,#2a3a7a),0 8px 18px #0009;transition:transform .18s ease-out, box-shadow .16s;}
.jk.drag{cursor:grabbing;z-index:80;box-shadow:0 16px 32px #000c,0 0 0 2px #ffffff55;transition:box-shadow .16s;}
.jk .lav{position:absolute;inset:0;filter:blur(7px) saturate(1.2);}
.jk .bl{position:absolute;border-radius:50%;mix-blend-mode:screen;}
.jk .l1{width:92%;height:62%;left:-12%;top:-8%;background:radial-gradient(circle,var(--l1),transparent 66%);}
.jk .l2{width:86%;height:70%;right:-14%;top:12%;background:radial-gradient(circle,var(--l2),transparent 64%);}
.jk .l3{width:96%;height:60%;left:-6%;bottom:-12%;background:radial-gradient(circle,var(--l3),transparent 64%);}
.jk .frm{position:absolute;inset:0;border-radius:14px;border:2px solid var(--fr,#2a3a7a);z-index:4;pointer-events:none;}
.jk .ic{position:relative;z-index:2;height:28%;display:flex;align-items:center;justify-content:center;
  font-size:min(3.2vh,26px);filter:drop-shadow(0 2px 4px #000a);}
.jk .bx{position:relative;z-index:2;margin:0 6px 7px;padding:6px 8px;border-radius:10px;
  background:linear-gradient(180deg,#0b1030e6,#080a1ff7);display:flex;flex-direction:column;gap:4px;}
.jk .nm{font-family:'Fredoka';font-weight:700;font-size:clamp(13px,1.9vh,17px);line-height:1.04;color:#fff;}
.jk .ds{font-size:clamp(11px,1.6vh,15px);line-height:1.24;color:#eef0ff;font-weight:700;}
.jk .rt{position:absolute;top:6px;right:8px;z-index:5;font-family:'Fredoka';font-weight:700;font-size:9px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--rc,#8aa0d0);text-shadow:0 1px 2px #000;}
.jk .eb{position:absolute;top:6px;left:6px;z-index:5;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#1a1020;box-shadow:0 1px 4px #0008;}
.jk .glare{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:14px;opacity:0;
  mix-blend-mode:soft-light;transition:opacity .18s;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,40%),rgba(255,255,255,.85),rgba(255,255,255,.15) 34%,transparent 60%);}
.jk.hot .glare{opacity:1;}
/* ---- Pickle Game Library: player chip + Exit Game ---- */
#gl-player-chip{position:fixed;top:12px;left:12px;z-index:900;align-items:center;gap:7px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;letter-spacing:.02em;color:#ffe6c4;
  background:linear-gradient(180deg,#7a5330e0,#452c16e0);border:1.5px solid #c99a3f99;border-radius:999px;
  padding:5px 13px 5px 10px;opacity:.78;pointer-events:none;
  box-shadow:0 3px 10px #0008,inset 0 1px 0 #ffffff1c;}
/* right:62px keeps this clear of the game's own 🔊 music toggle, which is fixed at right:14px/top:14px (38px wide) */
#gl-exit-btn{position:fixed;top:14px;right:62px;z-index:900;border:none;cursor:pointer;
  height:38px;display:flex;align-items:center;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.03em;
  padding:0 14px;border-radius:11px;color:#ffd0c0;opacity:.7;
  background:linear-gradient(180deg,#5e2420ee,#38130fee);
  box-shadow:0 3px 8px #0007,inset 0 1px 0 #ffffff1a;transition:opacity .14s,color .14s,transform .05s;}
#gl-exit-btn:hover{opacity:1;color:#fff;}
#gl-exit-btn:active{transform:translateY(1px);}
#gl-exit-confirm{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;
  background:#04050fb0;padding:20px;}
#gl-exit-confirm .glx-panel{background:linear-gradient(180deg,#2a1a0e,#1c1108);border:2px solid #c99a3f;
  border-radius:18px;width:min(340px,calc(100vw - 40px));padding:22px 24px;text-align:center;
  box-shadow:0 18px 44px #000b,inset 0 1px 0 #ffffff14;}
#gl-exit-confirm .glx-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:21px;color:#ffd97a;margin:0 0 8px;}
#gl-exit-confirm .glx-body{font-size:13px;line-height:1.5;color:#cdd8ff;margin:0 0 16px;}
#gl-exit-confirm .glx-body b{color:#ffd97a;}
#gl-exit-confirm .glx-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
#gl-exit-confirm .glx-row .bigbtn{font-size:14px;padding:10px 18px;border-radius:14px;}
</style>
</head>
<body>
  <iframe id="f-round" class="layer" allow="autoplay"></iframe>
  <div id="trayhover"></div>
  <div id="jokerRail"></div>
  <button id="fsbtn" title="Toggle fullscreen">⛶</button>

  <!-- ===== Pickle Game Library: player chip (main menu only) + Exit Game ===== -->
  <div id="gl-player-chip" style="display:none"></div>
  <button id="gl-exit-btn" title="Exit Game">✕ Exit Game</button>
  <div id="gl-exit-confirm" style="display:none">
    <div class="glx-panel">
      <div class="glx-title">Exit Game?</div>
      <div class="glx-body">Your run is auto-saved at the last stage — <b>Continue</b> picks it back up.</div>
      <div class="glx-row">
        <button id="gl-exit-yes" class="bigbtn">Exit</button>
        <button id="gl-exit-no" class="bigbtn ghost">Cancel</button>
      </div>
    </div>
  </div>


  <div class="ov" id="ov-over">
    <h1 class="bad">The Dice Went Cold</h1>
    <p id="overText"></p>
    <button class="bigbtn" id="restartBtn">New Run</button>
  </div>
  <div class="popup" id="ov-newrun">
    <div class="card">
      <h2>Start a New Run?</h2>
      <p>A saved run is in progress. Starting a new run will <b>overwrite</b> it — this can't be undone.</p>
      <div class="pbtns">
        <button class="bigbtn" id="newrunYes">Start New Run</button>
        <button class="bigbtn ghost" id="newrunNo">Keep Playing</button>
      </div>
    </div>
  </div>

<script id="tpl-round" type="text/html"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dicero — Rework Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"><\/script>
<style>
  #app.hideui > *:not(#scene):not(#liquidbg){display:none!important;}
  :root{
    --night:#1b2447; --night2:#121736;
    --parch:#f7ecd7; --parch2:#eddcbd; --ink:#3a2c1c; --ink2:#6b5335;
    --wood:#8a5a32; --wood2:#5d3116; --brass:#c99a3f; --brass2:#ffd97a;
    --dblue:#4f8df7; --dred:#f75f5f; --dgreen:#5fce7c; --dpurple:#b06df7;
    --mana:#5fd0f0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--night2);
    font-family:'Nunito',sans-serif;color:var(--ink);user-select:none;}
  #app{position:fixed;inset:0;background:#001010;}
  canvas#liquidbg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;}
  canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;}

  /* soft plaques */
  #hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;gap:8px;padding:10px 12px;pointer-events:none;}
  .plaque{background:linear-gradient(180deg,var(--parch),var(--parch2));border:none;border-radius:18px;
    padding:7px 12px;flex:1;box-shadow:0 4px 0 #00000038,0 10px 22px #0007;}
  .plaque .lab{font-family:'Fredoka';font-weight:600;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);}
  .plaque .val{font-family:'Fredoka';font-weight:700;font-size:19px;color:var(--ink);line-height:1.1;}
  .plaque.req .val{color:#b3541e;} .plaque.score .val{color:#2e7d32;} .plaque.gold .val{color:#a4780a;}

  #manabar{display:none !important;position:absolute;top:66px;left:50%;transform:translateX(-50%);z-index:19;gap:6px;
    padding:6px 14px;background:#10142ecc;border-radius:999px;box-shadow:0 6px 16px #0007;}
  .orb{width:16px;height:16px;border-radius:50%;background:#243055;box-shadow:inset 0 2px 4px #0008;}
  .orb.full{background:radial-gradient(circle at 35% 30%,#bdeeff,var(--mana) 60%,#1e7fa0);box-shadow:0 0 10px #5fd0f0aa;}
  #roundtag{position:absolute;top:70px;left:14px;z-index:19;font-family:'Fredoka';font-weight:700;font-size:13px;
    color:var(--brass2);text-shadow:0 1px 3px #000;}

  /* cascade */
  #cascade{position:absolute;left:12px;top:104px;z-index:18;width:240px;max-height:44vh;overflow:hidden;
    pointer-events:none;display:flex;flex-direction:column;gap:6px;}
  .cas{background:linear-gradient(180deg,var(--parch),var(--parch2));border:none;border-radius:16px;
    padding:7px 11px;box-shadow:0 4px 0 #00000030,0 8px 14px #0006;
    animation:casin .28s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes casin{from{opacity:0;transform:translateX(-24px) scale(.9)}to{opacity:1;transform:none}}
  .cas .cn{font-family:'Fredoka';font-weight:700;font-size:14px;color:var(--ink);}
  .cas .cm{font-family:'Fredoka';font-weight:600;font-size:13px;}
  .cas .cm .p{color:#3a78d6;} .cas .cm .m{color:#e04848;} .cas .cm .t{color:#2e7d32;}

  /* ---- count cinematic: per-combo tally panels ---- */
  #tally{position:absolute;inset:0;z-index:30;pointer-events:none;display:none;}
  .tpanel{position:absolute;transform:translate(-50%,-50%);min-width:118px;text-align:center;
    background:linear-gradient(180deg,#fbf1d8,#e9d6ae);border-radius:14px;padding:6px 12px 8px;
    box-shadow:0 5px 0 #00000033,0 10px 22px #0008;opacity:.85;transition:opacity .18s,box-shadow .18s,transform .18s;}
  .tpanel.live{opacity:1;box-shadow:0 0 0 2px #ffd97a,0 6px 0 #00000033,0 12px 26px #000a;}
  .tpanel.done{opacity:.96;}
  .tpanel.hit{animation:panhit .2s cubic-bezier(.2,1.6,.4,1);}
  .tpanel.hitbig{animation:panhitbig .26s cubic-bezier(.2,1.8,.4,1);}
  @keyframes panhit{0%{transform:translate(-50%,-50%) scale(1);}35%{transform:translate(-50%,-50%) scale(1.09);}100%{transform:translate(-50%,-50%) scale(1);}}
  @keyframes panhitbig{0%{transform:translate(-50%,-50%) scale(1);}30%{transform:translate(-50%,-50%) scale(1.2) rotate(-1.6deg);}100%{transform:translate(-50%,-50%) scale(1);}}
  .tpanel .tnm{font-family:'Fredoka';font-weight:700;font-size:12px;color:#5a3f14;line-height:1.1;white-space:nowrap;}
  .tpanel .teq{font-family:'Fredoka';font-weight:800;font-size:22px;line-height:1.15;margin-top:1px;}
  .tpanel .teq .tp{color:#2f6fd6;} .tpanel .teq .tx{color:#8a6a24;margin:0 3px;font-size:16px;} .tpanel .teq .tm{color:#e0402e;}
  .tpanel .tsub{font-family:'Fredoka';font-weight:800;font-size:15px;color:#2e7d32;min-height:2px;}
  #tallytotal{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:31;display:none;
    font-family:'Fredoka';font-weight:800;font-size:40px;color:#ffe08a;
    text-shadow:0 3px 0 #7a5410,0 4px 18px #000,0 0 26px #ffd97a66;transition:transform .16s;}
  #tallytotal.bump{transform:translateX(-50%) scale(1.16);}
  #tallytotal.final{font-size:64px;transform:translateX(-50%) scale(1.1);text-shadow:0 4px 0 #7a5410,0 6px 26px #000,0 0 44px #ffd97aaa;}
  #tallytotal.void{color:#ff8f8f;text-shadow:0 3px 0 #5a1414,0 4px 18px #000;}
  #skiphint{position:fixed;right:14px;bottom:150px;z-index:31;display:none;pointer-events:none;
    font-family:'Fredoka';font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#e9cfa0aa;text-shadow:0 1px 3px #000;}
  #cinebtns{position:fixed;left:0;right:0;bottom:22px;z-index:34;display:none;justify-content:center;gap:14px;pointer-events:none;}
  #cinebtns.on{display:flex;}
  #cinebtns button{pointer-events:auto;font-family:'Fredoka';font-weight:700;font-size:17px;color:#fff;cursor:pointer;
    border:none;border-radius:16px;padding:12px 30px;text-shadow:0 1px 0 #0006;box-shadow:0 5px 0 #0008,0 10px 20px #0008;
    transition:transform .07s,opacity .15s;}
  #cinebtns button:active{transform:translateY(3px);}
  #cineSkip{background:linear-gradient(180deg,#8a93b8,#4a5378);}
  #cineNext{background:linear-gradient(180deg,#ffd23f,#e09c1a);color:#4a3000;text-shadow:0 1px 0 #fff5;}
  #cinebtns button[hidden]{display:none;}
  /* colored firework lines off a die when its colour / enhancement fires */
  .spark{position:absolute;width:4px;border-radius:3px;pointer-events:none;z-index:33;transform-origin:50% 50%;
    will-change:transform,opacity;animation:sparkfly .6s ease-out forwards;}
  @keyframes sparkfly{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) translateY(-3px) scaleY(.35);}
    20%{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot)) translateY(calc(var(--d) * -0.6)) scaleY(1);}
    100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) translateY(calc(var(--d) * -1.15)) scaleY(.45);}}
  /* full-screen impact flash on the cast finale */
  #flashfx{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:0;
    background:radial-gradient(circle at 50% 46%,#fff2c8,#ffd97a66 55%,transparent 80%);}
  #flashfx.on{animation:flashpop .32s ease-out forwards;}
  @keyframes flashpop{0%{opacity:.95;}100%{opacity:0;}}
  /* escalating score pops: gold glow → on fire as the multiplier climbs */
  .pop.t1,.flypop.t1{text-shadow:0 2px 6px #000,0 0 15px #ffd97a,0 0 4px #fff3;}
  .pop.t2,.flypop.t2{text-shadow:0 2px 6px #000,0 0 16px #ffb03a,0 0 34px #ff5a00,0 0 5px #fff5;}
  /* count numbers pop OUT of the die/card, then fly into the combo panel */
  .flypop{position:absolute;z-index:34;font-family:'Fredoka';font-weight:700;pointer-events:none;
    text-shadow:0 3px 8px #000,0 0 12px #0008;animation:flyp .85s cubic-bezier(.32,.55,.45,1) forwards;}
  @keyframes flyp{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}
    14%{opacity:1;transform:translate(-50%,-50%) scale(1.9);}     /* BIG burst out of the piece */
    34%{opacity:1;transform:translate(-50%,-50%) scale(1.55);}    /* hangs there, huge and readable */
    48%{opacity:1;transform:translate(-50%,-50%) scale(1.45);}
    100%{opacity:.1;transform:translate(calc(-50% + var(--fx,0px)),calc(-50% + var(--fy,-60px))) scale(.5);}}
  /* round-win confetti + coin rain */
  .confet{position:absolute;top:-5vh;z-index:66;pointer-events:none;border-radius:3px;
    animation:confall var(--cd,2.2s) cubic-bezier(.25,.45,.6,1) forwards;}
  .confet.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0bc,#e0a52a 62%,#8a5a10);

  .gcard.owned .ds{font-size:13px;}
  .gcard.canreplace{animation:repPulse 1s ease-in-out infinite;box-shadow:0 4px 0 var(--fr),0 0 22px #ffd97acc;}
  .gcard .ebadge{position:absolute;top:8px;left:8px;z-index:5;font-family:'Fredoka';font-weight:700;font-size:11px;
    color:#1a1020;padding:3px 9px;border-radius:999px;box-shadow:0 2px 5px #0008;}

  /* NEGATIVE enchant on a card — jet-black body (veil behind icon+text) with a silver sheen sweeping on top.
     Ported from the Card Library's .enh-negative. A Negative card takes up no slot. */
  .gcard.enh-negative{box-shadow:0 5px 0 var(--fr,#2a5a3a),0 12px 24px #0008,0 0 22px #ffffff88;}
  .gcard.enh-negative .lava{filter:blur(7px) saturate(.1) brightness(.26);}
  .gcard.enh-negative::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:inherit;
    background:linear-gradient(180deg,rgba(6,7,12,.84),rgba(1,1,3,.93));animation:negBreathe 2.6s ease-in-out infinite;}
  .gcard.enh-negative::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;mix-blend-mode:screen;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.8) 50%,transparent 60%);
    background-size:280% 100%;opacity:.22;animation:negSweep 3.6s ease-in-out infinite;}
  @keyframes negBreathe{0%,100%{opacity:.82}50%{opacity:.97}}
  @keyframes negSweep{0%,100%{background-position:150% 0}50%{background-position:-50% 0}}
  .gcard.enh-negative .em{filter:drop-shadow(0 2px 4px #000a) drop-shadow(0 0 12px #ffffff);}
  .gcard.enh-negative .ebadge{background:linear-gradient(90deg,#0a0a0a,#f4f4f4,#0a0a0a,#f4f4f4);background-size:250% 100%;
    color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;animation:negBadge 2.2s linear infinite;box-shadow:0 2px 7px #000a,inset 0 0 6px #ffffffcc;}
  @keyframes negBadge{0%{background-position:0 0}50%{background-position:100% 0}100%{background-position:0 0}}

  /* enchant wheel */
  #shopHud #wheelWrap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:26;display:flex;flex-direction:column;
    align-items:center;gap:14px;transition:transform .55s cubic-bezier(.2,1,.3,1),opacity .4s;opacity:0;pointer-events:none;}
  #shopHud #wheelWrap.in{opacity:1;pointer-events:auto;}
  #shopHud #wheelWrap.away{transform:translate(-50%,-160%);}
  #shopHud #wheelWrap.down{transform:translate(-50%,26vh);}
  #shopHud #wheelBox{position:relative;width:min(580px,88vmin);aspect-ratio:1;}
  #shopHud #wheelCv{width:100%;height:100%;border-radius:50%;box-shadow:0 14px 40px #000b,0 0 0 8px #2a1a0e,0 0 0 11px #c99a3f;}
  #shopHud #wheelPtr{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;z-index:3;
    border-left:16px solid transparent;border-right:16px solid transparent;border-top:26px solid #ffd257;
    filter:drop-shadow(0 3px 4px #000a);}
  #shopHud #wheelBtns{display:flex;gap:12px;}
  @keyframes repPulse{0%,100%{outline:2px solid #ffd97a55}50%{outline:3px solid #ffd97aee}}
#shopHud #skipBtn{pointer-events:auto;}
#shopHud #leaveConfirm.on{pointer-events:auto;}
</style>
</head>
<body>
<div id="app" class="hideui"><!-- starts hidden: only the 3D scene shows until the menu/round is up (no legacy-screen flash) -->
  <canvas id="liquidbg"></canvas>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="plaque req"><div class="lab">Points to Pass</div><div class="val" id="s-req">—</div></div>
    <div class="plaque score"><div class="lab">Score</div><div class="val" id="s-score">0</div></div>
    <div class="plaque"><div class="lab">Casts</div><div class="val" id="s-casts">3</div></div>
    <div class="plaque"><div class="lab">Re-rolls</div><div class="val" id="s-rerolls">2</div></div>
    <div class="plaque gold"><div class="lab">Gold</div><div class="val" id="s-gold">4</div></div>
  </div>

  <div id="cascade"></div>
  <div id="cards"></div>
  <div id="jokerPanel"></div>
  <div id="tally"></div>
  <div id="tallytotal"></div>

  <div id="hint">Roll your dice!</div>

  <div id="ctrl">
    <button class="btn roll" id="b-roll">ROLL<span class="sub">throw the dice</span></button>
    <button class="btn reroll" id="b-reroll" disabled>RE-ROLL<span class="sub" id="b-reroll-sub">hold up to 5</span></button>
    <button class="btn cast" id="b-cast" disabled>CAST!<span class="sub">score all combos</span></button>
  </div>

  <!-- legacy title/menu (ov-title, "ROLL IN") removed — the game boots straight into the 3D main menu -->

  <div class="overlay hidden" id="ov-shop">
    <div class="shophead">Round cleared! ⭐</div>
    <div class="starline" id="shop-earn"></div>

  <div class="overlay hidden" id="ov-end">
    <div class="bigtitle">BUSTED!<span class="sub" id="end-sub">THE DICE WERE COLD</span></div>

</div>

<div id="mapHud" class="coverHud">
  <div class="hud" id="top">
    <div class="title">The Floor<small>Ante 1 · choose your path</small></div>
    <div class="rightcol">
      <div class="plate"><span class="glab">Gold</span><span class="gval" id="gold">100</span></div>
    </div>
  </div>
  <div class="hud" id="info"></div>
  <div id="toast"></div>
</div>
<div id="shopHud" class="coverHud">
  <div class="hud" id="top"><div class="title">The Emporium<small>Spend your gold · then return to the roll</small></div>
    <div class="plate"><span class="glab">Gold</span><span class="gval" id="gold">100</span></div></div>
  <div class="hud" id="info"></div>
  <canvas id="zap"></canvas>
  <div id="ownedCards"></div>
  <div id="choiceCards"></div>
  <div id="prompt"></div>
  <button id="skipBtn">Skip</button>
  <button id="sellBtn" class="cbtn wood">Sell Cards</button>
  <div id="wheelWrap">
    <div id="wheelBox"><div id="wheelPtr"></div><canvas id="wheelCv" width="640" height="640"></canvas></div>
    <div id="wheelBtns"><button class="cbtn gold" id="spinBtn">Spin · 25 gold</button><button class="cbtn wood" id="wheelLeave">Leave</button></div>
  </div>

    <div class="lc-btns"><button class="cbtn wood" id="lcStay">Stay</button><button class="cbtn gold" id="lcGo">Leave →</button></div>
  </div></div>
  <div class="popup" id="sellConfirm">
    <div class="card">
      <h2>Sell this card?</h2>
      <p id="sellConfirmText">Sell <b>this card</b> for <b>+3 gold</b>? This can't be undone.</p>
      <div class="pbtns">
        <button class="bigbtn" id="sellYes">Sell · +3 gold</button>
        <button class="bigbtn ghost" id="sellNo">Keep</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   Dicero — v0.4 rework prototype
   Two-phase turn: ROLL (hold≤3, reroll) → SCORE (deterministic Cast)
============================================================================ */

// ------------ animated magma/aurora background (its own WebGL layer, behind the whole game) ------------
(function(){
  const lc=document.getElementById('liquidbg'); if(!lc)return;
  let gl=null; try{ gl=lc.getContext('webgl',{antialias:false,alpha:false})||lc.getContext('experimental-webgl',{antialias:false,alpha:false}); }catch(e){}
  // ---- palette maths: build a 4-stop liquid colour ramp from a single base hue ----
  function hsl(h,s,l){ h=(h%1+1)%1; const a=s*Math.min(l,1-l);
    const f=n=>{ const k=(n+h*12)%12; return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1))); };
    return [f(0),f(8),f(4)]; }
  function paletteFor(hue){ return [           // shadow -> deep -> bright -> crest
    hsl(hue,0.85,0.05), hsl(hue,0.85,0.24), hsl(hue+0.02,0.80,0.52), hsl(hue+0.05,0.30,0.90) ]; }
  // one distinct hue per floor; floor 1 stays close to the original emerald. Loops after the list.
  const FLOOR_HUES=[0.42,0.02,0.58,0.80,0.68,0.12,0.93,0.50,0.33,0.86];
  function floorHue(n){ n=Math.max(1,n|0); return FLOOR_HUES[(n-1)%FLOOR_HUES.length]; }
  let MODE='menu', menuHue=FLOOR_HUES[0];      // 'menu' = constant slow fade · 'floor' = fixed colour per floor
  // ---- CSS fallback (no WebGL): recolour the #app gradient, still fades in the menu ----
  const fallback=()=>{
    let fhue=menuHue, flast=performance.now();
    const paint=h=>{ try{ const c1=hsl(h,0.7,0.15).map(x=>Math.round(x*255)), c2=hsl(h,0.85,0.05).map(x=>Math.round(x*255));
      document.getElementById('app').style.background='radial-gradient(130% 95% at 50% 118%,rgb('+c1[0]+','+c1[1]+','+c1[2]+'),rgb('+c2[0]+','+c2[1]+','+c2[2]+') 60%,#000410)'; }catch(_){}};
    window.LIQUID={ setMenu(on){ MODE=on?'menu':'floor'; }, setFloor(n){ MODE='floor'; fhue=floorHue(n); } };
    (function floop(){ const now=performance.now(); let dt=(now-flast)/1000; flast=now; if(dt>0.1)dt=0.1;
      if(MODE==='menu'){ menuHue=(menuHue+dt*0.025)%1; fhue=menuHue; } paint(fhue); requestAnimationFrame(floop); })();
  };
  if(!gl){ fallback(); return; }
  const vsSrc='attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
  const fsSrc=`precision highp float;
    uniform vec2 u_res;uniform float u_time;
    uniform vec3 u_c0;uniform vec3 u_c1;uniform vec3 u_c2;uniform vec3 u_c3;   // liquid ramp: shadow -> crest, set per floor / by the menu fade
    float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
    float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);
      float a=hash(i);float b=hash(i+vec2(1.0,0.0));float c=hash(i+vec2(0.0,1.0));float d=hash(i+vec2(1.0,1.0));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
    float fbm(vec2 p){float v=0.0;float amp=0.5;mat2 rot=mat2(0.8,0.6,-0.6,0.8);
      for(int i=0;i<6;i++){v+=amp*noise(p);p=rot*p*2.0+0.03;amp*=0.5;}return v;}
    float height(vec2 p,float a){vec2 m1=vec2(sin(a),cos(a));vec2 m2=vec2(cos(a),-sin(a));
      vec2 q=vec2(fbm(p+m1),fbm(p+vec2(5.2,2.8)+m2));
      vec2 r=vec2(fbm(p+4.0*q+vec2(1.7,9.2)+m2*0.9),fbm(p+4.0*q+vec2(8.3,2.8)-m1*0.7));
      return fbm(p+4.0*r)*0.7+length(r)*0.5;}
    void main(){
      vec2 uv=gl_FragCoord.xy/u_res.xy;
      vec2 sc=uv*2.0-1.0; sc.x*=u_res.x/u_res.y;
      float a=u_time*(6.2831853/40.0);
      float persp=1.0/(1.0-clamp(sc.y,-0.98,0.98)*0.55);   // board tilt / foreshortening
      vec2 board=vec2(sc.x*persp,sc.y*persp)*1.6;
      float eps=0.012;
      float f=height(board,a);
      float fx=height(board+vec2(eps,0.0),a);
      float fy=height(board+vec2(0.0,eps),a);
      float heat=clamp(f,0.0,1.0);
      vec3 N=normalize(vec3(-(fx-f)/eps*0.07, 0.97-(fy-f)/eps*0.07, 0.24));   // soft fluid normal
      vec3 col;
      col=mix(u_c0,u_c1,smoothstep(0.0,0.45,heat));
      col=mix(col,u_c2,smoothstep(0.45,0.78,heat));
      col=mix(col,u_c3,smoothstep(0.78,1.0,heat));
      vec3 Lkey=normalize(vec3(-0.30,0.84,0.46));           // warm-white key light, upper-left/front
      float keyD=max(dot(N,Lkey),0.0);
      vec3 keyCol=vec3(1.0,0.96,0.9)*(0.7+0.5*keyD);
      vec2 lampPos=vec2(0.62,0.5);                          // gold point accent, upper-right, pulsing
      float lampDist=length(sc-lampPos);
      float goldPulse=0.75+0.35*sin(a*3.0);
      float goldF=goldPulse/(1.0+lampDist*lampDist*5.5);
      vec3 goldCol=vec3(1.0,0.72,0.28)*goldF;
      vec2 lamp2Pos=vec2(-0.7,0.35);                        // blue point accent, left/behind
      float lamp2Dist=length(sc-lamp2Pos);
      float blueF=0.6/(1.0+lamp2Dist*lamp2Dist*5.5);
      vec3 blueCol=vec3(0.3,0.5,1.0)*blueF;
      vec3 lit=col*keyCol+col*goldCol+col*blueCol;
      lit+=col*pow(heat,2.5)*0.6;
      lit*=mix(1.0,0.72,smoothstep(0.2,1.0,uv.y));
      float vig=smoothstep(1.75,0.55,length(sc)); lit*=0.72+0.28*vig;   // gentle vignette (was a CSS overlay in the source)
      gl_FragColor=vec4(lit,1.0);
    }`;
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;};
  const prog=gl.createProgram();
  gl.attachShader(prog,mk(gl.VERTEX_SHADER,vsSrc));
  gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,fsSrc));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ fallback(); return; }
  gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes=gl.getUniformLocation(prog,'u_res'),uTime=gl.getUniformLocation(prog,'u_time');
  const uC=[gl.getUniformLocation(prog,'u_c0'),gl.getUniformLocation(prog,'u_c1'),gl.getUniformLocation(prog,'u_c2'),gl.getUniformLocation(prog,'u_c3')];
  // current shown palette (lerps toward the target); target set by menu fade / floor changes
  let cur=paletteFor(FLOOR_HUES[0]).map(c=>c.slice()), tgt=paletteFor(FLOOR_HUES[0]);
  window.LIQUID={
    setMenu(on){ MODE=on?'menu':'floor'; },                       // menu: constantly drift through colours
    setFloor(n){ MODE='floor'; tgt=paletteFor(floorHue(n)); },    // floor: ease to this floor's colour and hold
  };
  const SCALE=0.6;   // heavier shader (domain-warp + normals) — render below native res to stay cheap next to the 3D scene
  function resize(){ const w=Math.max(2,Math.floor((lc.clientWidth||window.innerWidth)*SCALE)),
    h=Math.max(2,Math.floor((lc.clientHeight||window.innerHeight)*SCALE));
    if(lc.width!==w||lc.height!==h){ lc.width=w; lc.height=h; } gl.viewport(0,0,lc.width,lc.height); }
  resize(); window.addEventListener('resize',resize);
  const start=performance.now(); let lastT=start;
  (function loop(){ try{ const now=performance.now(); let dt=(now-lastT)/1000; lastT=now; if(dt>0.1)dt=0.1;
    if(MODE==='menu'){ menuHue=(menuHue+dt*0.025)%1; tgt=paletteFor(menuHue); }   // ~40s per full colour cycle
    const k=Math.min(1,dt*0.7);                                                    // smooth cross-fade (~1.5s settle)
    for(let i=0;i<4;i++){ const c=cur[i],t=tgt[i]; c[0]+=(t[0]-c[0])*k; c[1]+=(t[1]-c[1])*k; c[2]+=(t[2]-c[2])*k; gl.uniform3f(uC[i],c[0],c[1],c[2]); }
    resize(); gl.uniform2f(uRes,lc.width,lc.height); gl.uniform1f(uTime,(now-start)/1000);
    gl.drawArrays(gl.TRIANGLES,0,3); }catch(e){} requestAnimationFrame(loop); })();
})();

// ------------ audio ------------
// Layered WebAudio synth engine: master gain -> compressor -> speakers, with a
// generated-impulse reverb send so everything sits in the same "room".
const Sfx=(()=>{ let ctx=null,master=null,comp=null,verb=null,wet=null,noiseBuf=null,enabled=true;
  const c=()=>{ if(!ctx){ try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-16; comp.knee.value=18; comp.ratio.value=5; comp.attack.value=.002; comp.release.value=.18;
      master=ctx.createGain(); master.gain.value=enabled?1:0;
      comp.connect(master); master.connect(ctx.destination);
      // small room: 0.9s exponentially-decaying noise impulse
      verb=ctx.createConvolver();
      const vlen=Math.floor(ctx.sampleRate*.9), imp=ctx.createBuffer(2,vlen,ctx.sampleRate);
      for(let ch=0;ch<2;ch++){ const d=imp.getChannelData(ch);
        for(let i=0;i<vlen;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/vlen,2.6); }
      verb.buffer=imp; wet=ctx.createGain(); wet.gain.value=.16; verb.connect(wet); wet.connect(comp);
      // shared 1s white-noise buffer
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
      const nd=noiseBuf.getChannelData(0); for(let i=0;i<ctx.sampleRate;i++) nd[i]=Math.random()*2-1;
    }catch(e){} }
    if(ctx&&ctx.state==='suspended'){ try{ctx.resume();}catch(e){} }
    return ctx; };
  window.addEventListener('pointerdown',()=>{const a=c(); if(a&&a.state==='suspended')a.resume().catch(()=>{});},{passive:true});
  // tone: oscillator voice. o={type,f,f2,d,g,at,dl,send,curve}
  function tone(o){ const a=c(); if(!a||!enabled)return;
    const T=a.currentTime+(o.dl||0), d=o.d||.15;
    const os=a.createOscillator(),ga=a.createGain();
    os.type=o.type||'triangle'; os.frequency.setValueAtTime(o.f,T);
    if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),T+d*(o.curve||1));
    ga.gain.setValueAtTime(0,T); ga.gain.linearRampToValueAtTime(o.g||.1,T+(o.at||.008));
    ga.gain.exponentialRampToValueAtTime(.0001,T+d);
    os.connect(ga); ga.connect(comp); if(o.send!==0){const s=a.createGain();s.gain.value=(o.send!=null?o.send:.5);ga.connect(s);s.connect(verb);}
    os.start(T); os.stop(T+d+.05); }
  // hiss: filtered noise voice. o={d,g,ft,f,f2,q,at,dl,send}
  function hiss(o){ const a=c(); if(!a||!enabled)return;
    const T=a.currentTime+(o.dl||0), d=o.d||.1;
    const src=a.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const fl=a.createBiquadFilter(); fl.type=o.ft||'bandpass'; fl.Q.value=(o.q!=null?o.q:1);
    fl.frequency.setValueAtTime(o.f||1000,T);
    if(o.f2)fl.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),T+d);
    const ga=a.createGain(); ga.gain.setValueAtTime(0,T);
    ga.gain.linearRampToValueAtTime(o.g||.1,T+(o.at||.006));
    ga.gain.exponentialRampToValueAtTime(.0001,T+d);
    src.connect(fl); fl.connect(ga); ga.connect(comp);
    if(o.send!==0){const s=a.createGain();s.gain.value=(o.send!=null?o.send:.4);ga.connect(s);s.connect(verb);}
    src.start(T); src.stop(T+d+.05); }
  const R=(a,b)=>a+Math.random()*(b-a);
  const PENT=[0,2,4,7,9]; const pent=(i,base)=>((base||392)*Math.pow(2,(PENT[i%5]+12*Math.floor(i/5))/12));
  return{
    setOn(v){ enabled=!!v; if(master)master.gain.value=v?1:0; },
    // --- dice physics ---
    clack(v){ v=Math.min(1,Math.max(0,v));                       // die hitting felt/rail/die — SPRINGY, velocity-scaled
      const bp=R(.85,1.15)*(1.55-.55*v), vol=0.8;                // vol: overall roll-clack loudness (lower = quieter dice)
      hiss({d:R(.02,.038),g:(.05+.28*v)*vol,ft:'bandpass',f:R(1600,2700)*bp,q:1.2,at:.001,send:.25});   // snap: brighter tick
      tone({type:'sine',f:210*bp,f2:520*bp,d:.055,g:(.07+.16*v)*vol,at:.001,curve:.45,send:.3});        // boing: fast upward pitch flick
      tone({type:'triangle',f:R(260,380)*bp,f2:85,d:.08,g:(.09+.2*v)*vol,at:.001,curve:.3,send:.25});   // knock: quicker, tighter body
      tone({type:'sine',f:115+55*v,f2:42,d:.1+.06*v,g:(.09+.36*v*v)*vol,at:.002,curve:.5,send:.12});    // thump: kept for weight on hard hits
      if(v>.6)hiss({d:.08,g:.13*v*vol,ft:'lowpass',f:780,f2:150,at:.002,send:.3}); },                 // felt shove on big landings
    throw_(){ hiss({d:.30,g:.12,ft:'bandpass',f:260,f2:2100,q:1.6,at:.05,send:.5});   // cup-throw whoosh
      hiss({d:.18,g:.05,ft:'highpass',f:3200,at:.04,dl:.06,send:.3}); },
    whoosh(up){ hiss({d:.26,g:.09,ft:'bandpass',f:up?300:1800,f2:up?1800:300,q:1.4,at:.05,send:.5}); },
    settle(){ hiss({d:.06,g:.06,ft:'lowpass',f:520,at:.003,send:.2});                 // soft felt thud
      tone({type:'sine',f:170,f2:110,d:.07,g:.07,at:.003,send:.2});
      tone({type:'sine',f:300,f2:440,d:.05,g:.04,at:.002,curve:.5,dl:.02,send:.3}); },  // tiny springy "doink" to cap the roll
    // --- picks & UI ---

function wrapText(g,txt,x,y,max,lh){ const words=(txt||'').split(' '); let line='',yy=y;
  for(const w of words){ const t=line+w+' '; if(g.measureText(t).width>max&&line){ g.fillText(line.trim(),x,yy); line=w+' '; yy+=lh; } else line=t; }
  g.fillText(line.trim(),x,yy); }
// find the largest font (fMax..fMin) whose wrapped text fits a box, so short text renders BIG and long text shrinks to fill
function fitText(g,txt,family,maxW,maxH,fMax,fMin){
  txt=(txt||'').trim();
  const wrap=f=>{ g.font='bold '+f+'px '+family; const words=txt.split(' '); const lines=[]; let line='';
    for(const w of words){ const t=line?line+' '+w:w; if(g.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t; }
    if(line)lines.push(line); return lines; };
  for(let f=fMax; f>=fMin; f-=2){ const lines=wrap(f); const lh=f*1.14;
    if(lines.length*lh<=maxH && lines.every(l=>g.measureText(l).width<=maxW)) return {size:f,lh,lines}; }
  const lines=wrap(fMin); return {size:fMin,lh:fMin*1.14,lines};
}

function jstride(n){ const span=rackDL - 2*JCARD_M - JCARD_H;   // center-to-center travel available on the shelf
  return (n>1)?Math.min(JCARD_H+JCARD_GAP, span/(n-1)):0; }     // compress spacing when Negative cards push past 5
function jslotZ(i,n){ n=n||1; return -rackDL/2 + JCARD_M + JCARD_H/2 + i*jstride(n); }  // cards spread evenly along the shelf

function build3DCards(){

    const de=(G.bossFx&&G.bossFx.shimmerCards)?'shimmer':c.ench;   // ☠ Dry Well shows every card as Shimmer
    const mesh=makeCardMesh(m,de);
    if(G.bossFx&&G.bossFx.stealCard&&i===G.wardedIdx){ mesh.material.transparent=true; mesh.material.opacity=0.32; }   // ✋ stolen card dimmed
    mesh.scale.setScalar(JS_SCALE);

function rayShelfV(e){

  ray.setFromCamera(ptr,camera);
  cardPlane.setFromNormalAndCoplanarPoint(N, O.clone().addScaledVector(RA,rackCU).addScaledVector(N,0.30));
  const W=new THREE.Vector3();
  if(!ray.ray.intersectPlane(cardPlane,W))return null;

function roundedBoxGeo(w,h,d,r,seg){
  const g=new THREE.BoxGeometry(w,h,d,seg,seg,seg);
  const pos=g.attributes.position;
  const hw=w/2-r, hh=h/2-r, hd=d/2-r;

  for(let i=0;i<pos.count;i++){

const BOS_R=0.67;

  const dirs=[[1,0,t],[1,0,-t],[-1,0,t],[-1,0,-t],[t,1,0],[t,-1,0],[-t,1,0],[-t,-1,0],[0,t,1],[0,t,-1],[0,-t,1],[0,-t,-1]]
    .map(d=>new THREE.Vector3(d[0],d[1],d[2]).normalize());

    const idx=verts.map((v,i)=>({i,d:v.clone().normalize().dot(dir)})).sort((a,b)=>b.d-a.d).slice(0,5).map(o=>o.i);
    const ref=Math.abs(dir.y)<0.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);

function estScore(n,pips){ const cv=comboVals(n); return (cv.p+pips)*cv.m; }
// Base optimizer: the layout with the highest BASE combo value (no cards/dice colours).
function _basePartition(values){
  const counts={}; values.forEach(v=>counts[v]=(counts[v]||0)+1);
  const memo=new Map();
  const key=c=>{let s='';for(let v=1;v<=6;v++)s+=(c[v]||0)+',';return s;};
  function solve(c){
    const k=key(c); if(memo.has(k))return memo.get(k);
    let best={score:0,moves:[]};              // leftovers score nothing
    for(const m of movesFor(c)){
      const nc={...c}; let ok=true;
      for(const v in m.take){nc[v]=(nc[v]||0)-m.take[v];if(nc[v]<0)ok=false;}
      if(!ok)continue;
      const sub=solve(nc), sc=estScore(m.name,m.pips)+sub.score;
      if(sc>best.score)best={score:sc,moves:[m,...sub.moves]};
    }
    memo.set(k,best); return best;
  }
  return solve(counts);
}
// Enumerate every distinct non-overlapping layout (deduped, capped for safety).
function _enumPartitions(counts){
  const memo=new Map(); let total=0, capped=false; const CAP=4000;
  const key=c=>{let s='';for(let v=1;v<=6;v++)s+=(c[v]||0)+',';return s;};
  const psig=part=>part.map(x=>x.name+':'+Object.keys(x.take).map(v=>v+'x'+x.take[v]).join('')).sort().join('|');
  function solve(c){
    const k=key(c); if(memo.has(k))return memo.get(k);
    const mv=movesFor(c); let out;
    if(!mv.length){ out=[[]]; }
    else { const seen=new Set(); out=[];
      for(const m of mv){ const nc={...c}; let ok=true;
        for(const v in m.take){nc[v]=(nc[v]||0)-m.take[v]; if(nc[v]<0)ok=false;}
        if(!ok)continue;
        const subs=solve(nc);
        for(const sp of subs){ const part=[m,...sp]; const sig=psig(part);
          if(seen.has(sig))continue; seen.add(sig); out.push(part);
          if(++total>CAP){capped=true;break;} }
        if(capped)break; }
      if(!out.length)out=[[]]; }
    memo.set(k,out); return out;
  }
  const parts=solve(counts); return {parts,capped};
}
// Deterministic, expected-value estimate of one combo's real score (mirrors doCast's math).
function _estCombo(comboDice,name,ci,total){
  const bfx=G.bossFx||{}, cv=comboVals(name);
  let pts=cv.p, mult=cv.m;
  const greenOdds=(hasCard('jade')||hasCard('fortune'))?1:.5, purpleOdds=(hasCard('amethyst')||hasCard('fortune'))?1:.5;
  const gpDouble=hasCard('fortune'), dblOr=hasCard('doubleor'), gambit=hasCard('gambit');
  const blueTwice=cardMult('mirror'), lastTwice=cardMult('understudy'), grnTwice=cardMult('doppel');
  const whiteTwice=cardMult('backfire');   // retrigger counts (Upper Hand copies stack)
  const lastDie=comboDice[comboDice.length-1]; let greenPaid=0, purplePaid=0;
  for(const d of comboDice){
    if(CAS_TYPES.includes(d.color)){ const pv=(d.pip!=null?d.pip:d.value); if(!(bfx.deadPips&&bfx.deadPips.indexOf(pv)>=0))pts+=pv; continue; }   // casino dice ≈ pips only
    const ec=ecol(d);   // effective colour (white → blue/green with Tidal Charm / Aura Weaver)
    let reps=1;
    if(d.ench==='plasma'&&!bfx.noEnch)reps++;
    if(ec==='blue')reps+=blueTwice;
    if(d===lastDie)reps+=lastTwice;
    if(ec==='green')reps+=grnTwice;
    if(d.color==='plain')reps+=whiteTwice;
    const colorDead=(bfx.deadColors&&bfx.deadColors.indexOf(ec)>=0)||(bfx.hexColor&&bfx.hexColor===ec);
    const dieDead=(bfx.deadCircle&&inCircle(d));
    for(let rep=0;rep<reps;rep++){
      if(dieDead)continue;
      const pv=(d.pip!=null?d.pip:d.value);
      if(!(bfx.deadPips&&bfx.deadPips.indexOf(pv)>=0))pts+=pv;
      if(!colorDead){
        if(ec==='blue')pts+=30;
        else if(ec==='red')mult+=2;
        else if(ec==='green'){ const g=gpDouble?150:75; pts+=greenOdds*g*(dblOr?(1+greenOdds):1); greenPaid+=greenOdds; if(gambit)pts+=(1-greenOdds)*40; }
        else if(ec==='purple'){ const mm=gpDouble?10:5; mult+=purpleOdds*mm*(dblOr?(1+purpleOdds):1); purplePaid+=purpleOdds; if(gambit)pts+=(1-purpleOdds)*40; }
      }

        else if(d.ench==='exalted')mult+=10;

    else if(c.id==='lefthand'){ const Uc=G.cards[cardIdx-1];
      if(Uc){ if(Uc.id==='headclass'){ if(ci===0){ const below=G.cards.length-1-(cardIdx-1); if(below>0)cx.pts+=30*below; } }

}
// Assign real dice to a layout exactly as doCast does, then estimate its full score.
function _assignAndEstimate(moves){
  const bfx=G.bossFx||{};
  const ordered=moves.slice().sort((a,b)=>estScore(b.name,b.pips)-estScore(a.name,a.pips));   // biggest combo claims coloured dice first
  const poolByVal={};
  dice.slice().sort((a,b)=>(a.color==='plain'?0:1)-(b.color==='plain'?0:1)).forEach(d=>{(poolByVal[d.value]=poolByVal[d.value]||[]).push(d);});
  let combos=[];
  for(const m of ordered){ const group=[];
    for(const v in m.take){ for(let k=0;k<m.take[v];k++){ const arr=poolByVal[v]||[]; const die=arr.pop(); if(die)group.push(die); } }
    combos.push({move:m,dice:group}); }
  if(bfx.banFamily) combos=combos.filter(c=>((c.move.name.indexOf('Run')>=0)?'run':'match')!==bfx.banFamily);
  if(bfx.onlyCombo) combos=combos.filter(c=>c.move.name===bfx.onlyCombo);
  if(bfx.needColor) combos=combos.filter(c=>c.dice.some(d=>d.color&&d.color!=='plain'));
  if(!combos.length) return {score:0, moves:ordered};
  const scoreOrder=combos.slice().sort((a,b)=>estScore(a.move.name,a.move.pips)-estScore(b.move.name,b.move.pips));
  const total=scoreOrder.length;
  const oldL=G._leftScored,oldR=G._rightScored,oldT=G._topLvl;
  G._leftScored=scoreOrder.reduce((s,c)=>s+c.dice.filter(onLeft).length,0);
  G._rightScored=scoreOrder.reduce((s,c)=>s+c.dice.filter(onRight).length,0);
  G._topLvl=scoreOrder.reduce((mx,c)=>Math.max(mx,G.comboLvl[c.move.name]||0),0);
  const scores=[]; let tot=0;
  for(let ci=0;ci<scoreOrder.length;ci++){ const sc=_estCombo(scoreOrder[ci].dice,scoreOrder[ci].move.name,ci,total); scores.push(sc); tot+=sc; }
  const best=scores.length?Math.max(...scores):0, low=scores.length?scores[0]:0;
  tot+=low*cardMult('echo');
  tot+=best*cardMult('encore');
  G._leftScored=oldL; G._rightScored=oldR; G._topLvl=oldT;
  return {score:tot, moves:ordered};
}
// Public: pick the layout that scores HIGHEST for the player's actual build.
// Falls back to the base optimizer if anything is off (large hands, errors) — that
// only affects WHICH layout is chosen; doCast still scores whatever it's given.
function bestPartition(values){
  try{
    if(typeof dice!=='undefined' && dice && dice.length===values.length && values.length){
      const counts={}; values.forEach(v=>counts[v]=(counts[v]||0)+1);
      const {parts,capped}=_enumPartitions(counts);
      if(!capped && parts.length){
        let best=null;
        for(const part of parts){ if(!part.length)continue;
          const r=_assignAndEstimate(part);
          if(!best||r.score>best.score) best=r; }
        if(best) return best;
      }
    }
  }catch(e){}
  return _basePartition(values);
}

// after boss filters — returned as a Map of name → the REAL dice that combo

// shared pool, so it lands in exactly ONE combo; that's what the guide paints

function scoringPlanGroups(){
  const map=new Map();
  if(G.phase!=='settled')return map;
  RUN3=hasCard('seqbreak');
  const bfx=G.bossFx||{};
  const res=bestPartition(dice.map(d=>d.value));
  const poolByVal={};
  dice.slice().sort((a,b)=>(a.color==='plain'?0:1)-(b.color==='plain'?0:1))
      .forEach(d=>{(poolByVal[d.value]=poolByVal[d.value]||[]).push(d);});
  let combos=res.moves.map(m=>{ const group=[];
    for(const v in m.take){ for(let k=0;k<m.take[v];k++){ const arr=poolByVal[v]||[]; const die=arr.pop(); if(die)group.push(die); } }

  if(bfx.needColor) combos=combos.filter(c=>c.dice.some(d=>d.color&&d.color!=='plain'));

let settleResolve=null,settleN=0,waiting=false,settleSimT=0,settleNudge=0;
function waitSettle(){return new Promise(r=>{settleResolve=r;settleN=0;waiting=true;settleSimT=0;settleNudge=0;});}
function allSlow(){for(const d of dice){if(d.body.type===CANNON.Body.STATIC)continue;
  if(d.body.velocity.length()+d.body.angularVelocity.length()>.3)return false;}return true;}
function throwDice(list){
  clearSlotTemps(true);   // 💨 the slots' shadow dice vanish when dice fly again
  _slowmoUsed=false; _timeScale=1;   // bullet-time is armed once per throw
  try{ cpClearRings(); }catch(e){}   // hover circles die with the old board
  Sfx.throw_();
  list.forEach((d,i)=>{
    d.body.type=CANNON.Body.DYNAMIC;d.body.mass=1;d.body.updateMassProperties();
    const sp=(i-(list.length-1)/2);
    const pos=onPlane(sp*1.3+(Math.random()-.5), (Math.random()-.5)*3, 6+Math.random()*1.4);
    d.body.position.set(pos.x,pos.y,pos.z);
    d.body.quaternion.setFromEuler(Math.random()*6.28,Math.random()*6.28,Math.random()*6.28);
    const vin=N.clone().multiplyScalar(-5.8);   // slam them into the felt so the first bounce launches high
    const vsp=RA.clone().multiplyScalar((Math.random()-.5)*8).addScaledVector(PA,(Math.random()-.5)*5);
    d.body.velocity.set(vin.x+vsp.x,vin.y+vsp.y,vin.z+vsp.z);
    d.body.angularVelocity.set((Math.random()-.5)*24,(Math.random()-.5)*24,(Math.random()-.5)*24);
    d.body.wakeUp();});
}
function readFaces(){dice.forEach(d=>{
  let best=-1e9;
  if(d.color==='wheel'){
    let fi=0;
    WHEEL_NORMALS.forEach((n,i)=>{const wn=n.clone().applyQuaternion(d.mesh.quaternion);
      const dv=wn.dot(N);if(dv>best){best=dv;fi=i;}});
    const f=WHEEL_FACES[fi];
    d.value=f.v; d.pip=f.v; d.wheelBacking=f.c;
    d.colorAs=(f.c==='red')?'red':null;   // red backing counts as a red die for color cards
  } else if(d.color==='bos'){
    let fi=0;
    BOSD.faces.forEach((f,i)=>{const wn=f.dir.clone().applyQuaternion(d.mesh.quaternion);
      const dv=wn.dot(N);if(dv>best){best=dv;fi=i;}});
    const n=BOS_NUM[fi];
    d.bosN=n; d.value=bosRank(n); d.pip=n;   // ranks 1–6, but pips up to 12
  } else if(d.color==='slots'){
    let sym=0;
    SLOT_NORMALS.forEach(f=>{const wn=f.n.clone().applyQuaternion(d.mesh.quaternion);
      const dv=wn.dot(N);if(dv>best){best=dv;sym=f.s;}});
    d.slotSym=sym; d.value=sym+1; d.pip=sym+1;
  } else if(d.color==='chip'){
    const up=new THREE.Vector3(0,1,0).applyQuaternion(d.mesh.quaternion);
    d.chipHeads=up.dot(N)>=0;
    d.value=0; d.pip=0;   // the chip never joins combos
  } else {
    let v=1;
    FACE_NORMALS.forEach(f=>{const wn=f.n.clone().applyQuaternion(d.mesh.quaternion);
      const dv=wn.dot(N);if(dv>best){best=dv;v=f.v;}});
    d.value=v; d.pip=v;
  }
});}

// ---- keep dice from resting cocked on an edge/corner: every d6 must finish flat on a face ----
const FLAT_DOT=0.985;   // the up-face must sit within ~10° of the felt normal to count as "laid flat"
function _dieCasino(d){ return d.color==='wheel'||d.color==='bos'||d.color==='slots'||d.color==='chip'; }
function _dieTopFace(d){ let best=-1e9,ln=null;
  FACE_NORMALS.forEach(f=>{ const wn=f.n.clone().applyQuaternion(d.mesh.quaternion); const dv=wn.dot(N); if(dv>best){best=dv;ln=f.n;} });
  return {dot:best,ln}; }
function dieIsFlat(d){ return _dieCasino(d) ? true : _dieTopFace(d).dot>FLAT_DOT; }   // odd-shaped casino dice are left alone
function nudgeUpright(d){   // tip a cocked die so its most-up face rotates down onto the felt
  const wn=_dieTopFace(d).ln.clone().applyQuaternion(d.mesh.quaternion).normalize();
  const axis=new THREE.Vector3().crossVectors(wn,N), len=axis.length();
  if(len>1e-4){ axis.multiplyScalar(5.5/len); d.body.angularVelocity.set(axis.x,axis.y,axis.z); }
  else d.body.angularVelocity.set((Math.random()-.5)*7,(Math.random()-.5)*7,(Math.random()-.5)*7);
  d.body.velocity.set(N.x*1.7,N.y*1.7,N.z*1.7); d.body.wakeUp();   // small pop off the felt so it can turn over
}
function snapFlat(d){   // guaranteed failsafe: rotate the nearest face exactly flat on the felt
  const q=d.mesh.quaternion.clone();
  const wn=_dieTopFace(d).ln.clone().applyQuaternion(q).normalize();
  const nq=new THREE.Quaternion().setFromUnitVectors(wn,N).multiply(q);
  d.body.quaternion.set(nq.x,nq.y,nq.z,nq.w); d.mesh.quaternion.copy(nq);
  d.body.velocity.set(0,0,0); d.body.angularVelocity.set(0,0,0);
}
