// ============================================================
//  THE CAST — compute-then-replay scoring cinematic
//  buildCastPlan(): resolves ALL scoring math once (RNG included) and
//  records a per-combo event timeline. playCastCinematic(): darkens the
//  world, lifts the scoring dice into their combos, slides the cards into
//  a column on the left, drops casino dice to the bottom, and ticks the
//  numbers up as each die / card / casino effect fires. Skippable.
// ============================================================
// count-speed presets for the Settings selector (slow → fast); default a touch slow so it's readable
const SPEEDS=[{n:'Very Slow',m:2.0},{n:'Slow',m:1.4},{n:'Normal',m:1.0},{n:'Fast',m:0.6},{n:'Very Fast',m:0.32}];
let speedIdx=1;
function spd(){ return (SPEEDS[speedIdx]&&SPEEDS[speedIdx].m)||1; }
const CINE={ dieDist:13, cardDist:12.6, darkDist:17,
  rowTopY:0.40, rowStep:0.30, diceStartX:-0.12, dieGapX:0.135, panelX:0.80,
  cardX:-0.72, cardMidY:-0.03, cardGapY:0.34, cardScale:0.34,
  casY:-0.82, casGapX:0.16,
  tStep:180, tCombo:360, tBank:480 };
function _camAxes(){ const q=camera.quaternion;
  return { r:new THREE.Vector3(1,0,0).applyQuaternion(q), u:new THREE.Vector3(0,1,0).applyQuaternion(q), f:new THREE.Vector3(0,0,-1).applyQuaternion(q) }; }
function camPoint(sx,sy,dist){ const a=_camAxes();
  const hh=dist*Math.tan(camera.fov*Math.PI/360), hw=hh*camera.aspect;
  return camera.position.clone().addScaledVector(a.f,dist).addScaledVector(a.r,sx*hw).addScaledVector(a.u,sy*hh); }
function w2p(v){ const p=new THREE.Vector3(v.x,v.y,v.z).project(camera);   // accepts THREE *or* CANNON vectors
  return {x:(p.x*.5+.5)*innerWidth, y:(-p.y*.5+.5)*innerHeight}; }
const CAS_TYPES=['wheel','bos','slots','chip'];
const cs=ms=>sleep(G._skipCast?0:ms*spd());

// ---- deterministic plan: every number resolved, every effect recorded ----
function buildCastPlan(){
  const bfx=G.bossFx||{};
  if(G._blackout){ G._blackout=false; applyBlackout(false); dice.forEach(resetGlow); }
  const disabledIdx = bfx.disableLeft ? 0 : bfx.stealCard ? (G.wardedIdx!=null?G.wardedIdx:-1) : (bfx.disableRandom ? Math.floor(Math.random()*Math.max(1,G.cards.length)) : -1);
  G._vigVoid=false;
  if(bfx.vig){ if(G.gold>=bfx.vig){ G.gold-=bfx.vig; refreshHUD(); } else { G._vigVoid=true; } }
  RUN3=hasCard('seqbreak');
  const res=bestPartition(dice.map(d=>d.value));
  const poolByVal={};
  dice.slice().sort((a,b)=>(a.color==='plain'?0:1)-(b.color==='plain'?0:1)).forEach(d=>{(poolByVal[d.value]=poolByVal[d.value]||[]).push(d);});
  const combos=[];
  for(const m of res.moves){ const group=[];
    for(const v in m.take){for(let k=0;k<m.take[v];k++){const arr=poolByVal[v]||[];const die=arr.pop();if(die)group.push(die);}}
    combos.push({move:m,dice:group}); }
  combos.sort((a,b)=>estScore(a.move.name,a.move.pips)-estScore(b.move.name,b.move.pips));
  if(bfx.banFamily){ for(let i=combos.length-1;i>=0;i--){ const fam=(combos[i].move.name.indexOf('Run')>=0)?'run':'match'; if(fam===bfx.banFamily)combos.splice(i,1); } }
  if(bfx.onlyCombo){ for(let i=combos.length-1;i>=0;i--){ if(combos[i].move.name!==bfx.onlyCombo)combos.splice(i,1); } }   // 💎 Purist: only the chosen combo scores
  if(bfx.needColor){ for(let i=combos.length-1;i>=0;i--){ if(!combos[i].dice.some(d=>d.color&&d.color!=='plain'))combos.splice(i,1); } }

  // casino dice (board order left→right) — outcomes resolved here, replayed later
  const casDice=dice.filter(d=>CAS_TYPES.includes(d.color)).sort((a,b)=>diceUV(a).u-diceUV(b).u);
  const casino=[];   // {die, ico, title, tone, key}
  if(combos.length){
    for(const cd of casDice){
      if(cd.color==='wheel'){ const bk=cd.wheelBacking;
        if(bk==='red')casino.push({die:cd,ico:'🎡',title:'Wheel · RED +3✕',tone:'good',key:'wR'});
        else if(bk==='black')casino.push({die:cd,ico:'🎡',title:'Wheel · BLACK +40',tone:'good',key:'wB'});
        else casino.push({die:cd,ico:'🎡',title:'Wheel · BUST −5%✕',tone:'bad',key:'wG'});
      } else if(cd.color==='bos'){ const n=cd.bosN;
        if(n<=6)casino.push({die:cd,ico:'🎲',title:'Small '+n+' · +40',tone:'good',key:'bS'});
        else if(G.rerolls>0)casino.push({die:cd,ico:'🎲',title:'BIG '+n+' · +100',tone:'good',key:'bB'});
        else casino.push({die:cd,ico:'🎲',title:'BIG '+n+' · BUST −25%',tone:'bad',key:'bX'});
      } else if(cd.color==='slots'){
        const pull=cd._pull; cd._pull=null;   // real reels from the physical pop-out roll (random fallback if it failed)
        const s0=pull?pull[0]:(cd.slotSym||0), s1=pull?pull[1]:Math.floor(Math.random()*6), s2=pull?pull[2]:Math.floor(Math.random()*6);
        const syms=SLOT_DISP[s0]+SLOT_DISP[s1]+SLOT_DISP[s2];
        const trip=(s0===s1&&s1===s2), pair=!trip&&(s0===s1||s0===s2||s1===s2);
        if(trip&&s0===5)casino.push({die:cd,ico:'🎰',title:syms+' JACKPOT ×3',tone:'good',key:'s3'});
        else if(trip)casino.push({die:cd,ico:'🎰',title:syms+' ×2✕',tone:'good',key:'s2'});
        else if(pair)casino.push({die:cd,ico:'🎰',title:syms+' +40',tone:'good',key:'sP'});
        else casino.push({die:cd,ico:'🎰',title:syms+' —',tone:'flat',key:null});
      } else if(cd.color==='chip'){ casino.push({die:cd,ico:'🪙',title:'Chip',tone:'flat',key:null}); }
    }
  }

  const greenOdds=(hasCard('jade')||hasCard('fortune'))?1:.5, purpleOdds=(hasCard('amethyst')||hasCard('fortune'))?1:.5;
  const gpDouble=hasCard('fortune'), dblOr=hasCard('doubleor'), gambit=hasCard('gambit');
  const blueTwice=cardMult('mirror'), lastTwice=cardMult('understudy'), grnTwice=cardMult('doppel');
  const whiteTwice=cardMult('backfire');   // retrigger counts (Upper Hand copies stack; Tidal Charm / Aura Weaver handled via ecol)
  G._leftScored =combos.reduce((s,c)=>s+c.dice.filter(onLeft).length,0);
  G._rightScored=combos.reduce((s,c)=>s+c.dice.filter(onRight).length,0);
  G._topLvl     =combos.reduce((mx,c)=>Math.max(mx,G.comboLvl[c.move.name]||0),0);

  const plan={combos:[], casino, endEvents:[], vigVoid:false, total:0, disabledIdx};
  const comboScores=[];
  for(let ci=0;ci<combos.length;ci++){
    const A=combos[ci], name=A.move.name, cv=comboVals(name);
    let pts=cv.p, mult=cv.m, greenPaid=0, purplePaid=0;
    const steps=[]; const lastDie=A.dice[A.dice.length-1];
    const push=(ref,pop,sparks)=>steps.push({ref,pop,p:pts,m:mult,sparks:sparks&&sparks.length?sparks:null});
    for(const d of A.dice){
      const ec=ecol(d);   // effective colour (white → blue/green with Tidal Charm / Aura Weaver)
      let reps=1;
      if(d.ench==='plasma'&&!bfx.noEnch)reps++;
      if(ec==='blue')reps+=blueTwice;
      if(d===lastDie)reps+=lastTwice;
      if(ec==='green')reps+=grnTwice;
      if(d.color==='plain')reps+=whiteTwice;
      const colorDead=(bfx.deadColors&&bfx.deadColors.indexOf(ec)>=0)||(bfx.hexColor&&bfx.hexColor===ec);
      const dieDead=(bfx.deadCircle&&inCircle(d));
      for(let rep=0;rep<reps;rep++){
        if(dieDead){ push({die:d},{t:'✗',c:'#9aa4c8'}); continue; }
        const pv=(d.pip!=null?d.pip:d.value);
        const pipDead=bfx.deadPips&&bfx.deadPips.indexOf(pv)>=0;
        // Split a die's contribution so its DOT VALUE is always shown and a mult ability
        // can never cancel it: dPts = pip + any points bonus (blue/green/gambit),
        // dMult = any mult bonus (red/purple) shown as its OWN separate pop.
        let dPts=pipDead?0:pv, dMult=0, pc='#fff', mark='', mText=null, mCol=null, missText=null;
        const spk=[];
        if(!colorDead){
          if(ec==='blue'){dPts+=30;pc='#7fb2ff';spk.push('#4f9dff');}
          else if(ec==='red'){dMult+=2;mText='+2✕';mCol='#ff8f8f';pc='#ff8f8f';spk.push('#ff6b6b');}
          else if(ec==='green'){
            if(Math.random()<greenOdds){ const g=gpDouble?150:75; dPts+=g; if(dblOr&&Math.random()<greenOdds)dPts+=g; greenPaid++; mark='!';pc='#8fe0a5';spk.push('#5fe08a'); }
            else { if(gambit)dPts+=40; pc='#8fe0a5'; missText='✗'; } }   // green payout missed
          else if(ec==='purple'){
            if(Math.random()<purpleOdds){ const m=gpDouble?10:5; dMult+=m; if(dblOr&&Math.random()<purpleOdds)dMult+=m; purplePaid++; mText='+'+m+'✕!';mCol='#c99fff';pc='#c99fff';spk.push('#c07bff'); }
            else { if(gambit)dPts+=40; pc='#c99fff'; missText='✗'; } }   // purple payout missed
        }
        pts+=dPts;
        // POINTS pop — the die's dot value (plus any points bonus). Always shown, never hidden by a mult ability.
        push({die:d},{t:pipDead?'✗':('+'+dPts+mark),c:pc},spk);
        // MISS pop — the green/purple payout missed: show ✗ right after (the pip above still counted)
        if(missText&&!pipDead)push({die:d},{t:missText,c:pc});
        // MULT pop — red/purple abilities as a SEPARATE pop so they add on top of the pip instead of replacing it.
        if(mText){ mult+=dMult; push({die:d},{t:mText,c:mCol},[mCol]); }
        // enchant fires as its OWN separate number pop — colour, dot value AND enhancement all show during the count
        if(!bfx.noEnch){
          let et=null,epc=null;
          if(d.ench==='prism'){pts+=100;et='◆+100';epc='#8fe6ff';}
          else if(d.ench==='exalted'){mult+=10;et='☀+10✕';epc='#ffcf5a';}
          else if(d.ench==='shimmer'){mult*=2;et='✧×2';epc='#ff7ce0';
            if(rep===reps-1&&Math.random()<0.2)d._shatter=true; }
          else if(d.ench==='plasma'&&rep===0){et='⚡×2';epc='#ff5a5a';}
          if(et)push({die:d},{t:et,c:epc},[epc]);
        }
      }
      if(d._shatter){ d._shatter=false; d.ench=null; if(d.auraMesh){d.mesh.remove(d.auraMesh);d.auraMesh=null;} }
    }
    // cards fire left→right
    const cx={name,pts,mult,dice:A.dice,index:ci,total:combos.length,greenPaid,purplePaid,gpPaid:greenPaid+purplePaid};
    G.cards.forEach((c,cardIdx)=>{
      if(cardIdx===disabledIdx)return;
      const bp=cx.pts, bm=cx.mult;
      if(c.id==='headclass'){ if(ci===0){ const below=G.cards.length-1-cardIdx; if(below>0)cx.pts+=30*below; } }
      else if(c.id==='lefthand'){ const U=G.cards[cardIdx-1];
        if(U){ if(U.id==='headclass'){ if(ci===0){ const below=G.cards.length-1-(cardIdx-1); if(below>0)cx.pts+=30*below; } }
               else if(U.per){try{U.per(cx);}catch(e){}} } }
      else if(c.per){try{c.per(cx);}catch(e){}}
      if(cx.pts!==bp||cx.mult!==bm){ pts=cx.pts; mult=cx.mult;
        const dp=Math.round(cx.pts-bp); const dm=Math.round((cx.mult-bm)*10)/10;
        const t=(dp?('+'+dp):'')+((dp&&dm)?' ':'')+(dm>0?('+'+dm+'✕'):(cx.mult!==bm&&!dp?'✕':''));
        steps.push({ref:{card:cardIdx},pop:{t:t||'✦',c:'#ffe6a0'},p:pts,m:mult}); }
    });
    // casino resolves last, before the combo banks
    const isLast=(ci===combos.length-1);
    const casEffect=(k)=>{
      if(k==='wR')cx.mult+=3; else if(k==='wB')cx.pts+=40; else if(k==='wG')cx.mult*=0.95;
      else if(k==='bS')cx.pts+=40; else if(k==='bB')cx.pts+=100; else if(k==='bX')cx.pts*=0.75;
      else if(k==='sP'&&isLast)cx.pts+=40; else if(k==='s2'&&isLast)cx.mult*=2; else if(k==='s3'&&isLast)cx.mult*=3; };
    const overcharge=hasCard('battery');   // Overcharge: 50% chance a casino die fires its bonus again
    casino.forEach((c,cIdx)=>{ const k=c.key; if(!k)return; const bp=cx.pts, bm=cx.mult;
      casEffect(k);
      if(overcharge&&Math.random()<0.5)casEffect(k);
      if(cx.pts!==bp||cx.mult!==bm){ pts=cx.pts; mult=cx.mult;
        steps.push({ref:{cas:cIdx,die:c.die},pop:{t:c.ico,c:c.tone==='bad'?'#ff8f8f':'#ffd97a'},p:pts,m:mult}); } });
    if(bfx.houseCut){cx.mult*=bfx.houseCut; pts=cx.pts; mult=cx.mult; steps.push({ref:{},pop:{t:'−cut',c:'#ff8f8f'},p:pts,m:mult});}
    if(bfx.multCap!=null&&cx.mult>bfx.multCap){cx.mult=bfx.multCap; mult=cx.mult; steps.push({ref:{},pop:{t:'cap '+bfx.multCap,c:'#ff8f8f'},p:pts,m:mult});}
    pts=cx.pts; mult=Math.max(cx.mult,0);
    let sc=Math.round(pts*mult);
    if(bfx.grind&&ci>0)sc=Math.round(sc*bfx.grind);
    comboScores.push(sc); plan.total+=sc;
    plan.combos.push({name,ico:COMBO_ICO[name]||'✨',allDice:A.dice,
      rowDice:A.dice.filter(d=>!CAS_TYPES.includes(d.color)),
      baseP:cv.p, baseM:cv.m, steps, finalP:Math.round(pts), finalM:Math.round(mult*10)/10, score:sc});
  }
  const bestScore=comboScores.length?Math.max(...comboScores):0, lowScore=comboScores.length?comboScores[0]:0;
  const echoN=cardMult('echo'), encN=cardMult('encore');
  if(echoN&&lowScore>0){ plan.endEvents.push({label:'Echo — lowest combo again'+(echoN>1?' ×'+echoN:''),amount:lowScore*echoN}); plan.total+=lowScore*echoN; }
  if(encN&&bestScore>0){ plan.endEvents.push({label:'Encore — best combo again'+(encN>1?' ×'+encN:''),amount:bestScore*encN}); plan.total+=bestScore*encN; }
  if(G._vigVoid){ plan.vigVoid=true; plan.total=0; }
  return plan;
}

// ---- tween helpers (skip-aware) ----
async function _tweenBodies(entries,dur){ const from=entries.map(e=>e.d.body.position.clone());
  if(G._skipCast)dur=0; const t0=performance.now();
  while(true){ let k=dur?Math.min(1,(performance.now()-t0)/dur):1; const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    entries.forEach((en,i)=>en.d.body.position.set(from[i].x+(en.to.x-from[i].x)*e,from[i].y+(en.to.y-from[i].y)*e,from[i].z+(en.to.z-from[i].z)*e));
    if(k>=1)break; await sleep(16);} }
async function _tweenObj(o,toPos,toQuat,toScale,dur){ const p0=o.position.clone(),q0=o.quaternion.clone(),s0=o.scale.x;
  if(G._skipCast)dur=0; const t0=performance.now();
  while(true){ let k=dur?Math.min(1,(performance.now()-t0)/dur):1; const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    o.position.lerpVectors(p0,toPos,e); if(toQuat)o.quaternion.slerpQuaternions(q0,toQuat,e); const s=s0+(toScale-s0)*e; o.scale.setScalar(s);
    if(k>=1)break; await sleep(16);} }
// impact easing: sharp attack, springy decay — reads as a "punch" rather than a wiggle
function _punchK(k){ return k<.22 ? k/.22 : (1-(k-.22)/.78)*(1+.25*Math.sin((k-.22)*18)); }
function _shakeDie(d,dur){ const base=d.body.position.clone(), s0=d.mesh.scale.x, t0=performance.now();
  (async()=>{ while(true){ const k=(performance.now()-t0)/dur; if(k>=1){break;}
    const p=_punchK(k); d.mesh.scale.setScalar(s0*(1+.26*p)); const a=(1-k)*0.16;
    d.body.position.set(base.x+(Math.random()-.5)*a,base.y+(Math.random()-.5)*a,base.z+(Math.random()-.5)*a); await sleep(16);}
    d.body.position.copy(base); d.mesh.scale.setScalar(s0); })(); }
function _shakeCard(m,dur){ const s0=m.scale.x, q0=m.quaternion.clone(), t0=performance.now();
  const rot=(Math.random()<.5?-1:1)*0.09;
  (async()=>{ while(true){ const k=(performance.now()-t0)/dur; if(k>=1){break;}
    const p=_punchK(k); m.scale.setScalar(s0*(1+.2*p));
    m.quaternion.copy(q0); m.rotateZ(rot*p); await sleep(16);}
    m.scale.setScalar(s0); m.quaternion.copy(q0); })(); }
// colored firework lines that spark off a die when its colour / enhancement fires
function sparkBurst(x,y,color,n){ n=n||12; const app=el('app'); if(!app)return;
  for(let i=0;i<n;i++){
    const ang=(360*i/n)+(Math.random()-.5)*26, dist=30+Math.random()*34, len=12+Math.random()*14;
    const s=document.createElement('div'); s.className='spark';
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.height=len.toFixed(0)+'px';
    s.style.background='linear-gradient(to top,'+color+','+color+'aa 45%,transparent)';
    s.style.boxShadow='0 0 9px '+color+',0 0 4px '+color;
    s.style.setProperty('--rot',ang.toFixed(1)+'deg'); s.style.setProperty('--d',dist.toFixed(0)+'px');
    app.appendChild(s);
    setTimeout(()=>{ if(s.parentNode)s.remove(); }, 660);
  }
}
// full-screen gold impact flash (big score moments)
function flashFx(){ let f=document.getElementById('flashfx');
  if(!f){ f=document.createElement('div'); f.id='flashfx'; document.body.appendChild(f); }
  f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
// hit-stop: freeze the whole sim for a beat so impacts register
let _hitStop=0; function hitStop(ms){ _hitStop=Math.max(_hitStop,performance.now()+ms); }

// ---- the cinematic ----
let _darkMesh=null, _cineCleanup=null, _cineCleaned=false;
async function playCastCinematic(plan){
  window._cine=true; G._skipCast=false;
  /* marquee bulbs disabled — no flashing balls around the tray during scoring */
  const tally=el('tally'), skipHint=el('skiphint');
  const cbtns=el('cinebtns'), skipBtn=el('cineSkip'), nextBtn=el('cineNext');
  let _nextResolve=null; const nextP=new Promise(r=>{_nextResolve=r;});
  const resolveNext=()=>{ if(_nextResolve){const r=_nextResolve;_nextResolve=null;r();} };
  // A click/tap or key anywhere CONTINUES — but only once scoring has fully played out (it never skips the count).
  let _canContinue=false; const onContinue=()=>{ if(_canContinue) resolveNext(); };
  const restore=[], cardAnim=[];    // populated during setup; doCleanup reads whatever exists

  // ---- guaranteed cleanup registered FIRST, so any setup error still restores the scene ----
  function doCleanup(){ if(_cineCleaned)return; _cineCleaned=true;
    resolveNext();
    try{ marqueeMode('off'); }catch(e){}
    try{ Sfx.riserStop(true); }catch(e){}
    try{ restore.forEach(r=>{ r.d.body.position.copy(r.pos); r.d.body.quaternion.copy(r.quat); r.d.body.type=r.type;
      r.d.body.velocity.set(0,0,0); r.d.body.angularVelocity.set(0,0,0); if(r.type===CANNON.Body.DYNAMIC)r.d.body.sleep(); resetGlow(r.d); }); }catch(e){}
    try{ cardAnim.forEach(ca=>{ if(ca.m.parent)ca.m.parent.remove(ca.m); }); }catch(e){}
    try{ if(_darkMesh)_darkMesh.visible=false; }catch(e){}
    try{ tally.style.display='none'; tally.innerHTML=''; const gt2=el('tallytotal'); gt2.style.display='none'; gt2.className=''; skipHint.style.display='none'; }catch(e){}
    try{ cbtns.classList.remove('on'); skipBtn.onclick=null; nextBtn.onclick=null; }catch(e){}
    try{ canvas.removeEventListener('pointerdown',onContinue); window.removeEventListener('keydown',onContinue); }catch(e){}
    window._cine=false;
    try{ build3DCards(); }catch(e){}
  }
  _cineCleanup=doCleanup;

  try{
    tally.innerHTML=''; tally.style.display='block'; skipHint.style.display='none';
    cbtns.classList.add('on'); skipBtn.hidden=false; nextBtn.hidden=true;
    skipBtn.onclick=()=>{ G._skipCast=true; };
    nextBtn.onclick=resolveNext;
    canvas.addEventListener('pointerdown',onContinue); window.addEventListener('keydown',onContinue);

    // darken plane (in front of the felt, behind the lifted pieces)
    if(!_darkMesh){ _darkMesh=new THREE.Mesh(new THREE.PlaneGeometry(240,240),
      new THREE.MeshBasicMaterial({color:0x04060f,transparent:true,opacity:0,depthWrite:false})); scene.add(_darkMesh); }
    _darkMesh.position.copy(camPoint(0,0,CINE.darkDist)); _darkMesh.lookAt(camera.position); _darkMesh.visible=true;

    // freeze every die where it sits (and drop the green "held" glow — scoring shouldn't show it)
    dice.forEach(d=>{ restore.push({d,pos:d.body.position.clone(),quat:d.body.quaternion.clone(),type:d.body.type});
      d.body.type=CANNON.Body.STATIC; d.body.velocity.set(0,0,0); d.body.angularVelocity.set(0,0,0); resetGlow(d); });

    // reparent cards to the scene so we can tween them (defensive: if unsupported, cards just stay put)
    if(typeof scene.attach==='function'){ try{
      cardMeshes.forEach((m)=>{ const orig={pos:m.position.clone(),quat:m.quaternion.clone(),scale:m.scale.x};
        scene.attach(m); cardAnim.push({m,orig,world:{pos:m.getWorldPosition(new THREE.Vector3()),quat:m.getWorldQuaternion(new THREE.Quaternion())}}); });
    }catch(e){ cardAnim.length=0; } }

    // targets: scoring dice into combo rows · casino dice along the bottom · leftovers stay (darkened)
    const scoringSet=new Set(); plan.combos.forEach(c=>c.rowDice.forEach(d=>scoringSet.add(d)));
    const casSet=new Set(plan.casino.map(c=>c.die));
    const diceMoves=[];
    plan.combos.forEach((c,ci)=>{ const y=CINE.rowTopY-ci*CINE.rowStep;
      c.rowDice.forEach((d,i)=>{ const x=CINE.diceStartX+i*CINE.dieGapX; diceMoves.push({d,to:camPoint(x,y,CINE.dieDist)}); }); });   // dice: neat left→right row
    plan.casino.forEach((c,i)=>{ const n=plan.casino.length; const x=(i-(n-1)/2)*CINE.casGapX; diceMoves.push({d:c.die,to:camPoint(x,CINE.casY,CINE.dieDist)}); });
    { const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);   // camera look direction
      const cup=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);     // camera up
      const nC=cardAnim.length;
      cardAnim.forEach((ca,i)=>{ const y=CINE.cardMidY+((nC-1)/2-i)*CINE.cardGapY;   // centered column, evenly spaced (no overlap at ≤5)
        ca.toPos=camPoint(CINE.cardX,y,CINE.cardDist);
        const tmp=new THREE.Object3D(); tmp.up.copy(cup); tmp.position.copy(ca.toPos); tmp.lookAt(ca.toPos.clone().sub(fwd));   // flat, square to the screen
        ca.toQuat=tmp.quaternion.clone(); }); }

    // darken + move everything in
    const fade=(async()=>{ const t0=performance.now(); const fd=G._skipCast?1:260*spd(); while(true){ const k=Math.min(1,(performance.now()-t0)/fd);
      _darkMesh.material.opacity=0.74*k; if(k>=1)break; await sleep(16);} })();
    if(!G._skipCast)Sfx.whoosh(true);
    await Promise.all([ fade, _tweenBodies(diceMoves,320*spd()),
      ...cardAnim.map(ca=>_tweenObj(ca.m,ca.toPos,ca.toQuat,CINE.cardScale,300*spd())) ]);
    await cs(100);

    // per-combo tally panels
    const setPanel=(pan,p,m)=>{ pan.querySelector('.tp').textContent=Math.round(p); pan.querySelector('.tm').textContent=(Math.round(m*10)/10); };
    const panels=[];
    plan.combos.forEach((c,ci)=>{ const pan=document.createElement('div'); pan.className='tpanel';
      pan.innerHTML=`<div class="tnm">${c.ico} ${c.name}</div><div class="teq"><span class="tp">0</span><span class="tx">×</span><span class="tm">0</span></div><div class="tsub"></div>`;
      tally.appendChild(pan); const anchor=w2p(camPoint(CINE.panelX,CINE.rowTopY-ci*CINE.rowStep,CINE.dieDist));
      pan.style.left=anchor.x+'px'; pan.style.top=anchor.y+'px'; panels.push(pan); setPanel(pan,c.baseP,c.baseM); });

    const gt=el('tallytotal'); gt.style.display='block'; gt.textContent='0'; let grand=0;
    if(!G._skipCast)try{Sfx.riserStart();}catch(e){}        // tension riser under the whole count
    const _tier=m=>m>=16?2:(m>=7?1:0);                      // pop escalation by current multiplier

    const bumpPan=(pan,big)=>{ pan.classList.remove('hit','hitbig'); void pan.offsetWidth; pan.classList.add(big?'hitbig':'hit'); };
    for(let ci=0;ci<plan.combos.length;ci++){ const c=plan.combos[ci], pan=panels[ci];
      pan.classList.add('live'); Sfx.combo(ci);
      if(!G._skipCast)doShake(2+ci*1.6);                     // each successive combo row lands harder
      await cs(CINE.tCombo*0.4);
      let curP=c.baseP, curM=c.baseM, tickN=0;
      for(const st of c.steps){
        try{
          const tr=_tier(st.m), szB=Math.min(12,st.m*.5);   // pops grow / glow / ignite as the mult climbs
          let px=0,py=0; try{ const pr=pan.getBoundingClientRect(); px=pr.left+pr.width*.5; py=pr.top+pr.height*.55; }catch(e){}
          if(st.ref.card!=null&&cardAnim[st.ref.card]){ const cm=cardAnim[st.ref.card].m; _shakeCard(cm,240);
            const sp=w2p(cm.position); flyPop(st.pop.t,sp.x,sp.y-14,px||sp.x,py||sp.y-70,st.pop.c,28+szB,tr); }
          else if(st.ref.die){ const dd=st.ref.die; _shakeDie(dd,240);
            const sp=w2p(dd.body.position); flyPop(st.pop.t,sp.x,sp.y-14,px||sp.x,py||sp.y-70,st.pop.c,27+szB,tr);
            if(st.ref.cas!=null&&!G._skipCast){ st.pop.c==='#ff8f8f'?Sfx.bad():Sfx.coin();     // slot-machine payout / bust
              const ck=plan.casino[st.ref.cas]&&plan.casino[st.ref.cas].key;
              if(ck==='s3'){ coinBurst(dd.body.position,30); flashFx(); marqueeStrobe(2400);   // 🎰 777 JACKPOT — bulbs light up ONLY here (slots 3 of a kind)
                camPunch(7); doShake(13); Sfx.big(); }
              else if(ck==='s2'){ coinBurst(dd.body.position,12); camPunch(4); } }
            if(st.sparks){ st.sparks.forEach(col=>sparkBurst(sp.x,sp.y,col,10+ci*3)); if(!G._skipCast){Sfx.good();camPunch(1.6);} } }
          else { const sp=w2p(camPoint(CINE.panelX,CINE.rowTopY-ci*CINE.rowStep,CINE.dieDist)); pop(st.pop.t,sp.x,sp.y,st.pop.c,16+szB,tr); }
        }catch(e){}
        const fP=curP,fM=curM,tP=st.p,tM=st.m; curP=st.p; curM=st.m;
        const multJump=(tM>=fM*1.5&&tM-fM>=1);               // a big multiplier just fired
        try{ bumpPan(pan,multJump); }catch(e){}
        if(multJump&&!G._skipCast){ hitStop(70); doShake(5); camPunch(5); }
        if(G._skipCast){ setPanel(pan,tP,tM); }
        else { const t0=performance.now(); const td=CINE.tStep*spd(); let lastTick=0;
          while(true){ const nw=performance.now(), k=Math.min(1,(nw-t0)/td);
            setPanel(pan,fP+(tP-fP)*k,fM+(tM-fM)*k);
            if(nw-lastTick>42){ Sfx.tick(tickN++); lastTick=nw; }   // chip-chip-chip count-up
            if(k>=1)break; await sleep(16);} }
        await cs(80);
      }
      setPanel(pan,c.finalP,c.finalM);
      pan.querySelector('.tsub').textContent='= '+c.score; pan.classList.add('done'); pan.classList.remove('live');
      try{ bumpPan(pan,true); }catch(e){}
      Sfx.good(); c.rowDice.forEach(resetGlow);
      grand+=c.score; gt.textContent=Math.round(grand);
      gt.classList.add('bump'); setTimeout(()=>gt.classList.remove('bump'),180);
      try{Sfx.riserBump();}catch(e){}                        // the riser ratchets up with every banked combo
      await cs(CINE.tBank);
    }
    for(const ev of plan.endEvents){ const b=document.createElement('div'); b.className='tpanel done'; b.style.position='static'; b.style.margin='4px auto';
      b.innerHTML=`<div class="tnm">🔁 ${ev.label}</div><div class="tsub">+${ev.amount}</div>`; tally.appendChild(b);
      grand+=ev.amount; gt.textContent=Math.round(grand); Sfx.good(); await cs(CINE.tBank); }
    if(plan.vigVoid){ grand=0; gt.textContent='0'; gt.classList.add('void'); }

    try{Sfx.riserStop();}catch(e){}                          // release the riser into the bank chord
    if(!G._skipCast&&grand>0){ flashFx(); hitStop(110); camPunch(6); }    // freeze-frame + gold flash: the slam
    gt.classList.add('final'); Sfx.big(); doShake(Math.min(6+grand*.008,16));

    // no auto-close: reveal the Next button and let the player study the math for as long as they like
    skipBtn.hidden=true; nextBtn.hidden=false; _canContinue=true;   // scoring done — a click/tap/key anywhere now continues
    await nextP;
    _canContinue=false; nextBtn.hidden=true; cbtns.classList.remove('on');
    G._skipCast=false;   // always play the return fluidly, even if Skip was used during the count

    // slide dice/cards back to exactly where they were before the count
    Sfx.whoosh(false);
    const back=(async()=>{ const t0=performance.now(); const o0=_darkMesh.material.opacity; const bd=G._skipCast?1:300*spd();
      while(true){ const k=Math.min(1,(performance.now()-t0)/bd); _darkMesh.material.opacity=o0*(1-k); if(k>=1)break; await sleep(16);} })();
    await Promise.all([ back,
      _tweenBodies(restore.filter(r=>scoringSet.has(r.d)||casSet.has(r.d)).map(r=>({d:r.d,to:r.pos})),300*spd()),
      ...cardAnim.map(ca=>_tweenObj(ca.m,ca.world.pos,ca.world.quat,ca.orig.scale,300*spd())) ]);
  } finally { doCleanup(); }
}

// ✧ SHIMMER card break — a general feature of the Shimmer enchant (not tied to any one boss):
// each Cast, every Shimmer card has a 20% chance to shatter and be DESTROYED FOR GOOD.
// A card counts as Shimmer if it carries the enchant itself, or while The Dry Well curses the whole hand.
// Destroyed ids are banked in G._brokeCardIds and removed from your saved deck when the round is won.
function shimmerCardBreak(){
  if(!Array.isArray(G.cards)||!G.cards.length)return;
  const cursed=!!(G.bossFx&&G.bossFx.shimmerCards);
  const survivors=[]; const broken=[];
  G.cards.forEach(c=>{ const isShim=cursed||c.ench==='shimmer'; if(isShim&&Math.random()<0.2)broken.push(c); else survivors.push(c); });
  if(!broken.length)return;
  G.cards=survivors;
  G._brokeCardIds=(G._brokeCardIds||[]).concat(broken.map(c=>c.id));   // persisted to the deck on round-win
  if(G.wardedIdx!=null&&G.wardedIdx>=G.cards.length)G.wardedIdx=-1;     // keep the stolen index valid if the row shrank
  try{ build3DCards(); }catch(_){}
  try{ renderJokerPanel(); }catch(_){}
  try{ Sfx.bad(); }catch(_){}
  try{ toast('✧ Shimmer shatters '+broken.map(c=>c.name).join(', ')+' — destroyed for good!'); }catch(_){}
}
async function doCast(){
  if(G.phase!=='settled')return;
  G.phase='casting'; refreshButtons(); hint('');
  el('cascade').innerHTML='';
  readFaces();
  // 🎰 the slots physically pop out their two shadow dice and roll the reels before the count
  const slotDice=dice.filter(d=>d.color==='slots');
  if(slotDice.length && bestPartition(dice.map(d=>d.value)).moves.length){
    for(const cd of slotDice){
      try{ setGlow(cd,0xffd97a,.8); }catch(e){}
      hint('The slots spin…');
      try{ cd._pull=await slotsPull(cd); }catch(e){ cd._pull=null; }
      hint('');
      try{ resetGlow(cd); }catch(e){}
      await sleep(260);
    }
  }
  const plan=buildCastPlan();
  if(!plan.combos.length){ hint('No combos! (matches & runs only)'); Sfx.bad(); await sleep(700); }
  else {
    _cineCleaned=false; _cineCleanup=null;
    // watchdog: a stalled or broken cinematic can never soft-lock the game or lose the score
    // (generous — the player may sit on the Next screen studying the math)
    try{ await Promise.race([ playCastCinematic(plan), sleep(180000) ]); }
    catch(e){ if(!window.__cineErrLogged){window.__cineErrLogged=1; console.error('[dicero cast]',e);} }
    if(!_cineCleaned && _cineCleanup){ try{_cineCleanup();}catch(_){}}
    G.score+=plan.total;   // authoritative bank (matches the animated total)
  }
  shimmerCardBreak();   // ✧ Shimmer cards may shatter and be destroyed for good after the Cast
  G.casts--;
  refreshHUD();
  if(G.score>=G.req){ passRound(); return; }
  if(G.casts<=0){ bust(); return; }
  const bfxE=G.bossFx||{};
  if(bfxE.castEscalate){ G.req=Math.round(G.req*(1+bfxE.castEscalate)); refreshHUD(); hint('♟ Speed Chess — the target climbs to '+G.req+'!'); }   // ♟ target rises for every Cast spent
  startCastTurn();
}

// ------------ turn / round flow ------------
function startRound(){
  G.req=reqFor(G.round); G.score=0; G.casts=3;
  G.maxRerolls=2+cardMult('rabbit');
  startCastTurn(true);
}
function startCastTurn(first){
  G.rerolls=G.maxRerolls;
  G._rerolledTurn=false;   // per-cast tracker (read by Quicksilver Quill)
  const bfx=G.bossFx||{};
  G._openLocked = !!bfx.lockFirst;                       // ☠ The Croupier: can't hold the opening roll
  if(bfx.hideColors){ G._blackout=true; applyBlackout(true); }   // ☠ The Blackout: hide colours till CAST
  dice.forEach(d=>{d.held=false;resetGlow(d);});
  G.phase='idle';
  hint(first?'Roll your dice!':'Roll again!');
  refreshHUD(); refreshButtons();
}
// ☠ Loaded Table — shove all loose dice to one random side after a roll settles
async function bossLoadedSlide(){
  const bfx=G.bossFx||{}; if(!bfx.slide)return;
  const s=(Math.random()<0.5)?-1:1;
  const dir=RA.clone().multiplyScalar(s*6.2);
  let moved=0;
  dice.forEach(d=>{ if(d.held)return; d.body.type=CANNON.Body.DYNAMIC; d.body.wakeUp();
    d.body.velocity.set(dir.x,1.6,dir.z);
    d.body.angularVelocity.set(0,0,0); moved++; });
  hint(s>0?'☠ Loaded Table — the dice slide RIGHT':'☠ Loaded Table — the dice slide LEFT');
  if(moved){ await waitSettle(); readFaces(); }
}
// ☠ The Blackout — swap non-casino dice to plain faces (colours stay in d.color for scoring)
function applyBlackout(on){
  dice.forEach(d=>{
    if(d.color==='wheel'||d.color==='bos'||d.color==='slots'||d.color==='chip')return;
    if(on){
      if(!d._hiddenMats)d._hiddenMats=faceMats('plain');
      if(!d._trueMats)d._trueMats=d.mesh.material;
      d.mesh.material=d._hiddenMats; d.mats=d._hiddenMats; d._hidden=true;
    } else if(d._trueMats){
      d.mesh.material=d._trueMats; d.mats=d._trueMats; d._hidden=false;
    }
  });
}
async function doRoll(){
  if(G.phase!=='idle')return;
  G.phase='rolling'; refreshButtons(); hint('');
  throwDice(dice);
  await waitSettle(); readFaces();
  resolveChips(dice);   // 🪙 the chip pays the moment everything comes to rest
  await bossLoadedSlide();   // ☠ Loaded Table
  G.phase='settled'; Sfx.settle(); refreshButtons();
  hint('Tap up to 5 dice to HOLD · re-roll · powers · CAST');
}
async function doReroll(){
  if(G.phase!=='settled'||G.rerolls<=0)return;
  G.rerolls--; G._rerolledTurn=true; G._openLocked=false;   // a re-roll frees the Croupier lock
  const held=dice.filter(d=>d.held),loose=dice.filter(d=>!d.held);
  held.forEach(d=>{d.body.type=CANNON.Body.STATIC;d.body.velocity.set(0,0,0);d.body.angularVelocity.set(0,0,0);});
  refreshHUD();
  if(!loose.length){refreshButtons();return;}
  G.phase='rolling'; refreshButtons(); hint('');
  throwDice(loose);
  await waitSettle(); readFaces();
  resolveChips(loose);   // 🪙 a re-rolled chip flips again; a held chip sits out
  await bossLoadedSlide();   // ☠ Loaded Table
  G.phase='settled'; Sfx.settle(); refreshButtons();
  hint('Tap up to 5 dice to HOLD · re-roll · powers · CAST');
}

function passRound(){
  Sfx.big();
  /* round-win confetti + coin rain removed */
  const bfxP=G.bossFx||{};
  const base=3, castBonus=Math.min(G.casts,1), interest=bfxP.noInterest?0:Math.min(Math.floor(G.gold/(hasFlag('purse')?4:5)),5), merch=hasFlag('merchant')?3:0, bossBonus=INIT.isBoss?4:0;
  let earned=base+castBonus+interest+merch+bossBonus;
  if(bfxP.goldMul!=null)earned=Math.max(0,Math.round(earned*bfxP.goldMul));   // 💸 Bankrupt: half earnings
  G.gold+=earned;
  G.phase='shop'; refreshHUD(); refreshButtons();
  const _win = BRIDGE
    ? ()=>send({type:'roundWon',gold:G.gold,earned,score:Math.round(G.score),req:G.req,isBoss:INIT.isBoss,dice:dice.map(d=>({col:d.color,ench:d.ench||null})),brokeCards:(G._brokeCardIds||[])})
    : ()=>{ el('shop-earn').textContent=`+${base} pass · +${castBonus} unused casts · +${interest} interest = +${earned} 🪙`; buildShop(); el('ov-shop').classList.remove('hidden'); };
  // ☠ boss rounds: shatter the boss token and wait for the pieces to settle on the felt before the round ends
  if(INIT.isBoss && window.BOSSTOK && BOSSTOK.active()){ BOSSTOK.shatter(); BOSSTOK.onSettled(_win, 5000); }
  else { setTimeout(_win, BRIDGE?600:0); }
}
function bust(){
  Sfx.fail(); G.phase='over';
  try{ if(window.BOSSTOK)BOSSTOK.clear(); }catch(_){}
  if(BRIDGE){ setTimeout(()=>send({type:'roundLost',score:Math.round(G.score),req:G.req}),500); return; }
  el('end-text').innerHTML=`Round <em>${G.round}</em> got you — <em>${Math.round(G.score)}</em> of <em>${G.req}</em> points.
    The house keeps your gold. Roll again?`;
  el('ov-end').classList.remove('hidden');
}

    desc:COLORS[col].eff+'. Adds a die (max 10).',price:4,buy(){if(dice.filter(d=>d.ench!=='negative').length<10)addDie(col);}});   // Negative dice take no space
  const chart=pick(CHART_DB);
  const tgts=(chart.fam||[chart.tgt]);
  offers.push({ico:'🌌',name:chart.name,desc:'Star Chart · levels '+tgts.join(', ')+'.',price:5,
    buy(){applyChart(chart.id);}});
  offers.forEach(o=>{
    const div=document.createElement('div');div.className='pick'+((G.gold<o.price)?' dis':'');
    div.innerHTML=`<div class="pico">${o.ico}</div><div class="pname">${o.name}</div>
      <div class="pdesc">${o.desc}</div><div class="price">${o.price} 🪙</div>`;
    div.onclick=()=>{if(G.gold<o.price)return;G.gold-=o.price;Sfx.buy();o.buy();div.classList.add('dis');refreshHUD();

      [...row.children].forEach((ch,i)=>{if(!ch.classList.contains('dis')&&G.gold<offers[i].price)ch.classList.add('dis');});};

function bboxOf(poly){ let a=1e9,b=1e9,c=-1e9,d=-1e9; for(const p of poly){ a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y);} return {minX:a,minY:b,maxX:c,maxY:d,w:c-a,h:d-b}; }
function area2(poly){ let s=0; for(let i=0;i<poly.length;i++){ const A=poly[i],B=poly[(i+1)%poly.length]; s+=A.x*B.y-B.x*A.y; } return s*0.5; }
function centroid(poly){ let x=0,y=0; for(const p of poly){ x+=p.x;y+=p.y; } return {x:x/poly.length,y:y/poly.length}; }
function clipEdge(poly,ax,ay,bx,by){ const out=[],n=poly.length; if(!n)return out; const dx=bx-ax,dy=by-ay; const side=(px,py)=>dx*(py-ay)-dy*(px-ax);
  for(let i=0;i<n;i++){ const A=poly[i],B=poly[(i+1)%n],sa=side(A.x,A.y),sb=side(B.x,B.y),ain=sa>=-1e-9,bin=sb>=-1e-9; if(ain)out.push(A); if(ain!==bin){const t=sa/(sa-sb);out.push({x:A.x+t*(B.x-A.x),y:A.y+t*(B.y-A.y)});} } return out; }
function clipByConvex(subject,clip){ let poly=subject; for(let i=0;i<clip.length&&poly.length;i++){ const A=clip[i],B=clip[(i+1)%clip.length]; poly=clipEdge(poly,A.x,A.y,B.x,B.y); } return poly; }
function clipHalf(poly,nx,ny,dd){ const out=[],n=poly.length; if(!n)return out;
  for(let i=0;i<n;i++){ const A=poly[i],B=poly[(i+1)%n],da=nx*A.x+ny*A.y-dd,db=nx*B.x+ny*B.y-dd,ain=da<=1e-9,bin=db<=1e-9; if(ain)out.push(A); if(ain!==bin){const t=da/(da-db);out.push({x:A.x+t*(B.x-A.x),y:A.y+t*(B.y-A.y)});} } return out; }

function fractureVoronoi(sil,cols,rows,jitter){ const bb=bboxOf(sil),seeds=[],cw=bb.w/cols,ch=bb.h/rows;
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++) seeds.push({x:bb.minX+(i+0.5)*cw+(rand()-0.5)*cw*jitter,y:bb.minY+(j+0.5)*ch+(rand()-0.5)*ch*jitter});
  const B=Math.max(bb.w,bb.h)*2,shards=[];
  for(let s=0;s<seeds.length;s++){ let cell=[{x:-B,y:-B},{x:B,y:-B},{x:B,y:B},{x:-B,y:B}];
    for(let t=0;t<seeds.length;t++){ if(t===s)continue; const mx=(seeds[s].x+seeds[t].x)/2,my=(seeds[s].y+seeds[t].y)/2,nx=seeds[t].x-seeds[s].x,ny=seeds[t].y-seeds[s].y; cell=clipHalf(cell,nx,ny,nx*mx+ny*my); if(cell.length<3)break; }
    if(cell.length<3)continue; const sh=clipByConvex(sil,cell); if(sh.length>=3&&Math.abs(area2(sh))>0.02)shards.push(sh); } return shards; }

  const arc=(r,a0,a1)=>{const pts=[],st=Math.max(2,Math.ceil((a1-a0)/0.3));for(let i=0;i<=st;i++){const a=a0+(a1-a0)*i/st,rr=r*(1+(rand()-0.5)*0.03);pts.push({x:Math.cos(a)*rr,y:Math.sin(a)*rr});}return pts;};
  for(let i=0;i<K;i++){const a0=ang[i],a1=ang[i+1]; shards.push([{x:0,y:0},...arc(rings[1],a0,a1)]); shards.push([...arc(rings[1],a0,a1),...arc(rings[2],a1,a0)]);} return shards; }
function fractureAnnular(Ri,Ro){ const shards=[],K=13,rings=[Ri,(Ri+Ro)/2,Ro]; let ang=[]; for(let i=0;i<K;i++)ang.push(i/K*Math.PI*2+(rand()-0.5)*0.18); ang.push(ang[0]+Math.PI*2);
  const arc=(r,a0,a1)=>{const pts=[],st=Math.max(2,Math.ceil((a1-a0)/0.3));for(let i=0;i<=st;i++){const a=a0+(a1-a0)*i/st;pts.push({x:Math.cos(a)*r,y:Math.sin(a)*r});}return pts;};
  for(let b=0;b<2;b++){const r0=rings[b],r1=rings[b+1];for(let i=0;i<K;i++){const a0=ang[i],a1=ang[i+1];shards.push([...arc(r0,a0,a1),...arc(r1,a1,a0)]);}} return shards; }

  g.strokeStyle=P.rimDark; g.lineWidth=0.20; path(sil); g.stroke();
  g.strokeStyle=P.rim; g.lineWidth=0.12; path(sil); g.stroke();
  g.strokeStyle=tint(P.rim,0.6); g.lineWidth=0.035; path(sil); g.stroke();

/* dedicated debris material — same cannon world/gravity/felt as the dice, but
   low restitution so shards clatter down and come to rest (a die is a bouncy

const shardMat=new CANNON.Material('shard');
world.addContactMaterial(new CANNON.ContactMaterial(shardMat,groundMat,{friction:.55,restitution:.12}));

function buildTokenMesh(boss){
  const t=makeTokenTexture(boss);
  const capMat=new THREE.MeshStandardMaterial({map:t.tex,roughness:.5,metalness:.28,side:THREE.DoubleSide});
  const wallMat=new THREE.MeshStandardMaterial({color:new THREE.Color(t.P.rim),roughness:.34,metalness:.72});
  const shp=new THREE.Shape(t.sil.map(p=>new THREE.Vector2(p.x,p.y)));
  if(boss.shape==='ring'){ const hole=new THREE.Path(); const h=circlePoly(0.72,56); hole.moveTo(h[0].x,h[0].y); for(let i=1;i<h.length;i++)hole.lineTo(h[i].x,h[i].y); shp.holes.push(hole); }
  const geo=new THREE.ExtrudeGeometry(shp,{depth:THICK,bevelEnabled:false}); geo.translate(0,0,-THICK/2);
  const pos=geo.attributes.position, uv=new Float32Array(pos.count*2);
  for(let i=0;i<pos.count;i++){ const x=pos.getX(i),y=pos.getY(i); uv[i*2]=(x-t.bb.minX)/t.bb.w; uv[i*2+1]=(t.bb.maxY-y)/t.bb.h; }
  geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  const mesh=new THREE.Mesh(geo,[capMat,wallMat]); mesh.castShadow=true;
  return {mesh, bb:t.bb, tex:t.tex, sil:t.sil, P:t.P};
}

function clearFn(){
  if(group) scene.remove(group);
  group=null; tokenMesh=null; curId=null;
  shards.forEach(s=>{ scene.remove(s.mesh); try{world.removeBody(s.body);}catch(_){} });
  shards=[];
}

function seatFn(gameId,name,ability){
  clearFn();
  const id=IDMAP[gameId]||gameId, meta=TOKMETA[id];
  if(!meta||!PAL[id]) return;                       // unknown boss -> no token
  curId=id;
  const boss={id, shape:meta.shape, frac:meta.frac, name, ability};
  const built=buildTokenMesh(boss);
  group=new THREE.Group();
  group.position.copy(seatWorld());
  group.quaternion.copy(faceCamQuat(group.position));
  group.scale.setScalar(SCALE);
  group.add(built.mesh); tokenMesh=built.mesh;
  group.userData={boss, bb:built.bb, tex:built.tex, sil:built.sil, P:built.P};
  scene.add(group);
}

  group.updateMatrixWorld(true);

function allSettledFn(){
  if(!shards.length) return true;
  for(const s of shards){ const b=s.body;
    if(b.sleepState===CANNON.Body.SLEEPING) continue;
    if(b.velocity.length()<0.4 && b.angularVelocity.length()<0.6) continue;

  const iv=setInterval(()=>{

    if(!calmed && el>2200){ calmed=true; shards.forEach(s=>{ s.body.velocity.scale(0.3,s.body.velocity); s.body.angularVelocity.scale(0.3,s.body.angularVelocity); }); }

// ------------ loop ------------
// Hard containment: no matter how high a die bounces, it can never leave the
// play area. We decompose the body's world position into the tilted table's
// (u = width, w = depth, l = height) axes, clamp u/w to just inside the rails
// and l to just under the ceiling, then rebuild the world position and null
// out any velocity that was pushing it past the boundary. This is a backstop
// on top of the physics walls, so it only fires on the rare high-bounce escape.
const _CU=HX-0.9-DIE/2, _CW=HZ-0.9-DIE/2, _CL=7.0;   // inner-rail faces minus half a die; ceiling underside
function containDie(body){
  const p=body.position, vel=body.velocity;
  const dx=p.x-O.x, dy=p.y-O.y, dz=p.z-O.z;
  let u=dx*RA.x+dy*RA.y+dz*RA.z;
  let w=dx*PA.x+dy*PA.y+dz*PA.z;
  let l=dx*N.x +dy*N.y +dz*N.z;
  const ou=u, ow=w, ol=l;
  if(u> _CU)u= _CU; else if(u<-_CU)u=-_CU;

// ---- randomised pack tiers ----------------------------------------------------
// Each shelf slot keeps its KIND (card / con / dice) but rolls a random TIER,
// weighted toward the cheaper packs. Rerolled on every shop visit and on refresh.
const TIER_W=[['reg',0.40],['sup',0.35],['meg',0.25]];   // fixed odds — never change
function rollTier(){ let r=Math.random(),a=0; for(const [t,w] of TIER_W){ a+=w; if(r<a)return t; } return 'meg'; }
function disposeMesh(m){ if(!m)return; m.traverse(o=>{ if(o.isMesh){ if(o.geometry&&o.geometry.dispose)o.geometry.dispose();
  const mats=Array.isArray(o.material)?o.material:[o.material];
  mats.forEach(mm=>{ if(!mm)return; if(mm.map&&mm.map.dispose)mm.map.dispose(); if(mm.dispose)mm.dispose(); }); } }); }
function setItemTier(x,tier){                              // swap a shelf item onto a new tier of the same kind
  const kind=x.id.split('_')[0];                          // 'card' | 'con' | 'dice'
  const id=kind+'_'+tier, o=OBJS[id]; if(!o)return;
  const builder=(kind==='dice')?diceMesh:packMesh;
  if(x.mesh){ x.root.remove(x.mesh); disposeMesh(x.mesh); }
  const b=builder(o,id); b.mesh.position.y=b.off; x.root.add(b.mesh);
  x.mesh=b.mesh; x.o=o; x.id=id;
}
function rerollShelves(){                                  // fresh random tiers + un-sell every shelf slot
  items.forEach(x=>{ if(x.o){ setItemTier(x,rollTier()); x.sold=false; x.sink=0; x.root.visible=true; } });
}

function roundedPuck(r,h,b){
  const hy=h/2,pts=[],N=5;
  pts.push(new THREE.Vector2(0,-hy));pts.push(new THREE.Vector2(r-b,-hy));
  for(let i=0;i<=N;i++){const t=-Math.PI/2+i/N*(Math.PI/2);pts.push(new THREE.Vector2(r-b+Math.cos(t)*b,-hy+b+Math.sin(t)*b));}
  for(let i=0;i<=N;i++){const t=i/N*(Math.PI/2);pts.push(new THREE.Vector2(r-b+Math.cos(t)*b,hy-b+Math.sin(t)*b));}
  pts.push(new THREE.Vector2(0,hy));
  return new THREE.LatheGeometry(pts,48);
}

  const dirs=[[1,0,t2],[1,0,-t2],[-1,0,t2],[-1,0,-t2],[t2,1,0],[t2,-1,0],[-t2,1,0],[-t2,-1,0],[0,t2,1],[0,t2,-1],[0,-t2,1],[0,-t2,-1]]

/* ---------- enchant wheel ---------- */
const SEG_N=10, SEG_A=360/SEG_N;   // fixed 10-slot wheel, 36° per segment
const ENCH_POOL=['prism','exalted','shimmer','plasma','negative'];
// Build a fresh 10-slot layout: 2 duds (NOTHING) + 8 random rewards. No enchant appears
// more than twice, each reward randomly targets a die or a card, and every slot's position
// on the wheel is shuffled — so no two spins look the same.
function buildSegs(){
  const bag=[]; ENCH_POOL.forEach(e=>bag.push(e,e));   // at most 2 of each enchant available
  for(let i=bag.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[bag[i],bag[j]]=[bag[j],bag[i]];}
  const segs=[{type:'lose'},{type:'lose'}];            // the two "gives you nothing" spaces
  bag.slice(0,8).forEach(ench=>segs.push({type:Math.random()<0.5?'die':'card',ench}));   // 8 rewards, ≤2 of any enchant
  for(let i=segs.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[segs[i],segs[j]]=[segs[j],segs[i]];}   // random placement
  return segs;
}
let SEGS=buildSegs();
const wheelWrap=byId('wheelWrap'),wheelCv=byId('wheelCv'),
 spinBtn=byId('spinBtn'),wheelLeave=byId('wheelLeave');
let wheelRot=0, pendingEnch=null;
function drawWheel(){
  const g=wheelCv.getContext('2d'),S=640,cx=S/2,cy=S/2,R=S/2-8;
  g.clearRect(0,0,S,S);
  SEGS.forEach((seg,i)=>{
    const a0=(-90+i*SEG_A)*Math.PI/180, a1=a0+SEG_A*Math.PI/180;
    g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a0,a1);g.closePath();
    g.fillStyle=seg.type==='lose'?(i?'#2a2231':'#241c2a'):(i%2?'#241a38':'#2c2144');
    g.fill();
    g.strokeStyle='#c99a3f';g.lineWidth=4;g.stroke();
    // content
    const mid=a0+(a1-a0)/2, tr=R*0.66;
    g.save();g.translate(cx+Math.cos(mid)*tr,cy+Math.sin(mid)*tr);g.rotate(mid+Math.PI/2);
    g.textAlign='center';g.textBaseline='middle';
    if(seg.type==='lose'){ g.font='700 52px Fredoka,sans-serif';g.fillStyle='#8a7f96';g.fillText('\u2716',0,-14);
      g.font='700 22px Fredoka,sans-serif';g.fillText('NOTHING',0,30);}
    else{ const E=ENCHDEF[seg.ench];
      g.font='56px serif';g.fillText(seg.type==='card'?'\ud83c\udccf':'\ud83c\udfb2',0,-24);
      g.font='700 40px Fredoka,sans-serif';g.fillStyle=E.col;g.fillText(E.sym,0,26);
      g.font='700 20px Fredoka,sans-serif';g.fillText(E.n.toUpperCase(),0,58);}
    g.restore();
  });
  g.beginPath();g.arc(cx,cy,44,0,6.3);g.fillStyle='#2a1a0e';g.fill();
  g.strokeStyle='#c99a3f';g.lineWidth=6;g.stroke();
  g.font='700 26px Fredoka,sans-serif';g.fillStyle='#ffd97a';g.textAlign='center';g.textBaseline='middle';g.fillText('\u2726',cx,cy);
}

/* hover a wheel wedge \u2192 explain the reward (name, whether it lands on a die/card, and what it does).
   The wheel is a rotating DOM canvas, so we map the cursor angle back through its CSS rotation. */
function wheelSegAt(e){
  const r=wheelCv.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const dx=e.clientX-cx, dy=e.clientY-cy, dist=Math.hypot(dx,dy), rad=r.width/2;
  if(dist>rad*0.98 || dist<rad*0.16) return null;                 // outside the ring or over the hub
  let ang=Math.atan2(dy,dx)*180/Math.PI - (wheelRot%360);         // undo the wheel's current spin
  let rel=(((ang+90)%360)+360)%360;                               // wedge 0 starts at -90\u00b0
  const i=Math.floor(rel/SEG_A)%SEG_N;
  return SEGS[i]||null;
}

function drawZap(ax,ay,bx,by,color,dur){
  const g=zapCv.getContext('2d'),t0=performance.now();dur=dur||600;
  function frame(){const el=(performance.now()-t0)/dur;g.clearRect(0,0,zapCv.width,zapCv.height);
    if(el>=1)return;
    const flick=(Math.floor(el*14)%2===0)?1:0.55;
    for(let pass=0;pass<2;pass++){
      g.beginPath();const segs=14;
      for(let i=0;i<=segs;i++){const f=i/segs;
        const jx=(i>0&&i<segs)?(Math.random()-0.5)*54:0,jy=(i>0&&i<segs)?(Math.random()-0.5)*54:0;
        const x=ax+(bx-ax)*f+jx,y=ay+(by-ay)*f+jy;i?g.lineTo(x,y):g.moveTo(x,y);}
      g.strokeStyle=pass?'#ffffff':color;g.lineWidth=pass?3:8;g.globalAlpha=(pass?0.9:0.6)*flick;
      g.shadowColor=color;g.shadowBlur=pass?10:24;g.lineCap='round';g.lineJoin='round';g.stroke();
    }
    g.globalAlpha=1;g.shadowBlur=0;requestAnimationFrame(frame);
  }
  frame();
}

function glFloor(n){ n=Math.max(1,n|0); glSet('best_floor', n, true);

const GL_CHAL_TOTAL=12;   // keep in step with CHAL below (and games.json's challenges_done total)

// Leave → shut the game down. Browsers only allow window.close() on tabs opened

  try{ window.close(); }catch(_){}
  try{ window.open('','_self'); window.close(); }catch(_){}
  setTimeout(()=>{

/* ---------- auto-save ----------
   The whole run lives in DC, which is authoritative at every stage boundary
   (round won / shop done / map choice). We snapshot it to localStorage at those
   points; a quit mid-combat resumes that stage fresh from the Floor map. */
const RUN_STORE='dicero.run.v1';
function saveRun(){ try{ if(DC) localStorage.setItem(RUN_STORE, JSON.stringify({v:1, dc:DC})); }catch(_){} }
function loadRun(){ try{ const r=localStorage.getItem(RUN_STORE); if(r){ const o=JSON.parse(r); if(o&&o.v===1&&o.dc) return o.dc; } }catch(_){} return null; }
function clearRun(){ try{ localStorage.removeItem(RUN_STORE); }catch(_){} }
function hasSavedRun(){ return !!loadRun(); }

function mount(name){ if(frames[name].getAttribute('srcdoc')) return; ready[name]=false; queue[name]=[]; frames[name].srcdoc=TEMPLATES[name]; }
function postCover(target,msg){ post('round',{type:'cover',target,msg}); }

function roundState(isBoss){
  const cfg=DC.challenge?CHAL[DC.challenge]:null;
  const forceBoss=!!(cfg&&cfg.allBoss);                      // 👹 Boss Rush / 🔗 Gauntlet: every round is a boss
  const b=(isBoss||forceBoss)?currentBoss():null;
  let cfx=null;
  if(cfg){ cfx=Object.assign({}, cfg.every||{}); if(DC.challenge==='purist'&&DC.puristCombo)cfx.onlyCombo=DC.puristCombo; if(!Object.keys(cfx).length)cfx=null; }
  if(cfg&&cfg.stack&&DC.stackFx&&Object.keys(DC.stackFx).length){ cfx=mergeFx(DC.stackFx, cfx||{}); }   // 🔗 carry every previous boss's ability
  return {dice:DC.dice,cards:DC.cards.map(c=>({id:c.id,ench:c.ench||null})),comboLvl:DC.comboLvl,
  gold:DC.gold,round:DC.roundNo,isBoss:!!(isBoss||forceBoss),
  floorNum:DC.floorNum, cardCap:DC.cardCap,
  chalFx:cfx, chalName:cfg?cfg.name:null,
  bossName:b?b.name:null,
  boss:b?{id:b.id,name:b.name,ability:b.ability,cat:b.cat,tier:b.tier,fx:b.fx}:null}; }
function shopState(){ return {gold:DC.gold,dice:DC.dice,jokers:DC.cards,comboLvl:DC.comboLvl,
  noSell:!!(DC.challenge&&CHAL[DC.challenge]&&CHAL[DC.challenge].noSell)}; }
// real target for each round/boss stage on the current floor, so the map shows the truth
function stageTargets(){ const t={}; let rn=DC.roundNo-DC.stageIdx>0?DC.roundNo:DC.roundNo;
  // recompute from the floor's first round: roundNo advances once per round/boss beaten
  let base=DC.roundNo - FLOOR.slice(0,DC.stageIdx).filter(s=>s.type==='round'||s.type==='boss').length;
  FLOOR.forEach((s,i)=>{ if(s.type==='round'){ t[i]=pReqFor(base).toLocaleString('en-US'); base++; }
    else if(s.type==='boss'){ const b=currentBoss(); const mul=(b&&b.fx&&b.fx.targetMul)||1; t[i]=Math.round(pReqFor(base)*mul).toLocaleString('en-US'); base++; } });
  return t; }
function mapState(){ return {floorNum:DC.floorNum,stageIdx:DC.stageIdx,stored:DC.stored,gold:DC.gold,boss:bossPanel(),targets:stageTargets(),
  cards:(DC.cards||[]).map(c=>{const m=CARD_META[c.id]||{}; return {id:c.id,ench:c.ench||null,n:m.n,e:m.e,r:m.r,ds:m.d};})}; }

/* ---- persistent joker rail: always visible, hover to enlarge/tilt, drag to reorder ---- */
const RAIL=document.getElementById('jokerRail');
const LAVAP={common:['#4fb86a','#1f7a3e','#7fe0a0','#0a2416','#2a5a3a','#9c7a4e'],
 rare:['#3f7ad0','#26489a','#66b0f0','#0c1734','#2a3a7a','#5c8fd6'],
 fabled:['#ff9d24','#c8500f','#ffd257','#2a1403','#8a5a1e','#e8b23a']};
const ENCHM={prism:['◆','#8fe6ff'],exalted:['☀','#ffcf5a'],shimmer:['✧','#ff7ce0'],plasma:['⚡','#ff5a5a']};
const RARN={common:'Common',rare:'Rare',fabled:'Fabled'};
let railDrag=null;
function jkDom(c,idx){
  const meta=CARD_META[c.id]||{n:c.id,e:'🃏',r:'common',d:''}, pal=LAVAP[meta.r]||LAVAP.common;
  const d=document.createElement('div'); d.className='jk'; d.dataset.idx=idx;
  d.style.setProperty('--l1',pal[0]);d.style.setProperty('--l2',pal[1]);d.style.setProperty('--l3',pal[2]);
  d.style.setProperty('--ld',pal[3]);d.style.setProperty('--fr',pal[4]);d.style.setProperty('--rc',pal[5]);
  const eb=(c.ench&&ENCHM[c.ench])?`<div class="eb" style="background:${ENCHM[c.ench][1]}">${ENCHM[c.ench][0]}</div>`:'';
  d.innerHTML=`<div class="lav"><span class="bl l1"></span><span class="bl l2"></span><span class="bl l3"></span></div>`
   +eb+`<div class="rt">${RARN[meta.r]||''}</div><div class="ic">${meta.e}</div>`
   +`<div class="bx"><div class="nm">${meta.n}</div><div class="ds">${meta.d}</div></div><div class="frm"></div><div class="glare"></div>`;
  d.addEventListener('pointerenter',()=>{ if(!railDrag)d.classList.add('hot'); });
  d.addEventListener('pointermove',e=>{ if(railDrag)return; const r=d.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;      // 0..1 position of cursor on the card
    const dx=px-0.5, dy=py-0.5;
    d.style.transform=`translateY(-10px) scale(1.18) rotateX(${(-dy*20).toFixed(1)}deg) rotateY(${(dx*22).toFixed(1)}deg)`;
    d.style.setProperty('--gx',(px*100).toFixed(1)+'%'); d.style.setProperty('--gy',(py*100).toFixed(1)+'%');
    d.style.zIndex=60; });
  d.addEventListener('pointerleave',()=>{ if(railDrag&&railDrag.el===d)return; d.classList.remove('hot'); d.style.transform=''; d.style.zIndex=''; });
  d.addEventListener('pointerdown',e=>startRailDrag(e,d));
  return d;
}
function renderRail(){
  if(!RAIL||railDrag)return;
  RAIL.innerHTML='';
  if(!DC||!DC.cards)return;
  DC.cards.slice(0,5).forEach((c,i)=>RAIL.appendChild(jkDom(c,i)));
}
function startRailDrag(e,d){
  const cards=[...RAIL.querySelectorAll('.jk')]; if(cards.length<2)return;
  const rect=d.getBoundingClientRect();
  d.style.transform=''; d.classList.add('drag');
  railDrag={el:d,idx:+d.dataset.idx,startY:e.clientY,stride:rect.height+8,n:cards.length,cards,tgt:+d.dataset.idx};
  try{d.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
}
window.addEventListener('pointermove',e=>{
  if(!railDrag)return;
  const dy=e.clientY-railDrag.startY;
  railDrag.el.style.transform=`translateY(${dy}px) scale(1.06)`;
  let ti=railDrag.idx+Math.round(dy/railDrag.stride); ti=Math.max(0,Math.min(railDrag.n-1,ti)); railDrag.tgt=ti;
  railDrag.cards.forEach((c,j)=>{ if(c===railDrag.el)return; let s=0;
    if(railDrag.idx<ti && j>railDrag.idx && j<=ti)s=-railDrag.stride;
    else if(railDrag.idx>ti && j>=ti && j<railDrag.idx)s=railDrag.stride;
    c.style.transform=s?`translateY(${s}px)`:''; });
});
function endRailDrag(){
  if(!railDrag)return; const {idx,tgt,el,cards}=railDrag; railDrag=null;
  cards.forEach(c=>{c.style.transform='';}); el.classList.remove('drag');
  if(tgt!==idx && DC && DC.cards && DC.cards.length>Math.max(idx,tgt)){
    const [m]=DC.cards.splice(idx,1); DC.cards.splice(tgt,0,m);
    const ids=DC.cards.map(c=>c.id);
    post('round',{type:'reorderCards',ids});
    if(currentMode==='shop') postCover('shop',{type:'reorderCards',ids});
  }
  renderRail();
}
window.addEventListener('pointerup',endRailDrag);
window.addEventListener('pointercancel',endRailDrag);

function dropOverlay(except){ if(overlay&&overlay!==except){ postCover(overlay,{type:'slideOut'}); } }
function goMap(){ dropOverlay('map'); overlay='map';
  post('round',{type:'syncCards',cards:DC.cards});
  postCover('map',{type:'init',state:mapState()}); postCover('map',{type:'slideIn'}); setActive('map'); }
function goShop(){ dropOverlay('shop'); overlay='shop';
  postCover('shop',{type:'init',state:shopState()}); postCover('shop',{type:'slideIn'}); setActive('shop'); }
// Free skip-reward interlude: slide the shop in showing only the free pack(s), no shelves.
function goRewardShop(packs){ dropOverlay('shop'); overlay='shop';
  postCover('shop',{type:'init',state:shopState()});
  postCover('shop',{type:'reward',packs});
  postCover('shop',{type:'slideIn'}); setActive('shop'); }
// What normally happens once a round/boss is beaten (deferred until after any reward pack).
function proceedAfterRound(){
  if(!DC.endless && DC.floorNum>=8 && FLOOR[DC.stageIdx] && FLOOR[DC.stageIdx].type==='boss'){ onRunWon(); return; }   // final-floor boss → completion
  DC.roundNo++; advanceStage(); }
function goRound(isBoss){ dropOverlay(null); overlay=null;
  post('round',{type:'init',state:roundState(isBoss)}); setActive('round'); }
function advanceStage(){ DC.stageIdx++; if(DC.stageIdx>=FLOOR.length){DC.floorNum++;DC.stageIdx=0;} saveRun(); glFloor(DC.floorNum); goMap(); }

function applyReward(rw){
  if(rw.type==='cardpack'){ const owned=DC.cards.map(c=>c.id); const avail=CARD_IDS.filter(id=>!owned.includes(id));
    if(avail.length&&DC.cards.length<5)DC.cards.push({id:avail[Math.floor(Math.random()*avail.length)]}); }
  else if(rw.type==='dicepack'){ const cols=['blue','red','green','purple'];   // white dice are the common pull here too
    DC.dice.push({col:Math.random()<0.55?'plain':cols[Math.floor(Math.random()*cols.length)]}); }
  else if(rw.type==='spin'){ const es=['prism','exalted','shimmer','plasma'];
    const plain=DC.dice.find(d=>!d.ench&&!['wheel','bos','slots','chip'].includes(d.col));   // casino dice only take Negative
    if(plain)plain.ench=es[Math.floor(Math.random()*es.length)]; }
}
function gameOver(m){ clearRun();   // run is over — drop the auto-save
  glFloor(DC.floorNum);
  document.getElementById('overText').innerHTML=`You reached <b>${m.score}</b> of <b>${m.req}</b> points on Floor ${DC.floorNum}.<br>The house keeps the gold. Roll again?`;
  document.getElementById('ov-over').classList.add('on'); }

window.addEventListener('message',e=>{
  const m=e.data||{};
  if(m.type==='ready'){ if(m.scene&&ready.hasOwnProperty(m.scene)){ ready[m.scene]=true; const q=queue[m.scene]; queue[m.scene]=[]; q.forEach(msg=>post(m.scene,msg)); } return; }
  if(m.scene==='map'){
    if(m.type==='mapPlay'){ const st=FLOOR[m.stageIdx]; if(st.type==='shop')goShop(); else goRound(st.type==='boss'); }
    else if(m.type==='mapSkip'){ if(DC.stored.length<2&&m.reward)DC.stored.push(m.reward); DC.stageIdx++; if(DC.stageIdx>=FLOOR.length){DC.floorNum++;DC.stageIdx=0;} saveRun(); postCover('map',{type:'init',state:mapState()}); }
  } else if(m.scene==='round'){
    if(m.type==='menuPlay'){ setActiveChallenge(null); freshRun(); saveRun(); renderRail(); setTimeout(()=>goMap(),650); }   // New Run (Standard) → the menu lifts away and the Floor map slides in
    else if(m.type==='menuChallenge'){ startChallenge(m.id); }   // 🏆 launch a challenge run with its modifier active
    else if(m.type==='menuNewRun'){ document.getElementById('ov-newrun').classList.add('on'); }   // New Run with a save present → confirm before overwriting
    else if(m.type==='menuContinue'){ const dc=loadRun(); if(dc){DC=dc;} else {freshRun();} setActiveChallenge(DC.challenge); saveRun(); renderRail(); setTimeout(()=>goMap(),650); }   // Continue → restore the saved run at the Floor map
    else if(m.type==='menuLeave'){ if(window.__glExitShow) window.__glExitShow(); else closeGame(); }   // Leave → same Exit Game confirmation as the top-right button
    else if(m.type==='glExitCancel'){ if(window.__glExitHide) window.__glExitHide(); }   // Escape inside the game frame while the confirm is up
    else if(m.type==='menuToMain'){ saveRun(); post('round',{type:'menuShow'}); post('round',{type:'menuSaveState',has:hasSavedRun()}); pushChalState(); }   // ⏸ pause → Main Menu: save + surface the main menu (Continue available)
    else if(m.type==='roundWon'){ DC.gold=m.gold; if(m.dice)DC.dice=m.dice;
      if(m.brokeCards&&m.brokeCards.length){ const rm=new Set(m.brokeCards); DC.cards=(DC.cards||[]).filter(c=>!rm.has(c.id)); }   // ✧ Shimmer destroyed these cards — remove them from the deck for good
      if(DC.challenge==='gauntlet' && FLOOR[DC.stageIdx] && FLOOR[DC.stageIdx].type==='boss'){ const gb=currentBoss(); if(gb)DC.stackFx=mergeFx(DC.stackFx||{}, gb.fx); }   // 🔗 remember this boss's ability
      const packs=(DC.stored&&DC.stored.length)?DC.stored.map(rw=>rw&&rw.pack).filter(Boolean):[];   // banked skip rewards → free packs
      // 🌌 Boss reward: beating a boss grants a free Constellation pack — 50% Mega, 50% Super.
      const wcfg=DC.challenge?CHAL[DC.challenge]:null;
      const bossFight=(FLOOR[DC.stageIdx]&&FLOOR[DC.stageIdx].type==='boss')||!!(wcfg&&wcfg.allBoss);
      const finalWin=!DC.endless&&DC.floorNum>=8&&FLOOR[DC.stageIdx]&&FLOOR[DC.stageIdx].type==='boss';   // run-ending boss → goes to the win screen, skip the pack
      /* --- Pickle Game Library tracking: a round/boss was just cleared --- */
      glInc('rounds_won'); glSet('best_score', Math.round(m.score||0), true);
      if((m.score||0)>=100000) glAch('score_100k','Astronomical');
      if(bossFight){ glInc('bosses_beaten'); glAch('boss_down','House Cleaner'); }
      if((DC.cards||[]).length>=5) glAch('full_rail','Loaded Deck');
      if(bossFight&&!finalWin){ packs.unshift(Math.random()<0.5?'con_meg':'con_sup'); }
      if(packs.length){ DC.stored=[]; saveRun(); renderRail(); goRewardShop(packs); return; }   // open the free pack(s) now, then continue
      proceedAfterRound(); }
    else if(m.type==='roundLost'){ gameOver(m); }
  } else if(m.scene==='shop'){
    if(m.type==='shopDone'){ const s=m.state||{}; if(s.gold!=null)DC.gold=s.gold; if(s.dice)DC.dice=s.dice; if(s.jokers)DC.cards=s.jokers; if(s.comboLvl)DC.comboLvl=s.comboLvl; advanceStage(); }
    else if(m.type==='rewardDone'){ const s=m.state||{}; if(s.gold!=null)DC.gold=s.gold; if(s.dice)DC.dice=s.dice; if(s.jokers)DC.cards=s.jokers; if(s.comboLvl)DC.comboLvl=s.comboLvl; saveRun(); renderRail(); proceedAfterRound(); }   // free skip-reward pack finished → resume the post-round flow
  }
  renderRail();
});

/* ================= Pickle Game Library: player chip + Exit Game =================
   The main menu is drawn inside the 3D scene, so both live as DOM chrome on the
   shell (top-level document) — the only layer that survives every scene swap. */
function glChipVis(on){
  const chip=document.getElementById('gl-player-chip'); if(!chip)return;
  // The "built" flag lives on the element, not in a script-scope variable: post() calls
  // this before the declarations down here have run, and a `var`/`let` here would be
  // re-initialised afterwards and let the chip append its contents a second time.
  if(chip.dataset.built!=='1'){
    chip.dataset.built='1';
    try{
      const p=new URLSearchParams(location.search);
      const name=(p.get('playerName')||'').trim();
      if(name){
        const em=document.createElement('span'); em.textContent=p.get('playerEmblem')||'';
        chip.appendChild(em);
        chip.appendChild(document.createTextNode(' '+name));
        chip.dataset.ok='1';
      }
    }catch(_){}
  }
  chip.style.display=(on&&chip.dataset.ok==='1')?'inline-flex':'none';
}

var _glExitOpen=false;
(function(){
  const btn=document.getElementById('gl-exit-btn'), ov=document.getElementById('gl-exit-confirm'),
        yes=document.getElementById('gl-exit-yes'), no=document.getElementById('gl-exit-no');
  if(!btn||!ov||!yes||!no) return;
  function show(){ _glExitOpen=true; ov.style.display='flex'; post('round',{type:'glExit',open:true}); }
  function hide(){ _glExitOpen=false; ov.style.display='none'; post('round',{type:'glExit',open:false}); }
  window.__glExitIsOpen=()=>_glExitOpen;
  window.__glExitShow=show;   // the 3D main menu's Leave button routes through the same confirm
  window.__glExitHide=hide;   // Escape pressed while the game iframe holds focus
  btn.addEventListener('click',show);
  no.addEventListener('click',hide);
  yes.addEventListener('click',function(){ window.close(); });
  document.addEventListener('keydown',function(e){
    if((e.key==='Escape'||e.key==='Esc') && _glExitOpen){ e.stopPropagation(); e.preventDefault(); hide(); }
  },true);
})();

// Escape / P work even when the shell (not the game iframe) holds keyboard focus — e.g. on the map or in the shop
window.addEventListener('keydown',e=>{
  if(_glExitOpen) return;                                     // the exit confirm owns the keyboard while it's up
  const t=e.target, tn=(t&&t.tagName||'').toLowerCase();
  if(tn==='input'||tn==='textarea'||(t&&t.isContentEditable)) return;
  if(e.key==='Escape'||e.key==='Esc'||e.key==='p'||e.key==='P'){ post('round',{type:'togglePause'}); }
});
</script>
</body>
