<script>
// Launcher stats/achievements. GameSDK is injected by the launcher and the website; a plain tab has none.
// main.js calls glitchlineSdk.runEnd() once per recorded run and .event() for each game event.
window.glitchlineSdk = (() => {
  const sdk = () => window.GameSDK;
  const total = (k) => +(sdk().getStats() || {})[k] || 0;
  // hidden counters: kept in GameSDK stats (durable) but not shown on the card, so deliberately not literal ids
  const HIDDEN = { walljumps: 'walljumps', zips: 'ziplines' };
  const bump = (k) => { sdk().incrementStat(k); return total(k); };
  return {
    runEnd(m, secs) {
      const S = sdk(); if (!S) return;
      S.incrementStat('total_runs');
      S.incrementStat('total_distance', m);
      S.setStat('best_distance', m, true);
      S.setStat('best_time', Math.floor(secs), true);
      S.unlockAchievement('first_run', 'Boot Up');
      if (m >= 250) S.unlockAchievement('dist_250', 'Rooftop Regular');
      if (m >= 1000) S.unlockAchievement('dist_1000', 'Kilometre Runner');
      if (m >= 2000) S.unlockAchievement('dist_2000', 'Out of Reach');
    },
    event(e) {
      const S = sdk(); if (!S) return;
      if (e.type === 'zipon') { if (bump(HIDDEN.zips) >= 20) S.unlockAchievement('zip_ride', 'Line Rider'); }
      else if (e.type === 'walljump') { if (bump(HIDDEN.walljumps) >= 100) S.unlockAchievement('walljump_100', 'Chimney Sweep'); }
      else if (e.type === 'glass') {
        S.incrementStat('glass_smashed');
        if (total('glass_smashed') >= 100) S.unlockAchievement('glass_100', 'Pane Killer');
      } else if (e.type === 'smash' && e.kind === 'gnome') S.unlockAchievement('gnome_smash', 'No Gnome Is Safe');
    },
  };
})();
</script>
<script>
// Global leaderboard (shared leaderboard-sdk.js, one best per player). The launcher preload appends the SDK at
// DOMContentLoaded, after this runs, so poll for it; standalone it never comes and ui.js shows the local top 10.
// state.status: 'wait' | 'local' (no SDK) | 'syncing' | 'live' | 'offline' | 'posting' | 'failed'
window.glitchlineLB = (() => {
  const state = { status: 'wait', top: [], me: null, rank: null };
  const lb = () => window.LeaderboardSDK;
  // same m:ss.d as the local board (ui.js fmtT)
  const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}.${Math.floor((t * 10) % 10)}`;
  let busy = false, again = false;
  async function submit(m, t) {
    state.status = 'posting';
    // a best from before the run list has no time (t 0): post no time rather than a fake 0:00
    try { await lb().submit('glitchline', m, t ? { time: fmt(t) } : {}); return true; } catch { state.status = 'failed'; return false; }
  }
  async function fetchBoard() {
    const b = await lb().board('glitchline', { limit: 10 });
    Object.assign(state, { top: b.top || [], me: b.me, rank: b.rank, status: 'live' });
  }
  // refresh + reconcile: a local best above the posted one (offline run, pre-leaderboard best) is posted here
  async function refresh() {
    if (!lb()) return;
    if (busy) { again = true; return; }
    busy = true;
    if (state.status !== 'live') state.status = 'syncing';
    try {
      await fetchBoard();
      // glitchline_best only moves on ranked runs (main.js RANKED); the run list just supplies its time
      let best = 0, runs = [];
      try { best = +localStorage.getItem('glitchline_best') || 0; runs = JSON.parse(localStorage.getItem('glitchline_runs')) || []; } catch {}
      const t = runs.find((r) => r.m === best)?.t || 0;
      if (best > (state.me?.score || 0) && await submit(best, t)) await fetchBoard();
    } catch { if (state.status !== 'failed') state.status = 'offline'; }
    busy = false;
    if (again) { again = false; refresh(); }
  }
  let tries = 0;
  const poll = setInterval(() => {
    if (lb()) { clearInterval(poll); refresh(); } else if (++tries >= 50) { clearInterval(poll); state.status = 'local'; }
  }, 100);
  return { state, refresh };   // main calls refresh() on a new best (posted by the reconcile) and when the board opens
})();
</script>
