  {const v=+m.bestHeat;m.bestHeat=isFinite(v)?Math.max(-1,Math.floor(v)):-1}

  for(const k of ['quests','heatSel','dailyBest','dailyDone','ach','seen','unlocks','perks','abils','gunLv'])if(!obj(m[k]))m[k]={};

// ---------- run flow: nonstop travel through 3 regions, random crazy events, a boss at the end of each ----------
const REGION_TIME=210;
function regionStart(){
  if(!G.demo&&!G.netClient)queuePrewarm(G.region);
  if(G.region===0&&!G.demo)sfx('warp');G.prog=0;G.phase='travel';G.spawnAcc=0;G.eventT=18*(G.eventMul||1)*(G.D?G.D.event:1);G.event=null;
  const R=REGIONS[G.region%NREG];banner(R.name+(G.region>=NREG?' +'+Math.floor(G.region/NREG):''),G.region===0?'Mine loot, feed the Heart, build as you go!':'A whole new chunk of weird space',3.5,R.neb[0]);if(G.region>0)G.warpFlash=1;
  G.bossCfg=R.alt&&Math.random()<.5?R.alt:R.boss;if(R.name==='HAUNTED HOLLOW')achieve('haunted');G.weather=null;G.weatherT=rand(35,50);applyRouteAtRegionStart();if(G.routeName)G.banner.sub='Route: '+G.routeName;
  if(G.route.nodes)for(let i=0;i<90&&G.nodes.filter(n=>!n.zoom).length<16+G.route.nodes;i++)spawnNode(true);
}
function bossArrive(){G.phase='boss';endEvent(true);banner('BOSS INCOMING!',(G.bossCfg||REGIONS[G.region%NREG].boss).name,3,'#ff4a6a');sfx('siren');spawnBoss()}
function startWarp(){
  G.phase='warp';G.phaseT=3;sfx('warp');

  for(const c of G.chests){c.dead=true;G.cardQueue.push('relic');G.cardDelay=.6}G.mines.length=0;G.warns.length=0;
  for(const n of G.nodes)n.zoom=true;

}
function nextRegion(){
  G.region++;if(G.region>=NREG&&!G.endless){endRun(true);return}if(G.endless&&G.region>=NREG)achieve('endless');
  for(let i=0;i<60&&G.nodes.filter(n=>!n.zoom).length<16;i++)spawnNode(true);

}
function updatePhase(dt){
  const P=G.phase;
  G.sector=Math.min(G.region*4+3,G.region*4+(P==='travel'?G.prog*3:3));
  if(P==='travel'){
    G.prog+=dt/REGION_TIME*(G.progMul||1);
    const rate=G.t<6?0:(.4+1.0*G.prog)*(1+.42*G.region)*(G.event&&G.event.k==='pirates'?.6:1)*G.route.spawn*(G.dailySpawn||1)*(1+.45*((G.threat||1)-1))*G.D.spawn;
    G.spawnAcc=Math.min(4,G.spawnAcc+rate*dt);
    if(G.enemies.length<150)while(G.spawnAcc>=1){G.spawnAcc-=spawnRandom()}
    if(G.event)updateEvent(dt);else{G.eventT-=dt;if(G.eventT<=0)startEvent()}
    if(G.dailyMeteor){G.dmT=(G.dmT===undefined?8:G.dmT)-dt;if(G.dmT<=0){G.dmT=rand(5,8);const pods=[...G.pods.values()];for(let i=0;i<2+Math.min(3,G.region);i++){const m=pick(pods);addWarn(m.x+rand(-.6,.6),m.z+rand(-.6,.6),1.4,1.9,10*(1+.12*G.sector),true)}sfx('siren')}}
    if(!G.miniDone&&(G.prog>=.5||(G.miniT>0&&(G.miniT-=dt)<=0))){G.miniDone=true;spawnMini();if(G.route.ambush){G.route.ambush=false;spawnMini()}}
    if(G.prog>=1)bossArrive();
  }
  else if(P==='boss'){G.spawnAcc=Math.min(3,G.spawnAcc+(.25+.2*G.region)*dt);if(G.enemies.length<90)while(G.spawnAcc>=1){G.spawnAcc-=spawnRandom()}}
  else if(P==='clear'){G.phaseT-=dt;if(G.phaseT<=0){G.phase='await';G.cardQueue.push('boss');G.cardDelay=.1}}
  else if(P==='warp'){G.phaseT-=dt;if(Math.random()<dt*30)for(let i=0;i<2;i++)G.parts.push({x:rand(-20,20),y:rand(-3,3),z:-30,vx:0,vy:0,vz:90,life:.6,max:.6,col:pick(['#ffffff','#4af0ff','#ff6ac1']),sz:2,drag:0,g:0,glow:true});
    if(G.phaseT<=0)nextRegion()}
  else if(P==='dead'){G.phaseT-=dt;if(Math.random()<dt*6)boom(rand(-2,2),rand(-2,2),.8);if(G.phaseT<=0)endRun(false)}
}

function updateEnemies(dt){

    if(et.beh==='rammer'){
      if(e.st==='go'){if(d>6){e.x+=dx/d*e.spd*dt;e.z+=dz/d*e.spd*dt}else{e.st='wind';e.stT=.6;e.dx=dx/d;e.dz=dz/d}}
      else if(e.st==='wind'){e.stT-=dt;e.dx=dx/d;e.dz=dz/d;if(e.stT<=0){e.st='dash';e.stT=1.1;sfx('whoosh')}}
      else if(e.st==='dash'){e.x+=e.dx*et.dash*dt;e.z+=e.dz*et.dash*dt;e.stT-=dt;
        if(Math.random()<dt*30)puff(e.x,.4,e.z,.18,'#ffffff',.3);

        if(hp){damagePod(hp,e.dmg,e);sfx('boing');comic(e.x,e.z,'BONK!','#ffe94a',.8);e.vx=-e.dx*6;e.vz=-e.dz*6;e.st='rest';e.stT=1.2}
        else if(tp.alive&&d2(tp.x,tp.z,e.x,e.z)<(e.r+.3)**2){hurtPlayer(e.dmg,tp);e.st='rest';e.stT=1}
        else if(e.stT<=0){e.st='rest';e.stT=.8}}
      else{e.stT-=dt;if(e.stT<=0)e.st='go'}
    }else if(d>reach){const s=e.spd*dt*(G.disco?.6:1);e.x+=dx/d*s;e.z+=dz/d*s}
    else if(et.beh==='ranged'&&d<reach*.55){e.x-=dx/d*e.spd*.6*dt;e.z-=dz/d*e.spd*.6*dt}
    if(et.beh!=='rammer'&&d<=reach+.05&&e.cd<=0&&G.phase!=='dead'){

        e.vx-=dx/d*1.5;e.vz-=dz/d*1.5}
    }

function keepLife(a){let j=0;for(let i=0;i<a.length;i++){const x=a[i];if(x.life>0)a[j++]=x}a.length=j;return a}

  updatePlayer(dt);updateOthers(dt);updateEnemies(dt);updatePods(dt);updateShots(dt);updateEShots(dt);updatePickups(dt);updateNodes(dt);updateFlow(dt);updateParts(dt);
  keepAlive(G.enemies);keepLife(G.shots);keepLife(G.eshots);keepAlive(G.pickups);
  const p=G.player,fx=p.alive?p.x*.7:0,fz=p.alive?p.z*.7:0,lean=G.cam.d*.45;
  const tx=fx+(mouse.x/W-.5)*lean*(W/H)*.25,tz=fz+(mouse.y/H-.5)*lean*.25;

}

// ---------- pod merging: 3 touching pods of the same kind + tier fuse into one ----------
const TIER_NAME=['','','MEGA ','ULTRA '];
const tierOf=m=>m.tier||1;
const tierName=m=>TIER_NAME[tierOf(m)]+MODS[m.type].name;
const tierDmg=m=>[1,1,2.4,5.5][tierOf(m)];
function tryMerge(m){
  if(!m||m.dead||m.type==='heart'||m.type==='hull'||tierOf(m)>=3)return false;
  const seen=new Set([key(m.q,m.r)]),qq=[m],cl=[];
  while(qq.length){const c=qq.shift();cl.push(c);for(const [a,b] of HDIRS){const k=key(c.q+a,c.r+b);if(seen.has(k))continue;const n=G.pods.get(k);if(n&&n.type===m.type&&tierOf(n)===tierOf(m)){seen.add(k);qq.push(n)}}}
  if(cl.length<3)return false;
  const eat=cl.filter(x=>x!==m).slice(0,2);
  for(const x of eat){G.beams.push({pts:[[x.x,.8,x.z],[m.x,.95,m.z]],life:.45});burst(x.x,x.z,16,[MODS[m.type].col,'#ffffff']);x.type='hull';x.tier=1;x.paid=null;x.hp=maxHpOf(x);x.pop=1}
  m.tier=tierOf(m)+1;m.hp=maxHpOf(m);m.pop=1;G.merges++;pillar(m.x,m.z,m.tier===2?'#ffe94a':'#ff6ad8',5);shock(m.x,m.z,3.5,m.tier===2?'#ffe94a':'#ff6ad8',.6);
  sfx('levelup');G.shake=.3;G.flashW=.22;hitstop(.08);
  comic(m.x,m.z,m.tier===2?'MEGA!':'ULTRA!!',m.tier===2?'#ffe94a':'#ff6ad8',1.8);
  banner(tierName(m).toUpperCase()+'!','3 pods fused into 1 - the other two became bumpers',2.4,m.tier===2?'#ffe94a':'#ff6ad8');
  achieve(m.tier===2?'merge2':'merge3');
  rebuildShip();tryMerge(m);return true;
}

function updateEventExtra(ev,dt){

  if(ev.k==='casino'){const n=ev.npc;if(ev.t>ev.dur-3)n.leave=true;const tx=n.leave?n.tx*6:n.tx,tz=n.leave?n.tz*6:n.tz;n.x+=(tx-n.x)*Math.min(1,dt*(n.leave?.6:1.2));n.z+=(tz-n.z)*Math.min(1,dt*(n.leave?.6:1.2));
    G.nearCasino=!n.leave&&p.alive&&d2(p.x,p.z,n.x,n.z)<2.4*2.4;
    if(G.casinoT>0){G.casinoT-=dt;if(Math.random()<dt*14)sfx('select');if(G.casinoT<=0)resolveCasino(n)}}
  else if(ev.k==='derelict'){const n=ev.node;
    if(n.dead){if(!ev.done){ev.done=true;if(n.hp<=0){banner('WRECK PICKED CLEAN!','Something shiny was inside...',1.8,'#7aff6a');spawnChest(n.x,n.z)}}ev.t=Math.max(ev.t,ev.dur-1)}
    else if(!ev.guards&&n.hp<n.maxhp){ev.guards=true;banner('GUARDIANS AWAKEN!','Something lived in there...',2.2,'#ff4a5a');sfx('siren');
      const R=REGIONS[G.region%NREG],types=Object.keys(R.pool).filter(t=>!ETYPES[t].group);for(let i=0;i<3+G.region*2;i++){const aa=rand(TAU),e=spawnEnemy(pick(types),n.x+Math.cos(aa)*3,n.z+Math.sin(aa)*3,Math.random()<.3);if(e.elite&&!e.afx){e.afx=[];applyAffix(e,pick(AFFIXES))}}}}
  else if(ev.k==='puppy'){const u=ev.pup,leaving=ev.t>ev.dur-2.5;let tx,tz;
    if(leaving){tx=u.x*3;tz=u.z*3}
    else if(u.carry){tx=0;tz=0;if(Math.hypot(u.x,u.z)<1.2){flowFrom(u.carry,u.x,u.z,0);u.carry=null;u.fetched++;burst(u.x,u.z,6,['#ff6ac1','#ffffff'],3);if(Math.random()<.4)comic(u.x,u.z,pick(['WOOF!','ARF!','BORK!']),'#7aff6a',.8)}}
    else{if(!u.tgt||u.tgt.dead){u.tgt=null;let bd=10*10;for(const k of G.pickups){if(k.dead)continue;const d=d2(k.x,k.z,u.x,u.z);if(d<bd){bd=d;u.tgt=k}}}
      if(u.tgt){tx=u.tgt.x;tz=u.tgt.z;if(d2(tx,tz,u.x,u.z)<.5*.5){u.carry=u.tgt.type;u.tgt.dead=true;u.tgt=null}}else{tx=p.x+1.2;tz=p.z+.8}}
    const dx=tx-u.x,dz=tz-u.z,d=Math.hypot(dx,dz)||1,sp=Math.min(7,d*3);u.x+=dx/d*sp*dt;u.z+=dz/d*sp*dt;if(d>.05)u.face=Math.atan2(dz,dx)}
  else if(ev.k==='rival'){if(ev.list.every(x=>x.dead)){if(!ev.done){ev.done=true;banner('RIVAL BUSTED!','Grab your junk back!',2,'#7aff6a')}ev.t=Math.max(ev.t,ev.dur-2)}}
}
function endEventExtra(ev){
  if(ev.k==='casino'){G.nearCasino=false;if(G.casinoT>0){G.casinoT=0;G.bank.scrap+=ev.paid||10}if(state==='shop')closeShop()}
  if(ev.k==='derelict'&&ev.node&&!ev.node.dead){ev.node.zoom=false;ev.node.vz=2;floatText(ev.node.x,ev.node.z,'THE WRECK DRIFTS AWAY...','#c8b6ff')}
  if(ev.k==='puppy'&&ev.pup.fetched)floatText(G.player.x,G.player.z,ev.pup.name+' fetched '+ev.pup.fetched+' loot!','#7aff6a');
  if(ev.k==='rival')for(const r of ev.list)if(!r.dead){r.leaving=true;floatText(r.x,r.z,'THE RIVAL ESCAPED WITH '+r.loot+' LOOT!','#ff6a3a')}
}
const casinoCost=()=>10+5*((G.event&&G.event.spins)||0);
function spinCasino(){
  if(G.casinoT>0)return;const ev=G.event;if((ev.spins||0)>=6){sfx('deny');floatText(G.player.x,G.player.z,"LOU'S OUT OF PRIZES!",'#ff6a4a');return}
  const c={scrap:casinoCost()};if(!canAfford(c)){sfx('deny');floatText(G.player.x,G.player.z,'NEED '+c.scrap+' SCRAP','#ff6a4a');return}
  pay(c);ev.spins=(ev.spins||0)+1;ev.paid=c.scrap;G.casinoT=1;comic(G.event.npc.x,G.event.npc.z,'SPINNING...','#ffe94a',1);sfx('build');
}
function resolveCasino(n){
  const r=wpick({jackpot:22,perk:15,swarm:22,mega:13,nothing:28});
  if(r==='jackpot'){comic(n.x,n.z,'7 - 7 - 7  JACKPOT!','#ffe94a',1.6);for(let i=0;i<40;i++)part(n.x,1.6,n.z,rand(-3,3),rand(4,8),rand(-3,3),1.2,pick(['#ffe94a','#ffd23a','#ffffff']),2,{g:9,drag:.5});shock(n.x,n.z,4,'#ffe94a',.7);for(let i=0;i<30;i++)flowFrom('scrap',n.x,n.z,i*.03);for(let i=0;i<10;i++)flowFrom('crystal',n.x,n.z,.9+i*.04);for(let i=0;i<3;i++)flowFrom('goo',n.x,n.z,1.3+i*.1);sfx('win');achieve('casino')}
  else if(r==='perk'){comic(n.x,n.z,'STAR - STAR - STAR','#ff6ad8',1.4);sfx('chest');G.cardQueue.push('gift');G.cardDelay=.5}
  else if(r==='swarm'){comic(n.x,n.z,'SKULL - SKULL - SKULL','#ff4a5a',1.4);const R=REGIONS[G.region%NREG];for(let i=0;i<6;i++){const a=rand(TAU);spawnEnemy(wpick(R.pool),n.x+Math.cos(a)*2.5,n.z+Math.sin(a)*2.5,false)}sfx('siren')}
  else if(r==='mega'){const opts=[...G.pods.values()].filter(m=>m.type!=='heart'&&m.type!=='hull'&&tierOf(m)<3);if(opts.length){const m=pick(opts);m.tier=tierOf(m)+1;m.hp=maxHpOf(m);m.pop=1;rebuildShip();comic(n.x,n.z,'GEAR - GEAR - GEAR','#4af0ff',1.4);sfx('build');banner('FREE UPGRADE: '+tierName(m).toUpperCase(),'',2.2,'#4af0ff')}else {comic(n.x,n.z,'AWW, NOTHING!','#c8b6ff',1.2);sfx('aww')}}
  else{comic(n.x,n.z,'CHERRY - LEMON - BOOT','#c8b6ff',1.2);sfx('aww');floatText(n.x,n.z,'AWW, NOTHING!','#c8b6ff')}
}
function lootOf(n){return n.type==='junk'?'scrap':n.type==='wreck'?(Math.random()<.6?'scrap':Math.random()<.75?'crystal':'goo'):n.type}
const lootCol=n=>n.type==='junk'||n.type==='wreck'?RES_COL.scrap:RES_COL[n.type];
function updateRival(e,dt){
  e.cd-=dt;e.anim+=dt;
  if(e.leaving){const oa=Math.atan2(e.z,e.x);e.x+=Math.cos(oa)*7*dt;e.z+=Math.sin(oa)*7*dt;e.face=oa;if(e.x*e.x+e.z*e.z>30*30)e.dead=true;return}
  if(!e.node||e.node.dead||e.node.zoom){let best=null,bd=1e9;for(const n of G.nodes){if(n.dead||n.zoom||n.type==='wreck')continue;const d=d2(n.x,n.z,e.x,e.z);if(d<bd){bd=d;best=n}}e.node=best}
  const n=e.node;
  if(n){const dx=n.x-e.x,dz=n.z-e.z,d=Math.hypot(dx,dz)||1;e.face=Math.atan2(dz,dx);
    if(d>n.r+.9){e.x+=dx/d*3.6*dt;e.z+=dz/d*3.6*dt}
    else{n.hp-=14*dt;n.shake=.1;if(Math.random()<dt*10)G.beams.push({pts:[[e.x,.8,e.z],[n.x,.5,n.z]],life:.06,mag:true});
      while(n.hp<=n.next&&n.next>=-1e-6){e.loot++;n.next-=n.per}
      if(n.hp<=0){n.dead=true;burst(n.x,n.z,14,['#d8dce8','#ffffff']);comic(e.x,e.z,'MINE NOW!','#ff6a3a',.9)}}}
  const p=G.player;if(p.alive&&e.cd<=0&&d2(p.x,p.z,e.x,e.z)<7*7){e.cd=1.4;eshot(e.x,e.z,Math.atan2(p.z-e.z,p.x-e.x),7,e.dmg,'#ff6a3a')}
  pushOutOfShip(e);
}

// ---------- weather (one kind per region) ----------
const WEATHER=[{k:'asteroids',name:'ASTEROID BELT',col:'#ffb04a',dur:12,sub:'Rocks streaking in from the side!'},{k:'ion',name:'ION STORM',col:'#4af0ff',dur:10,sub:'Turrets may jam for a few seconds'},{k:'fog',name:'SPOOKY FOG',col:'#7affc8',dur:12,sub:'Turrets can barely see... and ghosts love it'},{k:'gravity',name:'GRAVITY WELLS',col:'#c08aff',dur:13,sub:'Gravity is being weird. Watch your step.'}];
function startWeather(){const def=WEATHER[G.region%NREG];G.weather={...def,t:0,cd:0,side:Math.random()<.5?1:-1,
  wells:def.k==='gravity'?[0,1,2].map(()=>{const a=rand(TAU),d=G.shipR+rand(3,7);return {x:Math.cos(a)*d,z:Math.sin(a)*d}}):null};banner(def.name+'!',def.sub,2.4,def.col);sfx('weather');markSeen('w_'+def.k)}
function endWeather(){G.weather=null;G.weatherT=rand(40,55);for(const m of G.pods.values())m.jam=0}
function updateWeather(dt){
  if(G.phase!=='travel'){if(G.weather)endWeather();return}
  if(!G.weather){G.weatherT-=dt;if(G.weatherT<=0)startWeather();return}
  const w=G.weather;w.t+=dt;w.cd-=dt;
  if(w.k==='asteroids'&&w.cd<=0&&w.t<w.dur-1.5){w.cd=.42;const sx=w.side*25,sz=rand(-13,11),tx=-w.side*25,tz=sz+rand(-6,6),dl=Math.hypot(tx-sx,tz-sz),m=spawnEnemy('meteor',sx,sz,false);m.vx=(tx-sx)/dl*3.6;m.vz=(tz-sz)/dl*3.6;m.rise=1}
  else if(w.k==='ion'&&w.cd<=0){w.cd=1.3;const ts=[...G.pods.values()].filter(m=>MODS[m.type].turret);let n=0;for(const m of ts)if(Math.random()<.25){m.jam=2.5;n++;burst(m.x,m.z,8,['#4af0ff','#ffffff'])}if(n)sfx('zap')}
  else if(w.k==='fog'){if(w.cd<=0){w.cd=1.8;const a=rand(TAU);spawnEnemy('ghost',Math.cos(a)*16,Math.sin(a)*16,false)}}
  else if(w.k==='gravity'){const p=G.player;
    for(const g of w.wells){const pf=(x,z,s)=>{const dx=g.x-x,dz=g.z-z,d=Math.hypot(dx,dz)||1;if(d>=7){PULL.x=PULL.z=0;return PULL}const f=s/(d+.8)/d*dt;PULL.x=dx*f;PULL.z=dz*f;return PULL};
      if(p.alive){pf(p.x,p.z,9);p.vx+=PULL.x;p.vz+=PULL.z}
      for(const k of G.pickups)if(!k.dead){pf(k.x,k.z,5);k.x+=PULL.x;k.z+=PULL.z}
      for(const e of G.enemies)if(!e.dead&&!e.boss&&ETYPES[e.type].beh!=='special'){pf(e.x,e.z,6);e.x+=PULL.x;e.z+=PULL.z}
      if(Math.random()<dt*14){const a=rand(TAU),r=rand(.8,2.5);part(g.x+Math.cos(a)*r,.4,g.z+Math.sin(a)*r,-Math.sin(a)*3-Math.cos(a)*2,0,Math.cos(a)*3-Math.sin(a)*2,.5,'#c08aff',1,{drag:0})}}}
  for(const m of G.pods.values())if(m.jam>0){m.jam-=dt;if(Math.random()<dt*6)part(m.x+rand(-.3,.3),.9,m.z+rand(-.3,.3),rand(-1,1),rand(.5,1.5),rand(-1,1),.3,'#4af0ff',1)}
  if(w.t>=w.dur)endWeather();
}

// ---------- crew ----------
const CREW_NAMES=['Bob','Zib','Glorp','Kevin','Nebula Nancy','Captain Toast','Mork','Dave','Pixel','Wobbles','Sprocket Jr.','Gus','Blip','Doug','Starla','Moxie'];
const CREW_ROLES={gunner:{name:'Gunner',col:'#ff8a3a',desc:'mans a turret: +40% fire rate, +20% damage'},medic:{name:'Medic',col:'#5affb0',desc:'flies around repairing pods'},miner:{name:'Miner',col:'#ffe94a',desc:'mines junk near the ship for you'}};
function makeCrew(role){const used=new Set(G.crew.map(c=>c.name));const names=CREW_NAMES.filter(n=>!used.has(n));return {name:pick(names.length?names:CREW_NAMES),role:role||pick(Object.keys(CREW_ROLES)),x:rand(-.5,.5),z:rand(-.5,.5),y:.9,face:0,pod:null,tgt:null,bag:[],ph:rand(TAU),dead:false}}
function addCrew(role){
  if(G.crew.length>=5){G.bank.goo+=2;floatText(0,0,'CREW IS FULL: +2 GOO','#9aff3a');return}
  const c=makeCrew(role);G.crew.push(c);banner(c.name.toUpperCase()+' JOINS THE CREW!',CREW_ROLES[c.role].name+': '+CREW_ROLES[c.role].desc,2.8,'#4af0ff');sfx('levelup');
  if(G.crew.length>=4)achieve('crew4');
}
function crewMove(c,x,z,spd,dt){const dx=x-c.x,dz=z-c.z,d=Math.hypot(dx,dz);if(d>.02){const s=Math.min(d,spd*dt);c.x+=dx/d*s;c.z+=dz/d*s;c.face=Math.atan2(dz,dx)}return d}
function updateCrew(dt){
  for(const m of G.pods.values())m.gunner=false;
  for(const c of G.crew){c.ph+=dt;
    if(c.role==='gunner'){if(!c.pod||c.pod.dead||!MODS[c.pod.type].turret){const ts=[...G.pods.values()].filter(m=>MODS[m.type].turret&&!G.crew.some(o=>o!==c&&o.pod===m));c.pod=ts.length?pick(ts):null}
      if(c.pod){c.pod.gunner=true;crewMove(c,c.pod.x-.3,c.pod.z+.15,6,dt);c.y=1.05}else{crewMove(c,Math.cos(c.ph)*.6,Math.sin(c.ph)*.6,3,dt);c.y=1}}
    else if(c.role==='medic'){if(!c.tgt||c.tgt.dead||c.tgt.hp>=maxHpOf(c.tgt)){c.tgt=null;let w=.98;for(const m of G.pods.values()){const f=m.hp/maxHpOf(m);if(f<w){w=f;c.tgt=m}}}
      if(c.tgt){const d=crewMove(c,c.tgt.x,c.tgt.z,5,dt);c.y=1.1;if(d<.5){c.tgt.hp=Math.min(maxHpOf(c.tgt),c.tgt.hp+12*(1+.1*G.L)*dt);if(Math.random()<dt*10)part(c.tgt.x+rand(-.3,.3),.8,c.tgt.z+rand(-.3,.3),0,1.2,0,.4,'#5affb0',1)}}
      else{crewMove(c,Math.cos(c.ph*.7)*1.2,Math.sin(c.ph*.7)*1.2,2,dt);c.y=1}}
    else{ // miner
      const full=c.bag.length>=6;
      if(full||(c.bag.length&&(!c.tgt||c.tgt.dead))){if(crewMove(c,0,0,5,dt)<1.1){for(const t of c.bag)flowFrom(t,c.x,c.z,0);c.bag=[];c.tgt=null}c.y=1}
      else{if(c.tgt&&c.tgt.x*c.tgt.x+c.tgt.z*c.tgt.z>(G.shipR+9)**2)c.tgt=null;
        if(!c.tgt||c.tgt.dead||c.tgt.zoom){c.tgt=null;let bd=(G.shipR+7)**2;for(const n of G.nodes){if(n.dead||n.zoom)continue;const d=n.x*n.x+n.z*n.z;if(d<bd){bd=d;c.tgt=n}}}
        if(c.tgt){const n=c.tgt,d=crewMove(c,n.x,n.z,4.5,dt);c.y=.7;if(d<n.r+.5){n.hp-=7*dt;n.shake=.1;if(Math.random()<dt*8)part(n.x,.5,n.z,rand(-2,2),rand(1,2),rand(-2,2),.3,lootCol(n),1,{g:5});
          while(n.hp<=n.next&&n.next>=-1e-6){c.bag.push(lootOf(n));n.next-=n.per}if(n.hp<=0){n.dead=true;burst(n.x,n.z,12,[lootCol(n),'#ffffff'])}}}
        else{crewMove(c,Math.cos(c.ph*.5)*1.5,Math.sin(c.ph*.5)*1.5,2,dt);c.y=1}}}
  }
}

// ---------- combos, hit-stop, flashes ----------
function hitstop(t){if(G)G.hitstop=Math.max(G.hitstop||0,t)}
function onKillCombo(e){
  G.combo++;G.comboT=2.6+(G.S.comboX||0);G.bestCombo=Math.max(G.bestCombo,G.combo);
  if(G.combo>=25)achieve('combo25');
  if(G.combo%10===0){const n=Math.min(8,2+Math.floor(G.combo/30))*(G.S.comboMul||1);for(let i=0;i<n;i++)flowFrom('scrap',e.x,e.z,i*.05);comic(e.x,e.z,G.combo+'x COMBO!','#ffe94a',1.6);sfx('levelup')}
}

function showCodex(){
  state='codex';if(!G||!G.demo)G=newRun(true);
  const sec=(title,obj)=>`<div class="sect">${title}</div><div class="grid">${Object.entries(obj).map(([k,[n,d]])=>meta.seen[k]?`<div class="item owned"><div class="n">${n}</div><div class="d">${d}</div></div>`:`<div class="item locked"><div class="n">???</div><div class="d">Not discovered yet.</div></div>`).join('')}</div>`;

const DAILY_MODS=[
  {id:'glass',name:'GLASS CANNON',desc:'Heart HP halved. Everything deals double damage.'},
  {id:'ducks',name:'DUCK DAY',desc:'Everyone gets a Duck Launcher and the Duck Squadron perk.'},
  {id:'tiny',name:'TINY TOWN',desc:'You start as Zippy, but pods cost 40% less.'},
  {id:'swarm',name:'SWARM SURGE',desc:'60% more baddies, double loot drops.'},
  {id:'events',name:'EVENT HORIZON',desc:'Something crazy happens all the time.'},
  {id:'rich',name:'BIG SPENDER',desc:'Start loaded: 200 scrap, 60 crystal, 10 goo.'},
];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
const NATIVE_RANDOM=Math.random;
function restoreRandom(){Math.random=NATIVE_RANDOM}
function dailyInfo(){const d=new Date(),k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();const r=mulberry(k);r();return {k,mod:DAILY_MODS[Math.floor(r()*DAILY_MODS.length)]}}
function startDaily(){
  const di=dailyInfo(),mod=di.mod;Math.random=mulberry(di.k*7+1);
  G=newRun(false,{ship:mod.ship||'standard',gun:mod.gun||'pea',pilot:'rex',abil:'laser',heat:{}});G.daily=di;
  mod.fx(G.S);for(const m of G.pods.values())m.hp=maxHpOf(m);
  if(G.dailyNode){const n=G.nodes.length;G.nodes=[];for(let i=0;i<300&&G.nodes.length<n;i++)spawnNode(true)}
  for(const r of G.relics){if(r.cursed)achieve('cursed')}if(G.relics.length>=5)achieve('relic5');
  state='play';setUI('');mouse.down=false;regionStart();banner('DAILY: '+mod.name,mod.desc,4,'#ffe94a');
}
const dailyScore=(win)=>G.kills+G.region*100+G.bosses*250+(win?500:0);

// ---------- music: procedural chiptune per region, harder for bosses/events ----------
let musGain=null;
const MUS={step:0,next:0,bpm:116,lead:null,timer:null};
const midiF=n=>440*Math.pow(2,(n-69)/12);
const PROG=[[[48,'M'],[43,'M'],[45,'m'],[41,'M']],[[45,'m'],[41,'M'],[48,'M'],[43,'M']],[[45,'m'],[41,'M'],[46,'M'],[44,'a']],[[50,'a'],[46,'M'],[48,'a'],[44,'M']]];
const BOSSPROG=[[45,'m'],[46,'M'],[45,'m'],[44,'M']];
const QUAL={M:[0,4,7,12],m:[0,3,7,12],a:[0,4,8,12]};
function musicMode(){if(!G||state==='over')return 'off';if(G.demo||state==='title'||state==='hangar'||state==='loadout'||state==='codex'||state==='ach'||state==='quests'||state==='dailies')return 'title';if(G.phase==='dead')return 'off';if(G.phase==='boss'||(G.mini&&!G.mini.dead))return 'boss';return G.event||G.weather?'event':'travel'}
function mnote(t,type,f,dur,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(musGain);o.start(t);o.stop(t+dur+.05)}
function mdrum(t,dur,vol,freq,hp){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(musGain);s.start(t);s.stop(t+dur+.02)}
function mkick(t){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.14);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(musGain);o.start(t);o.stop(t+.2)}
function playStep(t,s){
  const mode=musicMode();if(mode==='off')return;
  const prog=mode==='boss'?BOSSPROG:PROG[G?G.region%NREG:0],bar=Math.floor(s/16)%4,beat=s%16,[root,q]=prog[bar],ch=QUAL[q];
  MUS.bpm=mode==='boss'?140:mode==='title'?100:mode==='event'?124:116;
  if(beat%2===0)mnote(t,'square',midiF(root-12+(beat%8===6?7:0)),.17,mode==='title'?.04:.06);
  if(mode!=='title'||beat%2===0)mnote(t,'triangle',midiF(root+12+ch[(beat+bar)%4]),.11,mode==='title'?.03:.04);
  if(mode!=='title'){if(beat%4===0)mkick(t);if(beat%8===4)mdrum(t,.12,.12,2200,false);if(beat%2===1)mdrum(t,.03,mode==='boss'?.05:.03,7000,true)}
  if((mode==='event'||mode==='boss')&&beat%2===0&&MUS.lead){const deg=MUS.lead[(bar*8+beat/2)%32];if(deg!==null)mnote(t,mode==='boss'?'sawtooth':'square',midiF(root+24+ch[deg]),.16,.028)}
  if(s===0||!MUS.lead)MUS.lead=Array.from({length:32},()=>NATIVE_RANDOM()<.35?null:Math.floor(NATIVE_RANDOM()*4));
}
function scheduleMusic(){if(!AC||!musGain)return;if(MUS.next<AC.currentTime-.5)MUS.next=AC.currentTime+.05;
  while(MUS.next<AC.currentTime+.15){playStep(MUS.next,MUS.step);MUS.next+=60/MUS.bpm/4;MUS.step=(MUS.step+1)%64}}
function musicInit(){if(!AC||musGain)return;musGain=AC.createGain();musGain.gain.value=muted?0:.12*SET.music;musGain.connect(AC.destination);MUS.next=AC.currentTime+.1;MUS.timer=setInterval(scheduleMusic,40)}

// ---------- feature actions from menus ----------
function featureAct(a,arg){
  if(a==='route')pickRoute(+arg);
  else if(a==='endless'){G.endless=true;showRoute()}
  else if(a==='cashout')endRun(true);
  else if(a==='daily')startDaily();
  else if(a==='endlessrun'){startRun();G.endless=true;banner('ENDLESS MODE','How far can you go?',3,'#ff6ad8')}
  else if(a==='codex')showCodex();
  else if(a==='ach')showAchievements();
}

// telegraphed danger zones (red rings) that go off when their timer runs out
function addWarn(x,z,r,t,dmg,meteor){G.warns.push({x,z,r,t,max:t,dmg:dmg||0,meteor:!!meteor})}
function updateWarns(dt){
  for(const w of G.warns){w.t-=dt;if(w.t<=0&&!w.done){w.done=true;if(w.dmg){podsHit(w.x,w.z,w.r,w.dmg);explodeAt(w.x,w.z,w.r,0,false);for(const pl of allPlayers())if(pl.alive&&d2(pl.x,pl.z,w.x,w.z)<w.r*w.r)hurtPlayer(w.dmg*.5,pl);if(Math.random()<.5)comic(w.x,w.z,'KRAK!','#ff8a2a',1)}}}
  G.warns=G.warns.filter(w=>!w.done);
}
// THE GUMMY KING: hops around (and onto) your ship, sprays jelly, splits into minions as he gets hurt
function gummyAI(e,dt,enr,dm){
  const sp=enr?1.35:1;e.status=e.st==='hop'?'MID-BOUNCE - WAIT FOR THE LANDING!':null;
  const want=Math.floor((1-e.hp/e.maxhp)*4);
  if(want>(e.splits||0)&&(e.splits||0)<3){e.splits=(e.splits||0)+1;comic(e.x,e.z,'SPLIT!','#ff4a8a',1.6);say(e,pick(['OW! MY GUMMY BITS!','THERE IS MORE OF ME NOW!','SQUISH!']));sfx('boing');
    for(let i=0;i<3+e.splits;i++){const a=rand(TAU);spawnEnemy('blob',e.x+Math.cos(a)*2.2,e.z+Math.sin(a)*2.2,i===0)}e.scaleK=1-.1*e.splits;e.r=e.cfg.r*e.scaleK}
  switch(e.st){
    case 'intro':steer(e,0,0,5,dt,2);if(e.stT<=0||Math.hypot(e.x,e.z)<12){e.st='wait';e.stT=1;e.n=0}break;
    case 'wait':{e.y=0;e.face+=clamp(angDiff(Math.atan2(-e.z,-e.x),e.face),-3*dt,3*dt);
      if(e.cd<=0){e.cd=enr?.6:.95;const tg=nearestPod(e.x,e.z),a=tg?Math.atan2(tg.z-e.z,tg.x-e.x):Math.atan2(-e.z,-e.x);for(let i=-3;i<=3;i++)bossShoot(e,a+i*.18,5.5,6*dm);sfx('spit')}
      if(e.stT<=0){e.st='hop';e.n++;const slam=e.n%3===0;e.sx=e.x;e.sz=e.z;
        if(slam){const pp=[...G.pods.values()].filter(m=>m.type!=='heart'),tg=pick(pp.length?pp:[...G.pods.values()]);e.tx=tg?tg.x:0;e.tz=tg?tg.z:0;say(e,pick(['BODY SLAM!','CANNONBALL!!','INCOMING JIGGLE!']))}
        else{const a=rand(TAU),R=G.shipR+rand(2,4.5);e.tx=Math.cos(a)*R;e.tz=Math.sin(a)*R}
        e.hopT=0;e.hopDur=(slam?1.5:1.05)/sp;addWarn(e.tx,e.tz,2.4*(e.scaleK||1),e.hopDur,0)}break}
    case 'hop':{e.hopT+=dt;const u=Math.min(1,e.hopT/e.hopDur);e.x=e.sx+(e.tx-e.sx)*u;e.z=e.sz+(e.tz-e.sz)*u;e.y=Math.sin(u*Math.PI)*4.5;e.face=Math.atan2(e.tz-e.sz,e.tx-e.sx);e.invuln=u>.12&&u<.88;
      if(u>=1){e.invuln=false;e.y=0;podsHit(e.x,e.z,2.4*(e.scaleK||1),26*dm);explodeAt(e.x,e.z,2.2,0,false);G.shake=.8;comic(e.x,e.z,'SQUELCH!','#ff4a8a',1.8);sfx('boing');
        const N=enr?22:15,a0=rand(TAU);for(let i=0;i<N;i++)bossShoot(e,a0+i/N*TAU,5,7*dm);e.st='wait';e.stT=enr?1.1:1.9}break}
  }
}
// VAC-3000: circles the ship, then switches to SUCTION (pulls you, eats loot, slurps pods) and spits it all back

    case 'intro':steer(e,0,0,5,dt,2);if(e.stT<=0||Math.hypot(e.x,e.z)<13){e.st='cruise';e.stT=6}break;
    case 'cruise':{const R=G.shipR+5.5,oa=Math.atan2(e.z,e.x)+dt*(enr?.55:.4);e.x+=(Math.cos(oa)*R-e.x)*Math.min(1,dt*2);e.z+=(Math.sin(oa)*R-e.z)*Math.min(1,dt*2);e.face=oa+HPI;
      if(e.cd<=0){e.cd=enr?.4:.6;for(let i=-1;i<=1;i++)bossShoot(e,toShip+i*.22+rand(-.08,.08),6.5,6*dm);sfx('spit')}

    case 'suck':{e.face+=clamp(angDiff(toShip,e.face),-3*dt,3*dt);e.weak=true;e.status='SUCKING! FILTER EXPOSED: +50% DAMAGE';

      for(const k of G.pickups){if(k.dead)continue;const dx=nx-k.x,dz=nz-k.z,d=Math.hypot(dx,dz)||1;if(d<16){k.x+=dx/d*8*dt;k.z+=dz/d*8*dt;if(d<.9){k.dead=true;e.eaten++}}}
      for(const n of G.nodes){if(n.dead||n.wreck)continue;const dx=nx-n.x,dz=nz-n.z,d=Math.hypot(dx,dz)||1;if(d<12){n.x+=dx/d*2.2*dt;n.z+=dz/d*2.2*dt;if(d<1.5){n.dead=true;e.eaten+=3;comic(nx,nz,'GULP!','#ffe94a',.8)}}}
      e.slurpT-=dt;if(e.slurpT<=0){e.slurpT=enr?.9:1.3;let best=null,bd=1e9;for(const m of G.pods.values()){if(m.type==='heart')continue;const d=d2(m.x,m.z,nx,nz);if(d<bd){bd=d;best=m}}
        if(best){damagePod(best,maxHpOf(best)*.28);comic(best.x,best.z,'SLURP!','#ffe94a',1);G.beams.push({pts:[[best.x,.6,best.z],[nx,.8,nz]],life:.2,mag:true});sfx('whoosh')}}
      if(Math.random()<dt*50){const a=rand(TAU),r=rand(2,7);part(nx+Math.cos(a)*r,.5,nz+Math.sin(a)*r,-Math.cos(a)*r*2,0,-Math.sin(a)*r*2,.4,pick(['#ffffff','#c8b6ff','#ffe94a']),1,{drag:0})}
      if(e.stT<=0){e.st='spit';e.stT=1.6;say(e,pick(['BAG FULL. EMPTYING.','BLEHHHH!','RETURN TO SENDER.']))}break}
    case 'spit':{e.face+=clamp(angDiff(toShip,e.face),-2*dt,2*dt);e.cd2=(e.cd2||0)-dt;
      if(e.cd2<=0&&e.eaten>-10){e.cd2=.06;e.eaten--;bossShoot(e,e.face+rand(-.55,.55),rand(5,8),7*dm);sfx('spit')}
      if(e.stT<=0){e.st='cruise';e.stT=enr?5:7}break}

function rollRelics(){
  const own=new Set(G.relics.map(r=>r.id)),pool=RELICS.filter(r=>!own.has(r.id)||r.id==='whistle');
  const nc=shuffled(pool.filter(r=>!r.cursed)),cu=pool.filter(r=>r.cursed),out=nc.slice(0,3);
  if(cu.length&&(Math.random()<.45||out.length<3))out[Math.min(2,out.length)]=pick(cu);
  return out.filter(Boolean).map(r=>({...r,r:r.cursed?'cursed':'relic'}));
}
function spawnChest(x,z){if(G.demo)return;G.chests.push({x,z,t:0,life:60,dead:false,ph:rand(TAU)});comic(x,z,'TREASURE!','#ffe94a',1.2)}
function updateChests(dt){
  const p=G.player;
  for(const c of G.chests){if(c.dead)continue;c.t+=dt;if(!chestHold(c,dt)){c.life-=dt;c.z+=G.cruiseV*.35*dt}
    if(c.life<=0||c.z>26){c.dead=true;continue}
    if(G.phase!=='dead'&&allPlayers().some(pl=>pl.alive&&d2(pl.x,pl.z,c.x,c.z)<1.2*1.2)){c.dead=true;sfx('chest');shock(c.x,c.z,3,'#ffe94a',.6);pillar(c.x,c.z,'#ffe94a',4);burst(c.x,c.z,30,['#ffe94a','#ffffff','#ff6ac1'],7);comic(c.x,c.z,'OOOOH!','#ffe94a',1.5);G.cardQueue.push('relic');G.cardDelay=Math.max(G.cardDelay,.35)}}
  G.chests=G.chests.filter(c=>!c.dead);
}

function updateMines(dt){
  for(const m of G.mines){m.t+=dt;if(m.t<.5){const u=m.t/.5;m.x=m.sx+(m.tx-m.sx)*u;m.z=m.sz+(m.tz-m.sz)*u;continue}
    m.life-=dt;if(m.life<=0){m.dead=true;continue}
    let hit=false;queryEnemies(m.x,m.z,1.5,e=>{if(!hit&&!e.noTarget&&d2(e.x,e.z,m.x,m.z)<(e.r+.5)**2)hit=true});
    if(G.boss&&!G.boss.dead&&!G.boss.invuln&&d2(G.boss.x,G.boss.z,m.x,m.z)<(G.boss.r+.5)**2)hit=true;
    if(hit){m.dead=true;explodeAt(m.x,m.z,m.splash,m.dmg,true);if(Math.random()<.3)comic(m.x,m.z,'KABOOM!','#ff5a3a',.9)}}
  G.mines=G.mines.filter(m=>!m.dead);
}

  {const h=G.pods.get('0,0');if(h&&G.phase!=='dead'&&h.hp/maxHpOf(h)<.3){G.lowT=(G.lowT||0)-dt;if(G.lowT<=0){G.lowT=.9;sfx('beat')}}}

function activateUlt(net){
  if(G&&G.netClient){if(G.ultC>=1&&!G.ult){const mw=mouseWorld();NET.hostConn.send({t:'ult',a:r2(Math.atan2(mw.z,mw.x))})}else sfx('deny');return}
  if((state!=='play'&&!(net&&['paused','cards','route','shop','inspect'].includes(state)))||!['travel','boss'].includes(G.phase)||!G.pods.has('0,0'))return;
  if(G.ult)return;if(G.ultC<1){sfx('deny');floatText(G.player.x,G.player.z,'ABILITY NOT CHARGED','#ff6a7a');return}
  const k=G.abil,def=ABILS[k];G.ultC=0;G.ult={k,t:0,dur:def.dur,a0:net&&isFinite(net.a)?+net.a:Math.atan2(mouseWorld().z,mouseWorld().x)};if(!net)G.ultUses=(G.ultUses||0)+1;
  sfx('ult');hitstop(.08);G.flashW=.35;G.shake=Math.max(G.shake,.5);banner(def.name.toUpperCase()+'!','',1.4,def.col);
  if(k==='bubble'){shock(0,0,G.shipR+2,'#4af0ff',.6);for(const m of G.pods.values())m.hp=Math.min(maxHpOf(m),m.hp+maxHpOf(m)*.25);comic(0,0,'BLOOP!','#4af0ff',1.8)}

}
function updateUlt(dt){
  if(G.phase!=='dead'&&G.phase!=='warp'&&!G.ult)G.ultC=Math.min(1,G.ultC+.004*G.S.ultRate*dt);
  const u=G.ult;if(!u)return;u.t+=dt;const dm=lvDmg();
  if(u.k==='laser'){u.a=u.a0+u.t*2.3;const dx=Math.cos(u.a),dz=Math.sin(u.a),len=18;
    for(const e of G.enemies){if(e.dead||e.invuln||(e.noTarget&&e.type!=='hook'))continue;const tt=e.x*dx+e.z*dz;if(tt<0||tt>len+e.r)continue;if(Math.abs(e.x*dz-e.z*dx)<.75+e.r)hurtEnemy(e,(e.boss?120:240)*dm*dt)}
    if(Math.random()<dt*50){const d=rand(2,len);part(dx*d,.9,dz*d,rand(-2,2),rand(1,3),rand(-2,2),.4,pick(['#ff3a5a','#ffe94a','#ffffff']),2,{g:3})}G.shake=Math.max(G.shake,.12);sfx('laser')}
  else if(u.k==='bubble'){if(Math.random()<dt*12){const a=rand(TAU),r=G.shipR+.8;part(Math.cos(a)*r,rand(.3,1.5),Math.sin(a)*r,0,.5,0,.5,'#4af0ff',1)}}
  else if(u.k==='ram'){if(!u.hit){u.hit=true;G.shake=1.2;shock(0,0,G.shipR+7,'#ffe94a',.6);shock(0,0,G.shipR+4,'#ffffff',.4);
      for(const e of G.enemies){if(e.dead||e.invuln)continue;const d=Math.hypot(e.x,e.z)||1;if(d<G.shipR+7){hurtEnemy(e,(e.boss?700:200)*dm);if(!e.boss&&!e.dead&&ETYPES[e.type]&&ETYPES[e.type].beh!=='special'){e.vx+=e.x/d*16;e.vz+=e.z/d*16}}}
      for(let i=0;i<40;i++){const a=i/40*TAU;part(Math.cos(a)*G.shipR,.6,Math.sin(a)*G.shipR,Math.cos(a)*14,0,Math.sin(a)*14,.5,pick(['#ffe94a','#ffffff']),2,{drag:1})}sfx('explode')}}
  else if(u.k==='vortex'){
    for(const k of G.pickups)if(!k.dead&&k.x*k.x+k.z*k.z<30*30){flowFrom(k.type,k.x,k.z,rand(.3));k.dead=true}
    u.cd=(u.cd||0)-dt;if(u.cd<=0){u.cd=.14;for(const n of G.nodes){if(n.dead||n.zoom||n.x*n.x+n.z*n.z>(G.shipR+12)**2)continue;flowFrom(lootOf(n),n.x,n.z,0);n.hp-=n.per;n.next=n.hp-n.per;n.shake=.2;if(n.hp<=0){n.dead=true;burst(n.x,n.z,12,[lootCol(n),'#ffffff'])}}}
    for(const e of G.enemies){if(e.dead||e.boss||ETYPES[e.type].beh==='special')continue;const d=Math.hypot(e.x,e.z)||1;if(d<10){e.x+=(-e.z/d*7-e.x/d*1.5)*dt;e.z+=(e.x/d*7-e.z/d*1.5)*dt;hurtEnemy(e,30*dm*dt)}}
    if(Math.random()<dt*60){const a=rand(TAU),r=rand(2,11);part(Math.cos(a)*r,.4,Math.sin(a)*r,-Math.sin(a)*8-Math.cos(a)*3,0,Math.cos(a)*8-Math.sin(a)*3,.5,pick(['#9aff3a','#4af0ff','#ffffff']),1,{drag:0})}}
  if(u.t>=u.dur)G.ult=null;
}

const PAD={on:false,lx:0,ly:0,fire:false,boost:false,steerL:false,steerR:false,aiming:false,aimA:0,prev:[],focus:-1,navT:0};
function padFocusables(){return [...ui.querySelectorAll('[data-act]')].filter(el=>!el.disabled)}
function padMenu(pr,dir){
  const els=padFocusables();if(!els.length)return;
  if(dir){if(PAD.focus<0||PAD.focus>=els.length)PAD.focus=0;else PAD.focus=(PAD.focus+dir+els.length)%els.length;}
  els.forEach((el,i)=>el.classList.toggle('padfocus',i===PAD.focus));if(dir)sfx('hover');if(dir&&els[PAD.focus])els[PAD.focus].scrollIntoView({block:'nearest'});
  if(pr(0)&&PAD.focus<0){PAD.focus=0;els.forEach((el,i)=>el.classList.toggle('padfocus',i===0));return}
  if(PAD.focus>=els.length)PAD.focus=els.length-1;
  if(pr(0)&&els[PAD.focus]){audioInit();const el=els[PAD.focus],ka=el.dataset.act,kg=el.dataset.arg;el.click();const n=padFocusables();let j=n.findIndex(x=>x.dataset.act===ka&&x.dataset.arg===kg);if(j<0)j=n.findIndex(x=>x.classList.contains('tile')&&x.classList.contains('on'));PAD.focus=Math.min(j,n.length-1);n.forEach((x,i)=>x.classList.toggle('padfocus',i===PAD.focus))}
  if(pr(1)&&state!=='title'){if(state==='loadout'){if(PREP.step>1&&PREP.mode!=='daily')showPrep(PREP.step-1);else showTitle()}else{const back=els.find(el=>['title','resume','closeshop','optback','questback','howback','mpleave','hangarback'].includes(el.dataset.act))||els.find(el=>el.dataset.act==='hangar');if(back)back.click()}}
}
function pollPad(dt){
  const gps=navigator.getGamepads?navigator.getGamepads():[];let gp=null;for(const g of gps)if(g&&g.connected&&(!gp||g.mapping==='standard'&&gp.mapping!=='standard'))gp=g;
  if(!gp){PAD.fire=PAD.boost=PAD.steerL=PAD.steerR=PAD.aiming=PAD.on=false;PAD.lx=PAD.ly=0;PAD.prev=[];return}
  const dz=v=>Math.abs(v)<.2?0:v,b=i=>!!(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>.4)),pr=i=>b(i)&&!PAD.prev[i];
  PAD.lx=dz(gp.axes[0]||0);PAD.ly=dz(gp.axes[1]||0);const std=gp.mapping==='standard',rx=std?dz(gp.axes[2]||0):0,ry=std?dz(gp.axes[3]||0):0;
  if(Math.hypot(rx,ry)>.35){PAD.aiming=true;PAD.aimA=Math.atan2(ry,rx)}
  if(PAD.lx||PAD.ly||gp.buttons.some((_,i)=>b(i))){if(!PAD.on){PAD.on=true}audioInit()}
  PAD.fire=b(7)||b(5);PAD.boost=b(6)||b(4);PAD.steerL=b(14);PAD.steerR=b(15);
  if(state==='play'){
    if(pr(0))doBuild();if(pr(1))doScrap();if(pr(3))activateUlt();
    const l=buildList();if(pr(2)||pr(13)){G.sel=(G.sel+1)%l.length;sfx('select')}if(pr(12)){G.sel=(G.sel-1+l.length)%l.length;sfx('select')}
    if(pr(9))setPaused(true);if(pr(8))tryWarp();
  }else{
    PAD.navT-=dt||1/60;let dir=0;if(pr(13)||pr(15))dir=1;else if(pr(12)||pr(14))dir=-1;
    else if(PAD.navT<=0&&(Math.abs(PAD.ly)>.6||Math.abs(PAD.lx)>.6)){dir=(PAD.ly||PAD.lx)>0?1:-1;PAD.navT=.22}
    if(pr(9)&&state==='paused')setPaused(false);else padMenu(pr,dir);
  }
  PAD.prev=gp.buttons.map((_,i)=>b(i));
}

function startPirateFleet(ev){

    p.dir=i%2?1:-1;p.st2=4+i;if(big){p.big=true;p.hp=p.maxhp=p.maxhp*2.6;p.r*=1.35;p.dmg*=1.2}ev.list.push(p)}
  ev.volT=7;ev.vol=null;G.shake=Math.max(G.shake,.4);
}
function updatePirateFleet(ev,dt){
  const live=ev.list.filter(x=>!x.dead&&!x.leaving);if(!live.length)return;

function heatD(sel){

  for(const k in sel||{}){const m=HEATMODS[k];if(!m)continue;const r=Math.max(0,Math.min(sel[k]|0,m.ranks));if(!r)continue;clean[k]=r;m.fx(D,r);h+=r*m.pts}

// run summary used by quests + dust (host sends the same object to co-op clients)
function runStats(won){
  let tier=1;for(const m of G.pods.values())tier=Math.max(tier,m.tier||1);
  const q=G.qs||{};
  return {won:!!won,heat:G.D.heat||0,region:won?Math.max(NREG,G.region+1):G.region+1,kills:G.kills,bosses:G.bosses,minis:G.minis,merges:G.merges,combo:G.bestCombo,L:G.L,
    pods:Math.max(q.pods||0,G.pods.size),crew:Math.max(q.crew||0,G.crew.length),tier:Math.max(q.tier||1,tier),relics:G.relics.length,events:q.events||0,
    ship:G.shipKey,gun:G.gun,sector:G.sector,time:Math.round(G.t),dustBonus:G.coinBonus||0,daily:!!G.daily,endless:!!G.endless};
}
// peaks are tracked once a second so scrapping/losing pods later doesn't undo a quest
function trackQuestStats(){
  if(!G||G.demo)return;const q=G.qs||(G.qs={pods:0,crew:0,tier:1,events:0,live:{}});
  q.pods=Math.max(q.pods,G.pods.size);q.crew=Math.max(q.crew,G.crew.length);for(const m of G.pods.values())q.tier=Math.max(q.tier,m.tier||1);
  // live "objective done" toasts (coins are paid when the run ends)
  const R=runStats(false);R.region=G.region+1;
  for(const k of QUESTS){if(meta.quests[k.id]||q.live[k.id]||k.L>R.heat)continue;if(!k.w&&k.ok(R)){q.live[k.id]=1;G.toasts.push({q:k.id,t:4.5});sfx('win')}}
}
function runDust(R){return Math.round((R.kills*.08+R.sector*5+R.bosses*15+R.minis*8+(R.won?60:0))*(1+.06*R.heat)*(1+(R.dustBonus||0)))}
// pays out quests + dust; returns {dust,coins,done:[quests]}
function payRun(R){
  const done=[];
  for(const q of QUESTS){if(meta.quests[q.id]||R.heat<q.L||(q.w&&!R.won))continue;if(q.ok(R)){meta.quests[q.id]=1;done.push(q)}}
  const coins=done.reduce((a,q)=>a+q.coins,0),dust=runDust(R);
  meta.coins+=coins;meta.dust=(meta.dust||0)+dust;meta.runs++;
  if(R.won){meta.bestHeat=Math.max(meta.bestHeat==null?-1:meta.bestHeat,R.heat)}
  saveMeta();return {dust,coins,done};
}

function featureActM(a,arg){

      UI3.sel={};UI3.tab={};PREP.step=1;PREP.mode='standard';showTitle();banner('FRESH START!','Your save has been wiped',3,'#ff6ac1');return true}showOptions();return true}
  if(a==='tab'&&!arg.startsWith('options'))WIPE_ARM=false;
  if(a==='play'||a==='loadout'){PREP.step=1;showPrep();return true}
  if(a==='prep'){showPrep(+arg);return true}
  if(a==='pmode'){if(arg==='endless'&&!meta.wins){sfx('deny');return true}PREP.mode=arg;sfx('ui');showPrep(PREP.mode==='daily'?3:PREP.step);return true}
  if(a==='progress'){showQuests('title');return true}
  if(a==='dailies'){showDailies();return true}
  if(a==='dailygo'){startDaily();return true}
  if(a==='hangar'){if(state!=='hangar')HANGAR_FROM=state==='loadout'?'loadout':'title';showHangar();return true}
  if(a==='hangarback'){if(HANGAR_FROM==='loadout')showPrep();else showTitle();return true}
  if(a==='hgroup'){const cur=UI3.tab.hangar;if(cur)HG_LAST[hGroupOf(cur)]=cur;UI3.tab.hangar=HG_LAST[arg]||HGROUPS[arg].tabs[0].id;showHangar();return true}
  return false;
}

function buildList(){return BUILD_ORDER.filter(t=>G.unlocked.has(t))}
const costOf=t=>{const o={},grow=1+Math.max(0,G.pods.size-7)*.05;for(const [k,v] of Object.entries(MODS[t].cost))o[k]=Math.max(1,Math.ceil(v*G.S.costMul*grow));return o};
const canAfford=c=>Object.entries(c).every(([k,v])=>G.bank[k]>=v);
const pay=c=>{for(const [k,v] of Object.entries(c))G.bank[k]-=v};
function costMissing(c){return Object.entries(c).filter(([k,v])=>G.bank[k]<v).map(([k,v])=>Math.ceil(v-G.bank[k])+' '+k).join(', ')}
function doBuild(){
  if(G.netClient){const a=G.act;if(a&&a.kind==='slot'&&G.player.alive){const list=buildList(),type=list[clamp(G.sel,0,list.length-1)],c=costOf(type);if(!canAfford(c)){sfx('deny');floatText(G.player.x,G.player.z,'NEED '+costMissing(c),'#ff6a4a');return}NET.hostConn.send({t:'build',q:a.q,r:a.r,type});sfx('select')}return}
  if(G.nearTrader){openShop();return}
  if(G.nearCasino){spinCasino();return}
  const a=G.act,p=G.player;if(!a||!p.alive)return;
  if(a.kind!=='slot'){floatText(p.x,p.z,'Feed the Heart to level pods up!','#ff6ac1');sfx('deny');return}
  const list=buildList(),type=list[clamp(G.sel,0,list.length-1)],c=costOf(type);
  if(!canAfford(c)){sfx('deny');floatText(p.x,p.z,'NEED '+costMissing(c),'#ff6a4a');return}
  if(G.pods.has(key(a.q,a.r)))return;pay(c);const m=addPod(type,a.q,a.r);m.paid=c;rebuildShip();sfx('build');shock(m.x,m.z,1.8,'#ffffff',.35);
  burst(m.x,m.z,22,[MODS[type].col,'#ffffff','#ffe94a']);puff(m.x,.6,m.z,.6,'#ffffff',.4);floatText(m.x,m.z,MODS[type].name.toUpperCase()+'!','#ffe94a');
  tryMerge(m);if(G.pods.size>=30)achieve('pods30');
}
function doScrap(){
  if(G.netClient){const a=G.act;if(a&&a.kind==='pod'&&a.m.type!=='heart')NET.hostConn.send({t:'scrap',q:a.m.q,r:a.m.r});return}
  const a=G.act,p=G.player;if(!a||a.kind!=='pod'||!p.alive)return;const m=a.m;
  if(m.type==='heart'){sfx('deny');floatText(p.x,p.z,"YOU CAN'T SCRAP THE HEART!",'#ff6a4a');return}
  const k=key(m.q,m.r);if(reachable(k).size<G.pods.size-1){sfx('deny');floatText(p.x,p.z,'THAT WOULD SNAP THE SHIP!','#ff6a4a');return}
  G.pods.delete(k);m.dead=true;const parts=[];
  for(const [r,v] of Object.entries(m.paid||MODS[m.type].cost)){const g=Math.floor(v*.5);if(g){G.bank[r]+=g;parts.push('+'+g+' '+r)}}
  rebuildShip();burst(m.x,m.z,14,['#c8b6ff','#ffffff']);puff(m.x,.5,m.z,.5,'#ffffff',.4);sfx('boom');floatText(m.x,m.z,parts.join(' ')||'SCRAPPED','#d8dce8');
}
function onKey(e){
  if(state==='mp'){if(e.code==='Escape')featureActNet('mpleave');return}
  if(state==='howto'){if(e.code==='Escape')featureActNet('howback');return}
  if(e.repeat&&state!=='play')return;
  if(state==='options'&&REBIND){if(e.code!=='Escape'){if(/^(Tab|Enter|Space|ShiftRight|Arrow|Digit|Numpad|F\d)/.test(e.code)){sfx('deny');return}const old=SET.binds[REBIND];for(const a in SET.binds)if(a!==REBIND&&SET.binds[a]===e.code)SET.binds[a]=old;SET.binds[REBIND]=e.code}REBIND=null;saveSet();showOptions();return}
  if(state==='options'){if(e.code==='Escape')featureAct2('optback');return}
  if(state==='wardrobe'){if(e.code==='Escape')showHangar();return}
  if(state==='loadout'&&(e.code==='Escape'||e.code==='Enter')){if(e.code==='Escape'){if(PREP.step>1&&PREP.mode!=='daily')showPrep(PREP.step-1);else showTitle()}else{const b=document.querySelector('#ui .ft .btn.big');if(b)b.click()}return}
  if(state==='hangar'&&e.code==='Escape'){featureActM('hangarback');return}
  if(state==='over'&&e.code==='Escape'){showTitle();return}
  if(state==='route'){const n=+e.code.replace('Digit','').replace('Numpad','');if(n>=1&&n<=3)pickRoute(n-1);return}
  if(state==='codex'||state==='ach'||state==='dailies'){if(e.code==='Escape')featureActQ('questback');return}
  if(state==='quests'){if(e.code==='Escape')featureActQ('questback');return}
  if(state==='victory')return;
  if(state==='shop'){if(e.code==='Escape'||e.code===SET.binds.build)closeShop();return}
  if(state==='cards'){const n=+e.code.replace('Digit','').replace('Numpad','');if(n>=1&&n<=9)pickCard(n-1);return}
  if(state==='paused'){if(e.code==='Escape'||e.code===SET.binds.pause)setPaused(false);return}
  if(state==='title'){if(e.code==='Enter')featureActM('play');return}
  if(state==='play'&&G&&G.phase==='ready'&&(e.code===SET.binds.warp||e.code==='Enter')){tryWarp();return}
  if(state!=='play'||e.repeat)return;
  if(e.code==='Escape'||e.code===SET.binds.pause){setPaused(true);return}
  if(e.code===SET.binds.mute){muted=!muted;if(musGain)musGain.gain.value=muted?0:.12*SET.music;banner(muted?'SOUND OFF':'SOUND ON','',1);return}
  const list=buildList();
  if(/^Digit\d$/.test(e.code)){let n=+e.code[5];n=n===0?9:n-1;if(n<list.length){G.sel=n;sfx('select')}}
  if(e.code===SET.binds.cycle||e.code==='Tab'){G.sel=(G.sel+1)%list.length;sfx('select')}
  if(e.code===SET.binds.build)doBuild();if(e.code===SET.binds.ability)activateUlt();
  if(e.code===SET.binds.scrap)doScrap();
  
}

  if(G.routeName&&G.phase==='travel'&&!G.boss)txt('ROUTE: '+G.routeName,W/2,y+1,'#c8b6ff','center',6);
  // combo (left, under the bank)
  ctx.save();ctx.scale(HUDK,HUDK);if(G.combo>=3){const k=1+Math.max(0,G.comboT-2.3)*1.5;ctx.save();ctx.translate(10,52);ctx.scale(k,k);txt(G.combo+'x COMBO!',0,0,G.combo>=20?'#ff6ad8':G.combo>=10?'#ffe94a':'#ffffff','left',11,3);ctx.restore();bar(10,68,64,4,G.comboT/(2.6+(G.S.comboX||0)),'#ffe94a')}
  ctx.restore();
  // crew (bottom left)
  hudCorner(0,H);
  if(G.crew.length){const y0=(hudLow()?H-64:H-82)-G.crew.length*11;txt('CREW',8,y0-11,'#4af0ff','left',7);
    G.crew.forEach((c,i)=>{ctx.fillStyle=CREW_ROLES[c.role].col;ctx.beginPath();ctx.arc(12,y0+i*11+4,3,0,TAU);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#1a0838';ctx.stroke();txt(c.name+' · '+CREW_ROLES[c.role].name,18,y0+i*11,'#ffffff','left',6)})}
  // helm (bottom left corner)
  {const cx=38,cy=hudLow()?H-42:H-62,hv=clamp(G.helmV/3.2,-1,1);txt(keyName(SET.binds.steerL),8,cy-5,kb('steerL')?'#ffe94a':'#c8b6ff','left',7);txt(keyName(SET.binds.steerR),64,cy-5,kb('steerR')?'#ffe94a':'#c8b6ff','left',7);
    rrect(17,cy-3,44,6,3);ctx.fillStyle='#1a0838';ctx.fill();ctx.beginPath();ctx.arc(cx+hv*18,cy,3.5,0,TAU);ctx.fillStyle='#4af0ff';ctx.fill();txt('STEER',cx,cy-14,'#c8b6ff','center',6)}
  ctx.restore();
  // achievement toasts (right, under the heart panel)
  hudCorner(W,0);
  G.toasts.forEach((q,i)=>{const qq=q.q&&QBYID[q.q],a=qq||ACH[q.id],yy=42+i*29,x=W-152+Math.max(0,q.t-4.1)*400;ctx.globalAlpha=clamp(Math.min(q.t,4.5-q.t)*3,0,1);panel(x,yy,147,26,qq?'rgba(20,80,122,.95)':'rgba(122,90,20,.95)');
    txt(qq?'QUEST! +'+qq.coins+' COINS AT END':'ACHIEVEMENT!  +'+a.coins+' DUST',x+6,yy+3,qq?'#4af0ff':'#ffe94a','left',6);txt(a.name,x+6,yy+12,'#ffffff','left',9);ctx.globalAlpha=1});
  ctx.restore();
  if(G.weather&&G.weather.k==='ion'&&Math.floor(G.t*13)%5===0){ctx.fillStyle='rgba(74,240,255,.07)';ctx.fillRect(0,0,W,H)}
  if(G.nearCasino&&G.event&&G.event.npc){const n=G.event.npc,s=toHUD(n.x,n.z,2.9);txt(G.casinoT>0?'SPINNING...':'['+keyName(SET.binds.build)+'] SPIN THE SLOTS ('+((G.event.spins||0)>=6?'SOLD OUT':casinoCost()+' SCRAP')+')',s.x,s.y,'#ffe94a','center',9)}
  if(G.event){const ev=G.event;
    if(ev.k==='casino'&&!ev.npc.leave)edgeArrow(ev.npc.x,ev.npc.z,'#ffe94a','CASINO');
    if(ev.k==='derelict'&&ev.node&&!ev.node.dead)edgeArrow(ev.node.x,ev.node.z,'#c8b6ff','WRECK');
    if(ev.k==='puppy'){const u=ev.pup,s=toHUD(u.x,u.z,1);txt(u.name,s.x,s.y,'#7aff6a','center',6)}}
  // elite powers + shields
  for(const e of G.enemies){if(e.dead||!e.afx||!e.afx.length||e.mini)continue;const s=toHUD(e.x,e.z,2.2);if(s.behind||s.x<20||s.x>W-20||s.y<70||s.y>H-60)continue;let x=s.x-(e.afx.length-1)*16;for(const a of e.afx){txt(a.toUpperCase(),x,s.y-9,AFX_COL[a],'center',6);x+=32}
    if(e.shield>0)bar(s.x-8,s.y-1,16,3,e.shield/(e.maxhp*.6),'#4af0ff')}
  if(G.mini&&!G.mini.dead){const e=G.mini,s=toHUD(e.x,e.z,3.4);txt(e.afx.map(a=>a.toUpperCase()).join(' + '),s.x,Math.max(s.y,64),'#ffb04a','center',7)}
}
// ---------- HUD 2: ability meter, relics, chests, fog ----------
function drawFeatureHUD2(){
  const def=ABILS[G.abil]||ABILS.laser,x=W-134,y=hudLow()?H-73:H-94,ready=G.ultC>=1&&!G.ult;if(ready&&!G.ultRdy)sfx('charged');G.ultRdy=ready;
  hudCorner(W,H);panel(x,y,128,40,ready?'rgba(122,26,90,.95)':'rgba(58,26,122,.92)');txt(def.name.toUpperCase(),x+8,y+4,def.col,'left',8);
  bar(x+8,y+17,112,7,G.ult?1-G.ult.t/G.ult.dur:G.ultC,ready&&Math.floor(G.t*6)%2?'#ffffff':def.col);
  txt(G.ult?'ACTIVE!':ready?'['+keyName(SET.binds.ability)+'] READY!':'CHARGING '+Math.floor(G.ultC*100)+'%',x+8,y+27,ready?'#ffe94a':'#c8b6ff','left',7);ctx.restore();
  ctx.save();ctx.scale(HUDK,HUDK);if(G.relics.length){ctx.font='9px serif';ctx.textBaseline='top';ctx.textAlign='left';let rx=10,ry=G.combo>=3?76:54;
    G.relics.forEach((r,i)=>{if(i&&i%9===0){rx=10;ry+=13}rrect(rx-1,ry-1,12,12,3);ctx.fillStyle=r.cursed?'rgba(110,20,140,.9)':'rgba(26,8,56,.8)';ctx.fill();ctx.font='9px serif';ctx.fillText(r.icon,rx,ry+.5);rx+=13})}ctx.restore();
  for(const c of G.chests)edgeArrow(c.x,c.z,'#ffe94a','CHEST',true);
  if(G.weather&&G.weather.k==='fog'){const k=Math.min(1,G.weather.t,G.weather.dur-G.weather.t);const gr=ctx.createRadialGradient(W/2,H/2,H*.15,W/2,H/2,H*.75);gr.addColorStop(0,'rgba(120,255,200,0)');gr.addColorStop(1,`rgba(40,90,80,${.55*k})`);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
  if(G.ult&&G.ult.k==='bubble'){ctx.fillStyle='rgba(74,240,255,.05)';ctx.fillRect(0,0,W,H)}
  {const h=G.pods.get('0,0');if(h&&G.phase!=='dead'&&h.hp/maxHpOf(h)<.3){const k=.5+.5*Math.sin(G.t*8),gr=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);gr.addColorStop(0,'rgba(255,40,80,0)');gr.addColorStop(1,`rgba(255,40,80,${.22+.18*k})`);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);txt('HEART IN DANGER!',W/2,H*.6,k>.5?'#ff4a6a':'#ffffff','center',11,3)}}
}
let warpBtn=null;
function syncWarpBtn(){const show=!!(G&&!G.demo&&!G.netClient&&state==='play'&&G.phase==='ready');
  if(show&&!warpBtn){warpBtn=document.createElement('button');warpBtn.id='warpbtn';warpBtn.innerHTML='<span>🌀</span> WARP!<small></small>';warpBtn.onclick=e=>{e.stopPropagation();audioInit();sfx('select');tryWarp()};document.body.appendChild(warpBtn)}
  if(warpBtn){warpBtn.style.display=show?'flex':'none';if(show)warpBtn.querySelector('small').textContent='['+keyName(SET.binds.warp)+']'}}
function render(dt){
  frameId++;syncWarpBtn();if(!G)return;runPrewarm();
  const sh=G.shake*SET.shake,fx=G.cam.x+(sh?rand(-sh,sh):0),fz=G.cam.z+(sh?rand(-sh,sh):0),d=G.cam.d;
  camera.fov=FOV+clamp((G.cruiseV-2)/30,0,1)*14;camera.updateProjectionMatrix();
  camera.position.set(fx,Math.sin(PITCH)*d,fz+Math.cos(PITCH)*d);camera.lookAt(fx,0,fz);camera.updateMatrixWorld();
  syncWorld(state==='play'||G.demo||G.netClient?dt:0);
  if(post.composer){post.grade.uniforms.time.value=performance.now()/1000;post.grade.uniforms.flash.value=G.warpFlash*.8+(G.flashW||0)+(G.phase==='warp'&&G.phaseT<.35?(.35-G.phaseT)*2:0);post.composer.render()}else renderer.render(scene,camera);
  ctx.setTransform(2*glUi()*DPR,0,0,2*glUi()*DPR,0,0);ctx.clearRect(0,0,W,H);
  if(!G.demo&&['play','paused','cards','route','shop','inspect','victory'].includes(state)){drawWorldOverlay();drawHUD();drawFeatureHUD();drawFeatureHUD2();drawFeatureHUD3()}
}

// ---------- loop ----------
let last=performance.now();
function frame(now){requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000);last=now;
  pollPad(dt);
  if(G&&G.netClient){if(state==='play'||state==='paused')clientUpdate(dt)}
  else if(G){if(state==='play'){if(G.hitstop>0){G.hitstop-=dt;update(dt*.08)}else update(dt)}else if(G.demo)updateDemo(dt)}
  netTick(dt);
  render(dt);
}
applyRegionLook(0,true);
if(document.fonts&&document.fonts.load)document.fonts.load("16px 'Lilita One'").catch(()=>{});
makeIcons();
applySettings();
showTitle();
requestAnimationFrame(frame);
</script>
<script>
/* Pickle Game Library: stats & achievements */
(function () {
  var last = {};
  function stat(S, k, v) { if (last[k] === v) return; last[k] = v; S.setStat(k, v, true); }
  function glSync() {
    var S = window.GameSDK;
    if (!S || !meta) return;
    try {
      var A = meta.ach || {}, n = Object.keys(A).length;
      stat(S, 'total_runs', meta.runs || 0);
      stat(S, 'wins', meta.wins || 0);
      stat(S, 'total_kills', meta.totalKills || 0);
      if (meta.bestHeat >= 0) stat(S, 'best_heat', meta.bestHeat);
      stat(S, 'achievements_earned', n);
      if ((meta.runs || 0) >= 1) S.unlockAchievement('liftoff', 'Liftoff');
      if (A.boss1) S.unlockAchievement('whale_watcher', 'Whale Watcher');
      if (A.casino) S.unlockAchievement('high_roller', 'High Roller');
      if ((meta.totalKills || 0) >= 1000) S.unlockAchievement('bonk_legend', 'Bonk Legend');
      if ((meta.wins || 0) >= 1) S.unlockAchievement('sorry_gerald', 'Sorry, Gerald');
      if (meta.bestHeat >= 10) S.unlockAchievement('too_hot', 'Too Hot to Handle');
      if (n >= 20) S.unlockAchievement('trophy_hunter', 'Trophy Hunter');
    } catch (e) {}
  }
  function coopWin() {
    var S = window.GameSDK; if (!S) return;
    S.incrementStat('online_wins');
    S.unlockAchievement('crew_goals', 'Crew Goals');
  }
  var save = saveMeta;
  saveMeta = function () { var r = save.apply(this, arguments); glSync(); return r; };
  var end = endRun;
  endRun = function (win) {
    var coop = NET.role === 'host' && NET.conns.length > 0 && (win || (G && G.won));
    var r = end.apply(this, arguments); if (coop) coopWin(); return r;
  };
  var over = clientOver;
  clientOver = function (d) { var r = over.apply(this, arguments); if (d && d.won) coopWin(); return r; };
  glSync();
})();
</script>
<script>
/* Pickle Game Library: co-op room browser */
(function () {
  var ad = { h: null, busy: false, code: '' }, rooms = null, roomsT = -1e9, roomsBusy = false;
  function glNetAd() {
    var sdk = window.LobbySDK;
    var want = sdk && sdk.advertiseRoom && NET.role === 'host' && !NET.local && !NET.glPriv && NET.peer && NET.peer.open
      && state === 'mp' && NET.lobby.length < 4 ? NET.code : '';
    if (ad.h && ad.code !== want) { ad.h.close(); ad.h = null; }
    if (want && !ad.h && !ad.busy) {
      ad.busy = true;
      sdk.advertiseRoom('galaxy_rush', want).then(function (h) { ad.busy = false; ad.h = h; ad.code = want; glNetAd(); }, function () { ad.busy = false; });
    }
  }
  addEventListener('beforeunload', function () { if (ad.h) ad.h.close(); });

  function drawRooms() {
    var box = document.getElementById('gl-rooms'); if (!box) return;
    var list = box.querySelector('.keygrid'); list.textContent = '';
    box.querySelector('.gl-rn').textContent = rooms ? rooms.length + ' open' : roomsBusy ? 'looking...' : 'unavailable';
    if (!rooms || !rooms.length) {
      var e = document.createElement('div'); e.className = 'hint';
      e.textContent = rooms ? 'No open rooms right now. Host one, or join a friend with their code.' : roomsBusy ? 'Looking for rooms...' : 'Room list unavailable.';
      list.appendChild(e); return;
    }
    rooms.forEach(function (r) {
      var row = document.createElement('div'); row.className = 'krow';
      var n = document.createElement('span'); n.textContent = '\u{1F6F0}\uFE0F ' + r.hostName + "'s room";
      var b = document.createElement('button'); b.className = 'btn'; b.style.cssText = 'margin:0;padding:4px 14px;font-size:15px'; b.textContent = 'JOIN ' + r.peerId;
      b.onclick = function () { var ni = document.getElementById('mpname'); if (ni) NET.name = ni.value.trim(); netJoin(r.peerId); };
      row.append(n, b); list.appendChild(row);
    });
  }
  function fetchRooms(force) {
    var sdk = window.LobbySDK;
    if (!sdk || !sdk.listRooms || roomsBusy || (!force && performance.now() - roomsT < 8000)) return;
    roomsBusy = true; drawRooms();
    sdk.listRooms('galaxy_rush').then(function (r) { rooms = r; }, function () { rooms = null; }).then(function () {
      roomsBusy = false; roomsT = performance.now(); drawRooms(); });
  }
  // refresh the list every 8 s while the join screen is up
  setInterval(function () { if (state === 'mp' && !NET.role && document.getElementById('gl-rooms')) fetchRooms(); }, 8000);

  var show = showMP;
  showMP = function () {
    var r = show.apply(this, arguments);
    var panel = document.querySelector('#ui .panel');
    if (panel && !NET.role && window.LobbySDK && !NET.local) {
      var box = document.createElement('div'); box.id = 'gl-rooms';
      box.innerHTML = '<div class="sect" style="display:flex;align-items:center;gap:10px">OPEN ROOMS <span class="dim gl-rn"></span>'
        + '<button class="btn" style="margin:0 0 0 auto;padding:3px 12px;font-size:13px">REFRESH</button></div><div class="keygrid" style="margin-top:6px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))"></div>';
      box.querySelector('button').onclick = function () { fetchRooms(true); };
      var at = panel.querySelector('.mpcs'); if (at) at.after(box); else panel.appendChild(box);
      drawRooms(); fetchRooms();
    }
    if (panel && NET.role === 'host' && !NET.local && window.LobbySDK) {
      var lab = document.createElement('label'); lab.className = 'hint'; lab.style.cssText = 'display:block;text-align:center';
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !NET.glPriv;
      cb.onchange = function () { NET.glPriv = !cb.checked; glNetAd(); };
      lab.append(cb, ' List this room publicly (anyone can join from OPEN ROOMS; friends can always use the code)');
      var st = panel.querySelector('[data-act="mpstart"]'); if (st) st.before(lab); else panel.appendChild(lab);
    }
    glNetAd();
    return r;
  };
  var leave = netLeave;
  netLeave = function () { var r = leave.apply(this, arguments); glNetAd(); return r; };
  var start = hostStartGame;
  hostStartGame = function () { var r = start.apply(this, arguments); glNetAd(); return r; };
})();
</script>
