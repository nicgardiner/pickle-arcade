<svg width="400" height="600" viewBox="0 0 680 1020" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="groblins" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#4b3d70"/><stop offset="0.55" stop-color="#4a2c16"/><stop offset="1" stop-color="#0d0805"/></linearGradient>
<radialGradient id="rbSkin" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#e2e070"/><stop offset="0.55" stop-color="#b5b83c"/><stop offset="1" stop-color="#6c7420"/></radialGradient>
<linearGradient id="rbEar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9b23a"/><stop offset="1" stop-color="#5d6a1c"/></linearGradient>
<linearGradient id="rbHat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8aa244"/><stop offset="1" stop-color="#4a6224"/></linearGradient>
<filter id="rbSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="680" height="1020" fill="url(#groblins)"/>
<rect x="0" y="0" width="680" height="148" fill="rgba(0,0,0,0.34)"/>
<line x1="0" y1="148" x2="680" y2="148" stroke="#f0b43c" stroke-width="1.2"/>
<rect x="48" y="100" width="182" height="1.5" fill="#f0b43c" opacity="0.5"/><rect x="450" y="100" width="182" height="1.5" fill="#f0b43c" opacity="0.5"/>
<text x="343" y="135" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900" font-size="68" fill="rgba(0,0,0,0.45)" letter-spacing="4">ROBLINS</text>
<text x="340" y="132" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900" font-size="68" fill="#f0b43c" letter-spacing="4">ROBLINS</text>
<g>
  <ellipse cx="340" cy="846" rx="170" ry="24" fill="#000" opacity="0.34" filter="url(#rbSoft)"/>
  <!-- ears: long low spikes out to the sides, as on the cover -->
  <path d="M 268 700 L 152 632 L 278 664 Z" fill="url(#rbEar)" stroke="#2a300c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 412 700 L 528 632 L 402 664 Z" fill="url(#rbEar)" stroke="#2a300c" stroke-width="5" stroke-linejoin="round"/>
  <!-- head -->
  <path d="M 262 640 L 418 640 L 410 770 L 372 812 L 308 812 L 270 770 Z" fill="url(#rbSkin)" stroke="#2a300c" stroke-width="6" stroke-linejoin="round"/>
  <!-- eyes and the long nose -->
  <rect x="290" y="694" width="34" height="18" fill="#140f06"/><rect x="356" y="694" width="34" height="18" fill="#140f06"/>
  <rect x="300" y="697" width="9" height="8" fill="#f0b43c"/><rect x="366" y="697" width="9" height="8" fill="#f0b43c"/>
  <path d="M 340 712 L 356 760 L 324 760 Z" fill="#8c9228" stroke="#2a300c" stroke-width="4" stroke-linejoin="round"/>
  <!-- the pointed hat, brim and bobble -->
  <path d="M 340 486 L 404 616 L 276 616 Z" fill="url(#rbHat)" stroke="#1e2a0c" stroke-width="6" stroke-linejoin="round"/>
  <rect x="238" y="610" width="204" height="34" rx="6" fill="#5a7228" stroke="#1e2a0c" stroke-width="6"/>
  <circle cx="340" cy="484" r="15" fill="#6a4a2a" stroke="#1e2a0c" stroke-width="5"/>
</g>
<rect x="0" y="988" width="680" height="32" fill="rgba(0,0,0,0.34)"/>
<line x1="0" y1="988" x2="680" y2="988" stroke="#f0b43c" stroke-width="0.8" opacity="0.3"/>
</svg>
