<svg width="400" height="600" viewBox="0 0 680 1020" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="gvd" x1="0.91" y1="0.213" x2="0.09" y2="0.787">
<stop offset="0" stop-color="#3a1b6e"/><stop offset="0.5" stop-color="#141238"/><stop offset="1" stop-color="#04040f"/>
</linearGradient>
<radialGradient id="gvdCore" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#3be0ff" stop-opacity="0.55"/><stop offset="1" stop-color="#3be0ff" stop-opacity="0"/>
</radialGradient>
<filter id="vdmSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
<clipPath id="vdmMouth"><circle cx="340" cy="655" r="156"/></clipPath>
</defs>
<rect width="680" height="1020" fill="url(#gvd)"/>
<rect x="0" y="0" width="680" height="148" fill="rgba(0,0,0,0.34)"/>
<line x1="0" y1="148" x2="680" y2="148" stroke="#3be0ff" stroke-width="1.2"/>
<rect x="48" y="100" width="202" height="1.5" fill="#3be0ff" opacity="0.5"/>
<rect x="430" y="100" width="202" height="1.5" fill="#3be0ff" opacity="0.5"/>
<text x="343" y="135" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="54" fill="rgba(0,0,0,0.45)" letter-spacing="4">VECTORDROME</text>
<text x="340" y="132" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="54" fill="#3be0ff" letter-spacing="4">VECTORDROME</text>

<g>
  <ellipse cx="340" cy="842" rx="152" ry="24" fill="#000" opacity="0.36" filter="url(#vdmSoft)"/>
  <ellipse cx="371" cy="598" rx="118" ry="118" fill="url(#gvdCore)"/>

  <!-- radial spokes, clipped to the tunnel mouth -->
  <g clip-path="url(#vdmMouth)" stroke-linecap="round">
    <g stroke="#05030f" stroke-width="13">
      <line x1="414.2" y1="613.7" x2="591.8" y2="678.4"/>
      <line x1="390.4" y1="639.7" x2="470.3" y2="811.0"/>
      <line x1="333.3" y1="624.4" x2="178.5" y2="732.8"/>
      <line x1="327.8" y1="582.3" x2="150.2" y2="517.6"/>
      <line x1="355.3" y1="554.8" x2="290.6" y2="377.2"/>
      <line x1="406.2" y1="568.4" x2="551.0" y2="447.0"/>
    </g>
    <g stroke="#3be0ff" stroke-width="6" opacity="0.9">
      <line x1="414.2" y1="613.7" x2="591.8" y2="678.4"/>
      <line x1="390.4" y1="639.7" x2="470.3" y2="811.0"/>
      <line x1="333.3" y1="624.4" x2="178.5" y2="732.8"/>
      <line x1="327.8" y1="582.3" x2="150.2" y2="517.6"/>
      <line x1="355.3" y1="554.8" x2="290.6" y2="377.2"/>
      <line x1="406.2" y1="568.4" x2="551.0" y2="447.0"/>
    </g>
  </g>

  <!-- concentric rings converging on the vanishing point -->
  <g fill="none">
    <g stroke="#05030f">
      <circle cx="340" cy="655" r="156" stroke-width="16"/>
      <circle cx="351" cy="636" r="106" stroke-width="13"/>
      <circle cx="360" cy="619" r="66"  stroke-width="11"/>
      <circle cx="367" cy="606" r="36"  stroke-width="9"/>
    </g>
    <g stroke="#3be0ff">
      <circle cx="340" cy="655" r="156" stroke-width="9"/>
      <circle cx="351" cy="636" r="106" stroke-width="7"/>
      <circle cx="360" cy="619" r="66"  stroke-width="5.5"/>
      <circle cx="367" cy="606" r="36"  stroke-width="4"/>
    </g>
  </g>
  <circle cx="371" cy="598" r="13" fill="#05030f"/>
  <circle cx="371" cy="598" r="8"  fill="#eaffff"/>

  <!-- magenta arc-gate segment -->
  <path d="M 249.1,606.8 A 106,106 0 0 1 318.2,535.2" fill="none" stroke="#05030f"
        stroke-width="26" stroke-linecap="round"/>
  <path d="M 249.1,606.8 A 106,106 0 0 1 318.2,535.2" fill="none" stroke="#ff4fd2"
        stroke-width="17" stroke-linecap="round"/>
  <path d="M 249.1,606.8 A 106,106 0 0 1 318.2,535.2" fill="none" stroke="#ffffff"
        stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

  <!-- the ship wedge, hugging the inner wall at the bottom -->
  <g transform="translate(328,760) rotate(15) scale(1.12)">
    <path d="M 0,-44 L 31,27 L 11,16 L 0,30 L -11,16 L -31,27 Z"
          fill="#3be0ff" stroke="#05030f" stroke-width="6.5" stroke-linejoin="round"/>
    <path d="M 0,-29 L 15,18 L 0,9 L -15,18 Z" fill="#eaffff"/>
  </g>
</g>

<rect x="0" y="988" width="680" height="32" fill="rgba(0,0,0,0.34)"/>
<line x1="0" y1="988" x2="680" y2="988" stroke="#3be0ff" stroke-width="0.8" opacity="0.3"/>
</svg>
