<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#12160f"/><stop offset="0.26" stop-color="#1c2415"/>
    <stop offset="0.62" stop-color="#39471f"/><stop offset="1" stop-color="#151a10"/>
  </linearGradient>
  <radialGradient id="arenaLight" cx="42%" cy="72%" r="72%">
    <stop offset="0" stop-color="#6b7f3c" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="55%" r="72%">
    <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
  </radialGradient>
  <linearGradient id="hullP" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6d99e8"/><stop offset="0.5" stop-color="#4f7fd4"/><stop offset="1" stop-color="#2f4d86"/>
  </linearGradient>
  <radialGradient id="turP" cx="34%" cy="28%" r="72%">
    <stop offset="0" stop-color="#a9c8ff"/><stop offset="0.55" stop-color="#6d99e8"/><stop offset="1" stop-color="#2f4d86"/>
  </radialGradient>
  <linearGradient id="hullE" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e87d6d"/><stop offset="0.5" stop-color="#d4574f"/><stop offset="1" stop-color="#7d302b"/>
  </linearGradient>
  <radialGradient id="turE" cx="34%" cy="28%" r="72%">
    <stop offset="0" stop-color="#ffb3a6"/><stop offset="0.55" stop-color="#e87d6d"/><stop offset="1" stop-color="#7d302b"/>
  </radialGradient>
  <linearGradient id="hullW" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4e40"/><stop offset="1" stop-color="#1b1d18"/>
  </linearGradient>
  <radialGradient id="turW" cx="34%" cy="28%" r="72%">
    <stop offset="0" stop-color="#6b6f5c"/><stop offset="1" stop-color="#1b1d18"/>
  </radialGradient>
  <linearGradient id="wallG" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#8b8f86"/><stop offset="0.4" stop-color="#5f6459"/><stop offset="1" stop-color="#33372f"/>
  </linearGradient>
  <radialGradient id="fire" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff6d2"/><stop offset="0.28" stop-color="#ffd24a"/>
    <stop offset="0.58" stop-color="#f07a1e" stop-opacity="0.85"/><stop offset="1" stop-color="#7a2405" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="muz" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fffdf0"/><stop offset="0.35" stop-color="#ffdf7a"/>
    <stop offset="1" stop-color="#ff9d24" stop-opacity="0"/>
  </radialGradient>
  <filter id="glowT" x="-40%" y="-90%" width="180%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
  </filter>
</defs>

