<svg width="400" height="600" viewBox="0 0 680 1020" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="gcursored" x1="0.933" y1="0.25" x2="0.067" y2="0.75"><stop offset="0.0" stop-color="#16414a"/><stop offset="0.5" stop-color="#0c2030"/><stop offset="1.0" stop-color="#04070a"/></linearGradient>
<linearGradient id="curTail" x1="0.15" y1="0.15" x2="1" y2="1">
<stop offset="0" stop-color="#7cffe9" stop-opacity="0.95"/>
<stop offset="0.45" stop-color="#2fd6c4" stop-opacity="0.6"/>
<stop offset="1" stop-color="#2fd6c4" stop-opacity="0"/>
</linearGradient>
<linearGradient id="curBody" x1="0" y1="0" x2="0.4" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#dffaf5"/><stop offset="1" stop-color="#9fe4dc"/>
</linearGradient>
<radialGradient id="curGlow" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#2fd6c4" stop-opacity="0.42"/><stop offset="1" stop-color="#2fd6c4" stop-opacity="0"/>
</radialGradient>
<filter id="curSoft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="680" height="1020" fill="url(#gcursored)"/>
<rect x="0" y="0" width="680" height="148" fill="rgba(0,0,0,0.34)"/>
<line x1="0" y1="148" x2="680" y2="148" stroke="#2fd6c4" stroke-width="1.2"/>
<rect x="48" y="100" width="182" height="1.5" fill="#2fd6c4" opacity="0.5"/><rect x="450" y="100" width="182" height="1.5" fill="#2fd6c4" opacity="0.5"/>
<text x="343" y="135" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="68" fill="rgba(0,0,0,0.45)" letter-spacing="4">CURSORED</text>
<text x="340" y="132" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="68" fill="#2fd6c4" letter-spacing="4">CURSORED</text>

<ellipse cx="330" cy="580" rx="220" ry="220" fill="url(#curGlow)"/>

<!-- glowing tail streaming behind the pointer -->
<path d="M 160,490 C 367,492 509,660 618,908 C 361,822 181,696 160,490 Z"
      fill="url(#curTail)" opacity="0.9" filter="url(#curSoft)"/>
<path d="M 172,500 C 360,509 493,664 600,890 C 365,804 198,686 172,500 Z"
      fill="url(#curTail)"/>
<path d="M 210,535 C 344,559 457,676 560,838 C 383,758 250,662 210,535 Z"
      fill="#bffff4" opacity="0.45"/>

<!-- the cursor -->
<g transform="translate(140,470) rotate(-30) scale(7.6)">
  <path d="M 0,0 L 0,37.5 L 9.6,27.6 L 16.4,41.6 L 24.2,38.1 L 17.4,24.4 L 30,24.4 Z"
        fill="none" stroke="#04070a" stroke-width="4.8" stroke-linejoin="round"/>
  <path d="M 0,0 L 0,37.5 L 9.6,27.6 L 16.4,41.6 L 24.2,38.1 L 17.4,24.4 L 30,24.4 Z"
        fill="url(#curBody)" stroke="#2fd6c4" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M 2.6,4.6 L 2.6,30.4 L 9.2,23.2 L 21.6,22 Z" fill="#ffffff" opacity="0.85"/>
</g>

<rect x="0" y="988" width="680" height="32" fill="rgba(0,0,0,0.34)"/>
<line x1="0" y1="988" x2="680" y2="988" stroke="#2fd6c4" stroke-width="0.8" opacity="0.3"/>
</svg>
