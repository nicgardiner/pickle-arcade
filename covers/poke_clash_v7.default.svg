<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <radialGradient id="pciBg" cx="50%" cy="30%" r="90%">
    <stop offset="0" stop-color="#0f3460"/>
    <stop offset="0.65" stop-color="#1a1a2e"/>
    <stop offset="1" stop-color="#101020"/>
  </radialGradient>
  <radialGradient id="pciFire" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#e67e22" stop-opacity="0.4"/>
    <stop offset="1" stop-color="#e67e22" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="pciWater" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#3498db" stop-opacity="0.4"/>
    <stop offset="1" stop-color="#3498db" stop-opacity="0"/>
  </radialGradient>
  <filter id="pciGlow" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="pciSoft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
</defs>

<!-- 1. arena backdrop -->
<rect width="680" height="1020" fill="url(#pciBg)"/>
<ellipse cx="165" cy="660" rx="280" ry="360" fill="url(#pciFire)"/>
<ellipse cx="515" cy="660" rx="280" ry="360" fill="url(#pciWater)"/>

<!-- 2. radial speed lines from the clash point -->
<g stroke="rgba(255,255,255,0.10)" stroke-linecap="round">
  <line x1="340" y1="380" x2="340" y2="230" stroke-width="5"/>
  <line x1="240" y1="420" x2="130" y2="330" stroke-width="4"/>
  <line x1="440" y1="420" x2="550" y2="330" stroke-width="4"/>
  <line x1="180" y1="560" x2="30" y2="530" stroke-width="5"/>
  <line x1="500" y1="560" x2="650" y2="530" stroke-width="5"/>
  <line x1="190" y1="740" x2="60" y2="810" stroke-width="4"/>
  <line x1="490" y1="740" x2="620" y2="810" stroke-width="4"/>
  <line x1="290" y1="820" x2="240" y2="960" stroke-width="4"/>
  <line x1="390" y1="820" x2="440" y2="960" stroke-width="4"/>
  <line x1="255" y1="405" x2="185" y2="270" stroke-width="4"/>
  <line x1="425" y1="405" x2="495" y2="270" stroke-width="4"/>
</g>

<!-- 3. tilted poke ball under the title -->
<g transform="translate(340,262) rotate(12)">
  <circle r="48" fill="#e74c3c" opacity="0.35" filter="url(#pciSoft)"/>
  <circle r="40" fill="#eef2ff"/>
  <path d="M -40 0 A 40 40 0 0 1 40 0 Z" fill="#e74c3c"/>
  <rect x="-40" y="-4" width="80" height="8" fill="#2b2b33"/>
  <circle r="12" fill="#2b2b33"/>
  <circle r="8.5" fill="#eef2ff"/>
  <circle r="4" fill="#c8ccd8"/>
  <circle r="40" fill="none" stroke="#2b2b33" stroke-width="4"/>
</g>

<!-- 4. fighters: the game's own Charmander and Squirtle sprites, scaled up -->
<ellipse cx="140" cy="868" rx="175" ry="24" fill="#000" opacity="0.35"/>
<ellipse cx="545" cy="880" rx="175" ry="24" fill="#000" opacity="0.35"/>
<!-- Charmander (left, oversized, cropped by the frame edge) -->
<g transform="translate(-105,480) scale(5.2)">
  <path d="M56 66 Q72 60 70 45 Q68 36 63 33" fill="none" stroke="#f08030" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="64" cy="27" rx="6" ry="8" fill="#f8d030"/><ellipse cx="61" cy="25" rx="4" ry="6" fill="#f08030"/><ellipse cx="67" cy="26" rx="3" ry="5" fill="#ff4830"/>
  <ellipse cx="38" cy="54" rx="20" ry="18" fill="#f08030"/><ellipse cx="38" cy="58" rx="13" ry="11" fill="#f8d030" opacity="0.7"/>
  <ellipse cx="38" cy="42" rx="16" ry="14" fill="#f08030"/>
  <ellipse cx="30" cy="38" rx="4" ry="4.5" fill="white"/><ellipse cx="46" cy="38" rx="4" ry="4.5" fill="white"/>
  <circle cx="31" cy="39" r="2.5" fill="#2060e0"/><circle cx="47" cy="39" r="2.5" fill="#2060e0"/>
  <circle cx="32" cy="38" r="1" fill="white"/><circle cx="48" cy="38" r="1" fill="white"/>
  <path d="M33 51 Q38 56 43 51" fill="none" stroke="#d06020" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="22" cy="52" rx="6" ry="8" fill="#f08030" transform="rotate(15 22 52)"/><ellipse cx="54" cy="52" rx="6" ry="8" fill="#f08030" transform="rotate(-15 54 52)"/>
  <ellipse cx="29" cy="68" rx="8" ry="5" fill="#f08030"/><ellipse cx="47" cy="68" rx="8" ry="5" fill="#f08030"/>
</g>
<!-- Squirtle (right, mirrored, oversized, cropped by the frame edge) -->
<g transform="translate(785,500) scale(-5.2,5.2)">
  <path d="M56 62 Q72 58 72 44 Q72 36 65 33" fill="none" stroke="#6ab4dc" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="40" cy="52" rx="22" ry="19" fill="#70c870"/><ellipse cx="40" cy="49" rx="19" ry="16" fill="#60b860"/>
  <line x1="40" y1="34" x2="40" y2="64" stroke="#50a050" stroke-width="1"/><line x1="22" y1="49" x2="58" y2="49" stroke="#50a050" stroke-width="1"/>
  <ellipse cx="40" cy="40" rx="17" ry="15" fill="#6ab4dc"/>
  <ellipse cx="28" cy="36" rx="5" ry="6" fill="#6ab4dc"/><ellipse cx="52" cy="36" rx="5" ry="6" fill="#6ab4dc"/>
  <ellipse cx="31" cy="33" rx="4.5" ry="5" fill="white"/><ellipse cx="49" cy="33" rx="4.5" ry="5" fill="white"/>
  <circle cx="33" cy="34" r="3" fill="#302890"/><circle cx="51" cy="34" r="3" fill="#302890"/>
  <circle cx="34" cy="33" r="1.2" fill="white"/><circle cx="52" cy="33" r="1.2" fill="white"/>
  <path d="M35 42 Q40 47 45 42" fill="none" stroke="#5090b8" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="22" cy="50" rx="7" ry="9" fill="#6ab4dc" transform="rotate(15 22 50)"/>
  <ellipse cx="29" cy="67" rx="8" ry="5" fill="#6ab4dc"/><ellipse cx="51" cy="67" rx="8" ry="5" fill="#6ab4dc"/>
</g>

<!-- 5. elemental sparks -->
<g fill="#ff8844">
  <circle cx="150" cy="500" r="5" opacity="0.8"/><circle cx="200" cy="455" r="3.5" opacity="0.6"/>
  <circle cx="118" cy="560" r="3.5" opacity="0.6"/><circle cx="245" cy="500" r="3" opacity="0.5"/>
</g>
<g fill="#7ec8f5">
  <circle cx="530" cy="500" r="5" opacity="0.8"/><circle cx="480" cy="455" r="3.5" opacity="0.6"/>
  <circle cx="562" cy="560" r="3.5" opacity="0.6"/><circle cx="435" cy="500" r="3" opacity="0.5"/>
</g>

<!-- 6. clash burst + VS -->
<circle cx="340" cy="600" r="95" fill="#ffd700" opacity="0.3" filter="url(#pciSoft)"/>
<polygon points="340,492 362,566 436,588 362,610 340,684 318,610 244,588 318,566"
         fill="#ffd700" opacity="0.95"/>
<polygon points="340,492 362,566 436,588 362,610 340,684 318,610 244,588 318,566"
         transform="rotate(45 340 588)" fill="#ffb300" opacity="0.65"/>
<polygon points="340,522 355,570 403,588 355,606 340,654 325,606 277,588 325,570" fill="#fff6d0"/>
<text x="340" y="608" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
      font-size="52" fill="#1a1a2e" letter-spacing="2">VS</text>

<!-- 8. title: gold with hard retro shadow -->
<text x="346" y="136" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
      font-size="76" letter-spacing="3" fill="#b8860b">POKECLASH</text>
<text x="340" y="130" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
      font-size="76" letter-spacing="3" fill="#ffd700" filter="url(#pciGlow)">POKECLASH</text>
<text x="340" y="180" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="22"
      letter-spacing="12" fill="#5dade2">BATTLE ARENA</text>

<!-- 9. bottom vignette -->
<rect x="0" y="890" width="680" height="130" fill="#101020" opacity="0"/>
</svg>
