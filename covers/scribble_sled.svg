<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <!-- paper -->
  <linearGradient id="ssPaper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFDF6"/>
    <stop offset="0.55" stop-color="#FDF6E7"/>
    <stop offset="1" stop-color="#F6EAD3"/>
  </linearGradient>
  <pattern id="ssDots" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="4" r="2.3" fill="#2B2A33" opacity="0.085"/>
  </pattern>
  <linearGradient id="ssSnow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#E9F4FC"/>
    <stop offset="1" stop-color="#CFE3F4"/>
  </linearGradient>
  <radialGradient id="ssStarGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFD98A" stop-opacity="0.95"/>
    <stop offset="0.45" stop-color="#FFD98A" stop-opacity="0.38"/>
    <stop offset="1" stop-color="#FFD98A" stop-opacity="0"/>
  </radialGradient>
  <filter id="ssTitleGlow" x="-25%" y="-60%" width="150%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- crayon-ish wobble on the long ink strokes -->
  <filter id="ssRough" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>

<!-- ============================================ 1. paper background -->
<rect width="680" height="1020" fill="url(#ssPaper)"/>
<rect width="680" height="1020" fill="url(#ssDots)"/>

<!-- torn snow band along the bottom, like the menu screens -->
<path d="M0 872 L52 864 L118 874 L186 861 L252 872 L318 858 L392 870 L458 860 L528 872 L596 862 L680 871 L680 1020 L0 1020 Z"
      fill="url(#ssSnow)" stroke="#2B2A33" stroke-width="6" stroke-linejoin="round"/>

<!-- ============================================ 2. atmosphere: falling snow -->
<g fill="#2B2A33" opacity="0.16">
  <circle cx="86" cy="352" r="4.5"/><circle cx="168" cy="286" r="3.2"/><circle cx="246" cy="392" r="5"/>
  <circle cx="332" cy="318" r="3.4"/><circle cx="418" cy="372" r="4.4"/><circle cx="512" cy="300" r="3.6"/>
  <circle cx="588" cy="384" r="4.8"/><circle cx="128" cy="470" r="3.4"/><circle cx="614" cy="486" r="3.4"/>
  <circle cx="58" cy="600" r="4"/><circle cx="646" cy="640" r="4.2"/><circle cx="300" cy="470" r="3"/>
</g>

<!-- ============================================ 3. the drawn track -->
<g filter="url(#ssRough)">
  <!-- shadow pass: the hard offset shadow the whole UI uses -->
  <path d="M-20 556 C 92 556, 150 620, 214 700 C 268 768, 330 806, 402 792 C 470 779, 500 720, 536 654 C 566 598, 610 570, 700 574"
        fill="none" stroke="#2B2A33" stroke-width="30" stroke-linecap="round" opacity="0.20"
        transform="translate(7,9)"/>
  <!-- ink outline + blue crayon core -->
  <path d="M-20 550 C 92 550, 150 614, 214 694 C 268 762, 330 800, 402 786 C 470 773, 500 714, 536 648 C 566 592, 610 564, 700 568"
        fill="none" stroke="#2B2A33" stroke-width="26" stroke-linecap="round"/>
  <path d="M-20 550 C 92 550, 150 614, 214 694 C 268 762, 330 800, 402 786 C 470 773, 500 714, 536 648 C 566 592, 610 564, 700 568"
        fill="none" stroke="#3E63D6" stroke-width="15" stroke-linecap="round"/>
  <path d="M-20 545 C 90 545, 148 609, 212 689"
        fill="none" stroke="#7B95E6" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
</g>

<!-- boost strip, yellow with chevrons, running up the right shoulder -->
<g>
  <path d="M540 646 C 578 588, 618 566, 700 566" fill="none" stroke="#2B2A33" stroke-width="24"
        stroke-linecap="round" opacity="0.18" transform="translate(6,8)"/>
  <path d="M540 646 C 578 588, 618 566, 700 566" fill="none" stroke="#2B2A33" stroke-width="22" stroke-linecap="round"/>
  <path d="M540 646 C 578 588, 618 566, 700 566" fill="none" stroke="#F2B705" stroke-width="12" stroke-linecap="round"/>
  <g stroke="#2B2A33" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M551 641 l16 -18 l-14 -16" transform="rotate(-4 559 623)"/>
    <path d="M589 605 l18 -13 l-11 -18"/>
    <path d="M633 583 l19 -8 l-7 -19"/>
  </g>
</g>

<!-- red spike teeth on the left flank of the dip -->
<g stroke="#2B2A33" stroke-width="5" stroke-linejoin="round">
  <path d="M120 862 l17 -46 l17 46 l17 -46 l17 46 l17 -46 l17 46 z" fill="#E4342A"/>
</g>

<!-- ============================================ 4. the goal star -->
<g transform="translate(584,466) scale(1.2)">
  <circle cx="0" cy="0" r="96" fill="url(#ssStarGlow)"/>
  <g transform="rotate(-8)">
    <path d="M0 -52 L15 -17 L53 -13 L24 12 L33 50 L0 30 L-33 50 L-24 12 L-53 -13 L-15 -17 Z"
          fill="#FFD98A" stroke="#2B2A33" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-8 -30 L-2 -16 L-18 -12 Z" fill="#FFF3D4" opacity="0.9"/>
  </g>
  <g fill="#F4643C" stroke="#2B2A33" stroke-width="3">
    <circle cx="-76" cy="-30" r="7"/><circle cx="-58" cy="46" r="6"/><circle cx="14" cy="-72" r="6.5"/>
  </g>
</g>

<!-- ============================================ 5. the sledder, mid-air off the lip -->
<g transform="translate(262,748) rotate(41) translate(-4,-19) scale(1.45)">
  <!-- contact shadow under the runner -->
  <ellipse cx="-4" cy="6" rx="62" ry="8" fill="#2B2A33" opacity="0.15"/>

  <!-- scarf streaming out behind the neck -->
  <path d="M6 -56 C -16 -58, -36 -46, -62 -46 C -48 -62, -22 -66, 4 -68 Z"
        fill="#E4342A" stroke="#2B2A33" stroke-width="5" stroke-linejoin="round"/>
  <path d="M2 -66 C -20 -72, -40 -74, -66 -84 C -40 -84, -14 -78, 4 -76 Z"
        fill="#C81E1E" stroke="#2B2A33" stroke-width="5" stroke-linejoin="round"/>
  <rect x="2" y="-72" width="16" height="18" rx="5" fill="#E4342A"
        stroke="#2B2A33" stroke-width="5" transform="rotate(-12 10 -63)"/>

  <!-- sled: runner with a curled nose, three struts, a deck -->
  <path d="M-62 0 L46 0 C 70 0, 78 -18, 62 -34" fill="none"
        stroke="#2B2A33" stroke-width="13" stroke-linecap="round"/>
  <path d="M-62 0 L46 0 C 70 0, 78 -18, 62 -34" fill="none"
        stroke="#F4643C" stroke-width="6" stroke-linecap="round"/>
  <path d="M-44 -2 L-44 -18 M-10 -2 L-10 -18 M24 -2 L24 -18"
        stroke="#2B2A33" stroke-width="6" stroke-linecap="round"/>
  <rect x="-58" y="-27" width="99" height="13" rx="6.5" fill="#FFD98A"
        stroke="#2B2A33" stroke-width="5.5"/>

  <!-- legs: butt → knee → foot braced on the nose -->
  <path d="M-4 -30 L26 -26 L48 -16" stroke="#2B2A33" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- torso -->
  <path d="M-4 -30 L14 -62" stroke="#2B2A33" stroke-width="11" stroke-linecap="round"/>
  <!-- arms out to the tow rope -->
  <path d="M14 -62 L44 -46 L60 -34" stroke="#2B2A33" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- head + bobble hat -->
  <circle cx="22" cy="-80" r="18" fill="#FFF3D4" stroke="#2B2A33" stroke-width="6"/>
  <path d="M2 -86 C 4 -110, 40 -112, 42 -86 Z" fill="#3E63D6" stroke="#2B2A33"
        stroke-width="5.5" stroke-linejoin="round"/>
  <circle cx="22" cy="-114" r="8.5" fill="#FFD98A" stroke="#2B2A33" stroke-width="5"/>
  <circle cx="31" cy="-78" r="3.6" fill="#2B2A33"/>
  <path d="M26 -69 q 8 4 14 -2" stroke="#2B2A33" stroke-width="3.6" fill="none" stroke-linecap="round"/>

  <!-- speed puffs trailing behind -->
  <g stroke="#2B2A33" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M-86 -10 L-128 -12"/><path d="M-76 -30 L-110 -32"/><path d="M-90 -50 L-118 -54"/>
  </g>
</g>

<!-- ============================================ 6. title -->
<g filter="url(#ssTitleGlow)">
  <text x="342" y="176" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
        font-weight="900" font-size="90" letter-spacing="2" fill="#FFD98A">SCRIBBLE</text>
</g>
<text x="336" y="170" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="90" letter-spacing="2" fill="#2B2A33"
      stroke="#2B2A33" stroke-width="2" stroke-linejoin="round">SCRIBBLE</text>
<text x="348" y="266" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="90" letter-spacing="6" fill="#FFD98A">SLED</text>
<text x="342" y="260" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="90" letter-spacing="6" fill="#F4643C"
      stroke="#2B2A33" stroke-width="5" stroke-linejoin="round" paint-order="stroke">SLED</text>

<!-- pencil underline -->
<g transform="translate(196,296)">
  <rect x="0" y="0" width="252" height="13" rx="6" fill="#3E63D6" stroke="#2B2A33" stroke-width="4"/>
  <path d="M252 0 L286 6.5 L252 13 Z" fill="#FFD98A" stroke="#2B2A33" stroke-width="4" stroke-linejoin="round"/>
</g>

<!-- tagline -->
<text x="340" y="352" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive"
      font-size="27" fill="#6E6B78">draw it · ride it · (probably) crash it</text>

<!-- ============================================ 7. crayons on the snow -->
<g transform="translate(70,930) rotate(-7)">
  <rect x="0" y="0" width="150" height="28" rx="6" fill="#3E63D6" stroke="#2B2A33" stroke-width="5"/>
  <path d="M150 0 L182 14 L150 28 Z" fill="#FFF3D4" stroke="#2B2A33" stroke-width="5" stroke-linejoin="round"/>
</g>
<g transform="translate(300,958) rotate(4)">
  <rect x="0" y="0" width="132" height="26" rx="6" fill="#E4342A" stroke="#2B2A33" stroke-width="5"/>
  <path d="M132 0 L162 13 L132 26 Z" fill="#FFF3D4" stroke="#2B2A33" stroke-width="5" stroke-linejoin="round"/>
</g>
<g transform="translate(500,918) rotate(11)">
  <rect x="0" y="0" width="120" height="26" rx="6" fill="#F2B705" stroke="#2B2A33" stroke-width="5"/>
  <path d="M120 0 L150 13 L120 26 Z" fill="#FFF3D4" stroke="#2B2A33" stroke-width="5" stroke-linejoin="round"/>
</g>
</svg>
