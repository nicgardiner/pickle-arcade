<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <style>@font-face{font-family:'KB Stencil';font-weight:900;src:url(data:font/woff2;base64,) format('woff2');}
  .kbt{font-family:'KB Stencil',Bahnschrift,Impact,sans-serif;font-weight:900;font-stretch:condensed;font-size:136px}</style>
  <linearGradient id="kbcKick" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".04" stop-color="#fff6d6"/><stop offset=".3" stop-color="#ffd27a"/><stop offset=".62" stop-color="#ff8a2a"/><stop offset=".98" stop-color="#c8361a"/></linearGradient>
  <linearGradient id="kbcBack" x1="0" y1="0" x2="0" y2="1">
    <stop offset=".04" stop-color="#ffffff"/><stop offset=".4" stop-color="#f6e9cb"/><stop offset=".75" stop-color="#d6c19a"/><stop offset=".98" stop-color="#a98f66"/></linearGradient>
  <linearGradient id="kbcTrail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff7a1c" stop-opacity="0"/><stop offset=".7" stop-color="#ffb04a" stop-opacity=".35"/><stop offset="1" stop-color="#fff0c0" stop-opacity=".55"/></linearGradient>
  <linearGradient id="kbcWall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140a06"/><stop offset=".55" stop-color="#2a1309"/><stop offset="1" stop-color="#3d1608"/></linearGradient>
  <pattern id="kbcBrick" width="68" height="34" patternUnits="userSpaceOnUse">
    <rect width="68" height="34" fill="none" stroke="#0a0503" stroke-width="3" opacity=".75"/>
    <line x1="34" y1="0" x2="34" y2="17" stroke="#0a0503" stroke-width="3" opacity=".75"/>
    <line x1="0" y1="17" x2="68" y2="17" stroke="#0a0503" stroke-width="3" opacity=".75"/>
    <line x1="0" y1="17" x2="0" y2="34" stroke="#0a0503" stroke-width="3" opacity=".75"/>
    <rect x="3" y="3" width="28" height="3" fill="#6b3a22" opacity=".25"/>
    <rect x="37" y="20" width="28" height="3" fill="#6b3a22" opacity=".25"/>
  </pattern>
  <linearGradient id="kbcFurnace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe08a"/><stop offset=".45" stop-color="#ff9a2e"/><stop offset="1" stop-color="#b8380e"/></linearGradient>
  <linearGradient id="kbcShaft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffb04a" stop-opacity=".32"/><stop offset="1" stop-color="#ff7a1c" stop-opacity="0"/></linearGradient>
  <linearGradient id="kbcPit" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff0a0"/><stop offset=".18" stop-color="#ffab2e"/><stop offset=".6" stop-color="#e2470f"/><stop offset="1" stop-color="#6e1604"/></linearGradient>
  <linearGradient id="kbcPitGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff7a1c" stop-opacity="0"/><stop offset="1" stop-color="#ff7a1c" stop-opacity=".55"/></linearGradient>
  <linearGradient id="kbcPlate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5d646d"/><stop offset=".3" stop-color="#363b42"/><stop offset="1" stop-color="#16191c"/></linearGradient>
  <linearGradient id="kbcStream" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff8a1c"/><stop offset=".5" stop-color="#fff2b0"/><stop offset="1" stop-color="#ff8a1c"/></linearGradient>
  <radialGradient id="kbcBody" cx=".5" cy=".5" r=".5" fx=".31" fy=".29" fr=".04">
    <stop offset="0" stop-color="#7a818a"/><stop offset=".25" stop-color="#3a3f46"/><stop offset=".7" stop-color="#16181b"/><stop offset="1" stop-color="#060708"/></radialGradient>
  <linearGradient id="kbcBarrel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbe6a8"/><stop offset=".45" stop-color="#c9953f"/><stop offset="1" stop-color="#6b4513"/></linearGradient>
  <radialGradient id="kbcGlow"><stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#ffc24d" stop-opacity=".85"/><stop offset="1" stop-color="#ff7a1c" stop-opacity="0"/></radialGradient>
  <radialGradient id="kbcRim" cx=".5" cy=".5" r=".5"><stop offset=".72" stop-color="#ff8a2a" stop-opacity="0"/><stop offset=".86" stop-color="#ff8a2a" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
  <radialGradient id="kbcCoin" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#fff2b8"/><stop offset=".45" stop-color="#f0b452"/><stop offset="1" stop-color="#8a5a1a"/></radialGradient>
  <linearGradient id="kbcTitle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff0c4"/><stop offset=".5" stop-color="#f0b452"/><stop offset="1" stop-color="#b46a1e"/></linearGradient>
  <pattern id="kbcHaz" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="22" height="22" fill="#1a1208"/><rect width="11" height="22" fill="#f2b632"/></pattern>
  <filter id="kbcBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="kbcTitleGlow" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
    <feFlood flood-color="#ff8a2a" flood-opacity=".7"/><feComposite in2="b" operator="in" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- 1. the foundry's far brick wall -->
<rect width="680" height="1020" fill="url(#kbcWall)"/>
<rect width="680" height="1020" fill="url(#kbcBrick)"/>

<!-- furnace windows + light shafts -->
<g>
  <path d="M60 480V350a55 55 0 0 1 110 0V480Z" fill="#0a0503"/>
  <path d="M70 472V352a45 45 0 0 1 90 0V472Z" fill="url(#kbcFurnace)"/>
  <path d="M115 307V472M70 400H160" stroke="#3a1a0a" stroke-width="7"/>
  <path d="M380 420V300a50 50 0 0 1 100 0V420Z" fill="#0a0503"/>
  <path d="M389 412V302a41 41 0 0 1 82 0V412Z" fill="url(#kbcFurnace)"/>
  <path d="M430 261V412M389 345H471" stroke="#3a1a0a" stroke-width="7"/>
  <polygon points="70,472 160,472 330,1020 150,1020" fill="url(#kbcShaft)"/>
  <polygon points="389,412 471,412 640,1020 470,1020" fill="url(#kbcShaft)"/>
</g>

<!-- overhead girder + chains -->
<g fill="#0d0705">
  <rect x="0" y="218" width="680" height="12"/>
  <rect x="0" y="262" width="680" height="10"/>
  <path d="M0 230L34 262L68 230L102 262L136 230L170 262L204 230L238 262L272 230L306 262L340 230L374 262L408 230L442 262L476 230L510 262L544 230L578 262L612 230L646 262L680 230" fill="none" stroke="#0d0705" stroke-width="7"/>
</g>
<g fill="none" stroke="#1a0f09" stroke-width="5">
  <path d="M250 272v14m0 8v14m0 8v14m0 8v14"/>
  <path d="M244 280h12M244 302h12M244 324h12M244 346h12" stroke-width="3"/>
</g>

<!-- crucible pouring into the pit -->
<g>
  <rect x="619" y="300" width="18" height="640" fill="url(#kbcStream)" opacity=".95"/>
  <rect x="610" y="300" width="36" height="640" fill="#ff8a2a" opacity=".18" filter="url(#kbcBlur)"/>
  <g transform="translate(600 262) rotate(28)">
    <path d="M-52 -34H52L40 40H-40Z" fill="#2a2d31" stroke="#08090a" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-58" y="-42" width="116" height="14" rx="3" fill="#4a5058" stroke="#08090a" stroke-width="4"/>
    <ellipse cx="0" cy="-35" rx="48" ry="6" fill="#ffb347"/>
    <path d="M-40 -4H40" stroke="#16181b" stroke-width="4"/>
  </g>
</g>

<!-- 2. the molten pit -->
<rect x="0" y="760" width="680" height="200" fill="url(#kbcPitGlow)"/>
<path d="M0 940Q60 928 120 940T240 940T360 940T480 940T600 940T720 940V1020H0Z" fill="url(#kbcPit)"/>
<g fill="#fff3b8">
  <circle cx="96" cy="958" r="7"/><circle cx="262" cy="972" r="5"/><circle cx="430" cy="955" r="8"/><circle cx="560" cy="980" r="5"/>
</g>

<!-- riveted steel plates with molten rim light -->
<g>
  <rect x="-10" y="850" width="240" height="44" fill="url(#kbcPlate)" stroke="#08090a" stroke-width="4"/>
  <rect x="-10" y="850" width="240" height="4" fill="#ffb24a"/>
  <g fill="#8b929a"><circle cx="22" cy="872" r="4"/><circle cx="92" cy="872" r="4"/><circle cx="162" cy="872" r="4"/><circle cx="208" cy="872" r="4"/></g>
  <rect x="455" y="700" width="140" height="40" fill="url(#kbcPlate)" stroke="#08090a" stroke-width="4"/>
  <rect x="455" y="700" width="140" height="4" fill="#ffb24a"/>
  <g fill="#8b929a"><circle cx="476" cy="720" r="4"/><circle cx="525" cy="720" r="4"/><circle cx="574" cy="720" r="4"/></g>
</g>

<!-- 3. flight: everything in this group is in the bomb's flight frame (+x = up-right, 38° above horizontal) -->
<g transform="translate(400 500) rotate(-38)">
  <!-- smoke trail left by the shot, widening back toward the launch point -->
  <g fill="#6e655d">
    <circle cx="-250" cy="0" r="22" opacity=".5"/><circle cx="-300" cy="-8" r="28" opacity=".48"/><circle cx="-360" cy="6" r="34" opacity=".44"/>
    <circle cx="-430" cy="-6" r="40" opacity=".38"/><circle cx="-505" cy="10" r="46" opacity=".3"/><circle cx="-585" cy="-4" r="52" opacity=".22"/>
  </g>
  <!-- hot wake straight behind the bomb -->
  <path d="M-560 -44L-60 -62Q0 0 -60 62L-560 44Z" fill="url(#kbcTrail)" opacity=".25"/>
  <!-- afterimages -->
  <circle cx="-70" r="88" fill="#d4a552" opacity=".12"/><circle cx="-140" r="88" fill="#d4a552" opacity=".06"/>
  <!-- bow shock pushed ahead of the bomb -->
  <g fill="none" stroke="#ffe6b0" stroke-linecap="round">
    <path d="M78 -96Q138 0 78 96" stroke-width="5" opacity=".55"/>
    <path d="M104 -76Q154 0 104 76" stroke-width="3" opacity=".35"/>
  </g>
</g>

<!-- the Iron Bomb, kicked up-right by its own cannon (30% smaller than v1) -->
<g transform="translate(400 500) scale(1.785)">
  <circle r="62" fill="url(#kbcRim)"/>
  <g transform="rotate(142)">
    <rect x="35.6" y="-17.1" width="19.8" height="34.2" fill="#8a6428" stroke="#1a0e05" stroke-width="2"/>
    <rect x="48.6" y="-11.7" width="43.2" height="23.4" fill="url(#kbcBarrel)" stroke="#1a0e05" stroke-width="2"/>
    <rect x="84.6" y="-14.4" width="10.8" height="28.8" fill="#e7c06a" stroke="#1a0e05" stroke-width="2"/>
    <circle cx="116" r="30" fill="url(#kbcGlow)"/>
    <path d="M96 0L108 -10L113 -24L118 -9L138 0L118 9L113 24L108 10Z" fill="#ffe7a0"/>
    <ellipse cx="108" rx="11" ry="6" fill="#fff"/>
  </g>
  <circle r="49" fill="none" stroke="#3a240b" stroke-width="10.8"/>
  <circle r="49" fill="none" stroke="#d4a552" stroke-width="5.4"/>
  <circle r="36" fill="url(#kbcBody)" stroke="#060708" stroke-width="1.5"/>
  <path d="M-34.6 12.2A34.9 10.8 0 0 0 34.6 12.2" fill="none" stroke="rgba(0,0,0,.7)" stroke-width="2.5"/>
  <g fill="#4a5058"><circle cx="-29.4" cy="16.6" r="3.1"/><circle cx="-16.7" cy="20.3" r="3.1"/><circle cy="21.6" r="3.1"/><circle cx="16.7" cy="20.3" r="3.1"/><circle cx="29.4" cy="16.6" r="3.1"/></g>
  <path d="M-25.1 -6.4A25.9 25.9 0 0 1 -6.4 -25.1" fill="none" stroke="#8b929a" stroke-width="5" stroke-linecap="round"/>
  <path d="M20 30A36 36 0 0 0 34 12" fill="none" stroke="#ff9a3a" stroke-width="2.5" opacity=".7"/>
  <ellipse cx="-12.6" cy="-2.2" rx="7.6" ry="4.3" fill="#ffd23a"/><ellipse cx="12.6" cy="-2.2" rx="7.6" ry="4.3" fill="#ffd23a"/>
  <circle cx="-11.2" cy="-1.6" r="2.2" fill="#3a2a05"/><circle cx="14" cy="-1.6" r="2.2" fill="#3a2a05"/>
  <path d="M-23.4 -13H-1.8V-0.4L-23.4 -8.3ZM1.8 -13H23.4V-8.3L1.8 -0.4Z" fill="#0d0e10"/>
  <rect x="-8.6" y="-39.6" width="17.3" height="8.6" fill="#2a2d31" stroke="#060708" stroke-width="1.2"/>
  <path d="M0 -38.9Q2.9 -52.2 14.4 -55.8" fill="none" stroke="#c8a26a" stroke-width="5.4" stroke-linecap="round"/>
  <circle cx="14.4" cy="-55.8" r="13" fill="url(#kbcGlow)"/><circle cx="14.4" cy="-55.8" r="4" fill="#fff3c0"/>
</g>

<!-- sparks -->
<g fill="#ffd27a">
  <circle cx="160" cy="700" r="4"/><circle cx="212" cy="760" r="3"/><circle cx="104" cy="690" r="3"/><circle cx="190" cy="650" r="2.5"/>
  <circle cx="378" cy="292" r="3"/><circle cx="398" cy="248" r="2.5"/><circle cx="640" cy="560" r="3"/><circle cx="588" cy="612" r="2.5"/>
  <circle cx="300" cy="900" r="3"/><circle cx="380" cy="868" r="2.5"/>
</g>

<!-- 4. title -->
<rect x="0" y="0" width="680" height="214" fill="#080403" opacity=".55"/>
<g class="kbt" text-anchor="middle" stroke-linejoin="round" paint-order="stroke">
  <text x="340" y="160" stroke-width="18" fill="#3a1608" stroke="#2a1007"><tspan>KICK</tspan><tspan dx="12" fill="#2c2216" stroke="#1e170e">BACK</tspan></text>
  <text x="340" y="151" stroke-width="14" stroke="#120d09" filter="url(#kbcTitleGlow)"><tspan fill="url(#kbcKick)">KICK</tspan><tspan dx="12" fill="url(#kbcBack)">BACK</tspan></text>
</g>
<rect x="70" y="170" width="540" height="14" fill="url(#kbcHaz)" stroke="#08090a" stroke-width="2"/>
</svg>
