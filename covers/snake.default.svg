  <circle cx="582" cy="782" r="13" fill="rgba(250,204,21,0.22)" filter="url(#foodGlow)"/>
  <circle cx="582" cy="782" r="8" fill="url(#foodGrad)" opacity="0.8"/>
  <circle cx="542" cy="342" r="24" fill="rgba(168,85,247,0.25)" filter="url(#bonusGlow)"/>
  <circle cx="542" cy="342" r="14" fill="url(#bonusFoodGrad)"/>
  <circle cx="542" cy="342" r="22" fill="none" stroke="rgba(192,132,252,0.6)" stroke-width="2.5" stroke-dasharray="100 40"/>

  <!-- WALLS -->
  <rect x="102" y="342" width="34" height="34" rx="4" fill="#262a27" stroke="#5c7a1d" stroke-width="1.4"/>
  <line x1="104" y1="344" x2="134" y2="374" stroke="rgba(163,230,53,0.30)" stroke-width="1.5"/>
  <line x1="134" y1="344" x2="104" y2="374" stroke="rgba(163,230,53,0.30)" stroke-width="1.5"/>
  <rect x="582" y="502" width="34" height="34" rx="4" fill="#262a27" stroke="#5c7a1d" stroke-width="1.4"/>
  <line x1="584" y1="504" x2="614" y2="534" stroke="rgba(163,230,53,0.30)" stroke-width="1.5"/>
  <line x1="614" y1="504" x2="584" y2="534" stroke="rgba(163,230,53,0.30)" stroke-width="1.5"/>
  <rect x="102" y="542" width="34" height="34" rx="4" fill="#262a27" stroke="#5c7a1d" stroke-width="1.4"/>
  <line x1="104" y1="544" x2="134" y2="574" stroke="rgba(163,230,53,0.30)" stroke-width="1.5"/>
  <line x1="134" y1="544" x2="104" y2="574" stroke="rgba(163,230,53,0.30)" stroke-width="1.5"/>

  <!-- Bottom fade -->
  <rect x="0" y="800" width="680" height="230" fill="url(#bottomFade)"/>

</g>

<!-- TITLE -->
<rect x="0" y="0" width="680" height="178" fill="rgba(36,40,37,0.82)"/>
<line x1="0" y1="178" x2="680" y2="178" stroke="#a3e635" stroke-width="1.2" opacity="0.55"/>
<text x="343" y="142" text-anchor="middle" font-family="'Share Tech Mono','Consolas','DejaVu Sans Mono','Courier New',monospace" font-weight="700" font-size="96" fill="rgba(0,0,0,0.6)" letter-spacing="5">SERPENT</text>
<text x="340" y="139" text-anchor="middle" font-family="'Share Tech Mono','Consolas','DejaVu Sans Mono','Courier New',monospace" font-weight="700" font-size="96" fill="#b9f24a" letter-spacing="5" filter="url(#titleGlow)">SERPENT</text>

<!-- BOTTOM BAR -->
<rect x="0" y="970" width="680" height="50" fill="rgba(36,40,37,0.82)"/>
<line x1="0" y1="970" x2="680" y2="970" stroke="#a3e635" stroke-width="0.8" opacity="0.3"/>
<text x="340" y="1002" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="16" fill="#a3e635" opacity="0.55" letter-spacing="6">CLASSIC SNAKE</text>

<!-- Scanline overlay -->
<rect x="0" y="0" width="680" height="1020" fill="none" opacity="0.15">
  <animate attributeName="opacity" values="0.12;0.18;0.12" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>
