  <g opacity="0.32" stroke="#363b38" stroke-width="0.6">
    <line x1="0" y1="200" x2="680" y2="200"/>
    <line x1="0" y1="240" x2="680" y2="240"/>
    <line x1="0" y1="280" x2="680" y2="280"/>
    <line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="360" x2="680" y2="360"/>
    <line x1="0" y1="400" x2="680" y2="400"/>
    <line x1="0" y1="440" x2="680" y2="440"/>
    <line x1="0" y1="480" x2="680" y2="480"/>
    <line x1="0" y1="520" x2="680" y2="520"/>
    <line x1="0" y1="560" x2="680" y2="560"/>
    <line x1="0" y1="600" x2="680" y2="600"/>
    <line x1="0" y1="640" x2="680" y2="640"/>
    <line x1="0" y1="680" x2="680" y2="680"/>
    <line x1="0" y1="720" x2="680" y2="720"/>
    <line x1="0" y1="760" x2="680" y2="760"/>
    <line x1="0" y1="800" x2="680" y2="800"/>
    <line x1="0" y1="840" x2="680" y2="840"/>
    <line x1="0" y1="880" x2="680" y2="880"/>
    <line x1="40" y1="160" x2="40" y2="960"/>
    <line x1="80" y1="160" x2="80" y2="960"/>
    <line x1="120" y1="160" x2="120" y2="960"/>
    <line x1="160" y1="160" x2="160" y2="960"/>
    <line x1="200" y1="160" x2="200" y2="960"/>
    <line x1="240" y1="160" x2="240" y2="960"/>
    <line x1="280" y1="160" x2="280" y2="960"/>
    <line x1="320" y1="160" x2="320" y2="960"/>
    <line x1="360" y1="160" x2="360" y2="960"/>
    <line x1="400" y1="160" x2="400" y2="960"/>
    <line x1="440" y1="160" x2="440" y2="960"/>
    <line x1="480" y1="160" x2="480" y2="960"/>
    <line x1="520" y1="160" x2="520" y2="960"/>
    <line x1="560" y1="160" x2="560" y2="960"/>
    <line x1="600" y1="160" x2="600" y2="960"/>
    <line x1="640" y1="160" x2="640" y2="960"/>
  </g>

  <!-- Vignette: darkens the edges so the snake reads as the light source -->
  <rect x="-80" y="60" width="840" height="1060" fill="url(#vignette)"/>

  <!-- SNAKE BODY — saturated ramp, dark keyline for definition -->
  <rect x="62" y="862" width="34" height="34" rx="8" fill="#0b3a20" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="102" y="862" width="34" height="34" rx="8" fill="#0c4023" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="142" y="862" width="34" height="34" rx="8" fill="#0c4726" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="182" y="862" width="34" height="34" rx="8" fill="#0d4d29" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="182" y="822" width="34" height="34" rx="8" fill="#0e532c" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="182" y="782" width="34" height="34" rx="8" fill="#0e592f" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="182" y="742" width="34" height="34" rx="8" fill="#0f6031" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="222" y="742" width="34" height="34" rx="8" fill="#106634" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="262" y="742" width="34" height="34" rx="8" fill="#116c37" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="302" y="742" width="34" height="34" rx="8" fill="#11733a" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="342" y="742" width="34" height="34" rx="8" fill="#12793d" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="382" y="742" width="34" height="34" rx="8" fill="#137f40" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="422" y="742" width="34" height="34" rx="8" fill="#138543" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="462" y="742" width="34" height="34" rx="8" fill="#148c46" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="462" y="702" width="34" height="34" rx="8" fill="#179247" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="462" y="662" width="34" height="34" rx="8" fill="#1b9749" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="462" y="622" width="34" height="34" rx="8" fill="#1e9d4a" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="462" y="582" width="34" height="34" rx="8" fill="#21a34c" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="422" y="582" width="34" height="34" rx="8" fill="#25a94d" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="382" y="582" width="34" height="34" rx="8" fill="#28af4f" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="342" y="582" width="34" height="34" rx="8" fill="#2bb550" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="302" y="582" width="34" height="34" rx="8" fill="#2fbb52" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="262" y="582" width="34" height="34" rx="8" fill="#32c053" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="262" y="542" width="34" height="34" rx="8" fill="#38c653" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="262" y="502" width="34" height="34" rx="8" fill="#44cc51" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="262" y="462" width="34" height="34" rx="8" fill="#50d150" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="262" y="422" width="34" height="34" rx="8" fill="#5bd74e" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="302" y="422" width="34" height="34" rx="8" fill="#67dd4c" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="342" y="422" width="34" height="34" rx="8" fill="#72e24a" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>
  <rect x="382" y="422" width="34" height="34" rx="8" fill="#7ee848" stroke="rgba(20,23,21,0.62)" stroke-width="1.4"/>

  <!-- Top-edge highlight along the bright half of the body -->
  <g fill="rgba(255,255,255,0.16)">
    <rect x="266" y="426" width="26" height="4" rx="2"/>
    <rect x="306" y="426" width="26" height="4" rx="2"/>
    <rect x="346" y="426" width="26" height="4" rx="2"/>
    <rect x="266" y="466" width="26" height="4" rx="2"/>
    <rect x="266" y="506" width="26" height="4" rx="2"/>
    <rect x="266" y="586" width="26" height="4" rx="2"/>
    <rect x="306" y="586" width="26" height="4" rx="2"/>
    <rect x="346" y="586" width="26" height="4" rx="2"/>
  </g>

  <!-- HEAD -->
  <rect x="382" y="382" width="36" height="36" rx="9" fill="url(#headGrad)" filter="url(#segGlow)"/>
  <ellipse cx="390" cy="390" rx="8" ry="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="390" cy="387" r="4" fill="#04160b"/>
  <circle cx="408" cy="387" r="4" fill="#04160b"/>
  <circle cx="391.5" cy="385.5" r="1.5" fill="white"/>
  <circle cx="409.5" cy="385.5" r="1.5" fill="white"/>

  <!-- FOOD -->
  <circle cx="142" cy="622" r="16" fill="rgba(250,204,21,0.3)" filter="url(#foodGlow)"/>
  <circle cx="142" cy="622" r="10" fill="url(#foodGrad)"/>
  <circle cx="542" cy="502" r="16" fill="rgba(250,204,21,0.3)" filter="url(#foodGlow)"/>
  <circle cx="542" cy="502" r="10" fill="url(#foodGrad)"/>
  <circle cx="82" cy="462" r="14" fill="rgba(250,204,21,0.24)" filter="url(#foodGlow)"/>
