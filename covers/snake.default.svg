<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4e524f"/>
    <stop offset="45%" stop-color="#444845"/>
    <stop offset="100%" stop-color="#232624"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="52%" r="72%">
    <stop offset="0%" stop-color="#1a1d1b" stop-opacity="0"/>
    <stop offset="55%" stop-color="#1a1d1b" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#1a1d1b" stop-opacity="0.60"/>
  </radialGradient>
  <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#232624" stop-opacity="0"/>
    <stop offset="100%" stop-color="#232624" stop-opacity="0.88"/>
  </linearGradient>
  <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#d4fb52"/>
    <stop offset="100%" stop-color="#63cf2e"/>
  </linearGradient>
  <filter id="titleGlow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="foodGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bonusGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="segGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="bonusFoodGrad" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#f3e8ff"/>
    <stop offset="100%" stop-color="#a855f7"/>
  </radialGradient>
  <radialGradient id="foodGrad" cx="50%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#fffbe0"/>
    <stop offset="100%" stop-color="#facc15"/>
  </radialGradient>
</defs>

<!-- Background -->
<rect width="680" height="1020" fill="url(#bgGrad)"/>

<!-- ILLUSTRATION zoomed in 20% from the center of the content area -->
