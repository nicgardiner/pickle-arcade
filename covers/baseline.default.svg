<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <linearGradient id="bl2Sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a2a6e"/>
    <stop offset="0.38" stop-color="#9b4a8c"/>
    <stop offset="0.7" stop-color="#f07a52"/>
    <stop offset="1" stop-color="#ffc56b"/>
  </linearGradient>
  <radialGradient id="bl2Sun" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff3c4" stop-opacity="1"/>
    <stop offset="0.25" stop-color="#ffd27a" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bl2Stand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d3b52"/>
    <stop offset="1" stop-color="#0f2a20"/>
  </linearGradient>
  <pattern id="bl2Crowd" width="18" height="16" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="5" r="3.4" fill="#f4c7a1"/><rect x="0.8" y="8" width="6.4" height="7" rx="2" fill="#e4683a"/>
    <circle cx="13" cy="5" r="3.4" fill="#c98b62"/><rect x="9.8" y="8" width="6.4" height="7" rx="2" fill="#f6f0dd"/>
  </pattern>
  <pattern id="bl2Crowd2" width="18" height="16" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="5" r="3.4" fill="#8a5a3c"/><rect x="0.8" y="8" width="6.4" height="7" rx="2" fill="#2c6bd8"/>
    <circle cx="13" cy="5" r="3.4" fill="#f4c7a1"/><rect x="9.8" y="8" width="6.4" height="7" rx="2" fill="#d6f43c"/>
  </pattern>
  <linearGradient id="bl2Shade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f2a20" stop-opacity="0"/>
    <stop offset="1" stop-color="#0f2a20" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="bl2Surround" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1f7a52"/>
    <stop offset="1" stop-color="#2f8f4e"/>
  </linearGradient>
  <linearGradient id="bl2Court" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f7fe0"/>
    <stop offset="1" stop-color="#2c6bd8"/>
  </linearGradient>
  <linearGradient id="bl2Glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd27a" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="bl2Ball" cx="38%" cy="32%" r="70%">
    <stop offset="0" stop-color="#f1ff9a"/>
    <stop offset="0.55" stop-color="#d6f43c"/>
    <stop offset="1" stop-color="#9fbd12"/>
  </radialGradient>
  <linearGradient id="bl2Trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d6f43c" stop-opacity="0"/>
    <stop offset="1" stop-color="#d6f43c" stop-opacity="0.85"/>
  </linearGradient>
  <radialGradient id="bl2Vig" cx="50%" cy="52%" r="72%">
    <stop offset="0.6" stop-color="#07120d" stop-opacity="0"/>
    <stop offset="1" stop-color="#07120d" stop-opacity="0.55"/>
  </radialGradient>
  <pattern id="bl2Dots" width="8" height="8" patternUnits="userSpaceOnUse">
    <circle cx="4" cy="4" r="1" fill="#0f2a20" fill-opacity="0.08"/>
  </pattern>
  <pattern id="bl2Mesh" width="8" height="8" patternUnits="userSpaceOnUse">
    <path d="M0 0H8M0 0V8" stroke="#0f2a20" stroke-width="1.2" stroke-opacity="0.75"/>
  </pattern>
  <filter id="bl2Soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
  <clipPath id="bl2Clip"><rect x="22" y="22" width="636" height="976" rx="26"/></clipPath>
</defs>

<!-- paper frame (programme card) -->
<rect width="680" height="1020" fill="#f6f0dd"/>
<rect width="680" height="1020" fill="url(#bl2Dots)"/>

<g clip-path="url(#bl2Clip)">
  <!-- sunset sky -->
  <rect x="0" y="0" width="680" height="440" fill="url(#bl2Sky)"/>
  <circle cx="470" cy="360" r="190" fill="url(#bl2Sun)"/>
  <circle cx="470" cy="360" r="48" fill="#fff3c4"/>
  <g fill="#ffd9b0" fill-opacity="0.55">
    <ellipse cx="150" cy="300" rx="90" ry="9"/><ellipse cx="210" cy="285" rx="60" ry="7"/>
    <ellipse cx="560" cy="250" rx="80" ry="8"/><ellipse cx="610" cy="236" rx="46" ry="6"/>
  </g>

  <!-- floodlight towers -->
  <g stroke="#0f2a20" stroke-width="5" fill="#0f2a20">
    <line x1="70" y1="190" x2="70" y2="420"/><line x1="610" y1="190" x2="610" y2="420"/>
    <rect x="40" y="168" width="60" height="30" rx="4"/><rect x="580" y="168" width="60" height="30" rx="4"/>
  </g>
  <g fill="#fff8d8">
    <circle cx="52" cy="183" r="6"/><circle cx="70" cy="183" r="6"/><circle cx="88" cy="183" r="6"/>
    <circle cx="592" cy="183" r="6"/><circle cx="610" cy="183" r="6"/><circle cx="628" cy="183" r="6"/>
  </g>
  <g filter="url(#bl2Soft)" fill="#fff3c4" fill-opacity="0.7">
    <ellipse cx="70" cy="183" rx="46" ry="22"/><ellipse cx="610" cy="183" rx="46" ry="22"/>
  </g>

  <!-- stands: upper and lower tiers, in perspective -->
  <path d="M-10 330 L690 330 L690 470 L-10 470 Z" fill="url(#bl2Stand)"/>
  <path d="M-10 336 L690 336 L690 398 L-10 398 Z" fill="url(#bl2Crowd)"/>
  <path d="M-10 336 L690 336 L690 398 L-10 398 Z" fill="url(#bl2Shade)"/>
  <rect x="-10" y="398" width="700" height="8" fill="#0f2a20"/>
  <path d="M-10 406 L690 406 L690 470 L-10 470 Z" fill="url(#bl2Crowd2)"/>
  <path d="M-10 406 L690 406 L690 470 L-10 470 Z" fill="url(#bl2Shade)"/>
  <rect x="-10" y="326" width="700" height="10" fill="#0f2a20"/>
  <!-- sunlight washing the stands -->
  <rect x="-10" y="330" width="700" height="140" fill="url(#bl2Glow)"/>

  <!-- back wall: lime capping, painted boards; it wraps the corners -->
  <path d="M-10 470 L690 470 L690 690 L600 532 L80 532 L-10 690 Z" fill="#0f2a20"/>
  <rect x="-10" y="470" width="700" height="4" fill="#d6f43c"/>
  <g font-family="'Arial Black', Impact, sans-serif" font-size="19" fill="#2f6b4f" text-anchor="middle" letter-spacing="1">
    <text x="140" y="509">BASELINE OPEN</text>
    <text x="540" y="509">BASELINE OPEN</text>
  </g>

  <!-- court surround + playing court (camera behind the near baseline) -->
  <path d="M-200 1020 L80 532 L600 532 L880 1020 Z" fill="url(#bl2Surround)"/>
  <path d="M-80 1020 L190 560 L490 560 L760 1020 Z" fill="url(#bl2Court)"/>
  <!-- late-sun sheen across the court -->
  <path d="M190 560 L490 560 L560 680 L140 700 Z" fill="#ffd27a" fill-opacity="0.12"/>
  <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linejoin="round">
    <path d="M-80 1020 L190 560 L490 560 L760 1020"/>
    <path d="M-27 1020 L209 560 M707 1020 L471 560"/>
    <path d="M190 597 L490 597"/>
    <path d="M114 745 L566 745"/>
    <path d="M340 597 L340 745"/>
    <path d="M340 560 L340 570"/>
  </g>

  <!-- far player (red), ready position -->
  <g stroke="#0f2a20" stroke-width="3.5" stroke-linejoin="round">
    <ellipse cx="300" cy="590" rx="16" ry="4" fill="#0f2a20" fill-opacity="0.35" stroke="none"/>
    <path d="M292 588 L294 572 M308 588 L306 572" fill="none"/>
    <rect x="289" y="552" width="22" height="22" rx="6" fill="#ef4444"/>
    <circle cx="300" cy="545" r="8" fill="#f4c7a1"/>
    <path d="M311 560 L326 566" fill="none"/>
    <ellipse cx="331" cy="560" rx="7" ry="9" fill="none" stroke-width="3"/>
  </g>

  <!-- net -->
  <g stroke="#0f2a20" stroke-linejoin="round">
    <path d="M128 620 L552 620 L552 652 L128 652 Z" fill="url(#bl2Mesh)" stroke-width="3"/>
    <rect x="126" y="615" width="428" height="8" rx="2" fill="#ffffff" stroke-width="2.5"/>
    <rect x="336" y="621" width="8" height="31" fill="#ffffff" stroke-width="2"/>
    <line x1="126" y1="612" x2="126" y2="656" stroke-width="7"/>
    <line x1="554" y1="612" x2="554" y2="656" stroke-width="7"/>
  </g>

  <!-- ball in flight with trail and its shadow on the court -->
  <ellipse cx="402" cy="716" rx="20" ry="6" fill="#0f2a20" fill-opacity="0.3"/>
  <path d="M268 584 Q340 520 418 534 L420 552 Q342 540 270 600 Z" fill="url(#bl2Trail)"/>
  <g transform="translate(424 542)">
    <circle r="21" fill="url(#bl2Ball)" stroke="#0f2a20" stroke-width="4"/>
    <path d="M-15 -14 Q-2 0 -15 14 M15 -14 Q2 0 15 14" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- near player, back view: open-stance forehand prep, weight loaded on the right leg -->
  <g stroke="#0f2a20" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="282" cy="1002" rx="104" ry="16" fill="#0f2a20" fill-opacity="0.3" stroke="none"/>
    <!-- legs: left reaching out, right knee flexed and loaded; white socks -->
    <path d="M264 872 Q246 922 232 976 M304 872 Q334 920 326 976" fill="none" stroke-width="36"/>
    <path d="M264 872 Q246 922 232 976 M304 872 Q334 920 326 976" fill="none" stroke="#f4c7a1" stroke-width="24"/>
    <path d="M234 962 L231 980 M327 962 L326 980" fill="none" stroke-width="36"/>
    <path d="M234 962 L231 980 M327 962 L326 980" fill="none" stroke="#ffffff" stroke-width="24"/>
    <!-- shoes -->
    <path d="M206 1000 Q206 980 229 980 Q252 980 254 1000 Z" fill="#ffffff"/>
    <path d="M302 1000 Q302 980 325 980 Q348 980 350 1000 Z" fill="#ffffff"/>
    <path d="M206 1000 H254 M302 1000 H350" stroke="#d6f43c" stroke-width="4"/>
    <!-- shorts -->
    <path d="M244 840 L322 840 L336 898 L290 902 L284 884 L278 902 L232 898 Z" fill="#f6f0dd"/>
  </g>
  <!-- upper body leans a touch over the loaded leg -->
  <g transform="rotate(4 284 860)" stroke="#0f2a20" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- neck -->
    <path d="M270 736 L296 736 L298 760 L268 760 Z" fill="#f4c7a1"/>
    <!-- off arm turned across the body (forearm tucks behind the torso) -->
    <path d="M240 782 L214 818 L258 834" fill="none" stroke-width="24"/>
    <path d="M240 782 L214 818 L258 834" fill="none" stroke="#f4c7a1" stroke-width="13"/>
    <!-- racket arm, elbow dropped, hand back at chest height -->
    <path d="M328 782 L360 820 L400 806" fill="none" stroke-width="24"/>
    <path d="M328 782 L360 820 L400 806" fill="none" stroke="#f4c7a1" stroke-width="13"/>
    <!-- torso: tank top tapering to the waist -->
    <path d="M226 770 Q282 746 340 770 Q346 802 330 824 Q322 842 324 858 L244 858 Q246 842 236 824 Q220 802 226 770 Z" fill="#3b82f6"/>
    <path d="M226 770 Q220 802 236 824 Q246 842 244 858 L268 858 Q262 820 262 762 Q240 762 226 770 Z" fill="#1e4fa8" fill-opacity="0.45" stroke="none"/>
    <path d="M336 776 Q342 804 328 824" fill="none" stroke="#ffd27a" stroke-width="4"/>
    <path d="M262 756 Q283 768 304 756" fill="none" stroke="#d6f43c" stroke-width="5"/>
    <!-- ears, short hair, and the in-game blue cap seen from behind (dome, strap gap, button) -->
    <circle cx="253" cy="716" r="7" fill="#f4c7a1" stroke-width="4"/>
    <circle cx="313" cy="716" r="7" fill="#f4c7a1" stroke-width="4"/>
    <circle cx="283" cy="712" r="30" fill="#b5824a"/>
    <path d="M250 712 A33 33 0 0 1 316 712 Z" fill="#2563eb"/>
    <path d="M283 680 V702" fill="none" stroke="#1c4bb0" stroke-width="3"/>
    <path d="M300 686 Q310 694 312 704" fill="none" stroke="#ffd27a" stroke-width="3.5"/>
    <rect x="272" y="701" width="22" height="11" rx="2" fill="#1c4bb0" stroke-width="4"/>
    <path d="M277 707 H289" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
    <circle cx="283" cy="679" r="5" fill="#1c4bb0" stroke-width="3"/>
  <!-- racket: grip in the right hand, head cocked up and back -->
  <g transform="translate(402 806) rotate(38)" stroke="#0f2a20" stroke-linejoin="round" stroke-linecap="round">
    <rect x="-6" y="-50" width="12" height="54" rx="4" fill="#e4683a" stroke-width="5"/>
    <path d="M-5 -50 L-16 -60 M5 -50 L16 -60" fill="none" stroke-width="5"/>
    <g transform="translate(0 -96)">
      <ellipse cx="0" cy="0" rx="28" ry="38" fill="#ffffff" fill-opacity="0.18" stroke-width="7"/>
      <ellipse cx="0" cy="0" rx="28" ry="38" fill="none" stroke="#ef4444" stroke-width="3"/>
      <path d="M-19 -23 V23 M-9.5 -34 V34 M0 -38 V38 M9.5 -34 V34 M19 -23 V23 M-24 -16 H24 M-27 -5 H27 M-27 6 H27 M-24 17 H24 M-18 28 H18" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.85"/>
    </g>
    <circle cx="0" cy="-4" r="10" fill="#f4c7a1" stroke-width="4"/>
  </g>
  </g>

  <rect x="0" y="0" width="680" height="1020" fill="url(#bl2Vig)"/>
</g>

<!-- ink border of the card -->
<rect x="22" y="22" width="636" height="976" rx="26" fill="none" stroke="#0f2a20" stroke-width="7"/>

<!-- title: ball-yellow, ink outline, hard offset shadow -->
<g transform="translate(340 196) rotate(-4)" font-family="Anton, Impact, 'Arial Black', sans-serif" font-size="150" text-anchor="middle">
  <text x="11" y="11" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#0f2a20" stroke="#0f2a20" stroke-width="16" stroke-linejoin="round">BASELINE</text>
  <text x="0" y="0" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#d6f43c" stroke="#0f2a20" stroke-width="16" stroke-linejoin="round">BASELINE</text>
  <text x="0" y="0" textLength="560" lengthAdjust="spacingAndGlyphs" fill="#d6f43c">BASELINE</text>  <!-- clay dash underline, like the in-game headings -->
  <rect x="-200" y="30" width="400" height="12" rx="6" fill="#0f2a20"/>
  <path d="M-188 36 H188" stroke="#e4683a" stroke-width="7" stroke-dasharray="26 12" stroke-linecap="round"/>
</g>

</svg>
