<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <linearGradient id="bliSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5ba9dd"/>
    <stop offset="0.55" stop-color="#8ed0f0"/>
    <stop offset="1" stop-color="#cdeeff"/>
  </linearGradient>
  <linearGradient id="bliCourt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#54b057"/>
    <stop offset="1" stop-color="#327a37"/>
  </linearGradient>
  <radialGradient id="bliSun" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="rgba(255,250,210,0.95)"/>
    <stop offset="1" stop-color="rgba(255,250,210,0)"/>
  </radialGradient>
  <linearGradient id="bliTitle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.5" stop-color="#eaff7a"/>
    <stop offset="1" stop-color="#a6d62f"/>
  </linearGradient>
  <filter id="bliGlow" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- 1. bright day sky -->
<rect width="680" height="460" fill="url(#bliSky)"/>
<circle cx="556" cy="240" r="120" fill="url(#bliSun)"/>
<circle cx="556" cy="240" r="40" fill="rgba(255,252,225,0.92)"/>
<g fill="rgba(255,255,255,0.9)">
  <ellipse cx="140" cy="245" rx="55" ry="21"/><ellipse cx="180" cy="233" rx="38" ry="18"/><ellipse cx="102" cy="236" rx="32" ry="16"/>
  <ellipse cx="415" cy="212" rx="44" ry="17"/><ellipse cx="447" cy="203" rx="30" ry="14"/>
</g>

<!-- 2. stands with crowd dots -->
<g>
  <rect x="0" y="320" width="680" height="36" fill="#2b6fb0"/>
  <rect x="0" y="356" width="680" height="36" fill="#3f8bd0"/>
  <rect x="0" y="392" width="680" height="36" fill="#2a8a6e"/>
  <g fill="rgba(0,0,0,0.16)">
    <circle cx="30" cy="338" r="5"/><circle cx="80" cy="338" r="5"/><circle cx="130" cy="338" r="5"/>
    <circle cx="180" cy="338" r="5"/><circle cx="230" cy="338" r="5"/><circle cx="280" cy="338" r="5"/>
    <circle cx="330" cy="338" r="5"/><circle cx="380" cy="338" r="5"/><circle cx="430" cy="338" r="5"/>
    <circle cx="480" cy="338" r="5"/><circle cx="530" cy="338" r="5"/><circle cx="580" cy="338" r="5"/>
    <circle cx="630" cy="338" r="5"/>
    <circle cx="55" cy="374" r="5"/><circle cx="105" cy="374" r="5"/><circle cx="155" cy="374" r="5"/>
    <circle cx="205" cy="374" r="5"/><circle cx="255" cy="374" r="5"/><circle cx="305" cy="374" r="5"/>
    <circle cx="355" cy="374" r="5"/><circle cx="405" cy="374" r="5"/><circle cx="455" cy="374" r="5"/>
    <circle cx="505" cy="374" r="5"/><circle cx="555" cy="374" r="5"/><circle cx="605" cy="374" r="5"/>
    <circle cx="655" cy="374" r="5"/>
    <circle cx="30" cy="410" r="5"/><circle cx="80" cy="410" r="5"/><circle cx="130" cy="410" r="5"/>
    <circle cx="180" cy="410" r="5"/><circle cx="230" cy="410" r="5"/><circle cx="280" cy="410" r="5"/>
    <circle cx="330" cy="410" r="5"/><circle cx="380" cy="410" r="5"/><circle cx="430" cy="410" r="5"/>
    <circle cx="480" cy="410" r="5"/><circle cx="530" cy="410" r="5"/><circle cx="580" cy="410" r="5"/>
    <circle cx="630" cy="410" r="5"/>
  </g>
</g>
<rect x="0" y="428" width="680" height="8" fill="#163521"/>

<!-- 3. court in perspective -->
<rect x="0" y="436" width="680" height="584" fill="#2c6e3f"/>
<polygon points="205,470 475,470 760,1020 -80,1020" fill="url(#bliCourt)"/>
<g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
  <line x1="205" y1="470" x2="475" y2="470"/>
  <line x1="205" y1="470" x2="-80" y2="1020"/>
  <line x1="475" y1="470" x2="760" y2="1020"/>
  <line x1="256" y1="568" x2="424" y2="568"/>
  <line x1="184" y1="830" x2="496" y2="830"/>
  <line x1="340" y1="568" x2="340" y2="830"/>
  <line x1="256" y1="568" x2="184" y2="830"/>
  <line x1="424" y1="568" x2="496" y2="830"/>
</g>

<!-- 4. net across the middle -->
<g>
  <polygon points="130,650 550,650 550,590 130,590" fill="rgba(245,250,245,0.28)"/>
  <g stroke="rgba(255,255,255,0.2)" stroke-width="1.5">
    <line x1="150" y1="590" x2="150" y2="650"/><line x1="190" y1="590" x2="190" y2="650"/>
    <line x1="230" y1="590" x2="230" y2="650"/><line x1="270" y1="590" x2="270" y2="650"/>
    <line x1="310" y1="590" x2="310" y2="650"/><line x1="350" y1="590" x2="350" y2="650"/>
    <line x1="390" y1="590" x2="390" y2="650"/><line x1="430" y1="590" x2="430" y2="650"/>
    <line x1="470" y1="590" x2="470" y2="650"/><line x1="510" y1="590" x2="510" y2="650"/>
    <line x1="130" y1="612" x2="550" y2="612"/><line x1="130" y1="632" x2="550" y2="632"/>
  </g>
  <line x1="130" y1="590" x2="550" y2="590" stroke="#ffffff" stroke-width="5"/>
  <rect x="124" y="586" width="10" height="70" rx="3" fill="#2c2c2c"/>
  <rect x="546" y="586" width="10" height="70" rx="3" fill="#2c2c2c"/>
  <circle cx="129" cy="586" r="6" fill="#e9e9e9"/><circle cx="551" cy="586" r="6" fill="#e9e9e9"/>
</g>

<!-- 5. opponent (far side, red jersey) -->
<g transform="translate(430,540) scale(1.1)">
  <ellipse cx="0" cy="2" rx="26" ry="8" fill="rgba(0,0,0,0.25)"/>
  <g stroke="#f0c096" stroke-width="8" stroke-linecap="round">
    <line x1="-7" y1="-34" x2="-11" y2="-2"/><line x1="7" y1="-34" x2="11" y2="-2"/>
  </g>
  <ellipse cx="-11" cy="-1" rx="6" ry="3.5" fill="#fff"/><ellipse cx="11" cy="-1" rx="6" ry="3.5" fill="#fff"/>
  <rect x="-13" y="-46" width="26" height="16" rx="6" fill="#1f2933"/>
  <rect x="-15" y="-78" width="30" height="36" rx="9" fill="#ef4444"/>
  <rect x="-4" y="-84" width="8" height="8" fill="#f0c096"/>
  <circle cx="0" cy="-92" r="11" fill="#f0c096"/>
  <path d="M -11 -94 A 11 11 0 0 1 11 -94 Z" fill="#b91c1c"/>
  <rect x="-2" y="-94" width="16" height="4" fill="#b91c1c"/>
  <g stroke="#f0c096" stroke-width="7" stroke-linecap="round">
    <line x1="-8" y1="-64" x2="-20" y2="-46"/>
  </g>
  <g transform="translate(-20,-46) rotate(-115)">
    <line x1="0" y1="0" x2="13" y2="0" stroke="#7a4a1f" stroke-width="4"/>
    <ellipse cx="24" cy="0" rx="12" ry="9" fill="none" stroke="#222" stroke-width="3"/>
  </g>
</g>

<!-- 6. the ball, just struck from the near side, climbing toward the far court -->
<g>
  <circle cx="342" cy="708" r="10" fill="#d4f542" opacity="0.2"/>
  <circle cx="358" cy="682" r="12" fill="#d4f542" opacity="0.35"/>
  <circle cx="380" cy="648" r="16" fill="#d4f542" filter="url(#bliGlow)"/>
  <circle cx="380" cy="648" r="16" fill="none" stroke="#aacb1f" stroke-width="2"/>
  <path d="M 375 634 A 17.6 17.6 0 0 0 375 662" stroke="rgba(255,255,255,0.85)" stroke-width="2.2" fill="none"/>
  <path d="M 385 634 A 17.6 17.6 0 0 1 385 662" stroke="rgba(255,255,255,0.85)" stroke-width="2.2" fill="none"/>
  <circle cx="374" cy="642" r="4.5" fill="rgba(255,255,255,0.6)"/>
</g>

<!-- 7. player (near side, back view, mid-swing) -->
<g transform="translate(255,955) scale(2.35)">
  <ellipse cx="0" cy="2" rx="26" ry="8" fill="rgba(0,0,0,0.3)"/>
  <g stroke="#f0c096" stroke-width="8" stroke-linecap="round">
    <line x1="-7" y1="-34" x2="-13" y2="-2"/><line x1="7" y1="-34" x2="13" y2="-2"/>
  </g>
  <ellipse cx="-13" cy="-1" rx="6" ry="3.5" fill="#fff"/><ellipse cx="13" cy="-1" rx="6" ry="3.5" fill="#fff"/>
  <rect x="-13" y="-46" width="26" height="16" rx="6" fill="#1f2933"/>
  <rect x="-15" y="-78" width="30" height="36" rx="9" fill="#3b82f6"/>
  <rect x="-3" y="-74" width="6" height="26" fill="rgba(255,255,255,0.85)"/>
  <rect x="-4" y="-84" width="8" height="8" fill="#f0c096"/>
  <circle cx="0" cy="-92" r="11" fill="#f0c096"/>
  <path d="M -11 -87 A 11 11 0 0 1 11 -87 L 11 -84 L -11 -84 Z" fill="#b5824a"/>
  <path d="M -11 -94 A 11 11 0 0 1 11 -94 Z" fill="#2563eb"/>
  <rect x="-13" y="-95" width="12" height="4" fill="#2563eb"/>
  <g stroke="#f0c096" stroke-width="7" stroke-linecap="round">
    <line x1="8" y1="-64" x2="17" y2="-52"/>
  </g>
  <g transform="translate(17,-52) rotate(-55)">
    <line x1="0" y1="0" x2="13" y2="0" stroke="#7a4a1f" stroke-width="4"/>
    <ellipse cx="24" cy="0" rx="12" ry="9" fill="none" stroke="#222" stroke-width="3"/>
    <g stroke="rgba(255,255,255,0.5)" stroke-width="0.8">
      <line x1="18" y1="-6" x2="30" y2="-6"/><line x1="16" y1="-3" x2="32" y2="-3"/>
      <line x1="15" y1="0" x2="33" y2="0"/><line x1="16" y1="3" x2="32" y2="3"/>
      <line x1="18" y1="6" x2="30" y2="6"/>
    </g>
    <path d="M 24 -24 A 24 24 0 0 1 40 8" stroke="rgba(255,255,255,0.5)" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</g>

<!-- 8. title -->
<text x="345" y="133" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
      font-size="96" letter-spacing="-2" fill="rgba(6,20,42,0.85)">BASELINE</text>
<text x="340" y="128" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
      font-size="96" letter-spacing="-2" fill="url(#bliTitle)" filter="url(#bliGlow)">BASELINE</text>
<g>
  <rect x="128" y="166" width="34" height="3" fill="#a6d62f"/>
  <text x="340" y="174" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="700"
        font-size="19" letter-spacing="10" fill="#0d3557">ARCADE TENNIS</text>
  <rect x="518" y="166" width="34" height="3" fill="#a6d62f"/>
</g>
</svg>
