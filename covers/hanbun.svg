<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#faf2df"/>
    <stop offset="0.45" stop-color="#efe4cc"/>
    <stop offset="0.78" stop-color="#e2d3b3"/>
    <stop offset="1" stop-color="#cdb992"/>
  </linearGradient>
  <radialGradient id="sun" cx="38%" cy="32%" r="72%">
    <stop offset="0" stop-color="#d0503a"/>
    <stop offset="0.62" stop-color="#c03626"/>
    <stop offset="1" stop-color="#9d2618"/>
  </radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#342c26" stop-opacity="0"/>
    <stop offset="0.38" stop-color="#342c26" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#241f1a" stop-opacity="0.9"/>
  </linearGradient>
  <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8d8a86"/>
    <stop offset="0.35" stop-color="#f4f1ea"/>
    <stop offset="1" stop-color="#cfcac0"/>
  </linearGradient>
  <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="0.7" stop-color="#fff3d8" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shapeL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#57708f"/>
    <stop offset="1" stop-color="#33445e"/>
  </linearGradient>
  <linearGradient id="shapeR" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a6180"/>
    <stop offset="1" stop-color="#28374e"/>
  </linearGradient>
  <radialGradient id="vig" cx="50%" cy="46%" r="72%">
    <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#4a3520" stop-opacity="0.34"/>
  </radialGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- 1. washi paper -->
<rect width="680" height="1020" fill="url(#paper)"/>
<g opacity="0.09" fill="#6b563a">
  <circle cx="88" cy="188" r="2.4"/><circle cx="612" cy="132" r="1.9"/><circle cx="230" cy="742" r="2.1"/>
  <circle cx="520" cy="640" r="1.7"/><circle cx="146" cy="470" r="1.6"/><circle cx="592" cy="880" r="2.2"/>
  <circle cx="330" cy="948" r="1.5"/><circle cx="66" cy="640" r="1.8"/>
</g>

<!-- 2. vermillion sun -->
<circle cx="340" cy="322" r="272" fill="url(#sun)"/>
<path d="M 340 32 A 290 290 0 1 1 118 500" fill="none" stroke="#7c2013" stroke-opacity="0.24" stroke-width="7" stroke-linecap="round"/>

<!-- 3. title inside the sun -->
<text x="342" y="292" text-anchor="middle" font-family="'Yu Mincho','Yuji Syuku','MS Mincho','Hiragino Mincho ProN',serif"
      font-size="176" fill="#651a0e" opacity="0.45">半分</text>
<text x="338" y="286" text-anchor="middle" font-family="'Yu Mincho','Yuji Syuku','MS Mincho','Hiragino Mincho ProN',serif"
      font-size="176" fill="#fdf4e2" filter="url(#glow)">半<tspan fill="#f7d9a4">分</tspan></text>
<text x="338" y="360" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900"
      font-size="34" letter-spacing="10" fill="#ffeed6" opacity="0.96">HANBUN DOJO</text>
<rect x="176" y="392" width="324" height="2.2" fill="#ffeed6" opacity="0.42"/>
<text x="338" y="430" text-anchor="middle" font-family="'Zen Kaku Gothic New','Segoe UI',sans-serif"
      font-size="17" letter-spacing="5.5" fill="#ffe1c4" opacity="0.88">TRIALS OF THE BLADE</text>
<text x="338" y="466" text-anchor="middle" font-family="'Yu Mincho','Yuji Syuku','MS Mincho',serif"
      font-size="21" letter-spacing="7" fill="#ffd7a8" opacity="0.8">刃の試練</text>

<!-- 4. distant ink hills -->
<path d="M -30 742 Q 120 640 262 706 Q 372 758 500 716 Q 600 682 712 730 L 712 1020 L -30 1020 Z"
      fill="#5a5862" opacity="0.17"/>
<path d="M -30 796 Q 160 712 330 782 Q 500 848 712 776 L 712 1020 L -30 1020 Z"
      fill="#46444f" opacity="0.15"/>

<!-- 5. bamboo grove, right edge -->
<g opacity="0.5">
  <g fill="#6f7f5a">
    <rect x="628" y="120" width="22" height="770" rx="6"/>
    <rect x="600" y="270" width="12" height="620" rx="4"/>
    <rect x="656" y="200" width="9" height="690" rx="3"/>
  </g>
  <g stroke="#4b5a3b" stroke-width="3" opacity="0.75">
    <line x1="628" y1="270" x2="650" y2="270"/><line x1="628" y1="430" x2="650" y2="430"/>
    <line x1="628" y1="592" x2="650" y2="592"/><line x1="628" y1="752" x2="650" y2="752"/>
    <line x1="600" y1="392" x2="612" y2="392"/><line x1="600" y1="560" x2="612" y2="560"/>
    <line x1="600" y1="726" x2="612" y2="726"/>
  </g>
  <g fill="#6f7f5a" opacity="0.85">
    <path d="M 626 236 Q 574 208 540 226 Q 582 254 626 244 Z"/>
    <path d="M 652 350 Q 700 320 680 300 Q 652 322 648 348 Z"/>
    <path d="M 598 470 Q 548 452 528 470 Q 566 490 598 478 Z"/>
  </g>
</g>

<!-- 6. sakura branch, top-left -->
<g opacity="0.9">
  <path d="M -10 96 Q 74 122 132 168 Q 176 202 206 250" fill="none" stroke="#5c4a3c" stroke-width="7" stroke-linecap="round"/>
  <path d="M 62 116 Q 90 146 96 186" fill="none" stroke="#5c4a3c" stroke-width="4" stroke-linecap="round"/>
  <g fill="#e8a7b6">
    <circle cx="42" cy="108" r="9"/><circle cx="84" cy="132" r="7.5"/><circle cx="96" cy="188" r="8"/>
    <circle cx="132" cy="168" r="9.5"/><circle cx="168" cy="206" r="7"/><circle cx="204" cy="248" r="8.5"/>
    <circle cx="58" cy="148" r="6"/><circle cx="150" cy="132" r="6.5"/>
  </g>
  <g fill="#f0bcc8" opacity="0.9">
    <circle cx="42" cy="104" r="4"/><circle cx="132" cy="164" r="4.4"/><circle cx="204" cy="244" r="3.8"/>
  </g>
</g>
<g fill="#e8a7b6" opacity="0.75">
  <ellipse cx="112" cy="352" rx="7" ry="4.4" transform="rotate(-28 112 352)"/>
  <ellipse cx="66" cy="512" rx="6" ry="3.8" transform="rotate(22 66 512)"/>
  <ellipse cx="588" cy="452" rx="6.5" ry="4" transform="rotate(-14 588 452)"/>
  <ellipse cx="176" cy="660" rx="7.5" ry="4.6" transform="rotate(34 176 660)"/>
  <ellipse cx="520" cy="560" rx="5.6" ry="3.4" transform="rotate(-40 520 560)"/>
  <ellipse cx="404" cy="812" rx="6.8" ry="4.2" transform="rotate(16 404 812)"/>
  <ellipse cx="252" cy="880" rx="5.4" ry="3.4" transform="rotate(-22 252 880)"/>
</g>

<!-- 7. ground -->
<rect x="0" y="806" width="680" height="214" fill="url(#ground)"/>
<path d="M 22 902 Q 340 890 660 906" fill="none" stroke="#2a221b" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
<g stroke="#2a221b" stroke-width="3" opacity="0.5" stroke-linecap="round">
  <path d="M 70 906 L 62 884"/><path d="M 112 908 L 118 886"/><path d="M 214 904 L 206 882"/>
  <path d="M 520 906 L 528 884"/><path d="M 578 908 L 570 888"/><path d="M 300 902 L 296 884"/>
</g>

<!-- 8. severed rope, still swinging from above -->
<path d="M 452 462 Q 444 522 450 572" fill="none" stroke="#eccfa2" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
<path d="M 450 572 Q 462 588 454 602" fill="none" stroke="#eccfa2" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

<!-- 9. the halved shape (falling apart along the cut) -->
<g>
  <ellipse cx="450" cy="900" rx="140" ry="15" fill="#141110" opacity="0.34" filter="url(#soft)"/>
  <!-- upper half, kicked up and away by the strike -->
  <g transform="translate(424 662) rotate(-9)">
    <path d="M -90 4 C -94 -38 -64 -78 -22 -88 C 24 -99 68 -74 86 -30 L 90 4 Z"
          fill="url(#shapeL)" stroke="#1d2838" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -90 4 L 90 4 L 86 -8 L -86 -8 Z" fill="#ece5d5"/>
    <circle cx="-34" cy="-44" r="9" fill="#141c28" opacity="0.42"/>
    <path d="M 16 -62 Q 42 -50 56 -34" fill="none" stroke="#141c28" stroke-width="4" stroke-opacity="0.42" stroke-linecap="round"/>
  </g>
  <!-- lower half, dropping -->
  <g transform="translate(456 730) rotate(-13)">
    <path d="M -90 -4 C -94 38 -64 78 -22 88 C 24 99 68 74 86 30 L 90 -4 Z"
          fill="url(#shapeR)" stroke="#1d2838" stroke-width="4" stroke-linejoin="round"/>
    <path d="M -90 -4 L 90 -4 L 86 8 L -86 8 Z" fill="#ece5d5"/>
    <circle cx="34" cy="44" r="7.5" fill="#141c28" opacity="0.42"/>
    <path d="M -56 30 Q -32 50 -6 54" fill="none" stroke="#141c28" stroke-width="4" stroke-opacity="0.42" stroke-linecap="round"/>
  </g>
</g>

<!-- 10. the cut — a single streak running out of the blade -->
<g transform="rotate(-11 446 680)">
  <rect x="368" y="672" width="326" height="16" rx="8" fill="url(#slash)"/>
  <rect x="380" y="678" width="308" height="4" rx="2" fill="#ffffff" opacity="0.92"/>
</g>

<!-- 11. samurai, mid-iai -->
<g transform="translate(126 918) scale(0.98)">
  <ellipse cx="6" cy="4" rx="58" ry="10" fill="#1b1712" opacity="0.4" filter="url(#soft)"/>
  <!-- rear leg -->
  <path d="M -6 -84 L -46 -6 L -22 -2 L 8 -66 Z" fill="#2b3550"/>
  <!-- front leg -->
  <path d="M 10 -84 L 44 -8 L 66 -14 L 34 -80 Z" fill="#39445f"/>
  <!-- hakama skirt -->
  <path d="M -22 -152 L 34 -152 L 50 -74 L -34 -74 Z" fill="#39445f"/>
  <path d="M -22 -152 L 34 -152 L 38 -120 L -26 -120 Z" fill="#2b3550"/>
  <!-- obi -->
  <rect x="-24" y="-166" width="60" height="18" rx="4" fill="#c53d2e"/>
  <path d="M 34 -160 L 58 -150 L 40 -140 Z" fill="#a32b1e"/>
  <!-- gi torso -->
  <path d="M -26 -238 L 36 -238 L 40 -162 L -26 -162 Z" fill="#f2e8d5"/>
  <path d="M 4 -238 L 30 -166 L 4 -162 L -18 -166 Z" fill="#e0d3ba"/>
  <path d="M -26 -238 L 6 -196 L 38 -238 Z" fill="#dccfb4"/>
  <!-- rear arm -->
  <path d="M -24 -228 L -56 -186 L -40 -174 L -12 -212 Z" fill="#f2e8d5"/>
  <!-- extended sword arm -->
  <path d="M 30 -230 L 108 -212 L 106 -190 L 28 -204 Z" fill="#f2e8d5"/>
  <circle cx="108" cy="-201" r="12" fill="#e8dcc3"/>
  <!-- head -->
  <circle cx="6" cy="-268" r="27" fill="#e6c9a4"/>
  <path d="M -21 -276 Q 6 -306 33 -276 Q 24 -292 6 -294 Q -12 -292 -21 -276 Z" fill="#231d18"/>
  <path d="M -21 -278 Q 6 -300 33 -278 L 33 -268 Q 6 -282 -21 -268 Z" fill="#231d18"/>
  <path d="M 2 -300 Q 8 -318 20 -308 Q 12 -300 10 -294 Z" fill="#231d18"/>
  <circle cx="-3" cy="-266" r="2.6" fill="#231d18"/><circle cx="15" cy="-266" r="2.6" fill="#231d18"/>
  <!-- katana, thrust right along the cut -->
  <g transform="rotate(-11 108 -201)">
    <rect x="94" y="-209" width="32" height="16" rx="3" fill="#241f1a"/>
    <rect x="126" y="-212" width="8" height="21" rx="3" fill="#c9a227"/>
    <path d="M 134 -208 L 254 -214 L 274 -200 L 134 -194 Z" fill="url(#blade)"/>
    <path d="M 134 -206 L 250 -211 L 266 -204 L 134 -200 Z" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- saya on the hip -->
  <path d="M -30 -166 L -96 -140 L -100 -150 L -34 -178 Z" fill="#241f1a"/>
</g>

<!-- 11. seal + vignette -->
<g transform="translate(596 946)">
  <rect x="-34" y="-34" width="68" height="68" rx="5" fill="#c53d2e"/>
  <rect x="-27" y="-27" width="54" height="54" rx="3" fill="none" stroke="#f8ecd8" stroke-width="2.4" opacity="0.65"/>
  <text x="0" y="12" text-anchor="middle" font-family="'Yu Mincho','Yuji Syuku','MS Mincho',serif" font-size="34" fill="#fdf4e2">極</text>
</g>
<rect width="680" height="1020" fill="url(#vig)"/>
</svg>
