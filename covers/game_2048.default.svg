<svg viewBox="0 0 680 1020" width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="52%" r="58%">
      <stop offset="0%"   stop-color="#d7ae76" stop-opacity="1"/>
      <stop offset="100%" stop-color="#966c3e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f8e4b0" stop-opacity="0.46"/>
      <stop offset="60%"  stop-color="#e0a552" stop-opacity="0.27"/>
      <stop offset="100%" stop-color="#966c3e" stop-opacity="0"/>
    </radialGradient>

    <!-- in-game .t2048 : linear-gradient(135deg,#fcd34d,#f59e0b,#ea580c,#dc2626) -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fcd34d"/>
      <stop offset="35%"  stop-color="#f59e0b"/>
      <stop offset="70%"  stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="50%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="boardSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffeec4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffeec4" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="tileGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- glow (their box-shadows) plus a dark lift so tiles read against the light ground -->
    <filter id="smallGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge result="glowed"><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      <feDropShadow in="glowed" dx="0" dy="6" stdDeviation="8" flood-color="#3a2004" flood-opacity="0.45"/>
    </filter>
    <filter id="flatLift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3a2004" flood-opacity="0.45"/>
    </filter>
    <filter id="boardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a1004" flood-opacity="0.45"/>
    </filter>

    <clipPath id="clip"><rect width="680" height="1020"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="680" height="1020" fill="url(#bgGlow)"/>

    <!-- Subtle grid background -->
    <g opacity="0.10" stroke="#5c3208" stroke-width="0.8">
      <line x1="0" y1="255" x2="680" y2="255"/>
      <line x1="0" y1="425" x2="680" y2="425"/>
      <line x1="0" y1="595" x2="680" y2="595"/>
      <line x1="0" y1="765" x2="680" y2="765"/>
      <line x1="0" y1="935" x2="680" y2="935"/>
      <line x1="170" y1="0" x2="170" y2="1020"/>
      <line x1="340" y1="0" x2="340" y2="1020"/>
      <line x1="510" y1="0" x2="510" y2="1020"/>
    </g>

    <!-- Ambient glow behind the 2048 tile -->
    <ellipse cx="340" cy="606" rx="310" ry="310" fill="url(#coreGlow)"/>

    <!-- Corner decorations -->
    <polyline points="24,24 24,68 68,68"       fill="none" stroke="#6b3c0a" stroke-width="2" opacity="0.45"/>
    <polyline points="656,24 656,68 612,68"    fill="none" stroke="#6b3c0a" stroke-width="2" opacity="0.45"/>
    <polyline points="24,996 24,952 68,952"    fill="none" stroke="#6b3c0a" stroke-width="2" opacity="0.45"/>
    <polyline points="656,996 656,952 612,952" fill="none" stroke="#6b3c0a" stroke-width="2" opacity="0.45"/>

    <!-- ══ TITLE ══ -->
    <text x="340" y="150" text-anchor="middle"
          font-family="'Arial Black', Arial, sans-serif" font-size="118" font-weight="900"
          letter-spacing="-4" fill="#fbbf24" filter="url(#titleGlow)" opacity="0.6">2048</text>
    <text x="345" y="155" text-anchor="middle"
          font-family="'Arial Black', Arial, sans-serif" font-size="118" font-weight="900"
          letter-spacing="-4" fill="rgba(48,17,1,0.7)">2048</text>
    <text x="340" y="150" text-anchor="middle"
          font-family="'Arial Black', Arial, sans-serif" font-size="118" font-weight="900"
          letter-spacing="-4" fill="url(#titleGrad)">2048</text>

    <line x1="86" y1="192" x2="594" y2="192" stroke="#fbbf24" stroke-width="1.2" opacity="0.35"/>

    <!-- ══ BOARD — the game's own grid surface ══ -->
    <g filter="url(#boardShadow)">
      <rect x="30" y="296" width="620" height="620" rx="24" fill="rgba(255,236,190,0.12)"/>
    </g>
    <rect x="30" y="296" width="620" height="620" rx="24" fill="url(#boardSheen)"/>
    <rect x="30" y="296" width="620" height="620" rx="24" fill="none" stroke="rgba(255,228,160,0.24)" stroke-width="2"/>
    <path d="M54 298 H626" stroke="rgba(255,238,196,0.18)" stroke-width="2" fill="none"/>

    <!-- empty cells (cell-bg) — the two open squares, top right -->
    <g fill="rgba(58,42,18,0.28)" stroke="rgba(40,28,10,0.18)" stroke-width="1.5">
      <rect x="500" y="316" width="130" height="130" rx="14"/>
      <rect x="500" y="466" width="130" height="130" rx="14"/>
    </g>

    <!-- ══ TILES — exact in-game palette, ascending 2 → 1024 counter-clockwise ══ -->
    <!-- 2 / 4 : flat cream with a hairline, no glow (as in game) -->
    <g filter="url(#flatLift)">
      <rect x="350" y="316" width="130" height="130" rx="14" fill="#f4ead3" stroke="rgba(120,85,30,0.14)" stroke-width="2"/>
      <rect x="200" y="316" width="130" height="130" rx="14" fill="#efdcb0" stroke="rgba(120,85,30,0.16)" stroke-width="2"/>
    </g>
    <!-- 8 → 1024 : glowing, like their box-shadows -->
    <g filter="url(#smallGlow)">
      <rect x="50"  y="316" width="130" height="130" rx="14" fill="#f0ac63"/>
      <rect x="50"  y="466" width="130" height="130" rx="14" fill="#ec8f42"/>
      <rect x="50"  y="616" width="130" height="130" rx="14" fill="#e0761a"/>
      <rect x="50"  y="766" width="130" height="130" rx="14" fill="#f59e0b"/>
      <rect x="200" y="766" width="130" height="130" rx="14" fill="#fbbf24"/>
      <rect x="350" y="766" width="130" height="130" rx="14" fill="#fcd34d"/>
      <rect x="500" y="766" width="130" height="130" rx="14" fill="#ea580c"/>
      <rect x="500" y="616" width="130" height="130" rx="14" fill="#dc2626"/>
    </g>

    <g font-family="'Arial Black', Arial, sans-serif" font-weight="900" text-anchor="middle">
      <text x="415" y="402" font-size="56" fill="#6f5322">2</text>
      <text x="265" y="402" font-size="56" fill="#6f5322">4</text>
      <text x="115" y="402" font-size="56" fill="#4a2c08">8</text>
      <text x="115" y="552" font-size="50" fill="#402304">16</text>
      <text x="115" y="702" font-size="50" fill="#ffffff">32</text>
      <text x="115" y="852" font-size="50" fill="#1c1005">64</text>
      <text x="265" y="850" font-size="44" fill="#1c1005">128</text>
      <text x="415" y="850" font-size="44" fill="#1c1005">256</text>
      <text x="565" y="850" font-size="44" fill="#ffffff">512</text>
      <text x="565" y="699" font-size="38" fill="#ffffff">1024</text>
    </g>

    <!-- ══ THE 2048 TILE (2×2) ══ -->
    <rect x="200" y="466" width="280" height="280" rx="22" fill="url(#tileGrad)" filter="url(#tileGlow)" opacity="0.55"/>
    <rect x="208" y="476" width="280" height="280" rx="22" fill="rgba(48,17,1,0.45)"/>
    <rect x="200" y="466" width="280" height="280" rx="22" fill="url(#tileGrad)"/>
    <rect x="200" y="466" width="280" height="140" rx="22" fill="rgba(255,255,255,0.07)"/>
    <rect x="200" y="466" width="280" height="280" rx="22" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

    <text x="344" y="630" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
          font-size="78" font-weight="900" fill="rgba(96,29,2,0.45)">2048</text>
    <text x="340" y="626" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
          font-size="78" font-weight="900" fill="#ffffff" filter="url(#softGlow)">2048</text>

    <!-- Pulse ring -->
    <rect x="187" y="453" width="306" height="306" rx="26" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3"/>

    <!-- merge chevrons pointing in toward the core -->
    <g fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" opacity="0.4">
      <path d="M333,443 L340,450 L347,443"/>
      <path d="M333,776 L340,769 L347,776"/>
      <path d="M180,599 L187,606 L180,613"/>
      <path d="M500,599 L493,606 L500,613"/>
    </g>
  </g>
</svg>
