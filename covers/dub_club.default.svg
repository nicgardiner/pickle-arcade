<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <linearGradient id="dcWall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a1226"/>
    <stop offset="0.42" stop-color="#1d0c18"/>
    <stop offset="1" stop-color="#07050a"/>
  </linearGradient>
  <radialGradient id="dcWarm" cx="50%" cy="58%" r="62%">
    <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.30"/>
    <stop offset="0.55" stop-color="#c4304a" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#c4304a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="dcFloor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a0d16"/>
    <stop offset="1" stop-color="#060409"/>
  </linearGradient>

  <linearGradient id="dcTitle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3cf"/>
    <stop offset="0.48" stop-color="#ffc247"/>
    <stop offset="1" stop-color="#ff7a2f"/>
  </linearGradient>

  <linearGradient id="dcMetal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#525b6b"/>
    <stop offset="0.16" stop-color="#aab3c2"/>
    <stop offset="0.36" stop-color="#eef2f7"/>
    <stop offset="0.58" stop-color="#b9c1cf"/>
    <stop offset="0.82" stop-color="#6b7484"/>
    <stop offset="1" stop-color="#3b424f"/>
  </linearGradient>
  <linearGradient id="dcGrille" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#232a36"/>
    <stop offset="0.2" stop-color="#59647a"/>
    <stop offset="0.42" stop-color="#8b98ad"/>
    <stop offset="0.62" stop-color="#4d5769"/>
    <stop offset="0.85" stop-color="#232a36"/>
    <stop offset="1" stop-color="#161b24"/>
  </linearGradient>
  <linearGradient id="dcRing" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3f4653"/>
    <stop offset="0.3" stop-color="#c9d2de"/>
    <stop offset="0.62" stop-color="#7a8494"/>
    <stop offset="1" stop-color="#2d333d"/>
  </linearGradient>
  <linearGradient id="dcOnAir" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff6b5e"/>
    <stop offset="0.45" stop-color="#ff2438"/>
    <stop offset="1" stop-color="#a5091f"/>
  </linearGradient>
  <linearGradient id="dcWave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffc247"/>
    <stop offset="0.5" stop-color="#ff7a2f"/>
    <stop offset="1" stop-color="#ff3d6b"/>
  </linearGradient>

  <pattern id="dcMesh" width="9" height="9" patternUnits="userSpaceOnUse">
    <circle cx="2.2" cy="2.2" r="1.15" fill="#0b0e14" opacity="0.55"/>
    <circle cx="6.7" cy="6.7" r="1.15" fill="#0b0e14" opacity="0.55"/>
  </pattern>

  <filter id="dcTitleGlow" x="-30%" y="-70%" width="160%" height="240%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="dcRedGlow" x="-60%" y="-90%" width="220%" height="280%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="dcSoft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
  </filter>

  <clipPath id="dcGrilleClip">
    <path d="M340 486c30 0 52 22 52 50v96c0 28-22 50-52 50s-52-22-52-50v-96c0-28 22-50 52-50z"/>
  </clipPath>
</defs>

<!-- 1. studio wall + floor -->
<rect width="680" height="1020" fill="url(#dcWall)"/>
<rect y="838" width="680" height="182" fill="url(#dcFloor)"/>
<rect width="680" height="1020" fill="url(#dcWarm)"/>

<!-- acoustic foam wedges -->
<g opacity="0.09">
  <g fill="#ffe6d5">
    <path d="M0 300l34 34-34 34z"/><path d="M68 300l34 34-34 34z"/><path d="M136 300l34 34-34 34z"/>
    <path d="M204 300l34 34-34 34z"/><path d="M272 300l34 34-34 34z"/><path d="M340 300l34 34-34 34z"/>
    <path d="M408 300l34 34-34 34z"/><path d="M476 300l34 34-34 34z"/><path d="M544 300l34 34-34 34z"/>
    <path d="M612 300l34 34-34 34z"/>
    <path d="M34 368l34 34-34 34z"/><path d="M102 368l34 34-34 34z"/><path d="M170 368l34 34-34 34z"/>
    <path d="M238 368l34 34-34 34z"/><path d="M306 368l34 34-34 34z"/><path d="M374 368l34 34-34 34z"/>
    <path d="M442 368l34 34-34 34z"/><path d="M510 368l34 34-34 34z"/><path d="M578 368l34 34-34 34z"/>
    <path d="M0 436l34 34-34 34z"/><path d="M68 436l34 34-34 34z"/><path d="M136 436l34 34-34 34z"/>
    <path d="M476 436l34 34-34 34z"/><path d="M544 436l34 34-34 34z"/><path d="M612 436l34 34-34 34z"/>
    <path d="M34 504l34 34-34 34z"/><path d="M102 504l34 34-34 34z"/>
    <path d="M510 504l34 34-34 34z"/><path d="M578 504l34 34-34 34z"/>
    <path d="M0 572l34 34-34 34z"/><path d="M68 572l34 34-34 34z"/>
    <path d="M544 572l34 34-34 34z"/><path d="M612 572l34 34-34 34z"/>
    <path d="M34 640l34 34-34 34z"/><path d="M578 640l34 34-34 34z"/>
    <path d="M0 708l34 34-34 34z"/><path d="M612 708l34 34-34 34z"/>
  </g>
</g>
<line x1="0" y1="838" x2="680" y2="838" stroke="#ff9a5a" stroke-width="1.2" opacity="0.22"/>

<!-- 2. title -->
<text x="343" y="141" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="82" letter-spacing="6" fill="#2a0a10" opacity="0.75">DUB CLUB</text>
<text x="340" y="137" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="82" letter-spacing="6" fill="url(#dcTitle)" filter="url(#dcTitleGlow)">DUB CLUB</text>
<g opacity="0.55">
  <rect x="86" y="163" width="180" height="1.6" fill="#ffb347"/>
  <rect x="414" y="163" width="180" height="1.6" fill="#ffb347"/>
</g>
<text x="340" y="199" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
      font-size="28" font-weight="700" letter-spacing="7" fill="#ffcf9a" opacity="0.88">YOU BRING THE VOICE</text>

<!-- 3. ON AIR sign -->
<g transform="translate(0,-6)">
  <line x1="264" y1="196" x2="264" y2="228" stroke="#5a2430" stroke-width="3"/>
  <line x1="416" y1="196" x2="416" y2="228" stroke="#5a2430" stroke-width="3"/>
  <ellipse cx="340" cy="298" rx="190" ry="52" fill="#ff2438" opacity="0.16" filter="url(#dcSoft)"/>
  <rect x="196" y="226" width="288" height="92" rx="14" fill="#170a10" stroke="#6d2531" stroke-width="3"/>
  <rect x="209" y="239" width="262" height="66" rx="9" fill="url(#dcOnAir)" filter="url(#dcRedGlow)"/>
  <rect x="209" y="239" width="262" height="30" rx="9" fill="#ffffff" opacity="0.16"/>
  <text x="340" y="284" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
        font-weight="900" font-size="40" letter-spacing="9" fill="#fff3ec">ON AIR</text>
</g>

<!-- 4. microphone on shock mount -->
<ellipse cx="352" cy="862" rx="132" ry="24" fill="#000" opacity="0.45"/>

<!-- stand column + base -->
<g>
  <rect x="330" y="700" width="20" height="150" rx="6" fill="url(#dcMetal)"/>
  <rect x="316" y="694" width="48" height="18" rx="7" fill="#2f3742"/>
  <ellipse cx="340" cy="852" rx="96" ry="21" fill="#242b36"/>
  <ellipse cx="340" cy="846" rx="96" ry="21" fill="url(#dcMetal)"/>
  <ellipse cx="340" cy="843" rx="62" ry="13" fill="#1c222b" opacity="0.5"/>
</g>

<!-- shock-mount ring + elastic suspension -->
<g>
  <ellipse cx="340" cy="612" rx="142" ry="158" fill="none" stroke="url(#dcRing)" stroke-width="13"/>
  <ellipse cx="340" cy="612" rx="142" ry="158" fill="none" stroke="#0a0d13" stroke-width="2" opacity="0.5"/>
  <g stroke="#e8b06a" stroke-width="3.2" opacity="0.85" fill="none">
    <path d="M200 570l88 -14"/><path d="M200 654l88 14"/>
    <path d="M480 570l-88 -14"/><path d="M480 654l-88 14"/>
    <path d="M232 494l60 44"/><path d="M448 494l-60 44"/>
    <path d="M232 730l60 -44"/><path d="M448 730l-60 -44"/>
  </g>
</g>

<!-- mic body -->
<g>
  <!-- grille head -->
  <path d="M340 486c30 0 52 22 52 50v96c0 28-22 50-52 50s-52-22-52-50v-96c0-28 22-50 52-50z" fill="url(#dcGrille)"/>
  <g clip-path="url(#dcGrilleClip)">
    <rect x="286" y="484" width="108" height="200" fill="url(#dcMesh)"/>
    <rect x="300" y="484" width="16" height="200" fill="#ffffff" opacity="0.13"/>
    <rect x="368" y="484" width="9" height="200" fill="#000000" opacity="0.22"/>
  </g>
  <path d="M340 486c30 0 52 22 52 50v96c0 28-22 50-52 50s-52-22-52-50v-96c0-28 22-50 52-50z"
        fill="none" stroke="#0b0f16" stroke-width="3"/>
  <!-- collar -->
  <rect x="284" y="678" width="112" height="18" rx="7" fill="url(#dcMetal)"/>
  <rect x="284" y="678" width="112" height="6" rx="3" fill="#ffffff" opacity="0.28"/>
  <!-- lower body -->
  <path d="M296 694h88v42c0 12-10 20-24 20h-40c-14 0-24-8-24-20z" fill="url(#dcMetal)"/>
  <rect x="309" y="704" width="62" height="4" rx="2" fill="#0b0f16" opacity="0.35"/>
  <circle cx="340" cy="726" r="7" fill="#ff2438"/>
  <circle cx="340" cy="726" r="12" fill="#ff2438" opacity="0.35" filter="url(#dcSoft)"/>
  <!-- yoke arms into the ring -->
  <path d="M288 620h-40" stroke="url(#dcRing)" stroke-width="9" stroke-linecap="round"/>
  <path d="M392 620h40" stroke="url(#dcRing)" stroke-width="9" stroke-linecap="round"/>
</g>

<!-- cable -->
<path d="M340 756c0 40 84 44 128 62 44 18 90 44 118 78" fill="none" stroke="#14181f" stroke-width="9" stroke-linecap="round"/>
<path d="M340 756c0 40 84 44 128 62 44 18 90 44 118 78" fill="none" stroke="#39414f" stroke-width="4" stroke-linecap="round"/>

<!-- 5. clapperboard -->
<g transform="translate(146,824) rotate(-11) scale(0.88)">
  <rect x="-92" y="-6" width="196" height="112" rx="9" fill="#0d1016" opacity="0.55"/>
  <rect x="-96" y="-10" width="196" height="112" rx="9" fill="#171b23" stroke="#39414f" stroke-width="2"/>
  <g transform="translate(-96,-52) rotate(-15)">
    <rect x="0" y="0" width="196" height="34" rx="6" fill="#12161d" stroke="#39414f" stroke-width="2"/>
    <g fill="#eef2f7">
      <path d="M8 2l24 0-18 30-24 0z"/><path d="M56 2l24 0-18 30-24 0z"/>
      <path d="M104 2l24 0-18 30-24 0z"/><path d="M152 2l24 0-18 30-24 0z"/>
    </g>
  </g>
  <g fill="#8c97a8" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700">
    <text x="-78" y="22">SCENE 1</text>
    <text x="-78" y="48">TAKE 1</text>
    <text x="-78" y="74">DUB CLUB</text>
  </g>
  <g stroke="#39414f" stroke-width="1.4" opacity="0.7">
    <line x1="-82" y1="30" x2="88" y2="30"/><line x1="-82" y1="56" x2="88" y2="56"/>
  </g>
</g>

