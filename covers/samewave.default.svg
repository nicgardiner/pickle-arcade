<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#12031f"/>
    <stop offset="0.32" stop-color="#2d0c4e"/>
    <stop offset="0.5" stop-color="#6d1663"/>
    <stop offset="0.55" stop-color="#a1236e"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22093a"/>
    <stop offset="1" stop-color="#0c0214"/>
  </linearGradient>
  <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd66e"/>
    <stop offset="0.45" stop-color="#ffb62e"/>
    <stop offset="1" stop-color="#ff2e88"/>
  </linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e0ff"/>
    <stop offset="0.55" stop-color="#9d7bff"/>
    <stop offset="1" stop-color="#ff5fa8"/>
  </linearGradient>
  <radialGradient id="wedge4" cx="50%" cy="20%" r="90%">
    <stop offset="0" stop-color="#ffe08a"/>
    <stop offset="1" stop-color="#ffb62e"/>
  </radialGradient>
  <radialGradient id="panelShade" cx="50%" cy="30%" r="80%">
    <stop offset="0" stop-color="#241040"/>
    <stop offset="1" stop-color="#0e0420"/>
  </radialGradient>
  <radialGradient id="hubShine" cx="36%" cy="30%" r="70%">
    <stop offset="0" stop-color="#fdf3ff"/>
    <stop offset="0.5" stop-color="#c8b4e8"/>
    <stop offset="1" stop-color="#5d3f79"/>
  </radialGradient>
  <linearGradient id="needleGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff9ec7"/>
    <stop offset="1" stop-color="#ff2e88"/>
  </linearGradient>
  <filter id="titleGlow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sunGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="skyClip"><rect x="0" y="0" width="680" height="560"/></clipPath>
  <clipPath id="sunClip"><circle cx="340" cy="520" r="190"/></clipPath>
</defs>

