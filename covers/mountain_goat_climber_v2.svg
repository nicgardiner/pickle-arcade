<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <linearGradient id="mgiSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e2a"/>
    <stop offset="0.26" stop-color="#16305a"/>
    <stop offset="0.52" stop-color="#2f5d86"/>
    <stop offset="0.76" stop-color="#4e7d8f"/>
    <stop offset="1" stop-color="#3a5a46"/>
  </linearGradient>
  <linearGradient id="mgiMassif" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5c7089"/>
    <stop offset="0.5" stop-color="#3c4c60"/>
    <stop offset="1" stop-color="#1e2833"/>
  </linearGradient>
  <linearGradient id="mgiVign" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a140c" stop-opacity="0"/>
    <stop offset="1" stop-color="#0a140c" stop-opacity="0.85"/>
  </linearGradient>
  <filter id="mgiGlow" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="mgiSoft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <filter id="mgiGlowSoft" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- 1. sky -->
<rect width="680" height="1020" fill="url(#mgiSky)"/>

<!-- 2. stars + moon (Peak zone) -->
<g fill="#ffffff">
  <circle cx="60" cy="215" r="1.8" opacity="0.9"/><circle cx="140" cy="250" r="1.3" opacity="0.6"/>
  <circle cx="215" cy="205" r="1.6" opacity="0.8"/><circle cx="300" cy="235" r="1.2" opacity="0.55"/>
  <circle cx="390" cy="200" r="1.8" opacity="0.85"/><circle cx="455" cy="245" r="1.3" opacity="0.6"/>
  <circle cx="520" cy="205" r="1.5" opacity="0.75"/><circle cx="640" cy="250" r="1.4" opacity="0.6"/>
  <circle cx="100" cy="300" r="1.4" opacity="0.5"/><circle cx="620" cy="320" r="1.4" opacity="0.5"/>
  <circle cx="35" cy="360" r="1.2" opacity="0.4"/><circle cx="655" cy="410" r="1.2" opacity="0.4"/>
</g>
<circle cx="588" cy="232" r="30" fill="#f5f0dc" opacity="0.16" filter="url(#mgiSoft)"/>
<circle cx="588" cy="232" r="21" fill="#f2ecd4" opacity="0.95"/>
<circle cx="581" cy="226" r="4.5" fill="#ddd6ba" opacity="0.8"/>
<circle cx="594" cy="238" r="3" fill="#ddd6ba" opacity="0.7"/>

<!-- 3. far misty ridge -->
<polygon points="0,1020 0,585 110,480 235,555 355,470 495,545 590,485 680,540 680,1020"
         fill="#41607d" opacity="0.55"/>

<!-- 4. main massif with snow cap -->
<polygon points="0,1020 30,790 170,540 300,335 345,258 405,345 520,570 625,760 680,870 680,1020"
         fill="url(#mgiMassif)"/>
<polygon points="300,335 345,258 405,345 385,368 362,340 336,372 316,346" fill="#eef6fb"/>
<polygon points="336,372 362,340 372,392 350,410" fill="#dcebf4" opacity="0.8"/>
<!-- ridge shading -->
<polygon points="345,258 405,345 520,570 625,760 680,870 680,1020 470,1020 420,700 360,430" fill="#161f29" opacity="0.4"/>

<!-- 5. storm band: clouds + lightning -->
<g fill="#252f44">
  <ellipse cx="120" cy="395" rx="95" ry="30"/><ellipse cx="55" cy="410" rx="70" ry="26"/>
  <ellipse cx="185" cy="412" rx="60" ry="22"/>
  <ellipse cx="565" cy="352" rx="90" ry="28"/><ellipse cx="635" cy="370" rx="70" ry="24"/>
  <ellipse cx="505" cy="368" rx="55" ry="20"/>
</g>
<polygon points="560,372 528,442 549,438 512,512 552,452 532,455 566,394"
         fill="#ffe86b" filter="url(#mgiGlow)"/>

<!-- 6. platforms (floating climbing route) -->
<!-- A: meadow grass ledge, low left -->
<g>
  <ellipse cx="190" cy="852" rx="88" ry="12" fill="#000" opacity="0.3" filter="url(#mgiSoft)"/>
  <rect x="105" y="806" width="170" height="28" rx="7" fill="#6b5540"/>
  <rect x="105" y="806" width="170" height="10" rx="5" fill="#61a84e"/>
  <polygon points="128,806 133,795 138,806" fill="#61a84e"/>
  <polygon points="238,806 243,794 248,806" fill="#61a84e"/>
</g>
<!-- B: stone ledge, mid right -->
<g>
  <ellipse cx="490" cy="742" rx="76" ry="10" fill="#000" opacity="0.3" filter="url(#mgiSoft)"/>
  <rect x="418" y="700" width="145" height="26" rx="6" fill="#5d6672"/>
  <rect x="418" y="700" width="145" height="9" rx="4" fill="#99a3b0"/>
</g>
<!-- C: icy ledge, upper left (landing target) -->
<g>
  <ellipse cx="205" cy="596" rx="70" ry="9" fill="#000" opacity="0.3" filter="url(#mgiSoft)"/>
  <rect x="138" y="556" width="132" height="24" rx="6" fill="#5d88a8"/>
  <rect x="138" y="556" width="132" height="9" rx="4" fill="#cfeeff"/>
  <polygon points="160,580 166,600 172,580" fill="#bfe4f7"/>
  <polygon points="222,580 227,596 232,580" fill="#bfe4f7"/>
</g>
<!-- D: small stone step near summit -->
<rect x="426" y="472" width="92" height="18" rx="5" fill="#5d6672"/>
<rect x="426" y="472" width="92" height="7" rx="3" fill="#8f99a6"/>

<!-- 7. one coin waiting on the icy ledge -->
<g transform="translate(204,536)"><circle r="15" fill="#f5c518" stroke="#b8860b" stroke-width="3"/><circle r="7" fill="#ffe98a"/></g>

<!-- 8. the goat: actual in-game pixel sprite, springing upward -->
<g transform="translate(340,655) rotate(-12) scale(6.4,6.4)">
  <!-- launch streaks below: he's going up -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.4" stroke-linecap="round">
    <line x1="-6" y1="23" x2="-8" y2="35"/>
    <line x1="2" y1="25" x2="2" y2="37"/>
  </g>
  <rect x="-13" y="-5" width="5" height="5" fill="#f0f0e8"/>
  <rect x="-12" y="-8" width="24" height="14" fill="#f0f0e8"/>
  <rect x="8" y="-16" width="14" height="12" fill="#f0f0e8"/>
  <rect x="10" y="-20" width="3" height="6" fill="#c8a060"/>
  <rect x="14" y="-22" width="3" height="7" fill="#c8a060"/>
  <rect x="8" y="-17" width="4" height="4" fill="#f0c0a0"/>
  <rect x="18" y="-14" width="2" height="2" fill="#222"/>
  <rect x="20" y="-10" width="3" height="2" fill="#ffaaaa"/>
  <rect x="18" y="-6" width="5" height="6" fill="#ddd8c0"/>
  <rect x="-10" y="4" width="5" height="12" fill="#e0e0d8"/>
  <rect x="-3" y="4" width="5" height="4" fill="#e0e0d8"/>
  <rect x="4" y="4" width="5" height="12" fill="#e0e0d8"/>
  <rect x="11" y="4" width="5" height="4" fill="#e0e0d8"/>
  <rect x="-10" y="15" width="5" height="3" fill="#555"/>
  <rect x="-3" y="7" width="5" height="3" fill="#555"/>
  <rect x="4" y="15" width="5" height="3" fill="#555"/>
  <rect x="11" y="7" width="5" height="3" fill="#555"/>
</g>

<!-- 9. title -->
<text x="343" y="116" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
      font-size="60" letter-spacing="3" fill="rgba(0,0,0,0.5)">MOUNTAIN GOAT</text>
<text x="340" y="112" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
      font-size="60" letter-spacing="3" fill="#eafff2" filter="url(#mgiGlow)">MOUNTAIN GOAT</text>
<text x="343" y="180" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
      font-size="56" textLength="367" lengthAdjust="spacingAndGlyphs" fill="rgba(0,0,0,0.5)">CLIMBER</text>
<text x="340" y="177" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
      font-size="56" textLength="367" lengthAdjust="spacingAndGlyphs" fill="#9fd8a8" filter="url(#mgiGlowSoft)">CLIMBER</text>

<!-- 10. bottom vignette -->
<rect x="0" y="880" width="680" height="140" fill="url(#mgiVign)"/>
</svg>
