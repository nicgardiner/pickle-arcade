<svg width="400" height="600" viewBox="0 0 680 1020" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
<linearGradient id="gbusybyways" x1="0.933" y1="0.25" x2="0.067" y2="0.75">
<stop offset="0" stop-color="#f0b97e"/><stop offset="0.5" stop-color="#6d5f86"/><stop offset="1" stop-color="#1d1a28"/>
</linearGradient>
<filter id="bbSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
<!-- The four arms. Each stops at the ring's centre line so its round cap lands exactly
     inside the ring band — edge pass then surface pass, so nothing borders a junction. -->
<g id="bbArms" fill="none" stroke-linecap="round">
  <path d="M152 655 L245 655"/>
  <path d="M528 655 L435 655"/>
  <path d="M340 467 L340 560"/>
  <path d="M340 843 L340 750"/>
</g>
</defs>
<rect width="680" height="1020" fill="url(#gbusybyways)"/>
<rect x="0" y="0" width="680" height="148" fill="rgba(0,0,0,0.34)"/>
<line x1="0" y1="148" x2="680" y2="148" stroke="#ffeccc" stroke-width="1.2"/>
<rect x="48" y="100" width="202" height="1.5" fill="#ffeccc" opacity="0.5"/>
<rect x="430" y="100" width="202" height="1.5" fill="#ffeccc" opacity="0.5"/>
<text x="343" y="135" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="54" fill="rgba(0,0,0,0.45)" letter-spacing="4">BUSY BYWAYS</text>
<text x="340" y="132" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif"
      font-weight="900" font-size="54" fill="#ffeccc" letter-spacing="4">BUSY BYWAYS</text>

<!-- a roundabout, straight out of the game: white road ring, open centre, three colour-coded cars -->
<g>
  <ellipse cx="344" cy="838" rx="176" ry="26" fill="#000" opacity="0.34" filter="url(#bbSoft)"/>
  <!-- edge pass: everything wearing its outline at once -->
  <use xlink:href="#bbArms" href="#bbArms" stroke="#2f2c27" stroke-width="66"/>
  <circle cx="340" cy="655" r="95" fill="none" stroke="#2f2c27" stroke-width="66"/>
  <!-- surface pass: the ring last, so the arms lose their borders where they meet it -->
  <use xlink:href="#bbArms" href="#bbArms" stroke="#fdfcf8" stroke-width="56"/>
  <circle cx="340" cy="655" r="95" fill="none" stroke="#fdfcf8" stroke-width="56"/>
  <!-- lane dashes at the open ends of the four arms -->
  <g stroke="#cfc6b2" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="655" x2="180" y2="655"/><line x1="484" y1="655" x2="518" y2="655"/>
    <line x1="340" y1="473" x2="340" y2="495"/><line x1="340" y1="799" x2="340" y2="833"/>
  </g>
  <!-- cars: body, darker cabin, dark outline — the same read as the game's sprites -->
  <g stroke="#26241f" stroke-width="4.5" stroke-linejoin="round">
    <g transform="translate(340 528) rotate(90) scale(1.15)">
      <rect x="-23" y="-14" width="46" height="28" rx="8" fill="#e94f4f"/>
      <rect x="-8" y="-10" width="17" height="20" rx="5" fill="#a6322f" stroke="none"/>
    </g>
    <g transform="translate(435 655) rotate(90) scale(1.15)">
      <rect x="-23" y="-14" width="46" height="28" rx="8" fill="#3f7fe0"/>
      <rect x="-8" y="-10" width="17" height="20" rx="5" fill="#2a559b" stroke="none"/>
    </g>
    <g transform="translate(205 655) scale(1.15)">
      <rect x="-23" y="-14" width="46" height="28" rx="8" fill="#f2c33c"/>
      <rect x="-8" y="-10" width="17" height="20" rx="5" fill="#b98c1c" stroke="none"/>
    </g>
  </g>
</g>

<rect x="0" y="988" width="680" height="32" fill="rgba(0,0,0,0.34)"/>
<line x1="0" y1="988" x2="680" y2="988" stroke="#ffeccc" stroke-width="0.8" opacity="0.3"/>
</svg>
