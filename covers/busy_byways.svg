<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 680 1020" width="400" height="600">
<defs>
  <linearGradient id="bbPaper" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#f8f2e5"/><stop offset="0.55" stop-color="#efe6d2"/><stop offset="1" stop-color="#e2d6ba"/>
  </linearGradient>
  <pattern id="bbGrid" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="17" cy="17" r="2.1" fill="#d8cdb4"/>
  </pattern>
  <linearGradient id="bbWater" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#cfe6ef"/><stop offset="1" stop-color="#a8cadd"/>
  </linearGradient>
  <filter id="bbDrop" x="-30%" y="-30%" width="170%" height="170%">
    <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5c5344" flood-opacity="0.24"/>
  </filter>
  <filter id="bbBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  <radialGradient id="bbVig" cx="50%" cy="46%" r="72%">
    <stop offset="0.55" stop-color="#7a6a4c" stop-opacity="0"/><stop offset="1" stop-color="#6b5b3f" stop-opacity="0.3"/>
  </radialGradient>

  <!-- The lake, reused as the bridge clip so the planks only show over water. -->
  <path id="bbLake" d="M84 622 C60 700 96 766 172 772 C252 782 308 742 304 682 C300 618 250 574 184 584 C132 591 96 588 84 622 Z"/>
  <clipPath id="bbLakeClip"><use xlink:href="#bbLake" href="#bbLake"/></clipPath>

  <!-- Every road is ONE stroked network drawn twice (edge pass, then surface pass), so
       junctions merge instead of showing each other's borders. All roads share a width. -->
  <g id="bbNet" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="bbRoadA" d="M248 236 C248 318 192 342 192 424 C192 506 262 528 262 606 C262 684 228 710 228 790 C228 878 300 900 300 1012"/>
    <path d="M-20 424 C80 424 130 456 232 456 C336 456 380 396 470 396 C552 396 606 420 700 416"/>
    <path d="M-20 946 C90 946 168 938 232 890 C296 842 330 786 396 742 C452 704 520 690 700 686"/>
    <path d="M-20 796 C110 796 150 806 236 806 C330 806 392 826 480 826 C560 826 620 812 700 808"/>
    <path d="M262 606 C338 606 386 578 396 524"/>
    <path d="M556 396 L556 476"/>
    <path d="M556 604 L556 690"/>
    <path d="M620 540 A64 64 0 1 1 492 540 A64 64 0 1 1 620 540"/>
    <!-- driveways: every building gets one. Each stops just short of its road's centre line so
         the round cap fills the road band without poking out the far side, and runs far enough
         the other way to finish underneath the building it serves. -->
    <path d="M386 407 L386 340"/>
    <path d="M596 822 L596 900"/>
    <path d="M83 432 L83 344"/>
    <path d="M629 410 L629 376"/>
    <path d="M127 448 L127 502"/>
    <path d="M363 820 L363 870"/>
    <path d="M132 930 L132 898"/>
  </g>
</defs>

<!-- paper ground + the game's faint dot grid -->
<rect width="680" height="1020" fill="url(#bbPaper)"/>
<rect width="680" height="1020" fill="url(#bbGrid)" opacity="0.75"/>

<!-- lake -->
<use xlink:href="#bbLake" href="#bbLake" fill="url(#bbWater)"/>

<!-- trees -->
<g fill="#b9d4a6">
  <circle cx="614" cy="742" r="16"/><circle cx="644" cy="716" r="10"/><circle cx="590" cy="718" r="8"/>
  <circle cx="60" cy="500" r="14"/><circle cx="86" cy="526" r="9"/><circle cx="40" cy="532" r="8"/>
  <circle cx="430" cy="960" r="15"/><circle cx="458" cy="938" r="9"/>
  <circle cx="146" cy="308" r="12"/><circle cx="172" cy="284" r="8"/>
  <circle cx="352" cy="676" r="11"/><circle cx="330" cy="652" r="7"/>
  <circle cx="524" cy="300" r="10"/><circle cx="500" cy="322" r="7"/>
  <circle cx="44" cy="892" r="12"/><circle cx="66" cy="908" r="8"/>
</g>

<!-- roads: edge pass, then the surface pass over it -->
<use xlink:href="#bbNet" href="#bbNet" stroke="#d9d2c2" stroke-width="48"/>
<use xlink:href="#bbNet" href="#bbNet" stroke="#fdfcf8" stroke-width="40"/>
<!-- bridge planks: the avenue re-stroked as dashes, clipped to the water -->
<g clip-path="url(#bbLakeClip)">
  <use xlink:href="#bbRoadA" href="#bbRoadA" fill="none" stroke="#ded5c2" stroke-width="30" stroke-dasharray="4 22"/>
</g>

<!-- warehouses (2x2, pin slots along the top) and houses, in the game's own colours -->
<g filter="url(#bbDrop)">
  <!-- red warehouse, its fail ring already burning -->
  <g>
    <rect x="330" y="240" width="112" height="112" rx="22" fill="#e94f4f"/>
    <rect x="340" y="250" width="92" height="46" rx="14" fill="#c23f40"/>
    <g fill="#3d3a34">
      <rect x="350" y="260" width="12" height="12" rx="3.5"/><rect x="368" y="260" width="12" height="12" rx="3.5"/>
      <rect x="386" y="260" width="12" height="12" rx="3.5"/><rect x="404" y="260" width="12" height="12" rx="3.5"/>
    </g>
    <g fill="#3d3a34" opacity="0.18">
      <rect x="350" y="278" width="12" height="12" rx="3.5"/><rect x="368" y="278" width="12" height="12" rx="3.5"/>
    </g>
    <rect x="324" y="286" width="12" height="24" rx="4" fill="#a53434"/>
  </g>
  <!-- green warehouse -->
  <g>
    <rect x="540" y="880" width="112" height="112" rx="22" fill="#48b46f"/>
    <rect x="550" y="890" width="92" height="46" rx="14" fill="#35915a"/>
    <g fill="#3d3a34">
      <rect x="560" y="900" width="12" height="12" rx="3.5"/><rect x="578" y="900" width="12" height="12" rx="3.5"/>
    </g>
    <g fill="#3d3a34" opacity="0.18">
      <rect x="596" y="900" width="12" height="12" rx="3.5"/><rect x="614" y="900" width="12" height="12" rx="3.5"/>
    </g>
    <rect x="546" y="874" width="24" height="12" rx="4" fill="#2c7a4b"/>
  </g>
  <!-- houses -->
  <g>
    <rect x="598" y="310" width="62" height="62" rx="14" fill="#48b46f"/>
    <rect x="604" y="316" width="50" height="26" rx="9" fill="#35915a"/>
    <rect x="622" y="372" width="14" height="10" rx="3" fill="#2c7a4b"/>
  </g>
  <!-- purple house: squared up on the end of the middle spur, so the spur is its driveway -->
  <g transform="translate(401 486) rotate(-10.5)">
    <rect x="-31" y="-31" width="62" height="62" rx="14" fill="#9a5fd0"/>
    <rect x="-25" y="-25" width="50" height="26" rx="9" fill="#7742ab"/>
    <rect x="-7" y="29" width="14" height="10" rx="3" fill="#653791"/>
  </g>
  <g>
    <rect x="96" y="494" width="62" height="62" rx="14" fill="#f28a2e"/>
    <rect x="102" y="500" width="50" height="26" rx="9" fill="#cc6f1c"/>
    <rect x="120" y="484" width="14" height="10" rx="3" fill="#a85a15"/>
  </g>
  <g>
    <rect x="332" y="862" width="62" height="62" rx="14" fill="#3f7fe0"/>
    <rect x="338" y="868" width="50" height="26" rx="9" fill="#2f63b6"/>
    <rect x="356" y="852" width="14" height="10" rx="3" fill="#27508f"/>
  </g>
  <g>
    <rect x="101" y="828" width="62" height="62" rx="14" fill="#f2c33c"/>
    <rect x="107" y="834" width="50" height="26" rx="9" fill="#cfa021"/>
    <rect x="125" y="890" width="14" height="10" rx="3" fill="#a9811a"/>
  </g>
  <g>
    <rect x="52" y="266" width="62" height="62" rx="14" fill="#e94f4f"/>
    <rect x="58" y="272" width="50" height="26" rx="9" fill="#c23f40"/>
    <rect x="76" y="328" width="14" height="10" rx="3" fill="#a53434"/>
  </g>
</g>
<!-- the red warehouse's fail ring, most of the way round -->
<circle cx="386" cy="296" r="76" fill="none" stroke="#e2574f" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="306 172" transform="rotate(-90 386 296)" opacity="0.95"/>

<!-- traffic -->
<g stroke="#2f2c27" stroke-width="3.5" stroke-linejoin="round">
  <g transform="translate(194 398) rotate(96)">
    <rect x="-17" y="-11" width="34" height="22" rx="7" fill="#e94f4f"/>
    <rect x="-6" y="-8" width="13" height="16" rx="4" fill="#a6322f" stroke="none"/>
  </g>
  <g transform="translate(330 436) rotate(-22)">
    <rect x="-17" y="-11" width="34" height="22" rx="7" fill="#3f7fe0"/>
    <rect x="-6" y="-8" width="13" height="16" rx="4" fill="#2a559b" stroke="none"/>
  </g>
  <g transform="translate(556 448) rotate(90)">
    <rect x="-17" y="-11" width="34" height="22" rx="7" fill="#48b46f"/>
    <rect x="-6" y="-8" width="13" height="16" rx="4" fill="#2f7c4c" stroke="none"/>
  </g>
  <g transform="translate(414 821) rotate(6)">
    <rect x="-17" y="-11" width="34" height="22" rx="7" fill="#f28a2e"/>
    <rect x="-6" y="-8" width="13" height="16" rx="4" fill="#b8651a" stroke="none"/>
  </g>
  <g transform="translate(246 660) rotate(101)">
    <rect x="-17" y="-11" width="34" height="22" rx="7" fill="#9a5fd0"/>
    <rect x="-6" y="-8" width="13" height="16" rx="4" fill="#6f3ba1" stroke="none"/>
  </g>
  <g transform="translate(520 694) rotate(-6)">
    <rect x="-17" y="-11" width="34" height="22" rx="7" fill="#f2c33c"/>
    <rect x="-6" y="-8" width="13" height="16" rx="4" fill="#b98c1c" stroke="none"/>
  </g>
</g>

<rect width="680" height="1020" fill="url(#bbVig)"/>

<!-- title: the in-game wordmark — brand mark, mixed-case name, dashed road underline -->
<ellipse cx="340" cy="128" rx="336" ry="88" fill="#f9f4e8" opacity="0.8" filter="url(#bbBlur)"/>
<g transform="translate(44 82) scale(1.4583)">
  <rect x="2" y="2" width="44" height="44" rx="14" fill="#e94f4f"/>
  <path d="M10 34c8 0 8-20 16-20s6 20 12 20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M10 34c8 0 8-20 16-20s6 20 12 20" fill="none" stroke="#e94f4f" stroke-width="1.4" stroke-dasharray="2.5 3.5" stroke-linecap="round"/>
</g>
<text x="382" y="150" text-anchor="middle" textLength="508" lengthAdjust="spacing"
      font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"
      font-weight="800" font-size="92" letter-spacing="-3.7" fill="#3d3a34">Busy Byways</text>
<rect x="184" y="178" width="396" height="15" rx="7.5" fill="#3d3a34"/>
<line x1="190" y1="185.5" x2="574" y2="185.5" stroke="#fffdf9" stroke-width="5" stroke-dasharray="26 29"/>
</svg>
