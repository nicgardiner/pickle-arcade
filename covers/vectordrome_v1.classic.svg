<svg viewBox="0 0 680 1020" width="400" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ═══ BACKGROUND ═══ -->
    <linearGradient id="vdBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#04040f"/>
      <stop offset="42%"  stop-color="#080625"/>
      <stop offset="72%"  stop-color="#0c0730"/>
      <stop offset="100%" stop-color="#040311"/>
    </linearGradient>
    <radialGradient id="vdBore" gradientUnits="userSpaceOnUse" cx="352" cy="520" r="470">
      <stop offset="0%"   stop-color="#3be0ff" stop-opacity="0.34"/>
      <stop offset="35%"  stop-color="#2a6cd0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3be0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vdMagHaze" gradientUnits="userSpaceOnUse" cx="352" cy="690" r="300">
      <stop offset="0%"   stop-color="#ff4fd2" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff4fd2" stop-opacity="0"/>
    </radialGradient>

    <!-- ═══ TUNNEL DEPTH FALLOFF (dark toward the vanishing point) ═══ -->
    <radialGradient id="vdFadeGrad" gradientUnits="userSpaceOnUse" cx="352" cy="520" r="640">
      <stop offset="0%"    stop-color="#000000"/>
      <stop offset="12%"   stop-color="#1c1c1c"/>
      <stop offset="30%"   stop-color="#7c7c7c"/>
      <stop offset="58%"   stop-color="#dcdcdc"/>
      <stop offset="100%"  stop-color="#ffffff"/>
    </radialGradient>
    <mask id="vdRadialFade" maskUnits="userSpaceOnUse" x="-220" y="-220" width="1120" height="1460">
      <rect x="-220" y="-220" width="1120" height="1460" fill="url(#vdFadeGrad)"/>
    </mask>

    <!-- ═══ PORTAL / SUN ═══ -->
    <radialGradient id="vdVpGlow" gradientUnits="userSpaceOnUse" cx="352" cy="518" r="190">
      <stop offset="0%"   stop-color="#c9f6ff" stop-opacity="0.62"/>
      <stop offset="30%"  stop-color="#3be0ff" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#3be0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vdSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0b3e"/>
      <stop offset="60%"  stop-color="#240d4c"/>
      <stop offset="100%" stop-color="#120732"/>
    </linearGradient>
    <linearGradient id="vdSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f2ffff"/>
      <stop offset="24%"  stop-color="#8beeff"/>
      <stop offset="52%"  stop-color="#5fb8ff"/>
      <stop offset="76%"  stop-color="#ff6fd8"/>
      <stop offset="100%" stop-color="#ff2fb0"/>
    </linearGradient>
    <clipPath id="vdPortalClip"><circle cx="352" cy="520" r="96"/></clipPath>

    <!-- ═══ SHIP / TRAIL ═══ -->
    <linearGradient id="vdHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="30%"  stop-color="#a9f2ff"/>
      <stop offset="72%"  stop-color="#3be0ff"/>
      <stop offset="100%" stop-color="#0e8fc4"/>
    </linearGradient>
    <linearGradient id="vdTrail" gradientUnits="userSpaceOnUse" x1="298" y1="845" x2="254" y2="1104">
      <stop offset="0%"   stop-color="#5fe7ff" stop-opacity="0.88"/>
      <stop offset="28%"  stop-color="#31c8f5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1560c8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vdTrailCore" gradientUnits="userSpaceOnUse" x1="298" y1="845" x2="268" y2="1040">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#7fe8ff" stop-opacity="0"/>
    </linearGradient>

    <!-- ═══ TITLE ═══ -->
    <linearGradient id="vdTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="34%"  stop-color="#c9f7ff"/>
      <stop offset="56%"  stop-color="#3be0ff"/>
      <stop offset="78%"  stop-color="#159fd8"/>
      <stop offset="100%" stop-color="#8fecff"/>
    </linearGradient>
    <linearGradient id="vdTopVig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#04040f" stop-opacity="0.94"/>
      <stop offset="62%"  stop-color="#04040f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#04040f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vdBotVig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#040311" stop-opacity="0"/>
      <stop offset="58%"  stop-color="#040311" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#040311" stop-opacity="0.96"/>
    </linearGradient>

    <!-- ═══ GLOW FILTERS ═══ -->
    <filter id="vdTunnelGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vdGateGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vdShipGlow" x="-70%" y="-45%" width="240%" height="190%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vdSunGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vdSparkGlow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vdTitleGlow" x="-22%" y="-60%" width="144%" height="220%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="vdPage"><rect width="680" height="1020"/></clipPath>
  </defs>

  <g clip-path="url(#vdPage)">

    <!-- ══════ 1. BACKGROUND ══════ -->
    <rect width="680" height="1020" fill="url(#vdBg)"/>
    <rect width="680" height="1020" fill="url(#vdMagHaze)"/>
    <rect width="680" height="1020" fill="url(#vdBore)"/>

    <!-- ══════ 2. TUNNEL WIREFRAME ══════ -->
    <g filter="url(#vdTunnelGlow)">

      <!-- 16 longitudinal lines, alpha-faded into the depth by the radial mask -->
      <g mask="url(#vdRadialFade)" transform="rotate(6 352 520)"
         stroke="#3be0ff" stroke-linecap="round" opacity="0.62">
        <line x1="352" y1="520" x2="1112"   y2="520"    stroke-width="3.4"/>
        <line x1="352" y1="520" x2="1054.1" y2="810.8"  stroke-width="3.4"/>
        <line x1="352" y1="520" x2="889.4"  y2="1057.4" stroke-width="3.4"/>
        <line x1="352" y1="520" x2="642.8"  y2="1222.1" stroke-width="3.4"/>
        <line x1="352" y1="520" x2="352"    y2="1280"   stroke-width="3.4"/>
        <line x1="352" y1="520" x2="61.2"   y2="1222.1" stroke-width="3.4"/>
        <line x1="352" y1="520" x2="-185.4" y2="1057.4" stroke-width="3.4"/>
        <line x1="352" y1="520" x2="-350.1" y2="810.8"  stroke-width="3.4"/>
        <line x1="352" y1="520" x2="-408"   y2="520"    stroke-width="3.4"/>
        <line x1="352" y1="520" x2="-350.1" y2="229.2"  stroke-width="3.4"/>
        <line x1="352" y1="520" x2="-185.4" y2="-17.4"  stroke-width="3.4"/>
        <line x1="352" y1="520" x2="61.2"   y2="-182.1" stroke-width="3.4"/>
        <line x1="352" y1="520" x2="352"    y2="-240"   stroke-width="3.4"/>
        <line x1="352" y1="520" x2="642.8"  y2="-182.1" stroke-width="3.4"/>
        <line x1="352" y1="520" x2="889.4"  y2="-17.4"  stroke-width="3.4"/>
        <line x1="352" y1="520" x2="1054.1" y2="229.2"  stroke-width="3.4"/>
      </g>

      <!-- depth rings, back-to-front, fog falloff -->
      <g fill="none" stroke="#3be0ff">
        <circle cx="352" cy="520" r="620" stroke-width="5.4" opacity="0.60"/>
        <circle cx="352" cy="520" r="470" stroke-width="4.4" opacity="0.56"/>
        <circle cx="352" cy="520" r="357" stroke-width="3.6" opacity="0.50"/>
        <circle cx="352" cy="520" r="271" stroke-width="3.0" opacity="0.44"/>
        <circle cx="352" cy="520" r="206" stroke-width="2.4" opacity="0.38"/>
        <circle cx="352" cy="520" r="156" stroke-width="2.0" opacity="0.30"/>
      </g>
      <!-- far pulse-ring, telegraphing magenta out of the depth -->
      <circle cx="352" cy="520" r="124" fill="none" stroke="#ff4fd2" stroke-width="2.4" opacity="0.46"/>
    </g>

    <!-- ══════ 3. VANISHING POINT — sliced retro sun + grid horizon ══════ -->
    <circle cx="352" cy="518" r="190" fill="url(#vdVpGlow)"/>
    <circle cx="352" cy="520" r="97" fill="url(#vdSky)"/>
    <g clip-path="url(#vdPortalClip)">
      <!-- sun -->
      <g filter="url(#vdSunGlow)">
        <circle cx="352" cy="508" r="55" fill="url(#vdSun)"/>
      </g>
      <!-- horizontal slices cut through the sun -->
      <g fill="#1a0b3e">
        <rect x="256" y="514" width="192" height="2.6"/>
        <rect x="256" y="524" width="192" height="4"/>
        <rect x="256" y="535" width="192" height="5.6"/>
        <rect x="256" y="547" width="192" height="7.5"/>
      </g>
      <!-- ground plane below the horizon -->
      <rect x="256" y="553" width="192" height="70" fill="#120732"/>
      <!-- grid horizon -->
      <g stroke="#3be0ff" stroke-width="1.6" opacity="0.62">
        <line x1="256" y1="576" x2="448" y2="576"/>
        <line x1="256" y1="588" x2="448" y2="588"/>
        <line x1="256" y1="604" x2="448" y2="604"/>
      </g>
      <g stroke="#3be0ff" stroke-width="1.4" opacity="0.5">
        <line x1="352" y1="553" x2="286" y2="620"/>
        <line x1="352" y1="553" x2="322" y2="620"/>
        <line x1="352" y1="553" x2="352" y2="620"/>
        <line x1="352" y1="553" x2="382" y2="620"/>
        <line x1="352" y1="553" x2="418" y2="620"/>
      </g>
      <line x1="256" y1="553" x2="448" y2="553" stroke="#bff4ff" stroke-width="2.4" opacity="0.95"/>
    </g>
    <circle cx="352" cy="520" r="97" fill="none" stroke="#3be0ff" stroke-width="2.6" opacity="0.85"/>
    <circle cx="352" cy="520" r="103" fill="none" stroke="#3be0ff" stroke-width="1.2" opacity="0.35"/>

    <!-- ══════ 4. OBSTACLE — magenta arc gate with a glowing gap ══════ -->
    <g filter="url(#vdGateGlow)">
      <path d="M 226.21,693.13 A 214,214 0 1 1 418.13,723.53 L 398.97,664.56 A 152,152 0 1 0 262.66,642.97 Z"
            fill="#ff4fd2" fill-opacity="0.30" stroke="#ff4fd2" stroke-width="6" stroke-linejoin="round"/>
      <!-- hot white core stroke: lethal geometry -->
      <path d="M 226.21,693.13 A 214,214 0 1 1 418.13,723.53 L 398.97,664.56 A 152,152 0 1 0 262.66,642.97 Z"
            fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <!-- gap-edge telegraph caps -->
    <g filter="url(#vdSparkGlow)" stroke-linecap="round">
      <line x1="262.66" y1="642.97" x2="226.21" y2="693.13" stroke="#ffffff" stroke-width="4.5"/>
      <line x1="398.97" y1="664.56" x2="418.13" y2="723.53" stroke="#ffffff" stroke-width="4.5"/>
      <circle cx="244" cy="668" r="5.5" fill="#ffd9f4"/>
      <circle cx="408" cy="694" r="5.5" fill="#ffd9f4"/>
    </g>
    <!-- near-field gate fragment blowing past the camera -->
    <g filter="url(#vdGateGlow)" opacity="0.75">
      <path d="M -18.6,552.4 A 372,372 0 0 1 47.3,306.6 L 98.1,342.2 A 310,310 0 0 0 43.2,547.0 Z"
            fill="#ff4fd2" fill-opacity="0.28" stroke="#ff4fd2" stroke-width="5" stroke-linejoin="round"/>
      <path d="M -18.6,552.4 A 372,372 0 0 1 47.3,306.6 L 98.1,342.2 A 310,310 0 0 0 43.2,547.0 Z"
            fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" opacity="0.75"/>
    </g>

    <!-- ══════ 5. SHIP + LIGHT TRAIL ══════ -->
    <!-- trail (behind the ship, streaming toward the camera) -->
    <path d="M 327.6,850 Q 350,960 336.8,1118 L 171.2,1090 Q 250,955 268.4,840 Z"
          fill="url(#vdTrail)"/>
    <path d="M 315,848 Q 330,940 324,1046 L 260,1036 Q 294,940 294,843 Z"
          fill="url(#vdTrailCore)" opacity="0.34"/>

    <g filter="url(#vdShipGlow)" transform="translate(306,798) rotate(12) scale(1.4)">
      <!-- engine bloom, seen through the tail notch -->
      <ellipse cx="0" cy="20" rx="26" ry="11" fill="#3be0ff" opacity="0.6"/>
      <ellipse cx="0" cy="19" rx="13" ry="6"  fill="#f0feff" opacity="0.95"/>
      <!-- wedge hull -->
      <path d="M 0,-54 L 38,30 L 0,7 L -38,30 Z"
            fill="url(#vdHull)" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round"/>
      <!-- bright core -->
      <path d="M 0,-33 L 21,22 L 0,8 L -21,22 Z" fill="#f4ffff" opacity="0.92"/>
      <circle cx="0" cy="-12" r="5.5" fill="#ff4fd2" opacity="0.9"/>
    </g>

    <!-- ══════ 6. PARTICLES — motion streaks + near-miss sparks ══════ -->
    <g stroke="#9beeff" stroke-linecap="round" opacity="0.62">
      <line x1="70.1"  y1="417.4" x2="27.8"  y2="402.0" stroke-width="2.4"/>
      <line x1="577.2" y1="390.0" x2="620.5" y2="365.0" stroke-width="2.4"/>
      <line x1="634.9" y1="622.6" x2="676.2" y2="638.0" stroke-width="2.2"/>
      <line x1="283.6" y1="332.1" x2="271.6" y2="299.2" stroke-width="1.8"/>
      <line x1="125.4" y1="625.7" x2="89.2"  y2="642.6" stroke-width="2.4"/>
      <line x1="442.0" y1="364.1" x2="457.0" y2="338.1" stroke-width="1.8"/>
      <line x1="634.8" y1="802.8" x2="670.2" y2="838.2" stroke-width="2.8"/>
      <line x1="173.6" y1="855.5" x2="150.1" y2="899.6" stroke-width="2.8"/>
      <line x1="259.6" y1="401.8" x2="244.3" y2="382.1" stroke-width="1.5"/>
      <line x1="560.0" y1="549.2" x2="594.6" y2="554.1" stroke-width="2.0"/>
    </g>
    <g filter="url(#vdSparkGlow)">
      <circle cx="96"  cy="500" r="3.6" fill="#e8feff" opacity="0.85"/>
      <circle cx="596" cy="470" r="4.2" fill="#3be0ff" opacity="0.8"/>
      <circle cx="514" cy="836" r="4.6" fill="#ff4fd2" opacity="0.8"/>
      <circle cx="158" cy="742" r="3.4" fill="#3be0ff" opacity="0.7"/>
      <circle cx="640" cy="712" r="3.0" fill="#e8feff" opacity="0.6"/>
      <circle cx="238" cy="472" r="2.8" fill="#ff4fd2" opacity="0.6"/>
      <!-- near-miss spark burst at the lower gap edge -->
      <g fill="#ffffff">
        <circle cx="222" cy="706" r="3.2" opacity="0.9"/>
        <circle cx="209" cy="690" r="2.4" opacity="0.75"/>
        <circle cx="235" cy="716" r="2.0" opacity="0.7"/>
        <circle cx="203" cy="712" r="2.6" opacity="0.6"/>
      </g>
    </g>

    <!-- ══════ 7. VIGNETTES + TITLE ══════ -->
    <rect x="0" y="0"   width="680" height="272" fill="url(#vdTopVig)"/>
    <rect x="0" y="866" width="680" height="154" fill="url(#vdBotVig)"/>

    <!-- chromatic split copies -->
    <text x="346" y="133" text-anchor="middle" font-family="'Arial Black','Impact',Arial,sans-serif"
          font-size="58" font-weight="900" letter-spacing="3" fill="#ff4fd2" opacity="0.55">VECTORDROME</text>
    <text x="334" y="130" text-anchor="middle" font-family="'Arial Black','Impact',Arial,sans-serif"
          font-size="58" font-weight="900" letter-spacing="3" fill="#3be0ff" opacity="0.45">VECTORDROME</text>
    <!-- neon bloom -->
    <text x="340" y="130" text-anchor="middle" font-family="'Arial Black','Impact',Arial,sans-serif"
          font-size="58" font-weight="900" letter-spacing="3" fill="#3be0ff" opacity="0.7"
          filter="url(#vdTitleGlow)">VECTORDROME</text>
    <!-- solid face -->
    <text x="340" y="130" text-anchor="middle" font-family="'Arial Black','Impact',Arial,sans-serif"
          font-size="58" font-weight="900" letter-spacing="3" fill="url(#vdTitle)"
          stroke="#041426" stroke-width="4" stroke-linejoin="round" paint-order="stroke fill">VECTORDROME</text>

    <!-- rules + tagline -->
    <g stroke="#3be0ff" opacity="0.5">
      <line x1="120" y1="152" x2="270" y2="152" stroke-width="1.6"/>
      <line x1="410" y1="152" x2="560" y2="152" stroke-width="1.6"/>
    </g>
    <path d="M 340,146 l 8,6 -8,6 -8,-6 z" fill="#ff4fd2" opacity="0.8"/>
    <text x="340" y="182" text-anchor="middle" font-family="'Courier New',monospace" font-size="15"
          letter-spacing="7" fill="#3be0ff" opacity="0.62">ONE AXIS · INFINITE SPEED</text>

    <!-- footer -->
    <line x1="200" y1="962" x2="480" y2="962" stroke="#3be0ff" stroke-width="0.8" opacity="0.14"/>
    <text x="340" y="986" text-anchor="middle" font-family="'Courier New',monospace" font-size="11"
          letter-spacing="6" fill="#3be0ff" opacity="0.24">PICKLE GAME LIBRARY</text>

  </g>
</svg>
