        // arch body + dark mouth
        g.fillStyle = tone(D.portal); g.beginPath(); rr4(g, -0.06, -(RW / 2 + 0.1), 0.26, RW + 0.2, 0.03, 0.09, 0.09, 0.03); g.fill();
        g.fillStyle = tone(D.mouth); g.beginPath(); rr4(g, -0.02, -(RW / 2 - 0.03), 0.16, RW - 0.06, 0.02, 0.07, 0.07, 0.02); g.fill();
        g.restore();
      }

      // ------------------------------------------------------------ live: ripples, erase-outs, lights
      /** The ripple glyph (two arcs) as vector art around (0,0) — rendered once into the atlas. */
      function paintRipple(g) {
        g.strokeStyle = D.waterLight;
        g.lineWidth = 0.045;
        g.beginPath();
        g.moveTo(Math.cos(PI * 1.22) * 0.24, Math.sin(PI * 1.22) * 0.24);
        g.arc(0, 0, 0.24, PI * 1.22, PI * 1.78);
        g.moveTo(0.3 + Math.cos(PI * 1.25) * 0.17, 0.08 + Math.sin(PI * 1.25) * 0.17);
        g.arc(0.3, 0.08, 0.17, PI * 1.25, PI * 1.75);
        g.stroke();
      }
      /** Ripples drift every frame, so they are sprite blits (a stroked multi-arc path per frame
          was one more tessellation). */
      function drawRipples(s, vr) {
        const w = s.w, h = s.h, terr = s.terrain;
        const x0 = Math.max(0, Math.floor(vr.x0)), x1 = Math.min(w, Math.ceil(vr.x1));
        const y0 = Math.max(0, Math.floor(vr.y0)), y1 = Math.min(h, Math.ceil(vr.y1));
        let any = false;
        for (let y = y0; y < y1; y++) {
          for (let x = x0; x < x1; x++) {
            if (terr[y * w + x] !== T_WATER || hash(x, y, 3) > 0.12) continue;
            if (!any) { any = true; ctx.globalAlpha = 0.5 + 0.2 * Math.sin(tAnim * 0.7); }
            const ph = hash(x, y, 4) * PI2;
            const cx = x + 0.5 + Math.sin(tAnim * 0.33 + ph) * 0.2, cy = y + 0.5 + (hash(x, y, 5) - 0.5) * 0.5;
            blitSprite(ctx, 'rp', cx, cy, 1);
          }
        }
        if (!any) return;
        ctx.globalAlpha = 1;
      }

      function drawEraseOuts(tone) {
        const list = fx && fx.roadOut;
        if (!list || !list.length) return;
        const edge = tone(pal.roadEdge), road = tone(pal.road), deck = tone(D.bridgeDeck);
        for (let k = 0; k < list.length; k++) {
          const a = list[k];
          const sc = 1 - BW.Ease.outCubic(clamp01(a.t / 0.2));
          if (sc <= 0.01) continue;
          const cx = a.x + 0.5, cy = a.y + 0.5;
          ctx.save();
          ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
          ctx.globalAlpha = a.kind === K_TUNNEL ? 0.28 : 1;
          ctx.beginPath(); addSegs(ctx, a.x, a.y, a.mask);
          ctx.strokeStyle = edge; ctx.lineWidth = RW + 2 * EDGE; ctx.stroke();
          ctx.strokeStyle = a.kind === K_BRIDGE ? deck : road; ctx.lineWidth = RW; ctx.stroke();
          ctx.restore();
        }
      }

      function featureLists(s) {
        const rd = renderData(s);
        if (rd.featVersion === s.roadVersion && rd.featW === s.w) return rd;
        rd.featVersion = s.roadVersion; rd.featW = s.w;
        rd.lights.length = 0; rd.roundabouts.length = 0;
        const f = s.feature;
        if (f) for (let i = 0; i < f.length; i++) { if (f[i] === F_LIGHT) rd.lights.push(i); else if (f[i] === F_ROUNDABOUT) rd.roundabouts.push(i); }
        return rd;
      }

      function drawLights(s, vr, tone) {
        const rd = featureLists(s);
        if (!rd.lights.length) return;
        const phase = s.lights ? (s.lights.phase | 0) : 0;
        const green = tone('#5cc07c'), red = tone(FAIL_RED), box = tone(alpha(pal.ink, 0.85));
        const w = s.w;
        for (let k = 0; k < rd.lights.length; k++) {
          const i = rd.lights[k];
          const x = i % w, y = (i / w) | 0;
          if (x + 1 < vr.x0 || x > vr.x1 || y + 1 < vr.y0 || y > vr.y1) continue;
          const cx = x + 0.5, cy = y + 0.5, m = s.road[i];
          const pf = fx ? fx.pulseT('f' + i) : -1;
          const sc = pf < 0 ? 1 : 1 + 0.25 * BW.Ease.bump(pf);
          // stop bars across the inbound lane of every approach
          ctx.lineWidth = 0.06;
          for (let d = 0; d < 4; d++) {
            if (!(m & (1 << d))) continue;
            const ns = d === 0 || d === 2;
            const go = (phase === 0) === ns;
            const rx = DY[d], ry = -DX[d];        // right-hand side of a car entering from side d
            const bx = cx + DX[d] * 0.41 + rx * C.LANE_OFF, by = cy + DY[d] * 0.41 + ry * C.LANE_OFF;
            ctx.strokeStyle = go ? green : red;
            ctx.globalAlpha = go ? 0.55 : 0.85;
            ctx.beginPath(); ctx.moveTo(bx - rx * 0.13, by - ry * 0.13); ctx.lineTo(bx + rx * 0.13, by + ry * 0.13); ctx.stroke();
          }
          ctx.globalAlpha = 1;
          // signal box in the NE quadrant with N/S and E/W dots
          const bxs = cx + 0.33, bys = cy - 0.52;
          ctx.fillStyle = box;
          ctx.beginPath(); rr(ctx, bxs, bys, 0.24 * sc, 0.13 * sc, 0.035); ctx.fill();
          ctx.fillStyle = phase === 0 ? green : red;
          ctx.beginPath(); ctx.arc(bxs + 0.065 * sc, bys + 0.065 * sc, 0.032 * sc, 0, PI2); ctx.fill();
          ctx.fillStyle = phase === 1 ? green : red;
          ctx.beginPath(); ctx.arc(bxs + 0.175 * sc, bys + 0.065 * sc, 0.032 * sc, 0, PI2); ctx.fill();
        }
      }

      // ------------------------------------------------------------ buildings
      /** Spawn pop-in comes from the FX registry (real time, event-driven), not from bornT vs the
          sim clock: a frozen clock (t = 0, pause, harness) must still show every building. */
      function popScale(b) { return fx && fx.popScale ? fx.popScale(b.id) : 1; }
      function pulseScale(key, amp) {
        const p = fx ? fx.pulseT(key) : -1;
        return p < 0 ? 1 : 1 + amp * BW.Ease.bump(p);
      }

      /** Buildings are SPRITES (see the atlas below): shadow + body come from one drawImage each,
          the door glyph from a second, lit windows from an overlay drawn at globalAlpha = night.
          Driveways live in the road layer now. Only the dynamic bits (pin slots, fail ring) are
          still vector. */
      function drawBuildings(s, vr, night, warm) {
        const bs = s.buildings;
        if (!bs || !bs.length || debugSkip.bldBody) return;
        for (let k = 0; k < bs.length; k++) {
          const b = bs[k];
          if (!b) continue;
          const bw = b.w || 1, bh = b.h || 1;
          if (b.x + bw + 1.6 < vr.x0 || b.x - 1.6 > vr.x1 || b.y + bh + 1.6 < vr.y0 || b.y - 1.6 > vr.y1) continue;
          const sc = popScale(b) * pulseScale('b' + b.id, 0.07);
          const cx = b.x + bw / 2, cy = b.y + bh / 2, ci = b.color | 0;
          if (b.kind === 'dest') {
            // a warehouse that has just swallowed a car squashes and flashes its door
            const ra = reacts.size ? reacts.get(b.id) : undefined;
            if (ra !== undefined) {
              const k = BW.Ease.bump(ra / GT.react);
              ctx.save();
              ctx.translate(cx, cy + 0.9); ctx.scale(1 + 0.13 * k, 1 - 0.14 * k); ctx.translate(-cx, -(cy + 0.9));
              blitSprite(ctx, 'd:' + ci, cx, cy, sc);
              if (night > 0.01) { ctx.globalAlpha = night; blitSprite(ctx, 'dw', cx, cy, sc); ctx.globalAlpha = 1; }
              drawDoorFlash(b, cx, cy, ci, k);
              ctx.restore();
              drawDestExtras(b, sc, cx, cy);
              continue;
            }
            blitSprite(ctx, 'd:' + ci, cx, cy, sc);
            if (night > 0.01) { ctx.globalAlpha = night; blitSprite(ctx, 'dw', cx, cy, sc); ctx.globalAlpha = 1; }
            drawDestExtras(b, sc, cx, cy);
          } else {
            const big = (b.carCap || 1) >= 2 ? 1 : 0;
            const door = (b.door >= 0 && b.door < 4) ? b.door : 2;
            blitSprite(ctx, 'h:' + ci + ':' + big, cx, cy, sc);
            blitSprite(ctx, 'hd:' + ci + ':' + big + ':' + door, cx, cy, sc);
            if (night > 0.01) { ctx.globalAlpha = night; blitSprite(ctx, 'hw:' + big, cx, cy, sc); ctx.globalAlpha = 1; }
          }
        }
      }

      /** The apron on a building's `door` side — the one face its traffic connects through.
       *  Drawn whether or not a road has reached it, so the side to aim at is always readable.
       *
       *  Everything below works in the building's DOOR FRAME: origin at the building centre,
       *  +x pointing out through the door, +y across the face (90° clockwise from +x). The door
       *  side is `fw` tiles wide, so its border tiles sit at x = fw/2 + 0.5 and y = -(fw-1)/2 … +(fw-1)/2.
       */
      const DOOR_ANG = [-PI / 2, 0, PI / 2, PI];
      const FILLET = 0.12;          // kerb fillet radius where an apron flares into a road
      const DW_EDGE = 0.035;        // apron kerb line width

      /** Grid index of the door-side tile at across-coordinate `ly` (may sit past the face's
       *  corners, which is how the "does the road carry on past this run?" test works). -1 off-grid. */
      function doorSideTile(s, b, d, ly) {
        const bw = b.w || 1, bh = b.h || 1;
        const fw = (d === 0 || d === 2) ? bh : bw;
        const out = fw / 2 + 0.5;
        const wx = b.x + bw / 2 + DX[d] * out + (-DY[d]) * ly;
        const wy = b.y + bh / 2 + DY[d] * out + DX[d] * ly;
        const tx = Math.round(wx - 0.5), ty = Math.round(wy - 0.5);
        if (tx < 0 || ty < 0 || tx >= s.w || ty >= s.h) return -1;
        return ty * s.w + tx;
      }
      /** A door-side tile the apron may merge into: real road, and not the ghosted 28 %-alpha
       *  tunnel deck (an opaque apron laid over that would look like a hole in the hill). */
      function doorSideRoad(s, b, d, ly) {
        const i = doorSideTile(s, b, d, ly);
        if (i < 0 || !s.road || !s.road[i]) return -1;
        if (s.roadKind && s.roadKind[i] === K_TUNNEL) return -1;
        return i;
      }

      /** Apron for building b painted with context g (the road cache, or the canvas when roads go live). */
      function drawDriveway(g, s, b, fillCol, edgeCol) {
        const saved = ctx;
        ctx = g;
        try { drawDrivewayImpl(s, b, fillCol, edgeCol); } finally { ctx = saved; }
      }
      function drawDrivewayImpl(s, b, fillCol, edgeCol) {
        const d = b.door;
        if (!(d >= 0 && d < 4)) return;
        const bw = b.w || 1, bh = b.h || 1;
        const dest = b.kind === 'dest';
        const size = dest ? 1.8 : C.HOUSE_SIZE * ((b.carCap || 1) >= 2 ? 1.15 : 1);
        const fw = (d === 0 || d === 2) ? bh : bw;
        const padW = dest ? 1.24 : 0.30;    // width against the building wall
        const x0 = size / 2 - 0.03;         // starts just under the wall
        const xr = fw / 2 + 0.5;            // centre of the door-side road tile
        const kerb = xr - RW / 2;           // where a road's kerb line runs, facing the building

        // Widest contiguous run of connectable door-side tiles, tie-broken toward the middle of
        // the face. 1x1 houses have one tile and 2x2 destinations two, so this is at most a pair.
        let runA = null, runB = null;
        {
          const y0 = -(fw - 1) / 2;
          let a = null, bEnd = null, best = -Infinity;
          for (let k = 0; k <= fw; k++) {
            const ly = y0 + k;
            const ok = k < fw && doorSideRoad(s, b, d, ly) >= 0;
            if (ok) { if (a === null) a = ly; bEnd = ly; }
            else if (a !== null) {
              const score = (bEnd - a) * 10 - Math.abs(a + bEnd);
              if (score > best) { best = score; runA = a; runB = bEnd; }
              a = null;
            }
          }
        }

        ctx.save();
        ctx.translate(b.x + bw / 2, b.y + bh / 2);
        ctx.rotate(DOOR_ANG[d]);

        if (runA === null) {
          // No road yet: stop exactly where a road's kerb would be, so the apron reads as a slot
          // waiting to be filled rather than a stub pointing at nothing.
          const to = kerb + 0.03;
          if (to > x0) {
            ctx.fillStyle = fillCol;
            ctx.beginPath(); rr(ctx, x0, -padW / 2, to - x0, padW, Math.min(0.07, padW * 0.18)); ctx.fill();
            ctx.strokeStyle = edgeCol; ctx.lineWidth = DW_EDGE;
            ctx.beginPath();
            ctx.moveTo(x0, -padW / 2); ctx.lineTo(to, -padW / 2);
            ctx.moveTo(x0, padW / 2); ctx.lineTo(to, padW / 2);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        const yc = (runA + runB) / 2;
        const half = Math.min(padW, (runB - runA) + 1) / 2;
        const L = sideJoin(s, b, d, runA, -1, yc - half, xr, x0);
        const R = sideJoin(s, b, d, runB, 1, yc + half, xr, x0);
        if (R.my - L.my < 0.08) { ctx.restore(); return; }

        // Two kerb lines, wall → tarmac. Stroked FIRST and filled second (the road layer's own
        // order), so the inner half of the kerb disappears under the fill and the join has no seam.
        const kerbs = new Path2D();
        kerbs.moveTo(x0, -padW / 2); kerbs.lineTo(L.x - L.r, L.y);
        if (L.r) kerbs.quadraticCurveTo(L.x, L.y, L.x, L.my);
        kerbs.moveTo(x0, padW / 2); kerbs.lineTo(R.x - R.r, R.y);
        if (R.r) kerbs.quadraticCurveTo(R.x, R.y, R.x, R.my);
        ctx.strokeStyle = edgeCol; ctx.lineWidth = DW_EDGE;
        ctx.stroke(kerbs);

        // The tarmac carries on a little past the mouth, which paints out the road's own kerb line
        // across the opening — the same way two roads erase each other at a junction. Just past:
        // reaching the tile centre would bury a roundabout island and the near traffic-light bars.
        const xf = Math.min(xr, Math.max(L.x, R.x) + 0.06);
        const slab = new Path2D();
        slab.moveTo(x0, -padW / 2);
        slab.lineTo(L.x - L.r, L.y);
        if (L.r) slab.quadraticCurveTo(L.x, L.y, L.x, L.my);
        slab.lineTo(xf, L.my); slab.lineTo(xf, R.my);
        slab.lineTo(R.x, R.my);
        if (R.r) slab.quadraticCurveTo(R.x, R.y, R.x - R.r, R.y);
        slab.lineTo(x0, padW / 2);
        slab.closePath();
        ctx.fillStyle = fillCol;
        ctx.fill(slab);

        ctx.restore();
      }

      /**
       * Where one flank of an apron meets the tarmac, at the `sgn` end of the door-side run
       * (`tileLy` = that end tile's across-coordinate, `wantY` = where the flank would like to sit).
       * Two shapes to land on, and picking the wrong one is what leaves a notch beside the road:
       *   • the road carries on past this end → a straight kerb at half a carriageway's depth, so
       *     flare into it with a quarter fillet and the two kerbs meet tangentially;
       *   • it doesn't (a dead end, a lone tile, the outside of a corner, a roundabout disc) → the
       *     boundary there is the round cap, so pull the flank inside the cap's radius and stop it
       *     exactly where it crosses the arc.
       * Returns the flank's offset `y`, where it stops `x`, the flared mouth offset `my`, and the
       * fillet radius `r` (0 = no flare).
       */
      function sideJoin(s, b, d, tileLy, sgn, wantY, xr, x0) {
        const i = doorSideTile(s, b, d, tileLy);
        const round = !!(s.feature && i >= 0 && s.feature[i] === F_ROUNDABOUT);
        const rad = round ? RB_R : RW / 2;
        if (!round && doorSideRoad(s, b, d, tileLy + sgn) >= 0) {
          const x = xr - rad;
          const r = Math.min(FILLET, Math.max(0, (x - x0) * 0.6));
          return { y: wantY, x: x, my: wantY + sgn * r, r: r };
        }
        // At the very edge of the cap this lands on the tile centre line, which is exactly where a
        // road running on AWAY from the building has its own straight kerb — so a wide apron ends
        // up collinear with it and the two kerbs read as one line.
        const v = Math.max(-rad, Math.min(rad, wantY - tileLy));
        const y = tileLy + v;
        return { y: y, x: xr - Math.sqrt(rad * rad - v * v), my: y, r: 0 };
      }

      // ------------------------------------------------------------ sprite atlas
      // Houses, destinations and cars are pre-rendered into ONE offscreen atlas and drawn with
      // drawImage. Measured on the GPU: 1,500 roundRect fills cost ~15 ms a frame (and strokes
      // double that), 1,500 textured quads from one atlas cost nothing measurable, so this is what
      // buys the headroom for a 200-building / 200-car city. The atlas is re-rendered (≈150 small
      // vector draws) whenever the sprite scale changes: at rest it is the exact device px/tile, so
      // a resting sprite is pixel-for-pixel the vector drawing; mid-glide it is the next 1.5× step
      // above the current scale, so sprites are only ever minified a little while the zoom moves.
      const atlas = { canvas: null, ctx: null, sp: 0, key: '', cells: new Map() };
      const SPRITE_STEP = 1.5, SPR_M = 0.06;           // scale step mid-glide; margin around a sprite (tiles)
      function spriteScale(ppt, exact) { return exact ? ppt : Math.pow(SPRITE_STEP, Math.ceil(Math.log(ppt) / Math.log(SPRITE_STEP) - 1e-9)); }

      /** All sprite specs: {id, w, h, ax, ay (tiles; anchor = the object's world origin), draw(g)} with
          draw painting the object around (0, 0) in world units. */
      function spriteSpecs() {
        const specs = [];
        const nCol = (pal.colors && pal.colors.length) || 6;
        for (let ci = 0; ci < nCol; ci++) {
          const col = colorOf(ci);
          for (let big = 0; big <= 1; big++) {
            const size = C.HOUSE_SIZE * (big ? 1.15 : 1), h2 = size / 2;
            specs.push({ id: 'h:' + ci + ':' + big, w: size + 0.045 + 2 * SPR_M, h: size + 0.065 + 2 * SPR_M, ax: h2 + SPR_M, ay: h2 + SPR_M, draw: (g) => paintHouse(g, col, size, 'body') });
            for (let door = 0; door < 4; door++) specs.push({ id: 'hd:' + ci + ':' + big + ':' + door, w: size + 2 * SPR_M, h: size + 2 * SPR_M, ax: h2 + SPR_M, ay: h2 + SPR_M, draw: (g) => paintHouse(g, col, size, 'door', door, big) });
          }
          specs.push({ id: 'd:' + ci, w: 1.8 + 0.06 + 2 * SPR_M, h: 1.8 + 0.085 + 2 * SPR_M, ax: 0.9 + SPR_M, ay: 0.9 + SPR_M, draw: (g) => paintDest(g, col, 'body') });
          for (let brake = 0; brake <= 1; brake++) {
            specs.push({ id: 'c:' + ci + ':' + brake, w: CAR_L + 0.2 + 2 * SPR_M, h: CAR_W + 0.06 + 2 * SPR_M, ax: CAR_L / 2 + 0.18 + SPR_M, ay: CAR_W / 2 + 0.03 + SPR_M, draw: (g) => paintCar(g, col, brake) });
          }
        }
        for (let big = 0; big <= 1; big++) {
          const size = C.HOUSE_SIZE * (big ? 1.15 : 1), h2 = size / 2;
          specs.push({ id: 'hw:' + big, w: size + 2 * SPR_M, h: size + 2 * SPR_M, ax: h2 + SPR_M, ay: h2 + SPR_M, draw: (g) => paintHouse(g, null, size, 'windows', 0, big) });
        }
        specs.push({ id: 'dw', w: 1.8 + 2 * SPR_M, h: 1.8 + 2 * SPR_M, ax: 0.9 + SPR_M, ay: 0.9 + SPR_M, draw: (g) => paintDest(g, null, 'strip') });
        specs.push({ id: 'cs', w: CAR_L + 2 * SPR_M, h: CAR_W + 2 * SPR_M, ax: CAR_L / 2 + SPR_M, ay: CAR_W / 2 + SPR_M, draw: (g) => { g.fillStyle = D.shadow; g.fill(carPath); } });
        specs.push({ id: 'rp', w: 0.8 + 2 * SPR_M, h: 0.45 + 2 * SPR_M, ax: 0.3 + SPR_M, ay: 0.3 + SPR_M, draw: paintRipple });
        // headlights: pool ellipse spans x ∈ [CAR_L/2 − 0.1, CAR_L/2 + 0.5], lamps sit at the nose
        specs.push({ id: 'cl', w: 0.6 + 2 * SPR_M, h: 0.36 + 2 * SPR_M, ax: -CAR_L / 2 + 0.1 + SPR_M, ay: 0.18 + SPR_M, draw: (g) => {
          g.fillStyle = 'rgba(255,238,170,0.26)'; g.fill(lightPath);
          g.fillStyle = 'rgba(255,246,200,0.95)'; g.fill(lampPath);
        } });
        return specs;
      }

      /** Make sure the atlas holds every sprite at the scale for this frame. */
      function ensureAtlas(ppt, exact) {
        const sp = spriteScale(ppt, exact);
        const key = sp.toFixed(3) + '|' + mapKey;
        if (atlas.key === key) return;
        if (!atlas.canvas) { atlas.canvas = document.createElement('canvas'); atlas.ctx = atlas.canvas.getContext('2d', { alpha: true }); }
        const specs = spriteSpecs();
        // shelf packing, tallest first
        const cells = specs.map((sp_) => ({ spec: sp_, pw: Math.ceil(sp_.w * sp) + 2, ph: Math.ceil(sp_.h * sp) + 2 }));
        cells.sort((a, b) => b.ph - a.ph);
        const maxW = Math.max(2048, ...cells.map((c) => c.pw));
        let x = 0, y = 0, rowH = 0, W_ = 0;
        for (const c of cells) {
          if (x + c.pw > maxW) { x = 0; y += rowH; rowH = 0; }
          c.x = x; c.y = y; x += c.pw; rowH = Math.max(rowH, c.ph); W_ = Math.max(W_, x);
        }
        const H_ = y + rowH;
        if (atlas.canvas.width < W_ || atlas.canvas.height < H_) { atlas.canvas.width = Math.max(atlas.canvas.width, W_); atlas.canvas.height = Math.max(atlas.canvas.height, H_); }
        const g = atlas.ctx;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, atlas.canvas.width, atlas.canvas.height);
        atlas.cells.clear();
        for (const c of cells) {
          const s_ = c.spec;
          const ax = s_.ax * sp + 1, ay = s_.ay * sp + 1;
          g.setTransform(sp, 0, 0, sp, c.x + ax, c.y + ay);
          g.lineCap = 'round'; g.lineJoin = 'round'; g.globalAlpha = 1;
          s_.draw(g);
          atlas.cells.set(s_.id, { x: c.x, y: c.y, w: c.pw, h: c.ph, ax, ay });
        }
        atlas.sp = sp; atlas.key = key;
        stats.atlasBuilds++;
      }
      /** Draw sprite `id` with its anchor at world (cx, cy), scaled by sc, under g's world transform. */
      function blitSprite(g, id, cx, cy, sc) {
        const c = atlas.cells.get(id);
        if (!c) return;
        const k = (sc || 1) / atlas.sp;
        g.drawImage(atlas.canvas, c.x, c.y, c.w, c.h, cx - c.ax * k, cy - c.ay * k, c.w * k, c.h * k);
      }

      /** House vector art around (0,0): 'body' = shadow + walls + roof band, 'door' = the glyph on
          side `door`, 'windows' = the lit-window overlay (drawn at globalAlpha = night). */
      function paintHouse(g, col, size, part, door, big) {
        const x = -size / 2, y = -size / 2, r = size * 0.2;
        if (part === 'body') {
          g.fillStyle = D.shadow;
          g.beginPath(); rr(g, x + 0.045, y + 0.065, size, size, r); g.fill();
          g.fillStyle = col;
          g.beginPath(); rr(g, x, y, size, size, r); g.fill();
          g.fillStyle = shade(col, 0.27);
          g.beginPath(); rr4(g, x + size * 0.09, y + size * 0.09, size * 0.82, size * 0.42, r * 0.65, r * 0.65, r * 0.3, r * 0.3); g.fill();
        } else if (part === 'door') {
          g.fillStyle = shade(col, -0.32);
          const dw = size * 0.2, dh = size * 0.19, dy = size / 2 - dh - size * 0.07;
          g.save();
          // the door sits on the driveway side (S when a state predates driveways: no rotation)
          g.rotate(DOOR_ANG[door] - PI / 2);
          g.beginPath();
          if (big) { rr(g, -dw - size * 0.06, dy, dw, dh, dw * 0.3); rr(g, size * 0.06, dy, dw, dh, dw * 0.3); }
          else rr(g, -dw / 2, dy, dw, dh, dw * 0.3);
          g.fill();
          g.restore();
        } else {
          g.fillStyle = 'rgba(255,226,150,0.95)';
          g.beginPath();
          if (big) { rr(g, -size * 0.24, y + size * 0.18, size * 0.15, size * 0.13, 0.015); rr(g, size * 0.09, y + size * 0.18, size * 0.15, size * 0.13, 0.015); }
          else rr(g, -size * 0.075, y + size * 0.18, size * 0.15, size * 0.13, 0.015);
          g.fill();
        }
      }
      /** Destination vector art around (0,0): 'body' = shadow + block + inset band, 'strip' = the lit strip. */
      function paintDest(g, col, part) {
        const size = 1.8, x = -0.9, y = -0.9, r = size * 0.16;
        if (part === 'body') {
          g.fillStyle = D.shadow;
          g.beginPath(); rr(g, x + 0.06, y + 0.085, size, size, r); g.fill();
          g.fillStyle = col;
          g.beginPath(); rr(g, x, y, size, size, r); g.fill();
          const ins = 0.17;
          g.strokeStyle = shade(col, -0.15); g.lineWidth = 0.085;
          g.beginPath(); rr(g, x + ins, y + ins, size - 2 * ins, size - 2 * ins, r * 0.6); g.stroke();
        } else {
          g.fillStyle = 'rgba(255,226,150,0.8)';
          g.beginPath(); rr(g, -size * 0.22, y + size * 0.66, size * 0.44, size * 0.1, 0.03); g.fill();
        }
      }
      /** Car vector art around (0,0), nose toward +x: body + outline + windscreen, plus brake glow
          and lamps for the braking variant. */
      function paintCar(g, col, brake) {
        if (brake) { g.fillStyle = 'rgba(255,90,70,0.3)'; g.fill(brakeGlow); }
        g.fillStyle = col; g.fill(carPath);
        g.strokeStyle = shade(col, -0.28); g.lineWidth = 0.026; g.stroke(carPath);
        g.fillStyle = 'rgba(255,255,255,0.5)'; g.fill(windPath);
        if (brake) { g.fillStyle = '#ff5a48'; g.fill(brakePath); }
      }

      /** A bright band across the warehouse door while it is reacting (a handful
          of these exist at once, so plain vector is fine). */
      function drawDoorFlash(b, cx, cy, ci, k) {
        if (k <= 0.01) return;
        const d = doorOf(b), u = DOOR_OUT[d];
        const half = destHalf(), ang = DOOR_ANG[d];
        ctx.save();
        ctx.translate(cx + u[0] * (half - 0.1), cy + u[1] * (half - 0.1));
        ctx.rotate(ang);
        ctx.globalAlpha = 0.34 * k;
        ctx.fillStyle = shade(colorOf(ci), 0.75);
        ctx.beginPath(); ctx.ellipse(0.1, 0, 0.42, 0.66, 0, 0, PI2); ctx.fill();
        ctx.globalAlpha = 0.95 * k;
        ctx.fillStyle = shade(colorOf(ci), 0.88);
        ctx.beginPath(); rr(ctx, -0.15, -0.4, 0.3, 0.8, 0.1); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      /** The dynamic parts of a destination: pin slots and the fail ring (vector, few of them). */
      function drawDestExtras(b, sc, cx, cy) {
        const size = 1.8 * sc;
        const y = cy - size / 2;
        // pin slots along the top edge
        const cap = Math.max(1, b.pinCap || C.PIN_CAP || 6), pins = Math.max(0, b.pins | 0);
        const gap = 0.05 * sc;
        const slot = Math.min(0.17 * sc, (size * 0.78 - (cap - 1) * gap) / cap);
        const total = cap * slot + (cap - 1) * gap;
        const sx = cx - total / 2, sy = y + 0.3 * sc;
        const filled = new Path2D(), ghost = new Path2D();
        for (let k = 0; k < cap; k++) {
          const p = fx ? fx.pulseT('pin' + b.id + ':' + k) : -1;
          const ps = p < 0 ? 1 : 0.3 + 0.7 * BW.Ease.outBack(p);
          const ss = slot * ps, ox = sx + k * (slot + gap) + (slot - ss) / 2, oy = sy + (slot - ss) / 2;
          rr(k < pins ? filled : ghost, ox, oy, ss, ss, ss * 0.3);
        }
        ctx.fillStyle = pal.ink; ctx.fill(filled);
        ctx.fillStyle = D.pinGhost; ctx.fill(ghost);
        // fail ring
        const ft = b.failT || 0;
        if (ft > 0) {
          const R = size / 2 + 0.34;
          const pulse = ft > 0.6 ? 0.5 + 0.5 * Math.sin(tAnim * 9) : 0;
          ctx.strokeStyle = alpha(FAIL_RED, 0.16); ctx.lineWidth = 0.11;
          ctx.beginPath(); ctx.arc(cx, cy, R, 0, PI2); ctx.stroke();
          if (pulse > 0) {
            ctx.strokeStyle = alpha(FAIL_RED, 0.18 * pulse); ctx.lineWidth = 0.28;
            ctx.beginPath(); ctx.arc(cx, cy, R, -PI / 2, -PI / 2 + PI2 * clamp01(ft)); ctx.stroke();
          }
          ctx.strokeStyle = alpha(FAIL_RED, 0.75 + 0.25 * pulse); ctx.lineWidth = 0.11 + 0.04 * pulse;
          ctx.beginPath(); ctx.arc(cx, cy, R, -PI / 2, -PI / 2 + PI2 * clamp01(ft)); ctx.stroke();
        }
      }

      // ------------------------------------------------------------ cars
      const ground = [], elevated = [], under = [];

      /** Parking spot beside a house: the first side (S, E, W, N) that is neither the driveway nor
          a road, so an idle car never sits on the road it is about to use; parked parallel to the
          wall, two slots for carCap 2. */
      const PARK_SIDES = [2, 1, 3, 0];
      function parkSpot(s, home, slot) {
        const big = (home.carCap || 1) >= 2;
        const hs = C.HOUSE_SIZE * (big ? 1.15 : 1);
        const w = s.w, h = s.h, road = s.road;
        let side = home.door === 2 ? 0 : 2;
        if (road) {
          for (let k = 0; k < 4; k++) {
            const d = PARK_SIDES[k], nx = home.x + DX[d], ny = home.y + DY[d];
            if (d === home.door) continue;
            if (nx < 0 || ny < 0 || nx >= w || ny >= h || !road[ny * w + nx]) { side = d; break; }
          }
        }
        const along = big ? (slot === 0 ? -0.17 : 0.17) : 0;
        const off = hs / 2 + CAR_W * 0.39 + 0.03;
        return [home.x + 0.5 + DX[side] * off - DY[side] * along,
          home.y + 0.5 + DY[side] * off + DX[side] * along,
          (side & 1) ? PI / 2 : 0];
      }

      /**
       * Motorway ENDPOINT tiles → motorway id. A deck's endpoint is drawn as a round landing pad
       * (radius DECK_W/2 + 0.14) plus a flared ramp, all of it above the road layer — so a car
       * driving on that tile at ground level used to vanish underneath it (the on-ramp half before
       * a hop, the lane across the landing tile after one, and anything merely passing through).
       * The pad IS the ramp at ground level, so every car on an endpoint tile is drawn above the
       * deck: cars ride up the ramp on top, the way Mini Motorways does it.
       */
      const mwEnds = { key: '', map: null };
      function endpointTiles(s, rd) {
        const list = s.motorways;
        const key = rd.seq + ',' + (s.roadVersion | 0) + ',' + (list ? list.length : 0);
        if (mwEnds.key === key) return mwEnds.map;
        let m = null;
        if (list) {
          for (let k = 0; k < list.length; k++) {
            const mw = list[k];
            if (!mw) continue;
            if (!m) m = new Map();
            m.set(mw.ay * s.w + mw.ax, mw.id);
            m.set(mw.by * s.w + mw.bx, mw.id);
          }
        }
        mwEnds.key = key; mwEnds.map = m;
        return m;
      }

      // ------------------------------------------------------------ garages
      /**
       * Garages — cars go INSIDE buildings. Shipped in the main build since 2026-09-15 (it was the
       * `BW.FLAGS.garage` test variant until Nic approved it). The sim is untouched: everything
       * below is a re-interpretation of where an idle / parking / driveway car is DRAWN, plus a few
       * render-only reactions. Dials are live at `renderer.garage`.
       *
       *   House  — a car that comes home drives in through the door and disappears (docked cars are
       *            drawn in a pass BEFORE the building sprites, so the body covers them), the house
       *            gives a little plop, and the car noses back out of the door with a stretch/squash
       *            bounce until only its front third shows. A 2-car house has two slots side by side.
       *            On dispatch it pulls out of that slot with a revving wiggle.
       *   Warehouse — the car keeps rolling straight down its own driveway line and coasts THROUGH
       *            the wall to a stop deep inside (no stop at the door, no snap to the door axis —
       *            it enters at whatever angle it arrived at). The warehouse squashes, its door
       *            flashes in its own colour and puffs, and the pin count drops a beat later (the
       *            sim's own PARK_TIME end) while the reaction is still playing. Then the car pulls
       *            back out from deep inside, easing onto its outbound driveway line as it clears
       *            the wall.
       */
      const GT = {
        slot: 0.17,      // across-door offset of each dock in a 2-car house (tiles)
        hide: 0.26,      // fraction of HOME_DWELL the car stays hidden inside before popping out
        pop: 0.6,        // ... and the fraction of it the pop-out takes
        wiggle: 0.38,    // fraction of the outbound driveway segment that carries the pull-out wiggle
        inFrom: 0.6,     // fraction of the arrival driveway at which the car starts pulling ahead of
                         // the (braking) sim car, so it coasts on into the building instead of stopping.
                         // Measured: at 0.6 a car still fully outside the wall never exceeds the sim's
                         // own driveway speed (1.6 tiles/s) — the whole coast happens in the doorway
                         // and behind it. Earlier starts leak it into the open (0.45 → 2.2, 0.3 → 2.6).
        deepMin: 0.25,   // how far past its sim parking point the car ends up, clamped (tiles)
        deepMax: 1.05,
        reactAt: 0.76,   // fraction of PARK_TIME at which the warehouse reacts (pin drops at 1.0)
        outT: 0.55,      // the drawn car rejoins its sim position this far into a house driveway
        destOut: 0.8,    // ... and this far into a warehouse one (it starts deeper, so it gets longer)
        react: 0.5,      // seconds of warehouse reaction
        puff: 0.42,
      };
      const reacts = new Map();        // dest id -> reaction age (s)
      const wasState = [];             // car id -> state last frame (edge triggers)
      const wasPhase = [];             // car id -> parking phase last frame
      const parkB = [];                // car id -> warehouse it is parked in / pulling out of (-1 = none)
      const parkOx = [], parkOy = [];  // ... and the offset from its sim point to its pose inside
      const DOOR_OUT = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // outward unit vector per door side

      function doorOf(b) { return (b.door >= 0 && b.door < 4) ? b.door : 2; }
      function houseSize(b) { return C.HOUSE_SIZE * ((b.carCap || 1) >= 2 ? 1.15 : 1); }
      /** Dock offset from the house centre so the car's front third clears the door face. */
      function dockOut(b) { return houseSize(b) / 2 - CAR_L / 6; }
      function destHalf() { return 0.9; }
      /** True once the drawn car overlaps the warehouse body, i.e. from the moment its nose reaches
       *  the wall — that is when it moves to the `under` pass and starts being clipped by the wall. */
      function insideDest(b, x, y) {
        const lim = destHalf() + CAR_L / 2;
        return Math.abs(x - (b.x + (b.w || 2) / 2)) < lim && Math.abs(y - (b.y + (b.h || 2) / 2)) < lim;
      }
      /**
       * How far past its sim parking point a car coasts into warehouse `b`, along the driveway line
       * it arrived on (`car.segAng`, which survives untouched through `parking`). The target is the
       * warehouse centre projected onto that line, so a car that came in at an angle keeps that
       * angle and still ends up covered by the body. Returns [hx, hy, depth].
       */
      const DEEP = [0, 0, 0];
      function destDepth(b, car) {
        const hx = Math.cos(car.segAng || 0), hy = Math.sin(car.segAng || 0);
        const d = (b.x + (b.w || 2) / 2 - car.bx) * hx + (b.y + (b.h || 2) / 2 - car.by) * hy;
        DEEP[0] = hx; DEEP[1] = hy;
        DEEP[2] = d < GT.deepMin ? GT.deepMin : (d > GT.deepMax ? GT.deepMax : d);
        return DEEP;
      }

      /** Age the render-only reactions and fire the edge-triggered ones for this frame. */
      function garageTick(s, dt) {
        for (const [id, a] of reacts) { const n = a + dt; if (n >= GT.react) reacts.delete(id); else reacts.set(id, n); }
        const cars = s.cars;
        if (!cars) return;
        const B = s.buildings;
        for (let k = 0; k < cars.length; k++) {
          const car = cars[k];
          if (!car || car.alive === false) { wasState[k] = undefined; wasPhase[k] = undefined; parkB[k] = -1; continue; }
          const st = car.state;
          // the pull-out offset lives from `parking` until the car has merged off the driveway
          if (st !== 'parking' && !(st === 'toHome' && car.lane >= 4 && car.lane < 8)) parkB[k] = -1;
          // just got home: dust at the door + a plop on the house
          if (st === 'idle' && wasState[k] !== 'idle') {
            const home = B && B[car.home];
            if (home && fx) {
              const d = doorOf(home), u = DOOR_OUT[d];
              const cx = home.x + (home.w || 1) / 2, cy = home.y + (home.h || 1) / 2, o = houseSize(home) / 2;
              fx.spawn('puff', cx + u[0] * o, cy + u[1] * o, pal.bg, { size: GT.puff, dur: 0.3 });
              if (fx.startPulse) fx.startPulse('b' + home.id, 0.3);
            }
          }
          // parked inside the warehouse: it reacts partway through, then the sim drops the pin
          if (st === 'parking' && C.PARK_TIME > 0) {
            const p = 1 - clamp01((car.dwellT || 0) / C.PARK_TIME);
            const prev = wasPhase[k];
            const inside = B && B[car.dest];
            if (inside) {           // remember where (and how deep) it is, for the pull-out
              const q = destDepth(inside, car);
              parkB[k] = car.dest; parkOx[k] = q[0] * q[2]; parkOy[k] = q[1] * q[2];
            }
            if (prev !== undefined && prev < GT.reactAt && p >= GT.reactAt) {
              const dest = B && B[car.dest];
              if (dest) {
                reacts.set(dest.id, 0);
                if (fx) {
                  const d = doorOf(dest), u = DOOR_OUT[d];
                  const cx = dest.x + (dest.w || 2) / 2, cy = dest.y + (dest.h || 2) / 2, o = destHalf();
                  fx.spawn('puff', cx + u[0] * (o + 0.12), cy + u[1] * (o + 0.12), pal.bg, { size: 0.45, dur: 0.3 });
                }
              }
            }
            wasPhase[k] = p;
          } else wasPhase[k] = undefined;
          wasState[k] = st;
        }
      }

      /**
       * Re-pose one car for the variant. `e` carries the plain-game pose; this may move it, squash
       * it and mark it `under` (drawn before the building sprites). Returns nothing.
       */
      function garagePose(s, car, e, k) {
        const B = s.buildings;
        if (!B) return;
        const st = car.state;
        if (st === 'idle') {
          const home = B[car.home];
          if (!home) return;
          const d = doorOf(home), u = DOOR_OUT[d];
          const ax = -u[1], ay = u[0];
          const cx = home.x + (home.w || 1) / 2, cy = home.y + (home.h || 1) / 2;
          const slot = e.slot | 0, big = (home.carCap || 1) >= 2;
          const across = big ? (slot === 0 ? -GT.slot : GT.slot) : 0;
          const out = dockOut(home);
          let along = out, sl = 1, sw = 1;
          const dw = car.dwellT || 0;
          if (dw > 0 && C.HOME_DWELL > 0) {
            // just arrived: hidden inside, then a stretch-and-squash pop out to the dock
            const p = 1 - clamp01(dw / C.HOME_DWELL);
            if (p < GT.hide) along = 0;
            else {
              const q = clamp01((p - GT.hide) / GT.pop);
              along = out * BW.Ease.outBack(q);
              if (q < 0.55) { const k = Math.sin((q / 0.55) * PI); sl = 1 + 0.26 * k; sw = 1 - 0.16 * k; }
              else { const k = Math.sin(((q - 0.55) / 0.45) * PI); sl = 1 - 0.2 * k; sw = 1 + 0.16 * k; }
            }
          }
          e.x = cx + u[0] * along + ax * across;
          e.y = cy + u[1] * along + ay * across;
          e.a = DOOR_ANG[d];
          e.sc = 1; e.sl = sl; e.sw = sw; e.under = true;
          return;
        }
        if (st === 'parking') {
          // Already inside and stopped: the whole roll-in happened on the arrival driveway below, so
          // this just holds the pose it ended on (same heading, no snap to the door axis).
          const dest = B[car.dest];
          if (!dest || C.PARK_TIME <= 0) return;
          const q = destDepth(dest, car);
          e.x += q[0] * q[2]; e.y += q[1] * q[2];
          e.under = insideDest(dest, e.x, e.y);
          return;
        }
        if (st !== 'toDest' && st !== 'toHome') return;
        // On a driveway segment into / out of a building: slide the drawn car along the door axis so
        // it starts from (or ends at) the docked / inside pose instead of the building centre.
        const lane = car.lane;
        if (!(lane >= 4 && lane < 12)) return;
        const out = lane < 8;                          // 4..7 = leaving a building, 8..11 = arriving
        const t0 = clamp01(car.t || 0);
        // Pulling out of a warehouse (car.dest is already cleared by then, so the building and the
        // pose it parked in were stashed during `parking`): start from deep inside and ease onto the
        // outbound driveway line, which already leaves at its own natural angle.
        if (out && parkB[k] >= 0) {
          const w = B[parkB[k]];
          const f = 1 - BW.Ease.inOutQuad(clamp01(t0 / GT.destOut));
          if (f > 0) { e.x += parkOx[k] * f; e.y += parkOy[k] * f; }
          if (w) e.under = insideDest(w, e.x, e.y);
          return;
        }
        const b = out ? B[car.home] : (st === 'toDest' ? B[car.dest] : B[car.home]);
        if (!b) return;
        const dest = b.kind === 'dest';
        if (dest) {
          // Arriving at a warehouse: the sim brakes to a halt at its parking point (which sits just
          // inside the footprint), so from `inFrom` on, pull the drawn car ahead along the same line
          // until, at the end of the segment, it has coasted `depth` further in and stopped there.
          // Nothing is re-aimed: it keeps the driveway's heading all the way through the wall.
          const q = destDepth(b, car);
          const g = BW.Ease.inOutQuad(clamp01((t0 - GT.inFrom) / (1 - GT.inFrom)));
          e.x += q[0] * q[2] * g; e.y += q[1] * q[2] * g;
          e.under = insideDest(b, e.x, e.y);
          return;
        }
        // ... otherwise it is a house driveway: slide the drawn car along the door axis so it starts
        // from (or ends at) the docked pose instead of the house centre.
        const d = doorOf(b), u = DOOR_OUT[d];
        const cx = b.x + (b.w || 1) / 2, cy = b.y + (b.h || 1) / 2;
        const want = out ? dockOut(b) : 0;
        const px = out ? car.ax : car.bx, py = out ? car.ay : car.by;
        if (px === undefined) return;
        const have = (px - cx) * u[0] + (py - cy) * u[1];
        const t = t0;
        // Leaving: clear the house briskly (the car must be out of the door well before the
        // segment ends). Arriving: ride the whole segment in, so it comes to rest at the door.
        const shift = (want - have) * (out ? 1 - clamp01(t / GT.outT) : t);
        e.x += u[0] * shift; e.y += u[1] * shift;
        const along = (e.x - cx) * u[0] + (e.y - cy) * u[1];
        e.under = along < houseSize(b) / 2 + CAR_L / 2;
        if (out) {
          // pulling out of the garage: a short rev — stretch along the heading and shimmy across it
          const f = 1 - clamp01(t / GT.wiggle);
          if (f > 0) {
            e.sl = 1 + 0.22 * f; e.sw = 1 - 0.14 * f;
            const wob = Math.sin(tAnim * 34) * 0.022 * f;
            e.x += -u[1] * wob; e.y += u[0] * wob;
          }
        }
      }

      const idleSlots = new Map();   // home id -> idle cars seen so far this frame (parking slot index)
      function collectCars(s, alpha_, vr, rd) {
        ground.length = 0; elevated.length = 0; under.length = 0;
        idleSlots.clear();
        const cars = s.cars;
        if (!cars || !cars.length) return;
        const w = s.w, h = s.h, kindA = s.roadKind;
        const ends = endpointTiles(s, rd || renderData(s));
        for (let k = 0; k < cars.length; k++) {
          const car = cars[k];
          if (!car || car.alive === false) continue;
          const st = car.state;
          let x, y, a, sc = 1, op = 1, slot = 0;
          if (st === 'idle') {
            const home = s.buildings && s.buildings[car.home];
            if (!home) continue;
            // Slot = how many idle siblings were already parked this frame (carIds also lists cars out driving).
            slot = idleSlots.get(car.home) | 0;
            idleSlots.set(car.home, slot + 1);
            const p = parkSpot(s, home, slot);
            x = p[0]; y = p[1]; a = p[2]; sc = 0.78;
          } else {
            const px = car.px !== undefined ? car.px : car.x, py = car.py !== undefined ? car.py : car.y;
            const pa = car.pangle !== undefined ? car.pangle : car.angle;
            x = px + (car.x - px) * alpha_;
            y = py + (car.y - py) * alpha_;
            let da = (car.angle || 0) - (pa || 0);
            while (da > PI) da -= PI2;
            while (da < -PI) da += PI2;
            a = (pa || 0) + da * alpha_;
            if (st === 'fading') op = 1 - clamp01(car.fadeT || 0);
            if (kindA && !(car.onMotorway >= 0)) {
              const tx = x | 0, ty = y | 0;
              if (tx >= 0 && ty >= 0 && tx < w && ty < h && kindA[ty * w + tx] === K_TUNNEL) op *= 0.35;
            }
          }
          if (!(x === x) || !(y === y)) continue;           // NaN guard
          if (op <= 0.005) continue;
          // margin 2 tiles: a garage pose can move a drawn car up to ~1.3 tiles off its sim point
          const M = 2;
          if (x < vr.x0 - M || x > vr.x1 + M || y < vr.y0 - M || y > vr.y1 + M) continue;
          const moving = st === 'toDest' || st === 'toHome' || st === 'parking';
          const drive = st === 'toDest' || st === 'toHome';           // headlights: on the road only, not while parked at a destination
          let mw = car.onMotorway >= 0 ? car.onMotorway : -1;
          if (mw < 0 && moving && ends) {
            const tx = x | 0, ty = y | 0;
            if (tx >= 0 && ty >= 0 && tx < w && ty < h) {
              const v = ends.get(ty * w + tx);
              if (v !== undefined) mw = v;      // on a ramp tile: ride over the landing pad, not under it
            }

          if (mw < 0) garagePose(s, car, e, k);

      /** Cars are drawn ONE AT A TIME under their own transform, in passes (headlight pools, shadows,
          bodies, windows, brakes, lamps). Each body is a single rounded rect, so Skia takes its
          analytic rrect path and batches the whole pass; the old approach (every car of a colour
          addPath'ed into one Path2D) re-tessellated a 150-contour path five times a frame, which was
          the largest single GPU cost in a late-game frame. Quarter-turn angles are snapped to exact
          0/±1 so straight-road cars keep the axis-aligned fast path. */
      function carXform(e, base, ox, oy) {
        let c = Math.cos(e.a), sn = Math.sin(e.a);
        if (c > -1e-9 && c < 1e-9) c = 0; else if (c > 1 - 1e-9) c = 1; else if (c < -1 + 1e-9) c = -1;
        if (sn > -1e-9 && sn < 1e-9) sn = 0; else if (sn > 1 - 1e-9) sn = 1; else if (sn < -1 + 1e-9) sn = -1;

      /** Cars as sprites (see the atlas): per car a shadow quad, a body quad (plain or braking

        for (let k = 0; k < n; k++) { const e = list[k]; if (e.drive) anyDrive = true; if (e.op < 1) anyFade = true; }
        const alpha = (e, m) => { if (anyFade || m !== 1) ctx.globalAlpha = e.op * m; };
        if (!debugSkip.carShadow) {
          for (let k = 0; k < n; k++) { const e = list[k]; alpha(e, 1); carXform(e, base, 0.03, 0.045); blitSprite(ctx, 'cs', 0, 0, 1); }

        if (!debugSkip.carBody) {
          for (let k = 0; k < n; k++) { const e = list[k]; alpha(e, 1); carXform(e, base, 0, 0); blitSprite(ctx, 'c:' + e.color + ':' + (e.brake ? 1 : 0), 0, 0, 1); }
        }
        if (night > 0.01 && anyDrive) {
          for (let k = 0; k < n; k++) { const e = list[k]; if (!e.drive) continue; alpha(e, night); carXform(e, base, 0, 0); blitSprite(ctx, 'cl', 0, 0, 1); }
        }

        ctx.setTransform(base.a, 0, 0, base.a, base.e, base.f);
      }

      // ------------------------------------------------------------ motorways
      // The deck is a quadratic curve: chord a→b, control point mw.bend tiles to the left of the
      // chord midpoint (Roads sets bend; Traffic drives cars along the same curve). Hovering the
      // pointer anywhere over a deck fades that motorway (and the cars on it) so the roads
      // beneath show through; the fade eases in/out per motorway.
      const MW_FADE = 0.62;            // how much of the deck goes away at full hover
      const mwHover = new Map();       // motorway id → eased hover amount 0..1
      const mwLayer = { canvas: null, ctx: null };
      const MWG = { ax: 0, ay: 0, bx: 0, by: 0, cx: 0, cy: 0, len: 0, bend: 0 };

      /** Current geometry of a deck (endpoints animate in while the placement pulse runs). */
      function motorwayGeom(mw, g) {

      }
      /** Unit tangent of the deck curve at parameter t. */
      function mwTangent(g, t, out) {

      /** Is world point (px,py) over this deck (within `r` of the curve, or on a landing pad)? */
      function mwHit(g, px, py, r) {
        const padR = DECK_W / 2 + 0.14;
        if (Math.hypot(px - g.ax, py - g.ay) <= padR || Math.hypot(px - g.bx, py - g.by) <= padR) return true;
        const n = Math.max(4, Math.ceil(g.len * 2));

        for (let k = 1; k <= n; k++) {

          if (qx * qx + qy * qy <= r * r) return true;

      }

      function drawMotorways(s, vr, night, warm, base, ui, dt) {
        const list = s.motorways;

        if (list && list.length) {
          for (let k = 0; k < list.length; k++) {
            const mw = list[k];
            if (!mw) { mwHover.delete(k); continue; }

            const target = hov && g.len > 1e-6 && mwHit(g, hx, hy, DECK_W / 2 + 0.16) ? 1 : 0;
            let h = mwHover.get(mw.id) || 0;

            if (h > 0) mwHover.set(mw.id, h); else mwHover.delete(mw.id);

        // double up into a ghost outline the way per-stroke alpha would.
        const solidCars = [], fadeCars = [];

        if (solidCars.length) drawCarBatch(solidCars, night, base);

          const mw = list[id];
          const g = motorwayGeom(mw, MWG);

          const mx = Math.min(g.ax, g.bx, g.cx) - 1.2, Mx = Math.max(g.ax, g.bx, g.cx) + 1.2;
          const my = Math.min(g.ay, g.by, g.cy) - 1.2, My = Math.max(g.ay, g.by, g.cy) + 1.2;
          const sx0 = Math.max(0, Math.floor(base.e + mx * base.a)), sy0 = Math.max(0, Math.floor(base.f + my * base.a));

          lc.clearRect(sx0, sy0, sx1 - sx0, sy1 - sy0);

          if (cars.length) drawCarBatch(cars, night, base);

          const a = 1 - MW_FADE * (mwHover.get(id) || 0);
          ctx.setTransform(1, 0, 0, 1, 0, 0);

          ctx.globalAlpha = 1;

      }

      function drawMotorway(mw, vr, night, warm) {
        // Drawn above the screen tint, so the deck takes the day/night tint by colour instead.
        const deck = tinted(D.deck, night, warm), deckEdge = tinted(D.deckEdge, night, warm), dash = tinted(pal.roadEdge, night, warm);
        const g = motorwayGeom(mw, MWG);
        const ax = g.ax, ay = g.ay, bx = g.bx, by = g.by, cx = g.cx, cy = g.cy, len = g.len;
        if (Math.min(ax, bx, cx) - 1 > vr.x1 || Math.max(ax, bx, cx) + 1 < vr.x0 || Math.min(ay, by, cy) - 1 > vr.y1 || Math.max(ay, by, cy) + 1 < vr.y0) return;

        mwTangent(g, 0, MWT); const aux = MWT[0], auy = MWT[1];
        mwTangent(g, 1, MWT); const bux = -MWT[0], buy = -MWT[1];
        const curve = (ox, oy) => { ctx.beginPath(); ctx.moveTo(ax + ox, ay + oy); ctx.quadraticCurveTo(cx + ox, cy + oy, bx + ox, by + oy); ctx.stroke(); };
        // ground shadow
        ctx.strokeStyle = alpha(pal.ink, 0.17); ctx.lineWidth = DECK_W + 0.12;
        curve(0.07, 0.11);
        // pylons every ~2 tiles, poking out either side of the deck
        ctx.fillStyle = alpha(pal.ink, 0.28);
        const pw = 0.17, ph = DECK_W + 0.2;
        for (let d = 1.15; d < len - 1.0; d += 2) {
          const t = d / len;
          mwPoint(g, t, MWP); mwTangent(g, t, MWT);
          const px = MWP[0] + 0.03, py = MWP[1] + 0.05, ux = MWT[0], uy = MWT[1], nx = -uy, ny = ux;
          ctx.beginPath();
          ctx.moveTo(px - ux * pw / 2 - nx * ph / 2, py - uy * pw / 2 - ny * ph / 2);
          ctx.lineTo(px + ux * pw / 2 - nx * ph / 2, py + uy * pw / 2 - ny * ph / 2);
          ctx.lineTo(px + ux * pw / 2 + nx * ph / 2, py + uy * pw / 2 + ny * ph / 2);
          ctx.lineTo(px - ux * pw / 2 + nx * ph / 2, py - uy * pw / 2 + ny * ph / 2);

        // flared ramps at both ends (drawn under the deck: outline then fill), each along its own tangent
        const flare = (ex, ey, dx, dy) => {

        const padR = DECK_W / 2 + 0.14;                 // round landing pad on each endpoint tile (hides the road's dead-end cap)
        ctx.lineJoin = 'round';
        ctx.fillStyle = deckEdge;
        ctx.beginPath(); ctx.arc(ax, ay, padR + EDGE, 0, PI2); ctx.fill();
        ctx.beginPath(); ctx.arc(bx, by, padR + EDGE, 0, PI2); ctx.fill();
        ctx.strokeStyle = deckEdge; ctx.lineWidth = 2 * EDGE;
        if (endLen > 0.3) { flare(ax, ay, aux, auy); ctx.fill(); ctx.stroke(); flare(bx, by, bux, buy); ctx.fill(); ctx.stroke(); }
        // deck
        ctx.strokeStyle = deckEdge; ctx.lineWidth = DECK_W + 2 * EDGE;
        curve(0, 0);
        ctx.fillStyle = deck;
        if (endLen > 0.3) { flare(ax, ay, aux, auy); ctx.fill(); flare(bx, by, bux, buy); ctx.fill(); }
        ctx.strokeStyle = deck; ctx.lineWidth = DECK_W;
        curve(0, 0);
        ctx.beginPath(); ctx.arc(ax, ay, padR, 0, PI2); ctx.fill();
        ctx.beginPath(); ctx.arc(bx, by, padR, 0, PI2); ctx.fill();
        // ramp stripes: two short dark bands across each flare
        ctx.strokeStyle = alpha(pal.ink, 0.12); ctx.lineWidth = 0.06;
        ctx.beginPath();
        for (const [ex, ey, dx, dy] of [[ax, ay, aux, auy], [bx, by, bux, buy]]) {
          const nx = -dy, ny = dx;

        }
      }

      // ------------------------------------------------------------ ui overlays
      const RED = 'rgba(224,85,74,';

        ctx.moveTo(x + 0.65, y + 0.35); ctx.lineTo(x + 0.35, y + 0.65);

      function deniedFlash(x, y, age) {

      function drawUi(s, ui) {

          for (const [i, age] of fx.denied) {
            const x = i % w, y = (i / w) | 0;

          }
        }
        if (ud) deniedFlash(ud.x, ud.y, ud.t || 0);

        const inkA = (a) => alpha(pal.ink, a), redA = (a) => RED + a.toFixed(3) + ')';
        // tiles placed / erased during this drag

          ctx.beginPath();

          ctx.fill();

        const g = ui.ghost;

        }
        // motorway tool: pin at A, dashed preview to B (Input's motorwayB, else the hover tile)
        if (ui.tool === 'motorway' && ui.motorwayA) {
          const ax = ui.motorwayA[0] + 0.5, ay = ui.motorwayA[1] + 0.5;
          const B = ui.motorwayB || ui.hoverTile;
          if (B && (B[0] !== ui.motorwayA[0] || B[1] !== ui.motorwayA[1])) {
            const ok = !(g && g.motorway) || g.ok !== false;
            const bx = B[0] + 0.5, by = B[1] + 0.5;

   * Close the room / connection and forget everything. Safe to call at any point. Deliberately
   * does NOT clear `inLobby` — backing out of a room to the lobby menu tears the room down and is
   * still very much "in the lobby"; only leave() and the countdown end that.
   */
  function teardown() {
    if (listTimer) { clearInterval(listTimer); listTimer = 0; }
    role = null; myCode = ''; pendingMap = null;
    if (sdk) { try { sdk.closeLobby(); } catch (e) { /* ignore */ } wireSdk(); }
  }

  function busy() { return !!match || inLobby; }

  /** Called by Game.endVersus (restart / menus / a solo game): quit cleanly and clear the screen. */
  function leave() {
    if (match) { try { match.quit(); } catch (e) { /* ignore */ } }
    match = null;
    if (BW.VS) BW.VS.clear();
    hideFoeView();
    teardown();
    inLobby = false;
    if (game && game.hud) game.hud.setVersus(false);
  }

  function askLeave() {
    if (!match || match.over) return;
    game.screens.show('confirm', {
      title: 'Leave the match?',
      body: 'Your city is lost and ' + esc(foeName) + ' takes the win.',
      ok: 'Leave',
      onOk: () => game.toTitle(),
      onCancel: () => game.screens.hide(),
    });
  }

  async function hostRoom(mapId) {
    pendingMap = mapId;
    role = 'host';
    game.screens.show('vsRoom', { mapId: mapId, state: 'opening' });
    for (let tries = 0; tries < 6; tries++) {
      const code = newCode();
      try {
        await sdk.createRoom({ peerId: 'bw-' + code, label: mapName(mapId) });
        myCode = code;
        if (role !== 'host') { teardown(); return; }        // cancelled while the broker answered
        game.screens.show('vsRoom', { mapId: mapId, state: 'waiting', code: code });
        return;
      } catch (e) {
        const taken = e && (e.type === 'unavailable-id' || /unavailable/i.test(String(e.message || e)));
        if (!taken) {
          game.screens.show('vsRoom', { mapId: mapId, state: 'error', error: friendlyError(e) });
          return;
        }
      }
    }
    game.screens.show('vsRoom', { mapId: mapId, state: 'error', error: 'Could not find a free room code. Try again.' });
  }

  function friendlyError(e) {
    const msg = String((e && (e.message || e.reason)) || e || '');
    if (/block|network|CDN|broker/i.test(msg)) {
      return 'Could not reach the matchmaking service. Some networks block the peer-to-peer connection games use.';
    }
    return msg || 'Something went wrong.';
  }

  /** Accepts what a room button carries ('bw-7hp5') and what a player types ('7HP5', '7hp 5'). */
  async function joinByCode(code) {
    code = String(code || '').trim().toLowerCase().replace(/^bw-/, '').replace(/[^a-z0-9]/g, '');
    if (!code) return;
    role = 'join';
    game.screens.show('vsBrowse', { state: 'joining', code: code });
    try {
      await sdk.joinRoom('bw-' + code);
    } catch (e) {
      game.screens.show('vsBrowse', { state: 'error', error: friendlyError(e) });
    }
  }

  function onJoinFailed(why) {
    if (match) return;
    const msg = why === 'full' ? 'That room is already playing.'
      : why === 'network' ? 'Could not connect — the peer-to-peer link was blocked.'
        : 'That room is gone. The host may have closed it.';
    game.screens.show('vsBrowse', { state: 'error', error: msg });
  }

  // =====================================================================================
  // Match lifecycle
  // =====================================================================================

  function onConnected(isHost, seat, peerName, peerEmblem) {
    foeName = peerName || 'Opponent';
    foeEmblem = peerEmblem || '';
    if (isHost) {
      const seed = rand32();
      const mapId = pendingMap || (BW.Maps.list()[0] || {}).id;
      send({ t: 'setup', p: BW.VS.PROTO, mapId: mapId, seed: seed });
      countdown(mapId, seed, true);
    }
    // The joiner starts on 'setup' — the host owns the map and the seed.
  }

  function onData(data) {
    if (!data || typeof data !== 'object') return;
    if (data.t === 'setup') {
      if ((data.p | 0) !== BW.VS.PROTO) {
        game.screens.show('vsBrowse', {
          state: 'error',
          error: 'Different versions of Busy Byways. One of you needs to update before you can play online.',
        });
        teardown();
        return;
      }
      countdown(data.mapId, data.seed >>> 0, false);
      return;
    }
    if (match) match.recv(data);
  }

  function onDisconnected() {
    if (match && !match.over) { match.opponentGone(); return; }
    if (match) return;
    // Also covers the countdown, which is the one window where we are connected, committed to a
    // match and do not have one yet — without this the 3-2-1 would run out and start a race
    // against nobody.
    if (inLobby || game.screens.current === 'vsStart') {
      teardown();
      inLobby = true;
      game.screens.show('vsBrowse', { state: 'error', error: 'The connection dropped.' });
    }
  }

  /** 3 · 2 · 1 on both machines, then the match begins. */
  function countdown(mapId, seed, isHost) {
    if (match) return;
    inLobby = false;
    if (listTimer) { clearInterval(listTimer); listTimer = 0; }
    game.screens.show('vsStart', { mapId: mapId, seed: seed, isHost: isHost });
  }

  function begin(mapId, seed, isHost) {
    if (match) return;
    match = BW.VS.create({
      send: send,
      isHost: isHost,
      mapId: mapId,
      seed: seed,
      myName: (sdk && sdk.myName && sdk.myName()) || 'You',
      myEmblem: (sdk && sdk.myEmblem && sdk.myEmblem()) || '',
      foeName: foeName,
      foeEmblem: foeEmblem,
      on: onMatchEvent,
    });
    match.begin();
    game.startVersus(match);
    showFoeView();
  }

  function onMatchEvent(name, m) {
    switch (name) {
      case 'upgrade':
        game.phase = 'upgrade';
        game.screens.show('vsUpgrade', m.me.upgradeOffer || { roads: 0, options: [] });
        break;
      case 'resume':
        game.phase = 'playing';
        game.screens.hide();
        announceFoePick(m);
        break;
      case 'speed':
        game.speed = m.fast() ? 2 : 1;
        if (game.hud) game.hud.setSpeedVote(m.fastMe, m.fastFoe, m.fast());
        break;
      case 'over':
        game.phase = 'gameover';
        hideFoeView();
        if (game.hud) game.hud.hide();
        recordVersus(m);
        game.screens.show('vsOver', {});
        break;
      case 'finals':
        // Their true final town landed after the screen was built — rebuild it around the real one.
        if (game.screens.current === 'vsOver') game.screens.show('vsOver', {});
        break;
      case 'again':
        if (game.screens.current === 'vsOver') refreshAgain(m);
        if (m.wantAgain && m.foeWantAgain) rematch(m);
        break;
      default:
        break;
    }
  }

  function announceFoePick(m) {
    const up = m.up;
    if (!up || !game.hud || !game.hud.showToast) return;
    const offer = up.offer;
    const opt = offer && offer.options ? offer.options[up.theirs] : null;
    const info = opt && BW.Screens.KIND_INFO ? BW.Screens.KIND_INFO[opt.kind] : null;
    if (info) game.hud.showToast(foeName + ' took the ' + info.name.toLowerCase());
  }

  function rematch(m) {
    const mapId = m.mapId;
    const isHost = m.isHost;
    const seed = isHost ? rand32() : 0;
    match = null;
    if (BW.VS) BW.VS.clear();
    if (isHost) {
      send({ t: 'setup', p: BW.VS.PROTO, mapId: mapId, seed: seed });
      countdown(mapId, seed, true);
    }
    // The joiner's own 'setup' will arrive in a moment and start its countdown.
  }

  // ---- launcher stats ------------------------------------------------------------------
  // A versus city is a city: it feeds the same stats, achievements and per-map best as a solo run.
  // Only the win half is gated on the result — both clients run this same code, so without that
  // gate the loser would bank the winner's stat. Map UNLOCKS still stay solo-only: the host picks
  // the map, and beating it on someone else's invitation shouldn't hand out progression.

  function recordVersus(m) {
    const S = (typeof window !== 'undefined' && window.GameSDK) || null;
    try {
      const s = m.me;
      if (s) {
        if (game.noteBest) game.noteBest(m.mapId, s.score | 0);
        if (S && BW.Launcher && BW.Launcher.recordRun) {
          BW.Launcher.recordRun(game, { score: s.score | 0, stats: s.stats, week: s.time.week });
        }
      }
    } catch (e) { /* never let tracking break the game */ }
    if (!S) return;
    try {
      // A real 'win' only. A dropped link gives BOTH sides 'forfeit' — nobody actually outlasted
      // anybody, and counting it would make pulling the plug the cheapest win in the game.
      if (m.result === 'win') {
        S.incrementStat('online_wins');
        S.unlockAchievement('rival_routes', 'Rival Routes');
      }
    } catch (e) { /* never let tracking break the game */ }
  }

  // =====================================================================================
  // The enemy town window
  // =====================================================================================

  const foeView = {
    layer: null, wrap: null, canvas: null, head: null, nameEl: null, scoreEl: null,
    weekEl: null, warnEl: null, statusEl: null,
    cam: null, fx: null, renderer: null,
    big: false, w: 0, h: 0, drag: null, acc: 0,
  };

  function layer() {
    if (foeView.layer) return foeView.layer;
    const app = document.getElementById('app') || document.body;
    const el = document.createElement('div');
    el.id = 'vs';
    const screensEl = document.getElementById('screens');
    // Between the HUD and the screens: it floats over the map, and any panel still covers it.
    if (screensEl && screensEl.parentNode === app) app.insertBefore(el, screensEl);
    else app.appendChild(el);
    foeView.layer = el;
    return el;
  }

  function buildFoeView() {
    if (foeView.wrap) return;
    const wrap = document.createElement('div');
    wrap.className = 'vs-foe';
    wrap.innerHTML =
      '<div class="vs-foe-head">' +
        '<span class="vs-foe-em"></span><span class="vs-foe-name"></span>' +
        '<span class="vs-foe-score">0</span>' +
      '</div>' +
      '<div class="vs-foe-view"><canvas></canvas><div class="vs-foe-status"></div></div>' +
      '<div class="vs-foe-foot">' +
        '<span class="vs-foe-week">Week 1</span>' +
        '<span class="vs-foe-warn"></span>' +
        '<span class="vs-foe-hint">click to expand</span>' +
      '</div>' +
      '<button type="button" class="vs-foe-close" aria-label="Close">✕</button>';
    layer().appendChild(wrap);
    foeView.wrap = wrap;
    foeView.canvas = wrap.querySelector('canvas');
    foeView.nameEl = wrap.querySelector('.vs-foe-name');
    foeView.scoreEl = wrap.querySelector('.vs-foe-score');
    foeView.weekEl = wrap.querySelector('.vs-foe-week');
    foeView.warnEl = wrap.querySelector('.vs-foe-warn');
    foeView.statusEl = wrap.querySelector('.vs-foe-status');
    const emEl = wrap.querySelector('.vs-foe-em');

    foeView.cam = BW.Camera.create(foeView.canvas);
    foeView.fx = BW.FX.create();
    foeView.renderer = BW.Renderer.create(foeView.canvas, foeView.cam, foeView.fx);

    wrap.addEventListener('click', (e) => {
      if (e.target.closest('.vs-foe-close')) { setBig(false); return; }
      if (!foeView.big) setBig(true);
    });
    // Expanded: wheel zooms, drag pans. Small: neither, it is a fit-to-town thumbnail.
    foeView.canvas.addEventListener('wheel', (e) => {
      if (!foeView.big) return;
      e.preventDefault();
      const r = foeView.canvas.getBoundingClientRect();
      foeView.cam.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.pow(0.9988, e.deltaY));
    }, { passive: false });
    foeView.canvas.addEventListener('pointerdown', (e) => {
      if (!foeView.big) return;
      foeView.drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
      try { foeView.canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    foeView.canvas.addEventListener('pointermove', (e) => {
      const d = foeView.drag;
      if (!d || d.id !== e.pointerId) return;
      foeView.cam.panBy(e.clientX - d.x, e.clientY - d.y);
      d.x = e.clientX; d.y = e.clientY;
    });
    const endDrag = (e) => { if (foeView.drag && foeView.drag.id === e.pointerId) foeView.drag = null; };
    foeView.canvas.addEventListener('pointerup', endDrag);
    foeView.canvas.addEventListener('pointercancel', endDrag);

    // Esc closes the expanded window before BW.Screens sees it (which would open Leave match?).
    window.addEventListener('keydown', (e) => {
      if (!foeView.big) return;
      const k = BW.keyId ? BW.keyId(e) : e.key;
      if (k !== 'Escape') return;
      e.stopImmediatePropagation();
      e.preventDefault();
      setBig(false);
    }, true);

    if (emEl) emEl.textContent = foeEmblem;
  }

  function showFoeView() {
    buildFoeView();
    chrome = { score: -1, week: -1, warn: -1, status: '' };   // a rematch starts from 0 again
    foeView.wrap.querySelector('.vs-foe-em').textContent = foeEmblem;
    foeView.nameEl.textContent = foeName;
    foeView.wrap.classList.add('on');
    setBig(false);
    if (match && foeView.cam) foeView.cam.fitBounds(match.foe, 1.4, true);
  }

  function hideFoeView() {
    if (!foeView.wrap) return;
    foeView.wrap.classList.remove('on', 'big');
    foeView.big = false;
  }

  function setBig(on) {
    if (!foeView.wrap) return;
    foeView.big = !!on;
    foeView.wrap.classList.toggle('big', foeView.big);
    sizeFoeView(true);
  }

  function sizeFoeView(snap) {
    if (!foeView.wrap || !foeView.renderer) return;
    const cv = foeView.canvas;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!(w > 0) || !(h > 0)) return;
    if (w !== foeView.w || h !== foeView.h || snap) {
      foeView.w = w; foeView.h = h;
      foeView.renderer.resize(w, h);
      if (match) foeView.cam.fitBounds(match.foe, foeView.big ? 2 : 1.4, true);
    }
  }

  function onResize() { if (foeView.wrap && foeView.wrap.classList.contains('on')) sizeFoeView(true); }

  /** Replica events feed the enemy window's own FX registry — never the player's, and never audio. */
  function onFoeStep(foe) {
    if (!foe || !foe.events.length) return;
    const evs = foe.events;
    foe.events = [];
    if (!foeView.fx) return;
    for (let k = 0; k < evs.length; k++) foeView.fx.onEvent(foe, evs[k]);
  }

  /** Draw the enemy town. Called from Game.frame, after the player's own city. */
  function frame(dt) {
    if (!match || !foeView.wrap || !foeView.wrap.classList.contains('on')) return;
    sizeFoeView(false);
    // The small window is a glance, not a game view: half rate is invisible there and keeps the
    // player's own city at full speed on a laptop GPU. Expanded, it gets every frame.
    foeView.acc += dt;
    const step = foeView.big ? 0 : 1 / 32;
    if (foeView.acc < step) { updateFoeChrome(); return; }
    const d = foeView.acc;
    foeView.acc = 0;
    if (!foeView.big) foeView.cam.fitBounds(match.foe, 1.4);
    foeView.cam.update(d);
    foeView.fx.update(d);
    foeView.renderer.render(match.foe, 1, d);
    updateFoeChrome();
  }

  let chrome = { score: -1, week: -1, warn: -1, status: '' };
  function updateFoeChrome() {
    if (!match) return;
    if (match.foeScore !== chrome.score) { chrome.score = match.foeScore; foeView.scoreEl.textContent = String(match.foeScore); }
    if (match.foeWeek !== chrome.week) { chrome.week = match.foeWeek; foeView.weekEl.textContent = 'Week ' + match.foeWeek; }
    if (match.foeWarn !== chrome.warn) {
      chrome.warn = match.foeWarn;
      foeView.warnEl.textContent = match.foeWarn > 0 ? (match.foeWarn === 1 ? '1 closing' : match.foeWarn + ' closing') : '';
      foeView.warnEl.classList.toggle('on', match.foeWarn > 0);
    }
    // One line for whatever is not normal: a stalled opponent, or a view we cannot keep exact.
    // 'live' only: at an upgrade barrier the opponent is legitimately silent (their sim is stopped
    // too), and calling that "not responding" would cry wolf every single week.
    let st = '';
    if (match.phase !== 'live') st = '';
    else if (Date.now() - match.foeSeenAt > 4000) st = 'waiting for ' + foeName + '…';
    else if (match.replicaLoose) st = 'approximate view';
    if (st !== chrome.status) {
      chrome.status = st;
      foeView.statusEl.textContent = st;
      foeView.statusEl.classList.toggle('on', !!st);
    }
  }

  // =====================================================================================
  // A town drawn into an arbitrary canvas (the results screen)
  // =====================================================================================

  /**
   * A finished town painted into a canvas. The sim is stopped, so this only draws while something
   * is still moving — the camera settling after a resize or a click. Repainting two whole cities
   * every frame behind a results screen is pure waste, and enough of it to cost frames.
   */
  function townView(canvas, state) {
    const cam = BW.Camera.create(canvas);
    const fx = BW.FX.create();
    const renderer = BW.Renderer.create(canvas, cam, fx);
    let w = 0, h = 0, settledFor = 0;
    return {
      draw(dt) {
        const cw = canvas.clientWidth, ch = canvas.clientHeight;
        if (!(cw > 0) || !(ch > 0)) return;
        if (cw !== w || ch !== h) {
          w = cw; h = ch; settledFor = 0;
          renderer.resize(cw, ch);
          cam.fitBounds(state, 1.6, true);
        }
        cam.update(dt);
        // Two frames of grace after the camera stops, so the last easing step lands on screen.
        if (cam.settled()) { if (settledFor > 2) return; settledFor++; } else settledFor = 0;
        renderer.render(state, 1, dt);
      },
      refit() { w = 0; },
    };
  }

  // =====================================================================================
  // Screens
  // =====================================================================================

  const E = BW.Screens.EXTRA;

  E.vsMenu = function (data, ctx) {
    const me = (sdk && sdk.myName && sdk.myName()) || 'You';
    const scr = ctx.panel('vsmenu', 'vs-menu-panel',
      '<div class="eyebrow">Online</div>' +
      '<h2>Versus</h2>' +
      '<p class="vs-blurb">Same map, same seed, same week. Last one standing wins.</p>' +
      '<div class="stack">' +
        '<button type="button" class="btn primary big" data-act="host">Host a game</button>' +
        '<button type="button" class="btn" data-act="join">Join a game</button>' +
        '<button type="button" class="btn ghost" data-act="back">' + svg('back') + 'Back</button>' +
      '</div>' +
      '<div class="vs-you">Playing as <b>' + esc(me) + '</b></div>');
    const primary = ctx.on(scr, '[data-act="host"]', () => ctx.show('vsMaps', {}));
    ctx.on(scr, '[data-act="join"]', () => { role = 'join'; ctx.show('vsBrowse', { state: 'list' }); });
    const back = () => { teardown(); game.toTitle(); };
    ctx.on(scr, '[data-act="back"]', back);
    return { el: scr, primary, esc: back };
  };

  E.vsMaps = function (data, ctx) {
    // Every map is available in Versus: both players race the same one, and blocking it on one
    // player's solo progress would just stop the pair playing together.
    const list = BW.Maps.list();
    let cards = '';
    list.forEach((m) => {
      cards += '<button type="button" class="map-card" data-id="' + esc(m.id) + '">' +
        '<div class="map-thumb-wrap"><canvas class="map-thumb" data-id="' + esc(m.id) + '"></canvas></div>' +
        '<div class="map-name">' + esc(m.name) + '</div>' +
        '<div class="map-blurb">' + esc(m.blurb || '') + '</div>' +
        '</button>';
    });
    const scr = ctx.panel('maps', 'maps-panel',
      '<div class="panel-head"><button type="button" class="btn ghost" data-act="back">' + svg('back') + 'Back</button>' +
      '<h2>Choose the map</h2></div>' +
      '<div class="maps-grid">' + cards + '</div>' +
      '<div class="vs-note">Both players play this map on the same seed.</div>');
    ctx.on(scr, '[data-act="back"]', () => ctx.show('vsMenu', {}));
    scr.querySelectorAll('.map-card').forEach((b) => {
      b.addEventListener('click', () => hostRoom(b.dataset.id));
    });
    scr.querySelectorAll('.map-thumb').forEach((cv) => {
      const m = list.find((x) => x.id === cv.dataset.id);
      if (m) ctx.drawThumb(cv, m);
    });
    return { el: scr, primary: scr.querySelector('.map-card'), esc: () => ctx.show('vsMenu', {}) };
  };

  E.vsRoom = function (data, ctx) {
    let body;
    if (data.state === 'opening') body = '<div class="vs-spin">Opening a room…</div>';
    else if (data.state === 'error') body = '<div class="vs-error">' + esc(data.error) + '</div>';
    else {
      body =
        '<div class="vs-code-l">Room code</div>' +
        '<div class="vs-code">' + esc((data.code || '').toUpperCase()) + '</div>' +
        '<div class="vs-spin">Waiting for an opponent…</div>' +
        '<div class="vs-note">They can pick your room from the list, or type this code.</div>';
    }
    const scr = ctx.panel('vsroom', 'vs-room-panel',
      '<div class="eyebrow">' + esc(mapName(data.mapId)) + '</div>' +
      '<h2>Your room</h2>' + body +
      '<div class="row"><button type="button" class="btn" data-act="back">Cancel</button></div>');
    const back = () => { teardown(); ctx.show('vsMenu', {}); };
    const primary = ctx.on(scr, '[data-act="back"]', back);
    return { el: scr, primary, esc: back };
  };

  E.vsBrowse = function (data, ctx) {
    const state = data.state || 'list';
    if (listTimer) { clearInterval(listTimer); listTimer = 0; }   // the previous list is gone
    let body;
    if (state === 'joining') body = '<div class="vs-spin">Connecting to ' + esc((data.code || '').toUpperCase()) + '…</div>';
    else if (state === 'error') body = '<div class="vs-error">' + esc(data.error) + '</div>';
    else body = '<div class="vs-rooms"><div class="vs-spin">Looking for open rooms…</div></div>';

    const scr = ctx.panel('vsbrowse', 'vs-browse-panel',
      '<div class="panel-head"><button type="button" class="btn ghost" data-act="back">' + svg('back') + 'Back</button>' +
      '<h2>Open rooms</h2></div>' +
      body +
      (state === 'list'
        ? '<div class="vs-code-row">' +
            '<input class="vs-code-in" type="text" maxlength="6" placeholder="CODE" aria-label="Room code" autocomplete="off" spellcheck="false">' +
            '<button type="button" class="btn primary" data-act="code">Join</button>' +
          '</div>'
        : '<div class="row"><button type="button" class="btn" data-act="again">Back to the list</button></div>'));

    const back = () => { teardown(); ctx.show('vsMenu', {}); };
    ctx.on(scr, '[data-act="back"]', back);
    ctx.on(scr, '[data-act="again"]', () => { teardown(); role = 'join'; ctx.show('vsBrowse', { state: 'list' }); });
    const input = scr.querySelector('.vs-code-in');
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); joinByCode(input.value); }
        e.stopPropagation();          // the code box owns its own keys
      });
    }
    ctx.on(scr, '[data-act="code"]', () => { if (input) joinByCode(input.value); });

    if (state === 'list') {

      '<h2 class="vs-banner ' + (tie ? 'tie' : (won ? 'won' : 'lost')) + '">' + esc(banner) + '</h2>' +
      '<div class="vs-towns">' + town('me', mine, won || tie) + town('foe', theirs, !won || tie) + '</div>' +
      '<div class="row">' +

        '<button type="button" class="btn primary big" data-act="again">Rematch</button>' +

    const views = [];
    const cvs = Array.from(scr.querySelectorAll('.vs-town-cv'));
    if (cvs[0] && m.me) views.push(townView(cvs[0], m.me));
    if (cvs[1] && m.foe) views.push(townView(cvs[1], m.foe));
