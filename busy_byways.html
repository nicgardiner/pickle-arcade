    o.mw = -1; o.mwDir = 0; o.tab = null; o.cx = 0; o.cy = 0;
    if (sub === 2) { // turnaround connector from the car's current pose to the lane entry of side e0
      const tile = r[0], e0 = r.e0, tx = tile % w, ty = (tile - tx) / w;
      o.kind = SEG_TURN; o.tile = tile; o.lane = e0; o.entry = e0; o.exit = -1; o.tx = tx; o.ty = ty;
      o.ax = car.x; o.ay = car.y;
      entryPoint(e0, P0); o.bx = tx + P0[0]; o.by = ty + P0[1];
      const dist = Math.hypot(o.bx - o.ax, o.by - o.ay), h = Math.max(0.12, dist * 0.6);
      o.cx = car.x + Math.cos(car.angle) * h; o.cy = car.y + Math.sin(car.angle) * h;
      let len = 0, lx = o.ax, ly = o.ay;
      for (let k = 1; k <= 8; k++) {
        const u = k / 8, v = 1 - u;
        const x = v * v * o.ax + 2 * v * u * o.cx + u * u * o.bx, y = v * v * o.ay + 2 * v * u * o.cy + u * u * o.by;
        len += Math.hypot(x - lx, y - ly); lx = x; ly = y;
      }
      o.len = Math.max(0.05, len); o.ang = car.angle;
      return;
    }
    if (i === last) { // driveway into the target building from the last road tile's midpoint
      const Z = r[i - 1], a = Grid.dirBetween(s, Z, r[i]);
      const zx = Z % w, zy = (Z - zx) / w, eZ = entryOf(s, r, i - 1);
      o.kind = SEG_DRIVE; o.tile = r[i]; o.lane = 8 + a; o.entry = 8 + a; o.exit = -1; o.tx = zx; o.ty = zy;
      sampleTab(TAB[0][eZ * 4 + opp(eZ)], 0.5, POS);
      o.ax = zx + POS.x; o.ay = zy + POS.y;
      const b = s.buildings[s.building[r[i]]];
      if (b && b.kind === 'house') { o.bx = b.x + (b.w || 1) / 2; o.by = b.y + (b.h || 1) / 2; }
      else { o.bx = zx + 0.5 + DX[a] * (0.5 + PARK_IN); o.by = zy + 0.5 + DY[a] * (0.5 + PARK_IN); }
      finishLine(o);
      return;
    }
    if (i === 0 && r.e0 < 0) { // driveway out of a building to the lane entry on the adjacent road tile
      const A = r[1], e1 = Grid.dirBetween(s, A, r[0]), ax = A % w, ay = (A - ax) / w;
      o.kind = SEG_DRIVE; o.tile = r[0]; o.lane = 4 + opp(e1); o.entry = o.lane; o.exit = -1;
      o.tx = r[0] % w; o.ty = (r[0] - o.tx) / w;
      o.ax = car.x; o.ay = car.y;
      entryPoint(e1, P0); o.bx = ax + P0[0]; o.by = ay + P0[1];
      finishLine(o);
      return;
    }
    const tile = r[i], tx = tile % w, ty = (tile - tx) / w, e = entryOf(s, r, i);
    o.tx = tx; o.ty = ty;
    if (sub === 1) { // motorway hop r[i] -> r[i+1]
      const B = r[i + 1], bx = B % w, by = (B - bx) / w;
      o.kind = SEG_MOTORWAY; o.tile = -1; o.lane = -1; o.entry = -1; o.exit = -1;
      o.mw = Paths ? Paths.motorwayBetween(s, tile, B) : -1;
      const m = o.mw >= 0 ? s.motorways[o.mw] : null;
      o.mwDir = (m && m.ay * w + m.ax === tile) ? 0 : 1;
      sampleTab(TAB[0][e * 4 + opp(e)], 0.5, POS);
      o.ax = tx + POS.x; o.ay = ty + POS.y;
      entryPoint(entryOf(s, r, i + 1), P0); o.bx = bx + P0[0]; o.by = by + P0[1];
      finishLine(o);
      // The deck is a quadratic curve (Roads stores `bend` to the left of its a→b); a car driving
      // b→a sees the same physical side on its right, hence the sign flip. Chord length stands in
      // for arc length: a 0.4-tile peak over 8 tiles is well under 1 % longer.
      const bend = m ? (o.mwDir === 0 ? m.bend || 0 : -(m.bend || 0)) : 0;
      const mx = (o.ax + o.bx) / 2, my = (o.ay + o.by) / 2, nx = -(o.by - o.ay) / o.len, ny = (o.bx - o.ax) / o.len;
      o.cx = mx + nx * bend; o.cy = my + ny * bend;
      return;
    }
    o.tile = tile; o.lane = e; o.entry = e;
    if (i === last - 1 || isHop(s, r, i)) {
      o.kind = SEG_HALF; o.tab = TAB[0][e * 4 + opp(e)]; o.exit = opp(e); o.len = 0.5;
      return;
    }
    const x = Grid.dirBetween(s, tile, r[i + 1]);
    if (s.feature[tile] === BW.FEAT_ROUNDABOUT) { o.kind = SEG_ROUND; o.tab = TAB[1][e * 4 + x]; }
    else { o.kind = SEG_LANE; o.tab = TAB[0][e * 4 + x]; }
    o.exit = x; o.len = o.tab.len;
  }

  /** Cached description of the k-th (1 or 2) segment after the car's current one, or null at the end. */
  function peekSeg(s, car, k) {
    const cache = k === 1 ? car.n1 : car.n2;
    const key = car.routeIdx * 4 + car.sub;
    if (cache.route === car.route && cache.key === key && cache.ver === s.roadVersion) return cache.ok ? cache : null;
    cache.route = car.route; cache.key = key; cache.ver = s.roadVersion;
    let i = car.routeIdx, sub = car.sub;
    for (let j = 0; j < k; j++) {
      if (!nextStep(s, car.route, i, sub, STEP)) { cache.ok = false; return null; }
      i = STEP[0]; sub = STEP[1];
    }
    buildSeg(s, car, i, sub, cache);
    cache.ok = true;
    return cache;
  }

  function enterSeg(s, tr, car, o, leftover) {
    removeFromOcc(s, tr, car);
    car.seg = o.kind; car.tile = o.tile; car.lane = o.lane; car.entry = o.entry; car.exit = o.exit;
    car.segLen = o.len; car.tab = o.tab; car.tx = o.tx; car.ty = o.ty;
    car.ax = o.ax; car.ay = o.ay; car.bx = o.bx; car.by = o.by; car.cx = o.cx; car.cy = o.cy;
    car.segAng = o.ang; car.mwDir = o.mwDir; car.onMotorway = o.mw;
    car.t = o.len > 1e-9 ? Math.min(leftover / o.len, 0.9) : 1;
    car.mwT = o.kind === SEG_MOTORWAY ? car.t : 0;
    car.waitTile = -1;
    if (o.tile >= 0) tr.occ[o.tile].push(car);
    else if (o.mw >= 0) {
      const m = s.motorways[o.mw];
      if (m) { if (!m.cars) m.cars = []; m.cars.push(car); }
    }
  }

  function installRoute(s, tr, car, route) {
    car.route = route; car.routeVer = s.roadVersion; car.routeIdx = 0; car.sub = 0;
    car.waitTile = -1; car.speed = 0; car.waitT = 0;
    car.n1.key = -1; car.n2.key = -1;
    buildSeg(s, car, 0, 0, SEG);
    enterSeg(s, tr, car, SEG, 0);
    car.angle = SEG.ang;          // instant heading out of the driveway (the car was parked)
    placeCar(car, 1);
  }

  /** Is the remainder of the route still drivable? (called only when roadVersion changed) */
  function routeValid(s, car) {
    const r = car.route, last = r.length - 1;
    let k = car.routeIdx;
    if (r.e0 < 0 && k < 1) k = 1;
    if (car.sub === 1) k++;
    for (; k <= last - 1; k++) {
      if (!s.road[r[k]]) return false;
      if (k < last - 1) {
        const d = Grid.dirBetween(s, r[k], r[k + 1]);
        if (d >= 0) { if (!(s.road[r[k]] & MASK[d])) return false; }
        else if (!Paths || Paths.motorwayBetween(s, r[k], r[k + 1]) < 0) return false;
      }
    }
    // The last road must still sit on the target's driveway side (a house can be rotated).
    const b = s.buildings[s.building[r[last]]];
    if (b && b.door >= 0 && b.door < 4 && last >= 1 && Grid.dirBetween(s, r[last - 1], r[last]) !== Grid.OPP(b.door)) return false;
    return true;
  }

  /** Re-plan toward `target` from the car's current boundary. Returns false when no route exists. */
  function tryReroute(s, tr, car, leftover, target) {
    const r = car.route, i = car.routeIdx;
    let nr = null;
    if (i === 0 && r.e0 < 0) {                        // end of the driveway out of a building
      const A = r[1];
      if (s.road[A]) { const p = roadsTo(s, tr, A, target); if (p) nr = makeRoute(s, p, r[0], -1, target); }
      if (!nr) return false;
    } else if (car.sub === 1) {                       // end of a motorway hop: continue from the far endpoint
      const B = r[i + 1];
      if (s.road[B]) { const p = roadsTo(s, tr, B, target); if (p) nr = makeRoute(s, p, r[i], car.entry, target); }
      if (!nr) return false;
    } else {                                          // far edge of road tile r[i]
      const Nn = r[i + 1], d = car.exit;
      const adjOk = d >= 0 && s.road[Nn] && Grid.dirBetween(s, r[i], Nn) === d && (s.road[r[i]] & MASK[d]) !== 0;
      if (adjOk) {
        const p = roadsTo(s, tr, Nn, target);
        if (p && !(p.length > 1 && p[1] === r[i])) nr = makeRoute(s, p, r[i], car.entry, target);
      }
      if (!nr) {                                      // turn around on this tile, then drive the new route
        const p = roadsTo(s, tr, r[i], target);
        if (!p) return false;
        nr = makeRoute(s, p, -1, d >= 0 ? d : car.entry, target);
        if (!nr) return false;
        car.route = nr; car.routeVer = s.roadVersion; car.routeIdx = 0; car.sub = 2;
        car.n1.key = -1; car.n2.key = -1;
        buildSeg(s, car, 0, 2, SEG);
        enterSeg(s, tr, car, SEG, 0);
        return true;
      }
    }
    car.route = nr; car.routeVer = s.roadVersion; car.routeIdx = 0;
    car.n1.key = -1; car.n2.key = -1;
    endSegment(s, tr, car, leftover);
    return true;
  }

  function reroute(s, tr, car, leftover) {
    const target = s.buildings[car.state === 'toDest' ? car.dest : car.home];
    if (target && tryReroute(s, tr, car, leftover, target)) return;
    if (car.state === 'toDest') {
      releaseClaim(s, car);
      car.state = 'toHome';
      const home = s.buildings[car.home];
      if (home && tryReroute(s, tr, car, leftover, home)) return;
    }
    fadeCar(s, tr, car);
  }

  function arrive(s, tr, car) {
    car.t = 1; car.x = car.bx; car.y = car.by; car.speed = 0; car.waitT = 0; car.waitTile = -1;
    if (car.state === 'toDest' && car.dest >= 0) {
      car.state = 'parking';
      car.dwellT = C.PARK_TIME;
      car.parkTile = car.route[car.route.length - 2];
    } else settleHome(s, tr, car);
  }

  function endSegment(s, tr, car, leftover) {
    if (!nextStep(s, car.route, car.routeIdx, car.sub, STEP)) { arrive(s, tr, car); return; }
    if (car.routeVer !== s.roadVersion) {
      if (!routeValid(s, car)) { reroute(s, tr, car, leftover); return; }
      car.routeVer = s.roadVersion;
    }
    const seg = peekSeg(s, car, 1);
    car.routeIdx = STEP[0]; car.sub = STEP[1];
    enterSeg(s, tr, car, seg, leftover);
  }

  // --- following / permissions ---------------------------------------------------------------
  function segD(car) { return car.seg === SEG_TURN ? -(1 - car.t) * car.segLen : car.t * car.segLen; }

  /** Distance (along the lane) from this car to the closest car ahead in the same lane, or Infinity. */
  function leaderGap(s, tr, car) {
    const myD = segD(car);
    let best = Infinity;
    if (car.tile >= 0) {
      const occ = tr.occ[car.tile];
      for (let k = 0; k < occ.length; k++) {
        const c2 = occ[k];
        if (c2 === car || c2.lane !== car.lane) continue;
        const d2 = segD(c2);
        if (d2 > myD || (d2 === myD && c2.id < car.id)) { const g = d2 - myD; if (g < best) best = g; }
      }
    } else if (car.onMotorway >= 0) {
      const m = s.motorways[car.onMotorway];
      if (m && m.cars) for (let k = 0; k < m.cars.length; k++) {
        const c2 = m.cars[k];
        if (c2 === car || c2.mwDir !== car.mwDir) continue;
        const d2 = c2.t * c2.segLen;
        if (d2 > myD || (d2 === myD && c2.id < car.id)) { const g = d2 - myD; if (g < best) best = g; }
      }
    }
    return best;
  }

  /** Spacing to keep from a leader travelling a segment of this kind. Following is measured as
   *  arc length along each car's OWN segment, which matches screen distance only when both cars
   *  trace the same path. Two cars entering a roundabout tile from the same side take arcs of
   *  different lengths (as does a car merely passing through a roundabout tile on its way to a
   *  building), and two cars on one motorway aim at different lane points at the far end, so equal
   *  arc-length progress can still put them closer than MIN_GAP: both hold a wider gap. */
  function gapFor(s, kind, tile) {
    if (kind === SEG_MOTORWAY) return C.MIN_GAP * MW_GAP;
    if (kind === SEG_ROUND || (tile >= 0 && s.feature[tile] === BW.FEAT_ROUNDABOUT)) return C.MIN_GAP * ROUND_GAP;
    return C.MIN_GAP;
  }

  /** Progress of the LAST car (smallest d) in the lane described by seg, or -1 when empty. */
  function lastD(s, tr, seg, car) {
    let best = -1;
    if (seg.tile >= 0) {
      const occ = tr.occ[seg.tile];
      for (let k = 0; k < occ.length; k++) {
        const c2 = occ[k];
        if (c2 === car || c2.lane !== seg.lane) continue;
        const d2 = segD(c2);
        if (best < 0 || d2 < best) best = d2;
      }
    } else if (seg.mw >= 0) {
      const m = s.motorways[seg.mw];
      if (m && m.cars) for (let k = 0; k < m.cars.length; k++) {
        const c2 = m.cars[k];
        if (c2 === car || c2.mwDir !== seg.mwDir) continue;
        const d2 = c2.t * c2.segLen;
        if (best < 0 || d2 < best) best = d2;
      }
    }
    return best;
  }

  function vMaxFor(kind, entry, exit) {
    switch (kind) {
      case SEG_LANE: return exit === opp(entry) ? C.CAR_SPEED : C.CAR_TURN_SPEED;
      case SEG_HALF: return C.CAR_SPEED;
      case SEG_MOTORWAY: return C.MOTORWAY_SPEED;
      default: return C.CAR_TURN_SPEED;
    }
  }

  /** Don't block the box: only enter a busy tile when the lane beyond it has room for us. */
  function boxOk(s, tr, car) {
    const n2 = peekSeg(s, car, 2);
    if (!n2 || (n2.tile < 0 && n2.mw < 0)) return true;
    const d2 = lastD(s, tr, n2, car);
    return d2 < 0 || d2 >= gapFor(s, n2.kind, n2.tile);
  }

  /** First come, first served at a plain intersection; with same-side cars inside, only fairness applies. */
  function fcfsOk(s, tr, car, T, e, inside) {
    const myT = car.waitTile === T ? car.arriveT : Infinity;
    for (let d = 0; d < 4; d++) {
      if (d === e) continue;
      const nb = Grid.neighborTile(s, T, d);
      if (nb < 0) continue;
      const o2 = tr.occ[nb];
      for (let k = 0; k < o2.length; k++) {
        const c2 = o2[k];
        if (c2 === car || c2.waitTile !== T) continue;
        if (inside) { if (tr.now - c2.arriveT > FAIR_WAIT) return false; continue; }
        if (c2.arriveT < myT) return false;
        if (c2.arriveT === myT && tr.rng.next() < 0.5) return false;
      }
    }
    // cars waiting to land here from a motorway are not in any neighbour tile
    const tx = T % s.w, ty = (T - tx) / s.w;
    for (let k = 0; k < s.motorways.length; k++) {
      const m = s.motorways[k];
      if (!m || !m.cars || !((m.ax === tx && m.ay === ty) || (m.bx === tx && m.by === ty))) continue;
      for (let j = 0; j < m.cars.length; j++) {
        const c2 = m.cars[j];
        if (c2 === car || c2.waitTile !== T) continue;
        if (inside) { if (tr.now - c2.arriveT > FAIR_WAIT) return false; continue; }
        if (c2.arriveT < myT) return false;
        if (c2.arriveT === myT && tr.rng.next() < 0.5) return false;
      }
    }
    return true;
  }

  /** May `car` enter road tile n1.tile from side n1.entry right now? */
  function mayEnter(s, tr, car, n1) {
    const T = n1.tile, e = n1.entry, x = n1.exit;
    const occ = tr.occ[T];
    const mask = s.road[T];
    const isX = Grid.degree(s, T) >= 3;
    const feat = s.feature[T];
    const fromRoad = (mask & MASK[e]) !== 0;
    const waited = car.waitTile === T ? tr.now - car.arriveT : 0;
    if (car.seg === SEG_MOTORWAY && fromRoad && waited <= LOCK_PATIENCE) {
      // landing into a lane that road traffic also uses: yield to a car about to enter it — but
      // only for LOCK_PATIENCE, like every other yield: a saturated crawl past the off-ramp
      // always has "a car about to enter", and the whole motorway sat frozen for 45 s+ behind it
      const nb = Grid.neighborTile(s, T, e);
      if (nb >= 0) {
        const o2 = tr.occ[nb];
        for (let k = 0; k < o2.length; k++) {
          const c2 = o2[k];
          if (c2.exit === opp(e) && c2.seg !== SEG_DRIVE && (1 - c2.t) * c2.segLen < C.MIN_GAP) return false;
        }
      }
    }
    if (isX && feat === BW.FEAT_LIGHT) {
      const L = s.lights;
      if (L.allRed || (L.phase | 0) !== (e & 1)) return false;
      if (waited <= LOCK_PATIENCE) {
        const straight = x === opp(e);
        for (let k = 0; k < occ.length; k++) {
          const c2 = occ[k];
          if (c2.lane === e) continue;
          if (!straight || c2.exit !== opp(c2.lane)) return false;   // turning cars take the whole box
        }
      }
      return boxOk(s, tr, car);
    }
    if (isX && feat === BW.FEAT_ROUNDABOUT) {
      if (waited <= LOCK_PATIENCE) {
        if (occ.length >= C.ROUNDABOUT_CAP) return false;
        const thE = SIDE_ANG[e] - ALPHA;
        const cx = n1.tx + 0.5, cy = n1.ty + 0.5;
        for (let k = 0; k < occ.length; k++) {
          const c2 = occ[k];
          if (c2.lane === e) continue;
          let dth = (Math.atan2(c2.y - cy, c2.x - cx) - thE) % TWO_PI;
          if (dth < 0) dth += TWO_PI;
          if (dth < PI / 2 + 0.15 || dth > TWO_PI - 0.15) return false;   // circulating car about to pass my entry
        }
      }
      return boxOk(s, tr, car);
    }
    if (isX) {
      if (waited <= LOCK_PATIENCE) {
        // one entry side at a time; a car inside that is itself waiting to enter MY tile is a 2-cycle: both go
        let other = false, cycle = false;
        for (let k = 0; k < occ.length; k++) {
          const c2 = occ[k];
          if (c2.lane === e) continue;
          other = true;
          if (c2.waitTile === car.tile && car.tile >= 0) cycle = true;
        }
        if (other && !cycle) return false;
        if (!other && !fcfsOk(s, tr, car, T, e, occ.length > 0)) return false;
      }
      return boxOk(s, tr, car);
    }
    if (!fromRoad && waited <= MERGE_PATIENCE) {
      // pulling out of a driveway: wait for the tile to be clear of other traffic, but not forever
      for (let k = 0; k < occ.length; k++) if (occ[k].lane !== e) return false;
    }
    return true;
  }

  function placeCar(car, ease) {
    let x, y, a;
    switch (car.seg) {
      case SEG_LANE: case SEG_ROUND:
        sampleTab(car.tab, car.t, POS); x = car.tx + POS.x; y = car.ty + POS.y; a = POS.a; break;
      case SEG_HALF:
        sampleTab(car.tab, car.t * 0.5, POS); x = car.tx + POS.x; y = car.ty + POS.y; a = POS.a; break;
      case SEG_TURN: case SEG_MOTORWAY: {   // quadratic through (ax,ay) (cx,cy) (bx,by)
        const t = car.t, v = 1 - t;
        x = v * v * car.ax + 2 * v * t * car.cx + t * t * car.bx;
        y = v * v * car.ay + 2 * v * t * car.cy + t * t * car.by;
        const dx = 2 * v * (car.cx - car.ax) + 2 * t * (car.bx - car.cx), dy = 2 * v * (car.cy - car.ay) + 2 * t * (car.by - car.cy);
        a = (dx * dx + dy * dy) > 1e-12 ? Math.atan2(dy, dx) : car.angle;
        break;
      }
      default:
        x = car.ax + (car.bx - car.ax) * car.t; y = car.ay + (car.by - car.ay) * car.t; a = car.segAng;
    }
    car.x = x; car.y = y;
    car.angle = ease >= 1 ? a : wrapAngle(lerpAngle(car.angle, a, ease));
    if (car.seg === SEG_MOTORWAY) car.mwT = car.t;
  }

  function moveCar(s, tr, car, dt, ease) {
    const rem = (1 - car.t) * car.segLen;
    let stop = Infinity, crossOk = false;
    let vLim = vMaxFor(car.seg, car.entry, car.exit);
    const gap = leaderGap(s, tr, car);
    if (gap < Infinity) stop = gap - gapFor(s, car.seg, car.tile);
    if (stop >= rem) {
      const n1 = peekSeg(s, car, 1);
      if (!n1) { stop = Math.min(stop, rem); crossOk = true; }        // end of the route: stop at the end
      else {
        const d1 = lastD(s, tr, n1, car);
        if (d1 >= 0) stop = Math.min(stop, rem + d1 - gapFor(s, n1.kind, n1.tile));
        else {
          const n2 = peekSeg(s, car, 2);
          if (n2) { const d2 = lastD(s, tr, n2, car); if (d2 >= 0) stop = Math.min(stop, rem + n1.len + d2 - gapFor(s, n2.kind, n2.tile)); }
        }
        let allowed = true;
        if (n1.tile >= 0 && n1.tile !== car.tile && n1.kind !== SEG_DRIVE) allowed = mayEnter(s, tr, car, n1);
        // The bay at the end of an arrival driveway (lane 8+dir) is a single point, so it holds
        // exactly one car: queue on the road rather than stacking on whoever is parked there.
        else if (n1.kind === SEG_DRIVE && n1.lane >= 8 && d1 >= 0) allowed = false;
        if (allowed) { car.waitTile = -1; crossOk = stop >= rem; }
        else {
          if (stop > rem) stop = rem;
          if (rem < 0.75 && car.waitTile !== n1.tile) { car.waitTile = n1.tile; car.arriveT = tr.now; }
        }
        const v1 = vMaxFor(n1.kind, n1.entry, n1.exit);

        if (d > hw * 1.3) continue;
        const m = 0.78 + 0.44 * g.widthN((x + 0.5) / w, (y + 0.5) / h);
        if (d < hw * m) t[y * w + x] = T;
      }
    }
  }

  /** Paint T where the metaball field of `list` ([{u,v,r}], r in tiles at REF_W) exceeds 1. */
  function blobs(g, list, T, irregular) {
    const s = g.s, w = s.w, h = s.h, t = s.terrain;
    const irr = irregular === undefined ? 0.5 : irregular;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const px = x + 0.5, py = y + 0.5;
        let f = 0;
        for (let k = 0; k < list.length; k++) {
          const b = list[k];
          const dx = px - b.u * w, dy = py - b.v * h;
          const r = b.r * g.sc;
          f += (r * r) / (dx * dx + dy * dy + 0.01);
        }
        const m = (1 - irr / 2) + irr * g.blobN(px / w, py / h);
        if (f * m > 1) t[y * w + x] = T;
      }
    }
  }

  /** Paint T in a noisy band along the map edge (sea rim / mountain rim). */
  function rim(g, base, amp, T) {
    const s = g.s, w = s.w, h = s.h, t = s.terrain;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const e = Math.min(x + 0.5, y + 0.5, w - x - 0.5, h - y - 0.5);
        const r = (base + amp * g.rimN((x + 0.5) / w, (y + 0.5) / h)) * g.sc;
        if (e < r) t[y * w + x] = T;
      }
    }
  }

  /** Generic painter: fn(u, v, x, y) -> terrain type or -1 to leave untouched. */
  function paint(g, fn) {
    const s = g.s, w = s.w, h = s.h, t = s.terrain;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const r = fn((x + 0.5) / w, (y + 0.5) / h, x, y);
        if (r >= 0) t[y * w + x] = r;
      }
    }
  }

  /** Diagonal ridge: a band parallel to the map diagonal, `off` tiles (at REF_W) from the centre. */
  function ridge(g, off, halfWidth, T, tRange, wobbleAmp) {
    const s = g.s, w = s.w, h = s.h, t = s.terrain;
    const L = Math.hypot(w, h);
    const dx = w / L, dy = h / L;          // along the diagonal (top-left → bottom-right)
    const nx = -dy, ny = dx;               // across it
    const wn = noise1(g.rng, 6);
    const amp = (wobbleAmp === undefined ? 1.8 : wobbleAmp) * g.sc;
    const t0 = tRange ? tRange[0] : -1, t1 = tRange ? tRange[1] : 2;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const rx = x + 0.5 - w / 2, ry = y + 0.5 - h / 2;
        const along = (rx * dx + ry * dy) / L + 0.5;
        if (along < t0 || along > t1) continue;
        const across = rx * nx + ry * ny;
        const wob = (wn(along) - 0.5) * 2 * amp;
        const hw = halfWidth * g.sc * (0.8 + 0.4 * g.widthN((x + 0.5) / w, (y + 0.5) / h));
        // taper the ends of a limited ridge so it doesn't stop with a flat cut
        let taper = 1;
        if (tRange) {
          const e = Math.min(along - t0, t1 - along) / Math.max(0.001, (t1 - t0) * 0.25);
          taper = clamp(e, 0, 1);
        }
        if (Math.abs(across - off * g.sc - wob) < hw * taper) t[y * w + x] = T;
      }
    }
  }

  /** Control points along the diagonal at a fixed offset (for creeks parallel to a ridge). */
  function diagCtrl(s, off, ts) {
    const w = s.w, h = s.h, L = Math.hypot(w, h);
    const dx = w / L, dy = h / L, nx = -dy, ny = dx;
    const sc = w / REF_W;
    return ts.map((t) => {
      const a = (t - 0.5) * L;
      return [(w / 2 + dx * a + nx * off * sc) / w, (h / 2 + dy * a + ny * off * sc) / h];
    });
  }

  /** Coastline: water below a shore height that varies with u — a base level, an optional sine
   *  swell `[amp, freq, phase]`, an optional inward bite `[depth, u, width]` and noise. Covers a
   *  plain sea edge (delta) and a bay biting into it (Port Ellery). */
  function coast(g, o, T) {
    const n = fbm(g.rng, 10, 7, 2);
    const wave = o.wave || [0, 0, 0], bite = o.bay || [0, 0.5, 0.2], amp = o.noise || 0;
    paint(g, (u, v) => {
      let shore = o.base + wave[0] * Math.sin(u * wave[1] + wave[2]);
      if (bite[0]) shore -= bite[0] * Math.exp(-Math.pow((u - bite[1]) / bite[2], 2));
      shore += (n(u, v) - 0.5) * amp;
      return v > shore ? T : -1;
    });
  }

  // ---------------------------------------------------------------------------------------
  // Terrain ops — the declarative form every map descriptor is written in
  // ---------------------------------------------------------------------------------------

  const T_BY_NAME = { land: T_LAND, water: T_WATER, hill: T_HILL };
  const T_NAMES = ['land', 'water', 'hill'];

  /**
   * Run a map's `ops` list. Ops paint in list order (later ops overwrite earlier ones) and each
   * draws its own noise from `g.rng` as it runs, so THE ORDER OF THE LIST IS PART OF THE SEED:
   * reordering ops changes every seed's terrain even when the shapes are identical. The map editor
   * (harness/map-editor.html) reads and writes exactly this data.
   *
   *   { t:'blobs',  T, list:[{u,v,r}], irr }         metaball lakes / knolls / islands
   *   { t:'band',   T, ctrl:[[u,v]…], width, wobble }  a curved river or channel
   *                 …or diag:{ off, ts:[…] } instead of ctrl, for a band parallel to the diagonal
   *   { t:'rim',    T, base, amp }                   noisy border ring (sea rim / mountain wall)
   *   { t:'ridge',  T, off, halfWidth, wobble, range? }  a band parallel to the map diagonal
   *   { t:'coast',  T, base, wave?, bay?, noise? }   shore line across the bottom of the map
   *
   * `T` is 'land' | 'water' | 'hill'. `note` is a free-text label shown in the editor. Radii,
   * widths and offsets are in tiles at the reference width (48) and scale with the map.
   */
  function runOps(g, ops) {
    for (let i = 0; i < ops.length; i++) {
      const o = ops[i];
      const T = T_BY_NAME[o.T];
      if (T === undefined) throw new Error('BW.Maps: op ' + i + ' has unknown terrain "' + o.T + '"');
      switch (o.t) {
        case 'blobs': blobs(g, o.list, T, o.irr); break;
        case 'band': band(g, o.diag ? diagCtrl(g.s, o.diag.off, o.diag.ts) : o.ctrl, o.width, T, o.wobble); break;
        case 'rim': rim(g, o.base, o.amp, T); break;
        case 'ridge': ridge(g, o.off, o.halfWidth, T, o.range || null, o.wobble); break;
        case 'coast': coast(g, o, T); break;
        default: throw new Error('BW.Maps: unknown terrain op "' + o.t + '"');
      }
    }
  }

  // ---------------------------------------------------------------------------------------
  // Post-processing
  // ---------------------------------------------------------------------------------------

  /** Remove 1-tile specks / notches and fill 1-tile holes so rounded-corner drawing looks good.
   *  A tile with ≤1 orthogonal neighbour of its own type becomes the neighbourhood majority. */
  function cleanup(s) {
    const w = s.w, h = s.h, t = s.terrain;
    const counts = [0, 0, 0];
    for (let pass = 0; pass < 6; pass++) {
      let changed = 0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = y * w + x, own = t[i];
          counts[0] = counts[1] = counts[2] = 0;
          for (let d = 0; d < 4; d++) {
            const nx = x + DX[d], ny = y + DY[d];
            const v = (nx < 0 || ny < 0 || nx >= w || ny >= h) ? own : t[ny * w + nx];
            counts[v]++;
          }
          if (counts[own] > 1) continue;
          let best = T_LAND;
          if (counts[T_WATER] > counts[best]) best = T_WATER;
          if (counts[T_HILL] > counts[best]) best = T_HILL;
          if (best !== own) { t[i] = best; changed++; }
        }
      }
      if (!changed) break;
    }
  }

  function landFraction(s, x0, y0, x1, y1) {
    let land = 0, n = 0;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        n++;
        if (x >= 0 && y >= 0 && x < s.w && y < s.h && s.terrain[y * s.w + x] === T_LAND) land++;
      }
    }
    return n ? land / n : 0;
  }

  /** Slide the start rect onto land if the generator left it < 80 % buildable (safety net). */
  function fitStartRect(s) {
    const b = s.bounds;
    if (!b) return;
    const bw = b.x1 - b.x0 + 1, bh = b.y1 - b.y0 + 1;
    const score = (x0, y0) => {
      if (x0 < 0 || y0 < 0 || x0 + bw > s.w || y0 + bh > s.h) return -1;
      const cx = x0 + Math.floor(bw / 2), cy = y0 + Math.floor(bh / 2);
      return landFraction(s, x0, y0, x0 + bw - 1, y0 + bh - 1) + 0.5 * landFraction(s, cx - 3, cy - 2, cx + 2, cy + 2);
    };
    if (score(b.x0, b.y0) >= 1.3) return;
    let best = score(b.x0, b.y0), bx = b.x0, by = b.y0;
    for (let r = 1; r <= 12; r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          const sc = score(b.x0 + dx, b.y0 + dy);
          if (sc > best) { best = sc; bx = b.x0 + dx; by = b.y0 + dy; }
        }
      }
      if (best >= 1.3) break;
    }
    b.x0 = bx; b.y0 = by; b.x1 = bx + bw - 1; b.y1 = by + bh - 1;
  }

  /** Scatter decor: trees cluster near water, rocks near hills, ~10 % of land, never in the
   *  centre 6×5 of the start rect. Deterministic top-k selection keeps density exact. */
  function scatterDecor(s, rng) {
    const w = s.w, h = s.h, t = s.terrain;
    const cluster = fbm(rng, 6, 4, 2);
    const b = s.bounds || { x0: 0, y0: 0, x1: w - 1, y1: h - 1 };
    const cx = Math.floor((b.x0 + b.x1) / 2), cy = Math.floor((b.y0 + b.y1) / 2);
    const cand = [];
    let landCount = 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (t[i] !== T_LAND) continue;
        landCount++;
        if (x >= cx - 3 && x <= cx + 2 && y >= cy - 2 && y <= cy + 2) continue;
        let nearWater = false, nearHill = false;
        for (let oy = -2; oy <= 2 && !(nearWater && nearHill); oy++) {
          for (let ox = -2; ox <= 2; ox++) {
            const nx = x + ox, ny = y + oy;
            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
            const v = t[ny * w + nx];
            if (v === T_WATER) nearWater = true;
            else if (v === T_HILL && Math.abs(ox) <= 1 && Math.abs(oy) <= 1) nearHill = true;
          }
        }
        const score = 0.55 * cluster((x + 0.5) / w, (y + 0.5) / h) + 0.45 * rng.next() + (nearWater ? 0.14 : 0) + (nearHill ? 0.12 : 0);
        cand.push({ i: i, score: score, nearWater: nearWater, nearHill: nearHill });
      }
    }
    cand.sort((a, c) => c.score - a.score || a.i - c.i);
    const target = Math.round(landCount * 0.10);
    for (let k = 0; k < target && k < cand.length; k++) {
      const c = cand[k];
      const r = rng.next();
      let kind;
      if (c.nearHill) kind = r < 0.6 ? 3 : (r < 0.85 ? 2 : 1);
      else if (c.nearWater) kind = r < 0.7 ? 1 : 2;
      else kind = r < 0.5 ? 1 : (r < 0.88 ? 2 : 3);
      s.decor[c.i] = kind;
    }
  }

    const maxA0 = opts.maxAnchorDist || 0, minA0 = opts.minAnchorDist || 0;
    const relax = opts.relax !== false;
    const ctx = { anchor: anchor, wantRoad: wantRoad, k: sprawl(s), fDest: distField(s, 'dest', color), fAny: distField(s, null, -1) };
    for (let pass = 0; pass < 3; pass++) {
      const strict = pass === 0;
      const widened = pass === 1 && !!anchor;
      if (!strict && !relax) break;
      if (pass === 1 && !widened) continue;              // nothing to widen: go straight to relaxed
      const maxA = widened ? maxA0 * 2 : maxA0, minA = widened ? 0 : minA0;
      let best = null, bestScore = -Infinity;
      for (let y = b.y0; y <= b.y1; y++) {
        for (let x = b.x0; x <= b.x1; x++) {
          if (!inGrid(s, x, y)) continue;
          const i = idx(s, x, y);
          if (!freeLand(s, i)) continue;
          if (strict && wantRoad && !hasRoadNeighbour(s, x, y)) continue;
          if ((strict || widened) && anchor) {
            const da = Math.abs(anchor[0] - x) + Math.abs(anchor[1] - y);
            if (da > maxA || da < minA) continue;
          }
          if (freeBorder(s, x, y, 1, 1, null) < 1) continue;
          if (wouldTrap(s, x, y, 1, 1)) continue;
          const sc = scoreHouse(s, x, y, color, ctx);
          if (sc > bestScore) { bestScore = sc; best = [x, y]; }
        }
      }
      if (best) return best;
      if (!wantRoad && !anchor) break;   // nothing to relax
    }
    return null;
  }

  function scoreDest(s, x, y, color, ctx) {
    let sc = s.rng.next() * 1.5;
    if (!ctx.anchor) {
      // far from the same colour's houses (so cars actually travel) — unless there are none yet
      if (ctx.centroid) {
        const dm = footDist(ctx.centroid[0], ctx.centroid[1], x, y, 2, 2);
        if (dm >= C.DEST_MIN_DIST_HOUSES) sc += 3; else sc -= (C.DEST_MIN_DIST_HOUSES - dm) * 1.0;
      }
      const dh = fieldDist(s, ctx.fHouse, x, y, 2, 2);
      if (dh !== Infinity && dh > TUNE.DEST_HOUSE_MAX) sc -= (dh - TUNE.DEST_HOUSE_MAX) * 0.8;
    }
    const dd = fieldDist(s, ctx.fDest, x, y, 2, 2);
    if (dd !== Infinity) {
      if (dd < C.DEST_MIN_DIST_DESTS) sc -= (C.DEST_MIN_DIST_DESTS - dd) * 2;
      else sc += Math.min(dd - C.DEST_MIN_DIST_DESTS, 4) * 0.3;
    }
    sc -= countAround(s, x, y, 2, 2) * 0.7;
    const nb = fieldDist(s, ctx.fAny, x, y, 2, 2);
    if (nb !== Infinity) {
      const want = TUNE.DEST_SPREAD_EARLY + (TUNE.DEST_SPREAD - TUNE.DEST_SPREAD_EARLY) * ctx.k;
      if (nb <= want) sc += 0.5 - (want - nb) * TUNE.DEST_CROWD * ctx.k;
      else sc -= (nb - want) * TUNE.DEST_FAR;
    }
    let dec = 0;
    for (let yy = y; yy < y + 2; yy++) for (let xx = x; xx < x + 2; xx++) if (s.decor[idx(s, xx, yy)]) dec++;
    sc -= dec * 0.15;
    if (offIsland(s, idx(s, x, y))) sc -= TUNE.ISLAND_PENALTY_DEST;
    return sc;
  }

  /** opts: { anchor:[x,y], anchorRange:[min,max] } — hard Manhattan filter from a point to the footprint. */
  function findDestSpot(s, color, opts) {
    opts = opts || {};
    const b = s.bounds;
    const anchor = opts.anchor || null, range = opts.anchorRange || [0, 999];
    // centroid of same-colour houses
    let cx = 0, cy = 0, n = 0;
    for (let k = 0; k < s.buildings.length; k++) {
      const h = s.buildings[k];
      if (h.kind === 'house' && h.color === color) { cx += h.x; cy += h.y; n++; }
    }
    const ctx = {
      anchor: anchor, centroid: n ? [cx / n, cy / n] : null, k: sprawl(s),
      fHouse: anchor ? null : distField(s, 'house', color), fDest: distField(s, 'dest', -1), fAny: distField(s, null, -1),
    };
    let best = null, bestScore = -Infinity;
    for (let y = b.y0; y <= b.y1 - 1; y++) {
      for (let x = b.x0; x <= b.x1 - 1; x++) {
        if (!inGrid(s, x, y) || !inGrid(s, x + 1, y + 1)) continue;
        const i0 = idx(s, x, y);
        if (!freeLand(s, i0) || !freeLand(s, i0 + 1) || !freeLand(s, i0 + s.w) || !freeLand(s, i0 + s.w + 1)) continue;
        if (anchor) {
          const da = footDist(anchor[0], anchor[1], x, y, 2, 2);
          if (da < range[0] || da > range[1]) continue;
        }
        if (freeBorder(s, x, y, 2, 2, null) < 3) continue;
        if (wouldTrap(s, x, y, 2, 2)) continue;
        // With no bridge or tunnel in stock a destination across the water is an unavoidable
        // death (canyon/islands/delta runs died with 20–45 roads unused), so it is a hard skip;
        // houses only carry the score penalty because a stranded house just means one car fewer.
        if (offIsland(s, i0)) continue;
        const sc = scoreDest(s, x, y, color, ctx);
        if (sc > bestScore) { bestScore = sc; best = [x, y]; }
      }
    }
    return best;
  }

  // ---------------------------------------------------------------------------------------
  // Spawning
  // ---------------------------------------------------------------------------------------
  function addCar(s, house) {
    if (BW.Traffic && typeof BW.Traffic.spawnCar === 'function') {
      const car = BW.Traffic.spawnCar(s, house.id);
      if (car && typeof car.id === 'number' && house.carIds.indexOf(car.id) < 0) house.carIds.push(car.id);
    }
  }

  function noteSpawn(s) {
    if (!s.city) return;
    s.city.spawns++;
    // Bounds growth follows the same ramp as the spread scoring — the scoring can only rearrange
    // the land it is given, so room and the preference for it have to arrive together. The cadence
    // is fractional mid-ramp, hence the accumulator rather than a modulo.
    const every = C.BOUNDS_GROW_EVERY_EARLY + (C.BOUNDS_GROW_EVERY - C.BOUNDS_GROW_EVERY_EARLY) * sprawl(s);
    s.city.boundsAcc = (s.city.boundsAcc || 0) + 1 / Math.max(0.5, every);
    while (s.city.boundsAcc >= 1) { s.city.boundsAcc -= 1; growBounds(s, false); }
  }

  function spawnHouse(s, color, x, y) {
    if (!inGrid(s, x, y)) return null;
    const i = idx(s, x, y);
    if (s.building[i] >= 0 || s.road[i] || s.terrain[i] !== T_LAND) return null;
    const id = s.buildings.length;
    const b = { id: id, kind: 'house', color: color, x: x, y: y, w: 1, h: 1, door: pickDoor(s, x, y, 1, 1), bornT: s.time.t, carIds: [], carCap: C.CARS_PER_HOUSE };
    s.buildings.push(b);
    s.building[i] = id;
    s.decor[i] = 0;
    for (let k = 0; k < b.carCap; k++) addCar(s, b);
    BW.emit(s, { type: 'spawnHouse', id: id });
    noteSpawn(s);
    return b;
  }

  function spawnDest(s, color, x, y) {
    if (!inGrid(s, x, y) || !inGrid(s, x + 1, y + 1)) return null;
    const tiles = [idx(s, x, y), idx(s, x + 1, y), idx(s, x, y + 1), idx(s, x + 1, y + 1)];
    for (let k = 0; k < 4; k++) {
      const i = tiles[k];
      if (s.building[i] >= 0 || s.road[i] || s.terrain[i] !== T_LAND) return null;
    }
    const id = s.buildings.length;
    const week = s.time.week;
    const b = {
      id: id, kind: 'dest', color: color, x: x, y: y, w: 2, h: 2, door: pickDoor(s, x, y, 2, 2), bornT: s.time.t,
      pins: 0, pinCap: week > C.PIN_CAP_LATE_WEEK ? C.PIN_CAP_LATE : C.PIN_CAP, claimed: 0,
      failT: 0, demandT: 0, pinSeq: 0,   // pinSeq = pins this destination has ever raised (drives the arrival ramp)
      rescueT: 0,                        // seconds this full ring has been held open for an inbound car
      demandBase: C.DEMAND_BASE * (1 + C.DEMAND_LATE_SPAWN_BONUS * (week - 1)),
      demandRate: 0, graceT: C.DEMAND_GRACE, served: 0,
    };
    b.demandRate = b.demandBase * (1 + C.DEMAND_GROWTH * (week - 1));
    s.buildings.push(b);
    for (let k = 0; k < 4; k++) { s.building[tiles[k]] = id; s.decor[tiles[k]] = 0; }
    BW.emit(s, { type: 'spawnDest', id: id });
    noteSpawn(s);
    return b;
  }

  /**
   * The colour stream, separate from the spawn stream on purpose. In Versus both players grow the
   * same seed's city, but every candidate-cell scan draws from s.rng and the candidate set depends
   * on where THEY built, so s.rng walks apart within the first minute. Locations are allowed to
   * differ; the palette is not (two players comparing screens expect the same colours to arrive in
   * the same order). Drawing colour from its own fork makes the nth colour choice depend only on
   * the seed and on the counts below, which track each other as long as both spawns landed.
   */
  function colorRng(s) {
    const cs = s.city;
    if (!cs.colorRng) cs.colorRng = BW.makeRng(BW.hashString('bw-color:' + (s.rng.seed >>> 0)));
    return cs.colorRng;
  }

  /**
   * The colour ledger: how many houses and destinations have been ASSIGNED to each colour,
   * counted the moment the colour is chosen — including cluster members and a new colour's intro
   * houses, which are only queued at that point. Reading the live building list instead (what this
   * used to do) makes the weights depend on whether a queued house had landed yet, and that timing
   * follows the spawn stream, which two Versus players do not share. Counting at the decision
   * keeps the weights — and so the colour sequence — a pure function of the colour stream.
   */
  function colorCounts(s) {
    const cs = s.city, t = cs.tally || (cs.tally = { houses: [], dests: [] });
    for (let c = 0; c < s.colors.length; c++) {
      if (t.houses.length <= c) { t.houses.push(0); t.dests.push(0); }
    }
    return t;
  }

  function noteColor(s, color, houses, dests) {
    const t = colorCounts(s), ci = s.colors.indexOf(color);
    if (ci < 0) return;
    t.houses[ci] += houses | 0;
    t.dests[ci] += dests | 0;
  }

  function weightedIndex(s, weights, rng) {
    let total = 0;
    for (let k = 0; k < weights.length; k++) total += weights[k];
    let r = (rng || s.rng).next() * total;
    for (let k = 0; k < weights.length; k++) { r -= weights[k]; if (r < 0) return k; }
    return weights.length - 1;
  }

  function pickHouseColor(s) {
    const cc = colorCounts(s);
    // A colour still waiting on its introduction houses is skipped: a fresh colour has the highest
    // weight, so an ordinary wave would otherwise beat the anchored house to it and plant the
    // colour's first house across the map from its destination. The hold is counted in house waves
    // rather than read off the queue (queue timing is spawn-stream, and must not steer colour).
    const hold = (s.city && s.city.hold) || [];
    const pending = new Set();
    for (let k = 0; k < s.colors.length; k++) if (hold[k] > 0) pending.add(s.colors[k]);
    // Squared so a colour sitting at 3 houses per destination gets its houses well before one at 6:
    // cars per destination is the colour's whole service capacity.
    const w = s.colors.map((c, k) => (pending.has(c) ? 0 : (cc.dests[k] ? Math.pow((cc.dests[k] * 2 + 1) / (cc.houses[k] + 1), 2) : 0.15)));
    if (w.every((v) => v === 0)) return s.colors[0];
    return s.colors[weightedIndex(s, w, colorRng(s))];
  }

  /** Colour for the next destination, or null when no colour can afford one yet. A destination
   *  goes to the colour with the most houses per destination AFTER the spawn, and never to one
   *  it would push under DEST_MIN_HOUSES_RATIO — a colour serving four destinations from twelve
   *  houses is on the brink whatever the player builds. */
  function destWeights(s) {
    const cc = colorCounts(s);
    return s.colors.map((c, k) => {
      const after = cc.houses[k] / (cc.dests[k] + 1);
      return after < C.DEST_MIN_HOUSES_RATIO ? 0 : after * after;
    });
  }

  function pickDestColor(s) {
    const w = destWeights(s);
    if (w.every((v) => v === 0)) return null;
    return s.colors[weightedIndex(s, w, colorRng(s))];
  }

  /** Would a destination wave land a warehouse right now, or is every colour still short of
   *  houses? Draws no randomness (pickDestColor does), so it is safe to poll every step — the
   *  title-screen prime in main.js waits on it. */
  function canSpawnDest(s) { return destWeights(s).some((v) => v > 0); }

  function easeInterval(start, floor, floorWeek, week) {
    const p = Math.max(0, Math.min(1, (week - 1) / Math.max(1, floorWeek - 1)));
    const e = 1 - (1 - p) * (1 - p);          // ease-out: fast early shrink, settling at the floor
    return start + (floor - start) * e;
  }
  const calm = (s) => 1 + (TUNE.CALM_MULT - 1) * Math.max(0, 1 - s.time.t / TUNE.CALM_FADE);
  const jitter = (s, rng) => 1 + ((rng || s.rng).next() * 2 - 1) * TUNE.JITTER;

  function houseInterval(s) { return easeInterval(C.HOUSE_INTERVAL_START, C.HOUSE_INTERVAL_FLOOR, C.HOUSE_INTERVAL_FLOOR_WEEK, s.time.week); }
  function destInterval(s) { return easeInterval(C.DEST_INTERVAL_START, C.DEST_INTERVAL_FLOOR, C.DEST_INTERVAL_FLOOR_WEEK, s.time.week); }

  /** The colour (and cluster size) chosen for the next wave. Held across a failed spot search so a
   *  retry costs no colour draw — a retry happens when the player has built the city full, and
   *  nothing a player builds may move the colour stream. */
  function nextWaveColor(s, kind) {
    const cs = s.city;
    if (cs.pend && cs.pend.kind === kind) return cs.pend;
    const crng = colorRng(s);
    if (kind === 'dest') {
      const color = pickDestColor(s);
      if (color === null) return (cs.pend = null);
      noteColor(s, color, 0, 1);
      return (cs.pend = { kind: kind, color: color, cluster: 1 });
    }
    const color = pickHouseColor(s);
    const cluster = crng.chance(C.HOUSE_CLUSTER_CHANCE) ? crng.int(2, 3) : 1;
    const hold = cs.hold || (cs.hold = []);
    for (let k = 0; k < hold.length; k++) if (hold[k] > 0) hold[k]--;
    noteColor(s, color, cluster, 0);
    return (cs.pend = { kind: kind, color: color, cluster: cluster });
  }

  function spawnHouseWave(s) {
    const cs = s.city;
    const pend = nextWaveColor(s, 'house');
    const color = pend.color, cluster = pend.cluster;
    // Late houses hug the network: the near-road chance ramps up with the week so the growing
    // spawn rate doesn't outrun the road bundle.
    const ramp = Math.max(0, Math.min(1, (s.time.week - 1) / Math.max(1, (C.HOUSE_NEAR_ROAD_LATE_WEEK || 8) - 1)));
    const nearChance = C.HOUSE_NEAR_ROAD_CHANCE + ((C.HOUSE_NEAR_ROAD_CHANCE_LATE || C.HOUSE_NEAR_ROAD_CHANCE) - C.HOUSE_NEAR_ROAD_CHANCE) * ramp;
    const nearRoad = s.rng.chance(nearChance);
    const spot = findHouseSpot(s, color, { nearRoad: nearRoad });
    if (!spot) { growBounds(s, true); cs.houseT = 1.0; return; }
    cs.pend = null;
    const h = spawnHouse(s, color, spot[0], spot[1]);
    for (let k = 1; k < cluster; k++) {
      // relax: true — if the cluster radius is full the member still spawns (nearest scored spot),
      // because the cadence below has already been charged for it
      cs.queue.push({ kind: 'house', color: color, anchorId: h.id, maxDist: TUNE.CLUSTER_RADIUS, relax: true, at: s.time.t + k * TUNE.CLUSTER_GAP });
    }
    // a cluster consumes its members' share of the cadence, so houses/week stays on the curve
    cs.houseT = houseInterval(s) * cluster * calm(s) * jitter(s, colorRng(s));
  }

  function spawnDestWave(s) {
    const cs = s.city;
    const pend = nextWaveColor(s, 'dest');
    if (pend === null) { cs.destT = C.DEST_RETRY; return; }   // every colour is short of houses: demand waits for supply
    const color = pend.color;
    const spot = findDestSpot(s, color);
    if (!spot) { growBounds(s, true); cs.destT = 1.5; return; }
    cs.pend = null;
    spawnDest(s, color, spot[0], spot[1]);
    cs.destT = destInterval(s) * calm(s) * jitter(s, colorRng(s));
  }

  function runQueue(s) {
    const cs = s.city;
    while (cs.queue.length && cs.queue[0].at <= s.time.t) {
      const q = cs.queue.shift();
      const a = s.buildings[q.anchorId];
      // anchorPt (a bare tile) wins over the anchor building: a cross-town colour's intro houses
      // cluster around a point across the map, not around their warehouse.
      const anchor = q.anchorPt ? q.anchorPt : (a ? [a.x + Math.floor((a.w - 1) / 2), a.y + Math.floor((a.h - 1) / 2)] : null);
      if (q.kind === 'house') {
        const spot = findHouseSpot(s, q.color, { anchor: anchor, maxAnchorDist: q.maxDist, minAnchorDist: (!q.anchorPt && a && a.kind === 'dest') ? 2 : 0, relax: q.relax });
        if (spot) { const nb = spawnHouse(s, q.color, spot[0], spot[1]); if (nb && q.intro) nb.intro = true; }
        else if (q.relax) growBounds(s, true);
      }
    }
  }

  // ---------------------------------------------------------------------------------------
  // Bounds growth
  // ---------------------------------------------------------------------------------------
  /** Tiles of the row/column `depth` outside `side` of the bounds rect that count (-1 off-grid).
   *  `anyLand` counts TERRAIN land (occupied or not) — used for "did this step buy any city?",
   *  which must not depend on how much the player has already built; otherwise free land. */
  function lineLand(s, b, side, depth, anyLand) {
    let n = 0;
    if (side === 0 || side === 2) {
      const y = side === 0 ? b.y0 - depth : b.y1 + depth;
      if (y < 0 || y >= s.h) return -1;
      for (let x = b.x0; x <= b.x1; x++) { const i = idx(s, x, y); if (anyLand ? s.terrain[i] === T_LAND : freeLand(s, i)) n++; }
    } else {
      const x = side === 1 ? b.x1 + depth : b.x0 - depth;
      if (x < 0 || x >= s.w) return -1;
      for (let y = b.y0; y <= b.y1; y++) { const i = idx(s, x, y); if (anyLand ? s.terrain[i] === T_LAND : freeLand(s, i)) n++; }
    }
    return n;
  }
  const freeLandAt = (s, b, side, depth) => lineLand(s, b, side, depth, false);
  const lineLen = (b, side) => (side === 0 || side === 2 ? b.x1 - b.x0 + 1 : b.y1 - b.y0 + 1);

  function growBounds(s, force) {
    const b = s.bounds;
    const weights = [0, 0, 0, 0];
    const can = [b.y0 > 0, b.x1 < s.w - 1, b.y1 < s.h - 1, b.x0 > 0];
    for (let side = 0; side < 4; side++) {
      if (!can[side]) continue;
      // Best discounted free-land count within GROW_LOOK rows: land on the edge wins outright,
      // but land on the far bank of a thin strait still pulls (see the TUNE note).
      let w = 0;
      for (let k = 1; k <= TUNE.GROW_LOOK; k++) {
        const free = freeLandAt(s, b, side, k);
        if (free < 0) break;                            // ran off the grid
        const v = free * Math.pow(TUNE.GROW_LOOK_DECAY, k - 1);
        if (v > w) w = v;
      }
      weights[side] = w + TUNE.BOUNDS_BASE_WEIGHT;
    }
    let total = 0;
    for (let k = 0; k < 4; k++) total += weights[k];
    if (total <= 0) return false;
    const side = weightedIndex(s, weights);
    // A row of open water buys no room. The rect is sized in TILES but the buildings need LAND,
    // so on a water map a "growth" into the middle of a strait left the city exactly as cramped
    // as before: Keyhaven's rect held 6.4 tiles of free land per building at week 5 against ~9 on
    // a land map, and 249 of the home key's 262 tiles against 82 of everything else (Nic,
    // 2026-09-20: "far too densely on the central island and barely anything across the rivers").
    // So a step keeps going on the same side until the line it added is majority LAND — which
    // walks the rect over a thin strait in one go and keeps land-per-building on a water map in
    // the same range as a land map. An all-land side always passes on the first step, so plains /
    // bay / lakeland / basin never enter the loop body twice.
    for (let k = 0; k < TUNE.GROW_LOOK; k++) {
      if (side === 0) { if (b.y0 <= 0) break; b.y0--; }
      else if (side === 1) { if (b.x1 >= s.w - 1) break; b.x1++; }
      else if (side === 2) { if (b.y1 >= s.h - 1) break; b.y1++; }
      else { if (b.x0 <= 0) break; b.x0--; }
      if (lineLand(s, b, side, 0, true) * 2 >= lineLen(b, side)) break;   // depth 0 = the line just added
    }
    BW.emit(s, { type: 'boundsGrow' });
    return true;
  }

  // ---------------------------------------------------------------------------------------
  // Colours
  // ---------------------------------------------------------------------------------------
  /**
   * A tile a medium walk from destination `d` to hang a new colour's intro houses on: inside the
   * current bounds, buildable, on the city's land component, and as close to the existing road
   * network as the distance band allows — so the colour's traffic has to cross town on roads the
   * player has already drawn instead of getting a fresh two-tile link of its own.
   * Deterministic (positional hash, never s.rng): only the 30 % roll draws from the spawn stream.
   */
  function farIntroAnchor(s, d) {
    const b = s.bounds;
    const lo = C.FAR_COLOR_DIST[0], hi = C.FAR_COLOR_DIST[1], mid = (lo + hi) / 2;
    const roads = [];
    for (let y = b.y0; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) if (s.road[idx(s, x, y)]) roads.push(x, y);
    let best = null, bestSc = -Infinity;
    for (let y = b.y0; y <= b.y1; y++) {
      for (let x = b.x0; x <= b.x1; x++) {
        if (!inGrid(s, x, y)) continue;
        const i = idx(s, x, y);
        if (!freeLand(s, i)) continue;                       // land, no road, no building
        const da = footDist(x, y, d.x, d.y, d.w, d.h);
        if (da < lo || da > hi) continue;
        if (offIsland(s, i)) continue;                       // unreachable without a crossing in stock
        if (freeBorder(s, x, y, 1, 1, null) < 1) continue;   // a house here could never be served
        let rd = Infinity;
        for (let k = 0; k < roads.length; k += 2) {
          const m = Math.abs(roads[k] - x) + Math.abs(roads[k + 1] - y);
          if (m < rd) { rd = m; if (rd <= 1) break; }
        }
        const jit = (((x * 73856093) ^ (y * 19349663)) >>> 0) % 1024 / 1024;
        let sc = jit * 0.5 - Math.abs(da - mid) * 0.2 - countAround(s, x, y, 1, 1) * 0.15;
        sc -= (rd === Infinity ? 6 : Math.min(rd, 12)) * 0.8;
        if (sc > bestSc) { bestSc = sc; best = [x, y]; }
      }
    }
    return best;
  }

  function introduceColor(s) {
    const cs = s.city;
    const maxColors = Math.min(C.MAX_COLORS, s.map && s.map.palette ? s.map.palette.colors.length : C.MAX_COLORS);
    if (s.colors.length >= maxColors) { cs.newColorAt = -1; return; }
    const c = cs.colorOrder[s.colors.length];
    const spot = findDestSpot(s, c);

 * enemy-town window, the versus results screen — lives in ui/vsui.js.
 *
 * ── The model ─────────────────────────────────────────────────────────────────────────────

 * wins. Nothing crosses between the cities, so there is no shared simulation to keep authoritative
 * — but there IS a shared clock, and that is what the protocol is built around.
 *
 *   TICK = one executed sim step (BW.C.DT). Game.step() only counts a step it actually ran, and
 *   City.step() halts the whole sim at a week end (status 'upgrade'), so BOTH players stop at the
 *   exact same tick every week. Week ends are therefore a barrier that re-synchronises the two
 *   wall clocks ~every 84 s of game time, for free.
 *

 * a player on a slower machine, or one who alt-tabbed, is not punished for it, and a player who
 * ran ahead cannot win by being early. See resolve() for the full rule (including the case where
 * the opponent's death tick is in your own future and you must play on to reach it).
 *
 * ── The enemy town ────────────────────────────────────────────────────────────────────────
 * The opponent's city is reproduced locally as a REPLICA state (`m.foe`): same map, same seed, and
 * the opponent's inputs mirrored at the tick they were applied. The core is deterministic (no
 * Math.random, no wall clock, fixed DT), so the replica matches move for move at a cost of about
 * 0.15 ms per step — a hundredth of what streaming 200 car positions would cost in bandwidth, and
 * it gives the renderer a real state object, so the enemy window is the game, not a diagram.
 *
 * The replica is COSMETIC. Every number that decides the match (score, week, death tick, result)
 * is sent explicitly and never read off the replica. Drift — which can only come from a different
 * JS engine's Math.sin/cos — is caught by a structure checksum every 2 s and by any mirrored input

      const x = snap.b[k + 2], y = snap.b[k + 3];
      const id = s.buildings.length;
      const w = dest ? 2 : 1, h = dest ? 2 : 1;
      const bl = {
        id: id, kind: dest ? 'dest' : 'house', color: snap.b[k + 1], x: x, y: y, w: w, h: h,
        door: snap.b[k + 4], bornT: snap.b[k + 5] / 60,
      };
      if (dest) {
        bl.pins = snap.b[k + 6]; bl.pinCap = snap.b[k + 8] || C.PIN_CAP; bl.claimed = 0;
        bl.failT = snap.b[k + 7] / 1000; bl.demandT = 0; bl.pinSeq = bl.pins; bl.rescueT = 0;
        bl.warning = bl.failT > 0 && bl.pins >= bl.pinCap ? 1 : 0;   // ring is filling (derived, not on the wire)
        bl.demandBase = C.DEMAND_BASE; bl.demandRate = C.DEMAND_BASE; bl.graceT = 0;
        bl.served = snap.b[k + 9];
      } else {
        bl.carIds = []; bl.carCap = snap.b[k + 6] || 1;
      }
      s.buildings.push(bl);
      for (let yy = y; yy < y + h; yy++) {
        for (let xx = x; xx < x + w; xx++) {
          const i = yy * s.w + xx;
          if (i >= 0 && i < n) { s.building[i] = id; s.decor[i] = 0; }
        }
      }
    }

    for (let k = 0; k < snap.m.length; k += 4) {
      const ax = snap.m[k], ay = snap.m[k + 1], bx = snap.m[k + 2], by = snap.m[k + 3];
      const straight = Math.hypot(bx - ax, by - ay);
      s.motorways.push({
        id: s.motorways.length, ax: ax, ay: ay, bx: bx, by: by,
        length: Math.abs(ax - bx) + Math.abs(ay - by),
        straight: straight, bend: BW.Roads.motorwayBend(straight), cars: [],
      });
    }

    s.bounds.x0 = snap.bd[0]; s.bounds.y0 = snap.bd[1]; s.bounds.x1 = snap.bd[2]; s.bounds.y1 = snap.bd[3];
    const iv = snap.iv;
    s.inventory.roads = iv[0]; s.inventory.bridges = iv[1]; s.inventory.tunnels = iv[2];
    s.inventory.motorways = iv[3]; s.inventory.roundabouts = iv[4]; s.inventory.lights = iv[5];
    s.time.t = snap.tm[0]; s.time.day = snap.tm[1]; s.time.week = snap.tm[2]; s.time.dayT = snap.tm[3];
    s.colors = snap.cl.slice();
    s.score = snap.sc;
    s.stats.trips = snap.st[0]; s.stats.roadsPlaced = snap.st[1];
    s.stats.weeksSurvived = snap.st[2]; s.stats.colorsUnlocked = snap.st[3];
    s.roadVersion++;
    s.status = 'playing';
    s.upgradeOffer = null;
    s.events.length = 0;

    if (!s.city) BW.City.init(s);
    if (snap.rg) {
      s.rng.state = snap.rg[0];
      if (s.offerRng && snap.rg[1]) s.offerRng.state = snap.rg[1];
      if (s.city && snap.rg[2]) BW.City.colorRng(s).state = snap.rg[2];
    }
    if (snap.cy) {
      const cs = s.city, c = snap.cy;
      cs.houseT = c.houseT; cs.destT = c.destT; cs.spawns = c.spawns;
      cs.growT = c.growT; cs.growEvery = c.growEvery;
      cs.lastOffer = c.lastOffer; cs.newColorAt = c.newColorAt;
      cs.boundsAcc = c.boundsAcc;
      cs.colorOrder = (c.colorOrder || []).slice();
      cs.queue = JSON.parse(JSON.stringify(c.queue || []));
      cs.tally = c.tally ? { houses: c.tally.houses.slice(), dests: c.tally.dests.slice() } : null;
      cs.hold = (c.hold || []).slice();
      cs.pend = c.pend ? Object.assign({}, c.pend) : null;
      cs.landComp = null; cs.landCompVersion = -1; cs.landCompN = -1;   // a cache; rebuilt on demand
    }

    // Re-staff the houses and rebuild occupancy from the cars that now exist.
    BW.Traffic.init(s);
    for (let k = 0; k < s.buildings.length; k++) {
      const b = s.buildings[k];
      if (b.kind !== 'house') continue;
      for (let c = 0; c < (b.carCap | 0); c++) BW.Traffic.spawnCar(s, b.id);
    }
    BW.Traffic.init(s);
  }

  // ------------------------------------------------------------------------------------
  // Match
  // ------------------------------------------------------------------------------------

  /**
   * One versus match. `opts`:
   *   send(msg)     required — hand a JSON-able message to the transport
   *   on(name,data) optional — lifecycle notifications for the UI
   *   now()         optional — wall clock in ms (injected by the harness)
   *   isHost, mapId, seed, myName, myEmblem, foeName, foeEmblem
   */
  function create(opts) {
    const now = opts.now || (() => (typeof Date !== 'undefined' ? Date.now() : 0));
    const notify = opts.on || function () {};

    const m = {
      proto: PROTO,
      isHost: !!opts.isHost,
      mapId: opts.mapId,
      seed: opts.seed >>> 0,
      myName: opts.myName || 'You',
      myEmblem: opts.myEmblem || '',
      foeName: opts.foeName || 'Opponent',
      foeEmblem: opts.foeEmblem || '',

      me: null,                 // my city — authoritative for me
      foe: null,                // the replica of theirs — cosmetic

      phase: 'live',            // 'live' | 'upgrade' | 'over'
      tick: 0,                  // sim steps I have executed
      foeTick: 0,               // sim steps the replica has executed
      foeHeard: 0,              // highest tick the opponent has reported (an upper bound on replay)
      foeSeenAt: 0,             // wall time of their last message, for the stale-heartbeat test
      acc: 0,                   // local fixed-step accumulator
      alpha: 0,                 // render interpolation for my city
      foeAlpha: 0,

      fastMe: false,            // my 2x vote
      fastFoe: false,           // theirs — 2x needs both (either can drop it)
      pace: 1,                  // leash / catch-up multiplier (see pacing())
      easing: 0,                // -1 easing off (ahead), +1 hurrying (behind), 0 free

      up: null,                 // the live upgrade barrier, see openUpgrade()
      foePick: -1,              // the opponent's pick, waiting for their replica to reach the barrier
      // Barrier traffic that arrived before this machine's own sim got to the week end. It can:
      // the two clocks are only leashed while the opponent is demonstrably running, so a player who
      // alt-tabs can fall far enough behind that the host's 10 s timer fires first. Without these
      // the late side would drop the resolution on the floor and sit at the barrier for ever.
      earlyPick: null,          // { w, i } — their pick
      earlyGo: null,            // { w, a, b } — the host's resolution

      deathTick: -1,
      foeDeathTick: -1,
      result: null,             // 'win' | 'lose' | 'tie' | 'forfeit' | 'left'
      finalMine: null,          // { score, week, trips, roads }
      finalFoe: null,

      // Authoritative opponent numbers (never read off the replica).
      foeScore: 0, foeWeek: 1, foeWarn: 0, foeRoads: 0,

      driftOps: 0, driftCk: 0, lastDrift: null,
      desyncs: 0,               // structure repairs this match — surfaced in the dev overlay
      replicaLoose: false,      // chronic drift: the enemy window is only exact at week barriers
      syncWanted: false,
      wantAgain: false,
      foeWantAgain: false,
      over: false,

      _out: [],                 // messages batched until flush()
      _ops: [],                 // local ops recorded this frame
      _pending: [],             // received op batches, ordered by tick
      _ck: new Map(),           // tick -> their structure hash, checked when the replica gets there
      _lastHb: -1,
    };

    // ---- transport ------------------------------------------------------------------

    function queue(msg) { m._out.push(msg); }

    m.flush = function () {
      if (!m._out.length) return;
      const out = m._out;
      m._out = [];
      for (let k = 0; k < out.length; k++) {
        try { opts.send(out[k]); } catch (e) { /* a dead channel is handled by onDisconnected */ }
      }
    };

    // ---- lifecycle ------------------------------------------------------------------

    m.begin = function () {
      m.me = makeCity(m.mapId, m.seed);
      m.foe = makeCity(m.mapId, m.seed);
      m.phase = 'live';
      m.tick = m.foeTick = m.foeHeard = 0;
      m.foeSeenAt = now();
      notify('begin', m);
      return m;
    };

    /**
     * Record a local action for mirroring, stamped with the tick it was applied on. Called by the
     * Roads wrappers in VS.install().
     *
     * The stamp has to be per-op, not per-frame: at 2x (or while catching up) one frame runs
     * several steps, and a road that arrived between step 9 and step 10 changes what the city does
     * on step 10. Replaying it one tick late is enough to send the whole replica off course.
     */
    m.op = function (op) {
      if (m.phase === 'over') return;
      const last = m._ops[m._ops.length - 1];
      if (last && last.k === m.tick) last.o.push(op);
      else m._ops.push({ k: m.tick, o: [op] });
    };

    // ---- pacing ---------------------------------------------------------------------

    /**
     * Keep the two sims within a couple of seconds of each other WITHOUT ever letting one player
     * freeze the other. Being ahead is eased off (0.55x) only while the opponent is demonstrably
     * still running; being behind is hurried (1.8x). Hysteresis on both so the rate does not
     * chatter. A stale heartbeat (alt-tab, minimised window) releases the leash entirely — their
     * clock will catch up on its own when they come back, and the death-tick rule means neither
     * of them loses anything by it.
     */
    function pacing() {
      const gap = m.tick - m.foeHeard;
      const fresh = (now() - m.foeSeenAt) < TUNE.HB_STALE_MS;
      if (m.easing === -1 && gap < TUNE.LEASH_CLEAR) m.easing = 0;
      if (m.easing === 1 && gap > -TUNE.CATCHUP_CLEAR) m.easing = 0;
      if (m.easing === 0) {
        if (fresh && gap > TUNE.LEASH_AHEAD) m.easing = -1;
        else if (gap < -TUNE.CATCHUP_BEHIND) m.easing = 1;
      }
      if (m.easing === -1 && !fresh) m.easing = 0;
      m.pace = m.easing === -1 ? TUNE.LEASH_MULT : (m.easing === 1 ? TUNE.CATCHUP_MULT : 1);
      return m.pace;
    }

    m.fast = function () { return m.fastMe && m.fastFoe; };

    /** Local 2x vote. 2x needs both players; either dropping their vote drops the speed. */
    m.voteFast = function (want) {
      want = !!want;
      if (m.fastMe === want) return;
      m.fastMe = want;
      queue({ t: 'spd', k: m.tick, v: want ? 1 : 0 });
      m.flush();
      notify('speed', m);
    };

    // ---- the frame ------------------------------------------------------------------

    /**
     * Advance both sims. `cb.onMeStep()` runs after each of my steps (main.js drains s.events
     * there) and `cb.onFoeStep()` after each replica step. Returns the steps taken.
     */
    m.frame = function (dtWall, cb) {
      const res = { me: 0, foe: 0 };
      if (m.phase === 'over') { m.advanceFoe(cb, res); m.flush(); return res; }
      m.tickWall(now());
      if (m.phase === 'live') {
        const mult = (m.fast() ? C.FAST_MULT : 1) * pacing();
        m.acc += dtWall * mult;
        let n = 0;
        while (m.acc >= C.DT && n < TUNE.MAX_STEPS) {
          if (!stepMe(cb)) { m.acc = 0; break; }
          m.acc -= C.DT;
          n++;
        }
        if (n >= TUNE.MAX_STEPS) m.acc = 0;       // dropped frames: don't spiral
        res.me = n;
        m.alpha = Math.min(1, m.acc / C.DT);
      } else {
        m.alpha = 0;
      }
      m.advanceFoe(cb, res);
      if (m.phase === 'live' && m.tick - m._lastHb >= TUNE.HB_TICKS) {
        m._lastHb = m.tick;
        const s = m.me;
        queue({ t: 'hb', k: m.tick, s: s.score, w: s.time.week, n: warnCount(s), r: s.stats.roadsPlaced });
      }
      sendOps();
      m.flush();
      return res;
    };

    function warnCount(s) {
      let n = 0;
      for (let k = 0; k < s.buildings.length; k++) {
        const b = s.buildings[k];
        if (b.kind === 'dest' && b.failT > 0) n++;
      }
      return n;
    }

    /** One message per tick that had input, in tick order. */
    function sendOps() {
      if (!m._ops.length) return;
      for (let i = 0; i < m._ops.length; i++) queue({ t: 'in', k: m._ops[i].k, o: m._ops[i].o });
      m._ops = [];
    }

    /**
     * Publish my city's structure. The receiver throws away every op it has ALREADY received and
     * replays only what arrives afterwards — arrival order, not tick order, is what says whether an
     * op is baked into the snapshot, because an op applied at tick T can land either side of a
     * snapshot taken at tick T. So anything still sitting in the outbox has to go first.
     */
    function sendSync() {
      sendOps();
      queue({ t: 'sync', k: m.tick, d: snapshot(m.me) });
      m.flush();
    }

    /** `cb.onMeStep` exists to drain s.events. It must NOT resolve an upgrade or otherwise move the
     *  sim on — the status this step ended in is what the barrier and the result are built from,
     *  which is why it is read before the callback gets a look in. */
    function stepMe(cb) {
      const s = m.me;
      if (s.status !== 'playing') return false;
      BW.City.step(s, C.DT);
      if (s.status === 'playing') BW.Traffic.step(s, C.DT);
      m.tick++;
      const st = s.status;
      // Taken BEFORE anything else touches the city: a checksum for tick k describes the city at
      // the end of step k and before any input stamped k, which is exactly where the replica takes
      // its own (it replays tick-k input at the top of the next iteration).
      if (m.tick % TUNE.CK_TICKS === 0) queue({ t: 'ck', k: m.tick, h: structHash(s) });
      if (cb && cb.onMeStep) cb.onMeStep(s);
      if (st === 'upgrade') { openUpgrade(); return false; }
      if (st === 'gameover') { onLocalDeath(); return false; }
      // I outlived the tick they died on: the race is decided.
      if (m.foeDeathTick >= 0 && m.tick >= m.foeDeathTick) { finish('win'); return false; }
      return true;
    }

    /**
     * Replay the opponent's inputs into the replica, never past the last tick they have reported —
     * the channel is ordered, so an op stamped tick K always arrives before any later report, and
     * "advance to foeHeard" can never skip one. Ops stamped K are applied AFTER step K (that is
     * where the player applied them) and before step K+1.
     */
    m.advanceFoe = function (cb, res) {
      const s = m.foe;
      if (!s) return;
      let n = 0;
      for (;;) {
        while (m._pending.length && m._pending[0].k <= m.foeTick) {
          const batch = m._pending.shift();
          for (let k = 0; k < batch.o.length; k++) {
            if (!applyOp(s, batch.o[k])) { m.driftOps++; m.lastDrift = batch.k + ':' + batch.o[k].join(','); noteDrift(); }
          }
          s.events.length = 0;
        }
        // The replica stops at its own week barrier and waits for the pick to be resolved.
        if (s.status === 'upgrade') {
          if (m.foePick < 0) break;
          BW.City.chooseUpgrade(s, m.foePick);
          m.foePick = -1;
          s.events.length = 0;
          continue;
        }
        if (s.status !== 'playing') break;
        if (m.foeTick >= m.foeHeard || n >= TUNE.FOE_STEPS) break;
        BW.City.step(s, C.DT);
        if (s.status === 'playing') BW.Traffic.step(s, C.DT);
        m.foeTick++;
        n++;
        if (cb && cb.onFoeStep) cb.onFoeStep(s);
        if (m._ck.size && m._ck.has(m.foeTick)) {
          const want = m._ck.get(m.foeTick);
          m._ck.delete(m.foeTick);
          if (structHash(s) !== want) { m.driftCk++; noteDrift(); }
        }
      }
      if (res) res.foe = n;
      m.foeAlpha = 0;
    };

    /**
     * The replica no longer matches. Ask for a structure snapshot; the owner sends one snapshot
     * per request, so a burst of failed ops cannot turn into a burst of 6 KB messages.
     *
     * Chronic drift means the two machines' Math library genuinely disagrees (a different browser
     * engine — inside V8 the core is exact). Repairing it every 2 s would then cost 3 KB/s forever
     * and never hold, so after DRIFT_GIVE_UP repairs we stop chasing it and let the week-barrier
     * snapshot be the resync. The enemy window is then approximate between weeks, which is what
     * `m.replicaLoose` tells the UI; every number that decides the match is on the wire regardless.
     */
    const DRIFT_GIVE_UP = 4;
    function noteDrift() {
      if (m.phase === 'over') return;
      m.desyncs++;
      if (m.desyncs > DRIFT_GIVE_UP) { m.replicaLoose = true; return; }
      if (m.syncWanted) return;
      m.syncWanted = true;
      queue({ t: 'need', k: m.tick });
      m.flush();
      notify('desync', m);
    }

    // ---- upgrades -------------------------------------------------------------------

    /**
     * Both players hit this at the same tick. The modal owns the only pause in the mode: 10 s to
     * pick, and the moment BOTH have picked it continues. The host is the authority for when that
     * happens (its clock decides the deadline and it echoes both picks back), so the two sides can
     * never resume with different inventories or on different ticks.
     */
    function openUpgrade() {
      m.phase = 'upgrade';
      m.up = {
        week: Math.max(1, m.me.time.week - 1),
        tick: m.tick,
        mine: -1,
        theirs: -1,
        opened: now(),
        resolved: false,
        // Kept because chooseUpgrade clears s.upgradeOffer, and the UI still wants to say which
        // of the two the opponent took once the barrier has lifted.
        offer: m.me.upgradeOffer,
      };
      notify('upgrade', m);
      // Catch up on anything that arrived while we were still short of this tick.
      if (m.earlyPick && m.earlyPick.w === m.up.week) { m.up.theirs = m.earlyPick.i; m.earlyPick = null; notify('foePicked', m); }
      if (m.earlyGo && m.earlyGo.w === m.up.week) {
        const go = m.earlyGo;
        m.earlyGo = null;
        applyUpgrade(go.a, go.b);
        return;
      }
      maybeResolve();
    }

    m.pick = function (i) {
      const up = m.up;
      if (!up || up.resolved || up.mine >= 0) return false;
      up.mine = Math.max(0, i | 0);
      queue({ t: 'up', k: m.tick, w: up.week, i: up.mine });
      m.flush();
      notify('picked', m);
      maybeResolve();
      return true;
    };

    /** Seconds left on the pick timer, for the UI ring. */
    m.pickLeft = function () {
      if (!m.up || m.up.resolved) return 0;
      return Math.max(0, (m.up.opened + TUNE.UPGRADE_MS - now()) / 1000);
    };

    function maybeResolve() {
      const up = m.up;
      if (!up || up.resolved || !m.isHost) return;
      if (up.mine >= 0 && up.theirs >= 0) resolveUpgrade(up.mine, up.theirs);
    }

    /** Host: both picks are in (or the timer ran out). Tell both sides exactly what was taken. */
    function resolveUpgrade(hostPick, joinPick) {
      const up = m.up;
      if (!up || up.resolved) return;
      queue({ t: 'upgo', k: up.tick, w: up.week, a: hostPick, b: joinPick });
      m.flush();
      applyUpgrade(hostPick, joinPick);
    }

    function applyUpgrade(hostPick, joinPick) {
      const up = m.up;
      if (!up || up.resolved) return;
      up.resolved = true;
      up.mine = m.isHost ? hostPick : joinPick;
      up.theirs = m.isHost ? joinPick : hostPick;
      BW.City.chooseUpgrade(m.me, up.mine);
      m.me.events.length = 0;
      m.foePick = up.theirs;      // consumed when the replica reaches its own barrier
      m.phase = 'live';
      m.acc = 0;
      // Free real estate: the tick has not moved, both machines are here, and the grant is already
      // in the inventory — so one structure snapshot now guarantees the enemy window is exactly
      // right at least once a week, whatever happened to the replica in between. It is sent from
      // HERE rather than when the barrier opened because a snapshot restores a RUNNING city: one
      // taken mid-barrier would restart the replica a week's worth of upgrades short.
      sendSync();
      notify('resume', m);
    }

    /** Deadline tick, driven from the frame so the module owns no timers. */
    m.tickWall = function (t) {
      const up = m.up;
      if (!up || up.resolved || m.phase !== 'upgrade') return;
      const over = t >= up.opened + TUNE.UPGRADE_MS;
      if (m.isHost) {
        if (over) resolveUpgrade(up.mine < 0 ? 0 : up.mine, up.theirs < 0 ? 0 : up.theirs);
      } else if (t >= up.opened + TUNE.UPGRADE_MS + TUNE.UPGRADE_GRACE_MS) {
        // The host went quiet. Resume rather than sit here forever; a real drop ends the match
        // through onDisconnected a moment later anyway.
        applyUpgrade(up.theirs < 0 ? 0 : up.theirs, up.mine < 0 ? 0 : up.mine);
      }
    };

    // ---- the result -----------------------------------------------------------------

    function onLocalDeath() {
      if (m.deathTick >= 0) return;
      m.deathTick = m.tick;
      queue({ t: 'dead', k: m.tick, s: m.me.score, w: m.me.time.week });
      m.flush();
      notify('died', m);
      resolve();
    }

    /**
     * Who lasted longer, decided purely on death tick.
     *   both dead      → lower tick loses; equal is a tie
     *   I am dead      → they win as soon as their clock passes my death tick
     *   they are dead  → I win once MY clock reaches their death tick, and not before: until then
     *                    I could still die earlier than they did, and the race is not over. The UI
     *                    is told nothing during that window, so the knowledge cannot change how
     *                    anyone plays.
     */
    function resolve() {
      if (m.over) return;
      const d = m.deathTick, D = m.foeDeathTick;
      if (d >= 0 && D >= 0) return finish(d < D ? 'lose' : (d > D ? 'win' : 'tie'));
      // Their clock REACHING my death tick is enough: had that step killed them too, the 'dead'
      // message would have arrived first (it is flushed inside the step, ahead of the heartbeat).
      if (d >= 0 && m.foeHeard >= d) return finish('lose');
      if (D >= 0 && m.tick >= D) return finish('win');
    }

    function finish(result) {
      if (m.over) return;
      m.over = true;
      m.phase = 'over';
      m.result = result;
      const s = m.me;
      m.finalMine = {
        name: m.myName, emblem: m.myEmblem, score: s.score,
        week: Math.max(0, s.stats.weeksSurvived | 0), trips: s.stats.trips | 0,
        roads: s.stats.roadsPlaced | 0, tick: m.deathTick >= 0 ? m.deathTick : m.tick,
      };
      if (!m.finalFoe) {
        m.finalFoe = {
          name: m.foeName, emblem: m.foeEmblem, score: m.foeScore,
          week: Math.max(0, m.foeWeek - 1), trips: 0, roads: m.foeRoads,
          tick: m.foeDeathTick >= 0 ? m.foeDeathTick : m.foeHeard,
        };
      }
      // Both sides publish their real final city so each results screen shows two true towns.
      sendOps();      // same arrival-order rule as sendSync: the outbox drains before the snapshot
      queue({
        t: 'fin', k: m.tick, r: result, d: snapshot(s),
        f: { score: s.score, week: Math.max(0, s.stats.weeksSurvived | 0), trips: s.stats.trips | 0, roads: s.stats.roadsPlaced | 0 },
      });
      m.flush();
      notify('over', m);
    }

    /** The other side quit or dropped. If a death tick already settles it, that wins; otherwise
     *  the player still here takes the match. */
    m.opponentGone = function () {
      if (m.over) return;
      if (m.deathTick >= 0 || m.foeDeathTick >= 0) { resolve(); if (m.over) return; }
      finish('forfeit');
    };

    /** Leaving on purpose: tell them, then close the match as a loss for us. */
    m.quit = function () {
      if (!m.over) { queue({ t: 'bye', k: m.tick }); m.flush(); }
      m.over = true;
      m.phase = 'over';
      if (!m.result) m.result = 'left';
      notify('over', m);
    };

    m.voteAgain = function () {
      if (m.wantAgain) return;
      m.wantAgain = true;
      queue({ t: 'again', k: m.tick });
