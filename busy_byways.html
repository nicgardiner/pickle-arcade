<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Busy Byways</title>
<style>
/* Busy Byways — all UI styles. Inlined verbatim by build.mjs: no @import, no url(), no fonts.
   Palette variables are set on #app by BW.HUD.setPalette(map); the :root values below are
   the defaults so screens look right before any map palette arrives. */

:root {
  --bg: #f4efe4;
  --bg-rgb: 244 239 228;
  --ink: #3d3a34;
  --ink-rgb: 61 58 52;
  --accent: #e94f4f;
  --accent-rgb: 233 79 79;
  --accent2: #3f7fe0;
  /* The online/versus colour: a deep teal out of the maps' own water family, rather than the
     flat UI blue it was (#3f6fd8, which read as a foreign widget on the warm paper). Teal is the
     one cool hue no building colour claims, so it can't be mistaken for a route colour, and it
     stays quieter than the coral Play button above it. Unlike --accent/--accent2 this is NEVER
     touched by HUD.setPalette, so the Versus button reads the same on every map's palette.
     4.6:1 against white — keep any replacement at or above that. */
  --online: #2f7f8c;
  --online-rgb: 47 127 140;
  /* Trophy gold — also palette-proof, so "Best" reads the same on every map. */
  --trophy: #f7c948;
  --water: #bcd9e6;
  --hill: #e3d6b6;
  --road: #fdfcf8;
  --road-edge: #d9d2c2;
  --grid: #e8e2d4;
  --tree: #b9d4a6;
  --c0: #e94f4f;
  --c1: #3f7fe0;
  --c2: #f2c33c;
  --c3: #48b46f;
  --c4: #9a5fd0;
  --c5: #f28a2e;
  --warn: #e2574f;
  --paper: #fffdf9;
  --panel: rgb(255 253 249 / 0.84);
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-back: cubic-bezier(0.34, 1.4, 0.64, 1);
  --dur: 220ms;
  --radius: 16px;
  --shadow: 0 14px 36px rgb(var(--ink-rgb) / 0.16), 0 2px 6px rgb(var(--ink-rgb) / 0.08);
  --shadow-sm: 0 4px 12px rgb(var(--ink-rgb) / 0.12), 0 1px 3px rgb(var(--ink-rgb) / 0.08);
  --shadow-lift: 0 10px 22px rgb(var(--ink-rgb) / 0.16), 0 2px 5px rgb(var(--ink-rgb) / 0.08);
}

/* ---------- page skeleton ---------- */

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* One scalable unit: 13px at 900 wide, ~14px at 1280, ~17px at 1080p, 24px at 4K (DPR 1).
     Every component sizes in em, so the whole HUD scales with the window. */
  font-size: clamp(13px, 0.4vw + 9.2px, 24px);
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#world {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
#world[data-tool="erase"] { cursor: cell; }
#world[data-tool="roundabout"], #world[data-tool="light"], #world[data-tool="motorway"] { cursor: pointer; }
#world.view-pan { cursor: grab; }          /* 'viewcity': look around, never draw */
#world.panning { cursor: grabbing; }
#world.space-pan { cursor: grab; }

svg.ic {
  width: 1.25em;
  height: 1.25em;
  flex: none;
  display: block;
}

/* ---------- shared controls ---------- */

.btn {
  appearance: none;
  border: 0;
  margin: 0;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: rgb(var(--ink-rgb) / 0.07);
  border-radius: 999px;
  padding: 0.65em 1.4em;
  min-height: 2.7em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  cursor: pointer;
  white-space: nowrap;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease),
              box-shadow var(--dur) var(--ease), color var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.btn:hover { transform: translateY(-2px); background: rgb(var(--ink-rgb) / 0.11); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0) scale(0.98); transition-duration: 80ms; }
.btn:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 6px 16px rgb(var(--accent-rgb) / 0.28); }
.btn.primary:hover { background: var(--accent); filter: brightness(1.06); box-shadow: 0 10px 22px rgb(var(--accent-rgb) / 0.34); }
/* Versus: the only online button on the title screen, so it gets its own colour rather than the
   flat neutral it shared with Settings. Palette-independent (see --online). */
.btn.versus { background: var(--online); color: #fff; box-shadow: 0 6px 16px rgb(var(--online-rgb) / 0.28); }
.btn.versus:hover { background: var(--online); filter: brightness(1.08); box-shadow: 0 10px 22px rgb(var(--online-rgb) / 0.34); }
.btn.versus:focus-visible { outline: 3px solid rgb(var(--online-rgb) / 0.5); }
/* Leaderboard: trophy gold. Dark text, not white — white on this yellow is unreadable. */
.btn.lb { background: var(--trophy); color: #3d2f07; box-shadow: 0 6px 16px rgb(247 201 72 / 0.35); }
.btn.lb:hover { background: var(--trophy); filter: brightness(1.05); box-shadow: 0 10px 22px rgb(247 201 72 / 0.45); }
.btn.lb:focus-visible { outline: 3px solid rgb(247 201 72 / 0.6); }
.btn.big { font-size: 1.15em; padding: 0.75em 1.8em; }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: rgb(var(--ink-rgb) / 0.07); }
.btn .sub { font-weight: 500; opacity: 0.75; font-size: 0.85em; }
.btn[disabled] { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

.rnd {
  appearance: none;
  border: 0;
  margin: 0;
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  width: 2.8em;
  height: 2.8em;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), box-shadow var(--dur) var(--ease), color var(--dur) var(--ease);
}
.rnd:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.rnd:active { transform: scale(0.96); transition-duration: 80ms; }
.rnd:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 2px; }
.rnd .ic { width: 1.35em; height: 1.35em; }

.swatch {
  width: 0.9em;
  height: 0.9em;
  border-radius: 0.3em;
  background: var(--accent);
  flex: none;
  box-shadow: inset 0 -2px 0 rgb(0 0 0 / 0.12);
}

kbd {
  font: inherit;
  font-size: 0.72em;
  font-weight: 600;
  padding: 0.1em 0.5em;
  border-radius: 0.4em;
  background: rgb(var(--ink-rgb) / 0.08);
  color: rgb(var(--ink-rgb) / 0.75);
}

/* ---------- HUD ---------- */

#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 320ms var(--ease);
}
#hud.on { opacity: 1; }
#hud > * { pointer-events: none; }
#hud.on > * { pointer-events: auto; }
/* .hud-bottom spans the map; only the chips inside it are clickable (see its own rule below). */

/* 'viewcity' — a read-only strip over the finished city: score + week ring, nothing to click. */
#hud.view-only > * { pointer-events: none !important; }
#hud.view-only > .hud-bottom,
#hud.view-only > .hud-speed,
#hud.view-only > .hud-warn { display: none; }
#hud.view-only > .hud-score, #hud.view-only > .hud-week { opacity: 0.94; }

.hud-score {
  position: absolute;
  top: 1.1em;
  left: 1.3em;
  padding: 0.55em 1.1em 0.6em;
  background: var(--panel);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  min-width: 5.2em;
  text-align: left;
}
.score-n {
  font-size: 2.3em;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.score-l {
  font-size: 0.78em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  opacity: 0.55;
  margin-top: 0.3em;
}

.hud-week {
  position: absolute;
  top: 0.9em;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.15em;
}
.week-ring {
  width: 4.4em;
  height: 4.4em;
  display: block;
  filter: drop-shadow(0 2px 4px rgb(var(--ink-rgb) / 0.12));
}
.week-ring .ring-track { stroke: rgb(var(--ink-rgb) / 0.12); }
.week-ring .ring-day { stroke: var(--accent); transition: stroke 400ms var(--ease); }
.week-ring .ring-night { stroke: rgb(var(--ink-rgb) / 0.62); }
/* These sit INSIDE a positioning <g> (see hud.js): a CSS transform here replaces the attribute
   transform on its own element, so the swap animation must never share a node with the placement.
   fill-box keeps the spin centred on the glyph rather than on the 100×100 viewBox. */
.week-ring .ring-sun, .week-ring .ring-moon {
  transition: opacity 600ms var(--ease), transform 600ms var(--ease);
  transform-box: fill-box;
  transform-origin: 50% 50%;
}
.week-ring .ring-sun { stroke: #e8b33a; fill: #f6cf5c; }
.week-ring .ring-moon { fill: rgb(var(--ink-rgb) / 0.6); opacity: 0; transform: rotate(-30deg) scale(0.7); }
.hud-week.night .ring-sun { opacity: 0; transform: rotate(40deg) scale(0.6); }
.hud-week.night .ring-moon { opacity: 1; transform: none; }
.week-label {
  font-weight: 700;
  font-size: 0.9em;
  padding: 0.2em 0.8em;
  border-radius: 999px;
  background: var(--panel);
  box-shadow: var(--shadow-sm);
  font-variant-numeric: tabular-nums;
}

.hud-warn {
  position: absolute;
  top: 7.2em;
  left: 50%;
  transform: translate(-50%, -1.2em);
  opacity: 0;
  pointer-events: none !important;
  appearance: none;
  border: 0;
  font: inherit;
  font-weight: 600;
  color: #fff;
  background: var(--warn);
  padding: 0.55em 1.1em 0.55em 0.9em;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  box-shadow: 0 8px 20px rgb(226 87 79 / 0.35);
  cursor: pointer;
  white-space: nowrap;
  transition: transform 260ms var(--ease), opacity 260ms var(--ease);
}
.hud-warn.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto !important; animation: warn-pulse 1.2s ease-in-out infinite; }
.hud-warn:hover { transform: translate(-50%, -2px); }
/* "nothing can get there" is a different problem from "the fleet is late" — draw it darker so the
   two states are not one indistinguishable red pill. */
.hud-warn.stranded { background: #a8362f; }
.hud-warn .swatch { box-shadow: 0 0 0 2px rgb(255 255 255 / 0.85); }
@keyframes warn-pulse {
  0%, 100% { box-shadow: 0 8px 20px rgb(226 87 79 / 0.35); }
  50% { box-shadow: 0 8px 28px rgb(226 87 79 / 0.6); }
}

.hud-toasts {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  gap: 0.45em;
  pointer-events: none;
}
.hud-toasts:empty { display: none; }
.toast {
  display: inline-flex;
  align-items: center;
  gap: 0.55em;
  padding: 0.5em 1em;
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink);
  font-weight: 600;
  font-size: 0.95em;
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
  opacity: 0;
  transform: translateY(0.6em) scale(0.96);
  transition: transform 260ms var(--ease-back), opacity 220ms var(--ease);
}
.toast.in { opacity: 1; transform: none; }
.toast.out { opacity: 0; transform: translateY(-0.4em) scale(0.97); transition: transform 220ms var(--ease), opacity 220ms var(--ease); }

/* Toasts / tool hint / inventory bar, stacked upward from the bottom edge and centred on the
   SCREEN. Full width rather than left: 50%, because a left: 50% flex box only gets the right half
   of the window to shrink-to-fit into and wraps far too early. The column spans the map, so
   nothing in it may eat clicks except the chips themselves. */
.hud-bottom {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 1.2em;
  box-sizing: border-box;
  padding: 0 1.3em;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6em;
}
#hud.on > .hud-bottom { pointer-events: none; }
.hud-bottom .chip { pointer-events: auto; }

.hud-inv {
  align-self: stretch;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 0.5em;
  flex-wrap: wrap;   /* only ever wraps on a phone-width window; see the narrow rule below */
}
.chip {
  appearance: none;
  border: 0;
  margin: 0;
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: var(--panel);
  border-radius: 999px;
  padding: 0.45em 0.9em 0.45em 0.7em;
  min-height: 2.8em;
  display: inline-flex;
  align-items: center;
  gap: 0.45em;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  font-variant-numeric: tabular-nums;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease),
              box-shadow var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.chip[hidden] { display: none; }
.chip:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.chip:active { transform: scale(0.97); transition-duration: 80ms; }
.chip:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 2px; }
.chip.selected { background: var(--ink); color: var(--paper); }
.chip.empty { opacity: 0.55; }
.chip.selected.empty { opacity: 0.8; }
.chip .ic { width: 1.3em; height: 1.3em; }
.chip .chip-n { font-size: 1.05em; min-width: 1.2em; text-align: center; }
.chip.bump { animation: chip-bump 420ms var(--ease-back); }
.chip.shake { animation: chip-shake 360ms var(--ease); }
@keyframes chip-bump {
  0% { transform: scale(1); }
  35% { transform: scale(1.14); }
  100% { transform: scale(1); }
}
@keyframes chip-shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(2px); }
}
.chip.erase-chip.selected { background: var(--warn); }

.hud-tool-hint {
  font-size: 0.85em;
  font-weight: 600;
  padding: 0.35em 0.8em;
  border-radius: 999px;
  background: var(--panel);
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transform: translateY(0.4em);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  pointer-events: none !important;
  white-space: nowrap;
  /* Off = no height at all, so the chips do not sit on an empty gap while the road tool is up. */
  height: 0;
  padding-top: 0;
  padding-bottom: 0;
  overflow: hidden;
}
.hud-tool-hint.on { opacity: 1; transform: none; height: auto; padding-top: 0.35em; padding-bottom: 0.35em; overflow: visible; }
.hud-tool-hint kbd { margin-left: 0.4em; }

.hud-speed {
  position: absolute;
  right: 1.3em;
  bottom: 1.2em;
  display: flex;
  align-items: center;
  gap: 0.5em;
  font-size: 1.3em;   /* the whole cluster is sized in em, so this is the 30% bump */
}
.seg {
  display: inline-flex;
  background: var(--panel);
  border-radius: 999px;
  padding: 0.25em;
  box-shadow: var(--shadow-sm);
  gap: 0.15em;
}
.seg-b {
  appearance: none;
  border: 0;
  margin: 0;
  font: inherit;
  font-weight: 700;
  color: rgb(var(--ink-rgb) / 0.65);
  background: transparent;
  min-width: 2.4em;
  height: 2.3em;
  padding: 0 0.7em;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.seg-b:hover { color: var(--ink); background: rgb(var(--ink-rgb) / 0.06); }
.seg-b:active { transform: scale(0.96); transition-duration: 80ms; }
.seg-b:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 1px; }
.seg-b.active { background: var(--ink); color: var(--paper); }
.seg-b .ic { width: 1.15em; height: 1.15em; }

/* ---------- tooltips ---------- */
/* One reused bubble (BW.Tip in hud.js), opened 750ms after a mouse settles on a HUD control.
   Sized in em off #app so it scales with the rest of the UI; `measuring` is the off-state the
   placement code measures against, so the bubble never flickers at its pre-move position. */
.ui-tip {
  position: fixed;
  z-index: 60;
  max-width: 17em;
  padding: 0.55em 0.8em 0.65em;
  border-radius: 0.75em;
  background: var(--ink);
  color: var(--paper);
  box-shadow: var(--shadow);
  pointer-events: none;
  opacity: 0;
  transform: translateY(0.3em) scale(0.97);
  transform-origin: 50% 100%;
  transition: opacity 140ms var(--ease), transform 180ms var(--ease-back);
  will-change: transform;
}
.ui-tip.measuring { transition: none; }
.ui-tip.on { opacity: 1; transform: none; }
.ui-tip.below { transform-origin: 50% 0; transform: translateY(-0.3em) scale(0.97); }
.ui-tip.below.on { transform: none; }
.ui-tip::after {   /* the little pointer, parked under the control via --tip-arrow */
  content: '';
  position: absolute;
  left: var(--tip-arrow, 50%);
  bottom: -5px;
  width: 10px;
  height: 10px;
  margin-left: -5px;
  background: var(--ink);
  border-radius: 2px;
  transform: rotate(45deg);
}
.ui-tip.below::after { bottom: auto; top: -5px; }
.ui-tip .tip-h {
  display: flex;
  align-items: center;
  gap: 0.5em;
  font-size: 0.92em;
  font-weight: 700;
  letter-spacing: 0.01em;
}
.ui-tip .tip-name { flex: 1 1 auto; }
.ui-tip kbd {
  flex: 0 0 auto;
  background: rgb(var(--bg-rgb) / 0.2);
  color: var(--paper);
  font-size: 0.74em;
  padding: 0.15em 0.5em;
  border-radius: 0.4em;
  font-weight: 700;
}
.ui-tip .tip-b {
  display: block;
  margin-top: 0.3em;
  font-size: 0.8em;
  font-weight: 500;
  line-height: 1.4;
  opacity: 0.75;
}
@media (pointer: coarse) { .ui-tip { display: none; } }

/* ---------- screens ---------- */

#screens {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3vh 3vw;
  box-sizing: border-box;
  pointer-events: auto;
  opacity: 0;
  background: rgb(var(--ink-rgb) / 0.22);
  transition: opacity var(--dur) var(--ease);
}
.screen.in { opacity: 1; }
.screen.out { opacity: 0; pointer-events: none; }
.screen-title, .screen-maps { background: rgb(var(--bg-rgb) / 0.28); }
.screen-gameover { background: rgb(var(--ink-rgb) / 0.34); }

/* "Back to results" pill — the whole UI of the 'viewcity' phase. Lives in #screens (which is
   pointer-events:none) so it floats over the map with no scrim of any kind behind it. */
.view-pill {
  position: absolute;
  left: 50%;
  bottom: 1.6em;
  transform: translate(-50%, 0.8em);
  appearance: none;
  border: 0;
  margin: 0;
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.15);
  backdrop-filter: blur(14px) saturate(1.15);
  border-radius: 999px;
  padding: 0.6em 1.1em 0.6em 0.85em;
  display: inline-flex;
  align-items: center;
  gap: 0.45em;
  cursor: pointer;
  white-space: nowrap;
  pointer-events: auto;
  box-shadow: var(--shadow);
  opacity: 0;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease),
              background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.view-pill.in { opacity: 1; transform: translate(-50%, 0); }
.view-pill:hover { background: var(--panel); box-shadow: var(--shadow-lift); }
.view-pill.in:hover { transform: translate(-50%, -2px); }
.view-pill:active { transition-duration: 80ms; }
.view-pill.in:active { transform: translate(-50%, 0) scale(0.98); }
.view-pill:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 2px; }
.view-pill .ic { width: 1.1em; height: 1.1em; opacity: 0.8; }
.view-pill kbd { margin-left: 0.3em; }

/* game over: "Back to Maps" sits on its own quieter row under the two this-map actions */
.go-alt { margin-top: 0.7em; }
.go-alt .btn { font-size: 0.92em; opacity: 0.8; }
.go-alt .btn:hover { opacity: 1; }

.panel {
  position: relative;
  background: var(--panel);
  -webkit-backdrop-filter: blur(18px) saturate(1.15);
  backdrop-filter: blur(18px) saturate(1.15);
  border-radius: calc(var(--radius) * 1.5);
  box-shadow: var(--shadow);
  padding: 2.2em 2.6em;
  box-sizing: border-box;
  max-width: min(94vw, 40em);
  max-height: 94vh;
  overflow: auto;
  overscroll-behavior: contain;
  text-align: center;
  transform: translateY(1em) scale(0.985);
  transition: transform var(--dur) var(--ease);
}
.screen.in .panel { transform: none; }
.screen.out .panel { transform: translateY(0.6em) scale(0.99); }

.panel h1, .panel h2, .panel h3 { margin: 0; font-weight: 800; letter-spacing: -0.02em; }
.panel h2 { font-size: 1.9em; line-height: 1.1; }
.panel h3 { font-size: 1.05em; }
.panel p { margin: 0; }
.eyebrow {
  font-size: 0.8em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  opacity: 0.55;
  margin-bottom: 0.5em;
}
.stack { display: flex; flex-direction: column; align-items: stretch; gap: 0.6em; }
.row { display: flex; align-items: center; justify-content: center; gap: 0.7em; flex-wrap: wrap; }
.panel-head {
  display: flex;
  align-items: center;
  gap: 0.8em;
  margin-bottom: 1.2em;
  text-align: left;
}
.panel-head h2 { flex: 1; }

/* title */
.title-panel { padding: 2.6em 3.2em 2.2em; min-width: min(90vw, 22em); }
.brand { display: flex; align-items: center; justify-content: center; gap: 0.5em; margin-bottom: 0.2em; }
.brand-mark { width: 2.6em; height: 2.6em; display: block; filter: drop-shadow(0 4px 8px rgb(var(--accent-rgb) / 0.3)); }
.wordmark {
  font-size: 3.4em;
  line-height: 1;
  letter-spacing: -0.04em;
  font-weight: 800;
  color: var(--ink);
}
.wordmark .road-line {
  display: block;
  height: 0.16em;
  margin: 0.12em auto 0;
  width: 78%;
  border-radius: 999px;
  background:
    repeating-linear-gradient(90deg, var(--paper) 0 0.28em, transparent 0.28em 0.6em) center / 100% 0.05em no-repeat,
    var(--ink);
}
/* The tagline under the wordmark and the "Best on …" footer were removed on 2026-09-15; the
   brand block carries the bottom margin they used to supply. */
.title-panel .brand { margin-bottom: 1.4em; }
.title-panel .stack { width: 100%; }

/* confirm (Restart / Main menu) — cancel LEFT, confirm RIGHT, as in every other Pickle dialog */
.confirm-panel { max-width: 26em; text-align: center; }
.confirm-panel h2 { margin-bottom: 0.35em; }
/* `.panel` prefix on purpose: `.panel p { margin: 0 }` above outranks a bare `.confirm-body`,
   which is why this paragraph used to sit flush against the buttons. */
.panel .confirm-body { margin: 0 0 2.1em; opacity: 0.7; font-weight: 500; font-size: 0.95em; }

/* maps */
.maps-panel { max-width: min(94vw, 66em); width: 100%; padding: 1.8em 2em 2em; }
.maps-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.9em;
}
@media (max-width: 1100px) { .maps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1100px) and (max-height: 700px) { .maps-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.map-card {
  appearance: none;
  border: 0;
  margin: 0;
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border-radius: var(--radius);
  padding: 0.55em 0.55em 0.8em;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 0.45em;
  min-width: 0;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.map-card:hover:not([disabled]) { transform: translateY(-4px); box-shadow: var(--shadow-lift); }
.map-card:active:not([disabled]) { transform: translateY(-1px) scale(0.99); transition-duration: 80ms; }
.map-card:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 2px; }
.map-card[disabled] { cursor: default; }
.map-card[disabled] .map-thumb-wrap { filter: saturate(0.4); opacity: 0.7; }
.map-card[disabled] .map-name, .map-card[disabled] .map-blurb { opacity: 0.55; }
.map-thumb-wrap { position: relative; border-radius: calc(var(--radius) - 5px); overflow: hidden; }
.map-thumb { display: block; width: 100%; aspect-ratio: 24 / 17; }
.map-lock {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
}
.map-lock .ic { width: 2em; height: 2em; }
.map-name { font-weight: 800; font-size: 1.05em; padding: 0 0.3em; display: flex; align-items: center; gap: 0.4em; }
.map-blurb { font-size: 0.82em; opacity: 0.7; padding: 0 0.3em; line-height: 1.3; min-height: 2.6em; }
.map-best {
  font-size: 0.8em;
  font-weight: 700;
  padding: 0 0.3em;
  display: flex;
  align-items: center;
  gap: 0.35em;
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}
.map-best .ic { width: 1em; height: 1em; color: var(--trophy); }
.map-best.locked { color: rgb(var(--ink-rgb) / 0.7); }
.map-best.locked .ic { color: inherit; }
/* The unlocked best sits on the bottom edge of the map thumbnail, centred, over a scrim so it
   stays readable on both pale sand and dark water. */
.map-thumb-wrap .map-best {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  justify-content: center;
  gap: 0.4em;
  font-size: 0.95em;
  font-weight: 800;
  padding: 1.1em 0.5em 0.42em;
  opacity: 1;
  color: #fff;
  text-shadow: 0 1px 3px rgb(0 0 0 / 0.55);
  background: linear-gradient(to top, rgb(0 0 0 / 0.55), rgb(0 0 0 / 0.28) 55%, rgb(0 0 0 / 0));
  pointer-events: none;
}
.map-thumb-wrap .map-best .ic {
  width: 1.15em;
  height: 1.15em;
  filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.5));
}
/* The map holding the player's overall best: gold ring, bigger glowing trophy, gold number and
   a "Your best" ribbon in the thumbnail's top-left corner. */
.map-card.top .map-thumb-wrap { box-shadow: 0 0 0 3px var(--trophy), 0 0 18px rgb(247 201 72 / 0.55); }
.map-thumb-wrap .map-best.top { color: var(--trophy); font-size: 1.05em; }
.map-thumb-wrap .map-best.top .ic {
  width: 1.55em;
  height: 1.55em;
  stroke-width: 2.4;
  fill: rgb(247 201 72 / 0.35);
  filter: drop-shadow(0 0 5px rgb(247 201 72 / 0.9)) drop-shadow(0 1px 2px rgb(0 0 0 / 0.6));
  animation: trophy-shine 2.4s ease-in-out infinite;
}
@keyframes trophy-shine { 0%, 100% { transform: none; } 50% { transform: scale(1.12) rotate(-6deg); } }
.map-top-tag {
  position: absolute;
  top: 0.5em;
  left: 0.5em;
  display: flex;
  align-items: center;
  gap: 0.3em;
  padding: 0.25em 0.65em 0.25em 0.5em;
  border-radius: 999px;
  background: var(--trophy);
  color: #3d2f07;
  font-size: 0.72em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  box-shadow: 0 2px 6px rgb(0 0 0 / 0.25);
  pointer-events: none;
}
.map-top-tag .ic { width: 1.1em; height: 1.1em; fill: currentColor; }
@media (prefers-reduced-motion: reduce) { .map-thumb-wrap .map-best.top .ic { animation: none; } }

/* leaderboard */
.lb-panel { max-width: min(94vw, 34em); width: 100%; }
.lb-sub { margin: 0.2em 0 1em; opacity: 0.6; font-weight: 600; font-size: 0.9em; }
.lb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.3em; }
.lb-row, .lb-me {
  display: grid;
  grid-template-columns: 2.4em 1fr auto 4.5em;
  align-items: center;
  gap: 0.6em;
  padding: 0.5em 0.8em;
  border-radius: var(--radius);
  background: rgb(var(--ink-rgb) / 0.05);
  text-align: left;
  font-variant-numeric: tabular-nums;
}
.lb-rank { font-weight: 800; opacity: 0.6; text-align: center; }
.lb-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-map { font-size: 0.85em; opacity: 0.6; white-space: nowrap; }
.lb-score { font-weight: 800; text-align: right; }
.lb-row.empty { opacity: 0.35; }
.lb-m1 { background: rgb(247 201 72 / 0.32); }
.lb-m2 { background: rgb(176 184 196 / 0.32); }
.lb-m3 { background: rgb(205 127 50 / 0.25); }
.lb-m1 .lb-rank, .lb-m2 .lb-rank, .lb-m3 .lb-rank { opacity: 1; }
.lb-row.me { box-shadow: inset 0 0 0 2px var(--accent); }
.lb-me { margin-top: 0.8em; background: rgb(var(--accent-rgb) / 0.12); }
.lb-me-l { font-weight: 800; grid-column: 1 / span 1; }
.lb-me .lb-me-l:only-child { grid-column: 1 / -1; text-align: center; font-weight: 600; opacity: 0.75; }
.lb-me-rank { font-weight: 800; }
.lb-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 0.9em; }
.lb-status { font-size: 0.75em; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.55; }
.lb-status[data-s="live"] { color: var(--online); opacity: 1; }
.lb-status[data-s="offline"], .lb-status[data-s="postfailed"] { color: var(--accent); opacity: 0.9; }
/* upgrade */
.upgrade-panel { max-width: min(94vw, 44em); }
.bundle {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  margin: 0.9em auto 1.3em;
  padding: 0.5em 1.1em;
  border-radius: 999px;
  background: rgb(var(--ink-rgb) / 0.06);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.bundle .ic { width: 1.3em; height: 1.3em; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9em; }
@media (max-width: 640px) { .opts { grid-template-columns: 1fr; } }
.opt {
  appearance: none;
  border: 0;
  margin: 0;
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border-radius: var(--radius);
  padding: 1.4em 1.2em 1.2em;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35em;
  cursor: pointer;
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.opt:hover { transform: translateY(-5px); box-shadow: var(--shadow-lift); }
.opt:active { transform: translateY(-2px) scale(0.99); transition-duration: 80ms; }
.opt:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 2px; }
.opt-ic {
  width: 3.4em;
  height: 3.4em;
  border-radius: 1.1em;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgb(var(--accent-rgb) / 0.12);
  color: var(--accent);
  margin-bottom: 0.3em;
  transition: transform var(--dur) var(--ease-back);
}
.opt:hover .opt-ic { transform: scale(1.08); }
.opt-ic .ic { width: 1.9em; height: 1.9em; }
.opt-name { font-weight: 800; font-size: 1.1em; }
.opt-desc { font-size: 0.85em; opacity: 0.7; }
.opt-count {
  margin-top: 0.5em;
  font-weight: 800;
  font-size: 0.9em;
  padding: 0.2em 0.7em;
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font-variant-numeric: tabular-nums;
}
.opt kbd { position: absolute; top: 0.7em; right: 0.7em; }

/* pause / gameover / settings */
.pause-panel { min-width: min(90vw, 20em); }
.pause-panel h2, .gameover-panel h2, .settings-panel h2 { margin-bottom: 1em; }
.pause-panel .stack { margin-top: 0.2em; }

.gameover-panel { min-width: min(92vw, 26em); }
.gameover-panel h2 { margin-bottom: 0.2em; }
.go-score {
  font-size: 4.2em;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  margin: 0.15em 0 0.05em;
}
.go-score-l { font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.55; }
.go-best {
  margin: 1em auto 1.2em;
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  opacity: 0.85;
}
.go-best .ic { width: 1.1em; height: 1.1em; }
.badge {
  font-size: 0.75em;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 0.25em 0.7em;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 260ms var(--ease), transform 360ms var(--ease-back);
}
.badge.on { opacity: 1; transform: none; }
.stats { display: flex; justify-content: center; gap: 0.6em; margin-bottom: 1.4em; }
.stat {
  flex: 1 1 0;
  background: rgb(var(--ink-rgb) / 0.06);
  border-radius: var(--radius);
  padding: 0.7em 0.5em;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.1em;
  min-width: 5em;
}
.stat b { font-size: 1.4em; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 0.75em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.55; }

.settings-panel { min-width: min(92vw, 26em); text-align: left; }
.settings-panel h2 { text-align: center; }
.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1em;
  padding: 0.6em 0.2em;
  font-weight: 700;
}
.vol-row { cursor: pointer; }
.vol {
  --p: 100%;
  appearance: none;
  -webkit-appearance: none;
  flex: 1;
  min-width: 0;
  height: 0.5em;
  margin: 0;
  border-radius: 999px;
  background: linear-gradient(to right, var(--accent) var(--p), rgb(var(--ink-rgb) / 0.18) var(--p));
  cursor: pointer;
}
.vol::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 1.4em;
  height: 1.4em;
  border-radius: 999px;
  background: #fff;
  box-shadow: 0 2px 5px rgb(0 0 0 / 0.25), 0 0 0 2px var(--accent);
}
.vol:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 4px; }
.vol-val { min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
.howto { margin: 0.8em 0 1.4em; padding: 1em 1.1em; border-radius: var(--radius); background: rgb(var(--ink-rgb) / 0.05); }
.howto h3 { margin-bottom: 0.5em; }
.howto ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5em; }
.howto li { display: flex; align-items: center; gap: 0.7em; font-size: 0.92em; line-height: 1.3; }
.howto li .ic { color: var(--accent); width: 1.4em; height: 1.4em; }
.settings-panel .row { justify-content: center; }

/* ---------- Pickle Arcade layer ----------
   The Exit Game confirm and the player chip (BW.Launcher). Both are appended to #app so they
   inherit the game's font and the live map palette, and both sit above the game's own ceiling
   (the highest z-index anywhere else here is 60). */

#gl-exit-confirm {
  position: absolute;
  inset: 0;
  z-index: 9000;
  display: none;                 /* BW.Launcher flips this to flex */
  align-items: center;
  justify-content: center;
  padding: 3vh 3vw;
  box-sizing: border-box;
  background: rgb(var(--ink-rgb) / 0.34);
}
#gl-exit-confirm .glx-panel { max-width: 26em; transform: none; }
#gl-exit-confirm .glx-title { margin-bottom: 0.35em; }
#gl-exit-confirm .glx-body { margin: 0 0 1.3em; opacity: 0.7; font-weight: 500; font-size: 0.95em; }

/* "Exit Game" is the last button on the title screen: same shape as the others, warmer colour,
   so it reads as leaving rather than playing. */
.btn.gl-exit { color: var(--warn); background: rgb(226 87 79 / 0.1); }
.btn.gl-exit:hover { background: rgb(226 87 79 / 0.18); }

#gl-player-chip {
  position: absolute;
  left: 1.2em;
  top: 1.2em;
  z-index: 8000;
  display: none;                 /* flex once a playerName arrives, menus only */
  align-items: center;
  gap: 0.4em;
  font-weight: 700;
  font-size: 0.95em;
  color: var(--ink);
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.15);
  backdrop-filter: blur(14px) saturate(1.15);
  border-radius: 999px;
  padding: 0.4em 0.9em 0.4em 0.7em;
  box-shadow: var(--shadow-sm);
  opacity: 0.8;
  pointer-events: none;
  max-width: 14em;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
#gl-player-chip .glc-em { font-size: 1.1em; line-height: 1; }

/* ---------- versus (online) ---------- */
/* #vs sits between the HUD and the screens: the enemy town floats over the map, and any panel
   still covers it. The layer itself never eats a click — only the window inside it does. */

/* No z-index on purpose: #vs sits between #hud and #screens in the DOM, so it paints over the HUD
   and UNDER every panel. Giving it a stacking context put the enemy town on top of the upgrade
   modal. */
#vs {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.vs-foe {
  position: absolute;
  top: 1.1em;
  right: 1.3em;
  width: 17em;
  background: var(--panel);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  pointer-events: auto;
  cursor: zoom-in;
  opacity: 0;
  transform: translateY(-0.5em) scale(0.98);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease-back),
              width var(--dur) var(--ease), top var(--dur) var(--ease), right var(--dur) var(--ease);
}
.vs-foe.on { opacity: 1; transform: none; }
.vs-foe:hover:not(.big) { box-shadow: var(--shadow-lift); }

/* Expanded: a large window the player can zoom and pan. The city behind it keeps running —
   there is no pause in versus, and covering the whole screen would hide that. */
.vs-foe.big {
  top: 50%;
  right: 50%;
  width: min(54em, 78vw);
  transform: translate(50%, -50%);
  cursor: default;
  box-shadow: var(--shadow);
}
.vs-foe.big.on { transform: translate(50%, -50%); }
.vs-foe.big .vs-foe-head { padding-right: 2.8em; }

.vs-foe-head {
  display: flex;
  align-items: center;
  gap: 0.45em;
  padding: 0.5em 0.75em 0.45em;
  font-weight: 700;
  font-size: 0.92em;
}
.vs-foe-em { font-size: 1.1em; line-height: 1; }
.vs-foe-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.vs-foe-score {
  margin-left: auto;
  font-variant-numeric: tabular-nums;
  font-size: 1.15em;
  font-weight: 800;
}

.vs-foe-view { position: relative; }
.vs-foe-view canvas {
  display: block;
  width: 100%;
  height: 10.6em;
  background: var(--bg);
  transition: height var(--dur) var(--ease);
}
.vs-foe.big .vs-foe-view canvas { height: min(30em, 56vh); cursor: grab; }
.vs-foe.big .vs-foe-view canvas:active { cursor: grabbing; }

.vs-foe-status {
  position: absolute;
  left: 50%;
  bottom: 0.6em;
  transform: translateX(-50%);
  padding: 0.25em 0.7em 0.3em;
  border-radius: 999px;
  background: rgb(var(--ink-rgb) / 0.72);
  color: var(--paper);
  font-size: 0.72em;
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  transition: opacity var(--dur) var(--ease);
  pointer-events: none;
}
.vs-foe-status.on { opacity: 1; }

.vs-foe-foot {
  display: flex;
  align-items: center;
  gap: 0.5em;
  padding: 0.4em 0.75em 0.55em;
  font-size: 0.76em;
  font-weight: 600;
  opacity: 0.7;
}
.vs-foe-warn {
  color: var(--warn);
  opacity: 0;
  font-weight: 700;
}
.vs-foe-warn.on { opacity: 1; animation: warn-pulse 1.2s ease-in-out infinite; }
.vs-foe-hint { margin-left: auto; opacity: 0.6; font-weight: 500; }
.vs-foe.big .vs-foe-hint { display: none; }

.vs-foe-close {
  position: absolute;
  top: 0.45em;
  right: 0.5em;
  appearance: none;
  border: 0;
  font: inherit;
  width: 1.8em;
  height: 1.8em;
  border-radius: 999px;
  background: rgb(var(--ink-rgb) / 0.08);
  color: var(--ink);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
}
.vs-foe.big .vs-foe-close { display: flex; }
.vs-foe-close:hover { background: rgb(var(--ink-rgb) / 0.16); }

/* HUD in versus: no pause button, and 2x is a vote that needs both players.
   `.seg-b` sets display: inline-flex, which beats the UA rule for [hidden] — hence the explicit one. */
#hud.versus .seg-b[hidden] { display: none; }
#hud.versus .seg-b.voted { background: rgb(var(--accent-rgb) / 0.3); }
#hud.versus .seg-b.foe-voted { box-shadow: inset 0 0 0 2px rgb(var(--accent-rgb) / 0.5); }

/* ---- lobby panels ---- */

.vs-menu-panel { max-width: min(94vw, 26em); }
/* `.panel` prefix for the same reason as `.confirm-body` — it outranks `.panel p { margin: 0 }`. */
.panel .vs-blurb { margin: 0.9em 0 1.9em; opacity: 0.7; font-weight: 500; }
.vs-you { margin-top: 1.1em; font-size: 0.82em; opacity: 0.6; }
.vs-note { margin-top: 1em; font-size: 0.82em; opacity: 0.6; }

.vs-room-panel { max-width: min(94vw, 26em); }
/* Breathing room under "Your room" — it sat right on top of the code block. Set on the heading
   so every body state (code, "Opening a room…", an error) gets the same gap. */
.vs-room-panel h2 { margin-bottom: 1em; }
/* …and above Cancel, which was flush against the note under the code. */
.vs-room-panel .row { margin-top: 1.5em; }
.vs-code-l { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.55; font-weight: 700; }
.vs-code {
  font-size: 3.1em;
  font-weight: 800;
  letter-spacing: 0.18em;
  margin: 0.05em 0 0.25em;
  text-indent: 0.18em;   /* letter-spacing hangs off the last glyph; pull the block back to centre */
}
.vs-spin { font-weight: 600; opacity: 0.7; margin: 0.6em 0 0.2em; animation: vs-breathe 1.8s ease-in-out infinite; }
@keyframes vs-breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
.vs-error { color: var(--warn); font-weight: 600; margin: 0.8em 0; }

.vs-browse-panel { max-width: min(94vw, 34em); }
.vs-rooms { display: flex; flex-direction: column; gap: 0.45em; margin: 0.4em 0 1em; min-height: 7em; }
.vs-empty { opacity: 0.6; font-weight: 500; padding: 2em 0; }
.vs-room {
  appearance: none;
  border: 0;
  font: inherit;
  display: flex;
  align-items: center;
  gap: 0.7em;
  padding: 0.7em 0.9em;
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: var(--shadow-sm);
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.vs-room:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.vs-room-host { font-weight: 700; }
.vs-room-map { opacity: 0.65; font-size: 0.88em; }
.vs-room-code {
  margin-left: auto;
  font-weight: 800;
  letter-spacing: 0.1em;
  background: rgb(var(--ink-rgb) / 0.07);
  border-radius: 999px;
  padding: 0.15em 0.6em 0.2em;
  font-size: 0.85em;
}
.vs-code-row { display: flex; gap: 0.6em; justify-content: center; }
.vs-code-in {
  appearance: none;
  font: inherit;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-align: center;
  text-transform: uppercase;
  width: 6.5em;
  padding: 0.6em 0.5em;
  border: 0;
  border-radius: 999px;
  background: rgb(var(--ink-rgb) / 0.07);
  color: var(--ink);
}
.vs-code-in:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); }

.vs-start-panel { max-width: min(94vw, 30em); }
.vs-vs { display: flex; align-items: center; justify-content: center; gap: 0.6em; font-size: 1.4em; }
.vs-vs b { font-size: 0.72em; opacity: 0.5; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
.vs-count { font-size: 4.6em; font-weight: 800; line-height: 1.1; }
.vs-count.pop { animation: vs-pop 380ms var(--ease-back); }
@keyframes vs-pop { from { transform: scale(0.6); opacity: 0.2; } to { transform: none; opacity: 1; } }

/* ---- the shared upgrade modal ---- */

.vs-timer {
  position: relative;
  height: 0.5em;
  margin: 1.2em 0 0.5em;
  border-radius: 999px;
  background: rgb(var(--ink-rgb) / 0.1);
  overflow: visible;
}
.vs-timer-bar {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: var(--accent);
  transform-origin: 0 50%;
  transition: transform 120ms linear;
}
.vs-timer-t {
  position: absolute;
  right: 0;
  top: -1.9em;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  opacity: 0.6;
}
.vs-upgrade-panel.urgent .vs-timer-bar { background: var(--warn); }
.vs-upgrade-panel.urgent .vs-timer-t { opacity: 1; color: var(--warn); }
.vs-wait { display: flex; align-items: center; justify-content: center; gap: 0.45em; font-size: 0.88em; opacity: 0.75; font-weight: 600; }
.vs-upgrade-panel .opt.chosen { box-shadow: inset 0 0 0 3px var(--accent); }
.vs-upgrade-panel .opt[disabled] { opacity: 0.55; cursor: default; }
.vs-upgrade-panel .opt.chosen[disabled] { opacity: 1; }

/* ---- results: both towns, side by side ---- */

.vs-over-panel { max-width: min(96vw, 68em); width: 100%; padding: 1.6em 1.8em 1.8em; }
.vs-banner { margin: 0.05em 0 0.7em; font-size: 2.4em; }
.vs-banner.won { color: var(--accent); }
.vs-banner.lost { opacity: 0.65; }
.vs-towns { display: flex; gap: 1em; align-items: stretch; }
.vs-town {
  flex: 1 1 0;
  min-width: 0;
  background: var(--paper);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  cursor: zoom-in;
  transition: flex-grow var(--dur) var(--ease), opacity var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.vs-town.win { box-shadow: 0 0 0 2px var(--accent), 0 0 0 7px rgb(var(--accent-rgb) / 0.16), var(--shadow-sm); }
/* Click a town to give it three quarters of the row; the other stays a readable thumbnail. */
.vs-town.solo { flex-grow: 3; }
.vs-town.hushed { opacity: 0.6; }
.vs-town-head { display: flex; align-items: center; gap: 0.45em; padding: 0.55em 0.8em 0.5em; font-weight: 700; }
.vs-town-em { font-size: 1.1em; line-height: 1; }
.vs-town-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.vs-town-crown { margin-left: auto; color: var(--gold, #e0a92e); display: flex; }
.vs-town-crown .ic { width: 1.1em; height: 1.1em; }
.vs-town-cv { display: block; width: 100%; height: min(30em, 46vh); background: var(--bg); }
.vs-town-stats { display: flex; justify-content: center; gap: 1.4em; padding: 0.6em 0.5em 0.7em; font-size: 0.86em; }
.vs-town-stats span { display: flex; flex-direction: column; opacity: 0.7; }
.vs-town-stats b { font-size: 1.5em; font-weight: 800; opacity: 1; font-variant-numeric: tabular-nums; }
.vs-again-note { margin-top: 0.7em; font-size: 0.85em; opacity: 0.65; min-height: 1.2em; font-weight: 600; }

@media (max-width: 860px) {
  /* Stacked, so the main axis is now the HEIGHT — and `flex: 1 1 0` would give every town a
     basis of 0 in a container whose own height is auto, collapsing all of them to nothing. */
  .vs-towns { flex-direction: column; }
  .vs-town, .vs-town.solo, .vs-town.hushed { flex: 0 0 auto; }
  .vs-town-cv { height: min(14em, 24vh); }
  .vs-over-panel { padding: 1.1em 1.2em 1.3em; }
  .vs-banner { font-size: 1.9em; }
  .vs-town.hushed { opacity: 1; }
  .vs-foe:not(.big) { width: 12.5em; }
  .vs-foe:not(.big) .vs-foe-view canvas { height: 7.6em; }
}

/* ---------- touch / motion ---------- */

/* On a phone-width window the bottom row cannot hold the tool bar AND the speed cluster, and the
   bar may wrap onto a second row. Send the speed cluster to the free top-right corner, tighten
   the chips, and lift the hint and toasts clear of a two-row bar. */
@media (max-width: 700px) {
  .hud-speed { top: 1.1em; bottom: auto; font-size: 1.15em; }
  .chip { padding: 0.4em 0.7em 0.4em 0.55em; gap: 0.35em; }
  .hud-inv { gap: 0.4em; }
  /* ... which is where the enemy town lives, so in versus it drops below the speed cluster. */
  .vs-foe:not(.big) { top: 4.6em; }
}

@media (pointer: coarse) {
  .chip, .rnd, .seg-b, .btn { min-height: 44px; }
  .rnd { width: 44px; height: 44px; }
  .chip:hover, .rnd:hover, .btn:hover, .opt:hover, .map-card:hover:not([disabled]) { transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}

</style>

<script>
/* ===== core/constants.js ===== */
/* Busy Byways — every tunable number lives here. Core modules read BW.C only. */
(function (BW) {
  'use strict';

  BW.C = {
    // --- simulation -------------------------------------------------------
    DT: 1 / 60,                 // fixed sim step (s)
    FAST_MULT: 2.5,             // speed 2 multiplier

    // --- grid / city ------------------------------------------------------
    GRID_W: 48,
    GRID_H: 34,
    START_BOUNDS_W: 16,
    START_BOUNDS_H: 11,
    // Grow bounds one tile (one side) every N building spawns. This, not the placement scoring, sets
    // how much elbow room exists: at 4 the city held a flat 6.6 tiles per building and no amount of
    // spread scoring could beat that packing; 3 gives 9.1. On 2026-09-15 (Nic: "a little more spread
    // out as the city expands") the late-game cadence went 4 → 3 while the opening keeps 4, on the
    // ramp in City.TUNE (SPREAD_FROM_WEEK / SPREAD_FULL_WEEK) that the placement scoring rides.
    // 3 was tried flat once before and was cut for sprawl — "by week 8 new destinations landed 8–12
    // tiles from their nearest house" — but that was with DEST_HOUSE_MAX 16; at 10 the tether holds
    // and the distance from a new building to its nearest same-colour partner moves only 5.8 → 6.0
    // tiles (`node harness/spawn-spread.mjs --diff`).
    // 2026-09-15 (second spread pass): 3 → 2 late. Scoring can only rearrange the land it is given,
    // so a stronger preference for elbow room is wasted unless the bounds keep up — this is the
    // lever that actually raises tiles-of-city-per-building. The opening still keeps 4.
    BOUNDS_GROW_EVERY: 2,
    BOUNDS_GROW_EVERY_EARLY: 4,

    // --- geometry (tile = 1.0) --------------------------------------------
    ROAD_W: 0.62,
    LANE_OFF: 0.16,             // lane centre offset from road centre (right-hand traffic)
    CAR_L: 0.51,                // 1.5x the original 0.34 (chunkier cars)
    CAR_W: 0.30,                // 1.5x the original 0.20
    MIN_GAP: 0.63,              // minimum centre-to-centre spacing along a lane (tiles); must stay > CAR_L
    HOUSE_SIZE: 0.72,           // drawn size of a 1x1 house
    DEST_SIZE: 2,

    // --- cars -------------------------------------------------------------
    CAR_SPEED: 2.2,             // tiles / s on plain road
    CAR_TURN_SPEED: 1.6,        // speed while inside a turning tile
    CAR_ACCEL: 5.0,             // tiles / s^2
    CAR_BRAKE: 9.0,
    MOTORWAY_SPEED: 6.4,
    PARK_TIME: 1.4,             // seconds parked at a destination
    HOME_DWELL: 0.8,            // seconds at home before becoming idle again
    FADE_TIME: 0.6,             // seconds for a 'fading' car to vanish
    DISPATCH_BUDGET: 3,         // dispatch searches per tick
    STUCK_TIME: 45,             // seconds stopped before a car is considered stuck (harness)
    LIGHT_GREEN: 4.0,           // seconds per green phase
    LIGHT_ALLRED: 0.8,
    ROUNDABOUT_CAP: 4,
    COST_INTERSECTION: 0.35,
    COST_LIGHT: 0.6,
    COST_ROUNDABOUT: 0.1,
    COST_MOTORWAY_PER_TILE: 0.25,
    COST_CONGESTION: 0.5,       // extra cost per car currently on a tile at dispatch time

    // --- time -------------------------------------------------------------
    DAY_LEN: 12,                // seconds per day
    DAYS_PER_WEEK: 7,
    DAY_START_T: 0.12,          // dayT at game start (mid-morning; night is 0.76..1 and 0..0.07)

    // --- inventory / upgrades --------------------------------------------
    // 2026-09-15: Nic, playing the 44/36+3→64 bundle — "around 200 served I have 70+ roads while
    // comfortably winning". Roads were never the constraint, so the whole grant curve is cut to
    // ~60 % of what it was, flat across the game: cumulative tiles through week N
    // (44,80,119,161,206,254,305,359,416,476,539,603 → 26,47,70,95,122,151,182,215,250,287,325,363)
    // hold a 0.59–0.60 ratio from the start bundle to week 12. Placement is the skill now; running
    // short mid-week is the intended pressure, not a bug.
    START_ROADS: 26,            // was 44
    WEEKLY_ROADS: 21,           // was 36
    WEEKLY_ROADS_GROWTH: 2,     // the bundle grows by this many tiles each week (spawns/week keep rising) ...
    WEEKLY_ROADS_MAX: 38,       // ... up to this (reached at week 10, as 64 was at week 11)
    MOTORWAY_MIN_LEN: 3,
    MOTORWAY_MAX_LEN: 14,
    // tunnel 2→6: measured hill-band crossing widths inside the late-game bounds (harness data,
    // 8 seeds × the two hill maps) are p50 5 / p90 5 on basin and p50 6 / p75 7 on canyon, so a
    // 2-pack could never cut a mountain — one 6-pack now crosses a typical ridge. Water bands are
    // p50 3 on river/canyon/islands/delta (minimum crossing 2 everywhere), so bridge stays at 3.
    UPGRADE_COUNTS: { roundabout: 1, light: 1, motorway: 1, bridge: 3, tunnel: 6 },

    // --- demand / failure --------------------------------------------------
    PIN_CAP: 6,
    PIN_CAP_LATE: 8,            // destinations spawned after this week get the bigger cap
    PIN_CAP_LATE_WEEK: 6,
    // Fleet arithmetic (balance-sim, 2026-09-14): a car completes a trip every ~9–10 s on a fresh
    // network and ~13–17 s once the city has spread and junctions queue, so one car delivers
    // 0.06–0.1 pins/s. The spawn cadence gives ~5.3 houses per destination. At 1/4.5 pins/s a
    // destination needed ~70 % of its share of the fleet by week 4 — every run, even with
    // unlimited roads, was on the brink from week 3. 1/6 puts a well-connected destination at
    // ~45 % utilisation, so it takes real congestion (a doubled trip time) to close it.
    DEMAND_BASE: 1 / 6,         // pins per second at week 1
    DEMAND_GROWTH: 0.05,        // +5 % per week
    DEMAND_LATE_SPAWN_BONUS: 0.03, // extra rate multiplier per week of spawn age
    DEMAND_GRACE: 6,            // seconds before a new destination's first pin
    DEMAND_PER_CAR: 0.05,       // pins/s a colour's destinations may ask for per same-colour car (shared between
                                // that colour's destinations) — a destination never demands more than ~half of
                                // what its fleet could deliver, so a fresh colour with two houses is a puzzle,
                                // not a countdown (0.12 was above what a car can physically do)
    FAIL_TIME: 22,              // seconds for the fail ring to fill
    FAIL_DRAIN: 8,              // seconds for a full ring to drain
    // Last-second reprieve. A full ring does not end the game while a car is about to score at
    // that destination (Nic, 2026-09-15: "the car was literally inside the warehouse already and
    // I still lost because it went in but hadn't scored yet" — a parked car waits out PARK_TIME
    // before its delivery counts). The reprieve is capped per ring-fill so a car stuck in a jam a
    // tile away cannot hold the game open indefinitely.
    FAIL_RESCUE_ETA: 3,         // seconds-to-score that counts as "about to make it"
    FAIL_RESCUE_MAX: 5,         // most seconds one full ring may be held open waiting for it
    // A brand-new warehouse used to fill at a flat rate, so with the week multipliers a fresh
    // destination spawned in week 6 went from empty to game over in ~53 s — too little time to
    // notice it, plan a link and draw it. Its first N pins now take (1 + DEST_RAMP·(k−1)) × the
    // normal interval (pin 1 is untouched, so the arrival still reads the same); after N pins the
    // rate returns to demandEff exactly, so a mature destination is no easier than before.
    // With 0.25/8 an unconnected fresh destination survives ≥ 60 s at 1× at every week up to ~16
    // (worst case week 6: 6 s grace + 40.7 s of pins + 22 s of ring = 68.7 s; it was 53 s).
    DEST_RAMP: 0.25,
    DEST_RAMP_PINS: 8,          // covers the largest pin cap (PIN_CAP_LATE), so the ramp always completes

    // --- spawning ---------------------------------------------------------
    // House cadence slowed three times now (2026-09-15): ×4/3, ×4/3 again, then ×10/7 on Nic's
    // "reduce the number of houses per warehouse to 70% of what it is now".
    // 7.0/2.6 gave ~5.3–5.5 houses per destination, 9.3/3.45 gave ~4.7–5.1, 12.4/4.6 gave ~3.6,
    // this pair measures 2.68 against the old 3.76 — 71 % of it. Slowing houses rather than speeding
    // destinations keeps the destination cadence — and the trips-per-warehouse a player has to plan
    // for — where the 2026-09-14 flow rebalance put it. DEST_MIN_HOUSES_RATIO below has to move with
    // it every time. Re-measure over all 8 maps × 3 seeds; one map alone is too noisy to read.
    HOUSE_INTERVAL_START: 18.2, // was 12.4 (9.3, 7.0 before that)
    HOUSE_INTERVAL_FLOOR: 6.8,  // was 4.6 (3.45, 2.6 before that)
    HOUSE_INTERVAL_FLOOR_WEEK: 10,
    DEST_INTERVAL_START: 38,
    DEST_INTERVAL_FLOOR: 20,
    DEST_INTERVAL_FLOOR_WEEK: 10,
    HOUSE_CLUSTER_CHANCE: 0.4,
    HOUSE_NEAR_ROAD_CHANCE: 0.35, // a house beside an existing road costs no tiles (was 0.25) ...
    HOUSE_NEAR_ROAD_CHANCE_LATE: 0.55, // ... ramping to this by HOUSE_NEAR_ROAD_LATE_WEEK: late houses hug the network
    HOUSE_NEAR_ROAD_LATE_WEEK: 8,
    NEW_COLOR_WEEKS: [2, 4, 6, 8, 10],
    // Cross-town colours: once the city has this many destinations, a new colour has this chance
    // to arrive with its houses clustered a medium walk AWAY from its warehouse instead of beside
    // it, so the player's existing network has to carry that colour across town. It already
    // happened occasionally by accident; this makes it deliberate and measurable.
    FAR_COLOR_MIN_DESTS: 3,     // destinations in the city, counting the new colour's own
    FAR_COLOR_CHANCE: 0.3,
    FAR_COLOR_DIST: [7, 12],    // Manhattan tiles, destination footprint → intro-cluster anchor
    MAX_COLORS: 6,
    HOUSE_GROW_START_WEEK: 3,
    HOUSE_GROW_INTERVAL: 18,    // s between a house growing to two cars (was 50: ~2 a week, invisible)
    CARS_PER_HOUSE: 1,
    DEST_MIN_DIST_HOUSES: 7,    // Manhattan distance from same-colour house centroid
    DEST_MIN_DIST_DESTS: 4,
    DEST_MIN_HOUSES_RATIO: 1.6, // a colour gets a new destination only if it keeps ≥ this many houses per
                                // destination (else the wave waits DEST_RETRY s) — starved late colours at
                                // 3 cars per destination were behind most "did nothing wrong" deaths.
                                // 4→3→2.25→1.6, tracking the three house-cadence cuts above: the gate has
                                // to move with the supply or it starves destinations instead of protecting
                                // colours (at 3 it would simply stall the destination wave outright).
    DEST_RETRY: 4,

    // --- ui ---------------------------------------------------------------
    MAP_UNLOCK_SCORE: 250,
    CAMERA_PAD: 2.0,            // tiles of padding around bounds
  };
})(globalThis.BW = globalThis.BW || {});


/* ===== core/rng.js ===== */
/* Busy Byways — seeded RNG (mulberry32). All core randomness goes through s.rng. */
(function (BW) {
  'use strict';

  BW.hashString = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  };

  BW.makeRng = function (seed) {
    let a = (typeof seed === 'string' ? BW.hashString(seed) : (seed >>> 0)) || 0x9e3779b9;
    const rng = {
      seed: a,
      next() {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      range(lo, hi) { return lo + (hi - lo) * rng.next(); },
      int(lo, hi) { return lo + Math.floor(rng.next() * (hi - lo + 1)); }, // inclusive
      pick(arr) { return arr.length ? arr[Math.floor(rng.next() * arr.length)] : undefined; },
      chance(p) { return rng.next() < p; },
      shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(rng.next() * (i + 1));
          const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      },
      fork(label) { return BW.makeRng((a ^ BW.hashString(String(label))) >>> 0); },
      /** Internal state, for snapshot/restore (harnesses that scrub time). */
      get state() { return a; },
      set state(v) { a = v >>> 0; },
    };
    return rng;
  };
})(globalThis.BW = globalThis.BW || {});


/* ===== core/state.js ===== */
/* Busy Byways — shared state factory. Shape is documented in DESIGN.md ("Shared state"). */
(function (BW) {
  'use strict';

  BW.T_LAND = 0;
  BW.T_WATER = 1;
  BW.T_HILL = 2;

  BW.ROAD_PLAIN = 0;
  BW.ROAD_BRIDGE = 1;
  BW.ROAD_TUNNEL = 2;

  BW.FEAT_NONE = 0;
  BW.FEAT_ROUNDABOUT = 1;
  BW.FEAT_LIGHT = 2;

  /**
   * Create a fresh game state for `map` (a BW.Maps descriptor) and `seed`.
   * Does NOT build terrain or place buildings — BW.Maps.build(s, id) and BW.City.init(s) do that.
   */
  BW.createState = function (map, seed) {
    const C = BW.C;
    const w = (map && map.w) || C.GRID_W;
    const h = (map && map.h) || C.GRID_H;
    const n = w * h;
    const cx = Math.floor(w / 2), cy = Math.floor(h / 2);
    const bw = C.START_BOUNDS_W, bh = C.START_BOUNDS_H;
    const s = {
      seed: seed,
      rng: BW.makeRng(seed),
      map: map,
      w: w,
      h: h,
      terrain: new Uint8Array(n),
      decor: new Uint8Array(n),
      road: new Uint8Array(n),
      roadKind: new Uint8Array(n),
      feature: new Uint8Array(n),
      building: new Int16Array(n).fill(-1),
      buildings: [],
      cars: [],
      motorways: [],
      inventory: { roads: C.START_ROADS, bridges: 0, tunnels: 0, motorways: 0, roundabouts: 0, lights: 0 },
      // dayT starts mid-morning: the renderer's night spans the day rollover (0.76..1 and 0..0.07),
      // so a game that began at dayT 0 would open in the dark.
      time: { t: 0, day: 0, week: 1, dayT: C.DAY_START_T },
      score: 0,
      status: 'playing',
      bounds: {
        x0: cx - Math.floor(bw / 2), y0: cy - Math.floor(bh / 2),
        x1: cx - Math.floor(bw / 2) + bw - 1, y1: cy - Math.floor(bh / 2) + bh - 1,
      },
      colors: [],
      events: [],
      upgradeOffer: null,
      roadVersion: 0,
      stats: { trips: 0, roadsPlaced: 0, longestRoute: 0, carsSpawned: 0, weeksSurvived: 0, colorsUnlocked: 0 },
