/* ===== ui/launcher.js ===== */
/* Busy Byways — Pickle Arcade integration layer.
   Everything the LAUNCHER needs and the game itself does not: GameSDK stats/achievements, the
   Exit Game button + confirm overlay, and the player chip. Every hook is feature-checked, so the
   game still runs exactly the same standalone (dev.html, a bare browser, the harnesses).

   Installed by main.js at the end of init: BW.Launcher.install(Game).
   Stat keys and achievement ids are STRING LITERALS at the call site on purpose — the library's
   `npm test` reads them straight out of the built HTML and cross-checks games.json. */
(function (BW) {
  'use strict';

  const RUSH_HOUR_CARS = 60;   // cars on the road at once for the 'rush_hour' achievement
  const LIFETIME_TRIPS = 5000; // deliveries across every run for the 'served_5000' achievement

  function sdk() { return (typeof window !== 'undefined' && window.GameSDK) || null; }

  /** #app, so both overlays inherit the game's font and the current map's palette variables. */
  function host() { return document.getElementById('app') || document.body; }

  // ---- stats & achievements -----------------------------------------------------------
  // Only a real player game counts: the title screen runs its own autopilot city, which places
  // motorways and fills the map with cars, and none of that is the player's doing.

  // 'total_trips' is only banked at game over, so the LIFETIME count while a run is in flight is
  // the banked stat plus this run's own trips. The banked half is read once per run and cached —
  // a served event fires several times a second and getStats() parses localStorage every call.
  let tripsBanked = -1;   // banked total_trips for the run in progress, -1 = not read yet
  let tripsSeen = 0;      // last s.stats.trips seen, so a restart re-reads the banked half
  let tripsDone = false;  // already unlocked this session, stop looking

  function checkLifetimeTrips(S, runTrips) {
    if (tripsDone) return;
    if (tripsBanked < 0 || runTrips < tripsSeen) {
      tripsBanked = ((S.getStats && S.getStats().total_trips) | 0) || 0;
    }
    tripsSeen = runTrips;
    if (tripsBanked + runTrips >= LIFETIME_TRIPS) {
      tripsDone = true;
      S.unlockAchievement('served_5000', 'Five Thousand Served');
    }
  }

  function onEvent(game, s, ev) {
    if (!game.isPlayerGame) return;
    const S = sdk();
    if (!S) return;
    if (ev.type === 'motorwayPlaced') {
      S.unlockAchievement('express_lane', 'Express Lane');
    } else if (ev.type === 'served' || ev.type === 'newDay') {
      if (s.cars && s.cars.length >= RUSH_HOUR_CARS) S.unlockAchievement('rush_hour', 'Rush Hour');
      if (ev.type === 'served') checkLifetimeTrips(S, (s.stats && s.stats.trips) | 0);
    }
  }

  /** Called after Game.onGameOver has built its payload (score, best, stats, week). */
  function recordRun(game, data) {
    const S = sdk();
    if (!S || !game.isPlayerGame) return;
    const stats = (data && data.stats) || {};
    const score = data.score | 0;
    const weeks = typeof stats.weeksSurvived === 'number'
      ? stats.weeksSurvived
      : Math.max(0, ((data.week | 0) - 1));
    const maps = (BW.Maps && BW.Maps.list) ? BW.Maps.list() : [];
    const unlocked = maps.filter((m) => game.isUnlocked(m.id)).length;

    S.setStat('best_score', score, true);
    S.setStat('best_week', weeks, true);
    S.setStat('maps_unlocked', unlocked, true);
    S.incrementStat('total_runs');
    if (stats.trips > 0) S.incrementStat('total_trips', stats.trips | 0);
    if (stats.roadsPlaced > 0) S.incrementStat('roads_placed', stats.roadsPlaced | 0);
    // This run is banked now, so the cache is stale — the next run re-reads it. Re-check straight
    // off the banked total as a backstop, in case no served event caught the crossing.
    tripsBanked = -1;
    if (!tripsDone && ((S.getStats && S.getStats().total_trips) | 0) >= LIFETIME_TRIPS) {
      tripsDone = true;
      S.unlockAchievement('served_5000', 'Five Thousand Served');
    }

    S.unlockAchievement('first_city', 'First City');
    if (score >= 250) S.unlockAchievement('score_250', 'Two Fifty');
    if (score >= 600) S.unlockAchievement('score_600', 'Six Hundred');
    if (weeks >= 6) S.unlockAchievement('week_six', 'Six Weeks Running');
    if (maps.length && unlocked >= maps.length) S.unlockAchievement('cartographer', 'Cartographer');
  }

  // ---- exit game ----------------------------------------------------------------------
  // The launcher opens games fullscreen with no title bar, so this is the way out. The ids are
  // fixed by the library's onboarding contract; the look is the game's own confirm panel.

  let exitEl = null;

  function buildExit() {
    if (exitEl || typeof document === 'undefined') return;
    const ov = document.createElement('div');
    ov.id = 'gl-exit-confirm';
    ov.style.display = 'none';
    ov.innerHTML =
      '<div class="panel glx-panel">' +
        '<h2 class="glx-title">Exit Game?</h2>' +
        '<p class="glx-body">Your best score for each map is already saved.</p>' +
        '<div class="row">' +
          '<button type="button" class="btn" id="gl-exit-no">Cancel</button>' +
          '<button type="button" class="btn primary" id="gl-exit-yes">Exit</button>' +
        '</div>' +
      '</div>';
    host().appendChild(ov);
    exitEl = ov;
    ov.querySelector('#gl-exit-no').addEventListener('click', hideExit);
    ov.querySelector('#gl-exit-yes').addEventListener('click', function () { window.close(); });
    // Clicking the scrim backs out too, the way every other overlay in this game does.
    ov.addEventListener('click', function (e) { if (e.target === ov) hideExit(); });
    // Capture phase: BW.Screens listens for Escape on the same window, and must not see this one.
    document.addEventListener('keydown', function (e) {
      if (!exitOpen()) return;
      const k = BW.keyId ? BW.keyId(e) : e.key;
      if (k === 'Escape') { e.stopPropagation(); e.preventDefault(); hideExit(); }
    }, true);
  }

  function exitOpen() { return !!exitEl && exitEl.style.display !== 'none'; }

  function showExit() {
    buildExit();
    if (!exitEl) return;
    exitEl.style.display = 'flex';
    const no = exitEl.querySelector('#gl-exit-no');
    if (no) { try { no.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }

  function hideExit() {
    if (!exitEl) return;
    exitEl.style.display = 'none';
  }

  // ---- player chip --------------------------------------------------------------------
  // Emblem + name from the launcher's query string, shown on the main menu only.

  let chipEl = null;

  function buildChip() {
    if (chipEl || typeof document === 'undefined') return;
    const el = document.createElement('div');
    el.id = 'gl-player-chip';
    el.style.display = 'none';
    host().appendChild(el);
    chipEl = el;
    let name = '', emblem = '';
    try {
      const q = new URLSearchParams(location.search);
      name = (q.get('playerName') || '').trim();
      emblem = (q.get('playerEmblem') || '').trim();
    } catch (e) { return; }
    if (!name) return;                     // no name → the chip never shows at all
    const em = document.createElement('span');
    em.className = 'glc-em';
    em.textContent = emblem;               // textContent only: both values are user-controlled
    el.appendChild(em);
    el.appendChild(document.createTextNode(name));
    el.dataset.ready = '1';
  }

  function syncChip(on) {
    if (!chipEl || chipEl.dataset.ready !== '1') return;
    const want = on ? 'flex' : 'none';
    if (chipEl.style.display !== want) chipEl.style.display = want;
  }

  // ---- install ------------------------------------------------------------------------

  function install(game) {
    if (!game || game.__glInstalled) return;
    game.__glInstalled = true;
    buildExit();
    buildChip();

    if (Array.isArray(game.listeners)) {
      game.listeners.push(function (s, ev) {
        try { onEvent(game, s, ev); } catch (e) { /* never let tracking break the game */ }
      });
    }

    const gameOver = game.onGameOver;
    game.onGameOver = function () {
      gameOver.call(game);
      try { recordRun(game, game.goData || {}); } catch (e) { /* ignore */ }
    };

    // The chip belongs to the main menu. screens.update runs every frame off the object, so this
    // wrapper sees every screen change including the ones screens.js makes internally.
    const scr = game.screens;
    if (scr && scr.update) {
      const update = scr.update;
      scr.update = function (s, dt) {
        update(s, dt);
        syncChip(scr.current === 'title');
      };
    }
  }

  BW.Launcher = { install, showExit, hideExit, exitOpen, recordRun };
})(globalThis.BW = globalThis.BW || {});


/* ===== ui/leaderboard.js ===== */
/* Busy Byways — BW.LB: the global leaderboard (Pickle Arcade's leaderboard-sdk.js).
   ONE board for the whole game, one entry per player: their best score on ANY map, solo or
   versus, with the map it was set on in meta.map. Every score funnels through Game.noteBest, so
   wrapping that one function catches both kinds of run.

   window.LeaderboardSDK is appended by the launcher's preload at DOMContentLoaded — after this
   script has run — and is absent in a bare browser tab, so it is polled for, and without it the
   Leaderboard buttons simply never appear. Installed by main.js: BW.LB.install(Game). */
(function (BW) {
  'use strict';

  const BOARD = 'busy_byways';
  const SDK_WAIT_MS = 5000;
  const ROWS = 10;

  let game = null;
  let sdk = null;
  let posting = false;
  let posted = 0;           // highest score submitted OK this session — never re-posted, so a
                            // board that still reads lower can't loop reconcile → post → refresh
  let status = 'Syncing…';
  let data = null;          // last board(): { top, me, rank }
  let view = null;          // the open leaderboard screen's paint(), or null

  function available() { return !!sdk; }

  function mapName(id) {
    const m = BW.Maps && BW.Maps.get ? BW.Maps.get(id) : null;
    return m ? m.name : String(id || '');
  }

  /** The player's best score over every map, and which map it was set on. */
  function localBest() {
    let best = { score: 0, mapId: null };
    const maps = BW.Maps && BW.Maps.list ? BW.Maps.list() : [];
    maps.forEach((m) => {
      const v = game.bestFor(m.id) | 0;
      if (v > best.score) best = { score: v, mapId: m.id };
    });
    return best;
  }

  function setStatus(t) { status = t; if (view) view(); }

  async function post(score, mapId) {
    if (!sdk || posting || !(score > posted)) return;
    posting = true;
    setStatus('Posting…');
    try {
      await sdk.submit(BOARD, score, { map: mapName(mapId), mapId: mapId });
      posted = score;
      posting = false;
      await refresh();
    } catch (e) {
      posting = false;
      setStatus('Post failed');   // the next refresh's reconcile retries it
    }
  }

  async function refresh() {
    if (!sdk) return;
    setStatus('Syncing…');
    try {
      data = await sdk.board(BOARD, { limit: ROWS });
      setStatus('Live');
      // Reconcile: a best set offline, or before the board existed, is posted now.
      const lb = localBest();
      const mine = data.me ? data.me.score | 0 : 0;
      if (lb.score > mine) post(lb.score, lb.mapId);
    } catch (e) {
      setStatus('Offline');
    }
  }

  // ---- the screen ----------------------------------------------------------------------

  function build(opts, ctx) {
    const from = (opts && opts.from) || 'title';
    const back = () => ctx.show(from);
    const scr = ctx.panel('leaderboard', 'lb-panel',
      '<div class="panel-head"><button type="button" class="btn ghost" data-act="back">' + ctx.svg('back') + 'Back</button><h2>Leaderboard</h2></div>' +
      '<div class="lb-sub">Best score on any map</div>' +
      '<ol class="lb-list"></ol>' +
      '<div class="lb-me"></div>' +
      '<div class="lb-foot"><span class="lb-status"></span><button type="button" class="btn ghost lb-refresh" data-act="refresh">Refresh</button></div>');
    const list = scr.querySelector('.lb-list');
    const me = scr.querySelector('.lb-me');
    const st = scr.querySelector('.lb-status');
    const primary = ctx.on(scr, '[data-act="back"]', back);
    ctx.on(scr, '[data-act="refresh"]', () => refresh());

    const cell = (cls, text) => { const s = document.createElement('span'); s.className = cls; s.textContent = text; return s; };

    function paint(first) {
      // A status change after this screen was replaced unhooks it instead of painting a dead node.
      if (!first && ctx.screens.current !== 'leaderboard') { if (view === paint) view = null; return; }
      st.textContent = status;
      st.dataset.s = status.replace(/\W/g, '').toLowerCase();
      const top = (data && data.top) || [];
      list.textContent = '';
      for (let i = 0; i < ROWS; i++) {
        const e = top[i];
        const li = document.createElement('li');

        me.appendChild(cell('lb-me-rank', data.rank ? '#' + data.rank : '—'));
        me.appendChild(cell('lb-map', data.me.meta && data.me.meta.map ? data.me.meta.map : ''));
        me.appendChild(cell('lb-score', String(data.me.score | 0)));

    const noteBest = g.noteBest;

/* ===== main.js ===== */
/* Busy Byways — game glue: fixed-step loop, phases, event fan-out. See DESIGN.md "BW.Game". */
(function (BW) {
  'use strict';
  const C = BW.C;

  // Tiny persistence wrapper (localStorage may be unavailable / throw in some contexts).
  const store = {
    prefix: 'byways_',
    get(key, def) {
      try {
        const v = localStorage.getItem(store.prefix + key);
        return v === null ? def : JSON.parse(v);
      } catch (e) { return def; }
    },
    set(key, val) {
      try { localStorage.setItem(store.prefix + key, JSON.stringify(val)); } catch (e) { /* ignore */ }
    },
  };

  /**
   * Title-screen priming (see Game.primeTitleCity). The menus sit on a live background city, and
   * a brand-new one is one house and one warehouse on empty land — nothing to look at, and the
   * second warehouse is still 32 s away. So the background sim is fast-forwarded before the title
   * appears, to the first moment the town could support a THIRD warehouse: two warehouses up,
   * roads drawn, a handful of cars running, and the third due a few seconds later.
   *
   * Shaping the town is not enough on its own: a week-1 warehouse raises a pin about every 6 s, so
   * the break can easily land on a moment when every car is parked in its driveway and the menu
   * opens on what looks like a screenshot (measured: cars were still in 119 of 312 sampled title
   * seconds across 8 maps × 3 seeds, and one seed took 12 real seconds to move at all). So the
   * prime ends with a WARM-UP: release the demand each warehouse has been banking and step on
   * until traffic is actually rolling. See primeTitleCity.
   */
  const PRIME = {
    MAX_T: 240,     // sim seconds — a hard stop, so a pathological map can never stall the boot
    HOLD: 5,        // while waiting, the dest clock is pinned here so a third can't slip out early
    LEAD: 7,        // sim seconds from the title appearing to the third warehouse (~12 s at 0.6×)
    COLOR_GAP: 22,  // a new colour brings its own warehouse: pushed this far past the third
    WARM_CARS: 2,   // cars that must be driving before the title is allowed to appear
    WARM_MAX_T: 15, // sim seconds — a hard stop, in case a town simply has nowhere to drive
    WARM_SPEED: 0.05,  // tiles/s over which a car counts as moving rather than parked or braked
  };

  function destCount(s) {
    let n = 0;
    for (let k = 0; k < s.buildings.length; k++) if (s.buildings[k].kind === 'dest') n++;
    return n;
  }

  /** Cars actually driving — parked in a driveway or stopped at a light doesn't count. */
  function movingCars(s) {
    let n = 0;
    for (let k = 0; k < s.cars.length; k++) {
      const c = s.cars[k];
      if (c && c.alive && (c.speed || 0) > PRIME.WARM_SPEED) n++;
    }
    return n;
  }

  const Game = {
    store,
    s: null,
    cam: null, renderer: null, fx: null, audio: null, input: null, hud: null, screens: null,
    /** 'title' | 'maps' | 'playing' | 'paused' | 'upgrade' | 'gameover' | 'viewcity' | 'settings'
        'viewcity' = the results overlay is hidden so the player can look around their finished
        city. The sim stays frozen (exactly like 'gameover'); only the camera moves. */
    phase: 'title',
    goData: null,         // the payload the gameover screen was built from, so it can be re-shown
    speed: 1,             // 0 pause, 1 normal, 2 fast
    prevSpeed: 1,
    acc: 0,
    lastTs: 0,
    mapId: null,
    seed: 0,
    stepCount: 0,
    listeners: [],        // extra event listeners: fn(s, ev)
    vs: null,             // the live BW.VS match while an online versus game is running

    init() {
      const canvas = document.getElementById('world');
      const hudRoot = document.getElementById('hud');
      const screensRoot = document.getElementById('screens');
      Game.cam = BW.Camera.create(canvas);
      Game.fx = BW.FX.create();
      Game.renderer = BW.Renderer.create(canvas, Game.cam, Game.fx);
      Game.audio = BW.Audio.create();
      // Master volume 0..100. Saves from before the slider only had `muted`: true migrates to 0.
      Game.audio.setVolume(store.get('volume', store.get('muted', false) ? 0 : 100) / 100);
      Game.hud = BW.HUD.create(hudRoot, Game);
      Game.screens = BW.Screens.create(screensRoot, Game);
      Game.input = BW.Input.attach(canvas, Game);
      window.addEventListener('resize', Game.onResize);
      Game.onResize();
      // Create a background city for the title screen so the menu isn't sitting on an empty canvas.
      Game.newGame(store.get('lastMap', BW.Maps.list()[0].id), Date.now() >>> 0, { background: true });
      // Pickle Arcade layer (stats, achievements, Exit Game, player chip) — a no-op elsewhere.
      if (BW.Launcher) BW.Launcher.install(Game);
      // Online versus — a no-op without LobbySDK (a bare browser tab, or the game run standalone).
      if (BW.VSUI) BW.VSUI.install(Game);
      // Global leaderboard — a no-op without LeaderboardSDK.
      if (BW.LB) BW.LB.install(Game);
      Game.phase = 'title';
      Game.screens.show('title');
      requestAnimationFrame(Game.frame);
    },

    onResize() {
      if (Game.renderer) Game.renderer.resize();
      if (Game.cam && Game.s) Game.cam.fitBounds(Game.s, C.CAMERA_PAD);
      if (BW.VSUI) BW.VSUI.onResize();
    },

    /** Start a new game on `mapId`. opts.background = title-screen ambience (no HUD). */
    newGame(mapId, seed, opts) {
      opts = opts || {};
      const map = BW.Maps.get(mapId);
      Game.mapId = mapId;
      Game.seed = seed === undefined ? (Date.now() >>> 0) : seed;
      const s = BW.createState(map, Game.seed);
      BW.Maps.build(s, mapId);
      BW.Traffic.init(s);
      BW.City.init(s);
      Game.s = s;
      Game.isPlayerGame = !opts.background;
      Game.titleBot = null;
      Game.acc = 0;
      Game.stepCount = 0;
      Game.speed = 1;
      if (Game.renderer) Game.renderer.setPalette(map);
      if (Game.hud) Game.hud.setPalette(map);
      if (Game.cam) Game.cam.fitBounds(s, C.CAMERA_PAD, true);
      if (Game.fx) Game.fx.reset();
      if (Game.input) Game.input.reset();
      store.set('lastMap', mapId);
      Game.drainEvents();
      Game.exitViewCity();
      Game.goData = null;
      Game.phase = opts.background ? 'title' : 'playing';
      if (!opts.background) {
        Game.screens.hide();
        Game.hud.show();
      } else {
        Game.hud.hide();
        Game.primeTitleCity();
      }
    },

    /**
     * Fast-forward the freshly created background city so the menus open on a town that is already
     * alive and visibly still growing. Runs exactly the steps titleStep would — same autopilot,
     * same auto-picked upgrades — just with nothing drawn and the events dropped, which costs
     * 5–25 ms. See PRIME above for the timings.
     */
    primeTitleCity() {
      const s = Game.s;
      if (!s || !BW.Autopilot || !BW.City.canSpawnDest) return;
      const bot = BW.Autopilot.create(s, { style: 'tidy' });
      // Hold BOTH things that could raise a warehouse — the destination wave and the new colour,
      // which arrives with a warehouse of its own — so a wait can't overshoot to three.
      const holdDest = () => {
        s.city.destT = PRIME.HOLD;
        if (s.city.newColorAt >= 0) s.city.newColorAt = s.time.t + PRIME.HOLD;
      };
      const primeStep = () => {
        if (s.status === 'upgrade') { BW.City.chooseUpgrade(s, 0); return; }
        bot.step(s);
        BW.City.step(s, C.DT);
        if (s.status === 'playing') BW.Traffic.step(s, C.DT);
        s.events.length = 0;   // the menus were never watching: no toasts, no particles, no audio
      };
      const maxSteps = Math.ceil(PRIME.MAX_T / C.DT);
      for (let i = 0; i < maxSteps; i++) {
        if (s.status === 'gameover') break;
        if (destCount(s) >= 2) {
          if (BW.City.canSpawnDest(s)) break;
          holdDest();   // not yet: too few houses for the dispatcher to serve another warehouse
        }
        primeStep();
      }
      // Warm-up: the town is the right shape but its cars may all be sitting in their driveways.
      // Cash in the demand every warehouse has already been banking — one pin each, well under the
      // PIN_CAP that starts a fail ring — and then run on until WARM_CARS are genuinely driving.
      // Costs nothing on most maps (the first pins dispatch within a step or two) and is capped at
      // WARM_MAX_T, which a town with no route anywhere would hit and hand over anyway.
      if (s.status === 'playing') {
        for (let k = 0; k < s.buildings.length; k++) {
          const b = s.buildings[k];
          if (b.kind !== 'dest' || b.pins >= b.pinCap) continue;
          b.graceT = 0;
          if (b.demandT < 1) b.demandT = 1;
        }

        for (let i = 0; i < warmSteps; i++) {

          primeStep();

      if (s.city && destCount(s) === 2) {

        if (s.city.newColorAt >= 0) s.city.newColorAt = s.time.t + PRIME.LEAD + PRIME.COLOR_GAP;
      }
      Game.titleBot = bot;   // keep the bot that drew these roads; titleStep carries on with it
      s.events.length = 0;
      if (Game.fx) Game.fx.reset();
      if (Game.cam) Game.cam.fitBounds(s, C.CAMERA_PAD, true);
    },

    /** Called by the title/maps screens. */
    play(mapId) {
      Game.audio.unlock();
      Game.endVersus();
      Game.newGame(mapId || Game.mapId, undefined, {});
    },

    restart() { Game.play(Game.mapId); },

    /** Leaving a player game for the menus: replace it with a background city so menus stay alive. */
    ensureBackgroundGame() {
      if (Game.isPlayerGame) Game.newGame(Game.mapId, (Game.seed + 1) >>> 0, { background: true });
    },

    /**
     * Take over the screen for a versus match. Everything newGame() does for a solo game except
     * building the state — BW.VS already made it (and the opponent's replica) from the shared map
     * and seed, and it owns the clock from here until endVersus().
     */
    startVersus(match) {
      const map = BW.Maps.get(match.mapId);
      Game.vs = match;
      Game.s = match.me;
      Game.mapId = match.mapId;
      Game.seed = match.seed;
      Game.isPlayerGame = true;
      Game.titleBot = null;
      Game.acc = 0;
      Game.stepCount = 0;
      Game.speed = 1;
      Game.phase = 'playing';
      Game.goData = null;
      if (Game.renderer) Game.renderer.setPalette(map);
      if (Game.hud) { Game.hud.setPalette(map); Game.hud.setVersus(true); }
      if (Game.cam) Game.cam.fitBounds(match.me, C.CAMERA_PAD, true);
      if (Game.fx) Game.fx.reset();
      if (Game.input) Game.input.reset();
      Game.exitViewCity();
      Game.screens.hide();
      Game.hud.show();
      match.me.events.length = 0;
    },

    /** Drop any live versus match (leaving for the menus, restarting, starting a solo game). */
    endVersus() {
      if (!Game.vs && !(BW.VSUI && BW.VSUI.busy())) return;
      if (BW.VSUI) BW.VSUI.leave();
      Game.vs = null;
      if (Game.hud) Game.hud.setVersus(false);
    },

    toMaps() {
      Game.exitViewCity();
      Game.endVersus();
      Game.ensureBackgroundGame();
      Game.phase = 'maps';
      Game.hud.hide();
      Game.screens.show('maps');
    },

    toTitle() {
      Game.exitViewCity();
      Game.endVersus();
      Game.ensureBackgroundGame();
      Game.phase = 'title';
      Game.hud.hide();
      Game.screens.show('title');
    },

    // ---- looking around the finished city ------------------------------------------------

    /** From the results screen: hide the overlay and let the player pan/zoom the dead city. */
    viewCity() {
      if (Game.phase !== 'gameover' || !Game.s) return;
      Game.phase = 'viewcity';
      Game.screens.hide();
      Game.screens.setViewPill(true);
      Game.hud.show('view');          // read-only strip: score + week ring only
    },

    /** Back from 'viewcity' to the results, rebuilt from the SAME payload (no score re-scoring). */
    backToResults() {
      if (Game.phase !== 'viewcity') return;
      Game.phase = 'gameover';
      Game.screens.setViewPill(false);
      Game.hud.hide();
      Game.screens.show('gameover', Game.goData || {});
    },

    /** Tear the view mode down without going back to the results (restart / maps / title). */
    exitViewCity() {
      if (Game.screens) Game.screens.setViewPill(false);
      if (Game.hud) Game.hud.setViewOnly(false);
      if (Game.phase === 'viewcity') Game.phase = 'gameover';
    },

    /** Versus has no pause: the upgrade modal is the only stop in the mode, and it is shared. */
    pause() {
      if (Game.vs) { if (BW.VSUI) BW.VSUI.askLeave(); return; }
      if (Game.phase !== 'playing') return;
      Game.phase = 'paused';
      Game.screens.show('pause');
    },

    resume() {
      if (Game.phase !== 'paused') return;
      Game.phase = 'playing';
      Game.screens.hide();
    },

    togglePause() { Game.phase === 'paused' ? Game.resume() : Game.pause(); },

    setSpeed(n) {
      n = Math.max(0, Math.min(2, n | 0));
      // Versus: 1x/2x is a VOTE, and 0 (pause) does not exist. The HUD is updated from the match's
      // own notification once both votes are known, not from here.
      if (Game.vs) { if (n > 0) Game.vs.voteFast(n === 2); return; }

      Game.speed = n;
      if (Game.hud) Game.hud.onSpeed(n);
    },

      const s = Game.s;
      // Versus: the pick is registered with the match and only APPLIED when both players are in
      // (or the 10 s timer runs out) — so the two cities never resume on different ticks.
      if (Game.vs) { Game.vs.pick(i); return; }

      Game.screens.hide();

    step() {

      }

    noteBest(mapId, score) {

      const isBest = score > prev;
      if (isBest) store.set(key, score);
      return { prev, isBest };
    },

    onGameOver() {

      const maps = BW.Maps.list();
      const idx = maps.findIndex((m) => m.id === Game.mapId);
      const unlocked = new Set(store.get('unlocked', maps.slice(0, 3).map((m) => m.id)));
      if (s.score >= C.MAP_UNLOCK_SCORE && idx >= 0 && idx + 1 < maps.length) unlocked.add(maps[idx + 1].id);
      store.set('unlocked', Array.from(unlocked));
      // Keep the payload: "View city" → "Back to results" re-shows the SAME numbers, and the
      // best-score / unlock side effects above must not run a second time.
      Game.goData = { score: s.score, best: Math.max(prev, s.score), isBest, stats: s.stats, week: s.time.week };
      Game.screens.show('gameover', Game.goData);
    },

    isUnlocked(mapId) {
      const maps = BW.Maps.list();
      const unlocked = store.get('unlocked', maps.slice(0, 3).map((m) => m.id));
      return unlocked.indexOf(mapId) >= 0;
    },

    bestFor(mapId) { return store.get('best_' + mapId, 0); },

    /** Fan out s.events to fx / audio / hud / screens / camera. */
    drainEvents() {
      const s = Game.s;
      if (!s || !s.events.length) return;
      const evs = s.events;
      s.events = [];
      for (let k = 0; k < evs.length; k++) {
        const ev = evs[k];
        if (ev.type === 'boundsGrow' && Game.cam) Game.cam.fitBounds(s, C.CAMERA_PAD);
        if (Game.fx) Game.fx.onEvent(s, ev);
        if (Game.audio && Game.phase !== 'title') Game.audio.onEvent(s, ev);
        if (Game.hud) Game.hud.onEvent(s, ev);
        for (let l = 0; l < Game.listeners.length; l++) Game.listeners[l](s, ev);
      }
    },

    frame(ts) {
      requestAnimationFrame(Game.frame);
      // Clamp to [0, 0.1]: a timestamp that goes backwards (tab restore, harness) must not stall the sim.
      const dt = Math.max(0, Math.min(0.1, Game.lastTs ? (ts - Game.lastTs) / 1000 : 1 / 60));
      Game.lastTs = ts;
      const s = Game.s;
      if (!s) return;

      // Versus: the match owns the clock. It steps MY city and the opponent's replica together,
      // holds both at the shared upgrade barrier, and paces the two machines against each other —
      // none of which the plain accumulator below can do. See net/vs.js.
      if (Game.vs) {
        Game.vs.frame(dt, VS_CB);
        Game.stepCount = Game.vs.tick;
        Game.cam.update(dt);
        Game.fx.update(dt);
        Game.input.update(dt);
        Game.hud.update(s, dt);
        Game.screens.update(s, dt);
        Game.renderer.render(s, Game.vs.alpha, dt, Game.input.ui);
        if (BW.VSUI) BW.VSUI.frame(dt);
        return;
      }

      // Menus: run the background city slowly and let its autopilot play so it looks alive.
      const menuPhase = Game.phase === 'title' || Game.phase === 'maps' || Game.phase === 'settings';
      const bgRunning = menuPhase && !Game.isPlayerGame;
      const simRunning = (Game.phase === 'playing' && Game.speed > 0) || bgRunning;
      let alpha = 1;
      if (simRunning) {
        const mult = bgRunning ? 0.6 : (Game.speed === 2 ? C.FAST_MULT : 1);
        Game.acc += dt * mult;
        let n = 0;
        while (Game.acc >= C.DT && n < 12) {
          if (bgRunning) Game.titleStep(); else Game.step();
          Game.acc -= C.DT;
          n++;
        }
        if (n >= 12) Game.acc = 0; // dropped frames: don't spiral
        alpha = Math.min(1, Game.acc / C.DT);
      }

      Game.cam.update(dt);
      Game.fx.update(dt);
      Game.input.update(dt);
      Game.hud.update(s, dt);
      Game.screens.update(s, dt);
      Game.renderer.render(s, alpha, dt, Game.input.ui);
    },

    /** Background title-screen sim: autopilot builds roads; on game over, quietly restart. */
    titleStep() {
      const s = Game.s;
      if (s.status === 'upgrade') { BW.City.chooseUpgrade(s, 0); }
      if (s.status === 'gameover') {
        Game.newGame(Game.mapId, (Game.seed + 1) >>> 0, { background: true });
        return;
      }
      if (BW.Autopilot) {
        if (!Game.titleBot || Game.titleBot.s !== s) Game.titleBot = BW.Autopilot.create(s, { style: 'tidy' });
        Game.titleBot.step(s);
      }
      BW.City.step(s, C.DT);
      if (s.status === 'playing') BW.Traffic.step(s, C.DT);
      Game.drainEvents();
    },
  };

  /** Per-step callbacks handed to the versus match: events only, never a move of its own. */
  const VS_CB = {
    onMeStep() { Game.drainEvents(); },
    onFoeStep(foe) { if (BW.VSUI) BW.VSUI.onFoeStep(foe); },
  };

  BW.Game = Game;

  // Harness hooks.
  if (typeof window !== 'undefined') {
    window.__byways = {
      get s() { return Game.s; },
      game: Game,
      step(n) { for (let i = 0; i < (n || 1); i++) Game.step(); },
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', Game.init);
    else Game.init();
  }
})(globalThis.BW = globalThis.BW || {});
