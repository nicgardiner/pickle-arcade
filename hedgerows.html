        const from = [];
        for (let i = 0; i < rest.length; i++) {
          const m = rest[i];
          pts += m.points;
          from.push(m.path[0]);
          if (m.path.length > longest.path.length) longest = m;
          if (m.label !== rest[0].label) same = false;
        }
        keep.push({ points: pts, label: (same && rest[0].label ? rest[0].label : 'more') + ' ×' + rest.length,
          path: longest.path, from: from });
        plan = keep;
      }
      plan.sort(function (a, b) { return b.path.length - a.path.length; });   // stable
      return plan;
    }

    // Text layout for tags and tallies. Screen-relative boxes (world × zoom + px offsets, at
    // the zoom of the last drawn frame) with the time window each text is "up" (alpha > ½).
    const LIVE = 0.83;
    function boxAt(x, y0, y1, text, scale, ta, tb) {
      const s = Math.max(1, scale), h = C().POPUP_PX * s * 0.5;
      return { x: x, y0: y0 - h, y1: y1 + h, w: textW(text, s), ta: ta, tb: tb };
    }
    function hits(a, b) {
      return a.ta < b.tb && b.ta < a.tb && Math.abs(a.x - b.x) * 2 < a.w + b.w && a.y0 < b.y1 && b.y0 < a.y1;
    }
    function cascadeBoxes() {
      const cfg = C(), z = lastZoom, out = [];
      for (let i = 0; i < popups.length; i++) {
        const p = popups[i];
        if (!p.alive || p.cid !== cid) continue;
        let x = p.wx * z, y = p.wy * z;
        if (p.off) { const o = Math.max(p.off * z, cfg.EDGE_MIN_PX); x += p.dx * o; y += p.dy * o; }
        else y -= Math.max(hexSize() * z * cfg.HEAD_LIFT, cfg.HEAD_MIN_PX) + p.lift;
        out.push(boxAt(x, y - cfg.POPUP_RISE * p.rise, y, p.text, p.scale, p.t0, p.t0 + p.dur * LIVE));
      }
      for (let i = 0; i < tags.length; i++) if (tags[i].alive && tags[i].cid === cid) out.push(tags[i].box);
      for (let i = 0; i < tallies.length; i++) if (tallies[i].alive && tallies[i].cid === cid) out.push(tallies[i].box);
      return out;
    }
    /**
     * Where a text anchored at world (wx, wy) sits so it overprints nothing of this cascade:
     * on the anchor, else 1..TAG_SLOTS lines below / above it. { oy (screen px), box }.
     * ponytail: greedy and first-fit, checked against texts already spawned only — later
     * headlines stay clear by TIME instead (the cascade cursor waits for the tally to fade).
     */
    function slot(wx, wy, text, scale, ta, tb) {
      const cfg = C(), z = lastZoom, line = cfg.POPUP_PX * Math.max(1, scale) * 1.1;
      const boxes = cascadeBoxes();
      let first = null;
      for (let k = 0; k <= 2 * cfg.TAG_SLOTS; k++) {
        const oy = (k === 0 ? 0 : (k % 2 ? 1 : -1) * Math.ceil(k / 2)) * line;
        const b = boxAt(wx * z, wy * z + oy, wy * z + oy, text, scale, ta, tb);
        if (!first) first = { oy: oy, box: b };
        let clear = true;
        for (let i = 0; i < boxes.length && clear; i++) if (hits(b, boxes[i])) clear = false;
        if (clear) return { oy: oy, box: b };
      }
      return first;
    }

    function sparkOf(m) {
      const cfg = C(), k = take(sparks, cfg.MAX_SPARKS);
      k.alive = true; k.seq = seq++; k.cid = cid; k.landed = false;
      k.t0 = m.t0; k.t1 = m.t1; k.t2 = m.t2; k.dur = m.t2 - m.t0;
      k.pts = m.points;
      k.xs = k.xs || []; k.ys = k.ys || []; k.sx = k.sx || []; k.sy = k.sy || [];
      k.xs.length = 0; k.ys.length = 0; k.sx.length = 0; k.sy.length = 0;
      for (let i = 0; i < m.path.length; i++) {
        const w = worldOfKey(m.path[i]);
        k.xs.push(w.x); k.ys.push(w.y);
      }
      k.n = k.xs.length;
      const srcs = m.from || [m.path[0]];
      for (let i = 0; i < srcs.length && i < cfg.MERGE_SOURCES; i++) {
        const w = worldOfKey(srcs[i]);
        k.sx.push(w.x); k.sy.push(w.y);
      }
      // a hop between non-adjacent cells (a beehive bloom) arcs over whatever lies between
      const span = k.n === 2 ? Math.hypot(k.xs[1] - k.xs[0], k.ys[1] - k.ys[0]) : 0;
      k.arc = span > hexSize() * 2.2 ? span * cfg.HOP_ARC : 0;
      return k;
    }

    /** Head position of spark `k` at fx time `time` (leaves and lands gently). */
    function sparkPos(k, time, out) {
      const u = clamp01((time - k.t1) / Math.max(1e-6, k.t2 - k.t1));
      const e = u * u * (3 - 2 * u);
      spline(k.xs, k.ys, k.n, e * (k.n - 1), out);
      if (k.arc) out.y -= Math.sin(e * Math.PI) * k.arc;
      return out;
    }

    function tagOf(m) {
      const cfg = C();
      const w = worldOfKey(m.path[0]);
      const text = '+' + m.points + (m.label ? ' ' + m.label : '');
      // fades out as its spark lands: alpha crosses ½ at 0.825 of its life ≈ 0.97 of the flight
      const dur = (m.t2 - m.t0) / 0.85;
      const at = slot(w.x, w.y, text, cfg.TAG_SCALE, m.t0, m.t0 + dur * LIVE);
      const g = take(tags, cfg.MAX_TAGS);
      g.alive = true; g.seq = seq++; g.cid = cid;
      g.t0 = m.t0; g.dur = dur; g.wx = w.x; g.wy = w.y; g.oy = at.oy; g.box = at.box;
      g.text = text; g.scale = cfg.TAG_SCALE;
      return g;
    }

    function tallyOf(lw, plan, firstLand, lastLand, total) {
      const cfg = C();
      const sc = cfg.TALLY_SCALE * 1.15;           // it pops 15 % on each landing
      const at = slot(lw.x, lw.y, '+' + total, sc, firstLand, lastLand + cfg.TALLY_HOLD * 0.75);
      const k = take(tallies, cfg.MAX_TALLIES);
      k.alive = true; k.seq = seq++; k.cid = cid;
      k.t0 = firstLand; k.end = lastLand; k.dur = lastLand + cfg.TALLY_HOLD - firstLand;
      k.wx = lw.x; k.wy = lw.y; k.oy = at.oy; k.box = at.box;
      k.at = k.at || []; k.pts = k.pts || [];
      k.at.length = 0; k.pts.length = 0;
      for (let i = 0; i < plan.length; i++) { k.at.push(plan[i].t2); k.pts.push(plan[i].points); }
      return k;
    }

    /** The sawmill's timber: a gold sweep over the forest group it paid for. */
    function timberFlash(s, P, lmKey, at) {
      let members = P.members;
      if (!members && HG.Groups && HG.Groups.info && HG.T && s && s.groups) {
        const g = HG.Groups.info(s, lmKey, HG.T.FOREST);
        members = g && g.members;
      }
      if (members && members.length) sweep(members, COL.gold, at, HG.Hex.parse(lmKey));
    }

    /**
     * One landmark's payment as parts. Returns the points it credited — exactly L.points when
     * the parts sum to it (the contract); a shortfall still shows, as a lump on the landmark.
     */
    function landmarkParts(L, lw, s) {
      const cfg = C(), size = hexSize();
      const lmKey = L.key || (L.q + ',' + L.r);
      const moving = [], bonus = [];
      let sum = 0;
      for (let i = 0; i < L.parts.length; i++) {
        const P = L.parts[i];
        if (!P || !(P.points > 0)) continue;
        sum += P.points;
        (travels(P, lmKey) ? moving : bonus).push(P);
      }
      let lastLand = -1;
      if (moving.length) {
        const plan = sparkPlan(moving, lmKey);
        const t = nextStep();
        let firstLand = Infinity, total = 0;
        for (let j = 0; j < plan.length; j++) {     // timings first: the tally's window is needed to lay out tags
          const m = plan[j];
          m.t0 = t + j * cfg.SPARK_STAGGER;
          m.t1 = m.t0 + cfg.SPARK_HOLD;
          m.t2 = m.t1 + Math.min(cfg.SPARK_MAX, Math.max(cfg.SPARK_MIN, (m.path.length - 1) * cfg.SPARK_HOP));
          if (m.t2 < firstLand) firstLand = m.t2;
          if (m.t2 > lastLand) lastLand = m.t2;
          total += m.points;
        }
        if (!FX.quiet) tallyOf(lw, plan, firstLand, lastLand, total);
        for (let j = 0; j < plan.length; j++) {
          credit(plan[j].t2, plan[j].points);
          sparkOf(plan[j]);
          if (!FX.quiet) tagOf(plan[j]);
        }
        cur = Math.max(cur, lastLand);
      }
      for (let i = 0; i < bonus.length; i++) {
        const P = bonus[i];
        const tb = nextStep();
        popup(lw.x, lw.y, '+' + P.points + ' ' + (P.label || P.id || 'bonus'), TEXT_COL.landmark,
          cfg.LANDMARK_SCALE * cfg.SUBLINE_SCALE, tb);
        credit(tb, P.points);
        ring(lw.x, lw.y, COL.gold, cfg.PULSE_SEC * 2, tb - clock, size * 0.7, size * 1.25, 0.05);
        if (P.id === 'timber') timberFlash(s, P, lmKey, tb);
      }
      // the next beat (PERFECT, closures…) waits for the running total to fade: nothing later
      // in the cascade can then land on top of the tags or the tally
      if (lastLand >= 0) cur = Math.max(cur, lastLand + cfg.TALLY_HOLD * 0.75);
      if (L.points > sum) { lump(lw, L.points - sum); sum = L.points; }
      return sum;
    }

    /**
     * The closure sweep: light spreading through the group. With an `origin` hex (the tile
     * that sealed it) each member's delay is its distance from that tile, so the light
     * radiates out of the move that earned it; without one it crosses along SWEEP_DIR.
     * Member world positions are resolved ONCE here, never per frame.
     */
    function sweep(members, rgb, at, origin) {
      const cfg = C();
      const k = take(sweeps, cfg.MAX_SWEEPS);
      k.alive = true; k.seq = seq++;
      k.t0 = at === undefined ? clock : at;
      k.rgb = rgb;
      k.xs = k.xs || [];
      k.ys = k.ys || [];
      k.ds = k.ds || [];
      k.xs.length = 0; k.ys.length = 0; k.ds.length = 0;

      const step = Math.max(1, Math.ceil(members.length / cfg.SWEEP_MAX_HEXES));
      const dir = cfg.SWEEP_DIR;
      const dl = Math.hypot(dir[0], dir[1]) || 1;
      const dx = dir[0] / dl, dy = dir[1] / dl;
      const o = origin ? worldOf(origin[0], origin[1]) : null;
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < members.length; i += step) {
        const qr = HG.Hex.parse(members[i]);
        const w = worldOf(qr[0], qr[1]);
        const proj = o ? Math.hypot(w.x - o.x, w.y - o.y) : w.x * dx + w.y * dy;
        k.xs.push(w.x); k.ys.push(w.y); k.ds.push(proj);
        if (proj < lo) lo = proj;
        if (proj > hi) hi = proj;
      }
      const span = Math.max(1e-6, hi - lo);
      for (let i = 0; i < k.ds.length; i++) k.ds[i] = ((k.ds[i] - lo) / span) * cfg.SWEEP_SPREAD;
      k.dur = cfg.SWEEP_SPREAD + cfg.SWEEP_SEC;
      return k;
    }

    // ---- events ----------------------------------------------------------

    /**
     * One drained s.events entry. `view` is accepted for the contract's sake (and so a future
     * effect can read the hover) but is not written to.
     */
    function event(e, s, view) {
      if (!e || !e.type) return;
      const cfg = C();
      switch (e.type) {
        case 'place': {
          const w = worldOf(e.q, e.r);
          const res = e.res;
          const size = hexSize();
          ring(w.x, w.y, res && res.perfect ? COL.warm : COL.plain,
            cfg.SETTLE_SEC, 0, size * cfg.SETTLE_FROM, size * cfg.SETTLE_TO, 0.05);
          if (!res || !res.points) break;
          // THE CASCADE. Every source of this placement's points gets its own popup, in
          // order, one step apart; the closure and quest events drained right after this one
          // queue onto the same cursor. Closure points are shown by the closure events, so
          // everything else in res.points.total is accounted for here — nothing is dropped:
          // a share with no per-source data (a res with no edge array) becomes one lump.
          const pts = res.points;
          closeInfo = (res.closures || []).slice();
          perfectAt = -1;
          cid++;
          tileX = w.x; tileY = w.y; tileCid = cid;
          cur = clock + cfg.CASCADE_LEAD;

          // 1. each matched edge "+10" on the shared edge, in its terrain's ink; a ✕ per scar
          const cell = s && s.board && s.board.cells ? s.board.cells.get(e.q + ',' + e.r) : null;
          const perEdge = res.matches > 0 && pts.match > 0 ? pts.match / res.matches : 0;
          let shown = 0, edgesOut = 0;
          // matches first (they are the points), then the scars (what cost the perfect)
          if (res.edge) {
            for (let i = 0; i < 12; i++) {
              const d = i % 6, kind = res.edge[d];
              if ((kind === 'match') !== (i < 6)) continue;
              if (kind === 'match' && perEdge > 0) {
                edgePopup(w, d, '+' + perEdge, edgeInk(cell ? cell.edges[d] : -1), cfg.EDGE_SCALE,
                  cur, cfg.EDGE_RISE);
                credit(cur, perEdge);
                shown += perEdge;
              } else if (kind === 'scar' && cfg.SCAR_MARKS) {
                edgePopup(w, d, '✕', TEXT_COL.scar, cfg.SCAR_SCALE, cur, 0);
              } else continue;
              cur += cfg.EDGE_STAGGER;
              edgesOut++;
            }
          }
          if (edgesOut) cur += cfg.STEP_STAGGER - cfg.EDGE_STAGGER;
          lump(w, (pts.match || 0) - shown);

          // 2. landmark payments, gold, on the landmark itself; a completed ring on its own line
          const lms = res.landmarks || [];
          const RB = (s && s.C && s.C.LANDMARK_RING_BONUS) || 0;
          let lmShown = 0;
          for (let i = 0; i < lms.length; i++) {
            const L = lms[i];
            if (!(L.points > 0)) continue;
            const lw = worldOf(L.q, L.r);
            if (L.parts && L.parts.length) { lmShown += landmarkParts(L, lw, s); continue; }
            // the pre-wave-6 shape (no parts): one "+N kind" line and a ring sub-line
            const st = s && s.landmarks && s.landmarks.get ? s.landmarks.get(L.key) : null;
            const rb = L.complete && st ? Math.min(L.points, st.matched * RB) : 0;
            const base = L.points - rb;
            const info = HG.Tiles && HG.Tiles.landmarkInfo ? HG.Tiles.landmarkInfo(L.kind) : null;
            const label = String((info && info.label) || L.kind || 'landmark').toLowerCase();
            if (base > 0) {
              const t = nextStep();
              popup(lw.x, lw.y, '+' + base + ' ' + label, TEXT_COL.landmark, cfg.LANDMARK_SCALE, t);
              credit(t, base);
            }
            if (rb > 0) {
              const t = nextStep();
              popup(lw.x, lw.y, 'ring +' + rb, TEXT_COL.landmark, cfg.LANDMARK_SCALE * cfg.SUBLINE_SCALE, t);
              credit(t, rb);
            }
            lmShown += L.points;
          }
          lump(w, (pts.landmark || 0) - lmShown);

          // 3. the perfect
          if (res.perfect) {
            const t = nextStep();
            popup(w.x, w.y, 'PERFECT' + (pts.perfect > 0 ? ' +' + pts.perfect : '') +
              (res.tilesBack > 0 ? ' · +' + res.tilesBack + ' tiles' : ''),
              TEXT_COL.perfect, cfg.PERFECT_SCALE, t);
            credit(t, pts.perfect || 0);
            perfectAt = t; perfectKey = e.q + ',' + e.r;
          } else lump(w, pts.perfect || 0);
          break;
        }
        case 'perfect': {
          const w = worldOf(e.q, e.r);
          const size = hexSize();
          // a second, warmer ring — on the cascade's PERFECT beat when there is one
          const at = (perfectAt >= clock && perfectKey === e.q + ',' + e.r) ? perfectAt : clock + 0.06;
          ring(w.x, w.y, COL.warm, cfg.PERFECT_SEC, at - clock, size * 0.9, size * 1.5, 0.038);
          break;
        }
        case 'closure': {
          if (!e.members || !e.members.length) break;
          // the popup lands at the group's centroid, where the eye already is
          let cx = 0, cy = 0;
          for (let i = 0; i < e.members.length; i++) {
            const qr = HG.Hex.parse(e.members[i]);
            const w = worldOf(qr[0], qr[1]);
            cx += w.x; cy += w.y;
          }
          cx /= e.members.length; cy /= e.members.length;
          // Split into base + size bonus. The event may carry `bonus` itself; otherwise the
          // matching record from the place's res.closures does. Missing ⇒ no bonus line.
          // base is always points − bonus, so the two lines always sum to the closure.
          let bonus = typeof e.bonus === 'number' ? e.bonus : undefined;
          if (bonus === undefined) {
            for (let i = 0; i < closeInfo.length; i++) {
              const c = closeInfo[i];
              if (c && c.terrain === e.terrain && c.size === e.size) {
                if (typeof c.bonus === 'number') bonus = c.bonus;
                closeInfo.splice(i, 1);
                break;
              }
            }
          }
          const pts = e.points > 0 ? e.points : 0;
          if (!(bonus > 0) || bonus > pts) bonus = 0;
          const t = nextStep();
          sweep(e.members, COL.warm, t, typeof e.q === 'number' ? [e.q, e.r] : null);
          if (pts > 0) {
            popup(cx, cy, '+' + (pts - bonus) + ' closed ' + e.size, TEXT_COL.close, cfg.CLOSE_SCALE, t);
            credit(t, pts - bonus);
          }
          if (bonus > 0) {
            const t2 = nextStep();
            popup(cx, cy, '+' + bonus + ' size bonus', TEXT_COL.close,
              cfg.CLOSE_SCALE * cfg.SUBLINE_SCALE, t2);
            credit(t2, bonus);
          }
          break;
        }
        case 'quest-done': {
          const q = e.quest;
          if (!q || !q.key) break;
          const qr = HG.Hex.parse(q.key);
          const w = worldOf(qr[0], qr[1]);
          const size = hexSize();
          const t = nextStep();
          for (let i = 0; i < cfg.QUEST_RINGS; i++) {
            ring(w.x, w.y, COL.gold, cfg.QUEST_SEC, t - clock + i * 0.13,
              size * 0.8, size * (1.5 + i * 0.35), 0.045 - i * 0.008);
          }
          const tiles = q.rewardTiles || 0, score = q.rewardScore || 0;
          const tilesTxt = tiles > 0 ? '+' + tiles + ' tiles' : '';
          popup(w.x, w.y, score > 0 ? 'quest +' + score + (tilesTxt ? ' · ' + tilesTxt : '')
            : (tilesTxt || 'quest done'), TEXT_COL.quest, cfg.PERFECT_SCALE, t);
          credit(t, score);
          break;
        }
        case 'quest-failed': {
          const q = e.quest;
          if (!q || !q.key) break;
          const qr = HG.Hex.parse(q.key);
          const w = worldOf(qr[0], qr[1]);
          const size = hexSize();
          const t = nextStep();
          // one slow grey ring and a muted word: the game says no without shouting (pillar 1)
          ring(w.x, w.y, COL.grey, cfg.QUEST_SEC, t - clock, size * 1.1, size * 0.85, 0.03);
          popup(w.x, w.y, 'missed', TEXT_COL.fail, 0.85, t);
          break;
        }
        default: break;
      }
    }

    // ---- the frame -------------------------------------------------------

    function reap(pool) {
      for (let i = 0; i < pool.length; i++) {
        const o = pool[i];
        if (o.alive && clock - o.t0 >= o.dur) o.alive = false;
      }
    }

    // One soft pluck per cascade step as it lands, rising a note each step of the same cascade.
    // Scars and misses land silently. Fired from update, not draw, so an offscreen cascade still sings.
    // A spark landing sings too ('spark' — the same pluck a fifth up), on the same climbing count.
    let tickCid = -1, tickN = 0;
    function sing(name, c) {
      tickN = c === tickCid ? tickN + 1 : 0; tickCid = c;
      const A = HG.Audio;
      if (A && A.ui) try { A.ui(name, { step: tickN }); } catch (e) { /* audio is optional */ }
    }
    function tickLanded() {
      for (let i = 0; i < popups.length; i++) {
        const p = popups[i];
        if (!p.alive || p.ticked || clock < p.t0) continue;
        p.ticked = true;
        if (p.text === '✕' || p.text === 'missed') continue;
        sing('tick', p.cid);
      }
      for (let i = 0; i < sparks.length; i++) {
        const k = sparks[i];
        if (!k.alive || k.landed || clock < k.t2) continue;
        k.landed = true;
        sing('spark', k.cid);
      }
    }

    function update(dt) {
      const step = Math.min(0.1, Math.max(0, dt || 0));
      if (step <= 0) return;
      clock += step;
      tickLanded();
      reap(popups); reap(rings); reap(sweeps); reap(sparks); reap(tags); reap(tallies);
      let w = 0;
      for (let i = 0; i < ledger.length; i++) if (ledger[i].at > clock) ledger[w++] = ledger[i];
      ledger.length = w;
    }

    /** Points already in s.score whose cascade popup has not landed yet (the HUD holds them back). */
    function pending() {
      let n = 0;
      for (let i = 0; i < ledger.length; i++) if (ledger[i].at > clock) n += ledger[i].pts;
      return n;
    }

    const POOLS = [popups, rings, sweeps, sparks, tags, tallies];
    function active() {
      let n = 0;
      for (let j = 0; j < POOLS.length; j++) for (let i = 0; i < POOLS[j].length; i++) if (POOLS[j][i].alive) n++;
      return n;
    }

    function anyAlive() {
      for (let j = 0; j < POOLS.length; j++) for (let i = 0; i < POOLS[j].length; i++) if (POOLS[j][i].alive) return true;
      return false;
    }

    function reset() {
      for (let j = 0; j < POOLS.length; j++) for (let i = 0; i < POOLS[j].length; i++) POOLS[j][i].alive = false;
      pvRes = null; pvN = 0;
      clock = 0; seq = 0;
      cur = 0; cid = 0; tileCid = -1; ledger.length = 0; closeInfo = []; perfectAt = -1; perfectKey = '';
    }

    /**
     * Drawn AFTER HG.Renderer.draw. Two passes: everything spatial under the camera's world
     * transform (so a sweep sits exactly on its hexes through a pan or a zoom glide), then
     * the text in screen space at a fixed px size — a popup scaled by the zoom is unreadable
     * at ZOOM_MIN and shouty at ZOOM_MAX.
     *
     * `view.dpr` is the device-pixel ratio the renderer sized the canvas at (main.js writes
     * it each frame); without it the transform assumes 1.
     */
    // ---- the hover preview: resolved once per hover evaluation (main.js makes a new res only
    // when the hovered hex / rotation / tile changes), then drawn from flat arrays every frame.
    let pvRes = null, pvN = 0;
    const pvSx = [], pvSy = [], pvPx = [], pvPy = [], pvStart = [];
    function previewBuild(res) {
      pvRes = res; pvN = 0;
