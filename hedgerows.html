        const want = (narrow ? 2 : 3) + (hash32(seed, run.start, 3) % 3);
        const big = hash32(seed, run.start, 61) % 3 === 0;   // one wedge in three: an old tree
        for (let k = 0; k < want; k++) {
          let cr = size * (0.095 + 0.045 * rnd(seed, run.start * 31 + k, 5));
          if (big && k === 0) cr *= 1.45;
          if (narrow) cr *= 0.88;
          const m = placeMark(cx, cy, size, run, seed, k, 'tree', cr * 1.12, out, lines);
          if (m) { m.cr = cr; m.big = big && k === 0; m.run = run.start; m.i = k; out.push(m); }
        }
      } else if (run.t === T.VILLAGE) {
        const want = (narrow ? 1 : 2) + (hash32(seed, run.start, 9) % 3);
        for (let k = 0; k < want; k++) {
          let w = size * (0.205 + 0.055 * rnd(seed, run.start * 13 + k, 7));
          if (narrow) w *= 0.88;
          const m = placeMark(cx, cy, size, run, seed, k + 40, 'house', w * 0.72, out, lines);
          if (m) { m.w = w; m.run = run.start; m.i = k; out.push(m); }
        }
      } else if (run.t === T.FIELD && hash32(seed, run.start, 43) % 2 === 0) {
        const hr = size * 0.105;
        const m = placeMark(cx, cy, size, run, seed, 60, 'hay', hr * 1.3, out, lines);
        if (m) { m.hr = hr; m.run = run.start; out.push(m); }
      }
    }
    // back to front. The tie-break on x keeps the order stable whatever the hash hands back.
    const list = foot ? out.filter(function (m) { return m.type !== 'foot'; }) : out;
    list.sort(function (a, b) { return (a.y - b.y) || (a.x - b.x); });
    return list;
  }

  // ---------------------------------------------------------------- the marks themselves

  /**
   * A TREE — a dark canopy with a lit disc on its top-left (the light in this world comes from
   * the top-left, and every mark obeys it) over a trunk. A trunk is a fillRect: a stroked line
   * costs four 2D calls, a fillRect costs one. One tree per forest wedge is a big old one,
   * which is what stops a forest reading as a texture.
   */
  // Autumn gives every tree its own shade — a wood of one orange reads as a flat patch.
  const AUTUMN_CANOPY = ['#c0521f', '#d4822a', '#a8401f', '#c9962e'];

  function drawTree(ctx, m, seed) {
    const pal = PALETTE[T.FOREST];
    const sn = Renderer.SEASON;
    const h = hash32(seed, m.run * 7 + m.i, 73);
    const canopy = sn.leaves ? AUTUMN_CANOPY[h % AUTUMN_CANOPY.length] : pal.ink;
    const dark = shade(canopy, -0.12), lit = shade(canopy, 0.28), bark = shade(pal.ink, -0.42);
    const r = m.cr;
    ctx.fillStyle = sn.leaves ? '#6b4a33' : bark;
    ctx.fillRect(m.x - r * 0.11, m.y + r * 0.35, r * 0.22, r * 0.78);
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = lit;
    ctx.beginPath(); ctx.arc(m.x - r * 0.26, m.y - r * 0.3, r * 0.6, 0, TAU); ctx.fill();
    if (sn.snow) {
      // Snow resting on the crown: the top half of an ellipse, wholly inside the circle.
      ctx.fillStyle = pal.accent;
      ctx.beginPath(); ctx.ellipse(m.x - r * 0.08, m.y - r * 0.36, r * 0.74, r * 0.46, 0, Math.PI, 0); ctx.fill();
      return;
    }
    // Spring blossom on most trees, summer fruit on the old ones: specks of the season's
    // accent across the crown, never down the side — a speck on the flank reads as a blemish.
    const specks = sn.blossom ? (m.big || h % 3 !== 0 ? 4 : 0) : (sn.fruit && m.big ? 3 : 0);
    if (specks && pal.accent) {
      ctx.fillStyle = pal.accent;
      for (let j = 0; j < specks; j++) {
        const a = -Math.PI * (0.22 + 0.19 * j) - rnd(seed, m.run * 5 + j + m.i * 11, 71) * 0.28;
        const rr = r * (0.3 + 0.3 * rnd(seed, m.run * 3 + j, 79));
        ctx.beginPath();
        ctx.arc(m.x + rr * Math.cos(a), m.y + rr * Math.sin(a), r * (sn.fruit ? 0.13 : 0.15), 0, TAU);
        ctx.fill();
      }
    }
  }

  /**
   * A HOUSE — wall + gable as one pentagon, a shallow roof, and the details that turn a shape
   * into a building: a door, a lit window, a chimney. The chimney's position is duplicated in
   * `geom.chimneys` (render/anim.js rises smoke from it) — change one and you change the other.
   */
  function drawHouse(ctx, m, fine) {
    const pal = PALETTE[T.VILLAGE];
    const wall = shade(pal.fill, 0.55), roof = shade(pal.ink, -0.05);
    const trim = pal.accent || shade(pal.ink, -0.35);
    const glass = shade(pal.fill, 0.82);
    const w = m.w, hh = w * 0.95, x = m.x, y = m.y;
    // Walls + gable as ONE pentagon, then a shallow roof over its top third — two small
    // contours, no multi-contour path. The wall band has to stay tall enough to read as a
    // house at a glance; a steep roof just looks like a dark chevron.
    ctx.fillStyle = wall;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y + hh * 0.5);
    ctx.lineTo(x - w / 2, y - hh * 0.18);
    ctx.lineTo(x, y - hh * 0.5);
    ctx.lineTo(x + w / 2, y - hh * 0.18);
    ctx.lineTo(x + w / 2, y + hh * 0.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = trim;                            // the chimney, on the roof's right slope
    ctx.fillRect(x + w * 0.28 - w * 0.075, y - hh * 0.42 - w * 0.30, w * 0.15, w * 0.34);
    ctx.fillStyle = roof;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.62, y - hh * 0.14);
    ctx.lineTo(x, y - hh * 0.56);
    ctx.lineTo(x + w * 0.62, y - hh * 0.14);
    ctx.closePath(); ctx.fill();
    const sn = Renderer.SEASON;
    if (sn.snow) {                                   // snow on the upper roof, a lip at the eaves
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(x - w * 0.5, y - hh * 0.2);
      ctx.lineTo(x, y - hh * 0.6);
      ctx.lineTo(x + w * 0.5, y - hh * 0.2);
      ctx.lineTo(x + w * 0.3, y - hh * 0.26);
      ctx.lineTo(x, y - hh * 0.42);
      ctx.lineTo(x - w * 0.3, y - hh * 0.26);
      ctx.closePath(); ctx.fill();
    }
    if (!fine) return;
    ctx.fillStyle = trim;                            // door, left of centre
    ctx.fillRect(x - w * 0.28, y + hh * 0.12, w * 0.19, hh * 0.38);
    ctx.fillStyle = sn.snow ? '#ffd46b' : glass;     // window, right of it — lamplit in winter
    ctx.fillRect(x + w * 0.08, y + hh * 0.08, w * 0.19, hh * 0.20);
    if (sn.blossom) {                                // a window box in flower
      ctx.fillStyle = PALETTE[T.PLAIN].accent;
      ctx.fillRect(x + w * 0.05, y + hh * 0.27, w * 0.25, hh * 0.07);
    }
  }

  /**
   * A HAYSTACK — a dome of the season's accent with a shaded underside. None in spring (the
   * crop is still growing); autumn's is a rolled bale with its spiral end; winter's wears snow.
   */
  function drawHay(ctx, m) {
    const sn = Renderer.SEASON;
    if (sn.blossom) return;
    const pal = PALETTE[T.FIELD];
    ctx.fillStyle = pal.accent || shade(pal.ink, 0.35);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.hr, 0, TAU); ctx.fill();
    ctx.fillStyle = shade(pal.ink, -0.18);
    ctx.fillRect(m.x - m.hr, m.y + m.hr * 0.55, m.hr * 2, m.hr * 0.32);
    if (sn.stubble) {
      ctx.strokeStyle = shade(pal.ink, -0.1);
      ctx.lineWidth = m.hr * 0.16;
      ctx.beginPath(); ctx.arc(m.x - m.hr * 0.1, m.y - m.hr * 0.05, m.hr * 0.45, 0, TAU); ctx.stroke();
    } else if (sn.snow) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(m.x, m.y - m.hr * 0.3, m.hr * 0.86, m.hr * 0.55, 0, Math.PI, 0); ctx.fill();
    }
  }

  // ---------------------------------------------------------------- painted ground
  //
  // Furrows, hedgerows and grass are PAINT on the ground, not things standing on it, so they
  // belong with the river and the railway in the ground pass, under every standing mark.

  /**
   * FIELD — furrow ROWS parallel to the edge the wedge faces, stepping outward from the centre
   * and clipped to the wedge so each stops exactly at its borders (rows radiating from the
   * centre read as a fan and leave most of the wedge empty). A darker HEDGEROW runs between
   * two of them — this is a game called Hedgerows.
   */
  function drawField(ctx, cx, cy, size, run, seed, pal, fine) {
    const mid = 60 * (run.start + (run.len - 1) / 2) * DEG;
    const n = 2 + (hash32(seed, run.start, 17) % 2);       // 2..3 rows
    ctx.save();
    wedgePath(ctx, cx, cy, size, run.start, run.len);
    ctx.clip();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    const base = ctx.globalAlpha;
    const sn = Renderer.SEASON;
    ctx.strokeStyle = pal.ink;
    // Spring: rows of green shoots (a dashed row); autumn: thin stubble; otherwise furrows.
    ctx.globalAlpha = base * (sn.blossom ? 0.75 : 0.4);
    ctx.lineWidth = size * (sn.stubble ? 0.03 : 0.05);
    ctx.lineCap = 'butt';
    if (sn.blossom) ctx.setLineDash([size * 0.045, size * 0.05]);
    const step = size * 0.22;
    const off = size * 0.30 + (rnd(seed, run.start, 29) - 0.5) * size * 0.08;
    // A wedge of 4+ edges wraps past the centre; rows only stepped outward along 'mid', so its
    // back half stayed bare (Nic, 2026-09-23). Carry the rows back across the whole hex.
    const i0 = run.len > 3 ? -Math.floor((off + size * 0.9) / step) : 0;
    ctx.beginPath();
    for (let i = i0; i < n; i++) {
      const x = off + i * step;
      ctx.moveTo(x, -size);
      ctx.lineTo(x, size);
    }
    ctx.stroke();
    if (sn.blossom) ctx.setLineDash([]);
    if (sn.snow) {
      // snow lying in the furrows, just beside each row
      ctx.globalAlpha = base * 0.85;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = size * 0.055;
      ctx.beginPath();
      for (let i = i0; i < n; i++) {
        const x = off + i * step + size * 0.06;
        ctx.moveTo(x, -size);
        ctx.lineTo(x, size);
      }
      ctx.stroke();
    }
    if (fine) {
      // the hedge: one darker, fatter line sitting between two furrows. Kept well under full
      // alpha on purpose — at full strength it stops reading as a hedge and reads as a scar.
      ctx.globalAlpha = base * 0.5;
      ctx.strokeStyle = shade(pal.ink, -0.3);
      ctx.lineWidth = size * 0.05;
      ctx.lineCap = 'round';
      const hx = off + step * 0.5;
      ctx.beginPath();
      ctx.moveTo(hx, -size * 0.52);
      ctx.lineTo(hx, size * 0.52);
      ctx.stroke();
    }
    ctx.restore();
  }

  /**
   * PLAIN — the pressure valve, and the tile the player sees most. It used to be a flat wedge;
   * a few grass tufts (one stroked path, whatever the count) and, in spring and summer, two
   * flower specks, give it something to look at without ever competing with a real terrain.
   */
  const SPRING_FLOWERS = ['#ee9fc0', '#ffffff', '#f5d547', '#b79be6', '#f08a6c', '#7fbcea', '#e25a8c'];

  function drawPlain(ctx, cx, cy, size, run, seed, pal, busy) {
    const sn = Renderer.SEASON;
    const base = ctx.globalAlpha;
    if (sn.snow) {
      // Snow drifts: a blue shadow under a white mound, 1..2 per wedge.
      const k = 1 + (hash32(seed, run.start, 57) % 2);
      for (let i = 0; i < k; i++) {
        const p = inWedge(cx, cy, size, run, seed, i + 95);
        const w = size * (0.13 + 0.05 * rnd(seed, run.start * 7 + i, 59));
        ctx.globalAlpha = base * 0.45;
        ctx.fillStyle = pal.ink;
        ctx.beginPath(); ctx.ellipse(p.x, p.y + w * 0.12, w, w * 0.34, 0, 0, TAU); ctx.fill();
        ctx.globalAlpha = base;
        ctx.fillStyle = pal.accent;
        ctx.beginPath(); ctx.ellipse(p.x - w * 0.08, p.y, w * 0.86, w * 0.3, 0, 0, TAU); ctx.fill();
      }
    }
    const n = sn.snow ? 2 : 3 + (hash32(seed, run.start, 53) % 2);   // winter: a few tufts poke through
    ctx.globalAlpha = base * 0.7;
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = size * 0.035;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const p = inWedge(cx, cy, size, run, seed, i + 80);
      const h = size * (0.075 + 0.035 * rnd(seed, run.start * 17 + i, 13));
      // three blades splaying up from one root — a Λ of two blades reads as a caret, not grass
      ctx.moveTo(p.x, p.y + h * 0.5); ctx.lineTo(p.x - h * 0.62, p.y - h * 0.42);
      ctx.moveTo(p.x, p.y + h * 0.5); ctx.lineTo(p.x + h * 0.05, p.y - h * 0.72);
      ctx.moveTo(p.x, p.y + h * 0.5); ctx.lineTo(p.x + h * 0.68, p.y - h * 0.30);
    }
    ctx.stroke();
    // Spring: a meadow in flower on every wedge (pink and white). Summer: buttercups on half.
    // Autumn: fallen leaves blown in from the woods.
    ctx.globalAlpha = base;
    if (sn.blossom || sn.leaves || (sn.fruit && hash32(seed, run.start, 67) % 2 === 0)) {
      // Spring sprinkles a many-coloured meadow (Nic, 2026-09-23: more, and colourful), ~3 per edge; a landmark tile (busy: its own decor, and a 2D-call budget) keeps 4.
      const k = sn.blossom ? busy ? 4 : 2 + run.len * 3 + (hash32(seed, run.start, 71) % 3) : 3;
      for (let i = 0; i < k; i++) {
        const p = inWedge(cx, cy, size, run, seed, i + 90);
        const rad = size * (sn.leaves ? 0.032 : sn.blossom ? 0.026 + 0.014 * rnd(seed, run.start * 5 + i, 73) : 0.03);
        ctx.fillStyle = sn.blossom ? SPRING_FLOWERS[hash32(seed, run.start * 11 + i, 79) % SPRING_FLOWERS.length]
          : (sn.leaves && i === 1) ? '#b8471f' : pal.accent;
        ctx.beginPath();
        if (sn.leaves) ctx.ellipse(p.x, p.y, rad * 1.5, rad * 0.8, rnd(seed, run.start + i, 97) * Math.PI, 0, TAU);
        else ctx.arc(p.x, p.y, rad, 0, TAU);
        ctx.fill();
      }
    }
  }

  // ---------------------------------------------------------------- line terrains
  //
  // WATER and RAIL share one geometry: exactly two edges ⇒ a single quadratic whose control
  // point is the hex centre (through / bend / sharp all read as one continuous run); anything
  // else (an `end`, a `fork`) ⇒ a stub per edge into the centre plus a small disc there.

  /**
   * Segments as [{ p0, c, p1, b0, b1 }]; `c` is the quadratic control point and b0/b1 say
   * whether that endpoint sits ON the hex boundary (as opposed to the hex centre). segPath
   * uses those flags to pull a round-capped stroke back off the seam — see below.
   */
  function lineSegs(cx, cy, size, dirs) {
    const out = [];
    if (dirs.length === 2) {
      out.push({
        p0: edgeMid(cx, cy, size, dirs[0]), c: { x: cx, y: cy }, p1: edgeMid(cx, cy, size, dirs[1]),
        b0: true, b1: true,
      });
    } else {
      for (let i = 0; i < dirs.length; i++) {
        const m = edgeMid(cx, cy, size, dirs[i]);
        out.push({
          p0: m, c: { x: (m.x + cx) / 2, y: (m.y + cy) / 2 }, p1: { x: cx, y: cy },
          b0: true, b1: false,
        });
      }
    }
    return out;
  }

  /** The sub-quadratic over [a, b] of a quadratic, by de Casteljau. */
  function subQuad(s, a, b) {
    const l = (u, v, t) => ({ x: u.x + (v.x - u.x) * t, y: u.y + (v.y - u.y) * t });
    const at = (t) => l(l(s.p0, s.c, t), l(s.c, s.p1, t), t);
    // Split at `a` first: the right half is (B(a), lerp(c, p1, a), p1). Then take that half's
    // left part at b' = (b − a) / (1 − a).
    const start = at(a);
    const rc = l(s.c, s.p1, a);
    const bp = a < 1 ? (b - a) / (1 - a) : 0;
    return { p0: start, c: l(start, rc, bp), p1: at(b) };
  }

  /**
   * How a line crosses a tile seam — the whole problem, in one place.
   *
   * Cells are rasterised ONE AT A TIME, every layer of a cell before the next cell exists, so
   * whatever a stroke puts past the hex edge is later painted over by the neighbour, and
   * whatever it leaves short of the edge shows the terrain fill through.
   *
   * ROUND caps cannot do this. A round cap is a half-disc: pull the path back so the cap's tip
   * lands on the seam and the stroke is only a *point* wide there, tapering from full width a
   * cap-radius inside the tile down to nothing at the border — which is the pale pinch at every
   * curved river seam. Leave the cap past the seam instead and the neighbour's fat BANK, drawn
   * later, bites a dark notch out of this tile's body and chops its highlight into dashes.
   *
   * BUTT caps do. At a boundary endpoint the tangent is the apothem (centre → edge midpoint),
   * which is perpendicular to that edge — so a butt cap lies flat ALONG the seam, at full
   * stroke width, and the neighbour's identical stroke meets it exactly. `over` (world px) then
   * pushes each end a hair past the seam, which does two things: it covers the ~size*0.01 the
   * neighbour's own wedge fill strokes over the border, and it stops two abutting antialiased
   * edges from leaving a light hairline down the seam.
   *
   * The overhang is invisible because the layers of a river are concentric and every tile draws
   * them in the same order: a neighbour's bank overhang lands exactly on this tile's bank+body,
   * and its body and glint — which reach FURTHER over (see drawWater) — repaint the middle in
   * the colours that were already there.
   */
  function quadAt(s, t) {
    const u = 1 - t;
    return {
      x: u * u * s.p0.x + 2 * u * t * s.c.x + t * t * s.p1.x,
      y: u * u * s.p0.y + 2 * u * t * s.c.y + t * t * s.p1.y,
    };
  }

  /**
   * How far along in `t` you must go from one end of a quadratic to move `cut` px (used with a
   * NEGATIVE sign to reach the same distance the other way, off the end of the curve — the
   * quadratic is a polynomial, so de Casteljau extrapolates as happily as it splits).
   * The first guess comes from the curve's speed at that end (|B'(0)| = 2|c − p0|); two
   * chord-length corrections fix it where the curve bends hard, which for a hex is the `sharp`
   * hairpin between two adjacent edges — the one case where the speed at the end overstates
   * how fast the curve actually leaves it.
   */
  function trimT(s, cut, atEnd) {
    const P = atEnd ? s.p1 : s.p0;
    const sp = 2 * Math.hypot(s.c.x - P.x, s.c.y - P.y);
    if (!(sp > 0)) return 0;
    let t = Math.min(0.45, cut / sp);
    for (let k = 0; k < 2; k++) {
      const q = quadAt(s, atEnd ? 1 - t : t);
      const d = Math.hypot(q.x - P.x, q.y - P.y);
      if (d <= 1e-6) break;
      t = Math.min(0.45, t * cut / d);
    }
    return t;
  }

  function segPath(ctx, segs, over) {
    const ext = over > 0 ? over : 0;
    for (let i = 0; i < segs.length; i++) {
      let s = segs[i];
      if (ext > 0 && (s.b0 || s.b1)) {
        const t0 = s.b0 ? trimT(s, ext, false) : 0;
        const t1 = s.b1 ? trimT(s, ext, true) : 0;
        if (t0 > 0 || t1 > 0) s = subQuad(s, -t0, 1 + t1);
      }
      ctx.beginPath();
      ctx.moveTo(s.p0.x, s.p0.y);
      ctx.quadraticCurveTo(s.c.x, s.c.y, s.p1.x, s.p1.y);
      ctx.stroke();
    }
  }
  function segAt(s, t) {
    const u = 1 - t;
    return {
      x: u * u * s.p0.x + 2 * u * t * s.c.x + t * t * s.p1.x,
      y: u * u * s.p0.y + 2 * u * t * s.c.y + t * t * s.p1.y,
      dx: 2 * u * (s.c.x - s.p0.x) + 2 * t * (s.p1.x - s.c.x),
      dy: 2 * u * (s.c.y - s.p0.y) + 2 * t * (s.p1.y - s.c.y),
    };
  }

  /**
   * WATER — three strokes down the same path: a darker BANK either side (a fatter stroke under
   * everything), the river body, and a lighter mid-line. render/anim.js animates a glint on top
   * of the mid-line; the static river has to read on its own without it, which is why the
   * mid-line is here and not left to the anim layer.
   */
  function drawWater(ctx, cx, cy, size, dirs, pal, fine) {
    const segs = lineSegs(cx, cy, size, dirs);
    // How far each layer runs past the seam. They are NESTED on purpose (see segPath): the
    // neighbour's bank overhang lands on this tile's bank+body, and its body and glint — which
    // reach further — repaint the middle in exactly the colours that were there, so the whole
    // overlap cancels out and the river crosses the border at full width.
    const ob = size * SEAM_OVER, oy = ob * 2, og = ob * 3;
    ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    if (fine) {
      ctx.strokeStyle = pal.accent || shade(pal.ink, -0.18);
      ctx.lineWidth = size * 0.28;
      segPath(ctx, segs, ob);
    }
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = size * 0.21;
    segPath(ctx, segs, oy);
    // A butt cap at the hex CENTRE (a stub or a fork's arms) would leave the arms meeting in a
    // rosette of flat ends. The disc is what rounds the junction off — it is why the caps can
    // be butt at both ends of a stroke.
    if (dirs.length !== 2) {
      ctx.fillStyle = pal.ink;
      ctx.beginPath(); ctx.arc(cx, cy, size * 0.15, 0, TAU); ctx.fill();
    }
    if (!fine) return;
    // the glint down the middle — in winter, broken plates of ice
    const ice = !!Renderer.SEASON.snow;
    ctx.strokeStyle = ice ? '#ffffff' : shade(pal.fill, 0.42);
    ctx.lineWidth = size * (ice ? 0.09 : 0.065);
    if (ice) ctx.setLineDash([size * 0.16, size * 0.07]);
    segPath(ctx, segs, og);
    if (ice) ctx.setLineDash([]);
    if (dirs.length !== 2) {
      ctx.fillStyle = shade(pal.fill, 0.42);
      ctx.beginPath(); ctx.arc(cx, cy, size * 0.0325, 0, TAU); ctx.fill();
    }
  }

  function drawRail(ctx, cx, cy, size, dirs, pal, fine) {
    const segs = lineSegs(cx, cy, size, dirs);
    const ob = size * SEAM_OVER;
    ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
    // the ballast band the sleepers are bedded into
    if (fine) {
      ctx.strokeStyle = pal.accent || shade(pal.fill, -0.12);
      ctx.lineWidth = size * 0.19;
      segPath(ctx, segs, ob);
      // …and the same disc that rounds a river junction off (see drawWater)
      if (dirs.length !== 2) {
        ctx.beginPath(); ctx.arc(cx, cy, size * 0.095, 0, TAU);
        ctx.fillStyle = pal.accent || shade(pal.fill, -0.12);
        ctx.fill();
      }
    }
    // sleepers next, so the rail line sits on top of them
    if (fine) {
      ctx.strokeStyle = shade(pal.ink, 0.42);
      ctx.lineWidth = size * 0.035;
      const ts = [0.18, 0.4, 0.62, 0.84];
      for (let i = 0; i < segs.length; i++) {
        for (let j = 0; j < ts.length; j++) {
          const a = segAt(segs[i], ts[j]);
          const len = Math.hypot(a.dx, a.dy) || 1;
          const nx = -a.dy / len * size * 0.075, ny = a.dx / len * size * 0.075;
          ctx.beginPath();
          ctx.moveTo(a.x - nx, a.y - ny);
          ctx.lineTo(a.x + nx, a.y + ny);
          ctx.stroke();
        }
      }
    }
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = size * 0.055;
    ctx.setLineDash([size * 0.15, size * 0.09]);
    segPath(ctx, segs, ob * 2);        // past the ballast's own overhang, as the river's body is
    ctx.setLineDash([]);
    if (dirs.length !== 2) {
      ctx.fillStyle = pal.ink;
      ctx.beginPath(); ctx.arc(cx, cy, size * 0.075, 0, TAU); ctx.fill();
    }
  }

  // ---------------------------------------------------------------- landmarks

  /**
   * A landmark tile (core: `cell.tile.landmark`) is the centrepiece of its hex — 'windmill',
   * 'chapel' or 'stones' — painted in the same illustrative language as the houses and trees
   * (lit from the top-left, shaded lower-right, a shadow cast down-right onto the ground), on
   * a soft golden ground glow that says "this one is special" from a long way out.
   *
   * The pieces, and where each lives:
   *   drawLandmarkGround — the golden glow (+ the stones' worn ring and rune circle). GROUND
   *     paint, drawn in drawTile's ground pass so every scatter mark stands on it.
   *   drawLandmark       — the building itself; a member of the y-sorted mark list.
   *   drawSails          — the windmill's sails. They TURN, so on the board they are drawn by
   *     render/anim.js over the cached tower (the world cache must never hold anything that
   *     moves); drawTile paints them static only when asked (`opts.sails`), which is every
   *     context with no anim layer: the HUD queue, the ghost, the title strip, the harness.
   *   geom.landmarkAnchors — the world points anim.js animates from (the sail hub, the
   *     chapel's windows, the stone ring's centre). Same numbers as the art — change one, the
   *     other follows, because they are the same constants.
   *
   * Below LOD_MIN_PX each is a dark silhouette on a solid gold disc — never a blank. Unknown
   * kinds draw nothing (suite-checked).
   */
  // Contract order (core's LANDMARK_KINDS). The last eight are wave 6's MIXED-tile kinds: see
  // LM_LAYOUT and lmPlan below for how their art follows the tile's rotation.
  const LANDMARKS = {
    windmill: 1, chapel: 1, stones: 1,
    depot: 1, watermill: 1, farmstead: 1, sawmill: 1, bridge: 1, market: 1, abbey: 1, beehives: 1,
  };
  Renderer.LANDMARK_KINDS = Object.keys(LANDMARKS);

  const LM = {
    R: 0.55,           // disc kept clear of scatter marks around the landmark, × size
    SCALE: 1.2,        // the art's own unit, × size — the numbers below are in that unit
    CHAPEL_DY: 0.05,   // the chapel sits a touch low, so its cross stays inside the hex
    HUB_Y: -0.30,      // windmill sail hub, × size from the tile centre
    SAIL_R: 0.44,      // sail length, × size
    SAIL_STATIC: Math.PI / 4,   // the angle a static (no-anim) mill is painted at
    ink: '#4a3f33',
    lit: '#f3ecdb', mid: '#dfd3ba', dark: '#b3a385',             // limestone / render
    timber: '#8c5b3b', timberDark: '#5a3a26', cloth: '#f4ead3',
    glass: '#f8d98c', gold: '#d9a521', goldLight: '#ffe7a0',
    slate: '#6c7079', slateLit: '#8e939d', slateDark: '#51545c',
    sarsen: '#a9a393', sarsenLit: '#cdc7b7', sarsenDark: '#7a7467', moss: '#6f8f4e',
    yew: '#3f6446', yewLit: '#5d8a5f', snow: '#fbfbf6', rune: '#6fdcc4',
    shadow: '#2e2619',
  };

  /** A closed polygon from a flat list of (u, v) pairs in size units around (cx, cy). */
  function polyPath(ctx, cx, cy, s, pts) {
    ctx.beginPath();
    ctx.moveTo(cx + pts[0] * s, cy + pts[1] * s);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(cx + pts[i] * s, cy + pts[i + 1] * s);
    ctx.closePath();
  }
  function fillPoly(ctx, cx, cy, s, pts, col) { polyPath(ctx, cx, cy, s, pts); ctx.fillStyle = col; ctx.fill(); }
  /** polyPath without the beginPath: several same-colour polygons, one fill. */
  function addPoly(ctx, cx, cy, s, pts) {
    ctx.moveTo(cx + pts[0] * s, cy + pts[1] * s);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(cx + pts[i] * s, cy + pts[i + 1] * s);
    ctx.closePath();
  }

  /** An arched opening (door / window) as ONE contour: sides, a semicircular head. */
  function archPath(ctx, x, y, w, h) {
    const r = w / 2;
    ctx.beginPath();
    ctx.moveTo(x - r, y + h / 2);
    ctx.lineTo(x - r, y - h / 2 + r);
    ctx.arc(x, y - h / 2 + r, r, Math.PI, 0);
    ctx.lineTo(x + r, y + h / 2);
    ctx.closePath();
  }
  function fillArch(ctx, cx, cy, s, u, v, w, h, col) {
    archPath(ctx, cx + u * s, cy + v * s, w * s, h * s);
    ctx.fillStyle = col; ctx.fill();
  }
  function fillEllipse(ctx, x, y, rx, ry, col) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
    ctx.fillStyle = col; ctx.fill();
  }

  /**
   * The ground under a landmark: a warm golden glow (a radial gradient, but only ever baked
   * into the world cache or a HUD slot — never per frame) and, for the stones, the worn ring
   * of turf and a faint rune circle. Below LOD it is a solid gold disc: at overview zoom that
   * disc is what makes a landmark findable.
   */
  function drawLandmarkGround(ctx, cx, cy, size, kind, fine) {
    if (!LANDMARKS[kind]) return;
    const a0 = ctx.globalAlpha;
    if (!fine) {
      ctx.globalAlpha = a0 * 0.75;
      fillEllipse(ctx, cx, cy + size * 0.04, size * 0.58, size * 0.52, LM.gold);
      ctx.globalAlpha = a0;
      return;
    }
    const gy = cy + size * 0.06;
    const gr = ctx.createRadialGradient ? ctx.createRadialGradient(cx, gy, 0, cx, gy, size * 0.72) : null;
    if (gr && gr.addColorStop) {
      gr.addColorStop(0, 'rgba(255,229,150,0.50)');
      gr.addColorStop(0.55, 'rgba(255,214,120,0.24)');
      gr.addColorStop(1, 'rgba(255,208,110,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(cx, gy, size * 0.72, 0, TAU); ctx.fill();
    } else {
      ctx.globalAlpha = a0 * 0.3;
      fillEllipse(ctx, cx, gy, size * 0.6, size * 0.52, LM.goldLight);
      ctx.globalAlpha = a0;
    }
    // a hairline of gold round the glow — reads as "set apart" without becoming a UI ring
    ctx.globalAlpha = a0 * 0.45;
    ctx.strokeStyle = LM.gold;
    ctx.lineWidth = size * 0.018;
    ctx.beginPath(); ctx.ellipse(cx, gy, size * 0.56, size * 0.44, 0, 0, TAU); ctx.stroke();
    if (kind === 'stones') {
      // the turf worn pale by feet, walking the ring
      ctx.globalAlpha = a0 * 0.5;
      ctx.strokeStyle = '#efe7c9';
      ctx.lineWidth = size * 0.07;
      ctx.beginPath(); ctx.ellipse(cx, cy + size * 0.06, size * 0.36, size * 0.21, 0, 0, TAU); ctx.stroke();
      // a faint rune circle round the altar
      ctx.globalAlpha = a0 * 0.55;
      ctx.strokeStyle = LM.rune;
      ctx.lineWidth = size * 0.014;
      ctx.setLineDash([size * 0.05, size * 0.035]);
      ctx.beginPath(); ctx.ellipse(cx, cy + size * 0.06, size * 0.19, size * 0.105, 0, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = a0;
  }
  Renderer.drawLandmarkGround = drawLandmarkGround;

  /**
   * Four sails round a hub at (hx, hy), turned by `ang`. Each is a stock (the arm) with a
   * lattice frame on its trailing side, sailcloth stretched over the lattice. render/anim.js
   * bakes one copy into a sprite and spins that; this is also the static painter.
   */
  function drawSails(ctx, hx, hy, size, ang, fine) {
    const R = LM.SAIL_R * size;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (!fine) {
      ctx.strokeStyle = LM.ink;
      ctx.lineWidth = size * 0.06;
      ctx.beginPath();
      ctx.moveTo(-R, 0); ctx.lineTo(R, 0);
      ctx.moveTo(0, -R); ctx.lineTo(0, R);
      ctx.stroke();
      ctx.restore();
      return;
    }
    const w = size * 0.115, x0 = size * 0.014, r0 = size * 0.12;
    for (let k = 0; k < 4; k++) {
      if (k) ctx.rotate(Math.PI / 2);
      // sailcloth, then the lattice over it, then the stock over both
      ctx.fillStyle = LM.cloth;
      ctx.fillRect(x0, -R, w, R - r0);
      ctx.strokeStyle = LM.timberDark;
      ctx.lineWidth = size * 0.012;
      ctx.beginPath();
      ctx.moveTo(x0 + w, -R); ctx.lineTo(x0 + w, -r0);          // the outer rail
      ctx.moveTo(x0 + w * 0.5, -R); ctx.lineTo(x0 + w * 0.5, -r0);
      for (let j = 0; j <= 5; j++) {                            // the bars
        const y = -r0 - (R - r0) * j / 5;
        ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y);
      }
      ctx.stroke();
      ctx.fillStyle = shade(LM.cloth, -0.12);                   // the leading board
      ctx.fillRect(-size * 0.04, -R * 0.96, size * 0.026, R * 0.96 - r0);
      ctx.strokeStyle = LM.timberDark;
      ctx.lineWidth = size * 0.032;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -R); ctx.stroke();
    }
    ctx.fillStyle = LM.timberDark;
    ctx.beginPath(); ctx.arc(0, 0, size * 0.045, 0, TAU); ctx.fill();
    ctx.fillStyle = LM.gold;
    ctx.beginPath(); ctx.arc(0, 0, size * 0.018, 0, TAU); ctx.fill();
    ctx.restore();
  }
  Renderer.drawSails = drawSails;

  function drawWindmill(ctx, cx, cy, s, fine, sails, snow) {
    const a0 = ctx.globalAlpha;
    const hw = (v) => 0.17 - (0.30 - v) / 0.54 * 0.07;   // tower half-width at height v
    if (!fine) {
      fillPoly(ctx, cx, cy, s, [-0.17, 0.30, -0.10, -0.24, 0.10, -0.24, 0.17, 0.30], LM.ink);
      fillPoly(ctx, cx, cy, s, [-0.14, -0.22, 0, -0.42, 0.14, -0.22], LM.ink);
      if (sails) drawSails(ctx, cx, cy + LM.HUB_Y * s, s, LM.SAIL_STATIC, false);
      return;
    }
    // shadow: a pool at the foot and the tower's long shadow cast down-right
    ctx.globalAlpha = a0 * 0.2;
    fillPoly(ctx, cx, cy, s, [-0.12, 0.30, 0.17, 0.30, 0.46, 0.47, 0.30, 0.52], LM.shadow);
    ctx.globalAlpha = a0 * 0.24;
    fillEllipse(ctx, cx + s * 0.03, cy + s * 0.31, s * 0.22, s * 0.06, LM.shadow);
    ctx.globalAlpha = a0;
    // the tower: body, lit left flank, shaded right flank
    fillPoly(ctx, cx, cy, s, [-0.17, 0.30, -0.10, -0.24, 0.10, -0.24, 0.17, 0.30], LM.mid);
    fillPoly(ctx, cx, cy, s, [-0.17, 0.30, -0.10, -0.24, -0.015, -0.24, -0.04, 0.30], LM.lit);
    fillPoly(ctx, cx, cy, s, [0.075, 0.30, 0.055, -0.24, 0.10, -0.24, 0.17, 0.30], LM.dark);
    // stone courses
    ctx.strokeStyle = LM.dark;
    ctx.lineWidth = s * 0.012;
    ctx.globalAlpha = a0 * 0.7;
    ctx.beginPath();
    ctx.moveTo(cx - hw(0.16) * s, cy + 0.16 * s); ctx.lineTo(cx + hw(0.16) * s, cy + 0.16 * s);
    ctx.moveTo(cx - hw(-0.12) * s, cy - 0.12 * s); ctx.lineTo(cx + hw(-0.12) * s, cy - 0.12 * s);
    ctx.stroke();
    ctx.globalAlpha = a0 * 0.55;
    polyPath(ctx, cx, cy, s, [-0.17, 0.30, -0.10, -0.24, 0.10, -0.24, 0.17, 0.30]);
    ctx.strokeStyle = LM.ink; ctx.lineWidth = s * 0.016; ctx.stroke();
    ctx.globalAlpha = a0;
    // the reefing stage: a timber gallery round the tower
    const sw = hw(0.02) + 0.05;
    ctx.fillStyle = LM.timberDark;
    ctx.fillRect(cx - sw * s, cy + 0.005 * s, sw * 2 * s, 0.035 * s);
    ctx.fillStyle = LM.timber;
    ctx.fillRect(cx - sw * s, cy + 0.005 * s, sw * 1.1 * s, 0.014 * s);
    // door and lit windows
    fillArch(ctx, cx, cy, s, -0.01, 0.235, 0.085, 0.13, LM.timberDark);
    fillArch(ctx, cx, cy, s, 0.0, -0.13, 0.05, 0.075, LM.glass);
    fillArch(ctx, cx, cy, s, -0.03, 0.11, 0.045, 0.06, LM.glass);
    // the cap: a timber boat-cap, lit on its left
    ctx.beginPath();
    ctx.moveTo(cx - 0.14 * s, cy - 0.225 * s);
    ctx.quadraticCurveTo(cx - 0.13 * s, cy - 0.43 * s, cx, cy - 0.44 * s);
    ctx.quadraticCurveTo(cx + 0.13 * s, cy - 0.43 * s, cx + 0.14 * s, cy - 0.225 * s);
    ctx.closePath();
    ctx.fillStyle = LM.timber; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 0.115 * s, cy - 0.235 * s);
    ctx.quadraticCurveTo(cx - 0.11 * s, cy - 0.40 * s, cx - 0.02 * s, cy - 0.415 * s);
    ctx.lineTo(cx - 0.035 * s, cy - 0.235 * s);
    ctx.closePath();
    ctx.fillStyle = shade(LM.timber, 0.22); ctx.fill();
    if (snow) {
      ctx.beginPath();
      ctx.moveTo(cx - 0.115 * s, cy - 0.34 * s);
      ctx.quadraticCurveTo(cx - 0.08 * s, cy - 0.445 * s, cx, cy - 0.448 * s);
      ctx.quadraticCurveTo(cx + 0.08 * s, cy - 0.445 * s, cx + 0.115 * s, cy - 0.34 * s);
      ctx.quadraticCurveTo(cx, cy - 0.385 * s, cx - 0.115 * s, cy - 0.34 * s);
      ctx.closePath();
      ctx.fillStyle = LM.snow; ctx.fill();
    }
    ctx.fillStyle = LM.gold;                                   // the finial
    ctx.beginPath(); ctx.arc(cx, cy - 0.455 * s, s * 0.02, 0, TAU); ctx.fill();
    if (sails) drawSails(ctx, cx, cy + LM.HUB_Y * s, s, LM.SAIL_STATIC, true);
  }

  const CHAPEL_WINDOWS = [[-0.22, 0.11], [-0.11, 0.11], [0.0, 0.11]];
  const CHAPEL_BELFRY = [0.155, -0.255];

  function drawChapel(ctx, cx, cy, s, fine, snow) {
    const a0 = ctx.globalAlpha;
    if (!fine) {
      fillPoly(ctx, cx, cy, s, [-0.32, 0.28, -0.32, -0.02, -0.26, -0.20, 0.10, -0.20, 0.10, 0.28], LM.ink);
      fillPoly(ctx, cx, cy, s, [0.07, 0.28, 0.07, -0.36, 0.15, -0.70, 0.24, -0.36, 0.24, 0.28], LM.ink);
      return;
    }
    // shadow down-right: the nave's pool and the tower + spire thrown long across the grass
    ctx.globalAlpha = a0 * 0.2;
    fillPoly(ctx, cx, cy, s, [0.08, 0.28, 0.30, 0.28, 0.62, 0.44, 0.52, 0.50], LM.shadow);
    ctx.globalAlpha = a0 * 0.24;
    fillEllipse(ctx, cx + s * 0.02, cy + s * 0.295, s * 0.36, s * 0.055, LM.shadow);
    ctx.globalAlpha = a0;
    // the churchyard yew, behind the west end
    ctx.fillStyle = shade(LM.yew, -0.35);
    ctx.fillRect(cx - 0.375 * s, cy + 0.10 * s, 0.03 * s, 0.10 * s);
    fillEllipse(ctx, cx - 0.36 * s, cy + 0.04 * s, 0.085 * s, 0.10 * s, LM.yew);
    fillEllipse(ctx, cx - 0.38 * s, cy + 0.01 * s, 0.05 * s, 0.06 * s, LM.yewLit);
    if (snow) fillEllipse(ctx, cx - 0.37 * s, cy - 0.035 * s, 0.05 * s, 0.022 * s, LM.snow);
    // the nave: its long wall to us, a plinth, a slate roof pitched away
    fillPoly(ctx, cx, cy, s, [-0.30, 0.28, -0.30, -0.03, 0.10, -0.03, 0.10, 0.28], LM.lit);
    ctx.fillStyle = LM.dark;
    ctx.fillRect(cx - 0.30 * s, cy + 0.245 * s, 0.40 * s, 0.035 * s);
    ctx.fillStyle = LM.mid;
    ctx.fillRect(cx - 0.30 * s, cy - 0.03 * s, 0.40 * s, 0.03 * s);   // the eaves' shadow line
    fillPoly(ctx, cx, cy, s, [-0.34, -0.02, 0.12, -0.02, 0.09, -0.22, -0.28, -0.22], LM.slate);
    fillPoly(ctx, cx, cy, s, [-0.28, -0.22, 0.09, -0.22, 0.095, -0.185, -0.29, -0.185], LM.slateLit);
    if (snow) fillPoly(ctx, cx, cy, s, [-0.30, -0.13, 0.105, -0.13, 0.09, -0.225, -0.28, -0.225], LM.snow);
    // three arched windows, lit from inside
    for (let i = 0; i < CHAPEL_WINDOWS.length; i++) {
      const w = CHAPEL_WINDOWS[i];
      fillArch(ctx, cx, cy, s, w[0], w[1], 0.062, 0.135, LM.ink);
      fillArch(ctx, cx, cy, s, w[0], w[1] + 0.006, 0.04, 0.11, LM.glass);
    }
    // the tower: lit face, receding shaded side, belfry, door
    fillPoly(ctx, cx, cy, s, [0.08, 0.28, 0.08, -0.36, 0.23, -0.36, 0.23, 0.28], LM.lit);
    fillPoly(ctx, cx, cy, s, [0.23, 0.28, 0.23, -0.36, 0.29, -0.33, 0.29, 0.26], LM.dark);
    ctx.globalAlpha = a0 * 0.5;
    polyPath(ctx, cx, cy, s, [0.08, 0.28, 0.08, -0.36, 0.23, -0.36, 0.29, -0.33, 0.29, 0.26, 0.23, 0.28]);
    ctx.strokeStyle = LM.ink; ctx.lineWidth = s * 0.014; ctx.stroke();
    ctx.globalAlpha = a0;
    fillArch(ctx, cx, cy, s, CHAPEL_BELFRY[0], CHAPEL_BELFRY[1], 0.065, 0.10, LM.ink);
    ctx.fillStyle = LM.gold;                                   // the bell
    ctx.beginPath(); ctx.arc(cx + CHAPEL_BELFRY[0] * s, cy + (CHAPEL_BELFRY[1] + 0.01) * s, s * 0.018, 0, TAU); ctx.fill();
    fillArch(ctx, cx, cy, s, 0.155, 0.215, 0.075, 0.13, LM.timberDark);
    // the spire, lit on its left, with a gilded cross
    fillPoly(ctx, cx, cy, s, [0.065, -0.36, 0.245, -0.36, 0.155, -0.70], LM.slate);
    fillPoly(ctx, cx, cy, s, [0.065, -0.36, 0.12, -0.36, 0.155, -0.70], LM.slateLit);
    fillPoly(ctx, cx, cy, s, [0.155, -0.70, 0.245, -0.36, 0.30, -0.335], LM.slateDark);
    if (snow) fillPoly(ctx, cx, cy, s, [0.13, -0.60, 0.18, -0.60, 0.155, -0.70], LM.snow);
    ctx.strokeStyle = LM.gold;
    ctx.lineWidth = s * 0.024;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + 0.155 * s, cy - 0.69 * s); ctx.lineTo(cx + 0.155 * s, cy - 0.82 * s);
    ctx.moveTo(cx + 0.115 * s, cy - 0.775 * s); ctx.lineTo(cx + 0.195 * s, cy - 0.775 * s);
    ctx.stroke();
    // the churchyard: three headstones in the grass out front
    const hs = [[-0.27, 0.36], [-0.17, 0.39], [-0.075, 0.365]];
    for (let i = 0; i < hs.length; i++) {
      ctx.globalAlpha = a0 * 0.25;
      fillEllipse(ctx, cx + (hs[i][0] + 0.02) * s, cy + (hs[i][1] + 0.035) * s, 0.03 * s, 0.01 * s, LM.shadow);
      ctx.globalAlpha = a0;
      fillArch(ctx, cx, cy, s, hs[i][0], hs[i][1], 0.04, 0.07, i === 1 ? LM.sarsenLit : LM.sarsen);
    }
  }

  // The ring: a trilithon at the back, six weathered sarsens round an ellipse. Angles in
  // degrees round the ring (−90 = the far side), heights as a fraction of the tallest.
  const STONE_RING = { cy: 0.06, rx: 0.34, ry: 0.19 };
  const STONES = [[-150, 0.95], [-30, 0.85], [15, 1.05], [70, 0.80], [115, 1.1], [165, 0.9]];

  function drawStones(ctx, cx, cy, s, fine, snow) {
    const a0 = ctx.globalAlpha;
    const ring = STONE_RING;
    const list = [];
    for (let i = 0; i < STONES.length; i++) {
      const a = STONES[i][0] * DEG;
      const near = (Math.sin(a) + 1) / 2;
      list.push({
        x: ring.rx * Math.cos(a), y: ring.cy + ring.ry * Math.sin(a),
        h: 0.24 * (0.78 + 0.32 * near) * STONES[i][1], w: 0.056 * (0.8 + 0.35 * near), i: i,
      });
    }
    // the trilithon on the far side
    list.push({ tri: true, x: 0, y: ring.cy - ring.ry, h: 0.30, w: 0.042 });
    list.sort(function (a, b) { return a.y - b.y; });
    if (!fine) {
      for (let k = 0; k < list.length; k++) {
        const t = list[k];
        if (t.tri) {
          fillPoly(ctx, cx, cy, s, [-0.13, t.y, -0.13, t.y - t.h - 0.05, 0.13, t.y - t.h - 0.05, 0.13, t.y], LM.ink);
        } else {
          fillPoly(ctx, cx, cy, s, [t.x - t.w * 1.2, t.y, t.x - t.w, t.y - t.h, t.x + t.w, t.y - t.h, t.x + t.w * 1.2, t.y], LM.ink);
        }
      }
      return;
    }
    // long shadows first, all of them, so no stone's shadow falls across a stone
    ctx.globalAlpha = a0 * 0.17;
    for (let k = 0; k < list.length; k++) {
      const t = list[k];
      const w = t.tri ? 0.13 : t.w, d = t.h * 1.05;
      fillPoly(ctx, cx, cy, s, [t.x - w, t.y, t.x + w, t.y, t.x + w + d, t.y + d * 0.42, t.x - w + d, t.y + d * 0.42], LM.shadow);
    }
    ctx.globalAlpha = a0;
    // the altar stone at the heart, carrying the rune (anim.js pulses a light over it)
    fillEllipse(ctx, cx, cy + (ring.cy + 0.015) * s, 0.10 * s, 0.045 * s, LM.sarsenDark);
    fillEllipse(ctx, cx, cy + ring.cy * s, 0.09 * s, 0.038 * s, LM.sarsen);
    ctx.strokeStyle = LM.rune;
    ctx.lineWidth = s * 0.014;
    ctx.lineCap = 'round';
    ctx.beginPath();                                      // ᛉ, flattened onto the slab
    ctx.moveTo(cx, cy + (ring.cy + 0.025) * s); ctx.lineTo(cx, cy + (ring.cy - 0.022) * s);
    ctx.moveTo(cx - 0.035 * s, cy + (ring.cy - 0.022) * s); ctx.lineTo(cx, cy + (ring.cy + 0.002) * s);
    ctx.lineTo(cx + 0.035 * s, cy + (ring.cy - 0.022) * s);
    ctx.stroke();
    for (let k = 0; k < list.length; k++) {
      const t = list[k];
      if (t.tri) { drawTrilithon(ctx, cx, cy, s, t, snow); continue; }
      const x = t.x, y = t.y, h = t.h, w = t.w;
      fillPoly(ctx, cx, cy, s, [x - w, y, x - w * 0.72, y - h, x + w * 0.8, y - h * 0.93, x + w, y], LM.sarsen);
      fillPoly(ctx, cx, cy, s, [x - w, y, x - w * 0.72, y - h, x - w * 0.3, y - h * 0.98, x - w * 0.45, y], LM.sarsenLit);
      fillPoly(ctx, cx, cy, s, [x + w * 0.35, y, x + w * 0.38, y - h * 0.95, x + w * 0.8, y - h * 0.93, x + w, y], LM.sarsenDark);
      ctx.globalAlpha = a0 * 0.85;                        // moss at the foot, on the shady side
      fillEllipse(ctx, cx + (x + w * 0.45) * s, cy + (y - 0.012) * s, w * 0.6 * s, 0.022 * s, LM.moss);
      ctx.globalAlpha = a0;
      if (snow) fillPoly(ctx, cx, cy, s, [x - w * 0.76, y - h * 0.86, x - w * 0.72, y - h, x + w * 0.8, y - h * 0.93, x + w * 0.84, y - h * 0.8], LM.snow);
    }
  }

  function drawTrilithon(ctx, cx, cy, s, t, snow) {
    const y = t.y, h = t.h, w = t.w;
    for (let j = -1; j <= 1; j += 2) {
      const x = j * 0.085;
      fillPoly(ctx, cx, cy, s, [x - w, y, x - w * 0.85, y - h, x + w * 0.85, y - h, x + w, y], LM.sarsen);
      fillPoly(ctx, cx, cy, s, [x - w, y, x - w * 0.85, y - h, x - w * 0.3, y - h, x - w * 0.4, y], LM.sarsenLit);
      fillPoly(ctx, cx, cy, s, [x + w * 0.4, y, x + w * 0.35, y - h, x + w * 0.85, y - h, x + w, y], LM.sarsenDark);
    }
    // the lintel, its underside in shadow
    const top = y - h, lw = 0.135;
    fillPoly(ctx, cx, cy, s, [-lw, top + 0.005, -lw + 0.01, top - 0.05, lw - 0.005, top - 0.048, lw, top + 0.005], LM.sarsen);
    fillPoly(ctx, cx, cy, s, [-lw, top - 0.005, -lw + 0.01, top - 0.05, lw - 0.005, top - 0.048, lw, top - 0.005], LM.sarsenLit);
    ctx.fillStyle = LM.sarsenDark;
    ctx.fillRect(cx - lw * s, cy + (top - 0.004) * s, lw * 2 * s, 0.012 * s);
    if (snow) fillPoly(ctx, cx, cy, s, [-lw + 0.005, top - 0.035, -lw + 0.01, top - 0.05, lw - 0.005, top - 0.048, lw - 0.004, top - 0.033], LM.snow);
  }

  // ---------------------------------------------------------------- wave 6: mixed-tile landmarks
  //
  // The eight wave-6 kinds sit on MIXED tiles with a fixed layout (contract §1), which the
  // player rotates. The terrain, lines and scatter follow the tile's real edges like any tile;
  // the art has to follow them too. `lmPlan` recovers the rotation k from the edges (the
  // rotation of LM_LAYOUT that matches best — so a hand-built tile with other edges still
  // draws, at its nearest orientation) and places each building on its own terrain's part.
  // Buildings are always painted UPRIGHT (the world is lit and viewed from one side); only
  // where they stand turns with the tile.
  //
  // Everything here is in HEX-SIZE units (x right, y down, origin the tile centre), not the
  // classic kinds' LM.SCALE unit. Moving parts — the water wheel, bunting, bees, crows — are
  // painted here only when `sails` is true (the no-anim contexts); anim.js draws them on the
  // board from geom.landmarkAnchors, which reads the same plan.

  const LM_LAYOUT = (function () {
    const P = T.PLAIN, F = T.FIELD, O = T.FOREST, V = T.VILLAGE, W = T.WATER, R = T.RAIL;
    return {
      depot: [R, R, R, V, V, V],
      watermill: [W, F, F, W, F, F],
      farmstead: [F, F, F, V, V, V],
      sawmill: [O, O, O, R, V, V],
      bridge: [R, P, W, R, P, W],
      market: [V, V, V, V, V, V],
      abbey: [P, P, P, P, P, P],
      beehives: [F, F, F, O, O, O],
    };
  })();
  Renderer.LM_LAYOUT = LM_LAYOUT;

  const LMC = {
    brick: '#c47658', brickSide: '#95533d', cream: '#f4e9cf', whitewash: '#f6efdf',
    green: '#3f6b4e', greenLit: '#6a9a73', iron: '#3a393b', ironLit: '#5d5b5e',
    thatch: '#c99e56', thatchLit: '#e3c07c', thatchDark: '#94703a',
    barn: '#ab4f39', barnSide: '#7c3727', barnRoof: '#5f4738', barnRoofLit: '#7d6150',
    straw: '#ddb056', strawLit: '#f1d185', strawDark: '#a67b2d',
    board: '#9a6a44', cut: '#e6c291', saw: '#d3d8dc', plank: '#dcb47d',
    pit: '#2d4d5d', foam: '#f3f9fb',
    stone: '#cdc1a6', stoneLit: '#ece3cf', stoneSide: '#a39478', stoneDark: '#83765e', vault: '#2e3d45',
    cobble: '#e9dcc0', cobbleEdge: '#cdb994', platform: '#e6dfcc', platformEdge: '#b9ae95',
    floor: '#e2dcc4', ivy: '#5f8a4a', ivyLit: '#7fa663',
    awning: ['#c8473b', '#3e78a6', '#4f9158', '#d9a236'],
    produce: ['#c8473b', '#86ad4f', '#e59a37'],
    flower: ['#e56f93', '#f3d24b', '#9c83d6', '#ffffff'],
    crow: '#2a2828', rope: '#6b5a44', red: '#b84434',
  };

  /** The rotation k (0..5) that turns `kind`'s layout into `edges`: the best match wins. */
  function lmRot(L, edges) {
    if (!edges) return 0;
    let best = 0, bestN = -1;
    for (let k = 0; k < 6; k++) {
      let n = 0;
      for (let d = 0; d < 6; d++) if (edges[(d + k) % 6] === L[d]) n++;
      if (n > bestN) { bestN = n; best = k; }
    }
    return best;
  }
  /** `r` × the unit vector of layout direction `b` (fractional = between edges) under rotation k. */
  function dirV(b, k, r) {
    const a = 60 * (b + k) * DEG;
    return { x: r * Math.cos(a), y: r * Math.sin(a) };
  }
  /**
   * A chimney stack standing behind the ridge of gable building `b` (fx = × width from centre),
   * in the building's design units; `f` is the piece's scale about its foot (see `about`), so
   * geom.chimneys can put the smoke where the scaled stack actually is.
   */
  function stackOf(b, fx) {
    return { x: b.x + b.w * fx, y0: b.y - b.h - b.rh * 0.35, y1: b.y - b.h - b.rh - 0.075, w: 0.048, f: b };
  }
  /** The top of a (design-unit) stack after its piece's scale, in hex units. */
  function stackTop(st) {
    const f = st.f, A = f.A || 1;
    return { x: f.x + (st.x - f.x) * A, y: f.y + (st.y1 - f.y) * A, w: st.w * A };
  }
  /**
   * Scale everything drawn next by A about the point (fx, fy) (hex units). Each wave-6 piece is
   * DESIGNED at a modest size round its foot and drawn through this, so one number per piece
   * sets how much of the hex it fills — the art, its LOD silhouette and its stack all follow.
   * The caller restores.
   */
  function about(ctx, cx, cy, z, fx, fy, A) {
    ctx.save();
    if (A === 1) return;
    const X = cx + fx * z, Y = cy + fy * z;
    ctx.translate(X, Y); ctx.scale(A, A); ctx.translate(-X, -Y);
  }
  /**
   * The foot of a building standing on the side of the tile that unit vector u points at. A
   * building rises UP the screen from its foot, so on the lower half it must stand further out
   * (or it would climb into the centre, where the lines meet) and on the upper half further in.
   */
  function sideFoot(u, rUp, rMid, rDown, dy) {
    const r = u.y < -0.3 ? rUp : (u.y > 0.3 ? rDown : rMid);
    return { x: u.x * r, y: u.y * r + dy };
  }

  /**
   * Where everything on a mixed landmark tile stands, in hex-size units. Pure; recomputed per
   * draw (six 6-way compares). Fields: k, main {x,y,r} (the mark-list disc + sort point),
   * foot [{x,y,r}] (more obstacles), chim [{x, y0, y1, w}] (stacks anim smokes), plus each
   * kind's own positions. `geom.landmarkAnchors` and `geom.chimneys` read the same object.
   */
  function lmPlan(kind, edges) {
    const L = LM_LAYOUT[kind];
    const k = lmRot(L, edges);
    const pl = { kind: kind, k: k, main: null, foot: [], chim: [] };
    if (kind === 'depot') {
      // the station on the village half, its platform along its front, facing the junction
      const u = dirV(4, k, 1), f = sideFoot(u, 0.36, 0.36, 0.50, 0.12);
      pl.st = { x: f.x, y: f.y, w: 0.40, h: 0.17, rh: 0.12, A: 1.45 };
      pl.main = { x: f.x, y: f.y - 0.2, r: 0.34 };
      pl.chim.push(stackOf(pl.st, 0.3));
    } else if (kind === 'watermill') {
      // the wheel stands in the river at the tile centre, whatever the rotation; the mill house
      // on whichever bank is further up the screen, so the wheel turns in front of its wall
      const a = dirV(1.5, k, 1), b = dirV(4.5, k, 1);
      const bank = a.y < b.y ? a : b;
      pl.house = { x: bank.x * 0.44, y: bank.y * 0.44 + 0.13, w: 0.36, h: 0.18, rh: 0.13, A: 1.4 };
      pl.wheel = { x: 0, y: -0.05, r: 0.25 };
      pl.main = { x: pl.house.x, y: pl.house.y - 0.2, r: 0.3 };
      pl.foot.push({ x: 0, y: -0.05, r: 0.27 });
    } else if (kind === 'farmstead') {
      // farmhouse on the village side of the seam, barn and rick on the field side
      const f = sideFoot(dirV(4, k, 1), 0.34, 0.40, 0.46, 0.10);
      const g = sideFoot(dirV(1, k, 1), 0.30, 0.36, 0.44, 0.11);
      const h = dirV(0.15, k, 0.64);
      pl.house = { x: f.x, y: f.y, w: 0.30, h: 0.15, rh: 0.14, A: 1.35 };
      pl.barn = { x: g.x, y: g.y, A: 1.35 };
      pl.rick = { x: h.x, y: h.y + 0.06, A: 1.3 };
      pl.main = { x: f.x, y: f.y - 0.18, r: 0.28 };
      pl.foot.push({ x: g.x, y: g.y - 0.2, r: 0.29 }, { x: h.x, y: h.y - 0.05, r: 0.14 });
      pl.chim.push(stackOf(pl.house, 0.26));
    } else if (kind === 'sawmill') {
      // the shed on the village wedge, logs out of the forest, sawn planks by the spur's end
      const v = sideFoot(dirV(4.5, k, 1), 0.36, 0.42, 0.50, 0.11);
      const l = dirV(1, k, 0.36), p = dirV(2.1, k, 0.38), rail = dirV(3, k, 1);
      pl.shed = { x: v.x, y: v.y, w: 0.36, h: 0.16, rh: 0.11, A: 1.4 };
      pl.logs = { x: l.x, y: l.y + 0.07, A: 1.3 };
      pl.planks = { x: p.x, y: p.y + 0.03, A: 1.25 };
      pl.buffer = dirV(3, k, 0.05);
      pl.main = { x: v.x, y: v.y - 0.19, r: 0.32 };
      pl.foot.push({ x: l.x, y: l.y, r: 0.2 }, { x: p.x, y: p.y, r: 0.15 });
      // the engine stack stands free beside the shed, on the side AWAY from the rail
      const sb = pl.shed, side = rail.x > 0.1 ? -1 : 1;
      pl.chim.push({ x: sb.x + side * (sb.w / 2 + 0.035), y0: sb.y, y1: sb.y - 0.3, w: 0.05, f: sb });
    } else if (kind === 'bridge') {
      pl.a = 60 * k * DEG;                  // the rail axis; the river crosses it at 120°
      pl.L = 0.44; pl.W = 0.165; pl.H = 0.11;
      pl.main = { x: 0, y: 0, r: 0.34 };
    } else if (kind === 'market') {
      pl.main = { x: 0, y: 0.1, r: 0.6 };
    } else if (kind === 'abbey') {
      pl.main = { x: 0, y: 0, r: 0.6 };
    } else if (kind === 'beehives') {
      pl.seam = dirV(2.5, k, 1);             // the field/forest seam, a diameter
      pl.main = { x: 0, y: 0.02, r: 0.38 };
    }
    return pl;
  }

  // The market's fixed furniture (all-village tile: no rotation to follow). Stalls are
  // [x, foot y, width, awning colour]; the maypole and the two bunting poles are [x, foot y, h].
  const MARKET_STALLS = [[-0.27, -0.08, 0.22, 0], [0.27, -0.09, 0.22, 1], [-0.25, 0.36, 0.22, 2], [0.27, 0.36, 0.22, 3]];
  const MARKET_A = 1.45;                     // each stall's scale about its own foot
  const MARKET_POLE = [0, 0.14, 0.62];
  const MARKET_SIDE = [[-0.56, 0.14, 0.3], [0.56, 0.14, 0.3]];
  const HIVES = [-0.17, 0, 0.17];            // skep x (design); they stand on one bench at y = HIVE_Y
  const HIVE_Y = 0.12;
  const HIVE_A = 1.75;                       // the bench and skeps, scaled about (0, HIVE_Y)
  const WHEEL_SPOKES = 10;

  /**
   * A gabled building seen along its long side, in the chapel's language: a lit front wall, a
   * narrow shaded end receding right, a roof pitched away with a lit ridge, a cast shadow. `b` is
   * { x, y (the middle of its front foot), w, h (wall), rh (roof) }; `c` its colours. The stack
   * (if any) is drawn first, so the roof hides its foot. Below LOD: two ink fills.
   */
  function gableHouse(ctx, cx, cy, z, b, c, snow, fine, stack) {
    const x0 = b.x - b.w / 2, x1 = b.x + b.w / 2, ey = b.y - b.h, ry = ey - b.rh;
    const sw = 0.05, o = 0.035, ins = 0.06;
    const roof = [x0 - o, ey + 0.012, x1 + sw + o * 0.6, ey + 0.012 - sw * 0.5,
      x1 + sw - ins * 0.6, ry, x0 + ins, ry];
    if (!fine) {
      fillPoly(ctx, cx, cy, z, [x0, b.y, x0, ey, x1 + sw, ey - sw * 0.5, x1 + sw, b.y - sw * 0.5], LM.ink);
      fillPoly(ctx, cx, cy, z, roof, LM.ink);
      return;
    }
    const a0 = ctx.globalAlpha;
    const d = (b.h + b.rh) * 0.6;
    ctx.globalAlpha = a0 * 0.2;
    fillPoly(ctx, cx, cy, z, [x0, b.y, x1 + sw, b.y - sw * 0.5, x1 + sw + d, b.y + d * 0.38, x0 + d * 0.9, b.y + d * 0.42], LM.shadow);
    ctx.globalAlpha = a0;
    if (stack) {
      ctx.fillStyle = c.stack || LMC.brickSide;
      ctx.fillRect(cx + (stack.x - stack.w / 2) * z, cy + stack.y1 * z, stack.w * z, (stack.y0 - stack.y1) * z);
      ctx.fillStyle = LM.ink;
      ctx.fillRect(cx + (stack.x - stack.w * 0.65) * z, cy + stack.y1 * z, stack.w * 1.3 * z, 0.018 * z);
    }
    ctx.fillStyle = c.wall;
    ctx.fillRect(cx + x0 * z, cy + ey * z, b.w * z, b.h * z);
    fillPoly(ctx, cx, cy, z, [x1, b.y, x1, ey, x1 + sw, ey - sw * 0.5, x1 + sw, b.y - sw * 0.5], c.side);
    ctx.fillStyle = c.plinth || LM.dark;
    ctx.fillRect(cx + x0 * z, cy + (b.y - 0.022) * z, b.w * z, 0.022 * z);
    fillPoly(ctx, cx, cy, z, roof, c.roof);
    const f = 0.24;                                         // the lit ridge band
    fillPoly(ctx, cx, cy, z, [x0 + ins, ry, x1 + sw - ins * 0.6, ry,
      x1 + sw - ins * 0.6 + (ins * 0.6 + o * 0.6) * f, ry + b.rh * f, x0 + ins - (ins + o) * f, ry + b.rh * f], c.roofLit);
    if (snow) {
      const g = 0.58;
      fillPoly(ctx, cx, cy, z, [x0 + ins, ry - 0.006, x1 + sw - ins * 0.6, ry - 0.006,
        x1 + sw - ins * 0.6 + (ins * 0.6 + o * 0.6) * g, ry + b.rh * g, x0 + ins - (ins + o) * g, ry + b.rh * g], LM.snow);
    }
  }

  /** A soft oval shadow at a foot point. */
  function footShadow(ctx, cx, cy, z, x, y, rx, ry) {
    const a0 = ctx.globalAlpha;
    ctx.globalAlpha = a0 * 0.22;
    fillEllipse(ctx, cx + x * z, cy + y * z, rx * z, ry * z, LM.shadow);
    ctx.globalAlpha = a0;
  }

  /**
   * The WATER WHEEL, at (x, y) px with radius r px, turned by `ang`. Paddles, a rim, spokes and
   * a hub; anim.js may call this every frame or bake it into a sprite (like drawSails). Below
   * LOD it is just a rim.
   */
  function drawWheel(ctx, x, y, r, ang, fine) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang || 0);
    if (!fine) {
      ctx.strokeStyle = LM.ink;
      ctx.lineWidth = r * 0.3;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, TAU); ctx.stroke();
      ctx.restore();
      return;
    }
    // paddles first, the rim over their roots
    ctx.fillStyle = LM.timberDark;
    ctx.beginPath();
    for (let i = 0; i < WHEEL_SPOKES; i++) {
      const a = i * TAU / WHEEL_SPOKES, c = Math.cos(a), s = Math.sin(a);
      const r0 = r * 0.72, r1 = r * 1.0, h = r * 0.11;
      ctx.moveTo(c * r0 - s * h, s * r0 + c * h);
      ctx.lineTo(c * r1 - s * h, s * r1 + c * h);
      ctx.lineTo(c * r1 + s * h, s * r1 - c * h);
      ctx.lineTo(c * r0 + s * h, s * r0 - c * h);
      ctx.closePath();
    }
    ctx.fill();
    ctx.lineCap = 'butt';
    ctx.strokeStyle = LM.timber;
    ctx.lineWidth = r * 0.07;
    ctx.beginPath();
    for (let i = 0; i < WHEEL_SPOKES / 2; i++) {
      const a = i * TAU / WHEEL_SPOKES, c = Math.cos(a) * r * 0.72, s = Math.sin(a) * r * 0.72;
      ctx.moveTo(-c, -s); ctx.lineTo(c, s);
    }
    ctx.stroke();
    ctx.strokeStyle = shade(LM.timber, 0.18);
    ctx.lineWidth = r * 0.13;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, TAU); ctx.stroke();
    ctx.fillStyle = LM.timberDark;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.17, 0, TAU); ctx.fill();
    ctx.fillStyle = LM.gold;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.07, 0, TAU); ctx.fill();
    ctx.restore();
  }
  Renderer.drawWheel = drawWheel;

  /**
   * One line of BUNTING between two pole tops, px: a sagging cord and pennants in the awning
   * colours. `seg` is a geom anchor { x0, y0, x1, y1 }; `sway` (−1..1) breathes the sag. One
   * fill per colour. anim.js draws its own fluttering copy on the board.
   */
  function drawBunting(ctx, seg, size, sway) {
    const dx = seg.x1 - seg.x0, dy = seg.y1 - seg.y0;
    const len = Math.hypot(dx, dy);
    if (!(len > 0)) return;
    const sag = len * 0.12 * (1 + 0.1 * (sway || 0));
    const qc = { x: (seg.x0 + seg.x1) / 2, y: (seg.y0 + seg.y1) / 2 + sag * 2 };
    const s = { p0: { x: seg.x0, y: seg.y0 }, c: qc, p1: { x: seg.x1, y: seg.y1 } };
    ctx.strokeStyle = LMC.rope;
    ctx.lineWidth = size * 0.012;
    ctx.beginPath(); ctx.moveTo(seg.x0, seg.y0); ctx.quadraticCurveTo(qc.x, qc.y, seg.x1, seg.y1); ctx.stroke();
    const n = Math.max(2, Math.floor(len / (size * 0.1)));
    const w = size * 0.032, h = size * 0.065;
    for (let c = 0; c < LMC.awning.length; c++) {
      ctx.beginPath();
      let any = false;
      for (let i = c; i < n; i += LMC.awning.length) {
        const p = quadAt(s, (i + 0.5) / n);
        ctx.moveTo(p.x - w, p.y); ctx.lineTo(p.x + w, p.y); ctx.lineTo(p.x, p.y + h); ctx.closePath();
        any = true;
      }
      if (any) { ctx.fillStyle = LMC.awning[c]; ctx.fill(); }
    }
  }
  Renderer.drawBunting = drawBunting;

  /** A crow in flight, a stroked 'v', w = half-span px. */
  function drawCrow(ctx, x, y, w) {
    ctx.strokeStyle = LMC.crow;
    ctx.lineWidth = w * 0.28;
    ctx.beginPath();
    ctx.moveTo(x - w, y - w * 0.35);
    ctx.quadraticCurveTo(x - w * 0.45, y - w * 0.6, x, y);
    ctx.quadraticCurveTo(x + w * 0.45, y - w * 0.6, x + w, y - w * 0.35);
    ctx.stroke();
  }

  // ---- the ground under a mixed landmark (paint: under every standing mark) -----------------

  function drawLandmarkDecor(ctx, cx, cy, z, kind, edges) {
    const pl = lmPlan(kind, edges);
    const a0 = ctx.globalAlpha;
    if (kind === 'market') {
      ctx.globalAlpha = a0 * 0.9;
      fillEllipse(ctx, cx, cy + 0.14 * z, 0.62 * z, 0.43 * z, LMC.cobble);
      ctx.globalAlpha = a0 * 0.7;
      ctx.strokeStyle = LMC.cobbleEdge; ctx.lineWidth = z * 0.022;
      ctx.beginPath(); ctx.ellipse(cx, cy + 0.14 * z, 0.62 * z, 0.43 * z, 0, 0, TAU); ctx.stroke();
      ctx.globalAlpha = a0;
    } else if (kind === 'abbey') {
      // the nave's footprint, worn into the turf
      ctx.globalAlpha = a0 * 0.75;
      fillPoly(ctx, cx, cy, z, [-0.62, 0.0, 0.42, -0.1, 0.56, 0.26, -0.5, 0.40], LMC.floor);
      ctx.globalAlpha = a0;
    } else if (kind === 'beehives') {
      // wildflowers along the seam where field meets wood — none under snow
      const sn = Renderer.SEASON;
      if (sn.snow) return;
      const s = pl.seam, n = sn.stubble ? 4 : 7;
      for (let c = 0; c < 3; c++) {
        ctx.beginPath();
        for (let i = c; i < n * 2; i += 3) {
          const side = i % 2 ? 1 : -1, j = i >> 1;
          const t = side * (0.34 + 0.07 * j);
          const off = ((j * 37 + i * 11) % 7 - 3) * 0.018;
          const x = cx + (s.x * t - s.y * off) * z, y = cy + (s.y * t + s.x * off) * z;
          ctx.moveTo(x + z * 0.03, y);
          ctx.arc(x, y, z * 0.03, 0, TAU);
        }
        ctx.fillStyle = LMC.flower[sn.stubble ? (c ? 1 : 0) : c];
        ctx.fill();
      }
    }
  }

  // ---- the kinds ----------------------------------------------------------------------------

  function drawDepot(ctx, cx, cy, z, pl, fine, snow) {
    const b = pl.st;
    const px0 = b.x - b.w / 2 - 0.07, px1 = b.x + b.w / 2 + 0.09;
    if (fine) {
      // the platform along the station's front, its edge picked out, and a lamp at the end
      ctx.fillStyle = LMC.platform;
      ctx.fillRect(cx + px0 * z, cy + (b.y - 0.01) * z, (px1 - px0) * z, 0.06 * z);
      ctx.fillStyle = LMC.platformEdge;
      ctx.fillRect(cx + px0 * z, cy + (b.y + 0.035) * z, (px1 - px0) * z, 0.016 * z);
      ctx.fillStyle = snow ? LM.snow : LM.gold;
      ctx.fillRect(cx + px0 * z, cy + (b.y + 0.024) * z, (px1 - px0) * z, 0.008 * z);
    }
    gableHouse(ctx, cx, cy, z, b, { wall: LMC.brick, side: LMC.brickSide, roof: LM.slate, roofLit: LM.slateLit, plinth: LMC.brickSide },
      snow, fine, pl.chim[0]);
    const X = (u) => cx + u * z, Y = (v) => cy + v * z;
    const x0 = b.x - b.w / 2, x1 = b.x + b.w / 2, ey = b.y - b.h;
    if (!fine) {
      fillPoly(ctx, cx, cy, z, [b.x - 0.08, ey, b.x + 0.08, ey, b.x, ey - 0.13], LM.ink);
      return;
    }
    // doors and windows under the canopy
    fillArch(ctx, cx, cy, z, b.x, b.y - 0.04, 0.055, 0.08, LM.timberDark);
    ctx.fillStyle = LM.glass;
    ctx.fillRect(X(x0 + 0.05), Y(b.y - 0.075), 0.055 * z, 0.045 * z);
    ctx.fillRect(X(x1 - 0.105), Y(b.y - 0.075), 0.055 * z, 0.045 * z);
    // the canopy: a green valance with a saw-tooth hem, on two iron columns
    const ct = b.y - b.h * 0.72, cb = b.y - b.h * 0.5, cx0 = x0 - 0.03, cx1 = x1 + 0.03;
    ctx.fillStyle = LMC.iron;
    ctx.fillRect(X(x0 + 0.015), Y(cb), 0.014 * z, (b.y - cb) * z);
    ctx.fillRect(X(x1 - 0.03), Y(cb), 0.014 * z, (b.y - cb) * z);
    ctx.beginPath();
    ctx.moveTo(X(cx0), Y(ct)); ctx.lineTo(X(cx1), Y(ct));
    const teeth = 9, tw = (cx1 - cx0) / teeth;
    for (let i = teeth; i >= 0; i--) {
      ctx.lineTo(X(cx0 + i * tw), Y(cb));
      if (i > 0) ctx.lineTo(X(cx0 + (i - 0.5) * tw), Y(cb + 0.022));
    }
    ctx.closePath();
    ctx.fillStyle = LMC.green; ctx.fill();
    ctx.fillStyle = snow ? LM.snow : LMC.greenLit;
    ctx.fillRect(X(cx0), Y(ct), (cx1 - cx0) * z, 0.014 * z);
    // the clock gable over the middle of the front
    fillPoly(ctx, cx, cy, z, [b.x - 0.085, ey + 0.012, b.x + 0.085, ey + 0.012, b.x, ey - 0.12], LMC.cream);
    if (snow) fillPoly(ctx, cx, cy, z, [b.x - 0.03, ey - 0.08, b.x + 0.03, ey - 0.08, b.x, ey - 0.125], LM.snow);
    ctx.fillStyle = LM.ink;
    ctx.beginPath(); ctx.arc(X(b.x), Y(ey - 0.032), 0.036 * z, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(X(b.x), Y(ey - 0.032), 0.027 * z, 0, TAU); ctx.fill();
    ctx.strokeStyle = LM.ink; ctx.lineWidth = 0.009 * z;
    ctx.beginPath();
    ctx.moveTo(X(b.x), Y(ey - 0.032)); ctx.lineTo(X(b.x), Y(ey - 0.052));
    ctx.moveTo(X(b.x), Y(ey - 0.032)); ctx.lineTo(X(b.x + 0.014), Y(ey - 0.032));
    ctx.stroke();
    // a lamp at the platform's far end
    const lx = b.x > 0.05 ? px0 + 0.025 : px1 - 0.025;     // at the end nearer the tile centre
    ctx.fillStyle = LMC.iron;
    ctx.fillRect(X(lx - 0.007), Y(b.y - 0.2), 0.014 * z, 0.21 * z);
    ctx.fillStyle = LM.glass;
    ctx.fillRect(X(lx - 0.018), Y(b.y - 0.235), 0.036 * z, 0.035 * z);
    ctx.fillStyle = LMC.iron;
    ctx.fillRect(X(lx - 0.022), Y(b.y - 0.247), 0.044 * z, 0.014 * z);
  }

  function drawWatermill(ctx, cx, cy, z, pl, fine, sails, snow) {
    const b = pl.house, wh = pl.wheel;
    const vpal = PALETTE[T.VILLAGE], wpal = PALETTE[T.WATER];
    const X = (u) => cx + u * z, Y = (v) => cy + v * z;
    about(ctx, cx, cy, z, b.x, b.y, b.A);
    gableHouse(ctx, cx, cy, z, b, { wall: LM.lit, side: LM.dark, roof: shade(vpal.ink, -0.05), roofLit: shade(vpal.ink, 0.22), plinth: LM.dark },
      snow, fine, null);
    if (fine) {
      const ey = b.y - b.h;
      // the lucam — the hoist hood on the roof — and the mill's windows and door
      fillPoly(ctx, cx, cy, z, [b.x - 0.045, ey + 0.01, b.x - 0.045, ey - 0.07, b.x, ey - 0.105, b.x + 0.045, ey - 0.07, b.x + 0.045, ey + 0.01], LM.timber);
      fillPoly(ctx, cx, cy, z, [b.x - 0.06, ey - 0.065, b.x, ey - 0.115, b.x + 0.06, ey - 0.065, b.x + 0.06, ey - 0.05, b.x, ey - 0.095, b.x - 0.06, ey - 0.05],
        snow ? LM.snow : LM.timberDark);
      ctx.fillStyle = LM.timberDark;
      ctx.fillRect(X(b.x - 0.022), Y(ey - 0.055), 0.044 * z, 0.05 * z);
      fillArch(ctx, cx, cy, z, b.x - b.w * 0.3, b.y - 0.1, 0.045, 0.06, LM.glass);
      fillArch(ctx, cx, cy, z, b.x + b.w * 0.3, b.y - 0.1, 0.045, 0.06, LM.glass);
      fillArch(ctx, cx, cy, z, b.x + b.w * 0.05, b.y - 0.045, 0.06, 0.09, LM.timberDark);
    }
    ctx.restore();
    const WX = X(wh.x), WY = Y(wh.y), WR = wh.r * z;
    if (!fine) {
      if (sails) drawWheel(ctx, WX, WY, WR, 0, false);
      return;
    }
    // the wheel pit: the dark water the wheel turns in, with foam where the paddles bite
    ctx.globalAlpha *= 0.55;
    fillEllipse(ctx, WX, WY + WR * 0.78, WR * 1.02, WR * 0.26, LMC.pit);
    ctx.globalAlpha /= 0.55;
    fillEllipse(ctx, WX - WR * 0.72, WY + WR * 0.86, WR * 0.26, WR * 0.1, snow ? wpal.fill : LMC.foam);
    fillEllipse(ctx, WX + WR * 0.62, WY + WR * 0.9, WR * 0.3, WR * 0.1, snow ? wpal.fill : LMC.foam);
    // the axle bearing on a stone pier (static; the wheel turns in front of it)
    ctx.fillStyle = LM.dark;
    ctx.fillRect(WX - WR * 0.12, WY - WR * 0.05, WR * 0.24, WR * 0.8);
    if (sails) drawWheel(ctx, WX, WY, WR, 0.2, true);
  }

  function drawBarn(ctx, cx, cy, z, x, y, fine, snow) {
    const w = 0.15, eh = 0.15, kh = 0.245, ah = 0.29, sd = 0.075;
    const front = [x - w, y, x - w, y - eh, x - w * 0.6, y - kh, x, y - ah, x + w * 0.6, y - kh, x + w, y - eh, x + w, y];
    if (!fine) {
      fillPoly(ctx, cx, cy, z, front, LM.ink);
      fillPoly(ctx, cx, cy, z, [x + w, y, x + w, y - eh, x + w + sd, y - eh - sd * 0.5, x + w + sd, y - sd * 0.5], LM.ink);
      return;
    }
    const a0 = ctx.globalAlpha;
    ctx.globalAlpha = a0 * 0.2;
    fillPoly(ctx, cx, cy, z, [x - w, y, x + w + sd, y - sd * 0.5, x + w + sd + 0.17, y + 0.07, x - w + 0.15, y + 0.08], LM.shadow);
    ctx.globalAlpha = a0;
    // the long side receding right, and its roof
    fillPoly(ctx, cx, cy, z, [x + w, y, x + w, y - eh, x + w + sd, y - eh - sd * 0.5, x + w + sd, y - sd * 0.5], LMC.barnSide);
    fillPoly(ctx, cx, cy, z, [x + w, y - eh, x + w * 0.6, y - kh, x, y - ah, x + sd, y - ah - sd * 0.5,
      x + w * 0.6 + sd, y - kh - sd * 0.5, x + w + sd, y - eh - sd * 0.5], LMC.barnRoof);
    if (snow) {
      fillPoly(ctx, cx, cy, z, [x + w * 0.6, y - kh, x, y - ah, x + sd, y - ah - sd * 0.5, x + w * 0.6 + sd, y - kh - sd * 0.5], LM.snow);
    }
    fillPoly(ctx, cx, cy, z, front, LMC.barn);
    // white trim up the gambrel, the big braced doors, the hay loft
    ctx.strokeStyle = LMC.cream;
    ctx.lineWidth = 0.016 * z;
    polyPath(ctx, cx, cy, z, front);
    ctx.stroke();
    ctx.fillStyle = LMC.barnSide;
    ctx.fillRect(cx + (x - 0.075) * z, cy + (y - 0.13) * z, 0.15 * z, 0.13 * z);
    ctx.strokeStyle = LMC.cream;
    ctx.lineWidth = 0.013 * z;
    ctx.beginPath();
    ctx.rect(cx + (x - 0.075) * z, cy + (y - 0.13) * z, 0.15 * z, 0.13 * z);
    ctx.moveTo(cx + (x - 0.075) * z, cy + (y - 0.13) * z); ctx.lineTo(cx + x * z, cy + y * z);
    ctx.lineTo(cx + (x + 0.075) * z, cy + (y - 0.13) * z);
    ctx.moveTo(cx + x * z, cy + (y - 0.13) * z); ctx.lineTo(cx + x * z, cy + y * z);
    ctx.stroke();
    ctx.fillStyle = LM.timberDark;
    ctx.fillRect(cx + (x - 0.03) * z, cy + (y - 0.225) * z, 0.06 * z, 0.05 * z);
  }

  /** A hay rick (a big one, not the scatter haystack): a straw dome with two rope bands. */
  function drawRick(ctx, cx, cy, z, x, y, fine, snow) {
    const X = cx + x * z, Y = cy + y * z, rx = 0.085 * z, ry = 0.13 * z;
    if (!fine) { fillEllipse(ctx, X, Y - ry * 0.55, rx, ry * 0.6, LM.ink); return; }
    footShadow(ctx, cx, cy, z, x + 0.03, y, 0.1, 0.03);
    ctx.beginPath(); ctx.ellipse(X, Y, rx, ry, 0, Math.PI, TAU); ctx.closePath();
    ctx.fillStyle = LMC.straw; ctx.fill();
    fillEllipse(ctx, X - rx * 0.35, Y - ry * 0.55, rx * 0.35, ry * 0.3, LMC.strawLit);
    ctx.strokeStyle = LMC.strawDark; ctx.lineWidth = 0.012 * z;
    ctx.beginPath();
    ctx.moveTo(X - rx * 0.92, Y - ry * 0.35); ctx.quadraticCurveTo(X, Y - ry * 0.22, X + rx * 0.92, Y - ry * 0.35);
    ctx.moveTo(X - rx * 0.66, Y - ry * 0.72); ctx.quadraticCurveTo(X, Y - ry * 0.6, X + rx * 0.66, Y - ry * 0.72);
    ctx.stroke();
    if (snow) fillEllipse(ctx, X, Y - ry * 0.86, rx * 0.55, ry * 0.2, LM.snow);
  }

  function drawFarmstead(ctx, cx, cy, z, pl, fine, snow) {
    const h = pl.house;
    // three pieces, painted back to front
    const parts = [
      { y: h.y, f: function () {
        gableHouse(ctx, cx, cy, z, h, { wall: LMC.whitewash, side: LM.dark, roof: LMC.thatch, roofLit: LMC.thatchLit, plinth: LM.dark, stack: LMC.brickSide },
          snow, fine, pl.chim[0]);
        if (!fine) return;
        fillArch(ctx, cx, cy, z, h.x - 0.02, h.y - 0.04, 0.05, 0.08, LM.timberDark);
        ctx.fillStyle = LM.glass;
        ctx.fillRect(cx + (h.x - 0.12) * z, cy + (h.y - 0.1) * z, 0.05 * z, 0.045 * z);
        ctx.fillRect(cx + (h.x + 0.05) * z, cy + (h.y - 0.1) * z, 0.05 * z, 0.045 * z);
      } },
      { y: pl.barn.y, p: pl.barn, f: function () { drawBarn(ctx, cx, cy, z, pl.barn.x, pl.barn.y, fine, snow); } },
      { y: pl.rick.y, p: pl.rick, f: function () { drawRick(ctx, cx, cy, z, pl.rick.x, pl.rick.y, fine, snow); } },
    ];
    parts[0].p = h;
    drawParts(ctx, cx, cy, z, parts);
  }

  /** Paint a landmark's pieces back to front, each scaled about its own foot (`p`). */
  function drawParts(ctx, cx, cy, z, parts) {
    parts.sort(function (a, b) { return a.y - b.y; });
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i].p;
      about(ctx, cx, cy, z, p.x, p.y, p.A || 1);
      parts[i].f();
      ctx.restore();
    }
  }

  /** A pyramid of six cut log ends: one path of dark rings, one of pale faces. */
  function drawLogPile(ctx, cx, cy, z, x, y, fine, snow) {
    const r = 0.043, rows = [[-1, 0], [0, 0], [1, 0], [-0.5, 1], [0.5, 1], [0, 2]];
    const X = (u) => cx + (x + u * r * 2) * z, Y = (v) => cy + (y - r - v * r * 1.72) * z;
    if (!fine) {
      fillPoly(ctx, cx, cy, z, [x - r * 3, y, x, y - r * 5.2, x + r * 3, y], LM.ink);
      return;
    }
    footShadow(ctx, cx, cy, z, x + 0.03, y, 0.15, 0.035);
    ctx.beginPath();
    for (let i = 0; i < rows.length; i++) {
      const px = X(rows[i][0]), py = Y(rows[i][1]);
      ctx.moveTo(px + r * z, py); ctx.arc(px, py, r * z, 0, TAU);
    }
    ctx.fillStyle = LM.timberDark; ctx.fill();
    ctx.beginPath();
    for (let i = 0; i < rows.length; i++) {
      const px = X(rows[i][0]), py = Y(rows[i][1]);
      ctx.moveTo(px + r * 0.7 * z, py); ctx.arc(px, py, r * 0.7 * z, 0, TAU);
    }
    ctx.fillStyle = LMC.cut; ctx.fill();
    if (snow) fillEllipse(ctx, X(0), Y(2) - r * 0.8 * z, r * 0.8 * z, r * 0.35 * z, LM.snow);
  }

  function drawSawmill(ctx, cx, cy, z, pl, fine, snow) {
    const b = pl.shed, st = pl.chim[0];
    const X = (u) => cx + u * z, Y = (v) => cy + v * z;
    const parts = [
      { y: b.y, p: b, f: function () {
        // the engine stack stands free beside the shed: draw it first, the shed covers its foot
        if (fine) {
          ctx.fillStyle = LMC.iron;
          ctx.fillRect(X(st.x - st.w / 2), Y(st.y1), st.w * z, (st.y0 - st.y1) * z);
          ctx.fillStyle = LMC.ironLit;
          ctx.fillRect(X(st.x - st.w / 2), Y(st.y1), st.w * 0.35 * z, (st.y0 - st.y1) * z);
          ctx.fillStyle = LMC.iron;
          ctx.fillRect(X(st.x - st.w * 0.8), Y(st.y1), st.w * 1.6 * z, 0.025 * z);
        } else {
          ctx.fillStyle = LM.ink;
          ctx.fillRect(X(st.x - st.w / 2), Y(st.y1), st.w * z, (st.y0 - st.y1) * z);
        }
        gableHouse(ctx, cx, cy, z, b, { wall: LM.timber, side: LM.timberDark, roof: LM.slate, roofLit: LM.slateLit, plinth: LM.timberDark },
          snow, fine, null);
        if (!fine) return;
        const x0 = b.x - b.w / 2, ey = b.y - b.h;
        ctx.strokeStyle = shade(LM.timber, -0.22);        // weatherboarding
        ctx.lineWidth = 0.008 * z;
        ctx.beginPath();
        for (let i = 1; i <= 3; i++) {
          const yy = Y(ey + b.h * i / 4);
          ctx.moveTo(X(x0), yy); ctx.lineTo(X(x0 + b.w), yy);
        }
        ctx.stroke();
        // the open saw floor, the blade inside it
        ctx.fillStyle = '#3b2a1d';
        ctx.fillRect(X(b.x - 0.12), Y(b.y - 0.13), 0.24 * z, 0.13 * z);
        // the circular saw: a toothed steel disc standing proud of the bench
        const sx = X(b.x + 0.03), sy = Y(b.y - 0.06), sr = 0.055 * z;
        ctx.fillStyle = LMC.saw;
        ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
        ctx.strokeStyle = LMC.ironLit; ctx.lineWidth = 0.014 * z; ctx.lineCap = 'butt';
        ctx.setLineDash([0.012 * z, 0.01 * z]);
        ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = LMC.iron;
        ctx.beginPath(); ctx.arc(sx, sy, 0.014 * z, 0, TAU); ctx.fill();
        ctx.fillStyle = LMC.board;                          // the log on the saw bench
        ctx.fillRect(X(b.x - 0.12), Y(b.y - 0.035), 0.24 * z, 0.03 * z);
        ctx.fillStyle = LMC.cut;
        ctx.fillRect(X(b.x - 0.12), Y(b.y - 0.035), 0.24 * z, 0.009 * z);
      } },
      { y: pl.logs.y, p: pl.logs, f: function () { drawLogPile(ctx, cx, cy, z, pl.logs.x, pl.logs.y, fine, snow); } },
      { y: pl.planks.y, p: pl.planks, f: function () {
        const p = pl.planks;
        if (!fine) { ctx.fillStyle = LM.ink; ctx.fillRect(X(p.x - 0.09), Y(p.y - 0.07), 0.18 * z, 0.07 * z); return; }
        footShadow(ctx, cx, cy, z, p.x + 0.03, p.y, 0.12, 0.03);
        for (let i = 0; i < 3; i++) {
          const yy = p.y - 0.024 * (i + 1), dx = (i % 2 ? 0.012 : -0.008);
          ctx.fillStyle = LMC.board;
          ctx.fillRect(X(p.x - 0.085 + dx), Y(yy), 0.17 * z, 0.024 * z);
          ctx.fillStyle = i === 2 && snow ? LM.snow : LMC.plank;
          ctx.fillRect(X(p.x - 0.085 + dx), Y(yy), 0.165 * z, 0.016 * z);
        }
      } },
    ];
    drawParts(ctx, cx, cy, z, parts);
    // the buffer stop at the end of the spur
    const bu = pl.buffer;
    if (!fine) return;
    ctx.fillStyle = LM.timberDark;
    ctx.fillRect(X(bu.x - 0.045), Y(bu.y - 0.05), 0.014 * z, 0.05 * z);
    ctx.fillRect(X(bu.x + 0.031), Y(bu.y - 0.05), 0.014 * z, 0.05 * z);
    ctx.fillStyle = LMC.red;
    ctx.fillRect(X(bu.x - 0.065), Y(bu.y - 0.075), 0.13 * z, 0.035 * z);
  }

  /**
   * The BRIDGE: a stone deck carrying the railway over the river. The deck is the rail's own
   * band, rotated with it; its near face drops a wall with an arch where the river runs out
   * from under it. The rail is re-drawn over the deck with the SAME drawRail, clipped to the
   * deck, so the line is continuous across the tile. The river shows on both sides of the deck.
   */
  function drawBridge(ctx, cx, cy, z, pl, edges, fine, snow) {
    const ca = Math.cos(pl.a), sa = Math.sin(pl.a);
    const L = pl.L, W = pl.W, H = pl.H;
    const P = (u, v) => [cx + (u * ca - v * sa) * z, cy + (u * sa + v * ca) * z];
    const vn = ca >= 0 ? W : -W;                            // the deck edge nearer the viewer
    const poly = (pts) => {
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
    };
    const top = [P(-L, -W), P(L, -W), P(L, W), P(-L, W)];
    const n0 = P(-L, vn), n1 = P(L, vn);
    const h = H * z;
    const wall = [n0, n1, [n1[0], n1[1] + h], [n0[0], n0[1] + h]];
    const rail = dirsOf(edges || LM_LAYOUT.bridge, T.RAIL);
    if (fine) {
      // the deck's shadow on the water and banks, down-right
      const a0 = ctx.globalAlpha;
      ctx.globalAlpha = a0 * 0.2;
      ctx.save(); ctx.translate(0.05 * z, 0.1 * z); poly(top); ctx.fillStyle = LM.shadow; ctx.fill(); ctx.restore();
      ctx.globalAlpha = a0;
      poly(wall); ctx.fillStyle = LMC.stoneSide; ctx.fill();
      ctx.strokeStyle = LMC.stoneDark; ctx.lineWidth = 0.014 * z; ctx.lineCap = 'butt';   // the string course
      ctx.beginPath(); ctx.moveTo(n0[0], n0[1] + h * 0.35); ctx.lineTo(n1[0], n1[1] + h * 0.35); ctx.stroke();
      // the arch, where the river passes out from under the deck: a dark vault, the water
      // running out of it, and a ring of voussoirs
      const t = vn / Math.sin(120 * DEG);
      const q = P(t * Math.cos(120 * DEG), vn);
      const ax = q[0], ay = q[1] + h, ar = 0.13 * z;
      ctx.beginPath(); ctx.ellipse(ax, ay, ar, h * 0.92, 0, Math.PI, TAU); ctx.closePath();
      ctx.fillStyle = LMC.vault; ctx.fill();
      ctx.fillStyle = PALETTE[T.WATER].ink;
      ctx.fillRect(ax - ar * 0.92, ay - h * 0.22, ar * 1.84, h * 0.22);
      ctx.strokeStyle = LMC.stoneLit; ctx.lineWidth = 0.022 * z;
      ctx.beginPath(); ctx.ellipse(ax, ay, ar + 0.012 * z, h * 1.02, 0, Math.PI, TAU); ctx.stroke();
      poly(top); ctx.fillStyle = LMC.stone; ctx.fill();
    } else {
      poly(top); ctx.fillStyle = LM.ink; ctx.fill();
    }
    // the rail over the deck: the tile's own rail, clipped to the deck
    if (rail.length) {
      ctx.save();
      poly(top); ctx.clip();
      drawRail(ctx, cx, cy, z, rail, PALETTE[T.RAIL], fine);
      ctx.restore();
    }
    if (!fine) return;
    // parapets: a low wall along each edge (its face, then its lit coping), and a pier at
    // each corner
    ctx.lineCap = 'butt';
    const f0 = P(-L, -vn), f1 = P(L, -vn);
    const wallAlong = (a, b, hh) => {
      ctx.strokeStyle = LMC.stoneSide; ctx.lineWidth = hh * z;
      ctx.beginPath(); ctx.moveTo(a[0], a[1] - hh * 0.5 * z); ctx.lineTo(b[0], b[1] - hh * 0.5 * z); ctx.stroke();
      ctx.strokeStyle = snow ? LM.snow : LMC.stoneLit; ctx.lineWidth = 0.016 * z;
      ctx.beginPath(); ctx.moveTo(a[0], a[1] - hh * z); ctx.lineTo(b[0], b[1] - hh * z); ctx.stroke();
    };
    wallAlong(f0, f1, 0.035);
    wallAlong(n0, n1, 0.045);
    const ends = [f0, f1, n0, n1];
    ctx.fillStyle = LMC.stoneSide;
    for (let i = 0; i < 4; i++) ctx.fillRect(ends[i][0] - 0.026 * z, ends[i][1] - 0.075 * z, 0.052 * z, 0.08 * z);
    ctx.fillStyle = snow ? LM.snow : LMC.stoneLit;
    for (let i = 0; i < 4; i++) ctx.fillRect(ends[i][0] - 0.03 * z, ends[i][1] - 0.085 * z, 0.06 * z, 0.018 * z);
  }

  /** A market stall: counter with produce, two posts, a striped awning with a scalloped hem. */
  function drawStall(ctx, cx, cy, z, x, y, w, ci, fine, snow) {
    const col = LMC.awning[ci];
    const X = (u) => cx + u * z, Y = (v) => cy + v * z;
    const hw = w / 2, at = y - 0.25, ab = y - 0.16;
    if (!fine) {
      fillPoly(ctx, cx, cy, z, [x - hw * 1.1, ab, x - hw * 0.9, at, x + hw * 0.9, at, x + hw * 1.1, ab], LM.ink);
      return;
    }
    footShadow(ctx, cx, cy, z, x + 0.03, y, hw * 1.1, 0.03);
    ctx.fillStyle = LM.timberDark;
    ctx.fillRect(X(x - hw * 0.85), Y(ab), 0.014 * z, (y - ab) * z);
    ctx.fillRect(X(x + hw * 0.85 - 0.014), Y(ab), 0.014 * z, (y - ab) * z);
    ctx.fillStyle = LM.timber;
    ctx.fillRect(X(x - hw), Y(y - 0.075), w * z, 0.075 * z);
    ctx.fillStyle = shade(LM.timber, 0.2);
    ctx.fillRect(X(x - hw), Y(y - 0.075), w * z, 0.014 * z);
    for (let i = 0; i < 3; i++) {                          // produce on the counter
      ctx.fillStyle = LMC.produce[(i + ci) % 3];
      ctx.fillRect(X(x - hw * 0.8 + i * hw * 0.55), Y(y - 0.1), hw * 0.42 * z, 0.028 * z);
    }
    // the awning: cream, then three coloured stripes of five, then the hem
    const q = (f0, f1) => [x - hw * 1.12 + w * 1.12 * f0, ab, x - hw * 0.9 + w * 0.9 * f0, at,
      x - hw * 0.9 + w * 0.9 * f1, at, x - hw * 1.12 + w * 1.12 * f1, ab];
    fillPoly(ctx, cx, cy, z, q(0, 1), snow ? LM.snow : LMC.cream);
