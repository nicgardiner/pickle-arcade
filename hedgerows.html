    let almInto = 0;                // tiles into the season the ring last showed
    let driftTimer = 0;
    let calloutId = null;           // id of the head tile the callout last looked at
    let callNode = null;            // the live callout, if any

    // ---- the season label -------------------------------------------------------------

    /**
     * The season banner, top-centre: the emblem springs in, the name's letters rise one
     * by one, a rule draws out under them; then the whole thing
     * lifts away. Removed from the DOM after SEASON_LIFE — there is never more than one, and an
     * old one is dropped the instant a new season arrives, so a fast change cannot stack two.
     * The season's weather (petals, motes, leaves, snow) blows across the screen with it.
     *
     * Announced on a CHANGE only: the first season a HUD ever sees just sets the baseline, so a
     * new run does not open by telling the player it is spring.
     */
    function announceSeason(se) {
      while (seasonBox.children.length) seasonBox.removeChild(seasonBox.children[0]);
      const id = esc(se.id || '');
      const letters = String(se.name).split('').map((c, i) => '<span style="--i:' + i + '">' + esc(c) + '</span>').join('');
      const node = el('div', 'season-label s-' + id,
        '<div class="sb-icon">' + seasonSvg(se.id) + '</div>' +
        '<div class="sb-name" aria-label="' + esc(se.name) + '">' + letters + '</div>' +
        '<div class="sb-rule"></div>');
      seasonBox.appendChild(node);
      drift(se.id);
      // One frame at opacity 0 so it eases in rather than popping — with a timer backstop,
      // because rAF does not always run in this environment and a label that never got `.in`
      // would live out its whole 2.5 s invisible.
      const show = () => node.classList.add('in');
      requestAnimationFrame(show);
      setTimeout(show, 32);
      setTimeout(() => { node.classList.add('out'); }, SEASON_HOLD);
      setTimeout(() => { if (node.parentNode) node.parentNode.removeChild(node); }, SEASON_LIFE);
    }

    /** One burst of the season's weather: CSS does the motion, each particle's numbers are here. */
    function drift(id) {
      if (!id) return;
      let html = '';
      for (let i = 0; i < DRIFT_COUNT; i++) {
        const r = Math.random;
        html += '<i class="d-' + esc(id) + '" style="--x:' + (r() * 100).toFixed(1) + 'vw;--dx:' + ((r() - 0.5) * 24).toFixed(1) +
          'vw;--dur:' + (3.2 + r() * 2).toFixed(2) + 's;--delay:' + (r() * 1.4).toFixed(2) + 's;--rot:' +
          Math.round((r() - 0.5) * 720) + 'deg;--sc:' + (0.6 + r() * 0.7).toFixed(2) + '"></i>';
      }
      driftBox.innerHTML = html;
      clearTimeout(driftTimer);
      driftTimer = setTimeout(() => { driftBox.innerHTML = ''; }, DRIFT_LIFE);
    }

    /** The almanac: re-written only when the season or the tile count into it moves. */
    function updateAlmanac(s, se) {
      const every = (HG.Renderer && HG.Renderer.CFG && HG.Renderer.CFG.SEASON_EVERY > 0) ? HG.Renderer.CFG.SEASON_EVERY : 15;
      const placed = (s && s.placed) | 0;
      const into = placed % every;
      const key = se.index + ':' + into;
      if (key === almKey) return;
      almKey = key;
      if (se.id !== almId) {
        almId = se.id || '';
        almIcon.innerHTML = seasonSvg(almId);
        almanac.classList.remove('s-spring', 's-summer', 's-autumn', 's-winter');
        if (almId) almanac.classList.add('s-' + almId);
      }
      // Filling animates; emptying (a new season, a new run) snaps — an unwinding ring reads as loss.
      almFill.style.transition = into < almInto ? 'none' : '';
      almInto = into;
      almFill.style.strokeDashoffset = (RING_C * (1 - into / every)).toFixed(2);
      almanac.title = se.name + ' — ' + into + ' of ' + every + ' tiles in · year ' + (Math.floor(placed / (every * 4)) + 1);
    }

    // ---- the placed-landmark tip ------------------------------------------------------

    let lmNode = null;          // the one live bubble, or null
    let lmKey = '';             // its content signature — rewritten only when this moves
    let lmAt = '';              // its position signature
    let lmGone = 0;             // the removal timer of a bubble that is fading out

    /**
     * The bubble's text. `h` is core's `Score.landmarkStatus` shape with a screen point added:
     * `{ key, q, r, kind, label, wants, filled, matched, points, complete, remaining, sx, sy }`.
     * Every number is read from `h`, never recomputed, so this can never disagree with scoring;
     * the only thing taken from constants is the ring bonus, which the status does not carry.
     */
    function landmarkHoverHtml(h) {
      const filled = h.filled | 0, matched = h.matched | 0, points = h.points | 0;
      const ring = (HG.C && HG.C.LANDMARK_RING_BONUS) | 0;
      const parts = ['<b class="qtip-h">' + esc(h.label || 'Landmark') + '</b>'];
      if (h.wants) parts.push('<p>Wants <b>' + esc(h.wants) + '</b> edges facing it.</p>');
      // Wave 6: core writes the progress itself (`lines`, 1–4 short strings, every kind) and
      // the ledger's `paidTotal`. Without them (an older core) the classic ring text below.
      if (Array.isArray(h.lines) && h.lines.length) {
        h.lines.forEach((l) => parts.push('<p class="lm-prog">' + esc(l) + '</p>'));
        const paid = (typeof h.paidTotal === 'number' ? h.paidTotal : points) | 0;
        parts.push('<p class="lm-prog">Paid <b>' + paid + '</b> point' + (paid === 1 ? '' : 's') + ' so far</p>');
        if (h.complete) parts.push('<p class="qtip-pay">Complete — nothing left to earn</p>');
        return parts.join('');
      }
      parts.push('<p class="lm-prog">' + filled + ' of 6 neighbours placed · ' + matched +
        ' match · <b>' + points + '</b> point' + (points === 1 ? '' : 's') + ' so far</p>');
      if (h.complete) {
        parts.push('<p class="qtip-pay">Ring complete</p>');
      } else {
        const left = (typeof h.remaining === 'number') ? h.remaining : (6 - filled);
        parts.push('<p class="qtip-hint">Ring bonus ' + ring +
          ' per match when all six are down' +
          (left > 0 ? ' — ' + left + ' to go' : '') + '.</p>');
      }
      return parts.join('');
    }

    /** Fade the live bubble out and drop it from the DOM. */
    function dropLandmarkHover() {
      const old = lmNode;
      lmNode = null;
      lmKey = '';
      lmAt = '';
      if (!old) return;
      old.classList.remove('in');
      if (lmGone) clearTimeout(lmGone);
      lmGone = setTimeout(() => { if (old.parentNode) old.parentNode.removeChild(old); }, QUEST_FADE);
    }

    /**
     * Place the bubble near the landmark. It sits ABOVE the hex by default and flips BELOW when
     * there is no room up there, and is clamped horizontally so a landmark at the edge of the
     * viewport still gets a readable tip rather than one half off screen.
     */
    function placeLandmarkHover(node, sx, sy) {
      const vw = (typeof window !== 'undefined' && window.innerWidth) || 1280;
      const vh = (typeof window !== 'undefined' && window.innerHeight) || 720;
      const w = node.offsetWidth || 220;
      const h = node.offsetHeight || 120;
      const pad = 12;
      const lift = 52;                       // roughly one hex up from the centre
      let x = Math.max(pad + w / 2, Math.min(vw - pad - w / 2, sx));
      let below = (sy - lift - h - pad) < 0;  // no room above ⇒ go under the hex
      let y = below ? Math.min(vh - pad - h, sy + lift) : (sy - lift - h);
      if (y < pad) y = pad;
      const at = Math.round(x) + ',' + Math.round(y) + ',' + (below ? 'b' : 'a');
      if (at === lmAt) return;
      lmAt = at;
      node.style.left = Math.round(x) + 'px';
      node.style.top = Math.round(y) + 'px';
      node.classList.toggle('below', below);
    }

    function updateLandmarkHover(v) {
      const h = v && v.landmarkHover;
      if (!h || typeof h.sx !== 'number' || typeof h.sy !== 'number') { dropLandmarkHover(); return; }
      // The signature folds in everything the text depends on, so a frame where the pointer sat
      // still on the same landmark writes nothing at all.
      const key = (h.key || (h.q + ',' + h.r)) + '|' + h.kind + '|' + (h.filled | 0) + '|' +
                  (h.matched | 0) + '|' + (h.points | 0) + '|' + (h.complete ? 1 : 0) + '|' +
                  (h.paidTotal | 0) + '|' + (Array.isArray(h.lines) ? h.lines.join('\n') : '');
      if (!lmNode) {
        // A bubble that was mid-fade-out is replaced outright: never two at once.
        if (lmGone) { clearTimeout(lmGone); lmGone = 0; }
        while (lmBox.children.length) lmBox.removeChild(lmBox.children[0]);
        lmNode = el('div', 'qtip qtip-landmark');
        lmBox.appendChild(lmNode);
        lmKey = '';
        lmAt = '';
        const node = lmNode;
        const show = () => node.classList.add('in');
        requestAnimationFrame(show);
        setTimeout(show, 32);              // rAF is not reliable here; see announceSeason
      }
      if (key !== lmKey) { lmKey = key; lmNode.innerHTML = landmarkHoverHtml(h); }
      placeLandmarkHover(lmNode, h.sx, h.sy);
    }

    function updateSeason(s, v) {
      const se = v && v.season;
      if (!se || typeof se.index !== 'number') return;
      updateAlmanac(s, se);
      if (seasonIndex === se.index) return;
      // Two ways this is a BASELINE rather than a change:
      //  - the first season this HUD has ever seen; and
      //  - any index seen before the player has placed a tile. The season is a function of
      //    s.placed, so it cannot legitimately turn over at the start of a run — but main.js
      //    writes view.season AFTER hud.update, so the opening frames of a new run carry the
      //    PREVIOUS run's season and the HUD would otherwise announce "Spring" every time.
      const baseline = (seasonIndex === null) || !s || (s.placed || 0) <= 1;
      seasonIndex = se.index;
      if (baseline) return;
      if (se.name) announceSeason(se);
      // The almanac pops as the season turns.
      almanac.classList.remove('turn');
      void almanac.offsetWidth;          // restart the CSS animation on a fast second turn
      almanac.classList.add('turn');
      setTimeout(() => almanac.classList.remove('turn'), 1000);
    }

    // A quest whose target is not a countable progress number, so no "n/N" and no bar: a
    // 'pair'-kind rail quest, which completes by linking to another rail quest's run. Since
    // wave 3 rail defaults to 'length' (a count, like river) and reads as n/N like the rest.
    function isLinkQuest(s, q) {
      return q.type === 'rail' && ((s.C && s.C.QUEST_RAIL_KIND) || 'length') === 'pair';
    }

    // ---- queue ------------------------------------------------------------------------

    function drawSlot(slot, tile, rot, px) {
      const cv = slot.cv, ctx = slot.ctx;
      const dpr = Math.min(3, (window.devicePixelRatio || 1));
      const w = Math.ceil(Math.sqrt(3) * px) + 4;
      const h = Math.ceil(2 * px) + 4;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        cv.style.width = w + 'px';
        cv.style.height = h + 'px';
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      if (!tile) return;
      const edges = HG.Tiles.rotate(tile.edges, rot);
      if (HG.Renderer && HG.Renderer.drawTile) {
        HG.Renderer.drawTile(ctx, w / 2, h / 2, px, edges, {
          quest: tile.quest || null,
          landmark: tile.landmark || null,   // the renderer draws the glyph; a tile never has both
          seed: tile.id,          // the default seed is derived from `edges`, so rotating would
                                  // reshuffle the trees under the player's hand; the id never moves

          detail: dpr,            // device px per world px, so the art is drawn at the LOD it deserves
        });
      } else {
        // The renderer is a separate module and may not be loaded yet (or at all, in a
        // headless harness). A flat hex keeps the HUD honest instead of throwing.
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const c = HG.Hex.corner(w / 2, h / 2, px, i);
          if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fill();
      }
    }

    function updateQueue(s, rot, spin) {
      const px = HG.C.VIEW.QUEUE_TILE_PX;
      for (let i = 0; i < slots.length; i++) {
        const slot = slots[i];
        // Mid-rotation, the head slot is tilted back toward where it came from — the same
        // in-between the board ghost shows, and by the same maths (see drawGhost). A CSS
        // transform rather than a redraw: the canvas already holds the destination art, so
        // the whole flourish costs one style write a frame instead of a tile repaint.
        if (i === 0) {
          const sp = (typeof spin === 'number' && spin) ? spin : 0;
          const sk = sp ? sp.toFixed(3) : '';
          if (sk !== slot.spinKey) {
            slot.spinKey = sk;
            if (!sp) {
              slot.cv.style.transform = '';
            } else {
              const k = Math.cos(Math.min(Math.abs(sp), 1 - Math.abs(sp)) * Math.PI / 3);
              slot.cv.style.transform = 'rotate(' + (sp * 60).toFixed(2) + 'deg) scale(' + k.toFixed(4) + ')';
            }
          }
        }
        const tile = s.queue[i] || null;
        const size = i === 0 ? px : px * 0.75;
        const r = i === 0 ? rot : 0;    // only the tile in hand turns
        // The season is part of the key: the slot canvases are painted with the live palette,
        // so a season change on the board must repaint them too (wave 5).
        const season = (HG.Renderer && typeof HG.Renderer.season === 'number') ? HG.Renderer.season : -1;
        const key = tile ? (tile.id + ':' + r + ':' + size + ':' + (tile.landmark || '') + ':' + season) : 'empty:' + season;
        if (key !== slot.key) {
          slot.key = key;
          drawSlot(slot, tile, r, size);
          slot.wrap.classList.toggle('empty', !tile);
        }
        // A tile carries a quest OR a landmark, never both (core's contract), so ONE badge
        // element serves both — which is also why the two can never overlap.
        const q = tile && tile.quest;
        const lm = (!q && tile && tile.landmark) ? landmarkInfo(tile.landmark) : null;
        // The quest badge names the TERRAIN, not the quest type: what the player has to find on
        // the hex in their hand is the forest/water/rail edge the quest will anchor to.
        const label = q ? noun(q.terrain).replace(/^./, (c) => c.toUpperCase()) : '';
        const bk = q
          ? (label + (isLinkQuest(s, q) ? ' ⟷' : (q.type === 'solitude' ? ' =' : ' ') + q.target))
          : (lm ? lm.label : '');
        if (bk !== slot.badgeKey) {
          slot.badgeKey = bk;
          slot.btext.textContent = bk;
          slot.badge.style.display = bk ? '' : 'none';
          slot.badge.classList.toggle('landmark', !!lm);
          if (q) {
            slot.badge.style.color = terrainInk(q.terrain);
            slot.tip.innerHTML = '<b class="qtip-h">' + questTitle(s, q) + '</b>' + questTip(s, q);
          } else if (lm) {
            slot.badge.style.color = '';
            slot.badge.removeAttribute('title');
            slot.tip.innerHTML = landmarkTip(lm);
          } else {
            slot.badge.removeAttribute('title');
            slot.tip.innerHTML = '';
          }
        }
      }
    }

    /**
     * A tile in hand that carries a quest (or a landmark) gets announced ONCE, when it reaches
     * the head of the queue: a card pops up over the slot and the slot pulses in the quest's
     * terrain ink (a landmark: a smaller gold card, one shimmer). Click-through; gone in ~3 s.
     */
    function updateCallout(s) {
      const head = s.queue[0] || null;
      const id = head ? head.id : '';
      if (id === calloutId) return;
      calloutId = id;
      dropCallout();
      if (!head) return;
      const q = head.quest;
      const lm = (!q && head.landmark) ? landmarkInfo(head.landmark) : null;
      if (!q && !lm) return;
      const slot = slots[0];
      let html;
      if (q) {
        const counted = (q.type === 'grow' || q.type === 'river' || q.type === 'rail') && !isLinkQuest(s, q);
        html = '<div class="co-k"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2l2 4.3 4.6.5-3.4 3.1 1 4.6L8 11.4l-4.2 2.3 1-4.6L1.4 6l4.6-.5z"/></svg>Quest tile</div>' +
          '<div class="co-t">' + esc(questTitle(s, q)) + (counted ? ' · ' + esc(q.target) : '') + '</div>' +
          '<div class="co-s">place it to start the quest</div>';
      } else {
        html = '<div class="co-k">Landmark</div><div class="co-t">' + esc(lm.label) + '</div>';
      }
      const node = el('div', 'callout ' + (q ? 'co-quest' : 'co-landmark'), html);
      if (q) node.style.color = terrainInk(q.terrain);
      slot.wrap.appendChild(node);
      slot.wrap.classList.remove('call-quest', 'call-landmark');
      void slot.wrap.offsetWidth;        // restart the pulse if the class was still on
      slot.wrap.classList.add(q ? 'call-quest' : 'call-landmark');
      callNode = node;
      const [hold, life] = q ? CALLOUT_QUEST : CALLOUT_LANDMARK;
      const show = () => node.classList.add('in');
      requestAnimationFrame(show);
      setTimeout(show, 32);              // rAF is not reliable here; see announceSeason
      setTimeout(() => node.classList.add('out'), hold);
      setTimeout(() => {
        if (node.parentNode) node.parentNode.removeChild(node);
        if (callNode === node) { callNode = null; slot.wrap.classList.remove('call-quest', 'call-landmark'); }
      }, life);
    }

    function dropCallout() {
      if (callNode && callNode.parentNode) callNode.parentNode.removeChild(callNode);
      callNode = null;
      slots[0].wrap.classList.remove('call-quest', 'call-landmark');
    }

    /** The landmark badge's hover explanation, in the same shape the quest rows use. */
    function landmarkTip(info) {
      // Escaped: label/desc/wants are core's strings, and a stray `<` there must not be able to
      // rewrite the HUD.
      const parts = ['<b class="qtip-h">' + esc(info.label) + '</b>'];
      if (info.desc) parts.push('<p>' + esc(info.desc) + '</p>');
      // core's `desc` already names the terrain it wants ("…for every village edge facing it"),
      // so a separate Wants line is only worth its space when the description does not say it.
      if (info.wants && (!info.desc || info.desc.indexOf(info.wants) < 0)) {
        parts.push('<p><em>Wants</em> ' + esc(info.wants) + '</p>');
      }
      parts.push('<p class="qtip-hint">A landmark — place it where it belongs and it pays for itself.</p>');
      return parts.join('');
    }

    // ---- quests -----------------------------------------------------------------------

    /** The row's headline: says the verb AND the terrain, so it names the tile it came from. */
    function questTitle(s, q) {
      if (q.type === 'grow') return 'Grow ' + noun(q.terrain);
      if (q.type === 'river') return 'Extend river';
      if (q.type === 'rail') return isLinkQuest(s, q) ? 'Link railways' : 'Extend railway';
      if (q.type === 'solitude') return 'Lone village';
      return TYPE_LABEL[q.type] || q.type;
    }

    /**
     * The hover explanation: what the quest wants, how it can be lost, what it pays. Built
     * from the quest itself (target and rewards are fixed when it is issued) so the wording
     * can never disagree with the rule quests.js actually enforces.
     */
    function questTip(s, q) {
      const C = (s && s.C) || {};
      const n = tileNoun(q.terrain), g = groupNoun(q.terrain), N = q.target;
      const parts = [];
      if (q.type === 'solitude') {
        parts.push('Seal this ' + g + ' off at <b>exactly ' + N + '</b> ' +
                   (N === 1 ? 'tile' : 'tiles') + ' — surround it so no ' + n +
                   ' edge is left facing an empty hex.');
        parts.push('<em>Fails</em> the moment it grows past ' + N + ', or if it closes at any other size.');
      } else if (q.type === 'rail' && isLinkQuest(s, q)) {
        parts.push('Join this railway to the line of another rail quest, so the two runs become one.');
      } else {
        parts.push('Grow this ' + g + ' to <b>' + N + ' connected ' + n +
                   ' tiles</b>. Any tile you place with a matching ' + n +
                   ' edge against it joins in and counts.');
        if (C.QUEST_FAIL_ON_CLOSED !== false) {
          parts.push('<em>Fails</em> if the ' + g + ' is boxed in on every side before it reaches ' + N + '.');
        }
      }
      parts.push('<span class="qtip-pay">Pays +' + q.rewardTiles + ' tiles · +' + q.rewardScore + ' points</span>');
      return parts.map((p) => '<p>' + p + '</p>').join('');
    }

    function endedTip(s, q) {
      if (q.status === 'done') {
        return '<p><b>Done.</b> ' + questTitle(s, q) + ' paid +' + q.rewardTiles +
               ' tiles and +' + q.rewardScore + ' points.</p>';
      }
      const g = groupNoun(q.terrain);
      const why = q.type === 'solitude'
        ? 'the ' + g + ' grew past ' + q.target + ' tiles, or closed at the wrong size'
        : 'the ' + g + ' was sealed in before it reached ' + q.target + ' tiles';
      return '<p><b>Missed.</b> ' + questTitle(s, q) + ' — ' + why + '. It costs nothing but the reward.</p>';
    }

    function questRow(s, q) {
      let rec = rowByQuest.get(q.id);
      if (rec) return rec;
      const row = el('div', 'quest');
      const dot = el('span', 'qdot');
      dot.style.background = terrainInk(q.terrain);
      row.style.cssText = '--q:' + terrainInk(q.terrain);   // the bar and the edge stripe
      const name = el('span', 'qname', questTitle(s, q));
      const prog = el('span', 'qprog', '');
      const bar = el('span', 'qbar', '<i></i>');
      const tip = el('div', 'qtip');
      tip.innerHTML = '<b class="qtip-h">' + questTitle(s, q) + '</b>' + questTip(s, q) +
                      '<p class="qtip-hint">Its tiles are lit on the board — click to bring the camera to them.</p>';
      row.appendChild(dot);
      row.appendChild(name);
      row.appendChild(prog);
      row.appendChild(bar);
      row.appendChild(tip);
      // Pointing at a row lights its tiles up on the board; clicking takes the camera there.
      // That, not the text, is what actually answers "which tile is this?".
      row.addEventListener('pointerenter', () => { focused = q; call(o.onQuestFocus, q); });
      row.addEventListener('pointerleave', () => {
        if (focused === q) { focused = null; call(o.onQuestFocus, null); }
      });
      row.addEventListener('click', () => call(o.onQuestGoto, q));
      questList.appendChild(row);
      // One frame at opacity 0 so the row eases in rather than popping.
      requestAnimationFrame(() => row.classList.add('in'));
      rec = { row: row, tip: tip, quest: q, prog: prog, fill: bar.querySelector('i'),
              status: '', text: '', pct: -1, seenAt: 0 };
      rowByQuest.set(q.id, rec);
      return rec;
    }

    /** Fade a finished row out and forget it for good — see `retired`. */
    function retire(id, rec) {
      retired.add(id);
      rowByQuest.delete(id);
      if (rec.quest === focused) { focused = null; call(o.onQuestFocus, null); }
      rec.row.classList.remove('in');
      rec.row.style.pointerEvents = 'none';
      setTimeout(() => { if (rec.row.parentNode) rec.row.parentNode.removeChild(rec.row); }, QUEST_FADE);
    }

    function updateQuests(s, t) {
      let live = 0;
      for (let i = 0; i < s.quests.length; i++) {
        const q = s.quests[i];
        if (q.status === 'pending') continue;           // still in the queue; its tile wears the badge
        // A quest that has already had its moment on the list is DONE with the list. Without
        // this the aged-out row was swept, then rebuilt from s.quests on the very next frame
        // (s.quests keeps every quest for the whole run), so finished quests reappeared at the
        // bottom every QUEST_HOLD seconds and the list looked like it was shuffling itself.
        if (retired.has(q.id)) continue;

    }

    /** The round mute toggle, pinned to a panel's top-right corner. No audio ⇒ nothing added. */
    function addMute(card) {
      const m = muteButton();
      if (m) card.appendChild(m);
    }

    // ---- title ------------------------------------------------------------------------

    function buildTitle() {
      // Not a card: a column down the left edge, so the attract board plays on the right.
      const card = el('div', 'title-col');

      card.appendChild(el('div', 'crest', '<i></i><i></i><i></i>'));
      // The wordmark: hand-set letters in furrowed green, the "o" swapped for a forest tile,
      // a hedge growing along the baseline. Pure CSS (style.css "wordmark"); aria-label keeps the word.
      const logo = el('h1', 'logo', 
        'Hedger*ws'.split('').map((c) => c === '*' ? '<i class="lo"></i>' : '<span>' + c + '</span>').join(''));
      logo.setAttribute('aria-label', 'Hedgerows');
      card.appendChild(logo);

      // The launcher's player chip: emblem + name from the URL; absent name ⇒ no chip.
      try {
        const p = new URLSearchParams(location.search);
        const name = (p.get('playerName') || '').trim();
        if (name) {
          const chip = el('div', 'player-chip');
          chip.id = 'gl-player-chip';
          chip.textContent = ((p.get('playerEmblem') || '') + ' ' + name).trim();
          card.insertBefore(chip, card.firstChild);
        }
      } catch (e) { /* ignore */ }

      const today = todayUTC();
      const todaySeed = dailySeed(today);
      const record = readDaily(today);
      // Any best that beat what the boards last heard (a Save & quit, an offline finish) goes up now.
      syncBoards();

      // Four hex buttons in a honeycomb, each painted in a terrain's colours.
      const comb = el('div', 'comb');
      ALL_MODES.forEach((m) => {
        const c = el('button', 'hx hx-' + m.id);
        c.type = 'button';
        let tag = m.tag;
        if (m.daily) tag = prettyDate(today).replace(/ \d{4}$/, '');
        const best = m.daily ? record : readBest(bestKey(m.id));
        c.innerHTML = '<span class="hn">' + esc(m.name) + '</span><span class="ht">' + esc(tag) + '</span>' +
          (best ? '<span class="hb">Best ' + esc(best.score) + '</span>' : '');
        // A mode hex never starts anything itself; devComb makes it open its small option hexes
        // (New game always, Continue too when the mode has a save).
        c.hgNew = () => {
          lastMode = m.id;
          if (m.daily) {
            dailyRunDate = today;
            dailyRunSeed = todaySeed;
            call(o.onStart, 'daily', todaySeed);
            return;
          }
          call(o.onStart, m.id, randomSeed());     // every run gets a fresh seed
        };
        comb.appendChild(c);
      });
      card.appendChild(comb);

      // No auto-focus here: after any keypress (i.e. every run) a scripted focus() matches
      // :focus-visible, which wears the hover scale, so the focused hex (Journey with no save)
      // sat pre-enlarged and never reacted to the mouse. The card is not focusable, so this
      // is a no-op focus; Tab still walks the hexes.
      devComb(comb);
      return { node: card, focus: card };
    }

    /**
     * The title menu as one honeycomb (tried in the dev copy, promoted to every build
     * 2026-09-23). Continue sits above, between Journey and Quickplay; Settings bottom-left of
     * Hard; Exit below Settings. Every hex is placed on the same (column, row) lattice, so the
     * four mode hexes are re-seated here rather than left to the plain menu's grid. Each mode
     * has its own save slot (main.js): a saved mode resumes on click and pops out New game +
     * delete on hover; Continue is always shown and resumes the most recent save (faded with
     * none). Exit and New game confirm in a centred confirmBox.
     */
    function devComb(comb) {
      comb.classList.add('comb-dev', 'has-save');   // has-save: room above the big Continue hex
      const top = 1;                     // Continue is always there, faded when there is no save
      const place = (node, c, r) => { node.style.left = 'calc(' + c + ' * var(--cs))'; node.style.top = 'calc(' + r + ' * var(--rs))'; };
      const modeHexes = [...comb.children];
      comb.style.setProperty('--rows', String(top + 4));

      /** A hex plus the pill that pops out of its right side. */
      function slot(cls, html, c, r) {
        const wrap = el('div', 'hx-slot slot-' + cls.replace('hx-', ''));
        place(wrap, c, r);
        const h = el('button', 'hx ' + cls, html);
        h.type = 'button';
        const pop = el('div', 'hx-pop');
        wrap.appendChild(pop);
        wrap.appendChild(h);
        comb.appendChild(wrap);
        return { wrap: wrap, hex: h, pop: pop };
      }
      const trashIcon = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5M7 7v4M9 7v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      /**
       * The piece behind a Continue hex: a trash can that asks in the centred confirm card,
       * naming the run it would delete (Nic, 2026-09-23 — the inline Keep/Delete question got
       * lost when the cluster closed under it). Keep left, Delete right.
       */
      function restPill(sl, mode) {
        sl.pop.innerHTML = '';
        const b = btn('', 'pop-del', () => {
          const m = mode();
          const v = m && typeof o.getSave === 'function' ? o.getSave(m) : null;
          if (!v) { paint(); return; }
          const name = v.mode.charAt(0).toUpperCase() + v.mode.slice(1);
          confirmBox('Delete saved run?',
            name + ' · ' + v.score + ' pts · ' + v.placed + (v.placed === 1 ? ' tile' : ' tiles'),
            'Keep', 'Delete', () => { call(o.onDeleteSave, m); paint(); }, true);
        });
        b.title = 'Delete saved run';
        b.setAttribute('aria-label', 'Delete saved run');
        b.innerHTML = trashIcon;
        sl.pop.appendChild(b);
      }

      // Continue: always the most recent save; faded and inert when there is none.
      const cont = slot('hx-continue', '', 0.5, 0);
      let latest = null;
      cont.hex.addEventListener('click', () => { if (latest) { uiClick(); resumeRun(latest.mode); } });
      const contPill = () => restPill(cont, () => latest && latest.mode);

      // The four modes, re-seated on the lattice, each in a slot of its own so a saved one can
      // pop out New game + delete.
      const modeSlots = modeHexes.map((h, i) => {
        const p = [[0, 0], [1, 0], [0.5, 1], [1.5, 1]][i];
        const id = ALL_MODES[i].id;
        const wrap = el('div', 'hx-slot slot-mode');
        wrap.style.setProperty('--d', (i * 60) + 'ms');
        place(wrap, p[0], p[1] + top);
        const pop = el('div', 'hx-pop');
        wrap.appendChild(pop);
        wrap.appendChild(h);
        comb.appendChild(wrap);
        const ht = h.querySelector('.ht');
        const sl = { wrap: wrap, hex: h, pop: pop, id: id, ht: ht, tag: ht ? ht.textContent : '' };
        // Small option hexes around the big one's right side, all in the mode's colours: Continue
        // top-right (its hover pops the same delete pill as the big Continue), New game right,
        // Leaderboard bottom-right.
        const mini = (cls, html) => {
          const m = el('div', 'hx-mini ' + cls);
          const mh = el('button', 'hx hx-' + id, html);
          mh.type = 'button';
          const mp = el('div', 'hx-pop');
          m.appendChild(mp);
          m.appendChild(mh);
          wrap.appendChild(m);
          return { wrap: m, hex: mh, pop: mp };
        };
        sl.cont = mini('mini-cont', '');
        sl.cont.hex.addEventListener('click', () => { uiClick(); sl.close(); resumeRun(id); });
        sl.contReset = () => restPill(sl.cont, () => id);
        sl.fresh = mini('mini-new', '<span class="hn">New<br>Game</span>');
        sl.fresh.hex.addEventListener('click', () => {
          uiClick();
          // Only a save needs asking about (read live); with none, New game just starts.
          if (!(typeof o.getSave === 'function' && o.getSave(id))) { sl.close(); h.hgNew(); return; }
          confirmBox('Start a new ' + ALL_MODES[i].name + ' game?', 'This replaces your saved run.', 'Cancel', 'New Game',
            () => { call(o.onDeleteSave, id); h.hgNew(); });
        });
        // The mode's leaderboard: a third option hex, bottom-right (Nic, 2026-09-23).
        sl.board = mini('mini-lb', LB_ICON + '<span class="hn">Leaderboard</span>');
        sl.board.hex.addEventListener('click', () => { uiClick(); sl.close(); openLeaders(id, 'title'); });
        // Clicking the saved hex opens the cluster (Nic, 2026-09-23: click, not hover). It
        // closes on a press anywhere outside it, Esc, focus leaving it, or the pointer straying
        // more than CLOSE_FAR of the window width from it. Window listeners live only while open.
        const CLOSE_FAR = 0.1;
        let box = null;
        const far = (ev) => {
          const dx = Math.max(box.left - ev.clientX, 0, ev.clientX - box.right);
          const dy = Math.max(box.top - ev.clientY, 0, ev.clientY - box.bottom);
          if (Math.hypot(dx, dy) > CLOSE_FAR * window.innerWidth) sl.close();
        };
        // The press that closes the cluster only closes it: its click is swallowed, so it can't
        // also start the faded mode hex underneath (dropped after a moment if no click follows).
        const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
        const outside = (ev) => {
          if (wrap.contains(ev.target)) return;
          // A confirm card opened from the cluster (delete / new game) is not 'outside': its own
          // buttons must get their click, so it neither closes the cluster nor swallows.
          if (ev.target.closest && ev.target.closest('.screen-confirm')) return;
          sl.close();
          window.addEventListener('click', swallow, { capture: true, once: true });
          setTimeout(() => window.removeEventListener('click', swallow, true), 600);
        };
        const onKey = (ev) => {
          if (ev.key !== 'Escape' && ev.key !== 'Esc') return;
          ev.hgHandled = true;
          ev.preventDefault();
          sl.close();
        };
        const open = () => {
          if (wrap.classList.contains('open')) return;
          wrap.classList.add('open');
          comb.classList.add('dim');
          // The cluster's footprint: the big hex plus both small ones (the minis' boxes are laid
          // out even while hidden; their transform is the resting scale by the time we read it).
          box = [h, sl.cont.hex, sl.fresh.hex, sl.board.hex].map((n) => n.getBoundingClientRect()).filter((r) => r.width).reduce((u, r) => ({
            left: Math.min(u.left, r.left), top: Math.min(u.top, r.top),
            right: Math.max(u.right, r.right), bottom: Math.max(u.bottom, r.bottom),
          }));
          window.addEventListener('pointermove', far);
          window.addEventListener('pointerdown', outside, true);
          window.addEventListener('keydown', onKey, true);
        };
        sl.close = () => {
          window.removeEventListener('pointermove', far);
          window.removeEventListener('pointerdown', outside, true);
          window.removeEventListener('keydown', onKey, true);
          wrap.classList.remove('open');
          if (!comb.querySelector('.hx-slot.open')) comb.classList.remove('dim');
        };
        h.addEventListener('click', () => { uiClick(); open(); });
        wrap.addEventListener('focusout', (ev) => { if (!ev.relatedTarget || !wrap.contains(ev.relatedTarget)) sl.close(); });
        return sl;
      });

      /** Re-read every slot and dress the hexes to match (after a delete, too). */
      function paint() {
        const saves = typeof o.getSaves === 'function' ? o.getSaves() : {};
        latest = null;
        Object.keys(saves).forEach((k) => { if (!latest || saves[k].at > latest.at) latest = saves[k]; });
        if (latest) {
          const name = latest.mode.charAt(0).toUpperCase() + latest.mode.slice(1);
          cont.hex.innerHTML = '<span class="hn">Continue</span><span class="ht">' + esc(name) + '</span>' +
            '<span class="hb">' + esc(latest.score) + ' pts</span>';
          cont.hex.classList.remove('off');
          cont.hex.disabled = false;
          cont.wrap.classList.add('reveal');
          contPill();
        } else {
          cont.hex.innerHTML = '<span class="hn">Continue</span><span class="ht">No saved game</span>';
          cont.hex.classList.add('off');
          cont.hex.disabled = true;
          cont.wrap.classList.remove('reveal');
          cont.pop.innerHTML = '';
        }
        modeSlots.forEach((sl) => {
          const v = saves[sl.id];
          sl.hex.classList.toggle('saved', !!v);
          sl.wrap.classList.toggle('has-save', !!v);   // no save ⇒ no Continue option
          if (sl.ht) sl.ht.textContent = v ? 'Saved · ' + v.placed + (v.placed === 1 ? ' tile' : ' tiles') : sl.tag;
          if (v) {
            sl.cont.hex.innerHTML = '<span class="hn">Continue</span><span class="hb">' + esc(v.score) + ' pts</span>';
            sl.contReset();
          } else sl.close();
        });
      }
      paint();

      const set = slot('hx-settings', '<span class="hn">Settings</span>', 0, top + 2);
      set.hex.addEventListener('click', () => { uiClick(); openSettings('title'); });

      const exit = slot('hx-exit', '<span class="hn">Exit</span>', 0.5, top + 3);
      exit.hex.addEventListener('click', () => {
        uiClick();
        confirmBox('Exit the game?', '', 'Stay', 'Exit', () => call(o.onExit));
      });
    }

    /** Resume the run saved for `mode` (main.js consumes that slot). */
    function resumeRun(mode) {
      lastMode = mode === 'daily' ? 'journey' : mode;
      call(o.onContinue, mode);
    }

    /**
     * A centred confirmation card over whatever screen is up: Cancel left, Confirm right
     * (the house convention). Esc or a click on the wash cancels. Cancel takes focus.
     */
    function confirmBox(title, text, no, yes, onYes, danger) {
      const wrap = el('div', 'screen screen-confirm');
      const card = el('div', 'panel confirm-panel');
      card.appendChild(el('h2', 'ptitle', esc(title)));
      if (text) card.appendChild(el('p', 'confirm-text', esc(text)));
      const row = el('div', 'row');
      const close = () => {
        window.removeEventListener('keydown', onKey, true);
        wrap.classList.remove('in');
        wrap.classList.add('out');
        setTimeout(() => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, OUT_MS);
      };
      const onKey = (ev) => {
        if (ev.key !== 'Escape' && ev.key !== 'Esc') return;
        ev.hgHandled = true;
        ev.preventDefault();
        uiClick();
        close();
      };
      const cancel = btn(no, '', close);
      row.appendChild(cancel);
      row.appendChild(btn(yes, danger ? 'primary danger' : 'primary', () => { close(); onYes(); }));
      card.appendChild(row);
      wrap.appendChild(card);
      wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
      window.addEventListener('keydown', onKey, true);
      root.appendChild(wrap);
      void wrap.offsetWidth;
      wrap.classList.add('in');
      try { cancel.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }

    // ---- pause ------------------------------------------------------------------------

    function buildPause() {
      const card = el('div', 'panel pause-panel');
      card.appendChild(el('h2', 'ptitle', 'Paused'));
            const row = el('div', 'row pause-stack');
      const resume = btn('Resume', 'primary big', () => call(o.onResume));
      row.appendChild(resume);
      row.appendChild(btn('Settings', '', () => openSettings('pause')));
      row.appendChild(btn('Save & quit', '', () => call(o.onSaveExit)));
      card.appendChild(row);
      return { node: card, focus: resume };
    }

    // ---- settings ---------------------------------------------------------------------
    // Opened from the title or the pause panel and returns to whichever opened it (Back or
    // Esc). It is a screen of its own, so main.js still sees a screen open (music stays
    // ducked, input stays off, Esc doesn't resume the run underneath).

    let settingsFrom = 'title';

    function openSettings(from) {
      settingsFrom = from;
      show('settings');
    }

    function closeSettings() { show(settingsFrom); }

    // Esc on the settings panel goes Back. Capture phase on window, so it runs before
    // input.js's own Escape handler, which skips any event marked hgHandled.
    window.addEventListener('keydown', (ev) => {
      if ((curName !== 'settings' && curName !== 'leaders') || (ev.key !== 'Escape' && ev.key !== 'Esc')) return;
      ev.hgHandled = true;
      ev.preventDefault();
      uiClick();
      if (curName === 'leaders') closeLeaders(); else closeSettings();
    }, true);

    /** One labelled 0–100 % range slider bound to an HG.Audio getter/setter pair. */
    function slider(label, get, set, onRelease) {
      const row = el('label', 'set-row');
      row.appendChild(el('span', 'set-lab', esc(label)));
      const input = el('input', 'set-range');
      input.type = 'range';
      input.min = '0';
      input.max = '100';
      input.step = '1';
      const out = el('span', 'set-val');
      const pct = () => Math.round((+get() || 0) * 100);
      input.value = String(pct());
      out.textContent = input.value + '%';
      input.addEventListener('input', () => {
        try { set(+input.value / 100); } catch (e) { /* never break a slider */ }
        out.textContent = input.value + '%';
      });
      if (onRelease) input.addEventListener('change', onRelease);
      row.appendChild(input);
      row.appendChild(out);
      return row;
    }

    function buildSettings() {
      const card = el('div', 'panel settings-panel');
      addMute(card);
      card.appendChild(el('h2', 'ptitle', 'Settings'));
      const A = audio();
      if (A && typeof A.setMusicVolume === 'function' && typeof A.setSfxVolume === 'function') {
        const box = el('div', 'set-list');
        box.appendChild(slider('Music', () => A.musicVolume(), (v) => A.setMusicVolume(v)));
        // A wooden click on release, so the level can be judged against the thing you hear most.
        box.appendChild(slider('Sound effects', () => A.sfxVolume(), (v) => A.setSfxVolume(v), () => {
          try { A.event({ type: 'place', res: { perfect: false } }); } catch (e) { /* ignore */ }
        }));
        card.appendChild(box);
      } else {
        card.appendChild(el('p', 'psub', 'Sound is not available in this build.'));
      }
      card.appendChild(el('h3', 'set-h', 'Controls'));
      card.appendChild(el('dl', 'set-controls',
        '<dt>Place</dt><dd>Click an empty hex</dd>' +
        '<dt>Rotate</dt><dd>Scroll, right-click or <kbd>Q</kbd> <kbd>E</kbd></dd>' +
        '<dt>Pan</dt><dd>Drag the board</dd>' +
        '<dt>Zoom</dt><dd><kbd>Ctrl</kbd> + scroll or <kbd>+</kbd> <kbd>−</kbd></dd>' +
        '<dt>Menu</dt><dd><kbd>Esc</kbd></dd>'));
      const row = el('div', 'row');
      const back = btn('Back', 'primary', closeSettings);
      row.appendChild(back);
      card.appendChild(row);
      return { node: card, focus: back };
    }

    // ---- leaderboard ------------------------------------------------------------------
    // Opened from a mode's small badge hex on the title; mode tabs flip between the four boards
    // without leaving. Top ten (empty slots kept, dimmed), your own row lit, a pinned "you"
    // line under it, a status line + refresh. Posting the local best happens here too, so a
    // best that never reached the board goes up the moment you look for it. Names are the
    // players' own text: textContent only, never innerHTML. Never shows the player count (Nic).

    let leadersFrom = 'title';
    let leadersMode = 'journey';

    function openLeaders(mode, from) {
      leadersFrom = from || 'title';
      leadersMode = mode;
      show('leaders');
    }

    function closeLeaders() { show(leadersFrom); }

    const fmtScore = (n) => Math.round(n).toLocaleString('en-US');

    function buildLeaders() {
      const card = el('div', 'panel lb-panel');

      const head = el('div', 'lb-head');
      head.appendChild(el('div', 'lb-crest', LB_ICON));
      const titles = el('div', 'lb-titles');
      titles.appendChild(el('h2', 'ptitle', 'Leaderboard'));
      const sub = el('p', 'lb-sub');
      titles.appendChild(sub);
      head.appendChild(titles);
      card.appendChild(head);

      const tabs = el('div', 'lb-tabs');
      tabs.setAttribute('role', 'tablist');
      ALL_MODES.forEach((m) => {
        const t = el('button', 'lb-tab hx-' + m.id, '<span>' + esc(m.name) + '</span>');
        t.type = 'button';
        t.setAttribute('role', 'tab');
        t.dataset.mode = m.id;
        t.addEventListener('click', () => {
          if (m.id === leadersMode) return;
          uiClick();
          leadersMode = m.id;
          load();
        });
        tabs.appendChild(t);
      });
      card.appendChild(tabs);

      const list = el('ol', 'lb-list');
      card.appendChild(list);
      const me = el('div', 'lb-me');
      card.appendChild(me);

      const foot = el('div', 'lb-foot');
      const status = el('span', 'lb-status');
      foot.appendChild(status);
      const refresh = btn('', 'lb-refresh', () => load());
      refresh.innerHTML = REFRESH_ICON;
      refresh.title = 'Refresh';
      refresh.setAttribute('aria-label', 'Refresh');
      foot.appendChild(refresh);
      card.appendChild(foot);

      const row = el('div', 'row');
      const back = btn('Back', 'primary', closeLeaders);
      row.appendChild(back);
      card.appendChild(row);

      let token = 0;
      let clockTimer = 0;

      function setStatus(kind, text) {
        status.className = 'lb-status ' + kind;
        status.textContent = text;
      }

      /** The panel wears the mode's colours; the daily's subtitle counts down to its reset. */
      function dress(m) {
        card.className = 'panel lb-panel lb-' + m.id;
        [...tabs.children].forEach((t) => {
          const on = t.dataset.mode === m.id;
          t.classList.toggle('on', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        clearInterval(clockTimer);
        if (!m.daily) { sub.textContent = m.name + ' · ' + m.tag; return; }
        const tick = () => {
          if (!card.isConnected && clockTimer) { clearInterval(clockTimer); return; }
          sub.textContent = 'Daily · ' + prettyDate(todayUTC()) + ' · resets in ' + untilReset();
        };
        tick();
        clockTimer = setInterval(tick, 20000);
      }

      function paintRows(top) {
        list.innerHTML = '';
        for (let i = 0; i < 10; i++) {
          const e = top && top[i];
          const li = el('li', 'lb-row' + (e ? '' : ' empty') + (e && e.isMe ? ' me' : '') + (i < 3 ? ' p' + (i + 1) : ''));
          li.style.setProperty('--i', String(i));
          const rk = el('span', 'lb-rank');
          rk.textContent = String(i + 1);
          const who = el('span', 'lb-who');
          const emb = el('span', 'lb-emb');
          emb.textContent = e ? e.emblem : '';
          const nm = el('span', 'lb-name');
          nm.textContent = e ? e.name : '—';
          who.appendChild(emb);
          who.appendChild(nm);
          if (e && e.isMe) who.appendChild(el('span', 'lb-you', 'You'));
          const tl = el('span', 'lb-tiles');
          tl.textContent = e && e.meta && e.meta.placed ? e.meta.placed + ' tiles' : '';
          const sc = el('span', 'lb-score');
          sc.textContent = e ? fmtScore(e.score) : '';
          li.appendChild(rk);
          li.appendChild(who);
          li.appendChild(tl);
          li.appendChild(sc);
          list.appendChild(li);
        }
      }

      function paintMe(res, local) {
        me.innerHTML = '';
        if (res && res.me) {
          me.innerHTML = '<span class="lb-me-l">Your best</span><span class="lb-me-r"></span><span class="lb-me-s"></span>';
          me.querySelector('.lb-me-r').textContent = res.rank ? '#' + res.rank : '';
          me.querySelector('.lb-me-s').textContent = fmtScore(res.me.score);
          return;
        }
        me.appendChild(el('span', 'lb-me-l', local
          ? 'Your best of ' + fmtScore(local.score) + " hasn't reached the board yet."
          : 'No score yet — finish a run to get on the board.'));
      }

      async function load() {
        const t = ++token;
        const m = ALL_MODES.find((x) => x.id === leadersMode) || ALL_MODES[0];
        const local = readBest(bestKey(m.id, todayUTC()));
        dress(m);
        list.className = 'lb-list loading';
        paintRows(null);
        me.innerHTML = '';
        setStatus('sync', 'Syncing…');
        refresh.disabled = true;
        const done = () => { if (t === token) refresh.disabled = false; };
        const S = await leaderSDK();
        if (t !== token) return;
        if (!S) { offline(); done(); return; }
