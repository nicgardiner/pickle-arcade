<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hedgerows</title>
<style>
/* Hedgerows — all UI styles. Inlined verbatim by build.mjs: no @import, no url(), no web fonts.
   The terrain variables below mirror HG.Renderer.CSS_VARS one for one, so the HUD's swatches,
   the quest dots and the canvas can never drift apart. Calm is a design pillar: everything
   eases, nothing blinks, and there is no red anywhere. */

:root {
  /* --- the board's own palette ---
     These are HG.Renderer.CSS_VARS. main.js pushes that object onto :root at boot, so the
     values here are only what shows before the first frame — but they are kept identical so
     a screenshot taken mid-boot is not a different game. Edit render/renderer.js, not this. */
  --hg-bg: #f7f3e7;
  --hg-seam: #fffdf2;
  --hg-season: #d99a1e;
  --hg-text: #4a463a;
  --hg-frontier: #b4ae97;
  --hg-match: #3f8f63;
  --hg-neutral: #8d8974;
  --hg-scar: #c2604f;
  --hg-plain: #dde3cd;      --hg-plain-ink: #a9b492;
  --hg-field: #f2dfa4;      --hg-field-ink: #c2a052;
  --hg-forest: #b9d8ae;     --hg-forest-ink: #5b8f5f;
  --hg-village: #e8bda4;    --hg-village-ink: #a8624a;
  --hg-water: #c4dfec;      --hg-water-ink: #5a9fc6;
  --hg-rail: #d3d0c6;       --hg-rail-ink: #33322e;

  /* --- page. The rgb triples cannot be derived from a var(), so they are spelled out; keep
     them in step with --hg-bg / --hg-text above. --- */
  --bg: var(--hg-bg);
  --bg-rgb: 247 243 231;
  --ink: var(--hg-text);
  --ink-rgb: 74 70 58;
  --muted: #8d8974;
  --accent: var(--hg-match);
  --accent-rgb: 63 143 99;
  --gold: #c2a052;

  /* A pointy-top hex (the board's own shape) for clip-path; its box must be w × w·1.1547. */
  --hex: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  /* Headings and numbers. System faces only — no web fonts in this build. */
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;

  --paper: #fffdf7;
  --panel: rgb(255 253 247 / 0.86);
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --dur: 240ms;
  --radius: 16px;
  --shadow: 0 16px 40px rgb(var(--ink-rgb) / 0.14), 0 2px 6px rgb(var(--ink-rgb) / 0.07);
  --shadow-sm: 0 4px 12px rgb(var(--ink-rgb) / 0.10), 0 1px 3px rgb(var(--ink-rgb) / 0.07);
}

/* ---------- page skeleton ---------- */

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* One scalable unit: every component sizes in em, so the whole UI follows the window. */
  /* Above 1080p the second term takes over and grows with the screen, so the HUD keeps pace
     with the board at 1440p/4K (1920×1080 ≈ 16.9px either way; min() keeps ultrawides sane). */
  font-size: max(clamp(13px, 0.4vw + 9.2px, 22px), min(0.88vw, 1.565vh, 34px));
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#board {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: default;
}
#board.can-place { cursor: pointer; }
#board.panning { cursor: grabbing; }
/* Attract mode (main.js): the title's bot game slides right so the menu column has the left,
   and fades out between landscapes. */
#board { transition: transform 0.6s var(--ease), opacity 0.8s var(--ease); }
#app.attract #board { transform: translateX(14vw); cursor: default; }
#board.fading { opacity: 0; }

svg.ic {
  width: 1.15em;
  height: 1.15em;
  flex: none;
  display: block;
}

/* ---------- shared controls ---------- */

.btn {
  appearance: none;
  border: 0;
  margin: 0;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: rgb(var(--ink-rgb) / 0.07);
  border-radius: 999px;
  padding: 0.62em 1.4em;
  min-height: 2.6em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  cursor: pointer;
  white-space: nowrap;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease),
              box-shadow var(--dur) var(--ease), color var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.btn:hover { transform: translateY(-2px); background: rgb(var(--ink-rgb) / 0.11); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0) scale(0.985); transition-duration: 90ms; }
.btn:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 6px 16px rgb(var(--accent-rgb) / 0.26); }
.btn.primary:hover { background: var(--accent); filter: brightness(1.06); box-shadow: 0 10px 22px rgb(var(--accent-rgb) / 0.3); }
.btn.big { font-size: 1.1em; padding: 0.72em 1.7em; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { background: rgb(var(--ink-rgb) / 0.06); color: var(--ink); }
.btn.small { font-size: 0.86em; padding: 0.45em 1em; min-height: 2.2em; }

.rnd {
  appearance: none;
  border: 0;
  margin: 0;
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  backdrop-filter: blur(14px) saturate(1.1);
  width: 2.6em;
  height: 2.6em;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease),
              box-shadow var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.rnd:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.rnd:active { transform: translateY(0) scale(0.95); transition-duration: 90ms; }
.rnd:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 2px; }
.rnd.menu { color: var(--muted); }

/* ---------- HUD ---------- */

#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;                 /* the board is the UI; only the controls take clicks */
  opacity: 1;
  transition: opacity var(--dur) var(--ease);
}
#hud.hidden { opacity: 0; pointer-events: none; }
/* `#hud > *` below turns pointer events back ON for every child, and a child's `auto` beats a
   parent's `none` — so without this an invisible HUD still swallowed clicks over the summary. */
#hud.hidden > * { pointer-events: none; }
#hud > * { position: absolute; pointer-events: auto; }

/* top-left: a hex badge of tiles left, the score beside it in the serif */
.hud-stats {
  top: 1.1em;
  left: 1.2em;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 0.75em;
  filter: drop-shadow(0 3px 6px rgb(var(--ink-rgb) / 0.16));
}
#hud > .hud-stats { pointer-events: none; }
.hud-tiles {
  width: 3.7em;
  height: calc(3.7em * 1.1547);
  clip-path: var(--hex);
  background: var(--accent);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: background var(--dur) var(--ease);
}
.hud-tiles .n { font-variant-numeric: tabular-nums; font-size: 1.4em; font-weight: 700; line-height: 1; }
.hud-tiles .l { font-size: 0.58em; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; margin-top: 0.15em; }
/* The only "warning" in the game, and it is a colour shift, not a blink. */
.hud-tiles.low { background: var(--gold); }
.hud-score { display: flex; flex-direction: column; }
.hud-score .n {
  font-family: var(--serif);
  font-size: 2.5em;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  text-shadow: 0 1px 0 rgb(var(--bg-rgb) / 0.9), 0 0 12px rgb(var(--bg-rgb) / 0.8);
}
.hud-score .l {
  font-size: 0.66em;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.2em;
}

/* top-right: open quests */
.hud-quests {
  top: 1.1em;
  right: 1.2em;
  width: 15em;
  max-width: 38vw;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease);
}
.hud-quests.empty { opacity: 0; }
.quest-list { display: flex; flex-direction: column; gap: 0.4em; }
.quest {
  display: grid;
  grid-template-columns: 0.7em 1fr auto;
  grid-template-rows: auto auto;
  align-items: center;
  gap: 0.15em 0.55em;
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  backdrop-filter: blur(14px) saturate(1.1);
  border-radius: 4px 12px 12px 4px;
  border-left: 0.28em solid var(--q, var(--accent));
  padding: 0.5em 0.7em;
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transform: translateX(0.5em);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.quest.in { opacity: 1; transform: none; }
/* Rows are the one part of the HUD you can point at: hovering lights the quest's tiles up on
   the board and opens the explanation, clicking takes the camera there. */
.quest { position: relative; pointer-events: auto; cursor: pointer; }
.quest:hover { box-shadow: var(--shadow-sm), 0 0 0 2px rgb(var(--accent-rgb) / 0.35); }

/* the hover explanation — left of the panel, because the panel is pinned top-right */
.qtip {
  position: absolute;
  right: 100%;
  top: -0.3em;
  margin-right: 0.6em;
  width: 17em;
  max-width: 44vw;
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  backdrop-filter: blur(14px) saturate(1.1);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  padding: 0.7em 0.8em;
  font-size: 0.82em;
  line-height: 1.45;
  color: var(--ink);
  text-align: left;
  opacity: 0;
  transform: translateX(0.4em);
  pointer-events: none;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.quest:hover .qtip { opacity: 1; transform: none; }
.qtip p { margin: 0.45em 0 0; }
.qtip b.qtip-h { display: block; font-size: 1.05em; }
.qtip em { font-style: normal; color: var(--gold); font-weight: 600; }
.qtip .qtip-pay { color: var(--accent); font-weight: 600; }
.qtip .qtip-hint { color: var(--muted); font-size: 0.92em; }
.qdot { width: 0.7em; height: calc(0.7em * 1.1547); clip-path: var(--hex); grid-row: 1; }
.qname { font-family: var(--serif); font-weight: 700; font-size: 0.9em; grid-row: 1; }
.qprog { font-variant-numeric: tabular-nums; font-size: 0.85em; color: var(--muted); grid-row: 1; }
.qbar {
  grid-column: 1 / -1;
  grid-row: 2;
  height: 0.28em;
  border-radius: 999px;
  background: rgb(var(--ink-rgb) / 0.09);
  overflow: hidden;
}
.qbar i { display: block; height: 100%; width: 0%; background: var(--q, var(--accent)); border-radius: 999px;
          transition: width var(--dur) var(--ease); }
.quest.done { background: rgb(var(--accent-rgb) / 0.16); }
.quest.done .qprog { color: var(--accent); font-weight: 700; }
.quest.failed { opacity: 0.45; }
.quest.failed .qbar i { background: var(--muted); }

/* bottom-centre: the queue, straight on the board */
.hud-tray {
  bottom: 0.9em;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
}
#hud > .hud-tray { pointer-events: none; }
.hud-queue {
  display: flex;
  align-items: flex-end;
  gap: 0.7em;
}
.qslot {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  filter: drop-shadow(0 6px 14px rgb(var(--ink-rgb) / 0.14));
  opacity: 0.72;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.qslot.head { opacity: 1; }
.qslot.empty { opacity: 0; }
/* The tray is click-through; a slot takes the pointer back so hovering it opens its badge's tip. */
.qslot:not(.empty) { pointer-events: auto; cursor: help; }
/* The head slot's canvas is turned by hud.js while a rotation is in flight (transform written
   per frame, so it must NOT carry a transition of its own to fight). */
.qslot canvas { display: block; transform-origin: 50% 50%; }
/* One badge per slot, and a tile carries a quest OR a landmark — never both — so the quest
   badge and the landmark badge are literally the same element and cannot overlap. */
.qbadge {
  position: absolute;
  top: -0.5em;
  left: 50%;
  transform: translateX(-50%);
  background: var(--paper);
  border-radius: 999px;
  padding: 0.1em 0.55em;
  font-size: 0.7em;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
}
.qbadge.landmark {
  color: var(--gold);
  box-shadow: var(--shadow-sm), 0 0 0 1.5px rgb(194 160 82 / 0.5);
}
.qbadge .qbtext { display: block; }

/* ---------- the callout: a quest / landmark tile has reached your hand ---------- */

/* Sits over the head slot, above its badge. `color` is the quest's terrain ink (hud.js). */
.callout {
  position: absolute;
  bottom: calc(100% + 1.3em);
  left: 50%;
  pointer-events: none;
  white-space: nowrap;
  text-align: center;
  background: var(--paper);
  border-radius: 0.9em;
  box-shadow: var(--shadow), 0 0 0 0.18em currentColor;
  padding: 0.55em 1.2em 0.6em;
  opacity: 0;
  transform: translate(-50%, 1.4em) scale(0.4);
  transform-origin: 50% 100%;
  transition: opacity 260ms var(--ease), transform 520ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
/* the little tail pointing down at the tile */
.callout::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 100%;
  width: 0.9em;
  height: 0.9em;
  background: var(--paper);
  box-shadow: 0.18em 0.18em 0 0 currentColor;
  transform: translate(-50%, -0.45em) rotate(45deg);
}
.callout.in { opacity: 1; transform: translate(-50%, 0) scale(1); }
.callout.out { opacity: 0; transform: translate(-50%, -0.8em) scale(0.96); transition-duration: 500ms; }
.co-k {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.35em;
  font-size: 0.72em;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.co-k svg { width: 1.3em; height: 1.3em; fill: currentColor; }
.callout.in .co-k svg { animation: co-star 1200ms cubic-bezier(0.34, 1.56, 0.64, 1) 150ms both; }
@keyframes co-star { 0% { transform: rotate(-180deg) scale(0); } 100% { transform: none; } }
.co-t { font-family: var(--serif); font-size: 1.35em; font-weight: 700; color: var(--ink); line-height: 1.2; }
.co-s { font-size: 0.74em; font-style: italic; color: var(--muted); }
/* The landmark's is the small one: gold, two lines, no subtitle. */
.callout.co-landmark { color: var(--gold); padding: 0.35em 1em 0.4em; bottom: calc(100% + 1.1em); }
.callout.co-landmark .co-t { font-size: 1.05em; }

/* The slot answers the callout: the quest tile pulses three times in its terrain's ink, the
   landmark tile gets one gold shimmer. Filter on the canvas, so the hex shape carries the glow. */
.qslot.call-quest canvas { animation: slot-pulse 800ms ease-in-out 3; }
.qslot.call-landmark canvas { animation: slot-shimmer 1100ms ease-out 1; }
@keyframes slot-pulse {
  0%, 100% { filter: drop-shadow(0 0 0 rgb(255 255 255 / 0)); }
  50% { filter: drop-shadow(0 0 0.55em rgb(255 236 150 / 0.95)) drop-shadow(0 0 0.2em rgb(255 255 255 / 0.9)) brightness(1.08); }
}
@keyframes slot-shimmer {
  0% { filter: none; transform: none; }
  30% { filter: drop-shadow(0 0 0.6em rgb(232 196 96 / 0.95)) brightness(1.1); }
  100% { filter: none; }
}

/* The landmark tip: the quest rows' .qtip, re-anchored ABOVE the queue (which is pinned to the
   bottom of the screen) and centred on the badge. */
.qtip.qtip-badge {
  right: auto;
  left: 50%;
  top: auto;
  bottom: 100%;
  margin: 0 0 0.7em;
  transform: translate(-50%, 0.4em);
  width: 16em;
  max-width: 70vw;
  font-size: 1em;            /* .qbadge is already 0.7em — don't shrink twice */
  font-weight: 400;
  color: var(--ink);
  white-space: normal;
  text-align: left;
}
.qslot:hover .qtip-badge { opacity: 1; transform: translate(-50%, 0); }
/* An empty tip (a quest badge, or no badge at all) must never show a bare bubble. */
.qtip.qtip-badge:empty { display: none; }

/* ---------- the placed-landmark tip ---------- */

/* A host spanning the board, holding exactly one .qtip positioned in viewport px by hud.js.
   Click-through at every level: it floats over the hexes you are about to click. */
.hud-lmhover { inset: 0; pointer-events: none; }
#hud > .hud-lmhover, .hud-lmhover * { pointer-events: none; }
.qtip.qtip-landmark {
  position: absolute;
  right: auto;
  bottom: auto;
  margin: 0;
  width: 15em;
  max-width: 62vw;
  /* left/top are the tip's own top-left, written by hud.js, so the bubble is translated back
     by half its width to sit centred over the hex. */
  transform: translate(-50%, 0.4em);
  white-space: normal;
}
.qtip.qtip-landmark.in { opacity: 1; transform: translate(-50%, 0); }
/* Flipped under the hex: it should rise INTO place from below, not drop onto it. */
.qtip.qtip-landmark.below { transform: translate(-50%, -0.4em); }
.qtip.qtip-landmark.below.in { transform: translate(-50%, 0); }
.qtip .lm-prog { font-variant-numeric: tabular-nums; }
.qtip .lm-prog b { color: var(--accent); }

/* ---------- the season label ---------- */

/* ---------- the almanac: the season's emblem, ringed by how far into it the run is ---------- */

/* Under the tiles badge, centred on it (badge: left 1.2em, 3.7em wide, 4.27em tall). */
.hud-almanac {
  top: 6.1em;
  left: 1.35em;
  width: 3.4em;
  height: 3.4em;
  border-radius: 50%;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
  cursor: default;
}
.alm-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.alm-ring circle { fill: none; stroke-width: 3.2; }
.alm-ring .track { stroke: rgb(var(--ink-rgb) / 0.09); }
.alm-ring .fill {
  stroke: var(--hg-season);
  stroke-linecap: round;
  stroke-dashoffset: 119.38;
  transition: stroke-dashoffset 600ms var(--ease), stroke 600ms var(--ease);
}
.alm-icon { position: absolute; inset: 22%; }
.alm-icon svg { display: block; width: 100%; height: 100%; }
/* The turn: the emblem spins in while the medallion swells and settles. */
.hud-almanac.turn { animation: alm-pop 900ms cubic-bezier(0.34, 1.56, 0.64, 1); }
.hud-almanac.turn .alm-icon { animation: alm-spin 900ms cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes alm-pop { 0% { transform: scale(1); } 35% { transform: scale(1.28); box-shadow: 0 0 0 0.5em rgb(255 255 255 / 0.5), var(--shadow); } 100% { transform: scale(1); } }
@keyframes alm-spin { 0% { transform: rotate(-120deg) scale(0.3); opacity: 0; } 100% { transform: none; opacity: 1; } }

/* ---------- the season banner (top-centre) ---------- */

.hud-season {
  top: 1.4em;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  display: flex;
  justify-content: center;
  width: max-content;
  max-width: 90vw;
}
/* `#hud > *` sets pointer-events: auto on every direct child; these must not take them, or a
   three-second banner (and the weather) would eat clicks meant for the board. */
#hud > .hud-season, .hud-season *, #hud > .hud-drift, .hud-drift * { pointer-events: none; }
.season-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0.8em 4.5em 1.3em;
  /* a pool of parchment behind the words, so they read over any terrain */
  background: radial-gradient(closest-side, rgb(var(--bg-rgb) / 0.96), rgb(var(--bg-rgb) / 0.88) 58%, transparent);
  opacity: 0;
  transition: opacity 500ms var(--ease), transform 800ms var(--ease);
}
.season-label.in { opacity: 1; }
.season-label.out { opacity: 0; transform: translateY(-1.2em) scale(0.94); }
.sb-icon { width: 2.6em; height: 2.6em; filter: drop-shadow(0 2px 3px rgb(var(--ink-rgb) / 0.18)); }
.sb-icon svg { display: block; width: 100%; height: 100%; }
.sb-name {
  font-family: var(--serif);
  font-size: 2.6em;
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1.1;
  color: var(--hg-season);
  text-shadow: 0 1px 0 rgb(255 255 255 / 0.8), 0 0 18px rgb(var(--bg-rgb) / 0.9);
  white-space: nowrap;
}
.sb-name span { display: inline-block; opacity: 0; }
.sb-rule {
  height: 2px;
  width: 0;
  margin: 0.25em 0 0.35em;
  border-radius: 1px;
  background: linear-gradient(90deg, transparent, var(--hg-season), transparent);
}
.season-label.in .sb-icon { animation: sb-icon 1000ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.season-label.in .sb-name span { animation: sb-letter 700ms var(--ease) calc(160ms + var(--i) * 70ms) both; }
.season-label.in .sb-rule { animation: sb-rule 900ms var(--ease) 450ms both; }
@keyframes sb-icon { 0% { transform: scale(0) rotate(-140deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes sb-letter { 0% { transform: translateY(0.55em); opacity: 0; filter: blur(4px); } 100% { transform: none; opacity: 1; filter: none; } }
@keyframes sb-rule { 0% { width: 0; } 100% { width: 9em; } }

/* ---------- the season's weather, blown across the screen on a turn ---------- */

.hud-drift { inset: 0; overflow: hidden; pointer-events: none; }
.hud-drift i {
  position: absolute;
  left: var(--x);
  top: -4vh;
  width: 0.7em;
  height: 0.7em;
  opacity: 0;
  animation: drift-fall var(--dur) linear var(--delay) both;
}
@keyframes drift-fall {
  0% { transform: translate(0, 0) rotate(0) scale(var(--sc)); opacity: 0; }
  10% { opacity: 0.95; }
  50% { transform: translate(calc(var(--dx) * -0.4), 55vh) rotate(calc(var(--rot) * 0.5)) scale(var(--sc)); }
  85% { opacity: 0.9; }
  100% { transform: translate(var(--dx), 108vh) rotate(var(--rot)) scale(var(--sc)); opacity: 0; }
}
/* spring — blossom petals */
.hud-drift .d-spring { background: #f6b9d0; border-radius: 80% 0 80% 0; box-shadow: inset -2px -2px 0 rgb(214 110 150 / 0.35); }
/* summer — warm motes of pollen and light, rising instead of falling */
.hud-drift .d-summer {
  top: auto; bottom: -4vh; width: 0.42em; height: 0.42em; border-radius: 50%;
  background: radial-gradient(circle, #fff6c8, #f5c542 55%, rgb(245 197 66 / 0));
  animation-name: drift-rise;
}
@keyframes drift-rise {
  0% { transform: translate(0, 0) scale(var(--sc)); opacity: 0; }
  15% { opacity: 1; }
  50% { transform: translate(calc(var(--dx) * 0.5), -45vh) scale(calc(var(--sc) * 1.3)); }
  100% { transform: translate(var(--dx), -95vh) scale(var(--sc)); opacity: 0; }
}
/* autumn — leaves, tumbling */
.hud-drift .d-autumn { width: 0.95em; height: 0.6em; background: #d8692b; border-radius: 0 100% 0 100%; }
.hud-drift .d-autumn:nth-child(3n) { background: #b8471f; }
.hud-drift .d-autumn:nth-child(3n+1) { background: #e0a53a; }
/* winter — snow */
.hud-drift .d-winter {
  width: 0.5em; height: 0.5em; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 1px rgb(74 147 200 / 0.25), 0 1px 3px rgb(74 147 200 / 0.35);
}

/* bottom-right: zoom and menu share one horizontal parchment bar */
.hud-tools {
  right: 1.2em;
  bottom: 1.2em;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.15em;
  padding: 0.3em;
  border-radius: 999px;
  background: var(--panel);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  backdrop-filter: blur(14px) saturate(1.1);
  box-shadow: var(--shadow-sm);
}
.hud-tools .rnd { background: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; width: 2.3em; height: 2.3em; }
.hud-tools .rnd:hover { background: rgb(var(--ink-rgb) / 0.08); transform: none; box-shadow: none; }
.hud-tools .rnd.menu { margin-left: 0.15em; box-shadow: inset 1px 0 0 rgb(var(--ink-rgb) / 0.1); border-radius: 0.6em 999px 999px 0.6em; }

@media (max-width: 640px) {
  .hud-quests { width: 11em; }
  /* No room to the left on a phone — drop the explanation under its row instead. */
  .qtip { right: 0; left: auto; top: 100%; margin: 0.4em 0 0; width: 15em; max-width: 78vw; }
  .hud-tools { gap: 0.35em; }
}

/* ---------- screens ---------- */

#screens {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3vh 3vw;
  box-sizing: border-box;
  pointer-events: auto;
  opacity: 0;
  background: rgb(var(--bg-rgb) / 0.55);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  transition: opacity var(--dur) var(--ease);
  overflow: auto;
}
.screen.in { opacity: 1; }
/* The summary's "View map" (screens.js peek): the screen fades aside, the board takes the
   pointer again, and one button waits at the bottom to bring the results back. */
#screens.peek .screen { opacity: 0; pointer-events: none; }
.peek-back {
  position: absolute; left: 50%; bottom: max(4vh, 1.2em);
  pointer-events: auto;
  opacity: 0; visibility: hidden;
  transform: translate(-50%, 0.6em);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease), visibility 0s linear var(--dur);
}
#screens.peek .peek-back {
  opacity: 1; visibility: visible; transform: translate(-50%, 0);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease), visibility 0s;
}
/* `out` is set on the frame the fade STARTS, so the leaving screen stops taking clicks
   immediately instead of sitting invisibly over the board for the length of the transition.
   screens.js removes the element once the fade is done (and sets `inert` where it exists). */
.screen.out { opacity: 0; pointer-events: none; }
/* The title washes only the left, where its column sits; the attract board plays on the right. */
.screen-title {
  justify-content: flex-start;
  align-items: flex-start;              /* anchored top-left */
  padding: max(5vh, 1.5em) 0 0 max(4vw, 1.5em);
  overflow-y: auto;                     /* a short window scrolls rather than clipping the comb */
  background: linear-gradient(90deg, rgb(var(--bg-rgb) / 0.95) 0%, rgb(var(--bg-rgb) / 0.86) 26%, rgb(var(--bg-rgb) / 0) 52%);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}

.panel {
  position: relative;
  background: var(--panel);
  -webkit-backdrop-filter: blur(18px) saturate(1.12);
  backdrop-filter: blur(18px) saturate(1.12);
  border-radius: calc(var(--radius) * 1.5);
  /* a map cartouche: the card, a hairline rule just inside its edge */
  box-shadow: var(--shadow), inset 0 0 0 0.45em var(--panel), inset 0 0 0 calc(0.45em + 1px) rgb(var(--ink-rgb) / 0.13);
  padding: 2em 2.4em;
  box-sizing: border-box;
  max-width: 34em;
  width: 100%;
  text-align: center;
  /* Fade + a small lift and scale. The panel eases on its own curve so the card arrives just
     after the wash behind it — the whole point of the two elements. */
  transform: translateY(0.9em) scale(0.975);
  transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
  opacity: 0.4;
}
.screen.in .panel { transform: none; opacity: 1; }
.screen.out .panel { transform: translateY(0.4em) scale(0.985); opacity: 0; }

/* The panel's CONTENTS arrive just after the panel, on exactly the same curve and duration —
   the pause and summary cards settle instead of appearing fully formed. The delays are small
   and additive (60 ms apart), so the last row is only ~0.2 s behind the card.
   The mute toggle is pinned to the panel's corner rather than stacked in it, so it is left
   out of the stagger entirely (it keeps its own hover lift). */
.pause-panel > *:not(.mute), .summary-panel > *:not(.mute) {
  opacity: 0;
  transform: translateY(0.35em);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.screen.in .pause-panel > *:not(.mute), .screen.in .summary-panel > *:not(.mute) {
  opacity: 1;
  transform: none;
}
.screen.in .pause-panel > *:nth-child(1):not(.mute),
.screen.in .summary-panel > *:nth-child(1):not(.mute) { transition-delay: 60ms; }
.screen.in .pause-panel > *:nth-child(2):not(.mute),
.screen.in .summary-panel > *:nth-child(2):not(.mute) { transition-delay: 105ms; }
.screen.in .pause-panel > *:nth-child(3):not(.mute),
.screen.in .summary-panel > *:nth-child(3):not(.mute) { transition-delay: 150ms; }
.screen.in .pause-panel > *:nth-child(n+4):not(.mute),
.screen.in .summary-panel > *:nth-child(n+4):not(.mute) { transition-delay: 195ms; }
/* Leaving is one move, not a staggered one — the card is already on its way out. */
.screen.out .panel > * { transition-delay: 0ms; }

/* the mute toggle, pinned to the panel's top-right corner (title + pause) */
.rnd.mute {
  position: absolute;
  top: 0.75em;
  right: 0.75em;
  width: 2.2em;
  height: 2.2em;
  font-size: 0.95em;
  line-height: 1;
  background: rgb(var(--ink-rgb) / 0.06);
  box-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.rnd.mute:hover { background: rgb(var(--ink-rgb) / 0.11); box-shadow: var(--shadow-sm); }
.rnd.mute.off { opacity: 0.55; }

/* ---------- title: a column on the left, a honeycomb of modes ---------- */

.title-col {
  font-size: 1.3em;                     /* the whole column scales from here — everything inside is em */
  width: min(22em, 92vw);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  transform: translateX(-1.2em);
  opacity: 0;
  transition: transform 420ms var(--ease), opacity 420ms var(--ease);
}
.screen.in .title-col { transform: none; opacity: 1; }
/* A short window (720p and under) steps the column down so Settings clears the bottom edge. */
@media (max-height: 780px) { .title-col { font-size: 1.08em; } }
.screen.out .title-col { transform: translateX(-0.6em); opacity: 0; }

/* the launcher's player chip (emblem + name), above the crest */
.player-chip { font-family: var(--serif); font-size: 0.72em; opacity: 0.7; margin-bottom: 0.7em; white-space: nowrap; }

/* three little hexes, the landscape in miniature */
.crest { display: flex; gap: 0.18em; margin-bottom: 0.8em; }
.crest i { width: 1.05em; height: calc(1.05em * 1.1547); clip-path: var(--hex); display: block; }
.crest i:nth-child(1) { background: var(--hg-forest-ink); }
.crest i:nth-child(2) { background: var(--hg-field-ink); transform: translateY(-0.5em); }
.crest i:nth-child(3) { background: var(--hg-water-ink); }

/* ---- wordmark: hand-set letters, a tile for the "o", a hedge along the baseline ---- */
.logo {
  position: relative;
  margin: 0 0 0.9em;
  font-family: var(--serif);
  font-size: 4.4em;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
  white-space: nowrap;
  filter: drop-shadow(0 0.03em 0 var(--paper)) drop-shadow(0 0.06em 0.05em rgb(var(--ink-rgb) / 0.18));
}
/* Each letter is ploughed land: a green body with furrows. Inline, not inline-block: a 1em inline-block box clips the "g" descender out of the text fill. */
.logo span {
  display: inline;
  color: transparent;
  background:
    repeating-linear-gradient(-62deg, rgb(255 255 255 / 0.16) 0 0.035em, transparent 0.035em 0.11em),
    linear-gradient(180deg, var(--accent) 20%, var(--hg-forest-ink) 85%);
  -webkit-background-clip: text;
  background-clip: text;
}
.logo span:nth-child(1) { font-size: 1.12em; }
/* The "o" is a forest tile: rim, fill, one tree. */
.logo .lo {
  display: inline-block;
  width: 0.44em;
  height: calc(0.44em * 1.1547);
  margin: 0 0.02em 0 0.04em;
  vertical-align: -0.04em;
  clip-path: var(--hex);
  background: var(--hg-forest-ink);
  position: relative;
}
.logo .lo::before {
  content: '';
  position: absolute;
  inset: 0.045em;
  clip-path: var(--hex);
  background:
    radial-gradient(circle at 44% 40%, rgb(255 255 255 / 0.35) 0 0.035em, transparent 0.04em),
    radial-gradient(circle at 50% 46%, var(--hg-forest-ink) 0 0.12em, transparent 0.125em),
    linear-gradient(var(--hg-forest-ink), var(--hg-forest-ink)) 50% 78% / 0.04em 0.14em no-repeat,
    var(--hg-forest);
}
/* The hedge along the baseline, grown up over the letters' feet: three layers of bushes whose
   periods never line up (0.17/0.23/0.29em), so the row reads as a hedge rather than a string of
   beads, on a dark band of undergrowth, with a few field-gold flowers on top. */
.logo::after {
  content: '';
  position: absolute;
  left: -0.06em;
  right: -0.08em;
  bottom: -0.3em;
  height: 0.24em;
  border-radius: 0.1em;
  background:
    radial-gradient(circle, var(--hg-field) 0 0.016em, transparent 0.02em) 0.07em 32% / 0.41em 100% repeat-x,
    radial-gradient(ellipse 0.075em 0.065em, var(--hg-forest) 0 92%, transparent 100%) 0.12em 30% / 0.29em 100% repeat-x,
    radial-gradient(ellipse 0.09em 0.08em, var(--accent) 0 92%, transparent 100%) 0.02em 45% / 0.23em 100% repeat-x,
    radial-gradient(ellipse 0.085em 0.08em, var(--hg-forest-ink) 0 92%, transparent 100%) 0.07em 70% / 0.17em 100% repeat-x,
    linear-gradient(transparent 55%, var(--hg-forest-ink) 55%);
}
.pitch { margin: 0.5em 0 1.6em; color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 1.1em; }
.ptitle { margin: 0 0 0.2em; font-family: var(--serif); font-size: 1.8em; font-weight: 700; }
.psub { margin: 0 0 1.4em; color: var(--muted); }

/* Pointy-top hexes: row two sits half a hex right and a quarter hex up, like the board. */
.comb {
  --hw: 7.6em;
  --gap: 0.45em;
  display: grid;
  grid-template-columns: repeat(2, var(--hw));
  gap: 0 var(--gap);
  padding-right: calc(var(--hw) / 2);
  filter: drop-shadow(0 8px 14px rgb(var(--ink-rgb) / 0.16));
}
/* The menu buttons wear FIXED terrain colours: the attract board behind them walks the seasons,
   and Nic wants the buttons to hold still while it does (the logo still follows the season). */
.hx {
  --fill: #dde3cd;
  --rim: #a9b492;
  appearance: none;
  border: 0;
  margin: 0;
  padding: 0;
  font: inherit;
  color: var(--ink);
  position: relative;
  width: var(--hw);
  height: calc(var(--hw) * 1.1547);
  clip-path: var(--hex);
  background: var(--rim);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.15em;
  cursor: pointer;
  opacity: 0;
  transform: scale(0.8);
  transition: transform 380ms var(--ease), opacity 380ms var(--ease);
}
.hx:nth-child(n+3) { margin-top: calc(var(--hw) * -0.2887 + var(--gap)); translate: calc(var(--hw) / 2 + var(--gap) / 2) 0; }
.hx::before {
  content: '';
  position: absolute;
  inset: 0.32em;
  clip-path: var(--hex);
  background: var(--fill);
  transition: filter var(--dur) var(--ease);
}
.hx > span { position: relative; }
.screen.in .hx { opacity: 1; transform: none; }
.screen.in .hx:nth-child(2) { transition-delay: 60ms; }
.screen.in .hx:nth-child(3) { transition-delay: 120ms; }
.screen.in .hx:nth-child(4) { transition-delay: 180ms; }
.screen.in .hx:hover, .screen.in .hx:focus-visible { transform: scale(1.07); transition-delay: 0ms; }
.hx:hover::before, .hx:focus-visible::before { filter: brightness(1.07) saturate(1.15); }
.hx:active { transform: scale(0.98) !important; transition-duration: 90ms; }
.hx:focus-visible { outline: none; }
.hn { font-family: var(--serif); font-weight: 700; font-size: 1.25em; }
.ht { font-size: 0.66em; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.72; }
.hb { font-size: 0.7em; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--rim); background: rgb(255 255 255 / 0.55); border-radius: 999px; padding: 0.05em 0.6em; margin-top: 0.15em; }
.hx-journey   { --fill: #b9d8ae; --rim: #5b8f5f; }
.hx-quickplay { --fill: #f2dfa4; --rim: #c2a052; }
.hx-hard      { --fill: #e8bda4; --rim: #a8624a; }
.hx-daily     { --fill: #c4dfec; --rim: #5a9fc6; }

/* ---- the all-hex title menu (screens.js devComb; tried in the dev copy, every build since 2026-09-23) ----
   Every hex sits on one lattice: column step --cs, row step --rs (pointy-top hexes interlock
   at three-quarters of their height). A little smaller than the plain menu so five rows fit. */
.comb.comb-dev {
  --hw: 6.3em;
  --cs: calc(var(--hw) + var(--gap));
  --rs: calc(var(--hw) * 1.1547 * 0.75 + var(--gap) * 0.866);
  display: block;
  position: relative;
  padding: 0;
  width: calc(2.5 * var(--cs));
  height: calc((var(--rows) - 1) * var(--rs) + var(--hw) * 1.1547);
}
.comb-dev > .hx, .comb-dev > .hx-slot { position: absolute; margin: 0; translate: none; }
.comb-dev .hx-slot { width: var(--hw); height: calc(var(--hw) * 1.1547); isolation: isolate; }
.comb-dev .hx-slot > .hx { position: absolute; inset: 0; }
/* The slot's stagger delay outranks .hx:hover's reset, so hover waited 240 ms — reset it here. */
/* Hover GROWS by font-size, not transform (Nic, 2026-09-23: blurry while growing). A transform
   transition runs on the compositor, which stretches the hex's cached bitmap and only
   re-rasterises it at the end; every size in a hex is in em (--hw, --in, the text), so
   animating font-size repaints it crisp every frame. Hexes are centred in their slot by
   translate so they grow from the middle. The stagger delay stays on the intro only. */
.comb-dev .hx {
  transition: transform 380ms var(--ease), opacity 380ms var(--ease), font-size 260ms var(--ease);
}
.comb-dev .hx-slot > .hx, .comb-dev .hx-mini > .hx { inset: auto; left: 50%; top: 50%; translate: -50% -50%; }
.screen.in .comb-dev .hx-slot .hx { transition-delay: var(--d, 240ms), var(--d, 240ms), 0ms; }
.screen.in .comb-dev .hx-slot .hx:hover, .screen.in .comb-dev .hx-slot .hx:focus-visible {
  transform: none; font-size: 1.07em; transition-delay: 0ms;
}
.comb-dev .hx-slot .hx:active { transform: none !important; font-size: 0.98em; transition-duration: 90ms; }
/* A slot is a rectangle; its empty corners sat over the neighbouring hexes (Journey under
   Continue) and ate their hover. Only the clipped hex and the open pill take the pointer. */
.comb-dev .hx-slot { pointer-events: none; }
.comb-dev .hx-slot > .hx { pointer-events: auto; }
/* Smaller hexes than the plain menu, so smaller words (6.3 / 7.6). */
.comb-dev .hn { font-size: 1.05em; }
.comb-dev .ht { font-size: 0.55em; letter-spacing: 0.1em; }
.comb-dev .hb { font-size: 0.6em; }
/* Continue 25 % bigger, grown up from its bottom corner; the comb makes room above it. */
.comb.comb-dev.has-save { margin-top: calc(var(--hw) * 1.1547 * 0.25); }
.comb-dev .hx-slot.slot-continue { transform: scale(1.25); transform-origin: 50% 100%; }
.comb-dev .slot-continue .hx-pop { font-size: 0.8em; }
/* Settings + Exit 25 % smaller as one cluster, pinned to the middle of the edge Settings
   shares with Hard (Settings' top-right edge), so they stay hung off Hard. */
.comb-dev .hx-slot.slot-settings { transform: scale(0.75); transform-origin: 75% 12.5%; }
.comb-dev .hx-slot.slot-exit {
  transform: scale(0.75);
  transform-origin: calc(var(--hw) * 0.25 - var(--gap) * 0.5) calc(var(--hw) * 1.1547 * -0.625 - var(--gap) * 0.866);
}
.comb-dev .slot-settings .hx-pop, .comb-dev .slot-exit .hx-pop { font-size: 1.333em; }
/* One rim thickness everywhere: the slots' scale would thicken Continue's rim and thin
   Settings/Exit's, so the inset is divided back out. A soft sheen rides on top of the fill. */
.comb-dev .hx { --in: 0.24em; }
.comb-dev .slot-continue .hx { --in: calc(0.24em / 1.25); }
.comb-dev .slot-settings .hx, .comb-dev .slot-exit .hx { --in: calc(0.24em / 0.75); }
.comb-dev .hx::before { inset: var(--in); }
.comb-dev .hx::after {
  content: '';
  position: absolute;
  inset: var(--in);
  clip-path: var(--hex);
  background: linear-gradient(160deg, rgb(255 255 255 / 0.42) 0%, rgb(255 255 255 / 0.12) 40%, rgb(255 255 255 / 0) 41%, rgb(255 255 255 / 0) 78%, rgb(0 0 0 / 0.05) 100%);
  pointer-events: none;
}
.comb-dev .hx > span { z-index: 1; }
/* The centred confirm card (screens.js confirmBox) sits over the title screen. */
.screen-confirm { z-index: 5; }
.confirm-panel { max-width: 24em; }
.confirm-text { margin: 0.2em 0 0; opacity: 0.75; }
.btn.primary.danger, .btn.primary.danger:hover { background: #a8503c; box-shadow: 0 6px 16px rgb(168 80 60 / 0.26); }
.hx-continue { --fill: #e4d8f0; --rim: #8b6fb3; }
.hx-settings { --fill: #e2e0da; --rim: #9a968b; }
.hx-exit     { --fill: #d3d0c8; --rim: #6f6b62; }
/* A slot whose pill is out rides above its neighbours, so the pill isn't hidden under them. */
.comb-dev .hx-slot:hover { z-index: 3; }
/* No saved game: Continue stays in its place, faded and inert. */
.screen.in .comb-dev .hx-slot .hx.off, .screen.in .comb-dev .hx-slot .hx.off:hover {
  opacity: 0.4; transform: none; font-size: 1em; filter: grayscale(0.85); cursor: default;
}
.comb-dev .hx.off::before { filter: none; }
/* A saved mode's two small option hexes, scaled by --k about the corner they share with the
   big hex (its upper-right one): Continue top-right, New game right. Hidden until the big hex
   is clicked (screens.js adds .open); visibility waits out the fade on close. */
.hx-mini {
  --k: 0.78;
  position: absolute;
  width: var(--hw);
  height: calc(var(--hw) * 1.1547);
  isolation: isolate;
  pointer-events: none;
  visibility: hidden;
  opacity: 0;
  transform: scale(calc(var(--k) * 0.85));
  transition: opacity 180ms var(--ease), transform 240ms var(--ease), visibility 0s linear 180ms;
}
.mini-cont { left: calc(var(--cs) / 2); top: calc(-1 * var(--rs)); transform-origin: 50% 100%; }
/* New game scales about its left-middle, so it sits centred on the big hex's right side (Nic). */
.mini-new  { left: var(--cs); top: 0; transform-origin: 0 50%; }
.comb-dev .hx-slot.open .hx-mini {
  visibility: visible; opacity: 1; transform: scale(var(--k));
  transition: opacity 180ms var(--ease), transform 240ms var(--ease), visibility 0s;
}
.comb-dev .hx-mini > .hx { position: absolute; pointer-events: auto; --in: calc(0.24em / var(--k)); }
.hx-mini .hn { font-size: 1.15em; }
.mini-new .hn { line-height: 1.05; text-align: center; }
.hx-mini .hb { font-size: 0.95em; }
.hx-mini .hx-pop { font-size: calc(1em / var(--k)); }
.comb-dev .hx-slot.open { z-index: 3; }
.comb-dev .slot-mode:not(.has-save) .mini-cont { display: none; }
/* The opened mode hex holds its hover size the whole time its options are out. */
.screen.in .comb-dev .hx-slot.open > .hx { transform: none; font-size: 1.07em; }
/* While a saved mode is open, everything else in the honeycomb fades back. */
.comb-dev > .hx-slot { transition: opacity 220ms var(--ease); }
.comb-dev.dim > .hx-slot:not(.open) { opacity: 0.15; }
/* …and stops taking the pointer: the gaps around the open cluster's option hexes sat over the
   faded hexes, which lit up on hover there. A press on one still closes the cluster (screens.js
   `outside`), it just can't be hovered or clicked through. */
.comb-dev.dim > .hx-slot:not(.open) .hx, .comb-dev.dim > .hx-slot:not(.open) .hx-pop { pointer-events: none; }
/* A mode with a saved run: its tag line turns to the save, in Continue's lavender. */
.comb-dev .hx.saved .ht { color: #6f55a0; opacity: 1; }
/* The piece that slides out from behind a hex's right side (delete save). Hex-ended, not a
   pill (Nic, 2026-09-23): a clip-path, so no box-shadow — a hairline rim instead (::before). */
.hx-pop {
  --pt: 0.8em;                          /* depth of each pointed end (≈ 60° sides) */
  isolation: isolate;
  clip-path: polygon(0 50%, var(--pt) 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, var(--pt) 100%);
  position: absolute;
  left: calc(100% - 1.4em);
  top: 50%;
  z-index: -1;
  display: flex;
  align-items: center;
  gap: 0.35em;
  padding: 0.3em calc(0.3em + var(--pt)) 0.3em 1.8em;
  white-space: nowrap;
  background: rgb(var(--ink-rgb) / 0.2);
  opacity: 0;
  pointer-events: none;
  transform: translate(-1.5em, -50%);
  transition: opacity 200ms var(--ease), transform 300ms var(--ease);
}
.hx-pop::before {
  content: '';
  position: absolute;
  inset: 1.5px;
  z-index: -1;
  clip-path: inherit;
  background: var(--paper);
}
.hx-pop:empty { display: none; }
.hx-slot.reveal:hover > .hx-pop, .hx-slot.reveal:has(> .hx-pop :focus-visible) > .hx-pop,
.hx-mini:hover > .hx-pop, .hx-mini:has(> .hx-pop :focus-visible) > .hx-pop {
  opacity: 1; pointer-events: auto; transform: translate(0, -50%);
}
.pop-del {
  width: 2.2em; min-height: 2.2em; padding: 0;
  color: #a8503c; background: rgb(168 80 60 / 0.1);
}
.pop-del svg { width: 1.2em; height: 1.2em; }
.pop-del:hover { background: rgb(168 80 60 / 0.18); }

/* ---------- leaderboards ---------- */

/* The mode's third option hex (bottom-right): podium over two lines, like New game's. */
.mini-lb { left: calc(var(--cs) / 2); top: var(--rs); transform-origin: 50% 0; }
/* With no save there's no Continue above, so it scales about its upper-left edge's midpoint and
   sits centred on the big hex's lower-right side, like New Game on the right (Nic, 2026-09-23). */
.comb-dev .slot-mode:not(.has-save) .mini-lb { transform-origin: 25% 12.5%; }
.mini-lb .hx { gap: 0.1em; }
.mini-lb svg { position: relative; z-index: 1; width: 2.35em; height: 2.35em; color: var(--rim); }
.mini-lb svg path:first-child { fill: #d9a520; }
.mini-lb .hn { white-space: nowrap; text-align: center; font-size: 0.85em; }

/* The panel wears its mode's colours (--fill / --rim); the tabs flip between the four boards. */
.lb-panel { max-width: 31em; text-align: left; padding: 1.6em 1.9em 1.5em; }
.lb-journey   { --fill: #b9d8ae; --rim: #5b8f5f; }
.lb-quickplay { --fill: #f2dfa4; --rim: #c2a052; }
.lb-hard      { --fill: #e8bda4; --rim: #a8624a; }
.lb-daily     { --fill: #c4dfec; --rim: #5a9fc6; }
.lb-panel > * { transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.screen:not(.in) .lb-panel > * { opacity: 0; transform: translateY(0.35em); }

.lb-head { display: flex; align-items: center; gap: 0.9em; }
.lb-crest {
  flex: none;
  width: 3.1em;
  height: calc(3.1em * 1.1547);
  clip-path: var(--hex);
  background: var(--rim);
  color: var(--rim);
  display: grid;
  place-items: center;
  position: relative;
  transition: background 300ms var(--ease), color 300ms var(--ease);
}
.lb-crest::before { content: ''; position: absolute; inset: 0.26em; clip-path: var(--hex); background: var(--fill); transition: background 300ms var(--ease); }
.lb-crest svg { position: relative; width: 56%; height: 56%; }
.lb-crest svg path:first-child { fill: #d9a520; }
.lb-titles .ptitle { margin: 0; line-height: 1.05; }
.lb-sub { margin: 0.2em 0 0; font-size: 0.72em; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rim); transition: color 300ms var(--ease); }

.lb-tabs { display: flex; gap: 0.3em; margin: 1.1em 0 0.8em; }
.lb-tab {
  --pt: 0.55em;
  flex: 1;
  appearance: none;
  border: 0;
  margin: 0;
  padding: 0.5em var(--pt);
  font: inherit;
  font-size: 0.84em;
  font-weight: 700;
  cursor: pointer;
  color: var(--rim);
  background: var(--rim);
  clip-path: polygon(0 50%, var(--pt) 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, var(--pt) 100%);
  position: relative;
  isolation: isolate;
  transition: color 200ms var(--ease), filter 200ms var(--ease);
}
/* inactive: paper inside a thin rim; active: solid rim with paper text */
.lb-tab::before {
  content: '';
  position: absolute;
  inset: 2px;
  z-index: -1;
  clip-path: inherit;
  background: #fffdf7;
  transition: background 200ms var(--ease);
}
.lb-tab:hover::before { background: var(--fill); }
.lb-tab.on { color: #fffdf7; cursor: default; }
.lb-tab.on::before { background: transparent; }
.lb-tab:focus-visible { outline: none; filter: brightness(1.08) drop-shadow(0 0 0.2em rgb(var(--accent-rgb) / 0.6)); }

.lb-list {
  list-style: none;
  margin: 0;
  padding: 0.35em;
  border-radius: 0.8em;
  background: rgb(var(--ink-rgb) / 0.045);
  box-shadow: inset 0 1px 3px rgb(var(--ink-rgb) / 0.08);
  display: flex;
  flex-direction: column;
  gap: 0.12em;
}
.lb-row {
  display: grid;
  grid-template-columns: 2.1em minmax(0, 1fr) auto 4.6em;
  align-items: center;
  gap: 0.6em;
  min-height: 2.15em;
  padding: 0 0.7em 0 0.35em;
  border-radius: 0.55em;
  font-variant-numeric: tabular-nums;
  animation: lb-in 360ms var(--ease) both;
  animation-delay: calc(var(--i) * 32ms);
}
.lb-row:nth-child(odd) { background: rgb(255 255 255 / 0.55); }
@keyframes lb-in { from { opacity: 0; transform: translateX(-0.5em); } }
.lb-rank {
  justify-self: center;
  width: 1.55em;
  height: calc(1.55em * 1.1547);
  display: grid;
  place-items: center;
  font-size: 0.82em;
  font-weight: 700;
  color: var(--muted);
}
/* the podium: gold, silver, bronze hex medallions */
.lb-row.p1 .lb-rank, .lb-row.p2 .lb-rank, .lb-row.p3 .lb-rank { clip-path: var(--hex); color: #fff; text-shadow: 0 1px 0 rgb(0 0 0 / 0.2); }
.lb-row.p1 .lb-rank { background: linear-gradient(160deg, #f4d36b, #c8931d); }
.lb-row.p2 .lb-rank { background: linear-gradient(160deg, #dfe3e6, #9aa3a9); }
.lb-row.p3 .lb-rank { background: linear-gradient(160deg, #e7b184, #a8683c); }
.lb-row.empty .lb-rank { opacity: 0.35; filter: grayscale(1); }
.lb-who { display: flex; align-items: center; gap: 0.45em; min-width: 0; }
.lb-emb { flex: none; width: 1.3em; text-align: center; }
.lb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.lb-you {
  flex: none;
  font-size: 0.66em;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #fffdf7;
  background: var(--rim);
  border-radius: 999px;
  padding: 0.1em 0.6em;
}
.lb-tiles { font-size: 0.78em; color: var(--muted); }
.lb-score { justify-self: end; font-family: var(--serif); font-weight: 700; font-size: 1.12em; }
.lb-row.p1 .lb-score { color: #a87a12; }
.lb-row.empty .lb-name { color: rgb(var(--ink-rgb) / 0.25); font-weight: 400; }
.lb-row.me { background: color-mix(in srgb, var(--fill) 70%, #fffdf7); box-shadow: inset 0 0 0 2px var(--rim); }
/* loading: the empty rows shimmer; offline: they just sit dim */
.lb-list.loading .lb-row.empty .lb-name {
  color: transparent;
  width: 62%;
  height: 0.7em;
  border-radius: 999px;
  background: linear-gradient(90deg, rgb(var(--ink-rgb) / 0.07) 20%, rgb(var(--ink-rgb) / 0.14) 50%, rgb(var(--ink-rgb) / 0.07) 80%) 0 0 / 200% 100%;
  animation: lb-shimmer 1.2s linear infinite;
}
.lb-list.loading .lb-row.empty:nth-child(3n+2) .lb-name { width: 48%; }
.lb-list.loading .lb-row.empty:nth-child(3n) .lb-name { width: 70%; }
@keyframes lb-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.lb-list.off .lb-row { opacity: 0.55; }

.lb-me {
  display: flex;
  align-items: baseline;
  gap: 0.6em;
  margin-top: 0.7em;
  padding: 0.6em 0.9em;
  border-radius: 0.7em;
  border: 1.5px dashed color-mix(in srgb, var(--rim) 55%, transparent);
  min-height: 1.3em;
}
.lb-me:empty { display: none; }
.lb-me-l { font-size: 0.86em; color: var(--muted); }
.lb-me-r { font-weight: 700; color: var(--rim); }
.lb-me-s { margin-left: auto; font-family: var(--serif); font-weight: 700; font-size: 1.2em; }

.lb-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 0.8em; }
.lb-status { display: inline-flex; align-items: center; gap: 0.5em; font-size: 0.78em; font-weight: 600; color: var(--muted); }
.lb-status::before { content: ''; width: 0.55em; height: 0.55em; border-radius: 50%; background: currentColor; }
.lb-status.live { color: var(--hg-match); }
.lb-status.live::before { animation: lb-pulse 2.2s ease-in-out infinite; }
.lb-status.sync { color: #b98a24; }
.lb-status.sync::before { animation: lb-pulse 0.8s ease-in-out infinite; }
.lb-status.fail { color: #a8503c; }
@keyframes lb-pulse { 50% { opacity: 0.3; transform: scale(0.7); } }
.lb-refresh { width: 2.2em; min-height: 2.2em; padding: 0; }
.lb-refresh svg { width: 1.05em; height: 1.05em; }
.lb-refresh:hover svg { transform: rotate(120deg); transition: transform 400ms var(--ease); }
.lb-refresh:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
.lb-panel .row { margin-top: 1em; }

/* the summary's "Global rank #N", arriving after the post lands */
.lb-rankline {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4em;
  margin: 0.2em 0 0;
  color: #a87a12;
  font-weight: 600;
}
.lb-rankline svg { width: 1.2em; height: 1.2em; }
.lb-rankline b { font-family: var(--serif); font-size: 1.25em; }
.lb-rankline.in { animation: lb-rank 520ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes lb-rank { from { opacity: 0; transform: scale(0.7); } }

@media (max-width: 760px) {
  #app.attract #board { transform: none; }
  .screen-title { justify-content: center; padding-left: 3vw; background: rgb(var(--bg-rgb) / 0.7); }
  .title-col { align-items: center; text-align: center; }
}

/* settings: two volume sliders, label · range · readout on one line */
.settings-panel { max-width: 26em; }
.set-list { display: flex; flex-direction: column; gap: 1em; margin: 1.2em 0 0.4em; }
.set-row { display: grid; grid-template-columns: 7.5em 1fr 3em; align-items: center; gap: 0.8em; text-align: left; }
.set-lab { font-weight: 600; }
.set-val { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; font-size: 0.92em; }
.set-range { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
.set-range:focus-visible { outline: 3px solid rgb(var(--accent-rgb) / 0.45); outline-offset: 4px; border-radius: 999px; }

.set-h { margin: 1.5em 0 0.6em; font-size: 0.72em; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); text-align: left; }
.set-controls { display: grid; grid-template-columns: 7.5em 1fr; gap: 0.55em 0.8em; margin: 0; text-align: left; font-size: 0.92em; }
.set-controls dt { font-weight: 600; }
.set-controls dd { margin: 0; color: var(--muted); }
.set-controls kbd { font: inherit; font-size: 0.85em; font-weight: 600; color: var(--ink); background: rgb(var(--ink-rgb) / 0.07); border-radius: 0.35em; padding: 0.05em 0.45em; box-shadow: inset 0 -1px 0 rgb(var(--ink-rgb) / 0.12); }

.row { display: flex; gap: 0.6em; justify-content: center; flex-wrap: wrap; margin-top: 1.4em; }
.row.alt { margin-top: 0.5em; }
.pause-stack { flex-direction: column; align-items: center; }
.pause-stack .btn { min-width: 11em; }

/* Every popup's buttons are hex-ended, like the title's hexes (Nic, 2026-09-23). It's a
   clip-path, so no shadow and no outline: the rim is the button's background and the face a
   ::before inset over it (the leaderboard tabs do the same); focus lights the rim instead. */
.panel .btn {
  --pt: 0.75em;
  --face: #f4f0e4;
  position: relative;
  isolation: isolate;
  border-radius: 0;
  clip-path: polygon(0 50%, var(--pt) 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, var(--pt) 100%);
  padding-left: calc(1em + var(--pt));
  padding-right: calc(1em + var(--pt));
  background: #cfc8b3;
  box-shadow: none;
}
.panel .btn::before {
  content: '';
  position: absolute;
  inset: 2px;
  z-index: -1;
  clip-path: inherit;
  background: var(--face);
  transition: background var(--dur) var(--ease), filter var(--dur) var(--ease);
}
.panel .btn:hover { background: #b9b19a; box-shadow: none; }
.panel .btn:hover::before { background: #fbf8ef; }
.panel .btn:focus-visible { outline: none; background: var(--accent); }
.panel .btn.primary { --face: var(--accent); background: color-mix(in srgb, var(--accent) 72%, #000); color: #fff; }
.panel .btn.primary:hover::before { background: var(--face); filter: brightness(1.07) saturate(1.1); }
.panel .btn.primary:focus-visible { background: #fffdf7; }
.panel .btn.primary.danger { --face: #a8503c; background: #7e3727; }
.lb-panel .btn.primary { --face: var(--rim); background: color-mix(in srgb, var(--rim) 72%, #000); }
.panel .btn.ghost { background: transparent; --face: transparent; }
.panel .btn.ghost:hover { background: rgb(var(--ink-rgb) / 0.12); }
.panel .btn.ghost:hover::before { background: #fbf8ef; }
/* the icon-only refresh is a small pointy-top hex */
.panel .btn.lb-refresh { clip-path: var(--hex); width: 2.3em; height: 2.66em; padding: 0; }
.panel .btn.lb-refresh::before { inset: 1.5px; }

/* ---------- run summary ---------- */

/* Wider than the other two: it carries a picture and six stats side by side. Still em-based,
   so at 1024 wide it is ~590 px and at 1920 ~760 px — it never reaches the window edge. */
.summary-panel { max-width: 44em; }

.final { display: flex; flex-direction: column; align-items: center; gap: 0.1em; margin: 0.6em 0 1.2em; }
.final .fv { font-family: var(--serif); font-size: 3.4em; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.final .fl { color: var(--muted); font-size: 0.85em; letter-spacing: 0.06em; text-transform: uppercase; }

.sum-body {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  align-items: start;
  gap: 0.9em;
}
/* The landscape you built, drawn at fit-zoom with the static Renderer.drawTile. The well takes
   the picture's own size (both set in JS from the board's aspect), so a tall landscape and a
   wide one are both framed rather than letterboxed. */
.shot {
  background: rgb(var(--ink-rgb) / 0.04);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  justify-self: center;
  align-self: center;
  line-height: 0;
  min-height: 4em;
}
.shot canvas { display: block; }
.shot.blank { opacity: 0.35; }        /* no renderer, or an empty board — show the well, not a hole */

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.5em;
  align-content: start;
}
.stat {
  background: rgb(var(--ink-rgb) / 0.05);
  border-radius: 12px;
  padding: 0.6em 0.5em;
  display: flex;
  flex-direction: column;
  gap: 0.05em;
  min-width: 0;
}
.stat .sv { font-family: var(--serif); font-size: 1.4em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .sl { font-size: 0.72em; color: var(--muted); line-height: 1.25; }
.stat .ss { font-size: 0.66em; color: var(--muted); opacity: 0.8; line-height: 1.2; }
/* the daily's one extra line, between the stats and the meta */
.daily-note { margin: 0.9em 0 0; font-size: 0.92em; color: var(--muted); }
.daily-note.best { color: var(--accent); font-weight: 700; letter-spacing: 0.01em; }

.meta { margin: 1.1em 0 0; color: var(--muted); font-size: 0.85em; }
.meta .mode { text-transform: capitalize; font-weight: 600; color: var(--ink); }
.meta .seed { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink);
              -webkit-user-select: text; user-select: text; }

/* Short windows (720p with the browser chrome) — drop the picture's share and tighten up
   rather than letting the panel scroll. */
@media (max-height: 760px) {
  .panel { padding: 1.5em 1.9em; }
  .final { margin: 0.4em 0 0.9em; }
  .final .fv { font-size: 2.7em; }
  .shot { min-height: 5em; }
}

@media (max-width: 620px) {
  .panel { padding: 1.5em 1.3em; }
  .sum-body { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- dev copy: the bottom bar (ui/devbar.js, HG.FLAGS.devbar only) ---------- */

/* Deliberately NOT the game's look: a dark monospace strip, so a screenshot of the dev copy can
   never be mistaken for the game. devbar.js writes --devbar-h on #app and the HUD's bottom row
   steps up by exactly that much. */
.devbar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 4px 14px;
  padding: 5px 10px;
  max-height: 40vh;
  overflow-y: auto;
  background: rgb(34 32 28 / 0.9);
  box-shadow: 0 -1px 0 rgb(255 255 255 / 0.06), 0 -4px 14px rgb(0 0 0 / 0.18);
  font: 11px/1.2 ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  color: #d8d2c2;
}
.devbar[hidden] { display: none; }
.db-group { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; }
.db-h {
  margin-right: 3px;
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #8f8878;
}
.db-chip {
  appearance: none;
  margin: 0;
  font: inherit;
  color: inherit;
  background: rgb(255 255 255 / 0.07);
  border: 1px solid rgb(255 255 255 / 0.1);
  border-radius: 4px;
  padding: 3px 7px;
  white-space: nowrap;
  cursor: pointer;
}
.db-chip:hover { background: rgb(255 255 255 / 0.16); color: #fff; }
.db-chip.on { background: #3f8f63; border-color: #5fb485; color: #fff; }
.db-chip.picked { background: #c2a052; border-color: #e0c27a; color: #231f18; }
#app.devbar-on .hud-tray { bottom: calc(0.9em + var(--devbar-h, 0px)); }
#app.devbar-on .hud-tools { bottom: calc(1.2em + var(--devbar-h, 0px)); }

@media (prefers-reduced-motion: reduce) {
  /* The delay matters as much as the duration: without this the staggered panel contents
     would still arrive up to 195 ms late for someone who asked for no motion at all. */
  * { transition-duration: 1ms !important; transition-delay: 0ms !important; }
  .season-label { transition-duration: 1ms !important; }
  .season-label *, .hud-almanac, .hud-almanac * { animation-duration: 1ms !important; animation-delay: 0ms !important; }
  .hud-drift { display: none; }
  .qslot canvas, .co-k svg { animation: none !important; }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="board"></canvas>
  <div id="hud"></div>

/* ===== core/rng.js ===== */
/* Hedgerows — seeded RNG (mulberry32). All core randomness goes through s.rng. */
(function (HG) {
  'use strict';

  HG.hashString = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  };

  HG.makeRng = function (seed) {
    let a = (typeof seed === 'string' ? HG.hashString(seed) : (seed >>> 0)) || 0x9e3779b9;
    const rng = {
      seed: a,
      next() {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      range(lo, hi) { return lo + (hi - lo) * rng.next(); },
      int(lo, hi) { return lo + Math.floor(rng.next() * (hi - lo + 1)); }, // inclusive
      pick(arr) { return arr.length ? arr[Math.floor(rng.next() * arr.length)] : undefined; },
      chance(p) { return rng.next() < p; },
      shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(rng.next() * (i + 1));
          const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      },
      fork(label) { return HG.makeRng((a ^ HG.hashString(String(label))) >>> 0); },
      /** Internal state, for snapshot/restore (cloneState, harnesses that scrub time). */
      get state() { return a; },
      set state(v) { a = v >>> 0; },
    };
    return rng;
  };
})(globalThis.HG = globalThis.HG || {});


/* ===== core/hex.js ===== */
/*
 * Hedgerows — pointy-top hex grid, axial coordinates (q, r). Screen y grows downward.
 *
 * Directions 0..5, EAST FIRST, CLOCKWISE:  0=E 1=SE 2=SW 3=W 4=NW 5=NE
 * Edge d of hex A touches edge opp(d) of A's neighbour in direction d. That is the ONLY
 * adjacency rule in the game — every other module goes through it.
 *
 * Geometry is defined here (not in the renderer) so the placement preview, the input
 * hit-test and the drawn tile can never disagree: corner i sits at 60·i − 30 degrees, so
 * edge d runs from corner d to corner d+1 and its midpoint is at angle 60·d.
 */
(function (HG) {
  'use strict';

  const SQRT3 = Math.sqrt(3);
  const Hex = {};
  HG.Hex = Hex;

  Hex.DIRS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];

  Hex.opp = function (d) { return (d + 3) % 6; };

  Hex.key = function (q, r) { return q + ',' + r; };

  Hex.parse = function (key) {
    const i = key.indexOf(',');
    return [+key.slice(0, i), +key.slice(i + 1)];
  };

  Hex.neighbor = function (q, r, d) {
    const v = Hex.DIRS[d];
    return [q + v[0], r + v[1]];
  };

  Hex.neighbors = function (q, r) {
    const out = new Array(6);
    for (let d = 0; d < 6; d++) out[d] = [q + Hex.DIRS[d][0], r + Hex.DIRS[d][1]];
    return out;
  };

  Hex.distance = function (q1, r1, q2, r2) {
    const dq = q1 - q2, dr = r1 - r2;
    return (Math.abs(dq) + Math.abs(dq + dr) + Math.abs(dr)) / 2;
  };

  // --- pixels (size = centre-to-corner) -----------------------------------

  Hex.toPixel = function (q, r, size) {
    return { x: size * (SQRT3 * q + SQRT3 / 2 * r), y: size * 1.5 * r };
  };

  Hex.fromPixel = function (x, y, size) {
    const r = (2 / 3) * y / size;
    const q = (SQRT3 / 3) * x / size - r / 2;
    return Hex.round(q, r);
  };

  /** Cube rounding of fractional axial coords → integer [q, r]. */
  Hex.round = function (qf, rf) {
    const xf = qf, zf = rf, yf = -qf - rf;
    let rx = Math.round(xf), ry = Math.round(yf), rz = Math.round(zf);
    const dx = Math.abs(rx - xf), dy = Math.abs(ry - yf), dz = Math.abs(rz - zf);
    if (dx > dy && dx > dz) rx = -ry - rz;
    else if (dy > dz) ry = -rx - rz;
    else rz = -rx - ry;
    return [rx, rz];
  };

  Hex.corner = function (cx, cy, size, i) {
    const a = Math.PI / 180 * (60 * i - 30);
    return { x: cx + size * Math.cos(a), y: cy + size * Math.sin(a) };
  };

  /** Midpoint of edge d — angle 60·d, distance size·√3/2 from the centre. */
  Hex.edgeMid = function (cx, cy, size, d) {
    const a = Math.PI / 180 * (60 * d);
    const rad = size * SQRT3 / 2;
    return { x: cx + rad * Math.cos(a), y: cy + rad * Math.sin(a) };
  };
})(globalThis.HG = globalThis.HG || {});

      id: 'autumn', name: 'Autumn', bg: '#f5ecdb', seam: '#fffaee', stubble: true, leaves: true,
      tone: '#c9602a',
      pal: [
        ['#dcd6b0', '#aa9f78', '#d27a3a'],   // plain — dry grass, fallen leaves
        ['#f0e2b6', '#c1a262', '#d9b55f'],   // field — PALE cut stubble and round bales
        ['#eeaa72', '#c0521f', '#e8b64a'],   // forest — russet and orange, clear of the stubble
        ['#dfb49e', '#9c5a44', '#79432f'],
        ['#bad6e4', '#4b8cb3', '#35718f'],   // water — colder
        ['#cfccc2', '#302f2b', '#b0aca0'],
      ],
    },
    {
      id: 'winter', name: 'Winter', bg: '#eeeee6', seam: '#ffffff', snow: true,
      tone: '#4a93c8',
      pal: [
        ['#e6eff3', '#9fb8c8', '#ffffff'],   // plain — blue-white snow, drifts
        ['#efd9a8', '#b8995a', '#f5e6c4'],   // field — golden straw through the frost
        ['#b3d6c2', '#2e6e4e', '#ffffff'],   // forest — deep evergreen under snow caps
        ['#eab4a2', '#a8503c', '#6f3a2c'],   // village — warm brick, lamplit windows
        ['#c6e6f2', '#5aa9cf', '#9fcde2'],   // water — bright ice
        ['#d9d7d0', '#3a3935', '#c0bdb2'],
      ],
    },
  ];
  Renderer.SEASONS = SEASONS;

  function seasonIdx(i) { return ((i | 0) % SEASONS.length + SEASONS.length) % SEASONS.length; }

  /**
   * The title's attract board keeps its own year (main.js sets this while it runs, null otherwise):
   * `{ every, offset, fade }` — seasons of `every` placements, `offset` added to s.placed so the
   * cycle carries on across the board's restarts, and `fade` seconds for the sweep.
   */
  Renderer.seasonClock = null;

  /** Which season a run is in, from its placement count alone. */
  Renderer.seasonOf = function (s) {
    // Dev copy only (src/ui/devbar.js): a pinned season wins over the placement count.
    if (typeof Renderer.seasonOverride === 'number' && Renderer.seasonOverride >= 0) return seasonIdx(Renderer.seasonOverride);
    const clk = Renderer.seasonClock;
    const every = clk && clk.every > 0 ? clk.every : Renderer.CFG.SEASON_EVERY > 0 ? Renderer.CFG.SEASON_EVERY : 15;
    const n = ((s && s.placed) | 0) + (clk ? clk.offset | 0 : 0);
    return seasonIdx(Math.floor(n / every));
  };

  /** A plain `{ [terrain]: { fill, ink, accent } }` for season `i` — a copy, not the live one. */
  Renderer.paletteFor = function (i) {
    const sn = SEASONS[seasonIdx(i)];

    for (let t = 0; t < 6; t++) out[t] = { fill: sn.pal[t][0], ink: sn.pal[t][1], accent: sn.pal[t][2] };
    return out;
  };

  /** Same colours as CSS custom properties, so style.css can mirror the board exactly. */
  Renderer.cssVarsFor = function (i) {
    const sn = SEASONS[seasonIdx(i)];
    const p = sn.pal;
    return {
      '--hg-bg': sn.bg,
      '--hg-seam': sn.seam,
      '--hg-season': sn.tone,
      '--hg-text': TEXT,
      '--hg-frontier': FRONTIER,
      '--hg-match': MARK_MATCH,
      '--hg-neutral': MARK_NEUTRAL,
      '--hg-scar': MARK_SCAR,
      '--hg-plain': p[T.PLAIN][0], '--hg-plain-ink': p[T.PLAIN][1],
      '--hg-field': p[T.FIELD][0], '--hg-field-ink': p[T.FIELD][1],
      '--hg-forest': p[T.FOREST][0], '--hg-forest-ink': p[T.FOREST][1],
      '--hg-village': p[T.VILLAGE][0], '--hg-village-ink': p[T.VILLAGE][1],
      '--hg-water': p[T.WATER][0], '--hg-water-ink': p[T.WATER][1],
      '--hg-rail': p[T.RAIL][0], '--hg-rail-ink': p[T.RAIL][1],
    };
  };

  Renderer.CSS_VARS = Renderer.cssVarsFor(0);

  /** The live season. `Renderer.season` is the index; each R instance mirrors it as `R.season`. */
  Renderer.season = -1;
  Renderer.SEASON = SEASONS[0];

  /**
   * Switch the live palette. Mutates PALETTE's entries and Renderer.CSS_VARS IN PLACE — every
   * other module took its reference at boot and must keep seeing the current season through it.
   */
  Renderer.applySeason = function (i) {
    const k = seasonIdx(i);
    const sn = SEASONS[k];
    for (let t = 0; t < 6; t++) {
      PALETTE[t].fill = sn.pal[t][0];
      PALETTE[t].ink = sn.pal[t][1];
      PALETTE[t].accent = sn.pal[t][2];
    }
    BG = sn.bg;
    SEAM = sn.seam;
    Renderer.season = k;
    Renderer.SEASON = sn;
    const vars = Renderer.cssVarsFor(k);
    Object.keys(vars).forEach(function (n) { Renderer.CSS_VARS[n] = vars[n]; });

  };
  Renderer.applySeason(0);

  // ---------------------------------------------------------------- colour maths

  function hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function toHex(r, g, b) {
    return '#' + (((1 << 24) + (r << 16) + (g << 8) + b) | 0).toString(16).slice(1);
  }
  const mixCache = new Map();
  /** Mix toward white (amt > 0) or black (amt < 0). Memoised — these are a fixed small set. */
  function shade(col, amt) {
    const k = col + '|' + amt;
    let out = mixCache.get(k);
    if (out) return out;
    const c = hexToRgb(col);
    const to = amt >= 0 ? 255 : 0, a = Math.abs(amt);
    out = toHex(
      Math.round(c[0] + (to - c[0]) * a),
      Math.round(c[1] + (to - c[1]) * a),
      Math.round(c[2] + (to - c[2]) * a));
    mixCache.set(k, out);
    return out;
  }

  // ---------------------------------------------------------------- stable hashing

  /** 32-bit avalanche of three ints. The whole art layer's randomness comes from here. */
  function hash32(a, b, c) {
    let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2246822519);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }
  /** A stable 0..1 from (seed, a, b). */
  function rnd(seed, a, b) { return hash32(seed, a, b) / 4294967296; }

  /** Cell seed. Every decoration in a hex hangs off this, so (q, r) fixes the art forever. */
  function cellSeed(q, r) { return hash32(q, r, 0x9e37); }

  /** Fallback seed for a tile with no board position (the HUD queue, the harness rows). */
  function edgeSeed(edges) {
    let h = 7;
    for (let d = 0; d < 6; d++) h = hash32(h, edges[d], d);
    return h;
  }

  // ---------------------------------------------------------------- hex geometry

  function corner(cx, cy, size, i) {
    const a = (60 * i - 30) * DEG;
    return { x: cx + size * Math.cos(a), y: cy + size * Math.sin(a) };
  }
  function edgeMid(cx, cy, size, d) {
    const a = 60 * d * DEG, rad = size * SQRT3 / 2;
    return { x: cx + rad * Math.cos(a), y: cy + rad * Math.sin(a) };
  }

  function hexPath(ctx, cx, cy, size) {
    ctx.beginPath();
    let p = corner(cx, cy, size, 0);
    ctx.moveTo(p.x, p.y);
    for (let i = 1; i < 6; i++) { p = corner(cx, cy, size, i); ctx.lineTo(p.x, p.y); }
    ctx.closePath();
  }

  /** Wedge polygon for the run of `len` edges starting at direction `start`. One contour. */
  function wedgePath(ctx, cx, cy, size, start, len) {
    ctx.beginPath();
    if (len >= 6) {
      let p = corner(cx, cy, size, 0);
      ctx.moveTo(p.x, p.y);
      for (let i = 1; i < 6; i++) { p = corner(cx, cy, size, i); ctx.lineTo(p.x, p.y); }
    } else {
      ctx.moveTo(cx, cy);
      for (let i = 0; i <= len; i++) { const p = corner(cx, cy, size, start + i); ctx.lineTo(p.x, p.y); }
    }
    ctx.closePath();
  }

  /**
   * Contiguous same-terrain runs around the ring, as [{ t, start, len }]. Merging them is what
   * removes the internal seams: two adjacent FOREST wedges become one polygon, not two.
   */
  function runsOf(edges) {
    let start = -1;
    for (let d = 0; d < 6; d++) if (edges[d] !== edges[(d + 5) % 6]) { start = d; break; }
    if (start < 0) return [{ t: edges[0], start: 0, len: 6 }];
    const out = [];
    let d = start, seen = 0;
    while (seen < 6) {
      const t = edges[d % 6];
      let len = 0;
      while (len < 6 - seen && edges[(d + len) % 6] === t) len++;
      out.push({ t: t, start: d % 6, len: len });
      d += len; seen += len;
    }
    return out;
  }

  /** Directions carrying terrain `t`. */
  function dirsOf(edges, t) {
    const out = [];
    for (let d = 0; d < 6; d++) if (edges[d] === t) out.push(d);
    return out;
  }

  // ---------------------------------------------------------------- terrain art
  //
  // Each of these is called once per cell per cache build. Positions come from `seed`, so the
  // same hex draws the same art every time, in every context.

  /** A point inside the wedge: uniform angle across the run's sector, radius 0.22..0.58 size. */
  function inWedge(cx, cy, size, run, seed, i) {
    const a0 = (60 * run.start - 30), a1 = (60 * (run.start + run.len - 1) + 30);
    const inset = Math.min(14, (a1 - a0) * 0.18);   // keep marks off the wedge's own borders
    const ang = (a0 + inset + (a1 - a0 - 2 * inset) * rnd(seed, run.start * 7 + i, 11)) * DEG;
    const rad = size * (0.22 + 0.36 * rnd(seed, run.start * 7 + i, 23));
    return { x: cx + rad * Math.cos(ang), y: cy + rad * Math.sin(ang) };
  }

  // ---------------------------------------------------------------- where marks stand
  //
  // Nic's wave-5 play-test, from one close-up: houses sitting across a wedge border ("over the
  // red line"), houses overlapping each other, and the trees of one wedge in a single clump.
  // The old placement was one hashed point per mark inside the wedge's angular span — which
  // knows nothing about the mark's own size, the wedge's borders, the hex edge, the river
  // running through the tile, or any other mark.
  //
  // So marks are now PLACED before anything is drawn, by hashed rejection sampling. A
  // candidate must sit fully inside its own wedge (its radius clear of both radial borders and
  // of the hex's outer boundary), clear of any river/railway, and clear of every mark already
  // accepted. MARK.TRIES candidates per mark; if none fit, the mark is simply dropped — a
  // sparser hex reads far better than a stacked one. Every draw of a cell runs the same
  // hashes in the same order, so the result is still identical on every call.

  const MARK = {
    BORDER: 0.05,    // clearance from a wedge's two radial borders, in hex sizes
    EDGE: 0.05,      // clearance from the hex's outer boundary
    GAP: 0.03,       // clearance between two marks that must not touch
    COPSE: 0.88,     // trees may close to this fraction of touching — a copse, not a stack
    LINE: 0.15,      // half-width kept clear either side of a river / railway centre line
    TRIES: 10,
  };

  /** Distance from the hex centre to its boundary in direction `ang` (radians). */
  function hexReach(size, ang) {
    let th = ang % (60 * DEG);
    if (th < 0) th += 60 * DEG;
    if (th > 30 * DEG) th -= 60 * DEG;
    return size * SQRT3 / 2 / Math.cos(th);
  }

  /** Nearest approach from (x, y) to a set of quadratic segments, sampled along each. */
  function lineGap(segs, x, y) {
    let best = Infinity;
    for (let i = 0; i < segs.length; i++) {
      for (let j = 0; j <= 6; j++) {
        const p = segAt(segs[i], j / 6);
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < best) best = d;
      }
    }
    return best;
  }

  /** One mark's position, or null when nothing fits. `rad` is the mark's bounding radius. */
  function placeMark(cx, cy, size, run, seed, idx, type, rad, others, lines) {
    const full = run.len >= 6;
    const a0 = (60 * run.start - 30) * DEG;
    const a1 = (60 * (run.start + run.len - 1) + 30) * DEG;
    const border = rad + size * MARK.BORDER;
    const edge = rad + size * MARK.EDGE;
    for (let k = 0; k < MARK.TRIES; k++) {
      const u = rnd(seed, run.start * 97 + idx, 401 + k * 17);
      const v = rnd(seed, run.start * 97 + idx, 601 + k * 23);
      const ang = a0 + (a1 - a0) * v;
      // Clearance from a radial border is r·sin(angle to it), so a BIGGER radius is safer —
      // which is why the angle is drawn first and the radius band follows from it.
      const dB = full ? Math.PI : Math.min(ang - a0, a1 - ang);
      let rMin = rad + size * MARK.BORDER * 0.5;
      if (!full && dB < Math.PI / 2) {
        if (Math.sin(dB) <= 1e-6) continue;
        rMin = Math.max(rMin, border / Math.sin(dB));
      }
      const rMax = hexReach(size, ang) - edge;
      if (rMax <= rMin) continue;
      // area-uniform within the band, so marks do not bunch toward the hex centre
      const r = Math.sqrt(rMin * rMin + u * (rMax * rMax - rMin * rMin));
      const x = cx + r * Math.cos(ang), y = cy + r * Math.sin(ang);
      let clash = false;
      for (let j = 0; j < lines.length && !clash; j++) {
        if (lineGap(lines[j], x, y) < rad + size * MARK.LINE) clash = true;
      }
      for (let j = 0; j < others.length && !clash; j++) {
        const o = others[j];
        const need = (type === 'tree' && o.type === 'tree')
          ? (rad + o.r) * MARK.COPSE
          : (rad + o.r) + size * MARK.GAP;
        if (Math.hypot(o.x - x, o.y - y) < need) clash = true;
      }
      if (clash) continue;
      return { type: type, x: x, y: y, r: rad };
    }
    return null;
  }

  /**
   * Every standing mark on a tile, as ONE list sorted by screen y — which is the whole point:
   * the tile is painted back to front, so a house in front of a tree covers the tree and never
   * the other way round. The landmark's disc is in the list too (at the tile centre), both as
   * an obstacle nothing may be placed under and as something that sorts with everything else.
   *
   * `geom.chimneys` calls this, so smoke always rises from the houses that were actually drawn.
   */
  function buildMarks(cx, cy, size, edges, seed, landmark, fine) {
    const out = [];
    let foot = 0;
    if (landmark && LANDMARKS[landmark]) {
      if (LM_LAYOUT[landmark]) {
        // A mixed-tile landmark stands on ITS part of the tile, so its disc sits there (and
        // sorts from there); any second building / wheel / woodpile is a footprint obstacle,
        // pushed as type 'foot' and filtered out again below — scatter marks keep off it, but
        // nobody draws it or checks it as a mark.
        const pl = lmPlan(landmark, edges);
        const m = pl.main;
        out.push({ type: 'landmark', kind: landmark, x: cx + m.x * size, y: cy + m.y * size, r: m.r * size });
        if (fine) {
          for (let i = 0; i < pl.foot.length; i++) {
            const f = pl.foot[i];
            out.push({ type: 'foot', x: cx + f.x * size, y: cy + f.y * size, r: f.r * size });
            foot++;
          }
        }
      } else {
        out.push({ type: 'landmark', kind: landmark, x: cx, y: cy, r: size * LM.R });
      }
    }
    if (!fine) return out;

    const lines = [];
    const wd = dirsOf(edges, T.WATER);
    if (wd.length) lines.push(lineSegs(cx, cy, size, wd));
    const rd = dirsOf(edges, T.RAIL);
    if (rd.length) lines.push(lineSegs(cx, cy, size, rd));

    const runs = runsOf(edges);
    for (let i = 0; i < runs.length; i++) {
      const run = runs[i];
      const narrow = run.len <= 1;                 // a single-edge wedge is a 60° pie slice
      if (run.t === T.FOREST) {
