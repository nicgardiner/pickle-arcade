    ctx.beginPath();                                       // three stripes, one fill
    for (let i = 0; i < 5; i += 2) {
      const p = q(i / 5, (i + 1) / 5);
      ctx.moveTo(cx + p[0] * z, cy + p[1] * z);
      for (let j = 2; j < 8; j += 2) ctx.lineTo(cx + p[j] * z, cy + p[j + 1] * z);
      ctx.closePath();
    }
    ctx.fillStyle = col; ctx.fill();
    if (snow) fillPoly(ctx, cx, cy, z, [x - hw * 0.9, at, x + hw * 0.9, at, x + hw * 0.96, at + 0.035, x - hw * 0.96, at + 0.035], LM.snow);
    ctx.beginPath();
    const n = 5, x0 = x - hw * 1.12, sw = w * 1.12 / n;
    for (let i = 0; i < n; i++) {
      const mx = X(x0 + sw * (i + 0.5));
      ctx.moveTo(mx + sw * 0.5 * z, Y(ab)); ctx.arc(mx, Y(ab), sw * 0.5 * z, 0, Math.PI);
    }
    ctx.fillStyle = col; ctx.fill();
  }

  function drawMarket(ctx, cx, cy, z, fine, sails, snow) {
    const X = (u) => cx + u * z, Y = (v) => cy + v * z;
    const mp = MARKET_POLE;
    const items = [];
    for (let i = 0; i < MARKET_STALLS.length; i++) items.push({ y: MARKET_STALLS[i][1], s: MARKET_STALLS[i] });
    items.push({ y: mp[1], pole: mp, may: true });
    for (let i = 0; i < MARKET_SIDE.length; i++) items.push({ y: MARKET_SIDE[i][1], pole: MARKET_SIDE[i] });
    items.sort(function (a, b) { return a.y - b.y; });
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.s) {
        about(ctx, cx, cy, z, it.s[0], it.s[1], MARKET_A);
        drawStall(ctx, cx, cy, z, it.s[0], it.s[1], it.s[2], it.s[3], fine, snow);
        ctx.restore();
        continue;
      }
      const p = it.pole, w = it.may ? 0.024 : 0.016;
      ctx.fillStyle = fine ? (it.may ? LMC.cream : LM.timber) : LM.ink;
      ctx.fillRect(X(p[0] - w / 2), Y(p[1] - p[2]), w * z, p[2] * z);
      if (!fine) continue;
      if (it.may) {
        // red ribbon wound down the maypole, a gold finial, and a garland at the top
        ctx.strokeStyle = LMC.red; ctx.lineWidth = 0.012 * z; ctx.lineCap = 'butt';
        ctx.beginPath();
        for (let j = 0; j < 5; j++) {
          const y0 = p[1] - p[2] + 0.06 + j * 0.085;
          ctx.moveTo(X(p[0] - w / 2), Y(y0 + 0.03)); ctx.lineTo(X(p[0] + w / 2), Y(y0));
        }
        ctx.stroke();
        fillEllipse(ctx, X(p[0]), Y(p[1] - p[2] + 0.05), 0.05 * z, 0.018 * z, LM.yewLit);
        ctx.fillStyle = LM.gold;
        ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1] - p[2]), 0.022 * z, 0, TAU); ctx.fill();
      }
    }
    if (fine && sails) {
      const a = marketBunting(cx, cy, z);
      for (let i = 0; i < a.length; i++) drawBunting(ctx, a[i], z, 0);
    }
  }
  function marketBunting(cx, cy, z) {
    const mp = MARKET_POLE, out = [];
    for (let i = 0; i < MARKET_SIDE.length; i++) {
      const p = MARKET_SIDE[i];
      out.push({ x0: cx + p[0] * z, y0: cy + (p[1] - p[2]) * z, x1: cx + mp[0] * z, y1: cy + (mp[1] - mp[2] + 0.02) * z });
    }
    return out;
  }

  // The abbey: a broken arcade along the back, a gable end with three lancets, fallen stones.
  const ABBEY_PIERS = [[-0.40, 0.40], [-0.22, 0.31], [-0.04, 0.2]];    // [x, height], foot y = -0.02
  const ABBEY_GABLE = [0.08, 0.16, 0.40];                              // x0, foot y, x1
  const ABBEY_CROWS = { x: 0.08, y: -0.58, r: 0.2 };                  // design units, like the rest
  const ABBEY_A = 1.3, ABBEY_OY = 0.12;                                // drawn ×A about (0, OY)

  function drawAbbey(ctx, cx, cy, z, fine, sails, snow) {
    const a0 = ctx.globalAlpha;
    const X = (u) => cx + u * z, Y = (v) => cy + v * z;
    const py = -0.02, pw = 0.066;
    const g = ABBEY_GABLE, gx = (g[0] + g[2]) / 2, gy = g[1];
    const gable = [g[0], gy, g[0], gy - 0.36, g[0] + 0.07, gy - 0.5, g[0] + 0.1, gy - 0.45,
      gx + 0.01, gy - 0.66, g[2], gy - 0.36, g[2], gy];
    if (!fine) {
      for (let i = 0; i < ABBEY_PIERS.length; i++) {
        const p = ABBEY_PIERS[i];
        ctx.fillStyle = LM.ink;
        ctx.fillRect(X(p[0] - pw / 2), Y(py - p[1]), pw * z, p[1] * z);
      }
      fillPoly(ctx, cx, cy, z, gable, LM.ink);
      return;
    }
    // shadows, then the arcade: piers of falling height, one arch still whole
    ctx.globalAlpha = a0 * 0.18;
    for (let i = 0; i < ABBEY_PIERS.length; i++) {
      const p = ABBEY_PIERS[i], d = p[1] * 0.6;
      fillPoly(ctx, cx, cy, z, [p[0] - pw / 2, py, p[0] + pw / 2, py, p[0] + pw / 2 + d, py + d * 0.4, p[0] - pw / 2 + d, py + d * 0.4], LM.shadow);
    }
    fillPoly(ctx, cx, cy, z, [g[0], gy, g[2], gy, g[2] + 0.26, gy + 0.12, g[0] + 0.22, gy + 0.13], LM.shadow);
    ctx.globalAlpha = a0;
    const p0 = ABBEY_PIERS[0], p1 = ABBEY_PIERS[1], p2 = ABBEY_PIERS[2];
    const ar = (p1[0] - p0[0]) / 2, ay = py - p1[1] + 0.02;
    ctx.lineCap = 'butt';
    for (let j = 0; j < 2; j++) {                          // the arch's shaded soffit, then its face
      ctx.strokeStyle = j ? LMC.stone : LMC.stoneSide;
      ctx.lineWidth = (j ? 0.042 : 0.06) * z;
      const dy = j ? -0.008 : 0;
      ctx.beginPath();
      ctx.arc(X((p0[0] + p1[0]) / 2), Y(ay + dy), ar * z, Math.PI, TAU);
      ctx.moveTo(X((p1[0] + p2[0]) / 2 - ar), Y(ay + dy));    // the broken one: a stub of arch
      ctx.arc(X((p1[0] + p2[0]) / 2), Y(ay + dy), ar * z, Math.PI, Math.PI * 1.32);
      ctx.stroke();
    }
    // the piers, one path per colour (their face, lit edge, shaded edge, outline, snow)
    const piers = [], layer = (f) => { ctx.beginPath(); for (let i = 0; i < piers.length; i++) addPoly(ctx, cx, cy, z, f(piers[i])); };
    for (let i = 0; i < ABBEY_PIERS.length; i++) {
      const p = ABBEY_PIERS[i];
      piers.push({ x0: p[0] - pw / 2, t: py - p[1] });
    }
    const pierPts = (q) => [q.x0, py, q.x0, q.t + 0.02, q.x0 + pw * 0.4, q.t, q.x0 + pw, q.t + 0.035, q.x0 + pw, py];
    layer(pierPts); ctx.fillStyle = LMC.stone; ctx.fill();
    ctx.globalAlpha = a0 * 0.45; ctx.strokeStyle = LM.ink; ctx.lineWidth = 0.01 * z; ctx.stroke();
    ctx.globalAlpha = a0;
    layer((q) => [q.x0, py, q.x0, q.t + 0.02, q.x0 + pw * 0.3, q.t + 0.007, q.x0 + pw * 0.3, py]);
    ctx.fillStyle = LMC.stoneLit; ctx.fill();
    layer((q) => [q.x0 + pw * 0.62, py, q.x0 + pw * 0.62, q.t + 0.03, q.x0 + pw, q.t + 0.035, q.x0 + pw, py]);
    ctx.fillStyle = LMC.stoneSide; ctx.fill();
    if (snow) {
      layer((q) => [q.x0, q.t + 0.02, q.x0 + pw * 0.4, q.t, q.x0 + pw, q.t + 0.035, q.x0 + pw, q.t + 0.05, q.x0, q.t + 0.035]);
      ctx.fillStyle = LM.snow; ctx.fill();
    }
    // ivy on the first pier
    fillEllipse(ctx, X(p0[0] + 0.01), Y(py - p0[1] * 0.45), 0.042 * z, 0.1 * z, LMC.ivy);
    fillEllipse(ctx, X(p0[0] - 0.005), Y(py - p0[1] * 0.55), 0.022 * z, 0.05 * z, LMC.ivyLit);
    // the gable end: lit face, shaded return, three lancets open to the meadow behind
    fillPoly(ctx, cx, cy, z, gable, LMC.stone);
    fillPoly(ctx, cx, cy, z, [g[0], gy, g[0], gy - 0.36, g[0] + 0.07, gy - 0.5, g[0] + 0.085, gy - 0.47, g[0] + 0.05, gy - 0.35, g[0] + 0.05, gy], LMC.stoneLit);
    fillPoly(ctx, cx, cy, z, [g[2], gy, g[2], gy - 0.36, g[2] + 0.055, gy - 0.34, g[2] + 0.055, gy - 0.02], LMC.stoneSide);
    ctx.fillStyle = LMC.stoneSide;
    ctx.fillRect(X(g[0]), Y(gy - 0.03), (g[2] - g[0]) * z, 0.03 * z);
    ctx.globalAlpha = a0 * 0.5;
    polyPath(ctx, cx, cy, z, gable); ctx.strokeStyle = LM.ink; ctx.lineWidth = 0.012 * z; ctx.stroke();
    ctx.globalAlpha = a0;
    const through = shade(PALETTE[T.PLAIN].fill, -0.12);
    const lancet = (x, h, w) => {
      const b = gy - 0.06, xl = x - w / 2, xr = x + w / 2, sp = b - h;
      ctx.beginPath();
      ctx.moveTo(X(xl), Y(b)); ctx.lineTo(X(xl), Y(sp + w * 0.7));
      ctx.quadraticCurveTo(X(xl), Y(sp + w * 0.1), X(x), Y(sp));
      ctx.quadraticCurveTo(X(xr), Y(sp + w * 0.1), X(xr), Y(sp + w * 0.7));
      ctx.lineTo(X(xr), Y(b)); ctx.closePath();
    };
    ctx.strokeStyle = LMC.stoneDark; ctx.lineWidth = 0.016 * z;
    lancet(gx, 0.34, 0.07); ctx.fillStyle = through; ctx.fill(); ctx.stroke();
    lancet(gx - 0.09, 0.24, 0.05); ctx.fill(); ctx.stroke();
    lancet(gx + 0.09, 0.24, 0.05); ctx.fill(); ctx.stroke();
    if (snow) {
      fillPoly(ctx, cx, cy, z, [g[0], gy - 0.36, g[0] + 0.07, gy - 0.5, g[0] + 0.07, gy - 0.47, g[0], gy - 0.335], LM.snow);
      fillPoly(ctx, cx, cy, z, [gx + 0.01, gy - 0.66, g[2], gy - 0.36, g[2], gy - 0.335, gx + 0.01, gy - 0.63], LM.snow);
    }
    fillEllipse(ctx, X(g[2] - 0.03), Y(gy - 0.12), 0.04 * z, 0.08 * z, LMC.ivy);
    // fallen blocks in the grass out front
    // fallen blocks in the grass out front: all their shadows, all their sides, all their tops
    const blocks = [[-0.30, 0.26, 0.07], [-0.16, 0.33, 0.05], [-0.02, 0.27, 0.06], [0.22, 0.34, 0.045]];
    ctx.globalAlpha = a0 * 0.22;
    ctx.beginPath();
    for (let i = 0; i < blocks.length; i++) {
      const bl = blocks[i], w = bl[2];
      addPoly(ctx, cx, cy, z, [bl[0] - w * 0.4, bl[1], bl[0] + w * 0.7, bl[1] - 0.004, bl[0] + w * 0.95, bl[1] + 0.018, bl[0] - w * 0.2, bl[1] + 0.02]);
    }
    ctx.fillStyle = LM.shadow; ctx.fill();
    ctx.globalAlpha = a0;
    ctx.beginPath();
    for (let i = 0; i < blocks.length; i++) {
      const bl = blocks[i], w = bl[2];
      addPoly(ctx, cx, cy, z, [bl[0] - w / 2, bl[1], bl[0] - w * 0.4, bl[1] - w * 0.7, bl[0] + w * 0.45, bl[1] - w * 0.62, bl[0] + w / 2, bl[1]]);
    }
    ctx.fillStyle = LMC.stoneSide; ctx.fill();
    ctx.beginPath();
    for (let i = 0; i < blocks.length; i++) {
      const bl = blocks[i], w = bl[2];
      addPoly(ctx, cx, cy, z, [bl[0] - w * 0.4, bl[1] - w * 0.7, bl[0] + w * 0.45, bl[1] - w * 0.62, bl[0] + w * 0.4, bl[1] - w * 0.45, bl[0] - w * 0.42, bl[1] - w * 0.5]);
    }
    ctx.fillStyle = snow ? LM.snow : LMC.stoneLit; ctx.fill();
    if (sails) {
      const c = ABBEY_CROWS;
      drawCrow(ctx, X(c.x - 0.15), Y(c.y + 0.02), 0.05 * z);
      drawCrow(ctx, X(c.x + 0.12), Y(c.y - 0.07), 0.042 * z);
    }
  }

  function drawSkep(ctx, cx, cy, z, x, y, fine, snow) {
    const X = cx + x * z, Y = cy + y * z, rx = 0.068 * z, ry = 0.125 * z;
    ctx.beginPath(); ctx.ellipse(X, Y, rx, ry, 0, Math.PI, TAU); ctx.closePath();
    if (!fine) { ctx.fillStyle = LM.ink; ctx.fill(); return; }
    ctx.fillStyle = LMC.straw; ctx.fill();
    fillEllipse(ctx, X - rx * 0.35, Y - ry * 0.6, rx * 0.34, ry * 0.26, LMC.strawLit);
    ctx.strokeStyle = LMC.strawDark; ctx.lineWidth = 0.011 * z;
    ctx.beginPath();
    for (let i = 1; i <= 3; i++) {
      const hh = ry * i / 4.2, hw2 = rx * Math.sqrt(1 - (hh / ry) * (hh / ry));
      ctx.moveTo(X - hw2, Y - hh); ctx.quadraticCurveTo(X, Y - hh + ry * 0.1, X + hw2, Y - hh);
    }
    ctx.stroke();
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.arc(X, Y, 0.02 * z, Math.PI, TAU); ctx.fill();
    if (snow) fillEllipse(ctx, X, Y - ry * 0.9, rx * 0.55, ry * 0.18, LM.snow);
  }

  function drawBeehives(ctx, cx, cy, z, fine, sails, snow) {
    const X = (u) => cx + u * z, Y = (v) => cy + v * z;
    if (fine) {
      footShadow(ctx, cx, cy, z, 0.04, HIVE_Y + 0.04, 0.3, 0.05);
      ctx.fillStyle = LM.timberDark;                        // the bench and its legs
      ctx.fillRect(X(-0.26), Y(HIVE_Y), 0.02 * z, 0.06 * z);
      ctx.fillRect(X(0.24), Y(HIVE_Y), 0.02 * z, 0.06 * z);
      ctx.fillStyle = LM.timber;
      ctx.fillRect(X(-0.29), Y(HIVE_Y - 0.004), 0.58 * z, 0.03 * z);
      ctx.fillStyle = snow ? LM.snow : shade(LM.timber, 0.25);
      ctx.fillRect(X(-0.29), Y(HIVE_Y - 0.004), 0.58 * z, 0.01 * z);
    }
    for (let i = 0; i < HIVES.length; i++) drawSkep(ctx, cx, cy, z, HIVES[i], HIVE_Y, fine, snow);
    if (fine && sails && !snow) {
      ctx.fillStyle = '#3a2a1a';
      const bees = [[-0.1, -0.08], [0.08, -0.14], [0.24, -0.06]];
      ctx.beginPath();
      for (let i = 0; i < bees.length; i++) {
        ctx.moveTo(X(bees[i][0]) + 0.014 * z, Y(bees[i][1])); ctx.arc(X(bees[i][0]), Y(bees[i][1]), 0.014 * z, 0, TAU);
      }
      ctx.fill();
    }
  }

  function drawMixed(ctx, cx, cy, z, kind, edges, fine, sails, snow) {
    const pl = lmPlan(kind, edges);
    if (kind === 'depot') {
      about(ctx, cx, cy, z, pl.st.x, pl.st.y, pl.st.A);
      drawDepot(ctx, cx, cy, z, pl, fine, snow);
      ctx.restore();
    } else if (kind === 'watermill') drawWatermill(ctx, cx, cy, z, pl, fine, sails, snow);
    else if (kind === 'farmstead') drawFarmstead(ctx, cx, cy, z, pl, fine, snow);
    else if (kind === 'sawmill') drawSawmill(ctx, cx, cy, z, pl, fine, snow);
    else if (kind === 'bridge') drawBridge(ctx, cx, cy, z, pl, edges, fine, snow);
    else if (kind === 'market') drawMarket(ctx, cx, cy, z, fine, sails, snow);
    else if (kind === 'abbey') {
      about(ctx, cx, cy, z, 0, ABBEY_OY, ABBEY_A);
      drawAbbey(ctx, cx, cy, z, fine, sails, snow);
      ctx.restore();
    } else if (kind === 'beehives') {
      about(ctx, cx, cy, z, 0, HIVE_Y, HIVE_A);
      drawBeehives(ctx, cx, cy, z, fine, sails, snow);
      ctx.restore();
    }
  }

  /**
   * The building. `opts.fine` (default true) picks painted art or the LOD silhouette;
   * `opts.sails` (default true) paints the windmill's sails static — the board passes false
   * whenever anim.js is there to turn them.
   */
  function drawLandmark(ctx, cx, cy, size, kind, opts) {
    if (!LANDMARKS[kind]) return;
    const fine = !opts || opts.fine !== false;
    const sails = !opts || opts.sails !== false;
    const snow = !!Renderer.SEASON.snow;
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const s = size * LM.SCALE;
    if (kind === 'windmill') drawWindmill(ctx, cx, cy, s, fine, sails, snow);
    else if (kind === 'chapel') drawChapel(ctx, cx, cy + LM.CHAPEL_DY * size, s, fine, snow);
    else if (kind === 'stones') drawStones(ctx, cx, cy, s, fine, snow);
    else drawMixed(ctx, cx, cy, size, kind, opts && opts.edges, fine, sails, snow);
    ctx.restore();
  }
  Renderer.drawLandmark = drawLandmark;

  /**
   * World points anim.js animates a landmark from, for a tile centred at (cx, cy). `edges` (the
   * tile's rotated edges) orients the mixed kinds; without it they read at layout rotation 0.
   *   windmill  → { hub: {x, y}, r, s }        the sail hub, the sail length, the art unit
   *   chapel    → { windows: [{x, y}], w }     the lit windows (and the belfry), w = glow radius
   *   stones    → { centre: {x, y}, rx, ry }   the altar, and the ring the motes rise from
   *   watermill → { wheel: {x, y, r} }         the wheel's hub and radius (the static art leaves
   *                                            the wheel off when `sails` is false; drawWheel)
   *   beehives  → { hives: [{x, y}] }          each skep's entrance hole
   *   market    → { bunting: [{x0, y0, x1, y1}] } pole top → maypole top (drawBunting sags it)
   *   abbey     → { crows: {x, y, r} }         the point the crows circle, and the circle radius
   *   bridge    → { deck: {x0, y0, x1, y1, hw} } the deck's centreline along the rail and its
   *                                            half-width: a boat is under the deck inside it
   *   depot / farmstead / sawmill → { } (their motion is chimney smoke: geom.chimneys)
   */
  function landmarkAnchors(cx, cy, hexSize, kind, edges) {
    if (LM_LAYOUT[kind]) {
      const z = hexSize;
      if (kind === 'watermill') {
        const w = lmPlan(kind, edges).wheel;
        return { wheel: { x: cx + w.x * z, y: cy + w.y * z, r: w.r * z } };
      }
      if (kind === 'beehives') {
        const out = [];
        for (let i = 0; i < HIVES.length; i++) out.push({ x: cx + HIVES[i] * HIVE_A * z, y: cy + (HIVE_Y - 0.01 * HIVE_A) * z });
        return { hives: out };
      }
      if (kind === 'market') return { bunting: marketBunting(cx, cy, z) };
      if (kind === 'abbey') {
        const c = ABBEY_CROWS, A = ABBEY_A;
        return { crows: { x: cx + c.x * A * z, y: cy + (ABBEY_OY + (c.y - ABBEY_OY) * A) * z, r: c.r * A * z } };
      }
      if (kind === 'bridge') {
        const pl = lmPlan(kind, edges), ca = Math.cos(pl.a), sa = Math.sin(pl.a);
        return { deck: { x0: cx - pl.L * ca * z, y0: cy - pl.L * sa * z, x1: cx + pl.L * ca * z, y1: cy + pl.L * sa * z, hw: pl.W * z } };
      }
      return {};
    }
    const size = hexSize * LM.SCALE;
    if (kind === 'windmill') return { hub: { x: cx, y: cy + LM.HUB_Y * size }, r: LM.SAIL_R * size, s: size };
    if (kind === 'chapel') cy += LM.CHAPEL_DY * hexSize;
    if (kind === 'chapel') {
      const w = [];
      for (let i = 0; i < CHAPEL_WINDOWS.length; i++) {
        w.push({ x: cx + CHAPEL_WINDOWS[i][0] * size, y: cy + (CHAPEL_WINDOWS[i][1] + 0.006) * size });
      }
      w.push({ x: cx + CHAPEL_BELFRY[0] * size, y: cy + CHAPEL_BELFRY[1] * size });
      return { windows: w, w: size * 0.05 };
    }
    if (kind === 'stones') {
      return {
        centre: { x: cx, y: cy + STONE_RING.cy * size },
        rx: STONE_RING.rx * size, ry: STONE_RING.ry * size,
      };
    }
    return null;
  }

  // ---------------------------------------------------------------- quest banner

  /** Pill outline as ONE contour: two round caps joined by straight sides. */
  function pillPath(ctx, x, y, w, h) {
    const r = h / 2;
    ctx.beginPath();
    ctx.arc(x - w / 2 + r, y, r, Math.PI / 2, Math.PI * 1.5);
    ctx.lineTo(x + w / 2 - r, y - r);
    ctx.arc(x + w / 2 - r, y, r, Math.PI * 1.5, Math.PI / 2);
    ctx.closePath();
  }

  /** The quest banner: a terrain-coloured pill near the top of the hex. */
  function drawQuest(ctx, cx, cy, size, quest) {
    const pal = PALETTE[quest.terrain] || PALETTE[T.PLAIN];
    const failed = quest.status === 'failed';
    const done = quest.status === 'done';
    const w = size * 0.56, h = size * 0.28, y = cy - size * 0.58;
    ctx.save();
    if (failed) ctx.globalAlpha *= 0.45;
    pillPath(ctx, cx, y, w, h);
    ctx.fillStyle = failed ? shade(pal.fill, -0.15) : shade(pal.fill, 0.2);
    ctx.fill();
    ctx.lineWidth = Math.max(0.6, size * 0.028);
    ctx.strokeStyle = pal.ink;
    ctx.stroke();

    if (done) {
      // a tick instead of the number
      ctx.strokeStyle = MARK_MATCH;
      ctx.lineWidth = size * 0.055;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - size * 0.10, y);
      ctx.lineTo(cx - size * 0.02, y + size * 0.07);
      ctx.lineTo(cx + size * 0.11, y - size * 0.08);
      ctx.stroke();
    } else if (quest.type === 'rail' && ((HG.C && HG.C.QUEST_RAIL_KIND) || 'length') === 'pair') {
      // the brief's pair rule has no count to show: a link glyph, two small interlocking rings
      // (QUEST_RAIL_KIND 'length', the wave-3 default, shows the target number like river)
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = size * 0.04;
      ctx.beginPath(); ctx.arc(cx - size * 0.055, y, size * 0.072, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + size * 0.055, y, size * 0.072, 0, TAU); ctx.stroke();
    } else {
      ctx.fillStyle = shade(pal.ink, -0.25);
      ctx.font = '600 ' + (size * 0.24).toFixed(1) + 'px ui-sans-serif, system-ui, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(quest.target), cx, y + size * 0.012);
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------- one tile

  /**
   * Draw one tile's art centred at (cx, cy) with centre-to-corner radius `size`, in the ctx's
   * current transform. Standalone: the HUD queue canvases and harness/render-test.html call
   * exactly this. `opts`:
   *   ghost  — draw at VIEW.GHOST_ALPHA (a placement preview)
   *   alpha  — explicit opacity, overrides `ghost`
   *   quest  — a Quest object to banner on the tile
   *   landmark — 'windmill' | 'chapel' | 'stones' (core's `cell.tile.landmark`); the painted
   *            centrepiece on its golden ground glow
   *   sails  — false to leave the windmill's sails off (render/anim.js turns them on the board)
   *   q, r   — the cell this is (fixes the decoration); omit for a queue tile
   *   seed   — explicit decoration seed, overrides q/r
   *   detail — device px per world px, for level of detail (default 1)
   *   seam   — false to skip the hairline outline
   */
  function drawTile(ctx, cx, cy, size, edges, opts) {
    opts = opts || {};
    const alpha = (opts.alpha !== undefined && opts.alpha !== null)
      ? opts.alpha
      : (opts.ghost ? (V().GHOST_ALPHA || 0.65) : 1);
    const seed = (opts.seed !== undefined && opts.seed !== null)
      ? opts.seed
      : (opts.q !== undefined ? cellSeed(opts.q, opts.r) : edgeSeed(edges));
    const px = size * (opts.detail || 1);
    const fine = px >= (V().LOD_MIN_PX || 13);

    ctx.save();
    if (alpha !== 1) ctx.globalAlpha *= alpha;

    // 1. the pie of wedges. Each is filled AND stroked in its own colour so the antialiased
    //    joins between wedges (and between neighbouring hexes) close up with no white thread.
    const runs = runsOf(edges);
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(0.5, size * 0.02);
    for (let i = 0; i < runs.length; i++) {
      const pal = PALETTE[runs[i].t] || PALETTE[T.PLAIN];
      wedgePath(ctx, cx, cy, size, runs[i].start, runs[i].len);
      ctx.fillStyle = pal.fill;
      ctx.strokeStyle = pal.fill;
      ctx.fill();
      ctx.stroke();
    }

    // 1b. LIGHT FROM THE TOP-LEFT. A lit rim along the hex's upper edges (corners 3→4→5→0) and
    //     a shaded one along its lower edges (0→1→2→3). Two open strokes — a per-hex gradient
    //     overlay costs about the same and reads flatter, because the rim is what actually
    //     makes a hex look like a slab of land rather than a coloured patch.
    if (fine) {
      const cfg = Renderer.CFG;
      const baseA = ctx.globalAlpha;
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(0.8, size * 0.075);
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = baseA * (cfg.RIM_LIGHT >= 0 ? cfg.RIM_LIGHT : 0.3);
      ctx.beginPath();
      for (let i = 0; i <= 3; i++) {
        const p = corner(cx, cy, size * 0.97, 3 + i);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
      ctx.strokeStyle = '#3a3226';
      ctx.globalAlpha = baseA * (cfg.RIM_SHADE >= 0 ? cfg.RIM_SHADE : 0.13);
      ctx.beginPath();
      for (let i = 0; i <= 3; i++) {
        const p = corner(cx, cy, size * 0.97, i);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
      ctx.globalAlpha = baseA;
    }

    // 2. the hairline seam that separates one hex from the next
    if (opts.seam !== false) {
      hexPath(ctx, cx, cy, size);
      ctx.strokeStyle = SEAM;
      ctx.lineWidth = Math.max(0.6, size * 0.035);
      ctx.globalAlpha *= 0.85;
      ctx.stroke();
      ctx.globalAlpha /= 0.85;
    }

    // 3. THE GROUND. A river and a railway are at ground level, so they are painted first and
    //    everything else in the tile stands on top of them (Nic's play-test: a river must never
    //    run over a tree or a house). Furrows, hedgerows and grass are paint too.
    const mixed = !!(opts.landmark && LM_LAYOUT[opts.landmark]);
    if (mixed) drawLandmarkGround(ctx, cx, cy, size, opts.landmark, fine);
    const water = dirsOf(edges, T.WATER);
    if (water.length) drawWater(ctx, cx, cy, size, water, PALETTE[T.WATER], fine);
    const rail = dirsOf(edges, T.RAIL);
    if (rail.length) drawRail(ctx, cx, cy, size, rail, PALETTE[T.RAIL], fine);
    if (fine) {
      for (let i = 0; i < runs.length; i++) {
        const run = runs[i], pal = PALETTE[run.t] || PALETTE[T.PLAIN];
        if (run.t === T.FIELD) drawField(ctx, cx, cy, size, run, seed, pal, fine);
        else if (run.t === T.PLAIN) drawPlain(ctx, cx, cy, size, run, seed, pal, mixed);
      }
    }
    // the landmark's golden ground — paint, so the marks around it stand on the glow. A mixed
    // (wave-6) landmark lays its glow BEFORE the lines instead (see below), so a river or a
    // railway is never tinted or, under LOD, buried under the gold disc; its own ground paint
    // (platform, cobbles, flowers) goes here.
    if (opts.landmark && !mixed) drawLandmarkGround(ctx, cx, cy, size, opts.landmark, fine);
    if (mixed && fine) drawLandmarkDecor(ctx, cx, cy, size, opts.landmark, edges);

    // 4. WHAT STANDS ON IT, as one list for the whole tile sorted by screen y: lower on screen
    //    is nearer the viewer and is drawn last, so a house in front of a tree covers the tree
    //    and never the reverse. The landmark glyph sorts with everything else (its disc sits at
    //    the tile centre) and is never LOD-skipped — a landmark is the one thing on the board
    //    worth spotting from a long way out.
    if (fine || opts.landmark) {
      const marks = buildMarks(cx, cy, size, edges, seed, opts.landmark, fine);
      for (let i = 0; i < marks.length; i++) {
        const m = marks[i];
        if (m.type === 'tree') drawTree(ctx, m, seed);
        else if (m.type === 'house') drawHouse(ctx, m, fine);
        else if (m.type === 'hay') drawHay(ctx, m);
        else if (m.type === 'landmark') {
          // A mixed landmark stands off-centre, so its cast shadows can reach the seam; clip it
          // to its own hex, or what crossed would depend on which neighbour was cached later.
          // (Under LOD there are no shadows, and the clip would be a fifth of the tile's budget.)
          const clip = mixed && fine;
          if (clip) { ctx.save(); hexPath(ctx, cx, cy, size); ctx.clip(); }
          drawLandmark(ctx, cx, cy, size, m.kind, { fine: fine, sails: opts.sails !== false, edges: edges });
          if (clip) ctx.restore();
        }
      }
    }

    // 5. the quest banner (and anim.js's smoke) stay on top of all of it
    if (opts.quest) drawQuest(ctx, cx, cy, size, opts.quest);

    ctx.restore();
  }
  Renderer.drawTile = drawTile;

  // ---------------------------------------------------------------- edge markers

  /**
   * The placement preview's per-edge verdict, just inside the edge midpoint. Read straight from
   * res.edge[d]: a soft check for 'match', a short dash for 'neutral', a broken line for 'scar',
   * nothing for 'open'. This is the single most important piece of UI in the game (brief §4) —
   * the player should read a placement without counting.
   */
  function drawEdgeMark(ctx, cx, cy, size, d, kind) {
    if (kind !== 'match' && kind !== 'neutral' && kind !== 'scar') return;
    const ang = 60 * d * DEG;
    const rad = size * SQRT3 / 2 * 0.74;
    const m = size * 0.17;
    ctx.save();
    ctx.translate(cx + rad * Math.cos(ang), cy + rad * Math.sin(ang));
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (kind === 'match') {
      // The tick stays UPRIGHT whatever edge it sits on — a rotated check reads as a chevron.
      ctx.strokeStyle = MARK_MATCH;
      ctx.lineWidth = size * 0.075;
      ctx.beginPath();
      ctx.moveTo(-m * 0.62, -m * 0.02);
      ctx.lineTo(-m * 0.16, m * 0.44);
      ctx.lineTo(m * 0.62, -m * 0.48);
      ctx.stroke();
      ctx.restore();
      return;
    }
    ctx.rotate(ang);                       // local +x points out of the hex, +y runs along the edge
    if (kind === 'neutral') {
      ctx.strokeStyle = MARK_NEUTRAL;
      ctx.globalAlpha *= 0.65;
      ctx.lineWidth = size * 0.055;
      ctx.beginPath();
      ctx.moveTo(0, -m * 0.5); ctx.lineTo(0, m * 0.5);
      ctx.stroke();
    } else {
      ctx.strokeStyle = MARK_SCAR;
      ctx.lineWidth = size * 0.05;
      ctx.beginPath(); ctx.moveTo(0, -m * 1.0); ctx.lineTo(0, -m * 0.28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, m * 0.28); ctx.lineTo(0, m * 1.0); ctx.stroke();
    }
    ctx.restore();
  }
  Renderer.drawEdgeMark = drawEdgeMark;

  const MARK_LANDMARK = '#d9a521';

  /**
   * A gold dot just inside an edge that will pay LANDMARK income if the tile goes down here
   * (`res.edgeLandmark[d]`, core). It sits beside the verdict mark rather than replacing it:
   * a landmark edge is still a match / neutral / scar, and the player needs both facts.
   */
  function drawLandmarkEdgeMark(ctx, cx, cy, size, d) {
    const ang = 60 * d * DEG;
    const rad = size * SQRT3 / 2 * 0.52;      // inboard of the verdict mark at 0.74
    ctx.save();
    ctx.fillStyle = MARK_LANDMARK;
    ctx.beginPath();
    ctx.arc(cx + rad * Math.cos(ang), cy + rad * Math.sin(ang), size * 0.068, 0, TAU);
    ctx.fill();
    ctx.globalAlpha *= 0.55;
    ctx.strokeStyle = shade(MARK_LANDMARK, -0.35);
    ctx.lineWidth = size * 0.022;
    ctx.stroke();
    ctx.restore();
  }
  Renderer.drawLandmarkEdgeMark = drawLandmarkEdgeMark;

  /**
   * Geometry shared with render/anim.js (wave 5): the SAME line paths, wedge sampling and
   * hashes the static art uses, so a moving glint rides exactly the river the cache drew.
   * Everything here is pure and takes world-space centre + size; nothing touches a ctx.
   *   lineSegs(cx, cy, size, dirs) → [{p0, c, p1}]   quadratic segs (2 dirs: one through the
   *                                                    centre; else stubs to the centre)
   *   segAt(seg, t)               → {x, y, dx, dy}   point + tangent at t∈[0,1]
   *   dirsOf(edges, t) / runsOf(edges) / inWedge(...) / cellSeed(q, r) / rnd(seed, a, b)
   *   corner(cx, cy, size, i) / edgeMid(cx, cy, size, d)
   *   chimneys(cx, cy, size, edges, seed, landmark) → [{x, y, w}] world points where village
   *     smoke rises — the TOP of each chimney stack, with `w` the stack's width so a plume can
   *     be scaled to the house. It runs the SAME `buildMarks` the tile was drawn from, so it
   *     can never drift from the houses on screen; pass `cell.tile.landmark` as the last
   *     argument, because a landmark changes where the houses fit.
   *   marks(cx, cy, size, edges, seed, landmark) → the whole y-sorted mark list, if anim ever
   *     needs to sit something else on a tree or a roof.
   *   landmarkAnchors(cx, cy, size, kind) → where a landmark's moving parts are (see above)
   */
  function chimneys(cx, cy, size, edges, seed, landmark) {
    const out = [];
    // a depot / farmstead / sawmill's own stacks come FIRST, tagged `lm: true`
    if (landmark && LM_LAYOUT[landmark]) {
      const ch = lmPlan(landmark, edges).chim;
      for (let i = 0; i < ch.length; i++) {
        const t = stackTop(ch[i]);
        out.push({ x: cx + t.x * size, y: cy + t.y * size, w: t.w * size, lm: true });
      }
    }
    const marks = buildMarks(cx, cy, size, edges, seed, landmark, true);
    for (let i = 0; i < marks.length; i++) {
      const m = marks[i];
      if (m.type !== 'house') continue;
      // drawHouse: the stack is w*0.15 wide and w*0.34 tall, standing on y - hh*0.42
      out.push({ x: m.x + m.w * 0.28, y: m.y - m.w * 0.95 * 0.42 - m.w * 0.30, w: m.w * 0.15 });
    }
    return out;
  }
  Renderer.geom = {
    lineSegs: lineSegs, segAt: segAt, dirsOf: dirsOf, runsOf: runsOf, inWedge: inWedge,
    cellSeed: cellSeed, rnd: rnd, hash32: hash32, corner: corner, edgeMid: edgeMid,
    chimneys: chimneys, marks: buildMarks, landmarkAnchors: landmarkAnchors,
    // wave 6: where a mixed landmark's pieces stand (hex units, read-only) — see lmPlan
    landmarkPlan: function (kind, edges) { return LM_LAYOUT[kind] ? lmPlan(kind, edges) : null; },
  };

  // ---------------------------------------------------------------- the table
  //
  // The board is a slab of painted land lying on a table. Two things sell that, and both are
  // baked once and blitted: a parchment background with a vignette and a paper grain, and a
  // soft shadow under the landscape's bounding box. Neither costs more than one 2D call a frame.

  let grainPattern = null, grainTried = false;
  /** A small speckle tile, tiled as a pattern. Speckle positions are hashed, never random. */
  function grainFor(g) {
    if (grainTried) return grainPattern;
    grainTried = true;
    if (typeof document === 'undefined' || !g.createPattern) return null;
    const n = Math.max(8, Renderer.CFG.GRAIN_PX | 0);
    const c = document.createElement('canvas');
    c.width = n; c.height = n;
    const t = c.getContext('2d');
    if (!t) return null;
    const dots = Math.max(0, Renderer.CFG.GRAIN_DOTS | 0);
    for (let i = 0; i < dots; i++) {
      const x = hash32(i, 3, 7) % n, y = hash32(i, 11, 5) % n;
      t.fillStyle = (hash32(i, 17, 2) & 1) ? 'rgba(255,255,255,0.55)' : 'rgba(92,79,58,0.22)';
      t.fillRect(x, y, 1, 1);
    }
    grainPattern = g.createPattern(c, 'repeat') || null;
    return grainPattern;
  }

  let shadowSprite = null, shadowTried = false;
  /** One blurred blob, stretched over the landscape's box. A radial gradient IS the blur. */
  function shadowFor() {
    if (shadowTried) return shadowSprite;
    shadowTried = true;
    if (typeof document === 'undefined') return null;
    const n = 128;
    const c = document.createElement('canvas');
    c.width = n; c.height = n;
    const g = c.getContext('2d');
    if (!g || !g.createRadialGradient) return null;
    const gr = g.createRadialGradient(n / 2, n / 2, n * 0.10, n / 2, n / 2, n / 2);
    if (!gr || !gr.addColorStop) return null;
    gr.addColorStop(0, 'rgba(58,48,32,1)');
    gr.addColorStop(0.52, 'rgba(58,48,32,0.74)');
    gr.addColorStop(1, 'rgba(58,48,32,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, n, n);
    shadowSprite = c;
    return c;
  }

  // ---------------------------------------------------------------- the renderer

  Renderer.create = function (canvas) {
    const ctx = canvas.getContext('2d', { alpha: false });

    // Two offscreen layers: `cur` is what gets blitted, `bld` is the one being filled. A
    // rebuild never blocks a frame — see the header.
    function layer() {
      return { canvas: null, ctx: null, scale: 0, x0: 0, y0: 0, x1: 0, y1: 0, drawn: new Set(), state: null };
    }
    const cur = layer(), bld = layer();
    let building = false, queue = null, queued = new Set(), qi = 0;
    let lastPlaced = -1, lastState = null;

    const R = {
      canvas: canvas,
      ctx: ctx,
      w: canvas.width || 800,
      h: canvas.height || 600,
      dpr: 1,
      // The season this instance last painted (an index into Renderer.SEASONS, -1 before the
      // first frame). main.js watches it and pushes Renderer.cssVarsFor(R.season) onto :root.
      season: -1,
      stats: { rebuilds: 0, cellsCached: 0, liveCells: 0, calls: 0 },
    };

    R.resize = function (w, h, dpr) {
      R.dpr = dpr > 0 ? dpr : 1;
      R.w = w > 0 ? w : R.w;
      R.h = h > 0 ? h : R.h;
      const pw = Math.max(1, Math.round(R.w * R.dpr));
      const ph = Math.max(1, Math.round(R.h * R.dpr));
      if (canvas.width !== pw) canvas.width = pw;
      if (canvas.height !== ph) canvas.height = ph;
      buildBg();
    };

    // ---- background --------------------------------------------------------

    let bgLayer = null, bgKey = '';

    /** Bake parchment + vignette + grain into a canvas-sized layer. Size/DPR/season keyed. */
    function buildBg() {
      const key = R.w + 'x' + R.h + '@' + R.dpr + '|' + Renderer.season;
      if (key === bgKey && bgLayer) return;
      bgKey = key;
      if (typeof document === 'undefined') { bgLayer = null; return; }
      const pw = Math.max(1, Math.round(R.w * R.dpr));
      const ph = Math.max(1, Math.round(R.h * R.dpr));
      if (!bgLayer) bgLayer = document.createElement('canvas');
      bgLayer.width = pw; bgLayer.height = ph;
      const g = bgLayer.getContext('2d', { alpha: false });
      if (!g) { bgLayer = null; return; }
      g.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
      g.fillStyle = BG;
      g.fillRect(0, 0, R.w, R.h);
      // A vignette lit from the upper left: the table is brighter where the light falls and
      // falls away warm (never grey) into the corners.
      const vg = g.createRadialGradient
        ? g.createRadialGradient(R.w * 0.40, R.h * 0.30, Math.min(R.w, R.h) * 0.08,
                                 R.w * 0.50, R.h * 0.50, Math.max(R.w, R.h) * 0.80)
        : null;
      const a = Renderer.CFG.VIGNETTE >= 0 ? Renderer.CFG.VIGNETTE : 0.2;
      if (vg && vg.addColorStop) {
        vg.addColorStop(0, 'rgba(255,255,255,' + (a * 0.6).toFixed(3) + ')');
        vg.addColorStop(0.5, 'rgba(255,255,255,0)');
        vg.addColorStop(1, 'rgba(78,64,42,' + a.toFixed(3) + ')');
        g.fillStyle = vg;
        g.fillRect(0, 0, R.w, R.h);
      }
      const pat = grainFor(g);
      if (pat) {
        g.globalAlpha = Renderer.CFG.GRAIN_ALPHA;
        g.fillStyle = pat;
        g.fillRect(0, 0, R.w, R.h);
        g.globalAlpha = 1;
      }
    }

    // ---- the world cache -------------------------------------------------

    /** Half-octave zoom buckets: a glide crosses few of them, so rebuilds stay rare. */
    function bucketOf(zoom) {
      const v = V();
      const lo = v.ZOOM_MIN > 0 ? v.ZOOM_MIN : 0.1, hi = v.ZOOM_MAX > 0 ? v.ZOOM_MAX : 4;
      const b = Math.pow(2, Math.round(Math.log(zoom) / Math.LN2 * 2) / 2);
      return Math.min(hi, Math.max(lo, b));
    }

    function cellBox(q, r, size) {
      const p = HG.Hex.toPixel(q, r, size);
      const ex = size * SQRT3 / 2;
      return { x0: p.x - ex, y0: p.y - size, x1: p.x + ex, y1: p.y + size, cx: p.x, cy: p.y };
    }

    /** Rasterise one cell into a layer, in that layer's world-space transform. */
    function drawCellInto(L, cell, size) {
      const p = HG.Hex.toPixel(cell.q, cell.r, size);
      const g = L.ctx;
      g.save();
      g.translate(p.x, p.y);
      drawTile(g, 0, 0, size, cell.edges, {
        q: cell.q, r: cell.r, detail: L.scale,
        landmark: cell.tile && cell.tile.landmark,
        sails: !animSails(),     // the cache never holds anything that moves
      });
      g.restore();
      L.drawn.add(cell.key);
      R.stats.cellsCached++;
    }

    /** anim.js turns the windmill sails on the board; without it they are painted static. */
    function animSails() { return !!(HG.Anim && HG.Anim.draw); }

    function inside(L, b) { return b.x0 >= L.x0 && b.x1 <= L.x1 && b.y0 >= L.y0 && b.y1 <= L.y1; }

    /** Start (or restart) a budgeted rebuild covering the current viewport + margin. */
    function startBuild(s, cam) {
      const v = V();
      const margin = v.CACHE_MARGIN >= 0 ? v.CACHE_MARGIN : 0.2;
      const maxPx = v.CACHE_MAX_PX > 0 ? v.CACHE_MAX_PX : 3200;
      const rect = cam.viewRect();
      const mw = (rect.x1 - rect.x0) * margin, mh = (rect.y1 - rect.y0) * margin;
      let x0 = rect.x0 - mw, y0 = rect.y0 - mh, x1 = rect.x1 + mw, y1 = rect.y1 + mh;
      let scale = bucketOf(cam.zoom) * R.dpr;
      // The cache is roughly canvas-sized whatever the zoom (world span shrinks as zoom grows),
      // but clamp anyway so an extreme viewport can never allocate a monster.
      const need = Math.max((x1 - x0) * scale, (y1 - y0) * scale);
      if (need > maxPx) scale *= maxPx / need;

      // A pan at the same zoom bucket re-uses what is already rasterised (see the blit below).
      // Snap the new origin onto the OLD layer's pixel lattice first, so that copy is an exact
      // integer-pixel move — otherwise every pan would resample the landscape a little blurrier.
      const reuse = !!(cur.canvas && cur.state === s && cur.scale > 0
        && Math.abs(Math.log(scale / cur.scale)) < 1e-9);
      if (reuse) {
        x0 = cur.x0 + Math.round((x0 - cur.x0) * scale) / scale;
        y0 = cur.y0 + Math.round((y0 - cur.y0) * scale) / scale;
      }

      const pw = Math.max(1, Math.ceil((x1 - x0) * scale));
      const ph = Math.max(1, Math.ceil((y1 - y0) * scale));
      if (!bld.canvas) {
        bld.canvas = document.createElement('canvas');
        bld.ctx = bld.canvas.getContext('2d', { alpha: true });
      }
      if (bld.canvas.width !== pw) bld.canvas.width = pw;
      if (bld.canvas.height !== ph) bld.canvas.height = ph;
      // the true extent after the integer-pixel rounding above
      bld.scale = scale; bld.x0 = x0; bld.y0 = y0;
      bld.x1 = x0 + pw / scale; bld.y1 = y0 + ph / scale;
      bld.state = s;
      bld.drawn.clear();
      const g = bld.ctx;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, bld.canvas.width, bld.canvas.height);
      g.setTransform(scale, 0, 0, scale, -x0 * scale, -y0 * scale);
      g.lineJoin = 'round';

      // Blit the old layer into the new one: the world transform lines them up, the lattice
      // snapping above makes it an exact pixel move, and the non-overlap is clipped away. Only
      // the cells the pan newly exposed are queued. Without this, every half-screen of panning
      // would re-rasterise the whole visible board.
      const overlap = reuse && cur.x1 > bld.x0 && cur.x0 < bld.x1 && cur.y1 > bld.y0 && cur.y0 < bld.y1;
      if (overlap) {
        g.imageSmoothingEnabled = false;
        g.drawImage(cur.canvas, cur.x0, cur.y0, cur.canvas.width / cur.scale, cur.canvas.height / cur.scale);
      }

      const size = V().HEX_SIZE || 36;
      queue = [];
      queued.clear();
      s.board.cells.forEach(function (cell) {
        const b = cellBox(cell.q, cell.r, size);
        if (!inside(bld, b)) return;
        // already carried over by the blit above, in full
        if (overlap && cur.drawn.has(cell.key) && inside(cur, b)) { bld.drawn.add(cell.key); return; }
        queue.push(cell); queued.add(cell.key);
      });
      qi = 0;
      building = true;
      R.stats.rebuilds++;
    }

    function promote() {
      const tmp = { canvas: cur.canvas, ctx: cur.ctx };
      cur.canvas = bld.canvas; cur.ctx = bld.ctx;
      cur.scale = bld.scale; cur.x0 = bld.x0; cur.y0 = bld.y0; cur.x1 = bld.x1; cur.y1 = bld.y1;
      cur.state = bld.state;
      const d = cur.drawn; cur.drawn = bld.drawn; bld.drawn = d; bld.drawn.clear();
      bld.canvas = tmp.canvas; bld.ctx = tmp.ctx; bld.scale = 0; bld.state = null;
      building = false; queue = null; queued.clear(); qi = 0;
    }

    /** Does the live camera still sit inside what `cur` covers, at a compatible scale? */
    function curUsable(s, cam) {
      if (!cur.canvas || cur.state !== s) return false;
      const rect = cam.viewRect();
      if (rect.x0 < cur.x0 || rect.x1 > cur.x1 || rect.y0 < cur.y0 || rect.y1 > cur.y1) return false;
      const want = bucketOf(cam.zoom) * R.dpr;
      return Math.abs(Math.log(want / cur.scale)) < 0.01;
    }

    function updateCache(s, cam) {
      const size = V().HEX_SIZE || 36;

      if (s !== lastState) {
        cur.state = null; cur.drawn.clear();
        building = false; queue = null; queued.clear(); qi = 0;
        lastPlaced = -1; lastState = s;
      }

      // A placement inside the window is one incremental cell draw, not a rebuild.
      if (s.placed !== lastPlaced) {
        if (cur.canvas && cur.state === s) {
          s.board.cells.forEach(function (cell) {
            if (cur.drawn.has(cell.key)) return;
            if (inside(cur, cellBox(cell.q, cell.r, size))) drawCellInto(cur, cell, size);
          });
        }
        if (building && queue) {
          s.board.cells.forEach(function (cell) {
            if (bld.drawn.has(cell.key) || queued.has(cell.key)) return;
            if (inside(bld, cellBox(cell.q, cell.r, size))) { queue.push(cell); queued.add(cell.key); }
          });
        }
        lastPlaced = s.placed;
      }

      if (!building && !curUsable(s, cam)) startBuild(s, cam);

      if (building) {
        const budget = V().CACHE_CELLS_PER_FRAME > 0 ? V().CACHE_CELLS_PER_FRAME : 60;
        let n = 0;
        while (qi < queue.length && n < budget) { drawCellInto(bld, queue[qi++], size); n++; }
        if (qi >= queue.length) promote();
      }
    }

    // ---- live layers -----------------------------------------------------

    function visibleCells(s, cam, out) {
      const size = V().HEX_SIZE || 36;
      const rect = cam.viewRect();
      const ex = size * SQRT3 / 2;
      s.board.cells.forEach(function (cell) {
        const p = HG.Hex.toPixel(cell.q, cell.r, size);
        if (p.x + ex < rect.x0 || p.x - ex > rect.x1 || p.y + size < rect.y0 || p.y - size > rect.y1) return;
        out.push(cell);
      });
      return out;
    }

    function drawFrontier(s, cam) {
      const size = V().HEX_SIZE || 36;
      const rect = cam.viewRect();
      const ex = size * SQRT3 / 2;
      ctx.save();
      ctx.strokeStyle = FRONTIER;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = Math.max(0.8 / cam.zoom, size * 0.035);
      ctx.setLineDash([size * 0.13, size * 0.15]);
      ctx.lineCap = 'round';
      s.board.frontier.forEach(function (key) {
        const qr = HG.Hex.parse(key);
        const p = HG.Hex.toPixel(qr[0], qr[1], size);
        if (p.x + ex < rect.x0 || p.x - ex > rect.x1 || p.y + size < rect.y0 || p.y - size > rect.y1) return;
        hexPath(ctx, p.x, p.y, size * 0.9);
        ctx.stroke();
      });
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawGhost(s, hover, spin) {
      const size = V().HEX_SIZE || 36;
      const p = HG.Hex.toPixel(hover.q, hover.r, size);
      const tile = s.queue && s.queue[0];
      // Mid-rotation: the art is already at its destination orientation, so turning the
      // context BACK by `spin` 60° steps draws the tile part-way through the turn. It is
      // shrunk to the hex's inradius at the same time (cos of the distance to the nearest
      // aligned orientation, which is exactly the ratio that fits) so a tilted hex never
      // pokes into the cells around it. Both are 0 / 1 when nothing is turning.
      const turning = !!spin;
      if (turning) {
        const a = spin * Math.PI / 3;
        const k = Math.cos(Math.min(Math.abs(spin), 1 - Math.abs(spin)) * Math.PI / 3);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(a);
        ctx.scale(k, k);
        ctx.translate(-p.x, -p.y);
      }
      drawTile(ctx, p.x, p.y, size, hover.edges, {
        ghost: true, q: hover.q, r: hover.r,
        quest: tile && tile.quest ? tile.quest : null,
        landmark: tile && tile.landmark,
        detail: 1,
      });
      if (turning) ctx.restore();
      const res = hover.res;
      if (!res || !res.edge) return;
      ctx.save();
      ctx.globalAlpha = 0.95;
      for (let d = 0; d < 6; d++) drawEdgeMark(ctx, p.x, p.y, size, d, res.edge[d]);
      // core (wave 5): edges that would feed a neighbouring landmark. Feature-checked — the
      // field is absent on older cores and on a hand-built harness result.
      if (res.edgeLandmark) {
        for (let d = 0; d < 6; d++) {
          if (res.edgeLandmark[d]) drawLandmarkEdgeMark(ctx, p.x, p.y, size, d);
        }
      }
      ctx.restore();
    }

    /**
     * Quest banners on PLACED tiles are live, not in the world cache — a quest's status
     * changes after its tile is down. OPEN quests are drawn with drawQuest (their number is
     * live). ENDED quests (done / failed) never change again and a long run carries dozens
     * of them, so each is ONE drawImage of a sprite cached per (terrain, status, zoom bucket)
     * — five 2D calls a banner turned a settled 300-cell frame into a redraw (wave 3 sweep).
     */
    const bannerSprites = new Map();
    function bannerSprite(quest, size, k) {
      const key = quest.terrain + '|' + quest.status + '|' + k;
      let sp = bannerSprites.get(key);
      if (sp) return sp;
      if (typeof document === 'undefined') return null;
      // world-space box the pill occupies around (0, -0.58 size); a little slack for the stroke
      const w = size * 0.70, h = size * 0.40, yOff = -size * 0.58;
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.ceil(w * k));
      c.height = Math.max(1, Math.ceil(h * k));
      const sc = c.getContext('2d');
      sc.setTransform(k, 0, 0, k, (w / 2) * k, (h / 2 - yOff) * k);
      drawQuest(sc, 0, 0, size, quest);
      sp = { canvas: c, w: w, h: h, yOff: yOff };
      bannerSprites.set(key, sp);
      return sp;
    }

    function drawQuestBanners(s, cam) {
      const size = V().HEX_SIZE || 36;
      const rect = cam.viewRect();
      // sprite resolution follows the zoom bucket the world cache uses, so it never looks softer
      const k = bucketOf(cam.zoom) * R.dpr;
      s.board.cells.forEach(function (cell) {
        const quest = cell.tile && cell.tile.quest;
        if (!quest || quest.status === 'pending') return;
        const p = HG.Hex.toPixel(cell.q, cell.r, size);
        if (p.x < rect.x0 - size || p.x > rect.x1 + size || p.y < rect.y0 - size || p.y > rect.y1 + size) return;
        if (quest.status === 'open') { drawQuest(ctx, p.x, p.y, size, quest); return; }
        const sp = bannerSprite(quest, size, k);
        if (!sp) { drawQuest(ctx, p.x, p.y, size, quest); return; }
        ctx.drawImage(sp.canvas, p.x - sp.w / 2, p.y + sp.yOff - sp.h / 2, sp.w, sp.h);
      });
    }

    /**
     * view.focus — the quest the player is pointing at in the HUD, as { key, terrain }.
     * The HUD row can say "Grow forest 3/8" all it likes; this is what actually answers
     * "which tile?". The quest's whole connected run is lit and its anchor hex gets a ring,
     * so the player sees the shape they are being asked to extend.
     *
     * Groups.members() walks every segment node on the board, which is far too much to do at
     * 144 Hz — so it is computed once per (anchor, terrain, placement count) and reused for
     * every frame the pointer stays on the row.
     */
    let focusCache = null;
    function focusMembers(s, focus) {
      const key = focus.key + '|' + focus.terrain + '|' + s.placed;
      if (focusCache && focusCache.key === key && focusCache.state === s) return focusCache.set;
      const set = new Set();
      if (HG.Groups && HG.Groups.find) {
        const root = HG.Groups.find(s, focus.key, focus.terrain);
        if (root !== null) HG.Groups.members(s, root).forEach((k) => set.add(k));
      }
      set.add(focus.key);
      focusCache = { key: key, state: s, set: set };
      return set;
    }

    function drawQuestFocus(s, cam, view) {
      const focus = view.focus;
      const size = V().HEX_SIZE || 36;
      const pal = PALETTE[focus.terrain] || PALETTE[T.PLAIN];
      const ink = pal.ink || pal.fill || '#3d3a34';
      const members = focusMembers(s, focus);
      // A slow breath, so the highlight reads as "look here" rather than an alarm.
      const pulse = 0.5 + 0.5 * Math.sin((view.t || 0) * 3.2);

      ctx.save();
      ctx.lineJoin = 'round';
      ctx.globalAlpha = 0.16 + 0.10 * pulse;
      ctx.fillStyle = ink;
      members.forEach(function (k) {
        const cell = s.board.cells.get(k);
        if (!cell) return;
        const p = HG.Hex.toPixel(cell.q, cell.r, size);
        hexPath(ctx, p.x, p.y, size * 0.98);
        ctx.fill();
      });
      ctx.globalAlpha = 0.55 + 0.35 * pulse;
      ctx.strokeStyle = ink;
      ctx.lineWidth = Math.max(1.5, size * 0.055);
      members.forEach(function (k) {
        const cell = s.board.cells.get(k);
        if (!cell) return;
        const p = HG.Hex.toPixel(cell.q, cell.r, size);
        hexPath(ctx, p.x, p.y, size * 0.94);
        ctx.stroke();
      });
      // The anchor: the tile the quest was placed on, ringed so it is findable in a big run.
      const a = HG.Hex.parse(focus.key);
      const ap = HG.Hex.toPixel(a[0], a[1], size);
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = Math.max(2, size * 0.085);
      hexPath(ctx, ap.x, ap.y, size * (1.02 + 0.06 * pulse));
      ctx.stroke();
      ctx.restore();
      return ap;
    }

    /**
     * view.landmarkHover — the pointer is resting on a PLACED landmark (main.js writes
     * `{ key, q, r, kind, wants, filled, matched, complete }`; every field but `q`/`r` is read
     * defensively, because core is still settling the shape). It answers the same question
     * drawQuestFocus answers, in the same visual language: WHICH tiles does this thing want?
     *
     *   • the landmark's own hex: a gold tint and ring, breathing
     *   • a neighbour already feeding it (its facing edge carries the wanted terrain): a ring
     *     and tint in that terrain's own ink, so the answer is the colour of the answer
     *   • an empty neighbour still to fill: a faint dashed outline
     *
     * Nothing here is cached: it is six neighbours, only while a pointer rests on one tile.
     */
    function drawLandmarkHover(s, cam, view) {
      const lh = view.landmarkHover;
      const size = V().HEX_SIZE || 36;
      const wants = (typeof lh.wants === 'number') ? lh.wants : -1;
      const wantPal = PALETTE[wants] || null;
      const wantInk = (wantPal && wantPal.ink) || MARK_LANDMARK;
      const pulse = 0.5 + 0.5 * Math.sin((view.t || 0) * 3.2);
      const p = HG.Hex.toPixel(lh.q, lh.r, size);

      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // the landmark itself
      ctx.globalAlpha = 0.15 + 0.10 * pulse;
      ctx.fillStyle = MARK_LANDMARK;
      hexPath(ctx, p.x, p.y, size * 0.98);
      ctx.fill();
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = MARK_LANDMARK;
      ctx.lineWidth = Math.max(2, size * 0.085);
      hexPath(ctx, p.x, p.y, size * (1.01 + 0.05 * pulse));
      ctx.stroke();

      // Wave 6: core names the cells that fed it and the empty hexes that still could, which
      // covers mixed landmarks (no single wanted terrain) and far sources (depot line, blooms).
      if (Array.isArray(lh.sources) && Array.isArray(lh.watch)) {
        ctx.strokeStyle = MARK_LANDMARK;
        ctx.fillStyle = MARK_LANDMARK;
        for (let i = 0; i < lh.sources.length; i++) {
          const c = HG.Hex.parse(lh.sources[i]), np = HG.Hex.toPixel(c[0], c[1], size);
          ctx.globalAlpha = 0.14 + 0.08 * pulse;
          hexPath(ctx, np.x, np.y, size * 0.96);
          ctx.fill();
          ctx.globalAlpha = 0.55 + 0.30 * pulse;
          ctx.lineWidth = Math.max(1.5, size * 0.055);
          hexPath(ctx, np.x, np.y, size * 0.92);
          ctx.stroke();
        }
        ctx.globalAlpha = 0.30 + 0.20 * pulse;
        ctx.lineWidth = Math.max(1, size * 0.045);
        ctx.setLineDash([size * 0.13, size * 0.15]);
        for (let i = 0; i < lh.watch.length; i++) {
          const c = HG.Hex.parse(lh.watch[i]), np = HG.Hex.toPixel(c[0], c[1], size);
          hexPath(ctx, np.x, np.y, size * 0.88);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        ctx.restore();
        return p;
      }

      const dirs = HG.Hex.DIRS;
      for (let d = 0; d < 6; d++) {
        const nq = lh.q + dirs[d][0], nr = lh.r + dirs[d][1];
        const np = HG.Hex.toPixel(nq, nr, size);
        const cell = s.board.cells.get(HG.Hex.key(nq, nr));
        if (cell) {
          // edge d of the landmark touches edge opp(d) of this neighbour
          const facing = cell.edges && cell.edges[HG.Hex.opp(d)];
          if (wants < 0 || facing !== wants) continue;
          ctx.setLineDash([]);
          ctx.globalAlpha = 0.14 + 0.08 * pulse;
          ctx.fillStyle = wantInk;
          hexPath(ctx, np.x, np.y, size * 0.96);
          ctx.fill();
          ctx.globalAlpha = 0.55 + 0.30 * pulse;
          ctx.strokeStyle = wantInk;
          ctx.lineWidth = Math.max(1.5, size * 0.055);
          hexPath(ctx, np.x, np.y, size * 0.92);
          ctx.stroke();
        } else {
          // still to fill: the same dashed language the frontier already speaks
          ctx.globalAlpha = 0.30 + 0.20 * pulse;
          ctx.strokeStyle = wantInk;
          ctx.lineWidth = Math.max(1, size * 0.045);
          ctx.setLineDash([size * 0.13, size * 0.15]);
          hexPath(ctx, np.x, np.y, size * 0.88);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      ctx.restore();
      return p;
    }

    /**
     * When the focused quest is off screen the highlight is invisible, which is exactly when
     * the player most needs it — so a chevron rides the edge of the viewport pointing at it.
     * Drawn in SCREEN space, after the world transform is unwound.
     */
    function drawFocusPointer(cam, wp, terrain) {
      const sp = cam.worldToScreen(wp.x, wp.y);
      const m = 34;
      if (sp.x >= m && sp.x <= R.w - m && sp.y >= m && sp.y <= R.h - m) return;
      const cx = R.w / 2, cy = R.h / 2;
      const dx = sp.x - cx, dy = sp.y - cy;
      const scale = Math.min((R.w / 2 - m) / Math.max(1, Math.abs(dx)),
                             (R.h / 2 - m) / Math.max(1, Math.abs(dy)));
      const x = cx + dx * scale, y = cy + dy * scale;
      const pal = PALETTE[terrain] || PALETTE[T.PLAIN];
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.atan2(dy, dx));
      ctx.fillStyle = pal.ink || pal.fill || '#3d3a34';
      ctx.globalAlpha = 0.92;
      ctx.beginPath();
      ctx.moveTo(13, 0); ctx.lineTo(-8, 9); ctx.lineTo(-8, -9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    /** The soft shadow that lifts the landscape off the table. One drawImage, world space. */
    function drawBoardShadow(s, cam) {
      const sp = shadowFor();
      if (!sp || !cam.worldBox || !s.board.bounds) return;
      const size = V().HEX_SIZE || 36;
      const cfg = Renderer.CFG;
      const b = cam.worldBox(s.board.bounds);
      if (!b || !isFinite(b.x0)) return;
      const grow = size * cfg.SHADOW_GROW, drop = size * cfg.SHADOW_DROP;
      ctx.globalAlpha = cfg.SHADOW_ALPHA;
      ctx.drawImage(sp, b.x0 - grow, b.y0 - grow + drop,
        (b.x1 - b.x0) + grow * 2, (b.y1 - b.y0) + grow * 2);
      ctx.globalAlpha = 1;
    }

    // ---- the season crossfade ---------------------------------------------
    //
    // A season change repaints every cell, so the palette would otherwise swap between two
    // frames. Instead the old cache is copied off (three or four times a run — not a per-frame
    // cost) and blitted over the new one at a falling alpha.

    let fade = null;

    function snapshotCache() {
      if (typeof document === 'undefined') return null;
      if (!cur.canvas || !(cur.scale > 0)) return null;
      const c = document.createElement('canvas');
      c.width = cur.canvas.width; c.height = cur.canvas.height;
      const g = c.getContext('2d');
      if (!g) return null;
      g.drawImage(cur.canvas, 0, 0);
      return {
        canvas: c, x0: cur.x0, y0: cur.y0, frames: 0, t0: 0,
        w: cur.canvas.width / cur.scale, h: cur.canvas.height / cur.scale,
      };
    }

    /**
     * The new season SWEEPS out from the tile that turned it: the old landscape is drawn only
     * outside a growing circle, with a soft three-step band at the front (each step a clip +
     * one blit, so ~4 blits a frame for under two seconds, a few times a run).
     */
    function drawSeasonFade(view) {
      const clk = Renderer.seasonClock;
      const dur = clk && clk.fade > 0 ? clk.fade : Renderer.CFG.SEASON_FADE > 0 ? Renderer.CFG.SEASON_FADE : 1.7;
      const u = ((view.t || 0) - fade.t0) / dur;
      // The frame counter is the backstop: a driving script (or a paused pane) can hand the
      // renderer the same `t` forever, and a stuck fade would freeze the old season on screen.
      if (u < 0 || u >= 1 || ++fade.frames > 600) { fade = null; return; }
      const e = u * u * (3 - 2 * u);
      const band = fade.reach * 0.3;
      const r0 = e * (fade.reach + band) - band;      // the front: fully new season inside it
      const x0 = fade.x0, y0 = fade.y0, w = fade.w, h = fade.h;
      for (let k = 0; k < 3; k++) {
        const r = r0 + band * k / 3;
        ctx.save();
        ctx.beginPath();
        ctx.rect(x0, y0, w, h);
        if (r > 0) ctx.arc(fade.ox, fade.oy, r, 0, TAU, true);
        ctx.clip('evenodd');
        // The three layers stack: 1 - (1-a)^3 ≈ 1 out past the band, stepping down inside it.
        ctx.globalAlpha = (k === 0 ? 0.42 : k === 1 ? 0.5 : 1);
        ctx.drawImage(fade.canvas, x0, y0, w, h);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    /** World point of the last tile placed (Map order is insertion order), or the board centre. */
    function lastPlacedPoint(s, snap) {
      let last = null;
      s.board.cells.forEach(function (c) { last = c; });
      if (last && s.placed > 0) return HG.Hex.toPixel(last.q, last.r, V().HEX_SIZE || 36);
      return { x: snap.x0 + snap.w / 2, y: snap.y0 + snap.h / 2 };
    }

    // ---- the frame -------------------------------------------------------

    R.draw = function (s, cam, view) {
      view = view || {};
      R.stats.cellsCached = 0; R.stats.liveCells = 0;

      // The season is a pure function of s.placed, so it needs no event: the renderer simply
      // notices. The old landscape is snapshotted and cross-faded over the new palette, which
      // turns what would be a one-frame flicker into weather rolling in.
      if (s && s.board) {
        const si = Renderer.seasonOf(s);
        if (si !== R.season) {
          if (R.season >= 0) {
            const snap = snapshotCache();
            if (snap) {
              snap.t0 = view.t || 0;
              const o = lastPlacedPoint(s, snap);
              snap.ox = o.x; snap.oy = o.y;
              snap.reach = Math.max(
                Math.hypot(o.x - snap.x0, o.y - snap.y0), Math.hypot(o.x - snap.x0 - snap.w, o.y - snap.y0),
                Math.hypot(o.x - snap.x0, o.y - snap.y0 - snap.h), Math.hypot(o.x - snap.x0 - snap.w, o.y - snap.y0 - snap.h));
              fade = snap;
            }
          }
          Renderer.applySeason(si);
          R.season = si;
          bannerSprites.clear();
          buildBg();
          R.invalidate();
        }
      }

      const dpr = R.dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalAlpha = 1;
      if (bgLayer) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(bgLayer, 0, 0, R.w, R.h);
      } else {
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, R.w, R.h);
      }
      if (!s || !s.board) return;

      cam.resize(R.w, R.h);
      updateCache(s, cam);

      ctx.save();
      ctx.translate(R.w / 2, R.h / 2);
      ctx.scale(cam.zoom, cam.zoom);
      ctx.translate(-cam.x, -cam.y);

      // The landscape's shadow on the table, under everything it contains.
      drawBoardShadow(s, cam);

      // The cached landscape: ONE blit. Mid-glide the cache is blitted scaled rather than
      // rebuilt, which is what keeps a wheel zoom as cheap as a resting frame.
      const size = V().HEX_SIZE || 36;
      const haveCache = !!(cur.canvas && cur.state === s && cur.scale > 0);
      ctx.imageSmoothingEnabled = true;
      if (haveCache) {
        ctx.drawImage(cur.canvas, cur.x0, cur.y0, cur.canvas.width / cur.scale, cur.canvas.height / cur.scale);
      } else if (building && bld.canvas && bld.state === s && bld.scale > 0) {
        // Cold start (a new run, a resize, an invalidate): there is nothing to blit but the
        // half-built layer. Blit it as it fills — the landscape appears over ceil(N/budget)
        // frames instead of costing one enormous frame, and no cell is ever rasterised twice.
        ctx.drawImage(bld.canvas, bld.x0, bld.y0, bld.canvas.width / bld.scale, bld.canvas.height / bld.scale);
      }

      // Whatever the cache does not have: the strip a pan just exposed, or (with no cache at
      // all) the whole visible board.
      if (haveCache || !building) {
        // While a build is in flight the missing cells are moments away, so the live pass is
        // capped at the same budget: a fast zoom-out fills its new margin over a few frames
        // instead of rasterising the whole landscape twice in one.
        const cap = building ? (V().CACHE_CELLS_PER_FRAME || 60) : Infinity;
        const vis = visibleCells(s, cam, []);
        for (let i = 0; i < vis.length && R.stats.liveCells < cap; i++) {
          const cell = vis[i];
          if (haveCache && cur.drawn.has(cell.key)) continue;
          const p = HG.Hex.toPixel(cell.q, cell.r, size);
          drawTile(ctx, p.x, p.y, size, cell.edges, {
            q: cell.q, r: cell.r, detail: cam.zoom * dpr,
            landmark: cell.tile && cell.tile.landmark, sails: !animSails(),
          });
          R.stats.liveCells++;
        }
      }

      // The season crossfade: the previous season's landscape, letting go.
      if (fade) drawSeasonFade(view);

      // render/anim.js (wave 5) — water glints, trains, boats, chimney smoke. It draws INSIDE
      // the world transform (unlike HG.FX, which owns its own), on top of the landscape and
      // under every piece of UI. Optional: the module may be absent.
      if (HG.Anim && HG.Anim.draw) {
        ctx.save();
        HG.Anim.draw(ctx, s, cam, view);
        ctx.restore();
      }

      // frontier hints: only while the player is choosing, or at the very start of a run
      if (view.hover || s.placed <= 1) drawFrontier(s, cam);

      // The edge marks are deliberately NOT spun with the tile: they describe the fit the
      // destination orientation makes with the neighbours, so they hold still and the tile
      // turns to meet them.
      if (view.hover) drawGhost(s, view.hover, +(view.spin || 0));

      // Under the banners, so a lit group never hides its own quest pill.
      let focusPt = null;
      if (view.focus && view.focus.key) focusPt = drawQuestFocus(s, cam, view);
      if (view.landmarkHover && typeof view.landmarkHover.q === 'number') {
        drawLandmarkHover(s, cam, view);
      }

      drawQuestBanners(s, cam);

      ctx.restore();

      if (focusPt) drawFocusPointer(cam, focusPt, view.focus.terrain);
    };

    /** Force the next frame to rebuild from scratch (palette change, new run, DPR change). */
    R.invalidate = function () {
      cur.state = null; cur.drawn.clear();
      building = false; queue = null; queued.clear(); qi = 0; lastPlaced = -1; lastState = null;
    };

    /**
     * Forget every baked canvas. A GPU reset (driver hiccup, sleep/resume, TDR) wipes the
     * pixels of EVERY canvas but leaves this module believing its layers are built — the
     * background, the world cache and the sprites all blit as black forever. main.js calls this
     * on the board canvas's `contextrestored`; harness/gpu-loss.mjs is the repro.
     */
    R.dropCaches = function () {
      // Every baked canvas must be a FRESH element: the first draw into a lost one sets off its
      // own late restore, which wipes that draw (harness/gpu-loss.mjs; _dev/gpu-loss-survey).
      bgLayer = null; bgKey = ''; buildBg();
      cur.canvas = cur.ctx = null; bld.canvas = bld.ctx = null;
      grainPattern = null; grainTried = false;
