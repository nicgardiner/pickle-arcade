    if (want === ducked) return;
    ducked = want;
    if (HG.Audio && HG.Audio.duck) HG.Audio.duck(want);
  }

  function uiSound(name) {
    if (HG.Audio && HG.Audio.ui) HG.Audio.ui(name);
  }

  // =====================================================================================
  // Hover
  // =====================================================================================

  function clearHover() { view.hover = null; hoverKey = ''; }

  /**
   * Recompute the ghost. The key folds in everything the result depends on — hex, rotation,
   * the tile in hand and how many tiles are down — so a frame where nothing moved costs a
   * string compare instead of a Score.evaluate.
   */
  function recomputeHover() {
    if (!s || s.status !== 'playing' || hoverQ === null || !s.queue.length) { clearHover(); return; }
    const tile = s.queue[0];
    const k = hoverQ + ',' + hoverR + '|' + rot + '|' + tile.id + '|' + s.placed;
    if (k === hoverKey) return;
    hoverKey = k;
    if (!HG.Board.isLegal(s.board, hoverQ, hoverR)) { view.hover = null; return; }
    const edges = HG.Tiles.rotate(tile.edges, rot);
    view.hover = { q: hoverQ, r: hoverR, edges: edges, res: HG.Score.evaluate(s, hoverQ, hoverR, edges) };
  }

  function setHover(q, r) {
    if (q === null || q === undefined) { hoverQ = hoverR = null; clearHover(); return; }
    const moved = (q !== hoverQ || r !== hoverR);
    hoverQ = q; hoverR = r;
    recomputeHover();
    // A tick only when the cursor lands on a hex the tile can actually go on — a sound on
    // every mouse move would be noise, and on an illegal hex it would be a lie.
    if (moved && view.hover) uiSound('hover');
  }

  function rotate(dir) {
    const d = (dir | 0) < 0 ? -1 : 1;
    rot = ((rot + (dir | 0)) % 6 + 6) % 6;
    view.rot = rot;
    // Start the turn. `rot` is already the DESTINATION — the in-between frames are drawn by
    // spinning the finished art back toward where it came from (see updateSpin), so the
    // hover evaluation and the placement stay on the real rotation the whole way.
    spinAt = clock;
    spinDir = d;
    updateSpin();
    recomputeHover();
    uiSound('rotate');
  }

  /**
   * Advance the rotation flourish. `view.spin` is the offset the drawn tile still has to
   * travel, in 60° steps and signed: it starts at −dir (one full step behind the destination),
   * eases to 0, and is 0 whenever nothing is turning. Ease-out, so the tile leaves fast and
   * settles onto its final orientation rather than creeping into it.
   */
  function updateSpin() {
    if (spinAt < 0) { view.spin = 0; return; }
    const dur = (HG.C.VIEW.ROT_SPIN_SEC || 0.13);
    const p = dur > 0 ? (clock - spinAt) / dur : 1;
    if (p >= 1 || !(p >= 0)) { spinAt = -1; spinDir = 0; view.spin = 0; return; }
    const e = 1 - (1 - p) * (1 - p);      // ease-out quad
    view.spin = -spinDir * (1 - e);
  }

  // =====================================================================================
  // Events — wave 2 drains them and throws them away. fx.js / audio.js are wave 4 and are
  // feature-checked, so this same drain keeps working once they land.
  // =====================================================================================

  function drainEvents() {
    if (!s || !s.events.length) return;
    const evs = s.events.splice(0, s.events.length);
    for (let i = 0; i < evs.length; i++) {
      const e = evs[i];
      if (HG.FX && HG.FX.event) HG.FX.event(e, s, view);
      if (demo) continue;              // the attract board is silent and never ends a run
      if (HG.Audio && HG.Audio.event) HG.Audio.event(e, s);
      launcherStats(e);
      if (e.type === 'over') onOver();
    }
    if (!demo && screens && screens.recordBest) screens.recordBest(s);
  }

  /**
   * The launcher's stats + achievements (games.json "hedgerows"). GameSDK is absent when the
   * page runs standalone, so everything is feature-checked. Replayed saves never reach here:
   * startRun clears the replay's events.
   */
  function launcherStats(e) {
    const G = window.GameSDK;
    if (!G) return;
    const st = s.stats;
    if (e.type === 'place') {
      G.incrementStat('total_tiles');
      if (st.landmarksPlaced > lmSeen) { G.incrementStat('total_landmarks', st.landmarksPlaced - lmSeen); lmSeen = st.landmarksPlaced; }
      if (st.questsDone > qSeen) { G.incrementStat('total_quests', st.questsDone - qSeen); qSeen = st.questsDone; }
      const all = G.getStats() || {};
      if (s.placed >= 45) G.unlockAchievement('four_seasons', 'Four Seasons');
      if ((all.total_tiles || 0) >= 400) G.unlockAchievement('long_road', 'The Long Road');
      if (s.score >= 5000) G.unlockAchievement('score_5k', 'Country Estate');
      if (s.score >= 15000) G.unlockAchievement('score_15k', 'Lord of the Manor');
      if ((all.total_quests || 0) >= 50) G.unlockAchievement('quests_50', 'Busy Parish');
    } else if (e.type === 'closure') {
      G.setStat('biggest_closure', e.size, true);
      if (e.size >= 8) G.unlockAchievement('walled_garden', 'Walled Garden');
    } else if (e.type === 'landmark') {
      if (e.complete) G.unlockAchievement('landmark_ring', 'Local Landmark');
    } else if (e.type === 'over') {
      G.incrementStat('total_runs');
      // One best per leaderboard mode (the card's local best); the daily's board is per-date.
      if (s.mode === 'journey') G.setStat('best_journey', s.score, true);
      if (s.mode === 'quickplay') G.setStat('best_quickplay', s.score, true);
      if (s.mode === 'hard') G.setStat('best_hard', s.score, true);
      G.setStat('most_tiles', s.placed, true);
      G.unlockAchievement('harvest_home', 'Harvest Home');
      if (s.mode === 'daily') G.unlockAchievement('daily_run', 'Morning Paper');
    }
  }
  let lmSeen = 0;                   // landmarks already counted into total_landmarks this run
  let qSeen = 0;                    // quests already counted into total_quests this run

  // The summary waits for the last placement's scoring cascade (HG.FX) to finish, then
  // OVER_DELAY more seconds, so the final tile's points land before the panel covers them
  // (Nic, 2026-09-23). OVER_MAX caps the wait in case an effect never settles.
  const OVER_DELAY = 2, OVER_MAX = 12;
  let overWait = null;              // { t0, settled } while a finished run waits for its summary
  function onOver() {
    if (input) input.setEnabled(false);
    clearHover();
    overWait = { t0: clock, settled: 0 };
  }

  /** Called every frame: shows the summary once the finished run's effects have settled. */
  function checkOver() {
    if (!overWait) return;
    if (!s || s.status !== 'over') { overWait = null; return; }
    const busy = HG.FX && ((HG.FX.pending && HG.FX.pending() > 0) || (HG.FX.active && HG.FX.active() > 0));
    if (busy && clock - overWait.t0 < OVER_MAX) { overWait.settled = 0; return; }
    if (!overWait.settled) overWait.settled = clock;
    if (clock - overWait.settled < OVER_DELAY && clock - overWait.t0 < OVER_MAX) return;
    overWait = null;
    // The run is finished, so the HUD has nothing left to say — and leaving it up parked the
    // last quest rows (several of them just-completed) beside the summary panel for good.
    if (hud) hud.setVisible(false);
    if (screens) screens.show('summary', s);
    syncDuck();
  }

  /** The summary's "View map": the panel steps aside and the finished board can be panned. */
  function peekMap(on) {
    if (!screens || !s || s.status !== 'over') return;
    screens.peek(on);
    if (input) input.setEnabled(on);
  }

  // =====================================================================================
  // The run
  // =====================================================================================

  function place(q, r) {
    if (!s || s.status !== 'playing') return null;
    if (!HG.Board.isLegal(s.board, q, r)) return null;
    const res = HG.Board.place(s, q, r, rot);
    // The tile that was turning is on the board now; the next one must not inherit its spin.
    spinAt = -1; spinDir = 0; view.spin = 0;
    drainEvents();
    // The head tile changed, so the ghost is stale even if the cursor never moved.
    hoverKey = '';
    recomputeHover();
    if (input && input.refresh) input.refresh();
    return res;
  }

  function newRun(mode, seed) {
    const sd = (seed === undefined || seed === null || !isFinite(seed)) ? HG.Screens.randomSeed() : (seed | 0);
    return startRun(HG.createState(sd, mode || 'journey'));
  }

  // =====================================================================================
  // Save & continue — one slot PER MODE (2026-09-23: a long Journey can sit saved while you
  // play a Daily). Seed + mode + history fully determine a run (state.js), so a save is just
  // those and Continue is HG.replay. A slot is consumed on Continue (a suspend save, not a
  // checkpoint). A Daily save is dropped once its UTC day is over. Save & quit is the only way out of a run, and closing the
  // window mid-run saves too, so nothing is ever lost.
  // =====================================================================================

  const SAVE_MODES = ['journey', 'quickplay', 'hard', 'daily'];
  const saveKey = function (mode) { return 'hedgerows_save_' + mode; };

  function validSave(v) {
    return !!(v && v.v === 1 && isFinite(v.seed) && typeof v.mode === 'string' && Array.isArray(v.history));
  }

  // The old single slot ('hedgerows_save') moves into its mode's slot once.
  try {
    const old = JSON.parse(localStorage.getItem('hedgerows_save'));
    if (validSave(old) && SAVE_MODES.indexOf(old.mode) >= 0 && !localStorage.getItem(saveKey(old.mode))) {
      localStorage.setItem(saveKey(old.mode), JSON.stringify(old));
    }
    localStorage.removeItem('hedgerows_save');
  } catch (e) { /* no storage, or garbage: nothing to move */ }

  function clearSave(mode) { try { localStorage.removeItem(saveKey(mode)); } catch (e) { /* ignore */ } }

  /** The run saved for `mode`, or — with no mode — the most recently saved one. */
  function readSave(mode) {
    if (!mode) return latestSave();
    try {
      const v = JSON.parse(localStorage.getItem(saveKey(mode)));
      if (!validSave(v)) return null;
      if (v.mode === 'daily' && !(v.daily && v.daily.date === HG.Screens.todayUTC())) { clearSave(mode); return null; }
      return v;
    } catch (e) { /* no storage, or garbage: no save */ }
    return null;
  }

  function latestSave() {
    let best = null;
    SAVE_MODES.forEach(function (m) { const v = readSave(m); if (v && (!best || (v.at || 0) > (best.at || 0))) best = v; });
    return best;
  }

  function saveSummary(v) { return v && { mode: v.mode, score: v.score | 0, placed: v.placed | 0, at: v.at || 0 }; }

  let runSaved = false;          // the live run is already in the slot (or there is none to save)

  function saveAndExit() {
    if (!s || s.status !== 'playing' || runSaved) return;
    runSaved = true;
    try {
      localStorage.setItem(saveKey(s.mode), JSON.stringify({
        v: 1, at: Date.now(), seed: s.seed, mode: s.mode, score: s.score, placed: s.placed,
        daily: screens && screens.dailyRun,
        history: s.history.map(function (h) { return [h.q, h.r, h.rot, h.tileId]; }),
      }));
    } catch (e) { console.warn('[hedgerows] could not save the run', e); }
    toTitle();
  }

  // Closing the window mid-run is leaving too: save it so Continue picks it up.
  window.addEventListener('pagehide', function () { if (!runSaved) saveAndExit(); });

  function continueRun(mode) {
    const v = readSave(mode);
    if (v) clearSave(v.mode);
    if (!v) { toTitle(); return null; }
    let st;
    try {
      st = HG.replay(v.seed, v.mode, v.history.map(function (h) { return { q: h[0], r: h[1], rot: h[2], tileId: h[3] }; }));
    } catch (e) {
      // A save from an older ruleset no longer replays; drop it rather than wedge the title.
      console.warn('[hedgerows] saved run no longer replays — discarded', e);
      toTitle();
      return null;
    }
    if (screens) screens.setDailyRun(v.daily || null);
    return startRun(st);
  }

  function startRun(state) {
    setDemo(false);
    s = state;
    runSaved = false;
    bot = null;
    rot = 0;
    view.rot = 0;
    spinAt = -1; spinDir = 0; view.spin = 0;
    view.focus = null;
    rowFocus = null;
    if (HG.FX && HG.FX.reset) HG.FX.reset();
    if (HG.Anim && HG.Anim.reset) HG.Anim.reset();
    hoverQ = hoverR = null;
    pointQ = pointR = null;
    view.landmarkHover = null;
    clearHover();
    paused = false;
    s.events.length = 0;              // the origin placement's events belong to nobody
    lmSeen = s.stats.landmarksPlaced; // a continued run's landmarks were counted before the save
    qSeen = s.stats.questsDone;       // ...and its quests
    if (hud) { hud.reset(s); hud.setVisible(true); }
    if (screens) screens.hide();
    // snap (the third argument): a new run has no history to glide away from, and cam.update
    // clamps dt, so easing there would leave the first frame framed on the previous run.
    render(0);                        // sizes the tray's tile canvases before it is measured
    syncInset();
    if (cam) cam.fitBounds(s.board.bounds, HG.C.VIEW.FIT_PAD, true);
    if (input) input.setEnabled(true);
    syncDuck();
    render(0);
    // The draw above computed the new run's season; mirror it now so the DOM chrome wears the
    // opening palette on the very first frame instead of the previous run's.
    lastSeason = -1;
    syncSeason();
    return s;
  }

  function pause() {
    if (!s || s.status !== 'playing' || paused) return;
    paused = true;
    if (input) input.setEnabled(false);
    if (screens) screens.show('pause');
    syncDuck();
  }

  function resume() {
    if (!paused) return;
    paused = false;
    if (screens) screens.hide();
    if (input) input.setEnabled(true);
    syncDuck();
  }

  function toTitle() {
    paused = false;
    if (input) input.setEnabled(false);
    if (hud) hud.setVisible(false);
    startDemo();
    if (screens) screens.show('title');
    syncDuck();
  }

  // =====================================================================================
  // Attract mode
  // =====================================================================================

  function setDemo(on) {
    demo = on;
    if (HG.FX && HG.FX.event) HG.FX.quiet = on;
    if (canvas) {
      canvas.parentNode.classList.toggle('attract', on);
      canvas.classList.remove('fading');
    }
    if (!on) {
      // Bank where the title's year had got to, so the next visit picks up from there.
      if (demoBot && s && HG.Renderer.seasonClock) demoYear = HG.Renderer.seasonClock.offset + s.placed;
      HG.Renderer.seasonClock = null;
      demoBot = null; demoFade = 0; demoHold = 0; demoPan = null; demoZoom = null;
    }
  }

  /** A fresh landscape for the title. `runSaved` stays true so pagehide never saves it. */
  function startDemo() {
    if (!HG.createState || !HG.Autopilot) return;
    setDemo(true);
    demoFade = 0;                     // else the restart check fires again next frame, forever
    demoHold = 0;
    demoPan = null;
    demoZoom = null;
    syncInset();
    s = HG.createState(HG.Screens.randomSeed(), 'journey');
    s.C = Object.assign({}, s.C, { LANDMARK_RATE: DEMO_LANDMARK_RATE });   // own copy: s.C is HG.C
    s.stack += DEMO_EXTRA;
    runSaved = true;
    s.events.length = 0;
    demoBot = HG.Autopilot.create(s, { style: 'greedy' });
    for (let i = 0; i < DEMO_WARM && demoBot.step(s); i++) { /* warm start */ }
    // Continue the title's year exactly where the last board left it: a restart halfway through
    // summer opens halfway through summer.
    const C = HG.Renderer.CFG;
    HG.Renderer.seasonClock = { every: C.SEASON_EVERY * DEMO_SEASON, offset: demoYear - s.placed, fade: C.SEASON_FADE * DEMO_SEASON };
    s.events.length = 0;
    if (HG.FX && HG.FX.reset) HG.FX.reset();
    if (HG.Anim && HG.Anim.reset) HG.Anim.reset();
    view.focus = null;
    rowFocus = null;
    clearHover();
    demoNext = clock + DEMO_STEP;
    if (cam) cam.fitBounds(s.board.bounds, HG.C.VIEW.FIT_PAD, true);
  }

  /**
   * One bot placement per DEMO_STEP; a full (or finished) board holds DEMO_HOLD s, then zooms
   * into its starting tile over DEMO_ZOOM_SEC, fades out (the wipe) and starts over.
   */
  function tickDemo() {
    if (!demo || !s) return;
    if (demoFade) {
      if (clock - demoFade > 0.9) {
        demoYear = HG.Renderer.seasonClock ? HG.Renderer.seasonClock.offset + s.placed : 0;
        startDemo(); render(0);
      }
      return;
    }
    if (demoZoom) {
      if (zoomToStart()) { demoFade = clock; canvas.classList.add('fading'); }
      return;
    }
    if (demoHold) {                   // the finished landscape sits on screen a while first
      if (clock >= demoHold) { beginZoom(); return; }
      holdPan();
      return;
    }
    if (clock < demoNext) return;
    demoNext = clock + DEMO_STEP;
    if (s.placed + 1 >= DEMO_MAX || s.status !== 'playing' || !demoBot.step(s)) demoHold = clock + DEMO_HOLD;
  }

  /**
   * While a finished attract board holds, the camera wanders a little so the title never goes
   * still (Nic, 2026-09-23): a slow two-axis sway of DEMO_PAN of the view's width plus a
   * DEMO_PUSH push-in, both eased in over the first 2 s. cam.update eases toward the target.
   */
  const DEMO_PAN = 0.035, DEMO_PUSH = 0.04;
  function holdPan() {
    if (!cam) return;
    if (!demoPan) demoPan = { t0: clock, x: cam.tx, y: cam.ty, z: cam.tzoom };
    const t = clock - demoPan.t0;
    const u = Math.min(1, t / 2), ease = u * u * (3 - 2 * u);
    const a = DEMO_PAN * (cam.w / demoPan.z) * ease;
    cam.tx = demoPan.x + a * Math.sin(t * 0.5);
    cam.ty = demoPan.y + a * 0.6 * Math.sin(t * 0.37 + 0.8) - a * 0.6 * Math.sin(0.8) * ease;
    cam.tzoom = demoPan.z * (1 + DEMO_PUSH * Math.min(1, t / DEMO_HOLD));
    cam._anchor = null;
  }

  /**
   * The dive: zoom (in log space, so the push feels steady) from wherever the hold's wander left
   * the camera into the run's first tile, whose screen position glides to the centre as it goes.
   * The camera is driven directly — target and current together — so cam.update adds no lag.
   */
  function beginZoom() {
    if (!cam) { demoFade = clock; return; }
    const p = HG.Hex.toPixel(0, 0, HG.C.VIEW.HEX_SIZE || 36);     // a run's start tile is at 0,0
    const sp = cam.worldToScreen(p.x, p.y);
    cam._fit = null;                  // a resize mid-dive must not snap back to the fit
    demoZoom = { t0: clock, lz0: Math.log(cam.zoom), sx0: sp.x, sy0: sp.y, wx: p.x, wy: p.y };
  }

  /** One step of the dive; true once it has arrived. */
  function zoomToStart() {
    const z = demoZoom;
    const u = Math.min(1, (clock - z.t0) / DEMO_ZOOM_SEC);
    const e = 0.5 - 0.5 * Math.cos(Math.PI * u);                     // ease in and out
    const zoom = Math.exp(z.lz0 + (Math.log(cam.clampZoom(DEMO_ZOOM_TO)) - z.lz0) * e);
    const sx = z.sx0 + (cam.w / 2 - z.sx0) * e, sy = z.sy0 + (cam.h / 2 - z.sy0) * e;
    cam.zoom = cam.tzoom = zoom;
    cam.x = cam.tx = z.wx - (sx - cam.w / 2) / zoom;
    cam.y = cam.ty = z.wy - (sy - cam.h / 2) / zoom;
    cam._anchor = null;
    return u >= 1;
  }

  /** Escape: close the pause screen if it is the one open, otherwise open it. */
  function onMenu() {
    if (!screens) return;
    if (screens.current === 'pause') { resume(); return; }
    if (screens.current) return;       // title and summary own their own buttons
    pause();
  }

  // =====================================================================================
  // Frame
  // =====================================================================================

  function resize() {
    if (!canvas) return;
    const w = Math.max(1, canvas.clientWidth || window.innerWidth);
    const h = Math.max(1, canvas.clientHeight || window.innerHeight);
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    if (R && R.resize) R.resize(w, h, dpr);
    if (cam && cam.resize) cam.resize(w, h);
    syncInset();
    render(0);
  }

  /** Keep the camera's framing clear of the queue tray (nothing covers the attract board). */
  function syncInset() {
    if (!cam) return;
    const tray = hudRoot && hudRoot.querySelector('.hud-tray');
    cam.insetBottom = (!demo && tray) ? tray.offsetHeight + 16 + (devbar ? devbar.height() : 0) : 0;
  }

  /** Draw exactly one frame, synchronously. `dt` advances the clock the HUD tweens against. */
  function render(dt) {
    const step = (typeof dt === 'number') ? dt : 1 / 60;
    clock += step;
    view.t = clock;
    view.rot = rot;
    updateSpin();
    view.dpr = (R && R.dpr) || 1;
    if (cam) {
      cam.update(step);
      // (not during the attract board's hold — holdPan owns the camera then)
      if (s && !paused && s.status === 'playing' && cam.drift && !(demo && demoHold)) cam.drift(s, step);
    }
    // R.season is computed inside R.draw, so it is mirrored here from the PREVIOUS draw —
    // one frame behind on paper, but before the HUD reads it, which is what matters: the HUD
    // must never see a new run's first frame with the old run's season as its baseline.
    syncSeason();
    syncLandmarkHover();
    syncQuestHover();
    checkOver();
    // The dev bar acts only on a live, unpaused player run — never on the attract board's bot
    // run. It may swap the tile in hand (Hold), so it runs before the HUD reads the queue.
    if (devbar && devbar.update(s, !!s && !demo && !paused && s.status === 'playing' &&
                                !(screens && screens.current))) syncInset();
    if (hud && s && !demo) hud.update(s, view);
    if (R && R.draw) R.draw(s, cam, view);
    // FX sits ON TOP of the board and owns its own transform, so it must run after R.draw.
    // Its clock is advanced only here, by the same dt — never by wall time — which is what
    // lets window.__hedge.render(dt) step an effect deterministically with rAF stalled.
    if (HG.FX && HG.FX.update) HG.FX.update(step);
    if (HG.FX && HG.FX.draw && R && R.ctx && cam) HG.FX.draw(R.ctx, cam, view);
  }

  function frame(now) {
    raf = window.requestAnimationFrame(frame);
    const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0;
    lastFrame = now;
    if (s) drainEvents();
    tickDemo();
    render(dt);
  }

  // =====================================================================================
  // Boot
  // =====================================================================================

  function boot() {
    if (booted) return;
    booted = true;
    canvas = document.getElementById('board');
    hudRoot = document.getElementById('hud');
    screenRoot = document.getElementById('screens');
    if (!canvas) { console.error('[hedgerows] no #board canvas'); return; }
    if (!HG.Camera || !HG.Renderer) {
      console.error('[hedgerows] render/camera.js and render/renderer.js are required');
      return;
    }

    // HG.Renderer.CSS_VARS is the single source for the palette: push it onto :root so the
    // HUD's swatches and the screens' accents are literally the board's own colours, and
    // style.css's own values are only what shows before this runs.
    if (HG.Renderer.CSS_VARS) {
      const root = document.documentElement;
      Object.keys(HG.Renderer.CSS_VARS).forEach(function (k) {
        root.style.setProperty(k, HG.Renderer.CSS_VARS[k]);
      });
    }
    cam = HG.Camera.create({
      w: canvas.clientWidth || window.innerWidth,
      h: canvas.clientHeight || window.innerHeight,
    });
    R = HG.Renderer.create(canvas);

    hud = HG.Hud.create(hudRoot, {
      onZoom: function (dir) {
        if (!cam) return;
        cam.zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, dir > 0 ? 1.18 : 1 / 1.18);
        if (cam.userTouched) cam.userTouched();
      },
      onMenu: pause,
      // Pointing at a quest row lights its group up on the board; clicking glides the camera
      // to its anchor. The zoom is left alone on purpose — a jump in scale loses the player.
      onQuestFocus: function (quest) {
        rowFocus = (quest && quest.key)
          ? { key: quest.key, terrain: quest.terrain }
          : null;
        view.focus = rowFocus;
      },
      onQuestGoto: function (quest) {
        if (!quest || !quest.key || !cam || !cam.lookAt) return;
        const qr = HG.Hex.parse(quest.key);
        const p = HG.Hex.toPixel(qr[0], qr[1], HG.C.VIEW.HEX_SIZE || 36);
        cam.lookAt(p.x, p.y);
        uiSound('click');
      },
    });
    hud.setVisible(false);

    if (HG.Devbar) {
      devbar = HG.Devbar.create(document.getElementById('app') || canvas.parentNode, {
        // The tile in hand changed under the ghost: recompute it (the HUD keys on tile.id).
        refresh: function () { hoverKey = ''; recomputeHover(); if (input && input.refresh) input.refresh(); },
        // Renderer.draw notices a new seasonOverride itself; syncSeason then pushes the CSS.
        repaint: function () { render(0); syncSeason(); },
      });
    }

    screens = HG.Screens.create(screenRoot, {
      onStart: function (mode, seed) { newRun(mode, seed); },
      onResume: resume,
      onQuit: toTitle,
      onPeek: peekMap,
      onSaveExit: saveAndExit,
      onContinue: continueRun,
      onDeleteSave: function (mode) { const v = readSave(mode); if (v) clearSave(v.mode); },
      onExit: function () { window.close(); },  // the launcher's contract: exit = window.close()
      getSave: function (mode) { return saveSummary(readSave(mode)); },   // no mode ⇒ most recent
      getSaves: function () { const o = {}; SAVE_MODES.forEach(function (m) { const v = saveSummary(readSave(m)); if (v) o[m] = v; }); return o; },
    });

    input = HG.Input.attach(canvas, {
      cam: cam,
      getState: function () { return s; },
      onHover: setHover,
      onPoint: setPoint,
      onRotate: rotate,
      onPlace: place,
      onMenu: onMenu,
    });
    input.setEnabled(false);

    // The first real gesture anywhere on the page unlocks the AudioContext (browsers refuse to
    // start one otherwise). Capture phase + `once`, so it costs nothing after it has fired and
    // cannot be swallowed by the canvas or a screen button.
    document.addEventListener('pointerdown', unlockAudio, { capture: true, once: true });
    document.addEventListener('keydown', unlockAudio, { capture: true, once: true });

    // A GPU reset (driver hiccup, sleep/resume, device switch) wipes every canvas's pixels but
    // not the caches that think they're built: the board went black and stayed black. Chrome
    // restores the context itself; repaint everything we baked. Repro: harness/gpu-loss.mjs.
    canvas.addEventListener('contextrestored', function () {
      console.warn('[hedgerows] canvas context restored after a GPU reset — repainting caches');
      if (R.dropCaches) R.dropCaches();
      if (HG.Anim && HG.Anim._dropSprites) HG.Anim._dropSprites();
      if (HG.FX && HG.FX._dropSprites) HG.FX._dropSprites();
      if (hud && hud.repaint) hud.repaint();
    });

    window.addEventListener('resize', resize);
    // A `resize` event is not guaranteed: an iframe or a pane that lays the page out AFTER load
    // (or that only changes the element's box) fires nothing, and the canvas would sit at 1×1
    // forever. Observing the canvas itself catches every case.
    if (typeof ResizeObserver === 'function') {
      const ro = new ResizeObserver(function () { resize(); });
      ro.observe(canvas);
    }
    startDemo();
    resize();
    screens.show('title');
    syncDuck();
    raf = window.requestAnimationFrame(frame);
  }

  Game.newRun = newRun;
  Game.pause = pause;
  Game.resume = resume;
  Game.toTitle = toTitle;
  Game.render = render;
  Game.boot = boot;
  Object.defineProperty(Game, 'state', { get: function () { return s; } });
  // Exposed for debugging and for the harness: a driving script needs the camera to turn a
  // hex into the screen point it would click.
  Object.defineProperty(Game, 'cam', { get: function () { return cam; } });
  Object.defineProperty(Game, 'renderer', { get: function () { return R; } });
  Object.defineProperty(Game, 'input', { get: function () { return input; } });

  // =====================================================================================
  // window.__hedge — the driving hook (BUILD-PROMPT §8)
  // =====================================================================================

  const hedge = {
    get state() { return s; },
    /** Play n bot moves (greedy unless bot(style) said otherwise), then draw. */
    step: function (n) {
      const count = Math.max(1, n | 0);
      let done = 0;
      for (let i = 0; i < count; i++) {
        if (!s || s.status !== 'playing') break;
        if (!bot || bot.style !== botStyle) bot = HG.Autopilot.create(s, { style: botStyle });
        if (!bot.step(s)) break;
        done++;
      }
      drainEvents();
      hoverKey = '';
      recomputeHover();
      if (input && input.refresh) input.refresh();
      render(1 / 60);
      if (hud) hud.snapScore(s);       // no frames are running: settle the tween by hand
      return done;
    },
    place: function (q, r, r2) {
      if (r2 !== undefined && r2 !== null) { rot = ((r2 | 0) % 6 + 6) % 6; view.rot = rot; }
      const res = place(q, r);
      render(1 / 60);
      if (hud) hud.snapScore(s);
      return res;
    },
    rotate: function (dir) { rotate(dir === undefined ? 1 : dir); return rot; },
    hover: function (q, r) { setHover(q, r); return view.hover; },
    render: function (dt) { render(dt); return true; },
    score: function () { return s ? s.score : 0; },
    snapshot: function () {
      if (!s) return null;
      return {
        placed: s.placed,
        score: s.score,
        stack: s.stack,
        tilesLeft: s.stack + s.queue.length,
        queue: s.queue.map(function (t) { return t.edges.slice(); }),
        rot: rot,
        spin: view.spin,
        hover: view.hover ? {
          q: view.hover.q, r: view.hover.r,
          points: view.hover.res.points.total,
          perfect: view.hover.res.perfect,
          edge: view.hover.res.edge.slice(),
        } : null,
        over: s.status === 'over',
        mode: s.mode,
        seed: s.seed,
        quests: s.quests.filter(function (q) { return q.status === 'open'; })
          .map(function (q) { return { id: q.id, type: q.type, progress: q.progress, target: q.target }; }),
        stats: s.stats,
      };
    },
    newRun: function (mode, seed) { return !!newRun(mode, seed); },
    saveExit: saveAndExit,
    continueRun: function () { return !!continueRun(); },
    bot: function (style) { if (style) { botStyle = style; bot = null; } return botStyle; },
    /** Frontier hexes, sorted — handy when driving the game with no picture to look at. */
    legal: function () { return s ? HG.Board.legalMoves(s.board) : []; },
    /** Live effect count — the only way to see fx.js from a driving script. */
    fx: function () { return (HG.FX && HG.FX.active) ? HG.FX.active() : 0; },
    /** anim.js's last-frame stats (2D calls, animated cells) and the current season. */
    anim: function () { return (HG.Anim && HG.Anim.stats) ? HG.Anim.stats : null; },
    season: function () { return view.season; },
    /** Attract board: end the hold now, so the dive into the start tile begins next frame. */
    demoEnd: function () { if (demo) demoHold = clock; return demo; },
    camera: function () { return cam && { x: cam.x, y: cam.y, zoom: cam.zoom, diving: !!demoZoom, fading: !!demoFade }; },
    /**
     * Snap the camera around the whole landscape and redraw. The drift that normally does this
     * is deliberately slow and runs per frame; a scripted run has no frames (rAF is stalled in
     * the Browser pane), so a screenshot of one would otherwise be framed on the origin tile.
     */
    fit: function () {
      if (!s || !cam) return false;
      cam.fitBounds(s.board.bounds, HG.C.VIEW.FIT_PAD, true);
      render(1 / 60);
      return true;
    },
  };

  if (typeof window !== 'undefined') {
    window.__hedge = hedge;
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(globalThis.HG = globalThis.HG || {});


</script>
</body>
</html>
