    let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2246822519);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rnd(seed, a, b) { return hash32(seed, a, b) / 4294967296; }

  /** Point + tangent on a quadratic, written into `out` — no allocation in the frame loop. */
  const SCRATCH = { x: 0, y: 0, dx: 0, dy: 0 };
  function sampleSeg(sg, t, out) {
    const u = 1 - t;
    out.x = u * u * sg.p0.x + 2 * u * t * sg.cx + t * t * sg.p1.x;
    out.y = u * u * sg.p0.y + 2 * u * t * sg.cy + t * t * sg.p1.y;
    out.dx = 2 * u * (sg.cx - sg.p0.x) + 2 * t * (sg.p1.x - sg.cx);
    out.dy = 2 * u * (sg.cy - sg.p0.y) + 2 * t * (sg.p1.y - sg.cy);
    return out;
  }

  /**
   * A bridge's deck, as the band a boat passes UNDER: the tile's own rail line (straight, as
   * the layout's is — so it follows the tile's rotation for free) and a half-width `w`, taken
   * from the renderer's bridge anchor `{ deck: { x0, y0, x1, y1, hw } }` when it gives one,
   * else CFG.BRIDGE_DECK.
   * Returns { x, y, nx, ny, lo, hi } — a point on the line, its unit normal, and the covered
   * band as signed distances along that normal — or null.
   */
  function deckOf(cell, g, size, p, a) {
    if (!cell.tile || cell.tile.landmark !== 'bridge') return null;
    const rd = g.dirsOf(cell.edges, T.RAIL);
    if (rd.length !== 2 || (rd[0] + 3) % 6 !== rd[1]) return null;
    const d = a && a.deck;
    const hw = d ? (d.hw > 0 ? d.hw : (d.w > 0 ? d.w : 0)) : 0;
    const w = hw > 0 ? hw : size * C().BRIDGE_DECK;
    // the renderer's deck line when it gives one, else the rail's own
    const m0 = (d && isFinite(d.x0)) ? { x: d.x0, y: d.y0 } : g.edgeMid(p.x, p.y, size, rd[0]);
    const m1 = (d && isFinite(d.x1)) ? { x: d.x1, y: d.y1 } : g.edgeMid(p.x, p.y, size, rd[1]);
    const dx = m1.x - m0.x, dy = m1.y - m0.y, l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l;
    // The side wall hangs `h` below the deck edge nearer the viewer (screen-down), and the
    // river comes out from its arch — so on that side the covered band reaches further.
    const wall = (d && d.h > 0 ? d.h : size * C().BRIDGE_WALL) * Math.abs(ny);
    return { x: (m0.x + m1.x) / 2, y: (m0.y + m1.y) / 2, nx: nx, ny: ny,
      lo: ny > 0 ? -w : -w - wall, hi: ny > 0 ? w + wall : w };
  }

  // ---------------------------------------------------------------- sprites
  //
  // One small offscreen canvas per colour, built once. Everything soft in this module is a
  // blit of one of these (1 2D call); with no document (Node) they degrade to a flat disc
  // (beginPath + arc + fill = 3), which still fits every budget.

  const sprites = new Map();
  function softSprite(rgb, core) {
    const key = rgb + '|' + core;
    if (sprites.has(key)) return sprites.get(key);
    let cv = null;
    if (C().SPRITE && typeof document !== 'undefined' && document.createElement) {
      try {
        const px = Math.max(8, C().SPRITE_PX | 0);
        const el = document.createElement('canvas');
        el.width = px; el.height = px;
        const g = el.getContext('2d');
        const grad = g.createRadialGradient(px / 2, px / 2, 0, px / 2, px / 2, px / 2);
        grad.addColorStop(0, 'rgba(' + rgb + ',1)');
        grad.addColorStop(core, 'rgba(' + rgb + ',' + (0.55).toFixed(2) + ')');
        grad.addColorStop(1, 'rgba(' + rgb + ',0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, px, px);
        cv = el;
      } catch (err) {
        cv = null;
      }
    }
    sprites.set(key, cv);
    return cv;
  }
  Anim._dropSprites = function () { sprites.clear(); };

  /** A soft blob. rx/ry are HALF-extents in world px. 1 call with a sprite, 3 without. */
  function blob(ctx, x, y, rx, ry, rgb, alpha, st) {
    if (!(alpha > 0.004)) return;
    const sp = C().SPRITE ? softSprite(rgb, 0.42) : null;
    ctx.globalAlpha = alpha;
    if (sp) {
      ctx.drawImage(sp, x - rx, y - ry, rx * 2, ry * 2);
      st.calls += 1;
      return;
    }
    ctx.fillStyle = 'rgb(' + rgb + ')';
    ctx.beginPath();
    ctx.arc(x, y, (rx + ry) * 0.39, 0, TAU);
    ctx.fill();
    st.calls += 3;
  }

  // ---------------------------------------------------------------- instance

  Anim.create = function () {
    const st = { calls: 0, cells: 0, water: 0, fields: 0, sway: 0, smoke: 0, vehicles: 0, birds: 0, tier: 0, landmarks: 0,
      wheels: 0, bees: 0, pennants: 0, crows: 0 };

    // ---- caches ----------------------------------------------------------
    // Per-cell geometry never changes once a tile is down, so it is resolved lazily and kept
    // for the life of the run. `runs` (chained rivers/rails) DOES change when a tile lands,
    // so it is rebuilt on s.placed.
    let cellState = null;
    const cellData = new Map();        // key → per-cell record (below)
    let runState = null, runPlaced = -1;
    let waterRuns = [], railRuns = [];
    let boardBox = null;

    const visible = [];                // reused every frame — never reallocated
    const buntList = [], crowList = [];  // the markets / abbeys batched this frame (reused)
    const dashA = [0, 0], dashB = [0, 0], noDash = [];

    function forget() {
      cellState = null; cellData.clear();
      runState = null; runPlaced = -1;
      waterRuns = []; railRuns = []; boardBox = null;
      visible.length = 0;
    }

    // ---- per-cell geometry ----------------------------------------------

    /**
     * Everything this module needs to know about one placed cell, in WORLD coordinates:
     *   water   — the river segments, each oriented downstream (see the header)
     *   fields  — one wheat wedge record per FIELD run { x, y, rx, ry, ph }
     *   smoke   — the chimney world points that are lit, or null
     *   lm      — a landmark's { kind, a: geom.landmarkAnchors(...), ph }, or null
     * A cell with none of these is cached as `EMPTY` so it is tested only once.
     */
    const EMPTY = { water: null, fields: null, smoke: null, lm: null, deck: null };

    function cellRecord(cell) {
      let rec = cellData.get(cell.key);
      if (rec !== undefined) return rec;
      const g = geom();
      const size = hexSize();
      const p = HG.Hex.toPixel(cell.q, cell.r, size);
      const seed = g.cellSeed(cell.q, cell.r);
      const cfg = C();
      let water = null, fields = null, smoke = null;

      const wd = g.dirsOf(cell.edges, T.WATER);
      if (wd.length) {
        const raw = g.lineSegs(p.x, p.y, size, wd);
        const dl = Math.hypot(cfg.FLOW_DIR[0], cfg.FLOW_DIR[1]) || 1;
        const fx = cfg.FLOW_DIR[0] / dl, fy = cfg.FLOW_DIR[1] / dl;
        water = [];
        for (let i = 0; i < raw.length; i++) {
          const sg = raw[i];
          let a = sg.p0, b = sg.p1;
          // Orient downstream. The dot is never 0 for real hex geometry (header), but tie-break
          // on x anyway so a degenerate seg can never flip frame to frame.
          const dot = (b.x - a.x) * fx + (b.y - a.y) * fy;
          if (dot < 0 || (dot === 0 && b.x < a.x)) { const t2 = a; a = b; b = t2; }
          water.push({ p0: a, p1: b, cx: sg.c.x, cy: sg.c.y });
        }
      }

      // A landmark's moving parts, placed by the renderer's own numbers (geom.landmarkAnchors),
      // with a per-cell phase so two mills never turn in step. The tile's edges ride along as
      // a fifth argument: a mixed-terrain landmark is rotated, and its anchors with it.
      let lm = null;
      const kind = cell.tile && cell.tile.landmark;
      const a = (kind && g.landmarkAnchors) ? g.landmarkAnchors(p.x, p.y, size, kind, cell.edges) : null;
      if (a) {
        lm = { kind: kind, a: a, ph: rnd(seed, 3, 131) * TAU, spin: 1 };
        // The wheel turns with the flow: its bottom paddles go downstream, which on screen
        // (y down) is anticlockwise when the river runs to the right.
        if (water && water.length) lm.spin = (water[0].p1.x - water[0].p0.x) >= 0 ? -1 : 1;
      }

      // Under a bridge the glint must not run across the deck: the river is cut where the
      // deck crosses it, so the light slides in under the arch and out the other side.
      const deck = deckOf(cell, g, size, p, a);
      if (deck && water) {
        const cut = [];
        for (let i = 0; i < water.length; i++) {
          const sg = water[i];
          const mx = (sg.p0.x + sg.p1.x) / 2, my = (sg.p0.y + sg.p1.y) / 2;
          const ux0 = sg.p1.x - sg.p0.x, uy0 = sg.p1.y - sg.p0.y, ul = Math.hypot(ux0, uy0) || 1;
          const ux = ux0 / ul, uy = uy0 / ul;
          const across = Math.abs(ux * deck.nx + uy * deck.ny);
          // only a straight run (control point on the chord) is cut; the layout's river is one
          if (Math.hypot(sg.cx - mx, sg.cy - my) > 1e-6 || across < 0.1) { cut.push(sg); continue; }
          // where along the seg (from its midpoint) the covered band's two edges fall
          const un = ux * deck.nx + uy * deck.ny;
          const dm = (mx - deck.x) * deck.nx + (my - deck.y) * deck.ny;
          const sA = (deck.lo - dm) / un, sB = (deck.hi - dm) / un;
          const g0 = Math.min(sA, sB), g1 = Math.max(sA, sB);
          if (g0 > -ul / 2) {
            const e = { x: mx + ux * Math.min(g0, ul / 2), y: my + uy * Math.min(g0, ul / 2) };
            cut.push({ p0: sg.p0, p1: e, cx: (sg.p0.x + e.x) / 2, cy: (sg.p0.y + e.y) / 2 });
          }
          if (g1 < ul / 2) {
            const e = { x: mx + ux * Math.max(g1, -ul / 2), y: my + uy * Math.max(g1, -ul / 2) };
            cut.push({ p0: e, p1: sg.p1, cx: (e.x + sg.p1.x) / 2, cy: (e.y + sg.p1.y) / 2 });
          }
        }
        water = cut.length ? cut : null;
      }

      const runs = g.runsOf(cell.edges);
      for (let i = 0; i < runs.length; i++) {
        const run = runs[i];
        if (run.t !== T.FIELD) continue;
        // Centre of the wedge: the mid angle of its run, at a radius that keeps the light
        // patch inside the wedge. A full-hex field is centred on the hex.
        const midA = 60 * (run.start + (run.len - 1) / 2) * Math.PI / 180;
        const ax = Math.cos(midA), ay = Math.sin(midA);
        const rad = run.len >= 6 ? 0 : size * 0.40;
        const rr = size * (0.28 + 0.08 * run.len);
        (fields || (fields = [])).push({
          x: p.x + rad * ax, y: p.y + rad * ay,           // the light patch's centre
          rx: rr, ry: rr * 0.82,
          cx: p.x, cy: p.y,                               // the hex centre — the furrow frame
          ax: ax, ay: ay,                                 // outward radial of the wedge
          // The furrows drawn by renderer.js run PERPENDICULAR to that radial, stepping
          // outward from the centre; the highlight strokes below ride the same frame, so the
          // light travels along the rows the tile already shows instead of across them.
          half: size * (run.len >= 6 ? 0.42 : 0.10 + 0.10 * run.len),
          wide: run.len >= 6,
          ph: rnd(seed, run.start, 91) * TAU,
        });
      }

      // Village chimneys smoke by chance; a depot / farmstead / sawmill always does, from its own
      // stacks first (the renderer tags those `lm: true`; untagged, the list order is kept).
      const lmSmoke = !!(kind && SMOKE_KINDS[kind]);
      if (g.chimneys && (lmSmoke || rnd(seed, 0, 77) < cfg.SMOKE_CHANCE)) {
        let ch = g.chimneys(p.x, p.y, size, cell.edges, seed, cell.tile && cell.tile.landmark);
        if (ch.length) {
          if (lmSmoke) ch = ch.filter(function (c) { return c.lm; }).concat(ch.filter(function (c) { return !c.lm; }));
          smoke = [];
          const per = Math.max(1, cfg.SMOKE_PER_CELL | 0);
          const n = Math.min(ch.length, lmSmoke ? Math.max(per, cfg.LM_SMOKE | 0) : per);
          for (let i = 0; i < n; i++) smoke.push(ch[i]);
        }
      }

      rec = (water || fields || smoke || lm || deck)
        ? { water: water, fields: fields, smoke: smoke, lm: lm, deck: deck, seed: seed } : EMPTY;
      cellData.set(cell.key, rec);
      return rec;
    }

    // ---- chained runs (rails and rivers across tiles) --------------------

    function dirsFor(cell, terrain) {
      const out = [];
      for (let d = 0; d < 6; d++) if (cell.edges[d] === terrain) out.push(d);
      return out;
    }

    /**
     * The neighbour a line at edge `d` continues into. The game's ONE adjacency rule: edge d
     * of A touches edge d+3 of A's neighbour in direction d (DESIGN.md, Hex grid).
     */
    function linked(cells, cell, d, terrain) {
      const n = HG.Hex.neighbor(cell.q, cell.r, d);
      const nb = cells.get(HG.Hex.key(n[0], n[1]));
      if (!nb) return null;
      return nb.edges[(d + 3) % 6] === terrain ? nb : null;
    }

    /** How many further tiles this branch reaches (bounded) — used to pick a fork's main line. */
    function branchDepth(cells, cell, inDir, terrain, seen, budget) {
      let depth = 0, cur = cell, from = inDir;
      while (cur && depth < budget && !seen.has(cur.key)) {
        seen.add(cur.key);
        depth++;
        const ds = dirsFor(cur, terrain);
        let next = null, nextIn = -1;
        for (let i = 0; i < ds.length; i++) {
          if (ds[i] === from) continue;
          const nb = linked(cells, cur, ds[i], terrain);
          if (nb && !seen.has(nb.key)) { next = nb; nextIn = (ds[i] + 3) % 6; break; }
        }
        cur = next; from = nextIn;
      }
      return depth;
    }

    /**
     * Chain the board's line tiles into runs. A run is a list of quadratic segments in world
     * space, tile to tile, so a vehicle can follow it with segAt and get the right tangent.
     * Each tile belongs to at most one run; at a fork the longest branch wins, the others
     * become their own runs. Built once per s.placed, never per frame.
     */
    function buildRuns(s, terrain) {
      const cells = s.board.cells;
      const g = geom();
      const size = hexSize();
      const used = new Set();
      const starts = [], rest = [];

      cells.forEach(function (cell) {
        const ds = dirsFor(cell, terrain);
        if (!ds.length) return;
        // an end of the line: a line edge with nothing to continue into
        let open = false;
        for (let i = 0; i < ds.length; i++) if (!linked(cells, cell, ds[i], terrain)) { open = true; break; }
        if (open || ds.length === 1) starts.push(cell); else rest.push(cell);
      });
      // deterministic order (cells is insertion-ordered, but be explicit)
      starts.sort(function (a, b) { return a.key < b.key ? -1 : (a.key > b.key ? 1 : 0); });
      rest.sort(function (a, b) { return a.key < b.key ? -1 : (a.key > b.key ? 1 : 0); });

      const out = [];
      const heads = starts.concat(rest);
      for (let h = 0; h < heads.length; h++) {
        if (used.has(heads[h].key)) continue;
        const segs = [];
        let cell = heads[h], inDir = -1, cellCount = 0, lastOut = -1, id = 0, join = false;
        let decks = null;
        // enter through the edge that has nothing behind it, so the run starts at the line's end
        const d0 = dirsFor(cell, terrain);
        for (let i = 0; i < d0.length; i++) if (!linked(cells, cell, d0[i], terrain)) { inDir = d0[i]; break; }
        // How the line ENDS at this head: entering through an open edge means the track runs
        // out at the tile's seam (the board's edge, or a neighbour that doesn't carry it);
        // entering from the centre means this tile is a buffer stop with a real end of track.
        const bufA = inDir < 0;

        while (cell && !used.has(cell.key)) {
          used.add(cell.key);
          const ds = dirsFor(cell, terrain);
          let outDir = -1, best = -1;
          for (let i = 0; i < ds.length; i++) {
            const d = ds[i];
            if (d === inDir) continue;
            const nb = linked(cells, cell, d, terrain);
            if (!nb || used.has(nb.key)) { if (best < 0 && outDir < 0) outDir = d; continue; }
            const depth = (ds.length > 2)
              ? branchDepth(cells, nb, (d + 3) % 6, terrain, new Set(used), 16)
              : 1;
            if (depth > best) { best = depth; outDir = d; }
          }
          const p = HG.Hex.toPixel(cell.q, cell.r, size);
          pushSegs(segs, g, p, size, ds, inDir, outDir);
          cellCount++;
          lastOut = outDir;
          // a river passing under a bridge: remember the deck, so the boat can go under it
          if (terrain === T.WATER && cell.tile && cell.tile.landmark === 'bridge') {
            const dk = deckOf(cell, g, size, p,
              g.landmarkAnchors ? g.landmarkAnchors(p.x, p.y, size, 'bridge', cell.edges) : null);
            if (dk) (decks || (decks = [])).push(dk);
          }
          // A stable name for this line: the smallest cell hash on it. Adding a tile to a line
          // almost never changes it, and when two lines merge the survivor keeps one of the
          // two — which is what lets a vehicle be handed back to "the same line" after the
          // runs are rebuilt, and its speed stay put instead of being reseeded.
          const cid = hash32(cell.q + 512, cell.r + 512, 91);
          if (!id || cid < id) id = cid;
          if (best < 0) {                            // nowhere further to go…
            // …but if the track DOES carry on, into a junction another run already owns (the
            // third arm of a depot or a fork), this is not the edge of the map: the train
            // brakes and stands at the seam, as at a signal, instead of fading out in plain
            // view on a line that visibly continues.
            join = outDir >= 0 && !!linked(cells, cell, outDir, terrain);
            break;
          }
          const nb = linked(cells, cell, outDir, terrain);
          inDir = (outDir + 3) % 6;
          cell = nb;
        }
        // …and the same question at the far end: the last tile either buffers at its centre
        // (no onward edge at all) or the track runs out at one of its seams.
        if (segs.length) {
          out.push({ segs: segs, len: cellCount, id: id, bufA: bufA, bufB: lastOut < 0 || join, decks: decks });
        }
      }

      // longest first: the vehicles go to the runs worth watching
      out.sort(function (a, b) { return b.len - a.len; });
      return out;
    }

    /** A dead-straight segment, as a degenerate quadratic. `w` is its length in TILES. */
    function straightSeg(a, b, w) {
      return { p0: a, p1: b, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, w: w };
    }

    /**
     * One tile's piece of a run, appended to `segs`. It must trace the track the RENDERER
     * actually draws (`lineSegs`), or a vehicle rides beside its own rails:
     *   - two edges: one quadratic bending through the hex centre — one seg, one tile.
     *   - three or more (a junction), or a stub: the renderer draws SPOKES, each a straight
     *     line from an edge midpoint to the centre. So a train crossing a junction gets TWO
     *     half-tile segs, in and then out, and turns at the centre the way the rails do.
     *     A single curve across such a tile cuts the corner and rides over the track's
     *     side, which is what it used to do (Nic, 2026-09-20).
     */
    function pushSegs(segs, g, p, size, ds, inDir, outDir) {
      const cx = p.x, cy = p.y;
      if (inDir >= 0 && outDir >= 0 && ds.length === 2) {
        const sg = g.lineSegs(cx, cy, size, [inDir, outDir])[0];
        segs.push({ p0: sg.p0, p1: sg.p1, cx: sg.c.x, cy: sg.c.y, w: 1 });
        return;
      }
      const mid = { x: cx, y: cy };
      if (inDir >= 0) segs.push(straightSeg(g.edgeMid(cx, cy, size, inDir), mid, 0.5));
      if (outDir >= 0) segs.push(straightSeg(mid, g.edgeMid(cx, cy, size, outDir), 0.5));
    }

    /**
     * Total length of a run in TILES, with the per-segment prefix sums that address it.
     * Computed once per run and cached on it; a run built by hand (the harness) gets it on
     * first use, and every segment defaults to a full tile.
     */
    function runSpan(run) {
      const segs = run.segs;
      if (run.cum && run.cum.length === segs.length + 1) return run.span;
      const cum = [0];
      let acc = 0;
      for (let i = 0; i < segs.length; i++) { acc += (segs[i].w > 0 ? segs[i].w : 1); cum.push(acc); }
      run.cum = cum;
      run.span = acc > 0 ? acc : 1;
      return run.span;
    }

    // ---- vehicle continuity across a rebuild -----------------------------
    //
    // Every run is rebuilt from scratch the moment a tile lands, and a vehicle's position is a
    // pure function of view.t — so a rebuild that changed a line's LENGTH (the cycle), its
    // place in the list (the seed) or its direction used to teleport the train on it. Placing
    // a piece of track made the train stop dead and set off the other way (Nic, 2026-09-20).
    //
    // The fix keeps the purity and adds no integrator: each run carries a `phase`, and when
    // the runs are rebuilt each vehicle's world position and heading are measured FIRST, then
    // the run that inherits it is given the phase that puts it back where it was, going the
    // way it was going. Phases are recomputed only when the board changes, never per frame, so
    // "the same view.t replays the same frame" still holds.

    function runPhase(run, salt) {
      return run.phase !== undefined ? run.phase : rnd(run.id || 1, 5, salt);
    }

    /**
     * Scan `fn` over [a, b] for its minimum, then zoom in twice on the winner. A coarse scan
     * alone quantises the answer to its step, and a step is worth several pixels — which is a
     * visible twitch on the frame a tile lands, so it is not good enough. Three passes of 32
     * put it far under a pixel for a few dozen cheap evaluations.
     */
    function scanMin(a, b, steps, fn) {
      let best = a, bestV = Infinity;
      for (let pass = 0; pass < 3; pass++) {
        const n = pass === 0 ? steps : 32;
        const lo = pass === 0 ? a : Math.max(a, best - (b - a) / Math.pow(n, pass));
        const hi = pass === 0 ? b : Math.min(b, best + (b - a) / Math.pow(n, pass));
        for (let i = 0; i <= n; i++) {
          const x = lo + (hi - lo) * i / n;
          const v = fn(x);
          if (v < bestV) { bestV = v; best = x; }
        }
      }
      return { x: best, v: bestV };
    }

    /** Nearest point on a run to (x, y): its position in tiles, plus the tangent there. */
    const NEAR = { x: 0, y: 0, dx: 0, dy: 0 };
    function nearestOnRun(run, x, y) {
      const span = runSpan(run);
      const hit = scanMin(0, span, Math.max(8, Math.ceil(span * 8)), function (v) {
        const p = runAtTile(run, v, NEAR);
        return (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      });
      const p = runAtTile(run, hit.x, NEAR);
      return { v: hit.x, d: Math.sqrt(hit.v), dx: p.dx, dy: p.dy };
    }

    /** What a vehicle is doing right now, in world terms — measured before the runs go away. */
    function anchorOf(run, t, kind) {
      const span = runSpan(run);
      let v, dv;
      if (kind === 'train') {
        const P = trainParams(run);
        v = trainHeadAt(run, P, t);
        dv = trainHeadAt(run, P, t + 0.03) - v;
        // Standing at a buffer, look back to see which way it CAME: if the line has just grown
        // past it, it should carry on to the new end of the track rather than pick a side.
        const back = [0.3, 1, 2, 4];
        for (let i = 0; i < back.length && Math.abs(dv) < 1e-6; i++) {
          dv = v - trainHeadAt(run, P, t - back[i]);
        }
      } else {
        const B = boatParams(run);
        const u = frac(t / B.cycle + runPhase(run, 29));
        if (u >= B.moving) return { run: run, id: run.id, idle: true, u: u };
        v = (u / B.moving) * span;
        dv = 1;
      }
      const p = runAtTile(run, v, NEAR);
      const dl = Math.hypot(p.dx, p.dy) || 1;
      const sgn = dv < 0 ? -1 : 1;
      return {
        run: run, id: run.id, idle: false, x: p.x, y: p.y,
        hx: p.dx / dl * sgn, hy: p.dy / dl * sgn,
        // How far PAST the end of the line it is (a train fading off the edge of the map), so
        // it can be put back outside the new line rather than popped onto the end of it.
        over: v < 0 ? v : (v > span ? v - span : 0),
        still: Math.abs(dv) < 1e-6,
      };
    }

    /** Where the vehicle on `run` is drawn, in world pixels, at time t. */
    function vehiclePos(run, t, kind, out) {
      const span = runSpan(run);
      let v;
      if (kind === 'train') {
        const P = trainParams(run);
        v = trainHeadAt(run, P, t);
      } else {
        const B = boatParams(run);
        v = frac(t / B.cycle + runPhase(run, 29)) / B.moving * span;
      }
      return runAtTile(run, v, out);
    }

    /**
     * The hand-over offset, decaying to nothing. Even a perfect hand-over can leave the
     * vehicle a few pixels from where it was, because the TRACK ITSELF moves: the tile a train
     * was parked on as a dead end becomes a through tile the moment the line grows past it,
     * and its rails bend a different way. Rather than cut, the difference is carried as a
     * world offset that slides out over VEHICLE_WARP seconds, so the tile you place never
     * shows a twitch. Set only when the runs are rebuilt — never per frame.
     */
    const WARP = { x: 0, y: 0 };
    function warpAt(run, t) {
      WARP.x = 0; WARP.y = 0;
      const w = run.warp;
      if (!w) return WARP;
      const k = 1 - (t - w.t0) / Math.max(0.05, C().VEHICLE_WARP || 0.45);
      if (k <= 0) { run.warp = null; return WARP; }
      // ease it out rather than sliding at a constant rate
      const e = k * k;
      WARP.x = w.x * e; WARP.y = w.y * e;
      return WARP;
    }

    function snapshot(runs, max, t, kind) {
      const out = [];
      const n = Math.min(runs.length, max);
      for (let i = 0; i < n; i++) out.push(anchorOf(runs[i], t, kind));
      return out;
    }

    /**
     * Hand each vehicle to the rebuilt run it is standing on, and reorder the list so the runs
     * that inherited one keep their vehicle (the list is otherwise longest-first, and a line
     * growing past another used to make two trains swap places).
     */
    function adopt(runs, anchors, max, t, kind) {
      if (!anchors.length || !runs.length) return runs;
      const size = hexSize();
      const taken = [];
      for (let a = 0; a < anchors.length; a++) {
        const an = anchors[a];
        let best = null, bestD = Infinity;
        for (let i = 0; i < runs.length; i++) {
          const run = runs[i];
          if (run.phase !== undefined) continue;          // already carrying a vehicle
          // An idle boat has no position to match: hand it back to the line it was on.
          if (an.idle) { if (run.id === an.id) { best = { run: run, near: null }; bestD = 0; } continue; }
          const near = nearestOnRun(run, an.x, an.y);
          const d = near.d - (run.id === an.id ? size * 0.5 : 0);   // a tie goes to the same line
          if (d < bestD) { bestD = d; best = { run: run, near: near }; }
        }
        if (!best || bestD > size * 2) continue;          // its line is gone: the vehicle goes too
        best.run.phase = an.idle ? an.u - t / boatParams(best.run).cycle
          : phaseFor(best.run, an, best.near, t, kind);
        best.run.phase = frac(best.run.phase);
        if (!an.idle) {
          const p = vehiclePos(best.run, t, kind, NEAR);
          const dx = an.x - p.x, dy = an.y - p.y;
          const m = Math.hypot(dx, dy);
          if (m > 0.01 && m < size * (C().VEHICLE_WARP_MAX || 1.2)) {
            best.run.warp = { x: dx, y: dy, t0: t };
          }
        }
        taken.push(best.run);
      }
      if (!taken.length) return runs;
      const rest = runs.filter(function (r) { return taken.indexOf(r) < 0; });
      return taken.concat(rest);
    }

    /** The phase that puts `an`'s vehicle at `near` on `run` at time t, going the same way. */
    function phaseFor(run, an, near, t, kind) {
      const span = runSpan(run);
      // Which way along THIS run the vehicle was heading, and where along it it belongs.
      const fwd = (near.dx * an.hx + near.dy * an.hy) >= 0;
      const v = near.v + an.over;                         // keep any overshoot past the end
      if (kind !== 'train') {
        const B = boatParams(run);
        return clamp01(v / (span || 1)) * B.moving - t / B.cycle;
      }
      const P = trainParams(run);
      // The head's position is a fold of the phase, so invert it by search. The direction of
      // travel has to match too — the same point is passed twice per cycle, once each way —
      // so a wrong-way u is scored right out of contention rather than skipped, which keeps
      // the scan's minimum well defined for the refinement passes.
      const STEP = 1 / 512;
      const at = function (u) { return P.lo + P.span * shuttleAt(u, P.moveFrac, P.easeA, P.easeB); };
      const hit = scanMin(0, 1, 256, function (u) {
        const a = at(u), b = at(frac(u + STEP));
        const moving = Math.abs(b - a) > 1e-9;
        // A standing train may be picked up anywhere in its stand: it will be standing there
        // too, so direction does not apply.
        // A train that was moving must be handed to a u where it is still moving, and the same
        // way: without the `!moving` half it could be dropped into the stand at the end of the
        // line and stop dead on the frame the tile landed.
        const wrongWay = !an.still && (!moving || ((b > a) !== fwd));
        return Math.abs(a - v) + (wrongWay ? P.span * 10 : 0);
      });
      return hit.x - t / P.cycle;
    }

    /** Point a river run downstream, so every boat on it travels the way the glint does. */
    function orientRun(run) {
      const cfg = C();
      const dl = Math.hypot(cfg.FLOW_DIR[0], cfg.FLOW_DIR[1]) || 1;
      const fx = cfg.FLOW_DIR[0] / dl, fy = cfg.FLOW_DIR[1] / dl;
      const a = run.segs[0].p0, b = run.segs[run.segs.length - 1].p1;
      if ((b.x - a.x) * fx + (b.y - a.y) * fy >= 0) return run;
      run.segs.reverse();
      for (let i = 0; i < run.segs.length; i++) {
        const sg = run.segs[i];
        const t2 = sg.p0; sg.p0 = sg.p1; sg.p1 = t2;
      }
      const buf = run.bufA; run.bufA = run.bufB; run.bufB = buf;
      run.cum = null;                                // the prefix sums ran the other way
      return run;
    }

    function ensureRuns(s, t) {
      if (runState === s && runPlaced === s.placed) return;
      const cfg = C();
      const now = t > 0 ? t : 0;
      // Measure the vehicles on the runs that are about to be thrown away…
      const boatsBefore = snapshot(waterRuns, cfg.MAX_BOATS | 0, now, 'boat');
      const trainsBefore = snapshot(railRuns, cfg.MAX_TRAINS | 0, now, 'train');
      runState = s; runPlaced = s.placed;
      waterRuns = buildRuns(s, T.WATER).filter(function (r) { return r.len >= C().MIN_RUN; });
      for (let i = 0; i < waterRuns.length; i++) orientRun(waterRuns[i]);
      railRuns = buildRuns(s, T.RAIL).filter(function (r) { return r.len >= C().MIN_RUN; });
      // …and hand them to the rebuilt ones, so nothing stops, turns round or changes line.
      waterRuns = adopt(waterRuns, boatsBefore, cfg.MAX_BOATS | 0, now, 'boat');
      railRuns = adopt(railRuns, trainsBefore, cfg.MAX_TRAINS | 0, now, 'train');
      // world box of the landscape, for wrapping the cloud shadows
      const size = hexSize();
      const b = s.board.bounds;
      const p0 = HG.Hex.toPixel(b.minQ, b.minR, size);
      const p1 = HG.Hex.toPixel(b.maxQ, b.maxR, size);
      boardBox = {
        x0: Math.min(p0.x, p1.x) - size * 2, x1: Math.max(p0.x, p1.x) + size * 2,
        y0: Math.min(p0.y, p1.y) - size * 2, y1: Math.max(p0.y, p1.y) + size * 2,
      };
    }

    // ---- the wind --------------------------------------------------------

    const wind = { x: 1, y: 0, a: 0 };
    function updateWind(t) {
      const cfg = C();
      wind.a = cfg.WIND_ANGLE + cfg.WIND_SWING * Math.sin(t * cfg.WIND_WANDER);
      wind.x = Math.cos(wind.a);
      wind.y = Math.sin(wind.a);
    }

    // ---- visible cells ---------------------------------------------------

    function collectVisible(s, cam) {
      const size = hexSize();
      const rect = cam.viewRect();
      const ex = size * 0.8660254037844386, ey = size;
      visible.length = 0;
      const x0 = rect.x0 - ex, x1 = rect.x1 + ex, y0 = rect.y0 - ey, y1 = rect.y1 + ey;
      s.board.cells.forEach(function (cell) {
        const p = HG.Hex.toPixel(cell.q, cell.r, size);
        if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) return;
        const rec = cellRecord(cell);
        if (rec !== EMPTY) visible.push(rec);
      });
      st.cells = visible.length;
    }

    // ---- 1. the river ----------------------------------------------------

    /**
     * Every visible river, in ONE path: a subpath per hex segment, one stroke, animated by
     * lineDashOffset alone. The dash phase restarts at each subpath (canvas dashes each
     * subpath from the offset), and every segment is oriented downstream, so the glints on
     * neighbouring tiles travel the same way and at the same phase — it reads as one river
     * moving, not as a row of independent marching-ants outlines.
     */
    function drawRiver(ctx, t, size, pass, cap) {
      const cfg = C();
      const speed = pass === 0 ? cfg.FLOW_SPEED : cfg.RIPPLE_SPEED;
      const dash = pass === 0 ? cfg.FLOW_DASH : cfg.RIPPLE_DASH;
      const arr = pass === 0 ? dashA : dashB;
      arr[0] = dash[0] * size; arr[1] = dash[1] * size;
      ctx.setLineDash(arr);
      ctx.lineDashOffset = -t * speed;
      ctx.lineWidth = size * (pass === 0 ? cfg.FLOW_WIDTH : cfg.RIPPLE_WIDTH);
      ctx.strokeStyle = 'rgb(' + (pass === 0 ? cfg.FLOW_COL : cfg.RIPPLE_COL) + ')';
      ctx.globalAlpha = pass === 0 ? cfg.FLOW_ALPHA : cfg.RIPPLE_ALPHA;
      ctx.beginPath();
      let n = 0, drawn = 0;
      for (let i = 0; i < visible.length && drawn < cap; i++) {
        const w = visible[i].water;
        if (!w) continue;
        drawn++;
        for (let j = 0; j < w.length; j++) {
          const sg = w[j];
          ctx.moveTo(sg.p0.x, sg.p0.y);
          ctx.quadraticCurveTo(sg.cx, sg.cy, sg.p1.x, sg.p1.y);
          n += 2;
        }
      }
      ctx.stroke();
      ctx.setLineDash(noDash);
      st.calls += n + 4;
      if (pass === 0) st.water = drawn;
    }

    // ---- 2. the wheat ----------------------------------------------------

    /**
     * A gust crossing the landscape. Its strength at a wedge is a function of that wedge's
     * position projected on the wind, so the light travels over the fields as one weather
     * front rather than each hex twinkling on its own. Wedges outside the gust cost nothing.
     */
    function drawWheat(ctx, t, size, fine, cap) {
      const cfg = C();
      const inv = 1 / Math.max(1, cfg.BAND_WAVE);
      const phase = t * cfg.BAND_SPEED * inv;
      const sway = size * cfg.SWAY_AMP;
      let lit = 0;

      // pass 1: the light patch (one blit a wedge)
      for (let i = 0; i < visible.length && lit < cap; i++) {
        const fs = visible[i].fields;
        if (!fs) continue;
        for (let j = 0; j < fs.length && lit < cap; j++) {
          const f = fs[j];
          const u = frac((f.x * wind.x + f.y * wind.y) * inv - phase);
          const sn = Math.sin(u * TAU);
          const g = sn > 0 ? sn * sn : 0;
          if (g < cfg.BAND_MIN) continue;
          lit++;
          const lean = Math.sin(t * TAU * cfg.SWAY_HZ + f.ph) * sway;
          blob(ctx, f.x + wind.x * lean, f.y + wind.y * lean,
            f.rx, f.ry, cfg.SWAY_COL, cfg.BAND_ALPHA * g, st);
        }
      }
      st.fields = lit;
      if (!fine || lit === 0 || cfg.SWAY_STROKES <= 0) { st.sway = 0; return; }

      // pass 2: a highlight riding the furrows. Each stroke is a short line in the wedge's own
      // frame (along the rows renderer.js drew), sliding outward as the gust passes — one
      // batched path, two calls a stroke, and it can only land where a wheat wedge is.
      ctx.strokeStyle = 'rgb(' + cfg.SWAY_STROKE_COL + ')';
      ctx.globalAlpha = cfg.SWAY_STROKE_ALPHA;
      ctx.lineWidth = size * cfg.SWAY_WIDTH;
      ctx.beginPath();
      let strokes = 0;
      const maxS = cfg.MAX_SWAY;
      const nS = Math.max(1, cfg.SWAY_STROKES | 0);
      for (let i = 0; i < visible.length && strokes < maxS; i++) {
        const fs = visible[i].fields;
        if (!fs) continue;
        for (let j = 0; j < fs.length && strokes < maxS; j++) {
          const f = fs[j];
          const u = frac((f.x * wind.x + f.y * wind.y) * inv - phase);
          const sn = Math.sin(u * TAU);
          const g = sn > 0 ? sn * sn : 0;
          if (g < cfg.BAND_MIN) continue;
          const slide = Math.sin(t * TAU * cfg.SWAY_HZ + f.ph) * size * cfg.SWAY_AMP;
          for (let k = 0; k < nS && strokes < maxS; k++) {
            const o = (f.wide ? (k - (nS - 1) / 2) * size * 0.26
              : size * (0.30 + 0.22 * k)) + slide;
            const half = f.half * (0.55 + 0.45 * g);
            const bx = f.cx + f.ax * o, by = f.cy + f.ay * o;
            ctx.moveTo(bx - f.ay * half, by + f.ax * half);
            ctx.lineTo(bx + f.ay * half, by - f.ax * half);
            strokes++;
          }
        }
      }
      ctx.stroke();
      st.calls += strokes * 2 + 2;
      st.sway = strokes;
    }

    // ---- 3. chimney smoke ------------------------------------------------

    function drawSmoke(ctx, t, size) {
      const cfg = C();
      const cap = cfg.MAX_SMOKE;
      let n = 0;
      for (let i = 0; i < visible.length && n < cap; i++) {
        const rec = visible[i];
        if (!rec.smoke) continue;
        for (let c = 0; c < rec.smoke.length && n < cap; c++) {
          const ch = rec.smoke[c];
          for (let k = 0; k < cfg.SMOKE_PUFFS && n < cap; k++) {
            const ph = k / cfg.SMOKE_PUFFS + rnd(rec.seed, c * 5 + k, 33) * 0.2;
            const u = frac(t / cfg.SMOKE_SEC + ph);
            const a = cfg.SMOKE_ALPHA * (1 - u) * Math.min(1, u * 5);
            if (a < 0.01) continue;
            const r = size * (cfg.SMOKE_R0 + (cfg.SMOKE_R1 - cfg.SMOKE_R0) * u);
            const x = ch.x + wind.x * size * cfg.SMOKE_DRIFT * u + Math.sin(u * 5 + ph * 9) * size * 0.03;
            const y = ch.y - size * cfg.SMOKE_RISE * u + wind.y * size * cfg.SMOKE_DRIFT * u * 0.3;
            blob(ctx, x, y, r, r, cfg.SMOKE_COL, a, st);
            n++;
          }
        }
      }
      st.smoke = n;
    }

    // ---- 4. vehicles -----------------------------------------------------

    /** Sample a run at p ∈ [0, 1] (uniform in TILES, so speed is the same over every tile). */
    function runAt(run, p, out) {
      return runAtTile(run, clamp01(p) * runSpan(run), out);
    }

    /**
     * The same sample, addressed in TILES along the run (0 … runSpan). Segments are not all
     * one tile long — a junction is crossed as two half-tile spokes — so the position walks
     * the prefix sums rather than indexing the array directly. Off either end it clamps.
     */
    function runAtTile(run, v, out) {
      const span = runSpan(run), cum = run.cum, segs = run.segs;
      const w = v < 0 ? 0 : (v > span ? span : v);
      let i = 0;
      while (i < segs.length - 1 && cum[i + 1] <= w) i++;
      const d = cum[i + 1] - cum[i];
      return sampleSeg(segs[i], d > 0 ? (w - cum[i]) / d : 0, out);
    }

    /**
     * One leg of a shuttle's timetable, as a 0..1 position with a stand at each end.
     * `u` is the phase through the WHOLE cycle (out, stand, back, stand). `ease` is the
     * fraction of a moving leg spent accelerating — and the same again braking — so the train
     * pulls away from the platform and brakes into the next one instead of stepping off at
     * line speed. Returns 0 at one terminus and 1 at the other.
     */
    function shuttleAt(u, moveFrac, easeA, easeB) {
      const eA = easeA, eB = (easeB === undefined ? easeA : easeB);
      const half = 0.5;
      const back = u >= half;
      let m = (back ? u - half : u) / half;          // 0..1 through this leg + its stand
      if (m > moveFrac) m = 1; else m = m / moveFrac; // the stand: parked at the far end
      // Out: pull away from end A, brake into end B. Back: the other way round — which matters
      // now that the two ends can differ (a buffer stop is braked into, a seam is run through).
      return back ? 1 - easeInOut(m, eB, eA) : easeInOut(m, eA, eB);
    }

    /**
     * Trapezoid-velocity ease: accelerate over the first `kIn`, hold line speed, brake over the
     * last `kOut` (kOut defaults to kIn). 0.5/0.5 is a pure smoothstep, 0 a hard start — which
     * is exactly what an end of track that is really just the edge of the map wants, since the
     * train carries on off the board instead of stopping. Normalised to cover 1 in 1.
     */
    function easeInOut(m, kIn, kOut) {
      const x = clamp01(m);
      const a = Math.max(0, Math.min(0.5, kIn));
      const b = Math.max(0, Math.min(0.5, kOut === undefined ? kIn : kOut));
      if (a < 1e-6 && b < 1e-6) return x;
      const total = 1 - a / 2 - b / 2;               // ∫ of the trapezoid before normalising
      if (a > 1e-6 && x < a) return (x * x / (2 * a)) / total;
      if (b > 1e-6 && x > 1 - b) { const d = 1 - x; return 1 - (d * d / (2 * b)) / total; }
      return (x - a / 2) / total;
    }

    function carAt(ctx, x, y, ang, len, wide, col) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.fillStyle = col;
      ctx.fillRect(-len / 2, -wide / 2, len, wide);
      ctx.restore();
      st.calls += 5;
    }

    /**
     * A train shuttles the length of its run: it accelerates away from one end, runs at line
     * speed, brakes into the other, STANDS there for TRAIN_DWELL_SEC, and comes back.
     *
     * Two things that used to look wrong and are now structural:
     *  - The consist is fixed. Car c is always CAR_GAP tiles behind the head IN THE RUN's own
     *    direction, never behind the direction of travel — so the carriages do not swap ends
     *    the instant the train reverses. The engine leads on the way out and pushes on the way
     *    back, which is what a real branch-line shuttle does.
     *  - The head only travels between `tail` and `n`, so the rearmost car is never clamped
     *    against the start of the line: the whole train stays on the rails at both ends
     *    instead of concertinaing into the terminus.
     *
     * The two ends of a line are not the same thing, and are no longer treated as one:
     *  - A BUFFER STOP — a tile where the track really does end, at its centre — is braked
     *    into, stood at, and left again. That is the behaviour above, unchanged.
     *  - A SEAM — where the track simply runs out at the tile's edge because the board ends
     *    there or the next tile doesn't carry it — is not an end of the line at all, it is
     *    the edge of the map. The train keeps line speed straight through it and FADES out
     *    over TRAIN_FADE tiles, then fades back in when it returns. It used to brake to a
     *    halt in mid-air there and sit waiting, which read as a bug (Nic, 2026-09-20).
     */
    /**
     * Everything about the timetable of the train on `run` — split out of drawTrains so the
     * hand-over below can ask where a train WOULD be at a given phase without drawing it.
     * Seeded from the run's stable id, never from its place in the list or its length: a line
     * that grows by a tile must not change speed or rhythm.
     */
    function trainParams(run) {
      const cfg = C();
      const cars = Math.max(1, cfg.TRAIN_CARS | 0);
      const consist = (cars - 1) * cfg.CAR_GAP;         // tiles, head to tail
      const fadeT = Math.max(0.05, cfg.TRAIN_FADE || 0.8);
      const n = runSpan(run);
      // A run built by hand (the harness) has neither flag: treat both ends as buffers.
      const bufA = run.bufA !== false, bufB = run.bufB !== false;
      const tail = Math.min(consist, n * 0.5);          // a train longer than its line still fits
      // Where the head may travel to. At a seam it carries on until the LAST car has cleared
      // the boundary and faded; at a buffer it stops with its nose on the end of the track.
      const lo = bufA ? tail : -(consist + fadeT);
      const hi = bufB ? n : n + consist + fadeT;
      const span = Math.max(0.001, hi - lo);
      // Per-run speed and phase: two trains on the same board must not march in step.
      const vary = 1 + (rnd(run.id || 1, 3, 7) * 2 - 1) * (cfg.TRAIN_VARY || 0);
      const legSec = Math.max(0.25, span * cfg.TRAIN_SEG_SEC * vary);
      const dwell = Math.min(Math.max(0, cfg.TRAIN_DWELL_SEC || 0),
        legSec * (cfg.TRAIN_DWELL_FRAC === undefined ? 0.5 : cfg.TRAIN_DWELL_FRAC));
      return {
        cars: cars, consist: consist, fadeT: fadeT, n: n, bufA: bufA, bufB: bufB,
        lo: lo, span: span, cycle: (legSec + dwell) * 2, moveFrac: legSec / (legSec + dwell),
        easeA: bufA ? cfg.TRAIN_EASE : 0, easeB: bufB ? cfg.TRAIN_EASE : 0,
      };
    }

    /** Where the head of the train on `run` sits, in tiles, at time t. */
    function trainHeadAt(run, P, t) {
      const u = frac(t / P.cycle + runPhase(run, 17));
      return P.lo + P.span * shuttleAt(u, P.moveFrac, P.easeA, P.easeB);
    }

    function drawTrains(ctx, t, size) {
      const cfg = C();
      const nRuns = Math.min(railRuns.length, cfg.MAX_TRAINS | 0);
      const len = size * cfg.CAR_LEN, wide = size * cfg.CAR_WIDE;
      for (let i = 0; i < nRuns; i++) {
        const run = railRuns[i];
        const P = trainParams(run);
        const head = trainHeadAt(run, P, t);
        const w = warpAt(run, t);
        const wx = w.x, wy = w.y;
        let drawn = 0;
        for (let c = 0; c < P.cars; c++) {
          const v = head - c * cfg.CAR_GAP;
          let alpha = 1;
          if (!P.bufA) alpha = Math.min(alpha, v / P.fadeT);
          if (!P.bufB) alpha = Math.min(alpha, (P.n - v) / P.fadeT);
          if (alpha <= 0.02) continue;                  // past the edge of the map: gone
          const a = runAtTile(run, v, SCRATCH);
          ctx.globalAlpha = alpha > 1 ? 1 : alpha;
          carAt(ctx, a.x + wx, a.y + wy, Math.atan2(a.dy, a.dx), len, wide,
            c === 0 ? cfg.ENGINE_COL : cfg.TRAIN_COL);
          drawn++;
        }
        ctx.globalAlpha = 1;
        if (drawn) st.vehicles++;
      }
    }

    /**
     * A boat runs the river downstream, then the river is EMPTY for a while before the next
     * one comes through. Without that gap the same boat reappears at the head the instant it
     * leaves the tail, and a river reads as a conveyor belt rather than a river something
     * occasionally travels on. Seeded from the run's stable id, for the same reason as a train.
     */
    function boatParams(run) {
      const cfg = C();
      const n = runSpan(run);                // tiles, not segments: a junction is two half-segs
      const vary = 1 + (rnd(run.id || 2, 11, 5) * 2 - 1) * (cfg.BOAT_VARY || 0);
      const travel = Math.max(1, n * cfg.BOAT_SEG_SEC * vary);
      const idle = clamp01(cfg.BOAT_IDLE || 0);
      const moving = 1 - idle;
      return { n: n, cycle: travel / Math.max(0.05, moving), moving: moving };
    }

    function drawBoats(ctx, t, size) {
      const cfg = C();
      const nRuns = Math.min(waterRuns.length, cfg.MAX_BOATS | 0);
      const len = size * cfg.BOAT_LEN, wide = size * cfg.BOAT_WIDE;
      for (let i = 0; i < nRuns; i++) {
        const run = waterRuns[i];
        const B = boatParams(run);
        const u = frac(t / B.cycle + runPhase(run, 29));
        const moving = B.moving;
        if (u >= moving) continue;                          // between boats: an empty river
        const p = u / moving;                               // always downstream
        const fade = cfg.VEHICLE_FADE;
        const a = Math.min(1, p / fade, (1 - p) / fade);
        if (a <= 0.02) continue;
        const pt = runAt(run, p, SCRATCH);
        const w = warpAt(run, t);
        const ang = Math.atan2(pt.dy, pt.dx);
        // It rides the current: a slow lift across the hull's own axis, which costs two sines
        // and no extra 2D call. Phased off the run's stable id, so a rebuild that reorders the
        // list doesn't nudge every boat's roll.
        const ph = (run.id || 0) % 7;
        const bob = Math.sin(t * 1.7 + ph * 2.1) * size * (cfg.BOAT_BOB || 0);
        // Passing under a bridge: the landscape (deck included) is already on the canvas, so
        // near a deck the boat is clipped to everything EXCEPT the covered band (deck + the
        // side wall below its near edge) — two quads, one either side. It slides in under
        // one edge and out from the arch on the other, masked exactly where the stone is.
        const dk = run.decks ? deckNear(run.decks, pt.x + w.x, pt.y + w.y, len) : null;
        if (dk) {
          const L = size * 3, rx = -dk.ny * L, ry = dk.nx * L;
          ctx.save();
          ctx.beginPath();
          for (let side = 0; side < 2; side++) {
            const e = side ? dk.hi : dk.lo, sg = side ? 1 : -1;
            const ex = dk.x + dk.nx * e, ey = dk.y + dk.ny * e;
            const ox = dk.nx * sg * L, oy = dk.ny * sg * L;
            ctx.moveTo(ex + rx, ey + ry);
            ctx.lineTo(ex - rx, ey - ry);
            ctx.lineTo(ex - rx + ox, ey - ry + oy);
            ctx.lineTo(ex + rx + ox, ey + ry + oy);
            ctx.closePath();
          }
          ctx.clip();
          st.calls += 13;
        }
        ctx.save();
        ctx.translate(pt.x + w.x, pt.y + w.y);
        ctx.rotate(ang + Math.sin(t * 1.1 + ph) * 0.05);
        ctx.globalAlpha = a;
        ctx.fillStyle = cfg.BOAT_COL;
        ctx.fillRect(-len / 2, bob - wide / 2, len, wide);
        ctx.fillStyle = cfg.BOAT_SAIL;
        ctx.fillRect(-len * 0.1, bob - wide * 1.25, len * 0.3, wide * 1.1);
        ctx.restore();
        if (dk) { ctx.restore(); st.calls += 1; }
        st.calls += 7;
        st.vehicles++;
      }
    }

    /** The deck the boat at (x, y) is close enough to be cut by, or null. */
    function deckNear(decks, x, y, len) {
      for (let i = 0; i < decks.length; i++) {
        const dk = decks[i];
        const dx = x - dk.x, dy = y - dk.y;
        // near the deck line AND on this tile (the line runs on across the rail's neighbours)
        const dist = dx * dk.nx + dy * dk.ny;
        if (dist > dk.lo - len && dist < dk.hi + len && dx * dx + dy * dy < hexSize() * hexSize()) return dk;
      }
      return null;
    }

    // ---- 7. landmarks ---------------------------------------------------
    //
    // The renderer caches each landmark WITHOUT its moving parts; this draws them over it.
    // Every phase is t plus a per-cell hash — no stored angle, so a cold instance at t draws
    // exactly what a warm one stepped to t does.

    /**
     * The four sails (`size` is the art's own unit, landmarkAnchors' `s`), baked once per
     * half-octave of device scale into a square sprite centred on the hub. null with no document (Node) — the caller paints them directly instead.
     */
    function sailSprite(size, scale) {
      const R = HG.Renderer;
      if (!R || !R.drawSails) return null;
      // half-extent: the sails plus a margin
      return bakedSprite('sails|' + size, size * 0.5, scale, function (g) { R.drawSails(g, 0, 0, size, 0, true); });
    }

    /**
     * Anything that turns, painted once at angle 0 into a square sprite of half-extent E
     * (world px) centred on its hub, per half-octave of device scale. null with no document —
     * the caller paints it directly instead.
     */
    function bakedSprite(name, E, scale, paint) {
      if (!C().SPRITE || typeof document === 'undefined' || !document.createElement) return null;
      const b = Math.round(Math.log(Math.max(0.05, scale)) / Math.LN2 * 2);
      const key = name + '|' + b;
      if (sprites.has(key)) return sprites.get(key);
      let sp = null;
      try {
        const k = Math.pow(2, b / 2);
        const px = Math.max(8, Math.ceil(E * 2 * k));
        const el = document.createElement('canvas');
        el.width = px; el.height = px;
        const g = el.getContext('2d');
        g.setTransform(px / (E * 2), 0, 0, px / (E * 2), px / 2, px / 2);
        paint(g);
        sp = { canvas: el, E: E };
      } catch (err) {
        sp = null;
      }
      sprites.set(key, sp);
      return sp;
    }

    /**
     * The mill wheel: the renderer's own art (Renderer.drawWheel — the cache leaves it out, as
     * it does the sails), baked once into a sprite and turned. No drawWheel ⇒ nothing drawn.
     */
    function drawWheel(ctx, lm, t, scale) {
      const R = HG.Renderer;
      if (!R || !R.drawWheel) return;
      const cfg = C();
      const wh = lm.a.wheel;
      const ang = (lm.spin * t * cfg.WHEEL_SPEED + lm.ph) % TAU;
      ctx.globalAlpha = 1;
      const sp = bakedSprite('wheel|' + wh.r, wh.r * 1.15, scale, function (g) { R.drawWheel(g, 0, 0, wh.r, 0, true); });
      if (sp) {
        ctx.save();
        ctx.translate(wh.x, wh.y);
        ctx.rotate(ang);
        ctx.drawImage(sp.canvas, -sp.E, -sp.E, sp.E * 2, sp.E * 2);
        ctx.restore();
        st.calls += 5;
      } else {
        R.drawWheel(ctx, wh.x, wh.y, wh.r, ang, true);
        st.calls += 70;
      }
      st.wheels++;
    }

    /**
     * Bees round the hives: each a dark dot on a lazy figure-of-eight (a 1:2 Lissajous) whose
     * size and speed are hashed per bee — closed form in t, one fillRect a bee.
     */
    function drawBees(ctx, rec, lm, t, size) {
      const cfg = C();
      const hives = lm.a.hives;
      const per = Math.max(0, cfg.BEES | 0);
      const cap = Math.max(0, cfg.MAX_BEES | 0);
      const b = size * cfg.BEE_SIZE, R = size * cfg.BEE_LOOP;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = cfg.BEE_COL;
      let n = 0;
      for (let h = 0; h < hives.length && n < cap; h++) {
        const hv = hives[h];
        for (let k = 0; k < per && n < cap; k++) {
          const j = h * 8 + k;
          const w = TAU * cfg.BEE_HZ * (0.75 + 0.5 * rnd(rec.seed, j, 211));
          const p0 = rnd(rec.seed, j, 223) * TAU;
          const rr = R * (0.6 + 0.5 * rnd(rec.seed, j, 227));
          const dir = (j & 1) ? 1 : -1;
          const u = t * w * dir + p0;
          // the anchor is the skep's foot on its bench: the loop rides ABOVE the dome, where a
          // dark speck reads against the ground rather than vanishing into the straw
          const x = hv.x + Math.sin(u) * rr * 1.3 + Math.sin(u * 0.37 + p0) * rr * 0.3;
          const y = hv.y - R * 1.6 + Math.sin(u * 2) * rr * 0.5;
          ctx.fillRect(x - b / 2, y - b / 2, b, b);
          n++;
        }
      }
      st.calls += n;
      st.bees += n;
    }

    /**
     * Bunting: each line sags (and breathes a little) between its two posts, and a row of
     * pennants hangs off it, each tip swinging on the wind. Batched over EVERY market in view:
     * one stroke for all the strings, one fill per colour for all the pennants.
     */
    function drawBunting(ctx, list, t, size) {
      const cfg = C();
      const cols = cfg.PENNANT_COLS;
      const plen = size * cfg.PENNANT_LEN;
      const gap = Math.max(1, size * cfg.PENNANT_GAP);
      // the strings
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = cfg.BUNTING_COL;
      ctx.lineWidth = Math.max(0.4, size * 0.012);
      ctx.beginPath();
      let nl = 0;
      for (let m = 0; m < list.length; m++) {
        const lm = list[m], lines = lm.a.bunting;
        for (let i = 0; i < lines.length; i++) {
          const ln = lines[i];
          const sag = Math.hypot(ln.x1 - ln.x0, ln.y1 - ln.y0) * cfg.BUNTING_SAG
            * (1 + 0.1 * Math.sin(t * 0.9 + lm.ph + i));
          ctx.moveTo(ln.x0, ln.y0);
          ctx.quadraticCurveTo((ln.x0 + ln.x1) / 2, (ln.y0 + ln.y1) / 2 + sag * 2, ln.x1, ln.y1);
          nl++;
        }
      }
      ctx.stroke();
      st.calls += 2 + 2 * nl;
      // the pennants, a colour at a time
      let total = 0;
      for (let c = 0; c < cols.length; c++) {
        ctx.fillStyle = cols[c];
        ctx.beginPath();
        let any = 0;
        for (let m = 0; m < list.length; m++) {
        const lm = list[m], lines = lm.a.bunting;
        let k = 0;
        for (let i = 0; i < lines.length; i++) {
          const ln = lines[i];
          const dx = ln.x1 - ln.x0, dy = ln.y1 - ln.y0, L = Math.hypot(dx, dy);
          const sag = L * cfg.BUNTING_SAG * (1 + 0.1 * Math.sin(t * 0.9 + lm.ph + i));
          const cxp = (ln.x0 + ln.x1) / 2, cyp = (ln.y0 + ln.y1) / 2 + sag * 2;
          const np = Math.max(2, Math.floor(L / gap));
          const du = 0.32 / np;
          for (let j = 0; j < np; j++, k++) {
            if (k % cols.length !== c) continue;
            const u = (j + 0.5) / np;
            const ax = qx(ln.x0, cxp, ln.x1, u - du), ay = qx(ln.y0, cyp, ln.y1, u - du);
            const bx = qx(ln.x0, cxp, ln.x1, u + du), by = qx(ln.y0, cyp, ln.y1, u + du);
            const fl = Math.sin(t * TAU * cfg.FLUTTER_HZ + j * 1.7 + i * 2.3 + lm.ph);
            const mx = (ax + bx) / 2, my = (ay + by) / 2;
            ctx.moveTo(ax, ay);
            ctx.lineTo(bx, by);
            ctx.lineTo(mx + wind.x * plen * cfg.FLUTTER * fl, my + plen * (1 - 0.25 * Math.abs(fl)));
            ctx.closePath();
            any++;
          }
        }
        }
        ctx.fill();
        st.calls += 3 + any * 4;
        total += any;
      }
      st.pennants += total;
    }
    function qx(a, c, b, u) { const v = 1 - u; return v * v * a + 2 * v * u * c + u * u * b; }

    /**
     * Crows wheeling over the ruin: CROWS birds evenly spaced round a slow ellipse (flattened
     * for the view), flapping in bursts and gliding between them. One stroke for every abbey
     * in view.
     */
    function drawCrows(ctx, list, t, size) {
      const cfg = C();
      const n = Math.max(0, cfg.CROWS | 0);
      if (!n) return;
      const bw = size * cfg.CROW_SIZE;
      ctx.globalAlpha = cfg.CROW_ALPHA;
      ctx.strokeStyle = 'rgb(' + cfg.CROW_COL + ')';
      ctx.lineWidth = Math.max(0.6, size * 0.028);
      ctx.beginPath();
      for (let m = 0; m < list.length; m++) {
      const lm = list[m], c = lm.a.crows;
      for (let k = 0; k < n; k++) {
        const a = t * cfg.CROW_SPEED + lm.ph + k * TAU / n + 0.35 * Math.sin(t * 0.21 + k * 1.3);
        const rr = c.r * (0.85 + 0.15 * Math.sin(t * 0.37 + k * 2.1));
        const x = c.x + Math.cos(a) * rr, y = c.y + Math.sin(a) * rr * 0.55;
        const beat = Math.sin(t * 5.2 + k * 1.9);
        const glide = clamp01(Math.sin(t * 0.9 + k * 2.4) * 1.5 + 0.5);
        const lift = bw * (0.2 + 0.55 * Math.abs(beat) * (1 - glide)) * (beat < 0 && glide < 0.5 ? -0.4 : 1);
        ctx.moveTo(x - bw, y - lift);
        ctx.lineTo(x, y);
        ctx.lineTo(x + bw, y - lift);
      }
      }
      ctx.stroke();
      st.calls += 3 * n * list.length + 2;
      st.crows += n * list.length;
    }

    function drawLandmarks(ctx, t, size, tier, scale, winter) {
      const cfg = C();
      const cap = Math.max(0, cfg.MAX_LANDMARKS | 0);
      let n = 0;

      // Below the LOD floor the tower is a silhouette and so are the sails: two strokes a
      // mill, batched into one path for the whole board. Nothing else animates out there.
      if (tier === 0) {
        let any = 0;
        ctx.strokeStyle = '#4a3f33';
        ctx.lineWidth = size * 0.06;
        ctx.globalAlpha = 1;
        ctx.beginPath();
        for (let i = 0; i < visible.length && n < cap; i++) {
          const lm = visible[i].lm;
          if (!lm) continue;
          n++;
          if (lm.kind !== 'windmill') continue;
          const h = lm.a.hub, ang = t * cfg.SAIL_SPEED + lm.ph;
          const cs = Math.cos(ang) * lm.a.r, sn = Math.sin(ang) * lm.a.r;
          ctx.moveTo(h.x - cs, h.y - sn); ctx.lineTo(h.x + cs, h.y + sn);
          ctx.moveTo(h.x + sn, h.y - cs); ctx.lineTo(h.x - sn, h.y + cs);
          any++;
        }
        ctx.stroke();
        st.calls += any * 4 + 2;
        st.landmarks = n;
        return;
      }

      for (let i = 0; i < visible.length && n < cap; i++) {
        const lm = visible[i].lm;
        if (!lm) continue;
        n++;
        if (lm.kind === 'windmill') {
          // the sails are quarter-symmetric, so only the angle mod 90° ever shows
          const ang = (t * cfg.SAIL_SPEED + lm.ph) % (Math.PI / 2);
          const h = lm.a.hub;
          ctx.globalAlpha = 1;
          const sp = sailSprite(lm.a.s, scale);
          if (sp) {
            ctx.save();
            ctx.translate(h.x, h.y);
            ctx.rotate(ang);
            ctx.drawImage(sp.canvas, -sp.E, -sp.E, sp.E * 2, sp.E * 2);
            ctx.restore();
            st.calls += 5;
          } else {
            HG.Renderer.drawSails(ctx, h.x, h.y, lm.a.s, ang, true);
            st.calls += 90;
          }
        } else if (lm.kind === 'chapel' && tier > 1) {
          // candlelight: two incommensurate sines per window, so it gutters rather than blinks
          const ws = lm.a.windows;
          for (let k = 0; k < ws.length; k++) {
            const f = 0.62 + 0.24 * Math.sin(t * 2.9 + k * 2.1 + lm.ph)
              + 0.14 * Math.sin(t * 7.7 + k * 4.3 + lm.ph * 3);
            const r = size * cfg.GLOW_R;
            blob(ctx, ws[k].x, ws[k].y, r, r * 1.3, cfg.GLOW_COL, cfg.GLOW_ALPHA * f, st);
          }
        } else if (lm.kind === 'stones') {
          const c = lm.a.centre;
          const br = 0.5 + 0.5 * Math.sin(t * TAU * cfg.RUNE_HZ + lm.ph);
          const ra = cfg.RUNE_ALPHA;
          blob(ctx, c.x, c.y, size * cfg.RUNE_R, size * cfg.RUNE_R * 0.62, cfg.RUNE_COL,
            ra[0] + (ra[1] - ra[0]) * br, st);
          if (tier > 1) {
            const nm = Math.max(0, cfg.MOTES | 0);
            for (let k = 0; k < nm; k++) {
              // Each mote lives one cycle; WHERE it rises is a hash of which cycle it is in,
              // so it is still a pure function of t.
              const v = t / cfg.MOTE_SEC + k / nm + lm.ph;
              const cyc = Math.floor(v), u = v - cyc;
              const ang = rnd(visible[i].seed, k * 7 + 1, cyc) * TAU;
              const rr = 0.35 + 0.5 * rnd(visible[i].seed, k * 7 + 2, cyc);
              const x = c.x + Math.cos(ang) * lm.a.rx * rr + Math.sin(u * 4 + k) * size * 0.03;
              const y = c.y + Math.sin(ang) * lm.a.ry * rr - u * size * cfg.MOTE_RISE;
              const m = size * 0.03;
              blob(ctx, x, y, m, m, cfg.MOTE_COL, cfg.MOTE_ALPHA * Math.sin(u * Math.PI), st);
            }
          }
        } else if (lm.kind === 'watermill') {
          if (lm.a.wheel && lm.a.wheel.r > 0) drawWheel(ctx, lm, t, scale);
        } else if (lm.kind === 'beehives') {
          // no bees in winter; and they are specks, so only up close
          if (tier > 1 && !winter && lm.a.hives && lm.a.hives.length) drawBees(ctx, visible[i], lm, t, size);
        } else if (lm.kind === 'market') {
          // bunting and crows are fine-tier only (the overview budget has no room for them,
          // and at < 26 px a hex they are a smudge), batched over every one in view
          if (tier > 1 && lm.a.bunting && lm.a.bunting.length) buntList.push(lm);
        } else if (lm.kind === 'abbey') {
          if (tier > 1 && lm.a.crows && lm.a.crows.r > 0) crowList.push(lm);
        }
      }
      if (buntList.length) drawBunting(ctx, buntList, t, size);
      if (crowList.length) drawCrows(ctx, crowList, t, size);
      buntList.length = 0; crowList.length = 0;
      ctx.globalAlpha = 1;
      st.landmarks = n;
    }

    // ---- 5. cloud shadows ------------------------------------------------

    function drawClouds(ctx, t, size) {
      const cfg = C();
      if (!boardBox) return;
      const r = size * cfg.CLOUD_R;
      const spanX = (boardBox.x1 - boardBox.x0) + r * 4;
      const spanY = (boardBox.y1 - boardBox.y0) + r * 4;
      const n = Math.max(0, cfg.CLOUDS | 0);
      for (let i = 0; i < n; i++) {
        const bx = rnd(i + 3, 5, 61) * spanX;
        const by = rnd(i + 3, 9, 71) * spanY;
        const sc = 0.75 + rnd(i + 3, 13, 81) * 0.6;
        const x = boardBox.x0 - r * 2 + frac((bx + t * cfg.CLOUD_SPEED * wind.x) / spanX) * spanX;
        const y = boardBox.y0 - r * 2 + frac((by + t * cfg.CLOUD_SPEED * wind.y * 0.6) / spanY) * spanY;
        blob(ctx, x, y, r * sc * 1.35, r * sc * 0.8, cfg.CLOUD_COL, cfg.CLOUD_ALPHA, st);
      }
    }

    // ---- 6. birds --------------------------------------------------------

    /**
     * A flock every BIRD_PERIOD seconds or so. The whole flight is a function of
     * floor(t / BIRD_PERIOD), so it is deterministic under __hedge.render(dt) and identical
     * on a replay; only WHERE it crosses depends on the camera.
     */
    function drawBirds(ctx, t, cam, size) {
      const cfg = C();
      const period = Math.max(1, cfg.BIRD_PERIOD);
      const k = Math.floor(t / period);
      const h = hash32(k, 313, 7);
      if ((h % 1000) / 1000 >= cfg.BIRD_CHANCE) return;
      const local = t - k * period;
      if (local > cfg.BIRD_CROSS) return;
      const u = local / cfg.BIRD_CROSS;

      // The flight is anchored to the LANDSCAPE, not the camera: it crosses the board's world
      // box, so panning moves the flock with the ground the way everything else moves (Nic's
      // 2026-09-18 note — a camera-relative flock looked glued to the glass).
      if (!boardBox) return;
      const m = size * 4;
      const bx0 = boardBox.x0 - m, bx1 = boardBox.x1 + m;
      const by0 = boardBox.y0 - m, by1 = boardBox.y1 + m;
      const w = bx1 - bx0, hgt = by1 - by0;
      const rev = ((h >>> 5) & 1) === 1;
      const x = rev ? bx1 - u * w : bx0 + u * w;
      const y = by0 + (0.15 + 0.7 * ((h >>> 9) % 1000) / 1000) * hgt
        + Math.sin(u * TAU * 1.3) * size * 0.9;
      const face = rev ? -1 : 1;
      const n = cfg.BIRD_MIN + (h % Math.max(1, cfg.BIRD_MAX - cfg.BIRD_MIN + 1));
      const bw = size * cfg.BIRD_SIZE;

      ctx.globalAlpha = cfg.BIRD_ALPHA * Math.min(1, u * 8, (1 - u) * 8);
      ctx.strokeStyle = 'rgb(' + cfg.BIRD_COL + ')';
      ctx.lineWidth = Math.max(0.6, size * 0.022);
      ctx.beginPath();
      let calls = 0;
      for (let i = 0; i < n; i++) {
        const rank = Math.ceil(i / 2), side = (i % 2) ? 1 : -1;
        const bx = x - face * rank * bw * 3.2;
        const by = y + side * rank * bw * 2.0;
        const flap = Math.sin(t * cfg.BIRD_FLAP + i * 0.9);
        const lift = bw * (0.28 + 0.62 * Math.abs(flap)) * (flap < 0 ? -0.45 : 1);
        ctx.moveTo(bx - bw, by - lift);
        ctx.lineTo(bx, by);
        ctx.lineTo(bx + bw, by - lift);
        calls += 3;
      }
      ctx.stroke();
      st.calls += calls + 2;
      st.birds = n;
    }

    // ---- the frame -------------------------------------------------------

    /**
