<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kickback</title>
<style>
/* ==== UI: "Live Ordnance" — blackened iron plates cut at the corners, brass rims, hazard tape, stencilled
   paint. Display face = Big Shoulders Stencil (Google, loaded by UI EXTRAS) → Bahnschrift condensed (every
   Windows) → Impact; text = Bahnschrift. Everything scales by --ui (set from the window size in resize()).
   Per world, --acc / --glow / --ink come from WORLDS[i].ui (defaults below). ==== */
:root { --ui: 1;
  --iron0: #07080a; --iron1: #0e1013; --iron2: #15181c; --iron3: #1e2227; --iron4: #2b3037; --edge: #4a525c;
  --brass: #d9a54a; --brass-hi: #ffe1a0; --brass-lo: #7b4f16;
  --bone: #f2e6ca; --bone2: #cdbf9f; --bone3: #8e846f;
  --hot: #ff6b2c; --hot-hi: #ffc463; --hazard: #f3b52d; --tar: #120d09; --red: #d8432a;
  --gold: #f7c843; --silver: #d5dce4; --bronze: #d68c52;
  --acc: #d9a54a; --glow: #ffe1a0; --ink: #1b1309;
  --disp: "Big Shoulders Stencil Display", Bahnschrift, Impact, "Arial Narrow", sans-serif;
  --txt: Bahnschrift, "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --spring: cubic-bezier(.2, .9, .25, 1.18); }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0705; color: var(--bone);
  font-family: var(--txt); font-stretch: 87.5%; user-select: none; -webkit-font-smoothing: antialiased; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
:where(#ui) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  text-align: inherit; letter-spacing: inherit; -webkit-tap-highlight-color: transparent; }
:where(#ui) button:focus { outline: none; }
.disp { font-family: var(--disp); font-stretch: 75%; font-weight: 800; text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums; }

/* ---- screens + transitions (show() adds .leaving to the screen it hides) ---- */
.screen { position: fixed; inset: 0; display: none; z-index: 2; }
.screen.on { display: flex; }
.screen.leaving { display: flex; z-index: 1; pointer-events: none; animation: kbOut .17s ease-in forwards; }
.screen.leaving .side { animation: kbSideOut .17s ease-in forwards; }
@keyframes kbOut { to { opacity: 0; } }
@keyframes kbSideOut { to { transform: translateX(-40px); } }
/* entrances fill BACKWARDS only, so once they end the focus/hover transitions own transform again */
.screen.on .an { animation: kbIn .42s var(--spring) backwards; animation-delay: calc(var(--d, 0) * 1ms); }
.screen.on .an-up { animation: kbUp .42s var(--spring) backwards; animation-delay: calc(var(--d, 0) * 1ms); }
.screen.on .an-pop { animation: kbPop .38s var(--spring) backwards; animation-delay: calc(var(--d, 0) * 1ms); }
.screen.on .an.kick { animation: kbIn .42s var(--spring) backwards, kbRecoil .26s var(--spring); animation-delay: calc(var(--d, 0) * 1ms), 0s; }
@keyframes kbIn { from { opacity: 0; transform: translateX(-34px); } }
@keyframes kbUp { from { opacity: 0; transform: translateY(26px); } }
@keyframes kbPop { from { opacity: 0; transform: scale(.88); } }
@keyframes kbFade { from { opacity: 0; } }
.screen.on { animation: kbFade .2s ease-out both; }

/* ---- plates: chamfered iron with a rim (::before) and a fill (::after); content sits on top ---- */
.pl { position: relative; isolation: isolate; --c: 14px; --rim: linear-gradient(170deg, #636b75, #2a2f35 55%, #1a1d21);
  --fill: linear-gradient(172deg, #1f2328, #14171b 60%, #101215); }
.pl::before, .pl::after { content: ''; position: absolute; z-index: -1; pointer-events: none;
  clip-path: polygon(var(--c) 0, 100% 0, 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, 0 100%, 0 var(--c)); }
.pl::before { inset: 0; background: var(--rim); }
.pl::after { inset: 2px; background: var(--fill);
  clip-path: polygon(calc(var(--c) - 1px) 0, 100% 0, 100% calc(100% - var(--c) + 1px), calc(100% - var(--c) + 1px) 100%, 0 100%, 0 calc(var(--c) - 1px)); }
.riv { --rv: radial-gradient(circle, #a2abb5 0 1.5px, #3b4148 2.3px, #08090a 3.3px, transparent 3.8px);
  --fill: var(--rv) right 9px top 9px / 8px 8px no-repeat, var(--rv) left 9px bottom 9px / 8px 8px no-repeat,
  linear-gradient(172deg, #1f2328, #14171b 60%, #101215); }
.haz { height: 7px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 9px, var(--tar) 9px 18px); }

/* ---- plate buttons ---- */
.btn { --c: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 150px; padding: 13px 24px 12px;
  font: 800 25px/1 var(--disp); font-stretch: 75%; letter-spacing: .06em; text-transform: uppercase; color: var(--bone2);
  transition: transform .14s var(--spring), color .1s, filter .14s; }
.btn:focus, .btn:hover { color: var(--ink); transform: translateY(-2px);
  --rim: linear-gradient(170deg, #fff0c4, var(--brass) 45%, var(--brass-lo));
  --fill: linear-gradient(176deg, #ffe7ac, #f0b452 48%, #c47a24);
  filter: drop-shadow(0 0 14px rgba(255,170,70,.45)) drop-shadow(0 4px 0 rgba(0,0,0,.5)); }
.btn.pri { color: var(--hot-hi); }
.btn.pri:focus, .btn.pri:hover { --fill: linear-gradient(176deg, #ffd38a, #ff8a3a 50%, #c8401c); color: #1d0a04; }
.kick { animation: kbRecoil .26s var(--spring); }
@keyframes kbRecoil { 0% { translate: 0; } 25% { translate: -7px 0; } 60% { translate: 2px 0; } 100% { translate: 0; } }
.btn .ar { width: 0; height: 0; border-style: solid; border-width: 7px 0 7px 11px; border-color: transparent transparent transparent currentColor; }

/* ---- menu lists (title, pause): stencilled words, a brass shell points at the focused one, its fuse burns ---- */
.menu { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.mi { position: relative; display: block; padding: 7px 20px 9px 46px; font: 800 50px/1 var(--disp); font-stretch: 75%;
  letter-spacing: .04em; text-transform: uppercase; color: var(--bone); opacity: .62;
  text-shadow: 0 3px 0 rgba(0,0,0,.55); transition: transform .18s var(--spring), opacity .12s, color .12s; }
.mi::before { content: ''; position: absolute; left: 0; top: 50%; width: 34px; height: 18px; margin-top: -10px; opacity: 0;
  transform: translateX(-16px); transition: transform .2s var(--spring), opacity .12s;
  clip-path: polygon(0 18%, 58% 18%, 58% 0, 76% 0, 100% 50%, 76% 100%, 58% 100%, 58% 82%, 0 82%);
  background: linear-gradient(#fff0c4, var(--brass) 45%, var(--brass-lo)); filter: drop-shadow(0 2px 0 #000); }
.mi::after { content: ''; position: absolute; left: 46px; right: 20px; bottom: 1px; height: 4px; opacity: 0; transform: scaleX(0);
  transform-origin: left; transition: transform .3s var(--spring), opacity .1s;
  background: radial-gradient(circle, #fff7d0 0 2px, #ffb347 3px, rgba(255,120,30,.6) 5px, transparent 8px) no-repeat,
    repeating-linear-gradient(90deg, #d8c39a 0 6px, #8a7550 6px 9px);
  background-size: 16px 16px, 100% 3px; background-position: 100% 50%, 0 50%; }
.mi:focus, .mi:hover { opacity: 1; color: #fff4dc; transform: translateX(12px);
  text-shadow: 0 3px 0 rgba(0,0,0,.6), 0 0 22px rgba(255,150,60,.55); }
.mi:focus::before, .mi:hover::before { opacity: 1; transform: none; }
.mi:focus::after { opacity: 1; transform: none; animation: kbFuse 2.6s linear infinite; }
@keyframes kbFuse { from { background-position: 100% 50%, 0 50%; } to { background-position: 0% 50%, 0 50%; } }
#title .mi[data-act="levels"] { font-size: 65px; }   /* Play: 30% bigger than the other menu words */
#gl-exit-btn { color: #d99a86; }   /* leave, not play */
#gl-exit-confirm { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 50%, rgba(6,5,4,.6), rgba(4,3,2,.92) 72%); }
#gl-exit-confirm .glx { width: 520px; --acc: #ff8a3a; --glow: #ffb347; }
.glxBody { padding: 0 34px; font: 600 19px/1.35 var(--txt); color: var(--bone2); }
#gl-exit-confirm .resBtns { display: flex; gap: 14px; padding: 0 34px; }
#gl-player-chip { position: absolute; left: 0; top: 0; zoom: var(--ui); margin: 34px 0 0 40px; align-items: center; gap: 8px;
  font: 700 17px/1 var(--txt); letter-spacing: .14em; text-transform: uppercase; color: var(--bone2); opacity: .75; }
.mi kbd { position: relative; top: -9px; margin-left: 12px; vertical-align: middle; font-size: 14px; text-shadow: none; }

/* ---- shop (COINS + SHOP block): two rows of item cards over the attract backdrop ---- */
#shop { align-items: center; justify-content: center; background: linear-gradient(rgba(7,5,4,.8), rgba(7,5,4,.9)); }
.shH { margin: 6px 0 10px; font: 700 15px/1 var(--txt); letter-spacing: .3em; color: var(--brass); text-transform: uppercase; }
.shRow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
.sc { --c: 14px; --wa: var(--brass); --wg: var(--brass-hi); height: 196px; padding: 10px 10px 13px; display: flex; flex-direction: column; align-items: center;
  gap: 5px; text-align: center; opacity: .9; transition: transform .14s var(--spring), filter .14s, opacity .1s; }
.sc canvas { position: static; width: 100px; height: 100px; flex: none; }   /* not the game canvas's fixed full-screen rule */
.sc .nm { font: 800 23px/1 var(--disp); font-stretch: 75%; letter-spacing: .02em; text-transform: uppercase; color: var(--bone); }
.sc .pr { margin-top: auto; display: inline-flex; align-items: center; gap: 7px; font: 800 22px/1 var(--disp); font-stretch: 75%; color: var(--bone); }
.sc .pr i, .coin { display: inline-block; width: 15px; height: 15px; border-radius: 50%; vertical-align: -2px;
  background: radial-gradient(circle at 35% 30%, #fff3c0, #e8b448 50%, #8a5c18); box-shadow: inset 0 0 0 1.5px #5a3a10, 0 0 8px rgba(255,200,90,.5); }
.sc.own .pr, .sc.eq .pr { font: 700 13px/1 var(--txt); letter-spacing: .22em; text-transform: uppercase; color: var(--bone3); }
.sc.eq { opacity: 1; --rim: linear-gradient(170deg, var(--wg), var(--wa) 50%, color-mix(in srgb, var(--wa) 40%, #000)); }
.sc.eq .pr { color: var(--wa); }
.sc.poor canvas { filter: grayscale(.85) brightness(.5); }
.sc.poor .nm { color: var(--bone2); }
.sc.poor .pr { color: var(--bone3); }
.sc.poor .pr i { filter: grayscale(.6) brightness(.7); }
.sc:focus, .sc:hover { opacity: 1; transform: translateY(-4px); filter: drop-shadow(0 0 14px color-mix(in srgb, var(--wa) 55%, transparent)); }
.sc:focus { --rim: linear-gradient(170deg, #fff4d4, var(--wg) 40%, var(--wa)); }
.shInfo { --c: 12px; min-height: 58px; padding: 12px 22px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.shInfo b { font: 800 24px/1 var(--disp); font-stretch: 75%; letter-spacing: .03em; text-transform: uppercase; color: var(--bone); }
.shInfo b em { font-style: normal; margin-left: 12px; font: 700 13px/1 var(--txt); letter-spacing: .2em; color: var(--brass); }
.shInfo span { font: 500 17px/1.2 var(--txt); color: var(--bone2); }

/* ---- side column screens (title, pause, options) ---- */
#title, #pause, #options { align-items: stretch;
  background: linear-gradient(90deg, rgba(7,5,4,.92) 0, rgba(7,5,4,.8) 34%, rgba(7,5,4,.34) 58%, rgba(7,5,4,0) 76%),
    radial-gradient(ellipse at 72% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.5)); }
#pause { background: linear-gradient(90deg, rgba(7,5,4,.92) 0, rgba(7,5,4,.76) 30%, rgba(7,5,4,.3) 56%, rgba(7,5,4,.18) 100%); }
.side { zoom: var(--ui); box-sizing: border-box; height: calc(100vh / var(--ui)); padding: 0 0 0 92px; width: 720px;
  display: flex; flex-direction: column; justify-content: center; gap: 26px; }

/* ---- the logo: the bomb fires, the letters take the kick ---- */
.logo { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-left: -8px; }
.logo .mark { display: flex; align-items: center; gap: 4px; }
.bombmark { width: 176px; height: 176px; flex: none; overflow: visible; margin: 0 -10px 0 -26px; filter: drop-shadow(0 8px 0 rgba(0,0,0,.45)); }
.bombmark .body { animation: kbBombKick 5s cubic-bezier(.25,.8,.3,1) infinite; }
.bombmark .gun { animation: kbOrbit 5s linear infinite; }
.bombmark .flash { animation: kbFlash 5s linear infinite; opacity: 0; }
.bombmark .puff { animation: kbPuff 5s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; }
.bombmark .puff.p2 { animation-delay: .05s; }
.bombmark .eyes { animation: kbBlink 3.7s infinite; transform-box: fill-box; transform-origin: center; }
.bombmark .spark { animation: kbSpark .23s steps(2) infinite; transform-box: fill-box; transform-origin: center; }
@keyframes kbOrbit { from { rotate: 0deg; } to { rotate: 360deg; } }
@keyframes kbFlash { 0%, 49.4% { opacity: 0; } 50% { opacity: 1; } 53% { opacity: 0; } }
@keyframes kbPuff { 0%, 49.9% { opacity: 0; transform: translate(0, 0) scale(.4); } 50.2% { opacity: .9; } 66% { opacity: 0; transform: translate(-46px, -14px) scale(1.7); } 100% { opacity: 0; } }
@keyframes kbBombKick { 0%, 49.9% { translate: 0; } 51.2% { translate: 22px 0; } 58% { translate: -3px 0; } 64%, 100% { translate: 0; } }
@keyframes kbBlink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes kbSpark { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(.6) rotate(40deg); opacity: .75; } }
.word { position: relative; margin: 0; display: flex; font: 900 168px/.84 var(--disp); font-stretch: 75%; letter-spacing: .005em;
  filter: drop-shadow(0 0 36px rgba(255,120,40,.28)); }
.word i { position: relative; isolation: isolate; display: inline-block; font-style: normal; padding: 0 1px;
  color: var(--tar); -webkit-text-stroke: 15px var(--tar); animation: kbKick 5s cubic-bezier(.2,.7,.3,1) infinite;
  animation-delay: calc(var(--i) * 34ms); }
.word i::before, .word i::after { content: attr(data-c); position: absolute; left: 0; top: 0; padding: inherit; }
.word i::before { z-index: -1; transform: translateY(10px); color: #3a1608; -webkit-text-stroke: 15px #2a1007; }
.word i::after { -webkit-text-stroke: 0; color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(180deg, #fff6d6 4%, #ffd27a 30%, #ff8a2a 62%, #c8361a 98%); }
.word .bk i::before { color: #2c2216; -webkit-text-stroke-color: #1e170e; }
.word .bk i::after { background-image: linear-gradient(180deg, #ffffff 4%, #f6e9cb 40%, #d6c19a 75%, #a98f66 98%); }
.word .bk { margin-left: 14px; }
.word .kk, .word .bk { display: flex; }
@keyframes kbKick { 0%, 50.6% { transform: none; } 51.6% { transform: translateX(15px) skewX(-7deg); } 54.5% { transform: translateX(-4px) skewX(2deg); }
  58% { transform: translateX(1px); } 61%, 100% { transform: none; } }
/* tagline = hazard stripe + recoil chevrons drifting back; .wban .tag = the same idea per world (--pat/--tw from [data-w]) */
.tagline { display: flex; align-items: center; gap: 14px; height: 17px; margin: 14px 0 0 2px; }
.tagline::before { content: ''; width: 46px; height: 7px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 7px, var(--tar) 7px 14px); }
.tagline::after, .wban .tag { content: ''; width: 560px; height: 14px; background: linear-gradient(90deg, var(--hot-hi), var(--hot) 60%);
  --pat: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='14'><path d='M10 1H15L9 7L15 13H10L4 7Z'/></svg>"); --tw: 18px;
  mask-image: var(--pat), linear-gradient(90deg, #000 55%, transparent); mask-size: var(--tw) 100%, 100% 100%; mask-repeat: repeat-x, no-repeat;
  mask-composite: intersect; animation: patDrift 1.4s linear infinite reverse; }
@keyframes patDrift { from { mask-position: 0 0, 0 0; } to { mask-position: var(--tw) 0, 0 0; } }
.wban .tag { width: 400px; height: 16px; margin-top: 12px; background: linear-gradient(90deg, var(--glow), var(--acc)); animation: patDrift 2.4s linear infinite; }
.wban .tag[data-w="1"] { --tw: 20px; --pat: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='16'><path d='M0 16C4 14 6 9 5 2C9 6 11 10 10 16C12 12 14 10 15 6C17 10 19 13 20 16Z'/></svg>"); }
.wban .tag[data-w="2"] { --tw: 18px; --pat: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='16'><path d='M0 0H18V2L15 4L13 15L11 4L9 2L7 4L5 10L3 4L0 2Z'/></svg>"); }
.wban .tag[data-w="3"] { --tw: 24px; --pat: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='16'><path d='M0 8Q6 1 12 8T24 8V12Q18 5 12 12T0 12Z'/></svg>"); }
.wban .tag[data-w="4"] { --tw: 30px; --pat: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='16'><circle cx='8' cy='8' r='6' fill='none' stroke='black' stroke-width='1.6'/><circle cx='8' cy='8' r='2.2'/><circle cx='14' cy='8' r='1.4'/><circle cx='23' cy='5' r='1'/><circle cx='26' cy='11' r='.8'/></svg>"); }
.wban .tag[data-w="5"] { --tw: 16px; --pat: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><path d='M0 11L8 3L16 11V15L8 7L0 15Z'/></svg>"); }
.wban .tag[data-w="6"] { --tw: 22px; --pat: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='16'><path d='M9 0H16L12 6H17L6 16L9 8H5Z'/></svg>"); }

/* ---- keycaps + small print ---- */
kbd { display: inline-block; min-width: 14px; padding: 5px 7px 4px; font: 700 13px/1 var(--txt); letter-spacing: .06em; color: var(--bone);
  background: linear-gradient(#3a4048, #22262b); border-radius: 3px; box-shadow: 0 2px 0 #08090a, inset 0 1px 0 rgba(255,255,255,.14); text-align: center; }
.record { position: absolute; right: 0; bottom: 0; zoom: var(--ui); margin: 0 44px 40px 0; padding: 14px 22px 14px 26px; --c: 12px;
  display: flex; gap: 26px; align-items: center; }
.record div { display: flex; flex-direction: column; gap: 4px; font: 600 12px/1 var(--txt); letter-spacing: .22em; color: var(--bone3); text-transform: uppercase; }
.record b { font: 800 30px/1 var(--disp); font-stretch: 75%; letter-spacing: .02em; color: var(--bone); }
.record .t { writing-mode: vertical-rl; rotate: 180deg; font: 700 11px/1 var(--txt); letter-spacing: .3em; color: var(--brass); }

/* ---- medals ---- */
.md { display: inline-block; width: 18px; height: 18px; border-radius: 50%; flex: none; box-sizing: border-box;
  border: 2px solid rgba(0,0,0,.55); background: #22262b; box-shadow: inset 0 1px 2px rgba(0,0,0,.8); }
.md.m0 { background: radial-gradient(circle at 36% 30%, #fffbe0, var(--gold) 42%, #a26e10 100%); box-shadow: 0 0 8px rgba(247,200,67,.5); }
.md.m1 { background: radial-gradient(circle at 36% 30%, #ffffff, var(--silver) 42%, #7d8793 100%); }
.md.m2 { background: radial-gradient(circle at 36% 30%, #ffe0c0, var(--bronze) 42%, #7e4720 100%); }
.md.m3 { background: radial-gradient(circle at 36% 30%, #6c737c, #3a4047); }
/* engraved rank emblem so the tiers read by shape, not just colour: gold star, silver diamond, bronze triangle */
.md.m0, .md.m1, .md.m2 { position: relative; }
.md.m0::after, .md.m1::after, .md.m2::after { content: ''; position: absolute; inset: 16%; }
.md.m0::after { background: #8a5a0c; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.md.m1::after { background: #56606c; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); inset: 12%; }
.md.m2::after { background: #5a2e12; clip-path: polygon(50% 6%, 98% 90%, 2% 90%); }
.stm { display: inline-flex; gap: 4px; }
.stm i { width: 10px; height: 10px; border-radius: 50%; background: #23272c; box-shadow: inset 0 1px 2px #000; }
.stm i.on { background: radial-gradient(circle at 35% 30%, #fff3c0, #e8b448 50%, #8a5c18); box-shadow: 0 0 6px rgba(255,200,90,.5); }

/* ---- level select ---- */
#levels { align-items: center; justify-content: center;
  background: linear-gradient(rgba(3,2,2,.55), rgba(3,2,2,0) 22%, rgba(3,2,2,0) 78%, rgba(3,2,2,.55)),
    radial-gradient(ellipse at 50% 46%, rgba(6,5,4,.83), rgba(5,4,3,.92) 70%, rgba(3,2,2,.97)); }
.full { zoom: var(--ui); width: min(1360px, calc(100vw / var(--ui) - 40px)); display: flex; flex-direction: column; gap: 16px; }
.lvHead { display: flex; align-items: flex-end; gap: 18px; padding-bottom: 10px; border-bottom: 2px solid rgba(255,225,160,.1); }
.lvHead .t { font: 800 30px/1 var(--disp); font-stretch: 75%; letter-spacing: .14em; color: var(--bone2); text-transform: uppercase; }
.lvHead .haz { width: 58px; margin-bottom: 8px; }
.lvHead .tot { margin-left: auto; display: flex; gap: 24px; font: 600 14px/1 var(--txt); letter-spacing: .2em; color: var(--bone3); text-transform: uppercase; }
.lvHead .tot b { color: var(--bone); font-weight: 700; letter-spacing: .06em; font-size: 18px; margin-left: 6px; }
.worlds { display: flex; gap: 12px; }
.wc { flex: 1 1 0; min-width: 0; height: 132px; padding: 13px 16px 12px; --c: 12px; display: flex; flex-direction: column; justify-content: space-between;
  text-align: left; color: var(--bone2); opacity: .66; transition: transform .16s var(--spring), opacity .12s, filter .14s;
  --fill: linear-gradient(180deg, color-mix(in srgb, var(--wa) 16%, #171a1e), #111316 70%); }

/* ---- pause ---- */

.medalBox { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }

.medalBox .lab { font: 900 30px/1 var(--disp); font-stretch: 75%; letter-spacing: .14em; text-transform: uppercase; }

.screen.on .stampIn { animation: kbStamp .45s cubic-bezier(.3,1.5,.5,1) both; animation-delay: .18s; }
@keyframes kbStamp { 0% { opacity: 0; transform: scale(2.3) rotate(-14deg); } 55% { opacity: 1; transform: scale(.92) rotate(2deg); } 100% { transform: none; } }

.times { display: flex; flex-direction: column; gap: 10px; }

.ribbon { display: inline-flex; align-items: center; gap: 10px; margin-left: 8px; padding: 7px 14px 6px; font: 800 18px/1 var(--disp); font-stretch: 75%;

.gauge { position: relative; height: 64px; margin: 4px 40px 0 34px; }

.gauge .z { position: absolute; top: 0; bottom: 0; opacity: .85; }

.gauge .you { position: absolute; top: 0; width: 0; transform: translateX(-50%); }
.gauge .you::before { content: ''; position: absolute; left: -9px; top: 4px; border: 9px solid transparent; border-top: 13px solid var(--bone); filter: drop-shadow(0 2px 0 #000); }

  background: radial-gradient(circle, #fff 0 2px, #ffd56a 4px, rgba(255,120,30,.5) 7px, transparent 9px); animation: kbSpark .2s steps(2) infinite; }
.screen.on .gauge .you { animation: kbSlide .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: .2s; }
@keyframes kbSlide { from { left: 0; } }
.gauge .burn { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.35)); }

.resFoot { display: flex; align-items: center; gap: 30px; padding: 0 34px; }

  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }

<script>
(function () {   // Pickle Arcade exit confirm + player chip (the game's menuNav/menuActivate/back drive it by keyboard and pad)
  const btn = document.getElementById('gl-exit-btn'), ov = document.getElementById('gl-exit-confirm'),
    yes = document.getElementById('gl-exit-yes'), no = document.getElementById('gl-exit-no');
  const hide = () => { ov.style.display = 'none'; btn.focus(); };
  btn.addEventListener('click', () => { ov.style.display = 'flex'; no.focus(); });
  no.addEventListener('click', hide);
  yes.addEventListener('click', () => { window.close(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ov.style.display !== 'none') { e.stopPropagation(); hide(); }
  }, true);
  window.glExitOpen = () => ov.style.display !== 'none';
  window.glExitHide = hide;
  try {
    const p = new URLSearchParams(location.search), name = (p.get('playerName') || '').trim();
    if (!name) return;
    const chip = document.getElementById('gl-player-chip'), em = document.createElement('span');
    em.textContent = p.get('playerEmblem') || '';
    chip.appendChild(em); chip.appendChild(document.createTextNode(' ' + name));
    chip.style.display = 'inline-flex';
  } catch (e) {}
})();
</script>

// ==== WORLD 2 SIM (stream w2: WORLDS.push, MAT entries, HOOKS, LEVELS.push — all inside this block) ====
// World 2 — The Glacier Mine. Levels DESCEND (y grows positive). Two World 2 surfaces:
//   ice:  def.ice  [B()/P() polygons]  slick blue plates/slopes (kind 'ice', MAT.ice)
//   thin: def.thin [[x, topY, w]]      thin ice panes: hold a soft landing, shatter under a hard one.
//         Not solids — resolved in a HOOKS.post below, so collide() and check.mjs's field see open space.
//         S.ice = bitmask of broken panes (≤ 31 per level), reset on every respawn.
// Molten pools are drawn as ice-spike crevasses in this world (same data, same kill).
const W2 = {
  ICE_BREAK: 650,   // u/s straight into a pane's top face that shatters it (≈ a 260 u free fall)
  ICE_KEEP: 0.7,    // share of speed kept when you smash through
  PANE_H: 18,       // pane thickness
};
WORLDS.push({ n: 2, name: 'The Glacier Mine', ui: { accent: '#7fd3f7', glow: '#dff6ff', ink: '#06202d', tag: 'Brake your fall through the ice' } });
MAT.ice = { e: 0.3, mu: 0.01, roll: 0.03 };
HOOKS.build.push((L, def) => { for (const s of def.ice || []) addSolid(L, s.p, 'ice', 'ice'); });
HOOKS.built.push((L, def) => {
  L.thin = (def.thin || []).map(([x, y, w]) => ({ x0: x, y0: y, x1: x + w, y1: y + W2.PANE_H }));
});
HOOKS.post.push((L, S) => {
  if (!L.thin.length) return;
  if (S.iceD !== S.deaths) { S.ice = 0; S.iceD = S.deaths; }     // a respawn restores every pane
  const R = T.R, M = MAT.ice;
  for (let i = 0; i < L.thin.length; i++) {
    if (S.ice >> i & 1) continue;
    const p = L.thin[i];
    const qx = S.x < p.x0 ? p.x0 : S.x > p.x1 ? p.x1 : S.x, qy = S.y < p.y0 ? p.y0 : S.y > p.y1 ? p.y1 : S.y;

//            angle, tapering linearly to 0 over the last FAN_TAPER of the reach. Free flight only.
//   rings:   [x, y, angleDeg, r?]  boost hoop. Crossing its plane within r of the centre IN the arrow (angle)

  const un = S.vx * ux + S.vy * uy;
  if (un >= W3.BUMP_V * 0.9) return true;   // already kicked this contact
  const tx = S.vx - un * ux, ty = S.vy - un * uy, out = Math.max(W3.BUMP_V, -un);
  S.vx = tx * W3.BUMP_KEEP + ux * out; S.vy = ty * W3.BUMP_KEEP + uy * out;
  S.ev.push({ t: 'bump', s: b, x: b.cx + ux * b.r, y: b.cy + uy * b.r, nx: ux, ny: uy });

// ==== WORLD 4 SIM (stream w4) ====
// World 4 — The Orrery: gravity experiments. Gravity at the bomb centre is the FIRST match of
//   bubble > planet > zone > ambient (T.GRAV down) — a pure function of position and S.tick, so replays stay exact.
// Level-def keys (on top of World 1's; `pools` draw as starfire pits, `magnets` as lodestones):
//   zones:   [x, y, w, h, angleDeg, g?, period?, dwell?]  gravity field over a rect: g (default T.GRAV) along angleDeg
//            (90 = down, -90 = up, 0 = right). With `period` (s) it turns a full 360° clockwise per period; with
//            `dwell` (0..1) it holds each quarter-turn for that share of the quarter, then swings (smoothstep) on.
//   bubbles: [x, y, r]  zero-g: no gravity at all inside (air drag still applies) — you fly dead straight.
//   planets: [x, y, r, field, g?, sun?]  round solid body; within `field` of its centre gravity pulls toward the centre
//            at g (default W4.PLANET_G). sun = 1 → the body is deadly (MAT.sun), but still pulls.
//   sparks:  [x, y, w, h]  starfire strip: a deadly rect to line any face (ceilings, walls) — pools only cut floors.
const W4 = { PLANET_G: 1100 };
WORLDS.push({ n: 4, name: 'The Orrery', ui: { accent: '#b8a2ff', glow: '#ebe3ff', ink: '#140f33', tag: 'Clockwork gravity among the stars' } });
MAT.planet = { e: 0.45, mu: 0.3, roll: 1 };
MAT.sun = { kill: true };
MAT.starfire = { kill: true };
const w4dir = deg => [Math.round(Math.cos(deg * Math.PI / 180) * 1e6) / 1e6, Math.round(Math.sin(deg * Math.PI / 180) * 1e6) / 1e6];
function w4zoneAng(z, tick) {   // a clock zone's gravity angle (deg) on this tick
  if (!z.per) return z.a;
  const u = tick / (z.per * T.HZ) * 4, q = Math.floor(u);
  let f = u - q;
  if (z.dwell != null) { f = f < z.dwell ? 0 : (f - z.dwell) / (1 - z.dwell); f = f * f * (3 - 2 * f); }
  return z.a + (q + f) * 90;
}
const W4G = [0, 0];
function w4grav(L, x, y, tick) {   // gravity [gx, gy] at (x, y) on that tick (returns the shared W4G array)
  const o = W4G;
  for (const b of L.bubbles) if ((x - b.x) * (x - b.x) + (y - b.y) * (y - b.y) < b.r2) { o[0] = o[1] = 0; return o; }
  for (const p of L.planets) {
    const dx = p.cx - x, dy = p.cy - y, d2 = dx * dx + dy * dy;
    if (d2 < p.f2) { const d = Math.sqrt(d2) || 1; o[0] = dx / d * p.g; o[1] = dy / d * p.g; return o; }
  }
  for (const z of L.zones) {
    if (!(x > z.x0 && x < z.x1 && y > z.y0 && y < z.y1)) continue;
    if (z.per) { const a = w4zoneAng(z, tick) * Math.PI / 180; o[0] = Math.cos(a) * z.g; o[1] = Math.sin(a) * z.g; }
    else { o[0] = z.dx * z.g; o[1] = z.dy * z.g; }
    return o;
  }
  o[0] = 0; o[1] = T.GRAV; return o;
}
HOOKS.build.push((L, def) => {
  if ((def.world || 1) !== 4) return;
  L.zones = (def.zones || []).map(([x, y, w, h, deg, g = T.GRAV, per = 0, dwell]) => {
    const [dx, dy] = w4dir(deg); return { x0: x, y0: y, x1: x + w, y1: y + h, a: deg, dx, dy, g, per, dwell };
  });
  L.bubbles = (def.bubbles || []).map(([x, y, r]) => ({ x, y, r, r2: r * r }));
  L.planets = (def.planets || []).map(([x, y, r, f, g = W4.PLANET_G, sun = 0]) => {
    const n = Math.max(24, Math.round(r / 5)), p = [];
    for (let k = 0; k < n; k++) p.push(x + Math.cos(k / n * TAU) * r, y + Math.sin(k / n * TAU) * r);
    return Object.assign(addSolid(L, p, sun ? 'sun' : 'planet', sun ? 'sun' : 'planet'), { cx: x, cy: y, r, f, f2: f * f, g, sun: !!sun });
  });
  L.sparks = (def.sparks || []).map(([x, y, w, h]) => addSolid(L, rect(x, y, w, h), 'starfire', 'spark'));
  L.grav = (L, S) => { const g = w4grav(L, S.x, S.y, S.tick); S.vx += g[0] * DT; S.vy += g[1] * DT; };
});

// World 5 — Dynamite Canyon: a desert mining canyon. Levels climb out of it (−y) and run along it (+x).
// Level-def keys (on top of World 1's; `pools` draw as quicksand, `magnets` as tar pads):
//   kegs:     [x, y]         TNT keg (contact radius KEG_R). Touch it and it blows: you're thrown straight away from
//                            its centre at KEG_V, keeping KEG_KEEP of your speed — an aimable extra kick. Your shell sets
//                            one off from range too: on the shot's tick the barrel line is ray-cast like the drawn shell
//                            (SHELL_V for SHELL_LIFE s) and the first keg it meets blows when the shell gets there.
//                            A blast kicks the bomb out to BLAST (full to FULL, walls shield it), breaks every plug and
//                            ledge within BLAST, and sets off kegs within CHAIN after CHAIN_T s.
//   plugs:    [x, y, w, h]   cracked-rock plug: solid until a blast breaks it.
//   crumbles: [x, y, w, h?]  sandstone ledge (h default LEDGE_H): holds you, then gives way CRUMBLE s after first touch.
// Plugs and ledges are not solids — resolved in a HOOKS.post (own push-out), so collide() and check.mjs's field and
// gaps.mjs see open space there. A respawn restores every keg, plug and ledge.
// State in S, all primitives so clone() copies it exactly: w5d (deaths at the last reset), w5k / w5p / w5c bitmasks
// (kegs blown / plugs broken / ledges fallen, ≤ 31 each), w5f<i> keg i's fuse tick (0 = none), w5t<i> ledge i's first touch.
const W5 = {
  KEG_R: 26, KEG_V: 1350, KEG_KEEP: 0.35, FULL: 130, BLAST: 320, CHAIN: 260, CHAIN_T: 0.12,
  SHELL_V: 1500, SHELL_LIFE: 1.4, MUZZLE: T.R + 30,   // the renderer's shell: speed, life, spawn offset
  CRUMBLE: 0.45, LEDGE_H: 40,
};

MAT.sand = { e: 0.4, mu: 0.3, roll: 1 };
const W5CD = Math.round(T.COOLDOWN * T.HZ);   // S.cd on the very tick a shot fired
HOOKS.build.push((L, def) => {
  if ((def.world || 1) !== 5) return;
  L.w5 = true;
  L.kegs = (def.kegs || []).map(([x, y], i) => ({ x, y, f: 'w5f' + i }));
  L.plugs = (def.plugs || []).map(([x, y, w, h]) => ({ x0: x, y0: y, x1: x + w, y1: y + h }));
  L.crumbles = (def.crumbles || []).map(([x, y, w, h = W5.LEDGE_H], i) => ({ x0: x, y0: y, x1: x + w, y1: y + h, t: 'w5t' + i }));
});
function w5reset(L, S) {
  if (S.w5d === S.deaths) return;
  S.w5d = S.deaths; S.w5k = S.w5p = S.w5c = 0;
  for (const k of L.kegs) S[k.f] = 0;
  for (const c of L.crumbles) S[c.t] = 0;
}
function w5rock(L, S, x, y, pad) {   // an intact plug or ledge at (x, y)?
  for (let i = 0; i < L.plugs.length; i++) { const p = L.plugs[i]; if (!(S.w5p >> i & 1) && x > p.x0 - pad && x < p.x1 + pad && y > p.y0 - pad && y < p.y1 + pad) return true; }
  for (let i = 0; i < L.crumbles.length; i++) { const p = L.crumbles[i]; if (!(S.w5c >> i & 1) && x > p.x0 - pad && x < p.x1 + pad && y > p.y0 - pad && y < p.y1 + pad) return true; }
  return false;
}
function w5wall(L, x, y) {   // the drawn shell's own hit test: within 6 of a segment
  const cell = cellAt(L, x, y); if (!cell) return true;
  for (const g of cell) {
    const ex = g.bx - g.ax, ey = g.by - g.ay; let t = ((x - g.ax) * ex + (y - g.ay) * ey) / g.len2;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const dx = x - g.ax - ex * t, dy = y - g.ay - ey * t; if (dx * dx + dy * dy < 36) return true;
  }

}
const w5rd = (p, x, y) => Math.hypot(x - (x < p.x0 ? p.x0 : x > p.x1 ? p.x1 : x), y - (y < p.y0 ? p.y0 : y > p.y1 ? p.y1 : y));
function w5blow(L, S, i, by) {
  const k = L.kegs[i];
  S.w5k |= 1 << i; S[k.f] = 0;
  S.ev.push({ t: 'keg', i, x: k.x, y: k.y, by });
  const dx = S.x - k.x, dy = S.y - k.y, d = Math.hypot(dx, dy);
  let shield = false;
  if (d < W5.BLAST && d > W5.KEG_R + T.R + 4) {   // walls and intact rock shield you from a distant blast
    for (let s = W5.KEG_R; s < d - T.R && !shield; s += 12) { const x = k.x + dx / d * s, y = k.y + dy / d * s; shield = insideAny(L, x, y) || w5rock(L, S, x, y, 0); }
  }
  if (d < W5.BLAST && !shield) {
    const f = d <= W5.FULL ? 1 : (W5.BLAST - d) / (W5.BLAST - W5.FULL), ux = d > 1e-6 ? dx / d : 0, uy = d > 1e-6 ? dy / d : -1;

    const sp = Math.hypot(S.vx, S.vy);
    if (sp > T.MAXV) { S.vx *= T.MAXV / sp; S.vy *= T.MAXV / sp; }
    S.ev.push({ t: 'blasted', i, f });
  }
  for (let j = 0; j < L.plugs.length; j++) if (!(S.w5p >> j & 1) && w5rd(L.plugs[j], k.x, k.y) < W5.BLAST) { S.w5p |= 1 << j; S.ev.push({ t: 'plug', i: j }); }
  for (let j = 0; j < L.crumbles.length; j++) if (!(S.w5c >> j & 1) && w5rd(L.crumbles[j], k.x, k.y) < W5.BLAST) { S.w5c |= 1 << j; S.ev.push({ t: 'crumble', i: j, by: 'blast' }); }
  const ct = S.tick + Math.round(W5.CHAIN_T * T.HZ);
  for (let j = 0; j < L.kegs.length; j++) {
    const q = L.kegs[j];
    if (S.w5k >> j & 1 || Math.hypot(q.x - k.x, q.y - k.y) >= W5.CHAIN) continue;
    if (!S[q.f] || S[q.f] > ct) S[q.f] = ct;
  }
}
function w5push(S, p) {   // circle vs an axis-aligned sandstone slab: push out + bounce; true on contact
  const R = T.R, M = MAT.sand;
  const qx = S.x < p.x0 ? p.x0 : S.x > p.x1 ? p.x1 : S.x, qy = S.y < p.y0 ? p.y0 : S.y > p.y1 ? p.y1 : S.y;

    if (-vn > 110) S.ev.push({ t: 'hit', x: S.x - nx * R, y: S.y - ny * R, nx, ny, s: -vn, m: 'sand' });
  }

HOOKS.force.push((L, S) => {
  if (!L.w5) return;
  w5reset(L, S);
  if (S.cd !== W5CD || !L.kegs.length) return;   // only on the tick a shot fired: where does its shell go?
  const bx = Math.cos(S.ang), by = Math.sin(S.ang), rr = W5.KEG_R + 5;
  let best = -1, bt = W5.MUZZLE + W5.SHELL_V * W5.SHELL_LIFE;
  for (let i = 0; i < L.kegs.length; i++) {
    if (S.w5k >> i & 1) continue;
    const k = L.kegs[i], rx = k.x - S.x, ry = k.y - S.y, t = rx * bx + ry * by, p2 = rx * rx + ry * ry - t * t;
    if (t < 0 || p2 >= rr * rr) continue;
    const th = t - Math.sqrt(rr * rr - p2);
    if (th < bt) { bt = th; best = i; }
  }
  if (best < 0 || S[L.kegs[best].f]) return;    // nothing in line, or that keg is already going
  for (let s = W5.MUZZLE; s < bt; s += 8) { const x = S.x + bx * s, y = S.y + by * s; if (w5wall(L, x, y) || w5rock(L, S, x, y, 5)) return; }
  S[L.kegs[best].f] = S.tick + Math.max(1, Math.round((bt - W5.MUZZLE) / W5.SHELL_V * T.HZ));
  S.ev.push({ t: 'kegaim', i: best });
});
HOOKS.post.push((L, S) => {
  if (!L.w5) return;
  w5reset(L, S);
  for (let i = 0; i < L.kegs.length; i++) {      // fuses (a shell arriving, a chain), then touch
    if (S.w5k >> i & 1) continue;
    const k = L.kegs[i], f = S[k.f], rr = T.R + W5.KEG_R;
    if ((f && f <= S.tick) || (S.x - k.x) ** 2 + (S.y - k.y) ** 2 < rr * rr) w5blow(L, S, i, f && f <= S.tick ? 'fuse' : 'touch');
  }
  for (let i = 0; i < L.plugs.length; i++) if (!(S.w5p >> i & 1)) w5push(S, L.plugs[i]);
  const CR = Math.round(W5.CRUMBLE * T.HZ);

// ==== WORLD 6 SIM (stream w6) ====
// World 6 — The Storm Spire: climbing a lightning-wracked tesla tower at night. Level-def keys (on top of World 1's;
// `pools` draw as live coolant, `magnets` as induction clamps, cogs/springs keep the shared look):
//   gates: [x, y, deg, w, id]   warp gate: a mouth w wide centred on (x, y), FACING deg (the way you come out of it).
//                               Two gates with the same id are a pair (the first two with that id). Move INTO a mouth at
//                               ≥ GATE_MIN and you leave its twin's mouth at the same speed: velocity turned by the
//                               difference in the two facings (+180°), position mirrored across the width. Gates are not
//                               solids — hang them on a wall face (slower than GATE_MIN, the wall behind is just a wall).
//   arcs:  [x0, y0, x1, y1, period, on, phase]   tesla arc between two coils: live for `on` s of every `period` s
//                               (shifted by `phase` s), crackling for ARC_WARN s before it strikes. Live = it kills.
//   caps:  [x, y]               capacitor: fly through it uncharged and your NEXT shot kicks CHARGE× as hard. It can't
//                               recharge you for CAP_REARM s after a charged shot (so firing from inside one isn't a refill).
// Gates and the charged kick act in a HOOKS.force (before integration), arcs + caps in a HOOKS.post. Arcs run on S.tick like
// pours, so they need no state. State in S (primitives, so clone() copies it): w6q 1 = charged, w6z = tick of the last charged
// shot, w6d = deaths at the last reset (a respawn uncharges you). Like every hook, none of this runs while you're held at a
// respawn or stuck on a clamp.
// ARC_LEAD (render-only): the last ARC_LEAD s of the dark time, thin bolts creep out of both coils and meet as it strikes.
const W6 = { GATE_MIN: 60, GATE_W: 180, ARC_W: 7, ARC_WARN: 0.6, ARC_LEAD: 0.25, CAP_R: 26, CHARGE: 1.9, CAP_REARM: 0.35 };
WORLDS.push({ n: 6, name: 'The Storm Spire', ui: { accent: '#5aa9ff', glow: '#b8a4ff', ink: '#0a0f2a', tag: 'Climb the lightning tower' } });
const W6CD = Math.round(T.COOLDOWN * T.HZ);   // S.cd on the very tick a shot fired
HOOKS.build.push((L, def) => {
  if ((def.world || 1) !== 6) return;
  L.w6 = true;
  L.gates = (def.gates || []).map(([x, y, deg, w = W6.GATE_W, id = 0]) => {
    const a = deg * Math.PI / 180;
    return { x, y, w, id, nx: Math.round(Math.cos(a) * 1e6) / 1e6, ny: Math.round(Math.sin(a) * 1e6) / 1e6, p: -1 };
  });
  L.gates.forEach((g, i) => { if (g.p < 0) { const j = L.gates.findIndex((o, k) => k > i && o.id === g.id && o.p < 0); if (j > 0) { g.p = j; L.gates[j].p = i; } } });
  L.arcs = (def.arcs || []).map(([x0, y0, x1, y1, per = 4.5, on = 1.8, ph = 0]) =>
    ({ x0, y0, x1, y1, len2: (x1 - x0) ** 2 + (y1 - y0) ** 2 || 1, per: Math.round(per * T.HZ), on: Math.round(on * T.HZ), ph: Math.round(ph * T.HZ) }));
  L.caps = (def.caps || []).map(([x, y]) => ({ x, y }));
});
const w6arcT = (a, tick) => (tick + a.ph) % a.per;          // < a.on: live · ≥ per − ARC_WARN: charging up
const w6arcOn = (a, tick) => w6arcT(a, tick) < a.on;
function w6arcD(a, x, y) {   // distance from (x, y) to the arc's line
  const ex = a.x1 - a.x0, ey = a.y1 - a.y0; let t = ((x - a.x0) * ex + (y - a.y0) * ey) / a.len2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(x - a.x0 - ex * t, y - a.y0 - ey * t);
}
function w6reset(L, S) { if (S.w6d !== S.deaths) { S.w6d = S.deaths; S.w6q = 0; } }
HOOKS.force.push((L, S) => {
  if (!L.w6) return;
  w6reset(L, S);
  if (S.w6q && S.cd === W6CD) {                 // a charged shot: the step already kicked KICK, add the rest
    const bx = Math.cos(S.ang), by = Math.sin(S.ang), k = T.KICK * (W6.CHARGE - 1);
    S.vx -= bx * k; S.vy -= by * k;
    const sp = Math.hypot(S.vx, S.vy); if (sp > T.MAXV) { S.vx *= T.MAXV / sp; S.vy *= T.MAXV / sp; }
    S.w6q = 0; S.w6z = S.tick; S.ev.push({ t: 'zap', x: S.x, y: S.y, bx, by });
  }
  for (let i = 0; i < L.gates.length; i++) {
    const g = L.gates[i]; if (g.p < 0) continue;
    const rx = S.x - g.x, ry = S.y - g.y, a = rx * g.nx + ry * g.ny, vn = S.vx * g.nx + S.vy * g.ny;
    if (vn > -W6.GATE_MIN || a < -T.R * 0.5 || a > T.R + 4 - vn * DT) continue;
    const lat = ry * g.nx - rx * g.ny; if (Math.abs(lat) > g.w / 2) continue;
    const o = L.gates[g.p], vt = S.vy * g.nx - S.vx * g.ny, m = o.w / 2 - T.R, ol = -lat < -m ? -m : -lat > m ? m : -lat;
    const x0 = S.x, y0 = S.y;
    S.x = o.x + o.nx * (T.R + 4) - o.ny * ol; S.y = o.y + o.ny * (T.R + 4) + o.nx * ol;
    S.vx = -vn * o.nx + vt * o.ny; S.vy = -vn * o.ny - vt * o.nx;   // in = −n·vn + t·vt  →  out = n·(−vn) − t·vt
    S.ev.push({ t: 'gate', i, j: g.p, x0, y0, s: -vn });
    break;
  }
});
HOOKS.post.push((L, S) => {
  if (!L.w6) return;
  w6reset(L, S);
  for (let i = 0; i < L.arcs.length; i++) {
    const a = L.arcs[i]; if (!w6arcOn(a, S.tick)) continue;
    const d = w6arcD(a, S.x, S.y);
    if (d < T.R + W6.ARC_W) return die(L, S, 'arc');
    if (!S.nearT && d < T.R + W6.ARC_W + T.NEAR && S.vx * S.vx + S.vy * S.vy > 250000) { S.nearT = T.HZ; S.ev.push({ t: 'near' }); }
  }
  if (!S.w6q && !(S.tick - S.w6z < W6.CAP_REARM * T.HZ)) for (let i = 0; i < L.caps.length; i++) {
    const c = L.caps[i];
    if ((S.x - c.x) ** 2 + (S.y - c.y) ** 2 < (T.R + W6.CAP_R) ** 2) { S.w6q = 1; S.ev.push({ t: 'charge', i, x: c.x, y: c.y }); break; }
  }
});

// unit gradients, transformed into place (one allocation, not one per frame)
let w2G = null;
function w2Grads(c) {
  if (w2G) return w2G;
  return w2G = {
    glow: grad(c.createRadialGradient(0, 0, 0, 0, 0, 1), [[0, 'rgba(90,200,255,0.34)'], [0.4, 'rgba(60,160,240,0.12)'], [1, 'rgba(40,120,220,0)']]),
    lamp: grad(c.createRadialGradient(0, 0, 0, 0, 0, 1), [[0, 'rgba(255,200,120,0.5)'], [0.3, 'rgba(255,160,70,0.16)'], [1, 'rgba(255,130,50,0)']]),
    shaft: grad(c.createLinearGradient(0, 0, 0, 1), [[0, 'rgba(170,225,255,1)'], [1, 'rgba(120,190,255,0)']]),
    mist: grad(c.createLinearGradient(0, -0.5, 0, 0.5), [[0, 'rgba(110,165,210,0)'], [0.5, 'rgba(110,165,210,0.075)'], [1, 'rgba(110,165,210,0)']]),
    run: [[0, '#a7bccd'], [0.12, '#6d8498'], [0.55, '#3b4c5c'], [1, '#232e39']],

// ---- per-level prep: snow caps, frost drips, ice, spike-pit sprites, panes, mine silhouettes ----
function w2Prep(L) {
  const r2 = L.r2 = { ice: new Path2D(), iceBodies: [], iceTop: [], snow: [], drips: [], pits: [], mid: [] }, G = w2Grads(ctx);
  const rnd = rng(hash(L.name) ^ 0x2b2);
  for (const s of L.solids) {
    if (s.kind !== 'ice') continue;
    const p = s.p, n = p.length / 2, one = new Path2D();
    for (const path of [r2.ice, one]) {
      for (let k = 0; k < n; k++) { const i = s.sg > 0 ? k : n - 1 - k; k ? path.lineTo(p[2 * i], p[2 * i + 1]) : path.moveTo(p[2 * i], p[2 * i + 1]); }
      path.closePath();
    }
    // deep ice darkens: a gradient from the body's top down, so big blocks read as thick, not flat
    r2.iceBodies.push({ path: one, bb: s.bb, g: grad(ctx.createLinearGradient(0, s.bb[1], 0, Math.max(s.bb[1] + 60, s.bb[3])),
      [[0, 'rgba(230,250,255,0.10)'], [0.35, 'rgba(20,70,120,0.12)'], [1, 'rgba(4,20,45,0.6)']]) });
  }
  for (const g of L.segs) {
    if (g.m !== 'ice') continue;
    const len = Math.sqrt(g.len2);
    r2.iceTop.push({ g, len, top: g.ny < -0.3, ph: rnd() * 10, bb: [Math.min(g.ax, g.bx) - 20, Math.min(g.ay, g.by) - 20, Math.max(g.ax, g.bx) + 20, Math.max(g.ay, g.by) + 20] });
  }
  for (const u of L.r.runs) {
    const g = u.g, mx = (g.ax + g.bx) / 2, my = (g.ay + g.by) / 2, ux = (g.bx - g.ax) / u.len, uy = (g.by - g.ay) / u.len;
    u.g2 = grad(ctx.createLinearGradient(mx, my, mx - g.nx * BAND, my - g.ny * BAND), G.run);
    if (g.ny < -0.5) {                       // snow lying on an up-facing edge: a lumpy crust, mostly inside the plate
      const fill = new Path2D(), top = new Path2D(), n = Math.max(2, Math.ceil(u.len / 14)), pts = [];
      for (let k = 0; k <= n; k++) {
        const d = k / n * u.len, e = k === 0 || k === n ? 0 : 1.5 + rnd() * 3.5 + Math.sin(d * 0.05 + rnd()) * 1.2;
        pts.push([g.ax + ux * d + g.nx * e, g.ay + uy * d + g.ny * e]);
      }
      pts.forEach(([x, y], k) => { k ? fill.lineTo(x, y) : fill.moveTo(x, y); k ? top.lineTo(x, y) : top.moveTo(x, y); });
      for (let k = n; k >= 0; k--) { const d = k / n * u.len, e = 7 + rnd() * 4; fill.lineTo(g.ax + ux * d - g.nx * e, g.ay + uy * d - g.ny * e); }
      fill.closePath();
      r2.snow.push({ u, fill, top });
    } else if (g.ny > 0.5) {                 // short frost drips under ceilings — small and rounded, never spike-like
      const path = new Path2D();
      for (let d = 10 + rnd() * 30; d < u.len - 8; d += 22 + rnd() * 46) {
        const x = g.ax + ux * d, y = g.ay + uy * d, l = 5 + rnd() * 9, hw = 3 + rnd() * 2.5;
        path.moveTo(x - ux * hw, y - uy * hw); path.quadraticCurveTo(x + g.nx * l * 0.9, y + g.ny * l * 0.9, x + g.nx * l, y + g.ny * l);
        path.quadraticCurveTo(x + g.nx * l * 0.9, y + g.ny * l * 0.9, x + ux * hw, y + uy * hw); path.closePath();
      }
      r2.drips.push({ u, path });
    }
  }
  // ice-spike crevasses (the pools): a CPU-backed sprite each, so a GPU reset can't blank them
  const SP = 2;
  for (const s of L.pools) {
    const x = s.p[0], y = s.p[1] - T.POOL_SINK, w = s.p[2] - x, h = T.POOL_D + 6;
    const r = rng(hash(L.name) + Math.round(x));
    const img = tile(Math.ceil(w * SP), Math.ceil(h * SP), g => {
      g.scale(SP, SP);
      g.fillStyle = grad(g.createLinearGradient(0, 0, 0, h), [[0, '#0b2233'], [1, '#03080d']]); g.fillRect(0, 0, w, h);
      for (const row of [0, 1]) {
        for (let xx = -6 + r() * 10; xx < w + 6; xx += (row ? 15 : 11) + r() * 10) {
          const bw = (row ? 14 : 10) + r() * 12, tip = row ? 4 + r() * 12 : 10 + r() * 14, lean = (r() - 0.5) * 8, bx = xx;
          g.fillStyle = grad(g.createLinearGradient(0, h, 0, tip), row
            ? [[0, '#0b2e48'], [0.55, '#4fb8ea'], [1, '#e9fbff']] : [[0, '#06192a'], [1, '#2a6f99']]);
          g.beginPath(); g.moveTo(bx - bw / 2, h); g.lineTo(bx + lean, tip); g.lineTo(bx + bw / 2, h); g.fill();
          if (row) { g.fillStyle = 'rgba(235,252,255,0.35)'; g.beginPath(); g.moveTo(bx - bw / 2, h); g.lineTo(bx + lean, tip); g.lineTo(bx - bw * 0.1, h); g.fill(); }
        }
      }
    });
    r2.pits.push({ s, img, x, y, w, h });
  }
  // thin ice panes: a crack pattern each
  for (const p of L.thin) {
    const path = new Path2D(), w = p.x1 - p.x0, r = rng(hash(L.name) + Math.round(p.x0 + p.y0));
    for (let k = 0; k < Math.max(2, w / 70); k++) {
      let x = p.x0 + r() * w, y = p.y0 + 2 + r() * (W2.PANE_H - 4);
      path.moveTo(x, y);
      for (let j = 0; j < 4; j++) { x += 8 + r() * 18; y = p.y0 + 2 + r() * (W2.PANE_H - 4); path.lineTo(Math.min(p.x1 - 2, x), y); }
    }
    p.cracks = path; p.hitT = -9;
  }
  // mid-layer mine timbering, in mid-space (parallax 0.6). Towers run the full height of the shaft (past the view at
  // both ends), gallery beams join neighbouring towers, and every other prop stands on or hangs from those.
  const b = L.bounds, PM = 0.6, ya = b.y0 * PM - 1600, yb = b.y1 * PM + 1600, tw = r2.towers = [], gal = r2.gal = [];
  for (let x = b.x0 * PM - 1900 + rnd() * 300; x < b.x1 * PM + 1900;) {
    const t = { x, w: 150 + rnd() * 130, bay: 190 + rnd() * 80, y0: ya - rnd() * 300, br: [] };
    for (let y = t.y0; y < yb; y += t.bay) t.br.push(rnd());
    if (rnd() < 0.55) t.wheel = { k: 2 + Math.floor(rnd() * (t.br.length - 5)), r: 50 + rnd() * Math.min(60, t.w / 2 - 30), drop: 240 + rnd() * 260, ph: rnd() * TAU };
    tw.push(t); x += t.w + 380 + rnd() * 640;
  }
  for (let i = 0; i + 1 < tw.length; i++) {
    const x0 = tw[i].x + tw[i].w, x1 = tw[i + 1].x, span = x1 - x0;
    for (let y = ya + rnd() * 600; y < yb; y += 560 + rnd() * 760) {
      if (rnd() < 0.3) continue;
      const k = rnd(), g = { x0, x1, y, t: k < 0.3 ? 'lamps' : k < 0.55 ? 'cable' : k < 0.75 && span > 320 ? 'mach' : 'beam',
        ph: rnd(), m: rnd() < 0.5 ? 0 : 1, f: 0.3 + rnd() * 0.4, sag: 40 + rnd() * 60 };
      if (g.t !== 'cable') {                 // icicle fringe under the beam
        g.ice = new Path2D();
        for (let d = x0 + 8 + rnd() * 20; d < x1 - 8; d += 12 + rnd() * 26) {
          const l = 6 + rnd() * 22; g.ice.moveTo(d - 4, y + 22); g.ice.lineTo(d + (rnd() - 0.5) * 3, y + 22 + l); g.ice.lineTo(d + 4, y + 22);
        }
      }
      if (g.t === 'lamps') { const n = span > 520 ? 2 : 1; g.lamps = []; for (let j = 0; j < n; j++) g.lamps.push({ f: (j + 0.3 + rnd() * 0.4) / n, len: 60 + rnd() * 150, sw: rnd() * TAU }); }
      gal.push(g);
    }
  }
  // near: chains up to the rock for any plate / slab / cog / pane end that floats free, and lantern festoons strung
  // along long runs of bare ceiling. Found by probing the level's own solids; drawn behind the geometry.
  r2.chains = []; r2.fest = [];
  const roomOf = (x, y) => L.def.open.find(([ox, oy, ow, oh]) => ow >= 400 && oh >= 400 && x > ox && x < ox + ow && y > oy && y < oy + oh);
  const hangUp = (x, y) => {                 // a chain from (x, y) straight up, only if it meets rock inside the room
    const rm = roomOf(x, y - 6); if (!rm) return;
    let yy = y - 6; while (yy > rm[1] - 10 && !insideAny(L, x, yy)) yy -= 6;
    if (yy > rm[1] - 10 && y - yy > 40) r2.chains.push({ x, y0: yy - 4, y1: y, bb: [x - 12, yy - 4, x + 12, y + 4] });
  };
  for (const s of L.solids) {
    if (s.kind !== 'plate' && s.kind !== 'ice') continue;
    const [bx0, by0, bx1, by1] = s.bb, wd = bx1 - bx0;
    for (const side of wd < 140 ? [0.5] : [0.1, 0.9]) {
      const x = bx0 + wd * side;
      let top = by0 - 1; while (top < by1 && !inPoly(s.p, x, top)) top += 2;
      let bot = top; while (bot < by1 && inPoly(s.p, x, bot)) bot += 2;
      if (top >= by1 || insideAny(L, x, bot + 5)) continue;                       // resting on something below
      const ex = side < 0.5 ? bx0 - 5 : side > 0.5 ? bx1 + 5 : x;
      if (side !== 0.5 && insideAny(L, ex, (top + bot) / 2)) continue;           // that end is built into a wall
      hangUp(x, top);
    }
  }
  for (const s of L.cogs) {
    if ([[1, 0], [-1, 0], [0, 1]].some(([dx, dy]) => insideAny(L, s.cx + dx * (s.r + 8), s.cy + dy * (s.r + 8)))) continue;
    hangUp(s.cx, s.cy - s.r + 6);
  }
  for (const p of L.thin) {
    if (!insideAny(L, p.x0 - 5, p.y0 + 9)) hangUp(p.x0 + 8, p.y0);
    if (!insideAny(L, p.x1 + 5, p.y0 + 9)) hangUp(p.x1 - 8, p.y0);
  }
  for (const [ox, oy, ow, oh] of L.def.open) {
    if (ow < 700 || oh < 700) continue;
    let best = [0, 0], run = null;
    for (let x = ox + 30; x <= ox + ow - 30; x += 20) {
      if (insideAny(L, x, oy - 6) && !insideAny(L, x, oy + 40)) { run = run || [x, x]; run[1] = x; if (run[1] - run[0] > best[1] - best[0]) best = run.slice(); }
      else run = null;
    }
    const xa = best[0] + 20, xb = best[1] - 20, sag = 60 + rnd() * 70;
    if (xb - xa < 480) continue;
    const at = t => [xa + (xb - xa) * t, oy + 4 * sag * t * (1 - t)], pts = [];
    let clear = true;
    for (let t = 0.05; t < 1; t += 0.05) { const [x, y] = at(t); if (insideAny(L, x, y + 30)) clear = false; }
    if (!clear) continue;
    for (let t = 0.12 + rnd() * 0.1; t < 0.92; t += 120 / (xb - xa) + rnd() * 0.04) pts.push(...at(t), rnd() * TAU);
    r2.fest.push({ xa, xb, y: oy, sag, pts, bb: [xa, oy - 10, xb, oy + sag + 60] });
  }
}

// ---- far: glacier wall, crystal seams, crevasse light (parallax 0.25) ----
function w2Far(c, w, h) {
  const PF = 0.25, sf = sc * 0.6, fx0 = cam.x * PF - w / 2 / sf, fy0 = cam.y * PF - h / 2 / sf, fw = w / sf, fh = h / sf, G = w2Grads(c);
  c.setTransform(sf, 0, 0, sf, w / 2 - cam.x * PF * sf, h / 2 - cam.y * PF * sf);

// ---- mid: timber mine works, sheave wheels, lanterns, ore cables (parallax 0.6) ----
function w2Mid(c, w, h) {

    if (g.t === 'mach') { const s = w2Mach[g.m]; c.drawImage(s, g.x0 + (g.x1 - g.x0) * g.f - s.width / 2, g.y - s.height + 2); }
  }
  c.lineWidth = 9; c.strokeStyle = W2C.sil; c.stroke();

  for (const g of r2.gal) if (g.ice && !(g.x1 < mx0 || g.x0 > mx1 || g.y + 60 < my0 || g.y > my1)) c.fill(g.ice);
  c.fillStyle = W2C.silEdge;
  for (const g of r2.gal) if (g.t !== 'cable' && !(g.x1 < mx0 || g.x0 > mx1 || g.y < my0 || g.y > my1)) c.fillRect(g.x0 - 12, g.y, g.x1 - g.x0 + 24, 2);
  for (const t of r2.towers) if (!(t.x + t.w < mx0 || t.x > mx1)) { c.fillRect(t.x + 22, my0, 2, my1 - my0); c.fillRect(t.x + t.w - 2, my0, 2, my1 - my0); }
  c.fillStyle = W2C.sil;
  // sheaves + hoist ropes + cages

    c.lineWidth = 3; c.strokeStyle = W2C.sil;

    c.lineWidth = 14; c.beginPath(); c.arc(hx, hy, r, 0, TAU); c.stroke();
    c.lineWidth = 4; c.beginPath(); for (let k = 0; k < 6; k++) { const a = off / r + k / 6 * TAU; c.moveTo(hx, hy); c.lineTo(hx + Math.cos(a) * r, hy + Math.sin(a) * r); } c.stroke();

    c.lineWidth = 2; c.strokeStyle = W2C.silEdge; c.beginPath(); c.arc(hx, hy, r + 6, 0, TAU); c.stroke();
    c.strokeRect(hx + r - 26, cy, 52, 70);
    c.beginPath(); for (const dx of [-13, 0, 13]) { c.moveTo(hx + r + dx, cy + 8); c.lineTo(hx + r + dx, cy + 62); } c.stroke();

// ---- near: frost-rimed iron, snow caps, frost drips, blue ice ----
function w2Geometry(c) {

function w2GeoStatic(c) {   // baked by geoTiles: plates, bevels, rivets, snow, drips, blue ice (its glint + the rim light stay live)

// ---- objects: the Foundry's magnets/springs/cogs, then thin ice panes ----
function w2Objects(c) {
  drawObjects(c);
  for (let i = 0; i < L.thin.length; i++) {
    const p = L.thin[i];
    if ((S.ice | 0) >> i & 1 && S.iceD === S.deaths) continue;
    if (p.x1 < vx0 || p.x0 > vx1 || p.y1 < vy0 || p.y0 > vy1) continue;
    const w = p.x1 - p.x0, h = p.y1 - p.y0, hit = Math.max(0, 1 - (time - p.hitT) / 0.5);
    c.fillStyle = p.halo || (p.halo = grad(c.createLinearGradient(0, p.y0 - 40, 0, p.y0), [[0, 'rgba(120,200,255,0)'], [1, 'rgba(140,215,255,0.16)']]));
    c.fillRect(p.x0, p.y0 - 40, w, 40);
    c.fillStyle = p.g || (p.g = grad(c.createLinearGradient(0, p.y0, 0, p.y1), [[0, 'rgba(236,250,255,0.96)'], [0.3, 'rgba(165,220,248,0.82)'], [1, 'rgba(80,150,205,0.78)']]));
    c.fillRect(p.x0, p.y0, w, h);
    c.strokeStyle = 'rgba(30,80,120,0.55)'; c.lineWidth = 1.6; c.stroke(p.cracks);
    c.strokeStyle = `rgba(255,255,255,${0.45 + hit * 0.55})`; c.lineWidth = 0.8 + hit * 1.5; c.stroke(p.cracks);
    c.fillStyle = '#f7fdff'; c.fillRect(p.x0, p.y0, w, 3);
    c.fillStyle = 'rgba(15,45,75,0.7)'; c.fillRect(p.x0, p.y1 - 2.5, w, 2.5);
    // frosted brackets where the pane meets the rock
    c.fillStyle = '#dbe8f2'; c.fillRect(p.x0 - 4, p.y0 - 3, 14, h + 6); c.fillRect(p.x1 - 10, p.y0 - 3, 14, h + 6);
  }
}

// ---- crevasses of ice spikes (the pools) ----
function w2Pools(c) {
  for (const q of L.r2.pits) {
    if (!inView(q.s.bb)) continue;
    c.drawImage(q.img, q.x, q.y, q.w, q.h);
  }
}

// ---- glows: cold light off the spikes, the fuse's warm spark ----
function w2Glows(c) {

    c.fillRect(-1, -1, 2, 1); c.restore();
  }
  c.fillStyle = G.lamp;                                // festoon lamps: small warm pools along the ceilings
  for (const f of L.r2.fest) {
    if (!inView(f.bb)) continue;
    const p = f.pts;
    for (let i = 0; i < p.length; i += 3) {
      c.save(); c.translate(p[i], p[i + 1] + 21); c.scale(90, 90); c.globalAlpha = 0.55 + 0.15 * Math.sin(time * 6 + p[i + 2] * 5); c.fillRect(-1, -1, 2, 2); c.restore();
    }

    c.fillStyle = grad(c.createRadialGradient(x, y, 2, x, y, 150), [[0, `rgba(255,190,90,${0.38 * fl})`], [0.25, `rgba(255,140,50,${0.12 * fl})`], [1, 'rgba(255,100,30,0)']]);

// ---- front: snowfall, ice shards, glints (own particle list) ----
const w2P = [];
let w2S = null;
function w2Ambient(dt) {
  if (w2S !== S) { w2S = S; w2P.length = 0; }          // a restart/new level clears shards and snow
  const [vw, vh] = viewSize(cam.z), x0 = cam.x - vw * 0.65, y0 = cam.y - vh * 0.65, ww = vw * 1.3, hh = vh * 1.3;
  for (let n = dt * 70; n > 0; n--) {
    if (Math.random() > n || w2P.length > 420) break;
    const z = 0.5 + Math.random();
    w2P.push({ k: 's', x: x0 + Math.random() * ww, y: y0 + Math.random() * hh, vx: 0, vy: 30 + 50 * z, z, t: 0, life: 6 + Math.random() * 5, s: Math.random() * 9 });
  }
  for (let i = w2P.length - 1; i >= 0; i--) {

function w3Prep(L) {
  const r = L.r, R3 = L.r3 = { rope: new Path2D(), holes: [], mid: [] };
  for (const u of r.runs) {
    const g = u.g, mx = (g.ax + g.bx) / 2, my = (g.ay + g.by) / 2, e = BAND;
    u.grad = grad(ctx.createLinearGradient(mx, my, mx - g.nx * e, my - g.ny * e),
      [[0, '#9a6a3e'], [0.14, '#6e4828'], [0.55, '#3c2616'], [1, '#22150c']]);
    u.rim = clamp((g.nx * W3SUN[0] + g.ny * W3SUN[1]) * 1.4 - 0.3, 0, 1) * 0.75;
    if (g.ny < -0.6 && u.len > 50) { R3.rope.moveTo(g.ax - g.nx * 9, g.ay - g.ny * 9); R3.rope.lineTo(g.bx - g.nx * 9, g.by - g.ny * 9); }
    // portholes in the hull under decks and above deckheads
    if (Math.abs(g.ny) > 0.9 && u.len > 300) {
      const ux = (g.bx - g.ax) / u.len, uy = (g.by - g.ay) / u.len;
      for (let d = 130; d < u.len - 110; d += 250) {
        const hx = g.ax + ux * d - g.nx * 95, hy = g.ay + uy * d - g.ny * 95;
        if (!KB_SIM.insideAny(L, hx, hy)) continue;
        const cell = cellAt(L, hx, hy);
        if (!cell || cell.some(q => { const ex = q.bx - q.ax, ey = q.by - q.ay, t = clamp(((hx - q.ax) * ex + (hy - q.ay) * ey) / q.len2, 0, 1); return (hx - q.ax - ex * t) ** 2 + (hy - q.ay - ey * t) ** 2 < 46 * 46; })) continue;
        R3.holes.push(hx, hy);
      }
    }
  }
  // buoys clear of the sea hang on a rope from whatever is above them
  for (const s of L.bumpers) {
    const wet = L.pools.some(p => s.cx > p.bb[0] && s.cx < p.bb[2] && p.bb[1] < s.cy + s.r + 40);
    let y = s.cy - s.r;
    if (!wet) while (y > s.cy - 3000 && !KB_SIM.insideAny(L, s.cx, y)) y -= 10;
    s.rope = wet ? null : y;

  // enough that you are in their rigging at the top of the level
  const rnd = rng(hash(L.name) ^ 0x5eed), b = L.bounds, PM = 0.6, Mb = clamp(0.6 * (b.y1 - b.y0) + 420, 1150, 2400);
  R3.ym = b.y1 * PM + 100;
  for (let x = b.x0 * PM - 1400; x < b.x1 * PM + 1400;) {
    const M = Mb * (0.82 + rnd() * 0.2), Ls = M * (0.62 + rnd() * 0.14);
    x += Ls * 0.56;
    R3.mid.push({ x, L: Ls, M, ph: rnd() * TAU, o: w3ShipBuild({ L: Ls, M, masts: rnd() < 0.7 ? 3 : 2, furl: rnd() < 0.5, seed: (rnd() * 1e9) | 0 }) });
    x += Ls * 0.8 + 250 + rnd() * 600;
  }
}

function w3Far(c, w, h) {

  c.beginPath(); c.arc(sx, hy, sr, Math.PI, 0); c.fill();

  const cs = h / 900, cl = w3pat.cloud, cw = cl.width;

    const s = cs * z, tw = cw * s, th_ = cl.height * s, y = hy + h * yo - (cam.y - b.y1) * sc * par * 0.5;
    let x0 = -(((cam.x - b.x0) * sc * par - time * drift * cs) % tw + tw) % tw;

    c.globalAlpha = al;

    for (let k = 0; k < 46; k++) {

function w3Mid(c, w, h) {
  const PM = 0.6, sm = sc * 0.92, mx0 = cam.x * PM - w / 2 / sm, my0 = cam.y * PM - h / 2 / sm, mx1 = mx0 + w / sm, my1 = my0 + h / sm;

    const lp = s.o.lamps;

// does a point sit in some field (zone / bubble / planet field)? → 'z' | 'b' | 'p' | ''
function w4fieldAt(L_, x, y) {
  for (const b of L_.bubbles) if ((x - b.x) ** 2 + (y - b.y) ** 2 < b.r2) return 'b';
  for (const p of L_.planets) if ((x - p.cx) ** 2 + (y - p.cy) ** 2 < p.f2) return p.sun ? 's' : 'p';
  for (const z of L_.zones) if (x > z.x0 && x < z.x1 && y > z.y0 && y < z.y1) return 'z';
  return '';

function w4Prep(L_) {

  L_.planets.forEach((p, i) => { p.style = (hash(L_.name) + i * 7) % 3; });
  const warm = L_.sparks.map(s => s.bb).concat(L_.pools.map(s => s.bb), L_.planets.filter(p => p.sun).map(p => [p.cx - p.r, p.cy - p.r, p.cx + p.r, p.cy + p.r]));

    u.grad = grad(ctx.createLinearGradient(mx, my, mx - g.nx * BAND, my - g.ny * BAND),
      [[0, '#c7ab66'], [0.1, '#47528a'], [0.5, '#242c58'], [1, '#141834']]);
    if (u.len > 70) { R4.inlay.moveTo(g.ax + ux * 6 - g.nx * 11, g.ay + uy * 6 - g.ny * 11); R4.inlay.lineTo(g.bx - ux * 6 - g.nx * 11, g.by - uy * 6 - g.ny * 11); }
    // cool rim where the open side is inside a field; warm rim facing starfire / suns

    for (const d of [0.2, 0.5, 0.8]) {
      const f = w4fieldAt(L_, g.ax + (g.bx - g.ax) * d + g.nx * 50, g.ay + (g.by - g.ay) * d + g.ny * 50);
      if (f && f !== 's') cool += 1 / 3;
    }
    let rim = 0;
    for (const [hx0, hy0, hx1, hy1] of warm) {

      rim = Math.max(rim, clamp(1 - d / 480, 0, 1) * clamp(((dx * g.nx + dy * g.ny) / d) * 1.5 + (d < 40 ? 1 : 0), 0, 1));
    }

  }
  // starfire strips: which long face(s) are open
  for (const s of L_.sparks) {
    const [x0, y0, x1, y1] = s.bb, hz = x1 - x0 >= y1 - y0, faces = [];
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    for (const sg of [-1, 1]) {
      const nx = hz ? 0 : sg, ny = hz ? sg : 0, fx_ = hz ? cx : sg < 0 ? x0 : x1, fy_ = hz ? (sg < 0 ? y0 : y1) : cy;
      if (!KB_SIM.insideAny(L_, fx_ + nx * 6, fy_ + ny * 6)) faces.push({ nx, ny, x: fx_, y: fy_ });
    }
    R4.strips.push({ s, x0, y0, x1, y1, hz, faces, len: hz ? x1 - x0 : y1 - y0 });
  }
  for (const s of L_.pools) R4.strips.push({ s, x0: s.p[0], y0: s.p[1], x1: s.p[2], y1: s.p[5], hz: true, pool: true, faces: [{ nx: 0, ny: -1, x: (s.p[0] + s.p[2]) / 2, y: s.p[1] }], len: s.p[2] - s.p[0] });

  // any free-standing block big enough to carry one
  R4.medals = [];
  {
    const b = L_.bounds, rm = rng(hash(L_.name) ^ 0x5a1), spots = [];
    for (const d of L_.def.solids || []) { const p = d.p, hw = Math.min(p[2] - p[0], p[5] - p[1]) / 2; if (hw >= 170) spots.push([(p[0] + p[2]) / 2, (p[1] + p[5]) / 2, Math.min(1.2, (hw - 35) / 150)]); }
    for (let y = b.y0 - 200; y < b.y1 + 200; y += 1000) for (let x = b.x0 - 200; x < b.x1 + 200; x += 1000) if (rm() < 0.6) spots.push([x + rm() * 420, y + rm() * 420, 0]);
    for (const [px, py, blk] of spots) {
      const v = rm() < 0.5 ? 0 : 1, s = blk || 0.75 + rm() * 0.4, pad = blk ? 30 : 80;
      if (!KB_SIM.insideAny(L_, px, py) || L_.planets.some(p => Math.hypot(px - p.cx, py - p.cy) < p.r + 200)) continue;
      if (R4.medals.some(m => Math.hypot(m.x - px, m.y - py) < 500)) continue;
      if (L_.segs.some(g => { const ex = g.bx - g.ax, ey = g.by - g.ay, t = clamp(((px - g.ax) * ex + (py - g.ay) * ey) / g.len2, 0, 1); return Math.hypot(px - g.ax - ex * t, py - g.ay - ey * t) < 150 * s + pad; })) continue;

  // hangs from the girder above it on a drop rod (bevel gear at the top, hub gear at the bottom), its arms run out
  // along the orbit plane and a post carries each planet. Nothing floats.
  const rnd = rng(hash(L_.name) ^ 0x0e4), b = L_.bounds, PM = 0.6;
  R4.beams = [];

      c.moveTo(p.x - r, p.y); c.lineTo(p.x - w, p.y - w); c.lineTo(p.x, p.y - r); c.lineTo(p.x + w, p.y - w); c.lineTo(p.x + r, p.y); c.lineTo(p.x + w, p.y + w); c.lineTo(p.x, p.y + r); c.lineTo(p.x - w, p.y + w); c.fill();
    } else if (p.k === 'bolt') {   // re-jagged every frame, now and then dropping out: it crackles
      const a = (1 - u) * (Math.random() < 0.15 ? 0.3 : 1), dx = p.x - p.x0, dy = p.y - p.y0, n = Math.hypot(dx, dy) || 1, nx = -dy / n, ny = dx / n;
      c.beginPath(); c.moveTo(p.x0, p.y0);

      if (!TR.aur) TR.aur = [['120,255,190', '150,120,255'], ['170,130,255', '110,240,210']].map(([a, b]) => {   // a GPU copy of a CPU tile
        const src = tile(24, 96, (g, w, h) => {
          g.fillStyle = grad(g.createLinearGradient(0, h, 0, 0), [[0, `rgba(${a},0.95)`], [0.4, `rgba(${a},0.4)`], [0.8, `rgba(${b},0.2)`], [1, `rgba(${b},0)`]]); g.fillRect(0, 0, w, h);
          g.globalCompositeOperation = 'destination-in'; g.fillStyle = grad(g.createLinearGradient(0, 0, w, 0), [[0, 'rgba(0,0,0,0)'], [0.5, 'rgba(0,0,0,1)'], [1, 'rgba(0,0,0,0)']]); g.fillRect(0, 0, w, h);
        }), cp = document.createElement('canvas');

    }
  }
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

// ---- the shop screen (#shop): a row of skins, a row of trails, the focused item's card underneath ----
const SKIN_DEF = { id: '', name: 'Cast Iron', desc: 'The original. Grumpy, dependable.' };
const TRAIL_DEF = { id: '', name: 'Gun Smoke', desc: 'Plain powder smoke. Honest work.' };
function coinsBanked() { let n = 0; for (const d of LEVELS) n += bits3((save.best[d.name] || {}).stamps | 0); return n; }
function wallet() { return Math.max(0, coinsBanked() - SHOP.reduce((n, it) => n + (save.shop.own.includes(it.id) ? it.price : 0), 0)); }
function openShop() { mode = 'shop'; uiShop(); show('shop'); }
function uiShop() {
  const w = wallet(), sh = save.shop;
  byId('shWallet').innerHTML = `<span><i class="coin"></i>&nbsp; Coins<b>${w}</b></span><span>Found<b>${coinsBanked()}/${LEVELS.length * 3}</b></span>`;
  for (const slot of ['skin', 'trail']) {
    const items = [slot === 'skin' ? SKIN_DEF : TRAIL_DEF, ...SHOP.filter(it => it.slot === slot)], row = byId(slot === 'skin' ? 'shSkin' : 'shTrail');
    row.innerHTML = items.map(it => {
      const own = !it.id || sh.own.includes(it.id), eq = (sh[slot] || '') === it.id, wu = it.world && wui(it.world);
      return `<button class="sc pl${eq ? ' eq' : own ? ' own' : w < it.price ? ' poor' : ''}" data-act="cos" data-slot="${slot}" data-id="${it.id}"${wu ? ` style="--wa:${wu.accent};--wg:${wu.glow}"` : ''}>` +
        `<canvas width="200" height="200"></canvas><span class="nm">${it.name}</span>` +
        `<span class="pr">${eq ? 'Equipped' : own ? 'Owned' : `<i></i>${it.price}`}</span></button>`;
    }).join('');
    row.querySelectorAll('canvas').forEach((e, k) => shopIcon(e, slot, items[k].id));
  }
  shopInfo(document.activeElement);
}
function shopItem(slot, id) { return id ? SHOP.find(x => x.id === id) : slot === 'skin' ? SKIN_DEF : TRAIL_DEF; }
function shopInfo(b) {
  const box = byId('shInfo');
  if (!b || !b.dataset || b.dataset.act !== 'cos') { box.innerHTML = `<b>Spend your coins</b><span>Every level hides three. They bank when you finish the level, and buying everything takes every coin in the game.</span>`; return; }
  const slot = b.dataset.slot, id = b.dataset.id, it = shopItem(slot, id), w = wallet();
  const act = (save.shop[slot] || '') === id ? 'Equipped' : !id || save.shop.own.includes(id) ? 'Select to equip' : w >= it.price ? `Buy for ${it.price}` : `${it.price - w} more coins needed`;
  box.innerHTML = `<b>${it.name}<em>${act}</em></b><span>${it.desc}</span>`;
}
byId('shop').addEventListener('focusin', e => shopInfo(e.target));
byId('shop').addEventListener('mouseover', e => { const b = e.target.closest('.sc'); if (b) shopInfo(b); });
function shopPick(b) {   // buy (if it's affordable) and equip; the default cards just equip
  const slot = b.dataset.slot, id = b.dataset.id, it = shopItem(slot, id), sh = save.shop;
  if (id && !sh.own.includes(id)) {
    if (wallet() < it.price) { sfx.deny(); b.classList.remove('kick'); void b.offsetWidth; b.classList.add('kick'); return; }
    sh.own.push(id); sfx.buy();
  }
  sh[slot] = id || null; persist();
  uiShop();
  const f = byId('shop').querySelector(`[data-slot="${slot}"][data-id="${id}"]`); if (f) { f.focus(); shopInfo(f); }
}
function shopIcon(e, slot, id) {   // a card's picture: the bomb in that skin, or a small bomb leaving that trail
  const g = e.getContext('2d'), s = e.width / 100, R = Math.random;
  g.setTransform(s, 0, 0, s, 0, 0);
  const pose = { ang: -0.6, tl: 0, sq: 0, sqa: 0, lx: 0.25, ly: 0.15, blink: 0, recoil: 0 };
  if (slot === 'skin') { g.translate(46, 58); g.scale(1.2, 1.2); paintBomb(g, id || 'iron', pose); return; }
  g.save(); g.translate(64, 36);
  const pts = []; for (let k = 0; k < 12; k++) pts.push([-10 - k * 4.4, 12 + k * 3.6 + Math.sin(k * 1.3) * 2]);
  const dot = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); };
  if (!id) pts.forEach(([x, y], k) => dot(x, y, 3 + k * 0.7, `rgba(110,104,96,${0.75 - k * 0.05})`));
  else if (id === 'sparks') pts.forEach(([x, y], k) => { for (let j = 0; j < 2; j++) dot(x + (R() - 0.5) * 10, y + (R() - 0.5) * 10 + j * 3, 1.3 + R(), ['#fff6d0', '#ffd36b', '#ff9a3c'][(k + j) % 3]); });
  else if (id === 'aurora') { g.globalCompositeOperation = 'lighter'; pts.forEach(([x, y], k) => { g.fillStyle = grad(g.createLinearGradient(0, y, 0, y - 34), [[0, k % 2 ? 'rgba(170,130,255,0.7)' : 'rgba(120,255,190,0.7)'], [1, 'rgba(120,160,255,0)']]); g.fillRect(x - 3, y - 34, 6, 34); }); g.globalCompositeOperation = 'source-over'; }
  else if (id === 'spray') pts.forEach(([x, y], k) => { if (k % 3 === 1) dot(x, y, 4 + k * 0.4, 'rgba(230,246,255,0.35)'); dot(x + (R() - 0.5) * 12, y - R() * 8, 1.4 + R(), R() < 0.5 ? '#ebfaff' : '#8cd2f0'); });
  else if (id === 'stars') { g.globalCompositeOperation = 'lighter'; pts.forEach(([x, y], k) => { if (k % 2) return; const r = 6 - k * 0.3, w = r * 0.2; g.fillStyle = ['#ffffff', '#d6c8ff', '#a0c4ff'][k % 3]; g.beginPath(); g.moveTo(x - r, y); g.lineTo(x - w, y - w); g.lineTo(x, y - r); g.lineTo(x + w, y - w); g.lineTo(x + r, y); g.lineTo(x + w, y + w); g.lineTo(x, y + r); g.lineTo(x - w, y + w); g.fill(); }); g.globalCompositeOperation = 'source-over'; }
  else if (id === 'dust') pts.forEach(([x, y], k) => { dot(x, y, 4 + k * 0.8, `rgba(206,168,116,${0.5 - k * 0.03})`); if (k % 2) dot(x + (R() - 0.5) * 10, y + 6, 1.4, '#6e5032'); });
  else if (id === 'bolt') {
    g.globalCompositeOperation = 'lighter'; g.lineJoin = 'round';
    for (const [lw, col] of [[6, 'rgba(110,160,255,0.5)'], [2, '#eef6ff']]) { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); pts.forEach(([x, y], k) => g.lineTo(x + (k % 2 ? 5 : -5), y + (k % 2 ? -4 : 4))); g.stroke(); }
    g.globalCompositeOperation = 'source-over';
  }
  g.scale(0.85, 0.85); pose.ang = 2.5; paintBomb(g, save.shop.skin || 'iron', pose);
  g.restore();
}
// ==== /COINS + SHOP ====

attract(0);
show('title');
requestAnimationFrame(t => { last = t; frame(t); });

window.KICKBACK = {
  get L() { return L; }, get S() { return S; }, get mode() { return mode; }, get cam() { return cam; },
  startLevel, restart, render, tick, getLevel, sim: window.KB_SIM,
  BRAKE, save, fire() { press = true; }, openOptions, back, toTitle() { mode = 'title'; show('title'); },   // work/focus/aim.mjs
  CO, TR, openShop,   // COINS + SHOP (work/wave3/ui/harness/shop.mjs)
  play(i, fires) { startLevel(i); demo = fires.slice(); },
  stepN(n, fireTicks = []) { for (let i = 0; i < n; i++) { step(L, S, fireTicks.includes(S.tick + 1)); handleEvents(); } },
};
})();
